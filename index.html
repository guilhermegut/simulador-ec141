a fixar em lei ou decreto e sem servir, por si só, a pedidos de equiparação (item III); apelos ao legislador sobre regimes diferenciados e microempresas e empresas de pequeno porte, em 180 dias (itens V e VI). A Lei Complementar 238/2026, citada na decisão, trata do limite do MEI e não muda o cálculo","alternativa":"—","origem":"pedido","regras":["R10","R13"],"situacao":"adotado em 12/11/2026"},{"id":"D105","tema":"Mudar horários no resultado","padrao":"Na escala semanal da opção escolhida, nas duas etapas (transição até 42 h e definitiva de 40 h), o usuário muda entrada, saída e intervalo de cada dia da semana, para todas as pessoas ou para uma só, e troca trabalho e folga clicando nos dias. O motor confere na hora (etapa de 42 h a partir de 04/01/2027; de 40 h a partir de 10/01/2028), com as normas do cenário e as que o usuário marcou como firmadas, e mostra o que falta (por exemplo, a norma do art. 7º para dias acima de 8h24) e a dica da liminar quando cabe. O intervalo fica onde está ou, se não couber, no meio do turno. A escala editada de cada etapa segue para o calendário (a de 42 h até 12/12/2027, a de 40 h a partir de 13/12/2027), para o PDF e para o Excel; a agenda (.ics) continua com a etapa de 40 h. Custos e ranking não mudam com a edição","alternativa":"Edição só de folgas na etapa de 40 h, como antes","origem":"pedido","regras":[],"situacao":"adotado em 12/11/2026"},{"id":"D106","tema":"Escala 4x2 nos cenários","padrao":"Para turno aberto nos sete dias e com o mesmo horário em todos eles, o planejador testa a 4x2 (quatro dias de trabalho e duas folgas, em ciclo de 6 dias que gira pela semana), que dá dois repousos em qualquer semana e no máximo 4 dias seguidos sem norma coletiva. Três versões: dias de até 8 h nas duas etapas; dias de até 8h24 até dez/2027 e de 8 h depois (semana de 5 dias pela liminar na ADI 8.041 e semana de 4 dias com acordo individual de compensação); e dias de 8h24 também depois de 2027, com norma coletiva de compensação pela média (D108). O quadro sai da cobertura dia a dia com os deslocamentos do ciclo (cerca de 1,5 pessoa por posto, contra 1,4 no 5x2). A 5x1 informada como escala de hoje aparece entre as descartadas, com o motivo","alternativa":"—","origem":"pedido","regras":["R1","R3","J1"],"situacao":"adotado em 17/11/2026"},{"id":"D107","tema":"Cadastro: dias de funcionamento, escala de hoje e turnos","padrao":"Em cada cargo, à vista: escala de trabalho de hoje (6x1, 5x2, 5x1, 6x2, 4x2, 4x3, 12x36, tempo parcial e personalizada), dias de funcionamento com atalhos (seg a sex, seg a sáb, todos os dias) e turnos. As escalas em ciclo (12x36, 6x2, 5x1 e 4x2) giram pela semana e travam os sete dias. No modo simplificado, cada cargo vira um cartão com até 3 turnos, cada um com entrada, saída e pessoas, para cadastrar operação de 24 h; os dias de cada pessoa ficam num bloco opcional","alternativa":"Turnos só no modo completo","origem":"pedido","regras":[],"situacao":"adotado em 17/11/2026; escolha do usuário"},{"id":"D108","tema":"Compensação pela média em norma coletiva (semanas de até 42 h)","padrao":"A partir de 16/12/2027, a semana acima do teto (até 42 h) com dias acima de 8 h só fecha com convenção ou acordo coletivo específico de compensação pela média; sem ele, o excedente é hora extra. Com a norma, o motor confere a média semanal no ciclo da escala (janelas de ciclos completos: o mínimo múltiplo comum entre o ciclo e 7 dias, 6 semanas na 4x2), que deve ficar no teto, e a média de dois repousos por semana no mês-calendário. Com essa norma, o saldo do mês da compensação individual (J4) não se aplica. Na 4x2 de 8h24, a média do ciclo é de 39h12","alternativa":"Aceitar com acordo individual de compensação no mês; janelas de 4 semanas; média de até 42 h","origem":"pedido","regras":["J1","J3","J4"],"situacao":"a validar; norma coletiva específica e média no ciclo da escala escolhidas pelo usuário em 17/11/2026; em 24/11/2026 (D119), a média passou a ser apurada no mês-calendário (Portaria MTE 2.041/2026, art. 3º), e os repousos ficaram só com R1 e R2; segue como leitura do escritório o limite de 42 h por semana com a norma"},{"id":"D109","tema":"Média de repousos por norma coletiva também no mês-calendário","padrao":"Em toda média de repousos por norma coletiva, além das janelas de 28 dias (D102), o motor confere a média de dois repousos por semana no mês-calendário pelo critério adotado (A). Com isso, o revezamento 4x3 e 6x1 puro volta a falhar nos meses de 30 e 31 dias também com a liminar, e o preâmbulo de 5x2 até 03/01/2027 volta a valer; quem sairia do 5x2 com janela curta ganha uma ou duas folgas na última semana do preâmbulo, em dias com gente sobrando; sem esse arranjo, o cenário aparece com a falha","alternativa":"Só nas janelas de 28 dias; só no mês","origem":"pedido","regras":["R2"],"situacao":"adotado em 17/11/2026; substitui em parte a D102; em 24/11/2026 (D119), o mês-calendário passou a ser a única apuração, sem as janelas de 28 dias"},{"id":"D110","tema":"Ranking: primeiro sem contratar","padrao":"O critério padrão do ranking passa a ser “Primeiro sem contratar”: opções que cumprem sem contratar vêm antes, pelas horas de trabalho mantidas e depois pelo custo; as que dependem de acordo ou de horas extras vêm em seguida; depois as que contratam. Os demais critérios (segurança jurídica, menor custo e manter a operação) seguem disponíveis","alternativa":"Segurança jurídica como padrão (D93)","origem":"pedido","regras":[],"situacao":"adotado em 17/11/2026; substitui o padrão da D93; substituído pela D112 em 18/11/2026 (sem ranking)"},{"id":"D111","tema":"Ver qualquer escala testada","padrao":"Na lista de escalas testadas, cada uma tem o botão “Ver esta escala”, que a leva para a escala semanal (com a edição de horários) e para o calendário, com aviso e botão para voltar. O ranking, os custos, o PDF e o Excel seguem a opção escolhida","alternativa":"—","origem":"pedido","regras":[],"situacao":"adotado em 17/11/2026; o botão passou a “Testar e ajustar” na D112 (18/11/2026)"},{"id":"D112","tema":"Resultado expositivo, sem ranking nem sugestão de escala","padrao":"O resultado deixa de classificar ou indicar opções: saem o ranking, os critérios (segurança jurídica, menor custo, sem contratar, manter a operação), o pódio, os caminhos e a opção recomendada. Cada função mostra a escala de hoje como referência e todas as escalas montadas pelo planejador, agrupadas por tipo (5x2, 4x2, 4x3, revezamento 4x3 e 6x1, 6x2, 12x36) numa ordem fixa que não depende de custo, contratações nem situação, com pessoas, situação em cada etapa (adere, adere com acordo ou norma, depende de norma coletiva, não adere), o que exige, funcionamento, horas de trabalho e folha a partir de 16/12/2027. Horas extras e diárias de freelancer aparecem como informação no detalhe da opção. O planejador passa a montar o 5x2 escalonado sempre que a jornada passa de 8 h, mesmo quando o 4x3 também mantém o horário. Qualquer escala, inclusive a de hoje (padrão), pode ser aberta em “Teste e ajuste”: trocar trabalho e folga, mudar horários, incluir e retirar pessoas e ligar ou desligar acordos e normas coletivas, com a conferência do motor na hora; escalas em ciclo (4x2, 6x2, 5x1) podem ser ajustadas quando a grade fecha ciclos inteiros (a de hoje passa a ter as semanas necessárias; a 6x2, oito semanas); a 12x36 não. O calendário, o faturamento, a agenda, o PDF e o Excel seguem as escalas em teste; o PDF e o Excel trazem todas as opções lado a lado e todas as escalas ajustadas, com a conferência. A folha não é recalculada para a escala ajustada; a tabela de horista ou mensalista passa a trazer todas as opções","alternativa":"Manter o ranking com critério escolhido pelo usuário (D93, D110)","origem":"pedido","regras":[],"situacao":"adotado em 18/11/2026"},{"id":"D113","tema":"Revezamento entre turnos, atividade insalubre, necessidade por dia e grau de certeza","padrao":"Por função, o cadastro pergunta se a atividade é insalubre e, com dois turnos ou mais, se as pessoas giram entre eles. Equipe que gira entre turnos com horário noturno segue o art. 7º, XIV, da CF: até 6 h adere; até 8 h só com norma coletiva de turno ininterrupto (Súmula 423); acima de 8 h não adere, inclusive as 8h24 da liminar (OJ 360 para dois turnos). Em atividade insalubre, todo dia acima de 8 h, inclusive as 8h24 da liminar, depende de licença prévia da autoridade (CLT, art. 60; Súmula 85, VI) ou de norma coletiva que a dispense (CLT, art. 611-A, XIII, e 611-B, parágrafo único); a 12x36 fica de fora (art. 60, parágrafo único) — nova regra J7. A necessidade de pessoas por dia pode ser informada por turno; em branco, vale a cobertura de hoje. Cada etapa traz o grau de certeza (lei e súmulas, liminar do STF ou leitura a validar) e os fundamentos; o \"não adere\" fica firme pela lei quando ao menos uma regra que falha não depende de leitura. A conferência do teste repete a grade até 8 semanas quando ela fecha ciclos inteiros; em rodízio mais longo que a grade, confere só as semanas exibidas e avisa. A folha da escala ajustada é recalculada pelo motor. Sem resposta sobre feriados, o calendário marca o feriado trabalhado para conferir a autorização","alternativa":"Insalubre: só a compensação dependeria de licença, e não as 8h24 da liminar; norma coletiva não dispensaria a licença (Súmula 85, VI). Revezamento: só alertar, sem mudar a conferência","origem":"pedido","regras":["R8","J7"],"situacao":"adotado em 18/11/2026, com as leituras escolhidas pelo usuário; a validar: art. 60 alcançando as 8h24 da liminar, norma coletiva dispensando a licença (art. 611-A, XIII) e a 12x36 com revezamento entre dia e noite caindo na regra de acima de 8 h; em 24/11/2026 (D119), a norma coletiva que autorize expressamente a prorrogação e a autorização da chefia de segurança e saúde no trabalho da Inspeção do Trabalho passaram a vir da Portaria MTE 2.041/2026, art. 15, II e III, e a 12x36 do inciso I; segue a validar só o art. 60 alcançando as 8h24 da liminar"},{"id":"D114","tema":"Conferência rápida, arquivo de simulação, versões, filtros, comparação e aviso de mudanças","padrao":"Entrada \"Conferir uma escala\" sem cadastro: a semana (ou ciclo de até 4 semanas) de uma pessoa, com atividade, situação e acordos, conferida nas duas etapas, com PDF. Resultado com resumo factual por função (contagens), filtros escolhidos pelo usuário que cortam a lista sem mudar a ordem, comparação de até três escalas na ordem de escolha, frase simples antes da citação e glossário. Arquivo da simulação (.json) para salvar, reabrir e enviar, e versões nomeadas no navegador. No alto do resultado, a base normativa datada, o aviso de ferramenta de planejamento e o que mudou no cálculo; ao reabrir uma simulação de versão anterior, o aviso lista as mudanças","alternativa":"—","origem":"pedido","regras":[],"situacao":"adotado em 18/11/2026"},{"id":"D115","tema":"Situação da liminar na ADI 8.041 em 17/11/2026","padrao":"A liminar segue aplicada. O referendo no plenário virtual (13/11/2026) foi interrompido por pedido de destaque do Min. Luiz Fux, e em 17/11/2026 o relator converteu o rito para o julgamento definitivo de mérito no plenário presencial (Lei 9.868/1999, art. 12), mantidas as medidas cautelares até lá. Os textos deixam de dizer que a decisão vai a referendo e passam a dizer que vale até o julgamento de mérito","alternativa":"—","origem":"fonte (ConJur, 17/11/2026; TAGD Advogados, 17/11/2026)","regras":["J1","R2"],"situacao":"adotado em 18/11/2026"},{"id":"D116","tema":"Versão 4: uma tela, uma equipe, a pergunta do RH primeiro","padrao":"O RH responde seis perguntas (setor, pessoas, escala de hoje, dias de funcionamento, horário e salário médio) de uma equipe por vez; os demais dados ficam em refinamentos opcionais fechados. O resultado começa pela pergunta: dá para se adaptar sem aumentar o custo, sem mudar os dias de funcionamento e com as mesmas pessoas por dia de hoje? Sim quando há escala que mantém os três e adere nas duas etapas sem negociar e sem mudar o horário; sim, com condições, quando a escala depende de acordo individual, de norma coletiva, da liminar, de leitura a validar ou encurta o expediente (cada condição dita); não, com a conta das presenças por semana que faltam. Depois, todos os cenários em ordem fixa, agrupados pelo que mantêm e mudam (custo, dias, pessoas por dia), cada um com o que a empresa precisa fazer para avançar; em cada um, os fundamentos, a escala pessoa por pessoa e o teste de ajustes. No planejador, dias sem expediente recebem a folga de todos antes de espalhar as demais, quando cabem nas folgas de cada pessoa: a sobra de capacidade não põe ninguém trabalhando em dia fechado (antes, com a necessidade informada abaixo do quadro, o rodízio punha gente no domingo fechado)","alternativa":"Manter o cadastro por função e turnos com o resultado expositivo da D112; critério só de custo e dias, aceitando menos gente por dia","origem":"pedido do usuário em 18/11/2026 (cobertura igual à de hoje no critério; uma equipe por simulação; versão completa como a mesma tela com refinamentos)","regras":["R1","R3","J1","J3"],"situacao":"adotado em 23/11/2026 como versão principal; textos do \"para avançar\" a validar pela equipe"},{"id":"D117","tema":"Turnos da equipe, o dia em 24 horas e o calendário opcional na versão 4","padrao":"A equipe pode ter até três turnos, cada um com entrada, saída e pessoas (a necessidade por dia e as mulheres aos domingos ficam por turno, nos refinamentos). Cada turno é calculado no próprio turno, como no motor; cada escala do resultado é a mesma escala aplicada a todos os turnos, com pessoas e custo somados, a situação de cada etapa igual à do turno mais exigente e o que muda em cada turno dito com o nome dele; escalas que não puderam ser montadas em todos os turnos ficam fora, com aviso. O dia da equipe em 24 horas mostra, por dia da semana, as faixas de cada turno e o menor número de pessoas trabalhando em cada meia hora entre as semanas do ciclo (somando os turnos e sem descontar o intervalo), com a linha de hoje para comparar e o aviso dos horários que ficam sem ninguém. O calendário de 16/12/2026 a 31/12/2027 volta como opção que abre ao clicar, na escala de hoje e em cada escala: pessoas trabalhando em cada dia, situação do dia, feriados nacionais e, ao clicar, quem trabalha, quem folga e por quê","alternativa":"Combinar escalas diferentes por turno; mostrar a média das semanas no dia em 24 horas","origem":"pedido do usuário em 18/11/2026","regras":["R1","R3","J1","J3"],"situacao":"adotado em 23/11/2026 como versão principal"},{"id":"D118","tema":"Decreto 13.173/2026 (19/11/2026): 12x36 no mês-calendário, divisores e bases","padrao":"12x36 (art. 3º): a média é apurada no mês-calendário (horas do mês contra o limite semanal ÷ 7 por dia do mês, com a semana de 13/12/2027 já a 40 h); acima do limite, a escala não deixa de aderir: as horas excedentes dependem de convenção ou acordo coletivo com compensação ou pagamento como extras (nova cláusula no cenário e nos acordos que a empresa informa), e o custo inclui essas horas pagas como extras, pela média semanal de cada pessoa em cada etapa, com o adicional informado (estimativa conservadora; com compensação, o custo cai e o plantão encurta). A média do ciclo fica como referência. Divisor (art. 5º): salário-hora pelo menor entre as horas semanais da pessoa × 5 e 220 hoje, 210 na etapa de 42 h e 200 na de 40 h. Turno ininterrupto (art. 2º): sem mudança de conclusão; o motor continua conferindo semana a semana e com teto de 8 h com norma coletiva (Súmula 423), o que é mais rigoroso que a média do mês do decreto. Bases das regras R8 e J6 e texto da base normativa atualizados; a portaria do MTE prevista no art. 4º não estava incorporada em 23/11/2026","alternativa":"Média do ciclo com o excedente dependendo de norma; manter não adere acima do limite até a portaria","origem":"pedido do usuário em 23/11/2026 (mês-calendário com norma coletiva; versão 4 como principal para o webinar de 24/11)","regras":["J6","R8"],"situacao":"adotado em 23/11/2026; a validar pela equipe: custo das horas pela média semanal, teto de 8 h no turno ininterrupto com norma coletiva diante do art. 2º do decreto"},{"id":"D119","tema":"Portaria MTE 2.041/2026 (DOU de 23/11/2026): médias no mês-calendário e demais ajustes do motor","padrao":"Médias de horas: a compensação pela média em norma coletiva (D108) passa a ser conferida no mês-calendário (art. 3º: horas do mês contra o limite semanal ÷ 7 por dia em serviço, em cada mês que a semana toca), e não mais no ciclo da escala; os repousos dessa semana ficam com R1 e R2. Médias de repousos: com norma coletiva do § 2º, mínimo do mês pelo critério A (art. 4º, § 4º: ⌈2 × dias ÷ 7⌉), com ou sem a liminar, e no máximo seis dias seguidos de trabalho (art. 4º, § 3º, conferido em R3); a janela de 28 dias da D102 sai do padrão (cfg.janela28). A amostra da etapa de 42 h do planejador vai até 31/03/2027, para conter um mês de 31 dias depois do preâmbulo de janeiro. Domingo: fora do comércio, sem domingo de folga em quatro semanas seguidas vira alerta (art. 5º, § 5º, 'preferencialmente'), mostrado como risco no estudo; comércio (art. 5º, § 4º) e mulheres (art. 5º, § 3º) sem mudança. Atividade insalubre: norma coletiva que autorize expressamente a prorrogação (art. 15, II) ou autorização da chefia de segurança e saúde no trabalho da Inspeção do Trabalho (art. 15, III), sem a marca de leitura quando atendida; a 12x36 segue fora (art. 15, I). Bases citando a portaria em J1, J4, J6, J7, R1 a R4, R8, R10, F1 e nos instrumentos; versão do cálculo 0.5.0","alternativa":"Manter a janela de 28 dias com a liminar (item IV da ADI 8.041) e a média no ciclo da escala; ou apurar as duas coisas","origem":"pedido do usuário em 24/11/2026 (\"atualize o motor, inclusive para cálculo das médias, com base na nova portaria do MTE 2041 publicada em 23/11\")","regras":["J1","J4","J6","J7","R2","R3","R4","R8","R10"],"situacao":"adotado em 24/11/2026; a validar pelo usuário: (1) a portaria reimpõe a trava do mês que o item IV da liminar afastava, e o simulador segue a portaria; (2) horista (D91) e 12x36 por acordo individual (D39) mantidos até decisão; (3) banco de horas anual diante da média mensal (a portaria não trata; art. 13, § 5º, só manda zerar o saldo até 15/12/2026 pelo acordo original); (4) teto de 42 h por semana na compensação pela média (D108)"},{"id":"D120","tema":"Tela da versão 4 refeita para leitura e comparação; folgas de cada mês pela Portaria MTE 2.041/2026; mês da mudança","padrao":"Formulário: horário e pessoas de cada turno numa grade com entrada, saída e pessoas, sem corte do horário; os sete dias numa linha. Resultado: a resposta e, logo abaixo, todas as escalas numa lista comparável (situação até 15/12/2027 e desde 16/12/2027, pessoas, folha por mês, pessoas por dia e folgas por semana), agrupada como antes, em ordem fixa e sem classificação; cada linha abre no lugar com o que muda, o que fazer para avançar, as folgas de cada mês, o porquê, o dia em 24 horas, a escala pessoa por pessoa e o calendário. Durante o recálculo, o resultado anterior fica na tela, esmaecido. Folgas de cada mês, de dezembro de 2026 a dezembro de 2027: mínimo pelo art. 4º, § 4º, da portaria (⌈2 × dias ÷ 7⌉), menor e maior número de folgas por pessoa, situação do mês (duas folgas em todas as semanas, quando o mínimo não se aplica; cumpre pela média com a norma; abaixo do mínimo; semana de uma folga só sem norma) e a tabela pessoa por pessoa, com a contagem do motor (art. 4º, § 2º). No mês da mudança (dezembro de 2026), o mínimo conta só os dias desde 16/12 (16 dias, mínimo 5), qualquer que seja o início da janela simulada; antes, dependia dela (6 no planejador, que começa em 14/12)","alternativa":"Mínimo de dezembro de 2026 pelos 31 dias do mês (9)","origem":"pedido do usuário em 24/11/2026 (\"as últimas versões pioraram demais em termos de layout, UX e funcionalidade\"; escolhas: formulário apertado, resultado difícil de ler, folgas do mês invisíveis)","regras":["R2"],"situacao":"adotado em 24/11/2026; mês da mudança proporcional, como na D17, a validar"},{"id":"D121","tema":"Volta à versão em páginas do simulador (passo a passo, ícones por setor, modos simplificado e completo)","padrao":"A tela publicada volta a ser a versão em páginas (setor, equipe, faturamento, custos e resultado), com o tutorial passo a passo, os ícones por setor e os modos simplificado e completo, mas com o cálculo atual (Decreto 13.173/2026 e Portaria MTE 2.041/2026, versão 0.5.0) e os textos jurídicos atualizados. A tela da versão 4 (D120) fica guardada no histórico do repositório","alternativa":"Manter a tela da versão 4 (D120)","origem":"pedido do usuário em 24/11/2026 (\"volte algumas casas, quero aquela versão de layout anterior separado por paginas, com passo a passo e que tenha os icones por setor\")","regras":[],"situacao":"adotado em 24/11/2026"},{"id":"D122","tema":"Premissa de não contratar; 2x2 e 12x36 em equipes fixas com 5x2 na cobertura; compensação pela média do mês sem teto semanal; jornada de até 12 h por norma coletiva","padrao":"Premissa padrão: sem contratar ninguém (contratar fica como opção marcada pelo usuário). Cada turno ganha o campo de mínimo de pessoas em serviço. Para funções que operam 24 h todos os dias, o simulador reorganiza o quadro de hoje em quatro equipes fixas, duas de dia e duas de noite, em 2x2 de 12 h (11 h de trabalho e 1 h de intervalo) ou em 12x36, com ou sem pessoas em 5x2 na cobertura dos turnos de hoje, e mostra ao lado os turnos de hoje com a sua opção sem contratação do planejador. O limite médio do mês-calendário (Portaria MTE 2.041/2026, art. 3º) é fechado com folgas de ajuste: plantões que viram folga quando as horas do mês passariam do limite, espalhados para que a equipe perca no máximo uma pessoa por dia sempre que der; o motor confere cada cenário nas duas etapas e também de abril a junho de 2028, com meses de 30 e 31 dias já com 40 h. A cobertura é medida minuto a minuto em cada turno de hoje, com os intervalos revezados dentro da equipe, contra o mínimo informado; factível é o cenário que cumpre a Emenda (com as normas que indica) e não fica abaixo do mínimo. Leituras novas, a validar: (1) com norma coletiva específica, semanas acima de 42 h ou de 40 h fecham pela média do mês-calendário, sem teto semanal (instrumento compensacao_media_mes); (2) norma coletiva admite jornada de até 12 h fora da 12x36 (CLT, art. 611-A, I; STF, Tema 1.046), com risco de questionamento pelo limite de 10 h do art. 59, § 2º; (3) equipes fixas de dia e de noite, sem alternância, não formam turno ininterrupto de revezamento (OJ 360 da SDI-1 do TST)","alternativa":"Manter o teto de 42 h por semana na compensação pela média (D108) e o limite de 10 h por dia fora da 12x36, o que reprova o 2x2 de 12 h em qualquer arranjo","origem":"pedido do usuário em 25/11/2026 (\"refaça o layout e input de dados para que direcione o motor a dar opções de cenários que tenham como premissa não contratar ninguém\"; \"faça testes com a escala 2x2 [...] uma rotação entre escaladas 2x2 e pessoal em 5x2 na cobertura, sem fazer contratações\"; escolhas: 2x2 de 12 h ou menos, premissa padrão sem contratar com contratação opcional, mínimo por turno)","regras":["J1","J2","J4","J6","R8"],"situacao":"adotado em 25/11/2026; as três leituras e o peso da hora noturna reduzida no limite do mês (D11) a validar"},{"id":"D123","tema":"Folgas pela média do mês como cenário padrão; premissa de contratar na primeira etapa; fim da escolha de férias; normas da empresa marcadas no resultado","padrao":"O exercício separado de folgas pela média do mês (D80) sai da tela. A média de folgas no mês passa a ser hipótese padrão do planejador: o ciclo de quatro semanas (4x3, 6x1, 4x3 e 5x2, 9 folgas a cada 28 dias) entra em todo turno de seis ou sete dias também com o quadro de hoje, sem contratar, com o início de cada pessoa no ciclo escolhido para o dia mais desfalcado ficar o menos desfalcado possível; a 6x2 também passa a ser testada com a norma como hipótese. No bloco de cenários sem contratar, entra um cartão com os turnos de hoje nesse ciclo. Cenário de rearranjo que depende de norma coletiva passa a dizer isso na situação. A pergunta sobre contratar vai para a primeira etapa, em “Sobre a empresa”. A escolha de férias no dimensionamento sai: vale a cobertura de hoje. A lista de normas coletivas dos ajustes avançados sai; no resultado, um painel mostra só as normas que alguma escala usa, com quantas escalas dependem de cada uma, para a empresa marcar as que já tem. Marcar não muda as escalas; muda a classificação das que dependem da norma","alternativa":"Manter o exercício separado, a lista completa de normas nos ajustes avançados e a escolha de férias","origem":"pedido do usuário em 25/11/2026 (\"elimine isso e deixe que o motor ja trate essa opcao como default\"; \"deixe isso la em cima dentro das primeiras opcoes\"; \"retire essa parte de ferias\"; \"sao mtas opcoes e nao fica claro o efeito de clicar ou nao em cada um, pense em outra solucao\")","regras":["R1","R2"],"situacao":"adotado em 25/11/2026; constatação registrada: com o mesmo quadro, o ciclo de média de folgas entrega 19 dias de trabalho a cada 28, contra 20 da 5x2, porque o mínimo do mês da Portaria MTE 2.041/2026 (art. 4º, § 4º) pede 9 folgas nos meses de 29 a 31 dias"},{"id":"D124","tema":"Resultado em de para (hoje e com a escala nova) e destaque dos dois cenários mais atrativos","padrao":"A seção principal do resultado passa a se chamar “Como é hoje e como pode ficar”. Cada cenário vira uma tabela de duas colunas, hoje e com esta escala: escala, situação na Emenda, pessoas em serviço em cada faixa de horário de hoje (com o mínimo), horas por pessoa, folgas por mês, folha, funcionamento, contratações e normas a negociar. A grade por dia da semana vai para os detalhes, só com a escala nova. Entram na comparação, por função, os turnos de hoje com a opção sem contratar de cada um, os turnos de hoje com folgas pela média do mês, as equipes fixas de 2x2 e 12x36 e os turnos de hoje com contratação. A ordem segue, nesta prioridade: cumprir a Emenda; não aumentar a folha (até 0,1% acima, por arredondamento); manter o horário e os dias de funcionamento; manter o mínimo de pessoas por turno; não contratar; usar mais das horas de cada pessoa até o limite legal; folha menor. Os dois primeiros que cumprem a Emenda recebem os selos “Mais atrativa” e “2ª mais atrativa”; os demais ficam numa dobra. Quando o mínimo informado passa do que o turno tem hoje, um aviso diz que nenhuma escala sem contratar chega a ele","alternativa":"Resultado expositivo, sem ordenação (D112)","origem":"pedido do usuário em 25/11/2026 (\"nessa aba deve ficar claro o De Para, ou como é hoje e como vai ficar\"; \"pense em criar para as opcoes alguns selos entre os 2 mais atrativos, sendo a premissa do mais atrativo nesta ordem de prioridade/peso: nao aumentar custos / manter o horario e dias de funcionamento do setor / manter a qtde minima de pessoas por turnos e usando o max de cada uma dela por dia de trabalho dentro do limite legal [...] / por ultimo seria um cenario de contratar\")","regras":[],"situacao":"adotado em 25/11/2026; substitui a D112 nesta seção (as opções por turno seguem expositivas); a validar com o usuário: os critérios não pesam a dependência de norma coletiva nem leitura a validar"}]; window.BUILD_INFO = {"hash":"0a7759915db97364952defa879bd861f32cdf4b995d1ec869b0b45c034b24428","versao":"0.6.0","data":"25/11/2026 17:41 UTC","testes":"16 de 16 testes, com 35 de 35 conferências: Portaria MTE 2.041/2026 (PT1 a PT4), cenários sem contratar, 2x2 de 12 h e folgas de ajuste (SC1 a SC7), folgas pela média do mês com o quadro de hoje (PL1 a PL4), valores derivados à mão, e fotografia de regressão dos casos de referência. A suíte anterior (166 conferências do motor e 92 do planejador) se perdeu com o reinício do espaço de trabalho em 25/11/2026 e está sendo refeita; nenhum caso de referência validado pela equipe ainda","logo":null}; window.ENDERECOS = {"pasta":"https://czalaf-my.sharepoint.com/:f:/g/personal/guilherme_peixoto_claudiozalaf_com_br/IgBv6kaVq5RpS5q4mgUxb-rNAVVcO5lnDPam6bnrK6l_Xz4?e=dQed9k","simulador":"https://czalaf-my.sharepoint.com/:f:/g/personal/guilherme_peixoto_claudiozalaf_com_br/IgBv6kaVq5RpS5q4mgUxb-rNAVVcO5lnDPam6bnrK6l_Xz4?e=dQed9k"};</script>

    if (usa('12x36')) normas.push(['x12', 'Há convenção ou acordo coletivo que autorize a 12x36?']);

    return `<header class="cab-etapa"><span class="eyebrow">${rotEtapa(E.EQUIPE)}</span><h1>Quem trabalha, em que escala e em que horário</h1>
        <p class="lead">Monte a equipe por cargo: escolha o cargo, informe quantas pessoas e o salário e clique em Adicionar. Depois ajuste em cada ficha a escala, os dias e o horário como a equipe trabalha hoje, mesmo que já passem do novo limite.</p></header>

    if (m.modo === 'dia') { const v = m.dia.map((x) => num(x) || 0); const s = soma(v); return s > 0 ? { mensal: s * SEM, dia: v } : null; }
    if (m.modo === 'mes' && num(m.mes) > 0) return { mensal: num(m.mes), dia: null };
    return null;

  function vAvisoSimples() {
    if (!simples()) return '';
    return `<div class="aviso-simples"><p><b>Modo simplificado: resultado aproximado.</b> O simulador usou os dias de trabalho típicos de cada cargo no setor, um horário por cargo, o mesmo salário para todos do cargo e os encargos do regime tributário, sem benefícios, faturamento nem normas coletivas. Com os dados reais, os números podem mudar bastante. Para decidir, revise no modo completo: tudo o que você preencheu é aproveitado.</p>

  /**
   * Resultado expositivo (D112): o diagnóstico da escala de hoje, todas as opções de escala lado a lado, sem ranking nem
   * indicação, e o teste e ajuste de qualquer uma delas, que segue para o calendário e para as exportações.
   */
  function vResultado() {
    const ts = turnosCalc();
    garantir(ts);
    const as = ts.map((t) => ({ t: t, a: analise(t) }));
    const calc = as.filter((x) => x.a.estado === 'calc').length;
    const erros = as.filter((x) => x.a.estado === 'erro');
    const prontos = as.filter((x) => x.a.estado === 'ok');
    const cab = `<header class="res-cab"><div class="cab-etapa"><span class="eyebrow">Resultado${S.op.empresa.nome ? ' · ' + esc(S.op.empresa.nome) : ''}</span><h1>O que muda com a Emenda Constitucional 141 (Fim da 6x1)</h1></div>
      <div class="acoes"><button class="btn" data-acao="ir" data-etapa="${E.EQUIPE}" id="editar-dados">Editar os dados</button>
        <button class="btn" data-acao="pdf" id="baixar-pdf"${S.downloads === null ? ' disabled title="Downloads indisponíveis nesta visualização"' : ''}>Baixar PDF</button>
        <button class="btn" data-acao="xlsx" id="baixar-xlsx"${S.downloads === null ? ' disabled title="Downloads indisponíveis nesta visualização"' : ''}>Baixar Excel</button>
        ${DENTRO_CLAUDE ? '' : '<button class="btn" data-acao="ics" id="baixar-ics" title="Arquivo para importar a escala em teste no Google Agenda, Apple ou Outlook">Escala na agenda (.ics)</button>'}</div>
      ${S.downloads === null ? `<p class="nota" style="flex-basis:100%">Nesta página, o PDF e o Excel só podem ser baixados por quem está conectado a uma conta do Claude.${END.simulador ? ` Para baixar sem conta, use a versão do simulador que fica <a href="${esc(END.simulador)}" target="_blank" rel="noopener">na pasta do escritório</a>: baixe o arquivo simulador-ec141.html e abra no navegador.` : ''}</p>` : ''}</header>`;
    if (!ts.length) return cab + `<p class="aviso forte">Nenhuma função completa: informe horário e pessoas na etapa da equipe.</p>`;
    if (calc) return cab + faixaExemplo() + `<p class="carregando">Calculando ${ts.length - calc} de ${ts.length} turnos…</p>`;
    const avisoErro = erros.length ? `<p class="aviso forte">Não foi possível calcular ${erros.map((x) => esc(x.t.nome) + ': ' + esc(x.a.erro)).join('; ')}.</p>` : '';
    if (!prontos.length) return cab + avisoErro;
    const nT = prontos.length;
    if (!S.op.motor) S.op.motor = { versao: M.VERSAO, em: hojeISO() };
    return cab + vBaseNormativa() + vVersoes() + faixaExemplo() + avisoErro + vAvisoSimples() + vVeredito(prontos) + vLiminar() +
      dobra('diag', 'Diagnóstico completo', 'a escala de hoje em cada etapa e as horas acima dos novos tetos', vLinhaRes(prontos) + vTamanho(prontos)) +
      vNormas(prontos) +
      vSemContratar(prontos) +
      vOpcoes(prontos) +
      dobra('escala', 'Teste e ajuste', 'abra qualquer escala e mude folgas, horários, pessoas e acordos para ver se adere' + (nT > 1 ? ', em cada função' : ''), vTeste(prontos), true) +
      vCalendario(prontos) + vHoristas(prontos) +
      dobra('receita', 'Faturamento e custo da equipe', 'o peso da folha no faturamento informado, hoje e com as escalas em teste', vReceita(prontos)) +
      dobra('setor', 'O cenário do seu setor', 'dados de jornada e de 6x1 no setor escolhido', `<section class="secao"><header><h2>Entenda o cenário do seu setor</h2></header>${vContextoSetor(S.op.empresa.setor)}</section>`) +
      dobra('contas', 'Como chegamos nestes valores', 'encargos, custo por pessoa, regras de cálculo e premissas', vContas() + vPremissas());
  }

  /* ---------------------------------------------------------------- diagnóstico da escala de hoje */

  /** Pessoas que não cumprem (ou dependem de norma coletiva) em cada etapa da Emenda Constitucional 141 (Fim da 6x1), com a escala de hoje. */
  function fases(prontos) {
    const r = { total: 0, e1: { fora: 0, pend: 0 }, e2: { fora: 0, pend: 0 } };
    for (const { t, a } of prontos) {
      r.total += t.pessoas;
      for (const e of ['e1', 'e2']) {
        const st = a.diag && a.diag.etapas && a.diag.etapas[e] ? a.diag.etapas[e].status : null;
        if (st === 'nao_cumpre') r[e].fora += t.pessoas; else if (st === 'pendente') r[e].pend += t.pessoas;
      }
    }
    return r;
  }

  /* ---------------------------------------------------------------- cobertura hora a hora no dia (D97) */

  const PASSO = 15;   // minutos por fatia da linha do tempo
  /** Janela de funcionamento do turno num dia da semana (minutos; o fim pode passar da meia-noite). */
  function janelaTurno(t, wd) {
    const h = t.porDia && t.porDia[wd], ini = M.lerHora(h ? h.inicio : t.inicio), fim0 = M.lerHora(h ? h.fim : t.fim);

  }
  /**
   * Pessoas no turno e necessidade em cada fatia de 15 min do dia i, por função: conta quem está escalado, da entrada à

   * necessidade é a do dia em toda a janela de funcionamento do turno. As diárias de freelancer, quando há, entram na janela do turno.

  function coberturaDia(fontes, cals, i) {
    const n = 1440 / PASSO, porFn = new Map();
    fontes.forEach((f, k) => {
      const cal = cals[k];
      if (!cal || cal.estado !== 'ok') return;
      const fid = f.t.fid || f.t.chave;
      if (!porFn.has(fid)) porFn.set(fid, { nome: f.t.fnome || f.t.nome, pres: new Array(n).fill(0), nec: new Array(n).fill(0) });
      const o = porFn.get(fid);
      const somar = (ini, fim, pausas, desloc) => {
        for (let q = 0; q < n; q++) {
          const m = q * PASSO + desloc;
          if (m >= ini && m < fim) o.pres[q]++;   // da entrada à saída: o intervalo de refeição se reveza dentro do turno
        }
      };
      for (const x of cal.dias[i].t) somar(x[1], x[2], x[4], 0);
      if (i > 0) for (const x of cal.dias[i - 1].t) if (x[2] > 1440) somar(x[1], x[2], x[4], 1440);
      const necDe = (d, desloc) => {
        const antes = f.corte != null && d < f.corte, wd = diaSem(d), dem = ((antes ? f.demandaPre : f.demanda) || [])[wd] || 0, jt = janelaTurno(f.t, wd);

      };
      necDe(i, 0);
      if (i > 0) necDe(i - 1, 1440);

  }

  function vLinhaTempo24(o) {
    const n = o.pres.length, max = Math.max(1, Math.max.apply(null, o.pres), Math.max.apply(null, o.nec));
    const passoY = max <= 5 ? 1 : max <= 12 ? 2 : max <= 30 ? 5 : 10, topo = Math.ceil(max / passoY) * passoY;
    const W = n, H = 100, y = (v) => H - v / topo * H;
    const degraus = (arr) => arr.map((v, q) => `${q === 0 ? 'M' : 'L'}${q},${y(v).toFixed(2)} L${q + 1},${y(v).toFixed(2)}`).join(' ');
    const area = `M0,${H} ` + o.pres.map((v, q) => `L${q},${y(v).toFixed(2)} L${q + 1},${y(v).toFixed(2)}`).join(' ') + ` L${n},${H} Z`;
    const faltas = [];

    const temNec = o.nec.some((v) => v > 0);
    const dicas = Array.from({ length: n / 2 }, (_, k) => { const q = 2 * k, p = Math.min(o.pres[q], o.pres[q + 1]), ne = Math.max(o.nec[q], o.nec[q + 1]);
      return `<rect x="${q}" y="0" width="2" height="${H}" class="lt-hit"><title>${hhmm(q * PASSO)} às ${hhmm((q + 2) * PASSO)}: ${p} ${p === 1 ? 'pessoa' : 'pessoas'}${temNec ? ' · necessidade ' + ne : ''}</title></rect>`; }).join('');
    const ticksY = []; for (let v = 0; v <= topo; v += passoY) ticksY.push(v);
    const falta = o.pres.some((v, q) => v < o.nec[q]), sobra = o.pres.some((v, q) => o.nec[q] > 0 && v > o.nec[q]);

    if (falta) { const trs = []; for (let q = 0; q < n; q++) if (o.pres[q] < o.nec[q] && (q === 0 || !(o.pres[q - 1] < o.nec[q - 1]))) { let e = q; while (e < n && o.pres[e] < o.nec[e]) e++; trs.push(hhmm(q * PASSO) + ' às ' + hhmm(e * PASSO)); } leitura = 'Falta gente ' + juntar(trs).replace(/; e /, ' e ') + '.'; }

          <path d="${area}" class="lt-pres"/>${faltas.join('')}
          <path d="${degraus(o.pres)}" class="lt-linha" vector-effect="non-scaling-stroke"/>
          ${temNec ? `<path d="${degraus(o.nec)}" class="lt-nec" vector-effect="non-scaling-stroke"/>` : ''}${dicas}</svg>
          <div class="lt-x" aria-hidden="true">${Array.from({ length: 9 }, (_, k) => `<span style="left:${(k / 8 * 100).toFixed(2)}%">${k * 3}h</span>`).join('')}</div></div></div>

  }

  /**

  function motivoSobra(f, cal, i, r) {

    else {
      if (c.reservaFerias > 0) causas.push('o quadro tem ' + plural(c.reservaFerias, 'pessoa', 'pessoas') + ' de reserva para as férias (30 dias por pessoa no ano); o calendário não marca as férias de cada um, então nos dias sem ninguém de férias sobra gente');
      if (c.fecha && c.fecha.length) causas.push('com o turno fechado ' + P._interno.aosDias(c.fecha) + ', as pessoas de hoje ficam nos dias em que abre');

    return `<p class="md-sobra"><b>${plural(mais, 'pessoa', 'pessoas')} a mais que o necessário.</b> ${esc(maiuscula(juntar(causas).replace(/; e /, ' e ')))}. A sobra pode cobrir faltas e férias${c && !antes ? ', ou a empresa pode reduzir o quadro com o tempo, sem repor quem sair' : ''}.</p>`;
  }
  /** Janela com o detalhe de um dia. */

    if (d.teste) { S.op.ver = Object.assign({}, S.op.ver || {}); if (el.value && el.value !== 'hoje') S.op.ver[d.teste] = el.value; else delete S.op.ver[d.teste]; S.ui.semana = 0; editou(); render(); const n = document.getElementById('teste-sel'); if (n) n.focus({ preventScroll: true }); return; }
    if (d.calFiltro) { S.ui.calFiltro = el.value; render(); }
    if (d.ferPessoa) { S.ui.ferPessoa = el.value; render(); }
  });
  document.addEventListener('change', (ev) => {
    const el = ev.target, d = el.dataset;
    if (d.cf && d.w != null && d.d != null) {
      const c = confEstado(), x = c.dias[+d.w] && c.dias[+d.w][+d.d];
      if (!x) return;
      if (d.cf === 'iv') x.iv = Number(el.value) || 0; else if (M.lerHora(el.value) != null) x[d.cf] = el.value;
      editou(); render(); return;
    }
    if (d.neg) { S.op.negociacao[d.neg] = el.checked; editou(); render(); return; }
    if (d.mov === 'usar') { S.op.movimento.usar = el.checked; editou(); return; }
    if (d.domingo) { S.op.domingo = el.checked ? null : false; editou(); render(); return; }
    if (d.fn && d.sh && d.pk != null && d.pf === 'mulher') {
      const f = acharFn(d.fn), s = f && f.turnos.find((x) => x.id === d.sh);
      if (!s) return;
      if (!Array.isArray(s.equipe)) s.equipe = [];
      const k = +d.pk;
      while (s.equipe.length <= k) s.equipe.push({});
      s.equipe[k] = Object.assign({}, s.equipe[k], { mulher: el.checked });
      editou(); render(); return;
    }
    if (d.feriasSd) { S.op.feriasSabDom = el.checked; editou(); render(); return; }
    if (d.horQuem) { S.ui.horQuem = el.value === '' ? null : Number(el.value); render(); return; }
    if (d.hor === 'int' && d.d != null) { editarHorario(Number(d.d), 'int', el.value); return; }
    if (d.ini === 'data') {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(el.value)) return;
      S.op.inicio = Object.assign({}, S.op.inicio || {}, { data: el.value < INICIO_MIN ? INICIO_MIN : el.value > INICIO_MAX ? INICIO_MAX : el.value });
      S.ui.dia = null; editou(); render();
    }
  });
  // horários da escala: aplicados ao sair do campo ou com Enter, para não redesenhar a tela no meio da digitação (D105)
  document.addEventListener('focusout', (ev) => {
    const el = ev.target, d = el && el.dataset;
    if (!d || (d.hor !== 'ini' && d.hor !== 'fim') || d.d == null || !el.value || el.value === d.orig) return;
    d.orig = el.value;
    setTimeout(() => editarHorario(Number(d.d), d.hor, el.value), 0);
  });
  document.addEventListener('keydown', (ev) => {
    const el = ev.target, d = el && el.dataset;
    if (ev.key !== 'Enter' || !d || (d.hor !== 'ini' && d.hor !== 'fim') || d.d == null) return;
    ev.preventDefault();
    if (el.value && el.value !== d.orig) { d.orig = el.value; editarHorario(Number(d.d), d.hor, el.value); }
  });
  document.addEventListener('toggle', (ev) => { const d = ev.target; if (d && d.dataset && d.dataset.abre) S.ui[d.dataset.abre] = d.open; }, true);
  document.addEventListener('keydown', (ev) => {
    if (S.ui.dia == null) return;
    if (ev.key === 'Escape') { ev.preventDefault(); fecharDia(); return; }
    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') { ev.preventDefault(); S.ui.dia = Math.max(0, Math.min(NDIAS - 1, S.ui.dia + (ev.key === 'ArrowLeft' ? -1 : 1))); renderModal(); const f = document.getElementById('fechar-dia'); if (f) f.focus({ preventScroll: true }); return; }
    if (ev.key === 'Tab') {
      const foc = Array.from(document.querySelectorAll('#modal button:not([disabled])'));
      if (!foc.length) return;
      const i = foc.indexOf(document.activeElement);
      if (ev.shiftKey && i <= 0) { ev.preventDefault(); foc[foc.length - 1].focus(); } else if (!ev.shiftKey && i === foc.length - 1) { ev.preventDefault(); foc[0].focus(); }
    }
  });

  /* ================================================================ início */

  /** Download comum do navegador, para a cópia do simulador hospedada fora do claude.ai. */
  function baixarDireto(nome, data) {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nome; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  const DENTRO_CLAUDE = !!(window.claude && window.claude.use);
  async function iniciarDownloads() {
    if (!DENTRO_CLAUDE) S.downloads = { save: async (o) => { baixarDireto(o.filename, o.data); return { status: 'saved' }; } };
    else { try { S.downloads = await window.claude.use('downloads'); } catch (e) { S.downloads = null; } }
    if (S.etapa === E.RES || S.etapa === E.SETOR) render();
  }
  document.documentElement.lang = 'pt-BR';
  if (!$('#modal')) { const m = document.createElement('div'); m.id = 'modal'; m.hidden = true; document.body.appendChild(m); }
  $('#rodape').textContent = 'Simulador de escalas da Emenda Constitucional 141 (Fim da 6x1) · Claudio Zalaf Advogados Associados · motor ' + (INFO.versao || M.VERSAO) + (INFO.data ? ' · versão de ' + INFO.data : '') + ' · ferramenta de planejamento; as leituras marcadas “a validar” dependem de confirmação jurídica.';
  // versão hospedada como site: service worker para abrir sem internet e instalar como app
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !DENTRO_CLAUDE && document.querySelector('link[rel="manifest"]')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
  carregar();
  criarWorker();
  render();
  if (S.etapa) garantir(turnosCalc());
  iniciarDownloads();
  window.__simulador = S;
})();
