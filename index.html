etiva (EC, art. 7º)","alternativa":"Acordo individual de compensação","origem":"prompt","situacao":"aguarda validação (pergunta 6j)","regras":["J1"]},{"id":"D15","tema":"Compensação no mês (J4) e banco de horas (J5)","padrao":"Saldo das semanas de apuração atribuídas ao mês ou ao período (pela quinta-feira) contra a base semanal; base de 40 h quando já vigoram dois repousos e não há norma do art. 7º nem regime do § 2º; semana parcial entra só com eventual excesso; feriado não trabalhado reduz a base da semana em um quinto e não gera crédito","alternativa":"Limite da seção 4.6 (teto ÷ 7 por dia do mês), exibido como referência","origem":"proposta","situacao":"pendente (discordância 3); revista nesta etapa porque o limite diário da seção 4.6 acusa excesso falso em meses com 23 dias úteis","regras":["J4","J5"]},{"id":"D16","tema":"Critério da média mensal do § 2º","padrao":"Critério A: ⌈dias ÷ 7 × 2⌉","alternativa":"Critérios B e C, sempre exibidos","origem":"prompt","situacao":"aguarda validação (pergunta 6a); com a liminar na ADI 8.041 ligada, substituído pela janela de 28 dias (D102)","regras":["R2"]},{"id":"D17","tema":"Meses parciais no § 2º","padrao":"Forma proporcional de cada critério (seção 4.7)","alternativa":"—","origem":"prompt","situacao":"aguarda validação (pergunta 6h)","regras":["R2"]},{"id":"D18","tema":"Art. 9º","padrao":"Leitura literal: o inciso XV vale desde 16/12/2026","alternativa":"Dois repousos também diferidos até o aditamento","origem":"prompt","situacao":"aguarda validação (pergunta 6e)","regras":["R13","R1"]},{"id":"D19","tema":"Art. 8º","padrao":"Remuneração vigente no 1º dia do mês contra 2,5 × teto do RGPS do ano; controle mantido por liberalidade ou norma coletiva afasta o enquadramento; teto do ano não informado não enquadra; R5, R6 e R8 informativos","alternativa":"—","origem":"proposta","situacao":"pendente (discordância 9 e pergunta 6d)","regras":["R10"]},{"id":"D20","tema":"Instrumentos coletivos anteriores à Emenda","padrao":"Sem marca de compatibilidade, deixam de valer a partir de 16/12/2026; acordos individuais não são alcançados pelo art. 3º","alternativa":"—","origem":"proposta","situacao":"pendente (discordância 10)","regras":["R15","R2","J1","R6"]},{"id":"D21","tema":"Significado de \"cumpre com condição\"","padrao":"A escala depende do instrumento indicado; a marca \"atendida\" diz se ele está cadastrado, vigente e compatível","alternativa":"—","origem":"proposta","situacao":"pendente","regras":["J1","J2","J3","J4","R6","R7","R8"]},{"id":"D22","tema":"Turnos sobrepostos do mesmo empregado","padrao":"Cada turno conta as próprias horas e a sobreposição é sinalizada em R5 como erro de cadastro","alternativa":"—","origem":"proposta","situacao":"pendente","regras":["R5"]},{"id":"D23","tema":"Feriado em dia de trabalho","padrao":"Não trabalhado, salvo escala marcada para trabalhar em feriados ou exceção do dia; a 12x36 trabalha por padrão","alternativa":"—","origem":"proposta","situacao":"pendente","regras":["R7"]},{"id":"D24","tema":"Folga compensatória de feriado trabalhado (R7)","padrao":"Aceita se registrada entre 6 dias antes e 13 dias depois do feriado","alternativa":"—","origem":"proposta","situacao":"pendente; a lei não fixa prazo e a janela foi escolhida por mim","regras":["R7"]},{"id":"D25","tema":"Sequência de dias de trabalho (R3)","padrao":"Qualquer dia sem início de turno interrompe a sequência","alternativa":"—","origem":"proposta","situacao":"pendente","regras":["R3"]},{"id":"D26","tema":"Detecção de turno ininterrupto de revezamento (R8)","padrao":"No mês, horários de início que diferem 4 h ou mais e algum turno com minutos entre 22h e 5h","alternativa":"—","origem":"proposta","situacao":"pendente","regras":["R8"]},{"id":"D27","tema":"Intervalo intrajornada (R6)","padrao":"30 a 59 min depende de norma coletiva (art. 611-A, III) ou autorização do art. 71, § 3º; abaixo de 30 min não cumpre; acima de 2 h depende de acordo escrito ou norma coletiva; fracionado depende de norma coletiva (art. 71, § 5º); indenizado só na 12x36; alerta para intervalo na primeira ou na última hora","alternativa":"—","origem":"pedido","situacao":"implementado conforme pedido de 26/10/2026; detalhes pendentes de validação","regras":["R6"]},{"id":"D28","tema":"Início de férias (F1)","padrao":"Não cumpre se um dos dois dias seguintes for feriado ou folga da escala","alternativa":"—","origem":"proposta","situacao":"pendente (discordância 5)","regras":["F1"]},{"id":"D29","tema":"Escalas combinadas e trocas no mês","padrao":"Toda escala é um padrão cíclico de N dias com âncora; atribuições por período com qualquer data de início; modelos semanais ancorados na segunda-feira","alternativa":"—","origem":"pedido","situacao":"implementado","regras":["R1","R3","R5"]},{"id":"D30","tema":"Divergência no caso 11.1 (semana de 27/12/2027)","padrao":"O motor apura 4 h de excedente na semana de 27/12/2027, porque o teto já é 40 h","alternativa":"—","origem":"prompt","situacao":"resolvido: esperado do caso 11.1 corrigido para 4 h por decisão do usuário em 26/10/2026","regras":["J3"]},{"id":"D31","tema":"Desempenho","padrao":"Avaliação padrão a cada alteração; leituras alternativas calculadas em segundo plano no navegador","alternativa":"—","origem":"proposta","situacao":"meta de 2 s a conferir no navegador num notebook comum","regras":[]},{"id":"D32","tema":"12x36 com troca de escala no mês da transição","padrao":"Na regra J6, a média de cada ciclo de 12x36 é comparada ao teto das semanas em que aquela escala é usada; antes, era comparada a todas as semanas do mês","alternativa":"—","origem":"proposta","situacao":"corrigido em 26/10/2026 (motor 0.1.1), com o caso N21; os 51 testes anteriores continuam passando sem alteração de esperados","regras":["J6"]},{"id":"D33","tema":"Quadro mínimo e distribuição de folgas nos cenários","padrao":"Quadro = maior necessidade diária ou soma da semana dividida pelos dias de trabalho por pessoa, o que for maior; folgas nos dias com mais sobra de pessoas; rodízio semanal em que a primeira folga de uma semana não vem depois da última folga da anterior (no máximo 6 dias seguidos)","alternativa":"Folgas fixas por pessoa, oferecidas como cenário separado fora do comércio","origem":"proposta","situacao":"a validar","regras":["R1","R3"]},{"id":"D34","tema":"Comércio com operação aos domingos","padrao":"Toda pessoa que trabalha aos domingos entra em rodízio com folga em ao menos um domingo a cada três semanas (Lei 10.101/2000, art. 6º, parágrafo único); por isso o cenário de folgas fixas não é oferecido nesse caso","alternativa":"—","origem":"proposta","situacao":"a validar; norma coletiva ou lei municipal podem prever regra própria","regras":["R4"]},{"id":"D35","tema":"Tempo parcial nos cenários","padrao":"Até 30 h semanais sem horas extras (CLT, art. 58-A), medidas em horas computadas (no turno noturno, a hora reduzida conta); dias por semana = 30 h divididas pela jornada computada, até 5; os parciais ficam nos dias de maior necessidade; o cenário só aparece quando o turno precisa contratar e não substitui ninguém do quadro atual","alternativa":"Modalidade de até 26 h com até 6 h extras, não modelada","origem":"proposta","situacao":"a validar","regras":["R14"]},{"id":"D36","tema":"Férias no dimensionamento","padrao":"Com a premissa ligada (padrão da tela), cada cenário recebe gente suficiente para que a capacidade semanal da equipe, descontados 30 dias de férias por pessoa no ano, cubra a necessidade: capacidade × 335 ≥ necessidade × 365. Substitui o cenário separado de reserva e a aproximação de 22 dias úteis","alternativa":"Premissa desligada: quadro mínimo, sem cobertura de férias","origem":"pedido","situacao":"pedido do usuário em 27/10/2026","regras":[]},{"id":"D37","tema":"Ordem dos cenários sugeridos","padrao":"Primeiro a situação jurídica (cumpre; com acordo individual; depende de negociação coletiva; não cobre a operação; cumpre só até 15/12/2027; não cumpre), depois as horas contratadas por semana e o número de contratações; os três primeiros são os sugeridos","alternativa":"O usuário pode escolher qualquer cenário ou montar o seu","origem":"pedido","situacao":"pedido do usuário em 26/10/2026 (ao menos 3 sugestões)","regras":[]},{"id":"D38","tema":"Feriados","padrao":"Os cenários tratam feriados como dias normais de trabalho e exibem aviso sobre os requisitos do trabalho em feriado: autorização (no comércio, convenção coletiva e legislação municipal, Lei 10.101/2000, art. 6º-A; nas demais atividades, conforme o caso, acordo ou convenção coletiva) e contrapartida (folga compensatória ou pagamento em dobro, Lei 605/1949, art. 9º; Súmula 146 do TST)","alternativa":"Feriados avaliados dia a dia pelo motor (R7), como no calendário por empregado","origem":"pedido","situacao":"pedido do usuário em 27/10/2026","regras":["R7"]},{"id":"D39","tema":"12x36 só com norma coletiva","padrao":"O planejador só aceita a 12x36 com convenção ou acordo coletivo marcado; sem isso, os cenários de 12x36 e o diagnóstico de quem já está em 12x36 aparecem como dependentes de negociação. O acordo individual escrito, embora previsto no art. 59-A da CLT, não assegura a validade da escala. O motor continua reconhecendo o acordo individual pela letra da lei; a exigência fica no planejador","alternativa":"Aceitar acordo individual escrito (letra do art. 59-A)","origem":"pedido","situacao":"pedido do usuário em 27/10/2026","regras":["J2","J6"]},{"id":"D40","tema":"Dias de folga escolhidos pelo usuário","padrao":"No cadastro, cada empregado em escala semanal pode ter os dias de folga marcados; o diagnóstico usa esses dias e distribui conforme a necessidade só as folgas não informadas. No cenário montado, os dias de folga podem ser escolhidos pessoa a pessoa, fixos ou girando entre as pessoas a cada semana; se o giro passar de 6 dias seguidos (ou, no comércio, de três semanas sem domingo), as folgas ficam fixas e o cenário avisa","alternativa":"—","origem":"pedido","situacao":"pedido do usuário em 27/10/2026","regras":["R1","R3","R4"]},{"id":"D41","tema":"12x36 noturna e teto de 40 h","padrao":"Com a leitura padrão (horas computadas), o plantão de 19h às 7h com 1 h usufruída (das 0h30 à 1h30) tem 11 h de relógio e 11h51min26s computadas pela hora reduzida sobre as 6 h trabalhadas entre 22h e 5h; a média do ciclo é de 41h30, acima do teto de 40 h a partir de 16/12/2027. Pela leitura alternativa (horas de relógio), a média é de 38h30","alternativa":"Horas de relógio nas regras de teto","origem":"derivado","situacao":"a validar: leitura com impacto relevante em vigilância, portaria e saúde","regras":["J6"]},{"id":"D42","tema":"Horário de funcionamento","padrao":"Cada turno pode ter horário por dia da semana. Cenários que alteram entrada ou saída em algum dia de operação são marcados como mudança de horário; se o turno foi marcado como de horário fixo, ficam abaixo dos que mantêm o horário (4x3 no horário atual, quando cada dia cabe em 10 h e a semana em 40 h; ou duas equipes de até 8 h escalonadas). Sem resposta, o simulador pergunta","alternativa":"—","origem":"pedido","situacao":"pedido do usuário em 27/10/2026","regras":["J1","J3"]},{"id":"D43","tema":"Semana de 42 h com o último dia mais curto","padrao":"Quando todos trabalham os mesmos cinco dias e a jornada atual passa de 40 h: até 8h30 nos quatro primeiros dias e o restante até 42 h no último, até 12/12/2027; depois, até 8 h por dia. Pela leitura adotada (D14), depende de convenção ou acordo coletivo do art. 7º; pela alternativa, de acordo individual de compensação","alternativa":"Acordo individual escrito de compensação (leitura alternativa do art. 7º)","origem":"pedido","situacao":"a validar: o exemplo do usuário (seg a qui 8h às 17h30, sex 8h às 17h) depende da norma coletiva pela leitura adotada","regras":["J1","J4"]},{"id":"D44","tema":"Cenário montado com horário por dia","padrao":"Dias acima de 8 h em semana de até 40 h: acordo individual de compensação, registrado só a partir da etapa em que for necessário; semana acima de 40 h com dias acima de 8 h (etapa de 42 h): norma coletiva do art. 7º, sem a qual o excedente é hora extra","alternativa":"—","origem":"proposta","situacao":"a validar","regras":["J1","J4"]},{"id":"D45","tema":"Descrição da operação em texto","padrao":"O texto é enviado ao Claude na conta de quem usa a página e volta em formato fixo; a página confere cada campo, deixa em branco o que não veio, lista as interpretações e o que faltou e só usa os dados após confirmação. Intervalo não informado vira 60 min e escala não informada vira 6x1, ambos sinalizados para conferência","alternativa":"—","origem":"pedido","situacao":"retirado em 27/10/2026, a pedido do usuário, para não consumir uso do Claude; a página não declara mais esse recurso","regras":[]},{"id":"D46","tema":"Acordo individual × negociação coletiva","padrao":"Acordo individual escrito só para redistribuir horas dentro da mesma semana, mantidos dois repousos em cada semana (por exemplo, 4x3 de até 10 h ou dias acima de 8 h em semana de até 40 h). Arranjos que tenham como premissa a média mensal de dois repousos semanais (CF, art. 7º, § 2º) dependem de convenção ou acordo coletivo; o motor não aceita o regime de média, a ampliação do art. 7º, o turno ininterrupto de até 8 h, o banco anual nem as demais hipóteses reservadas à negociação coletiva quando cadastrados como acordo individual (motor 0.1.2, caso N22)","alternativa":"—","origem":"pedido","situacao":"leitura do usuário em 27/10/2026; a distribuição de 42 h em cinco dias segue a leitura D14 (norma coletiva do art. 7º)","regras":["R2","J1","J4","R8"]},{"id":"D47","tema":"Férias no dimensionamento","padrao":"Padrão: manter a cobertura de hoje. Se a equipe atual já comporta 30 dias de férias por pessoa no ano (capacidade × 335 ≥ necessidade × 365), os cenários mantêm essa folga; se não comporta, também não contratam por causa das férias, porque a lacuna não decorre da Emenda Constitucional 141 (Fim da 6x1). Opções: reservar sempre (comportamento anterior) ou não considerar. Dados salvos com a premissa ligada passam a manter a cobertura de hoje","alternativa":"Reservar gente para todas as férias em todo cenário","origem":"pedido","situacao":"adotado em 27/10/2026 a partir da observação do usuário de que os cenários sempre contratavam","regras":[]},{"id":"D48","tema":"Rearranjo do funcionamento sem contratar","padrao":"Quando o horário do turno não foi marcado como fixo: (a) deixar de abrir em um ou dois dias, só entre os dias com necessidade até a média da semana, escolhendo o menor número de dias e a menor perda de horas; (b) 5x2 com o quadro atual e menos gente nos dias de menor movimento; (c) no plantão de 12 h, 5x2 de até 8 h com horário encurtado. Situação: cumpre, com rearranjo. Se o horário pode mudar, o melhor cenário sem contratação vem em primeiro; sem resposta, fica entre as três sugestões. Com horário fixo, esses cenários não aparecem ou aparecem como lacuna","alternativa":"—","origem":"pedido","situacao":"a validar","regras":[]},{"id":"D49","tema":"Modelo de custo","padrao":"Salário mensal de tempo integral informado por turno; quem já está no quadro mantém o salário (Emenda Constitucional 141/2026 – Fim da 6x1, art. 2º); tempo parcial proporcional às horas computadas do tempo integral (CLT, art. 58-A, § 1º), sem redução para quem já está no quadro. Salário-hora = salário ÷ (horas semanais computadas × 5): 220 para 44 h, 210 para 42 h e 200 para 40 h (Súmula 431 do TST para 40 h; 42 h pela mesma fórmula, a conferir). 365 ÷ 12 ÷ 7 semanas por mês. Adicional noturno sobre as horas noturnas pagas como reduzidas, com o percentual informado (20% por padrão, CLT, art. 73). Encargos: percentual informado pelo usuário, sem valor padrão. Horas medidas em 04/01 a 28/02/2027 (hoje e etapa de 42 h) e em 13/12/2027 a 30/01/2028 (etapa de 40 h)","alternativa":"Divisor por outra fórmula ou pela norma coletiva","origem":"proposta","situacao":"a validar","regras":[]},{"id":"D50","tema":"Reflexo das horas extras habituais nos repousos","padrao":"Estimado pela razão entre dias de repouso e dias de trabalho da semana (2/5 na 5x2, 3/4 na 4x3), considerando os dois repousos semanais remunerados (CF, art. 7º, XV; Lei 605/1949, art. 7º; Súmula 172 do TST)","alternativa":"Só o repouso semanal de um dia, ou a conta mês a mês por dias úteis e repousos","origem":"proposta","situacao":"a validar: a incidência sobre o segundo repouso decorre da nova redação do inciso XV e ainda não tem jurisprudência","regras":[]},{"id":"D51","tema":"Horas extras em revezamento como alternativa","padrao":"Quando o cenário encurta o horário de hoje, as pessoas necessárias estendem a jornada em revezamento até a entrada ou a saída de hoje, só se a extensão for de até 2 h por dia (CLT, art. 59), a jornada total ficar em até 10 h e restarem 11 h até a jornada seguinte (art. 66). Não cobrem dia em que o turno deixa de abrir (seria trabalho em dia de repouso) nem jornadas que já chegam a 10 h, como a 12x36. Sem encurtamento, a perda de horas é repartida entre os dias de trabalho dos integrais, com o aviso de que horas extras não repõem a pessoa que falta num dia. A hora extra habitual integra a remuneração e sua supressão após um ano gera indenização (Súmula 291 do TST)","alternativa":"—","origem":"pedido","situacao":"a validar","regras":["J1","J2","R5"]},{"id":"D52","tema":"Custo de manter a escala de hoje","padrao":"Referência, não caminho de conformidade: cada repouso semanal que falta para chegar a dois é dia de repouso trabalhado pago em dobro (Súmula 146 do TST, por analogia, 2 × salário/30); as horas dos demais dias acima de 40 h são extras, com o adicional informado e reflexo nos repousos; encargos informados. Não inclui multas administrativas, dano moral coletivo nem custos de processo","alternativa":"Tratar todo o excedente como hora extra, sem dobra","origem":"pedido","situacao":"a validar (protótipo de 29/10/2026)","regras":["R1","J3"]},{"id":"D53","tema":"Calculadora de encargos por regime","padrao":"Lucro real ou presumido: 20% de contribuição patronal, RAT × FAP e terceiros conforme o FPAS (Lei 8.212/1991, art. 22), FGTS de 8% (Lei 8.036/1990, art. 15), provisões de 13º (1/12) e de férias com o terço (1/9), e os encargos sobre as provisões. Simples Nacional, Anexos I a III e V: só FGTS e provisões; Anexo IV: contribuição patronal e RAT à parte, sem terceiros. Só no perfil do escritório, com conferência pela contabilidade","alternativa":"Percentual informado diretamente","origem":"proposta","situacao":"a validar","regras":[]},{"id":"D54","tema":"Entrada por grupos","padrao":"Uma linha por grupo de pessoas com a mesma escala e o mesmo horário. A necessidade por dia passa a ser a cobertura de hoje (pessoas × dias de trabalho da escala, divididas pelos dias de funcionamento; a sobra vai para sábado, sexta e segunda), ajustável; grupos com o mesmo horário e dias formam um só turno; o intervalo é o mínimo do art. 71 da CLT pela duração da presença, salvo informação diferente no perfil do escritório; empregados com nomes genéricos e folgas distribuídas pelo planejador","alternativa":"Cadastro individual com folgas (simulador completo)","origem":"pedido","situacao":"protótipo para teste de uso; a cobertura presumida supõe que o quadro de hoje reflete a necessidade","regras":[]},{"id":"D55","tema":"Caminhos comparados","padrao":"Até quatro por grupo: sem contratar (menor perda de produção), sem contratar com horas extras em revezamento (só se as horas extras repõem toda a perda), mantendo a operação (sem perda, menor custo) e com norma coletiva (só se, na etapa de 40 h, for mais barato ou contratar menos que manter a operação, ou perder menos que o sem contratar). Sugerido: o sem contratar quando o horário pode mudar; senão, o de menor custo sem perda de produção, exceto o que depende de negociação. Produção perdida medida pelas horas que cobrem a necessidade","alternativa":"—","origem":"pedido","situacao":"protótipo para teste de uso","regras":[]},{"id":"D56","tema":"Entrada em quatro etapas, por função","padrao":"Empresa (setor com funções e horários sugeridos, dias e horário de funcionamento, se o funcionamento pode mudar, regime tributário), Equipe (uma ficha por função com escala, salário, dias e um ou mais turnos com pessoas), Movimento (opcional) e Custos (opcional). Funções diferentes não se juntam no cálculo, porque uma não cobre a necessidade da outra; os dias de funcionamento não se confundem com os dias de trabalho de cada pessoa","alternativa":"Cadastro individual (versão 1) ou pergunta única (protótipos)","origem":"pedido","situacao":"adotado em 05/11/2026 (meio-termo após o teste do simulador do Sebrae)","regras":[]},{"id":"D57","tema":"Faturamento por dia na escolha dos dias","padrao":"Opcional. Quando informado por dia e marcado para uso: as folgas desempatam pelos dias de menor faturamento, o tempo parcial vai para os de maior, os dias acima da média ficam protegidos quando o quadro não cobre tudo (cada dia fraco perde no máximo metade da necessidade) e, se for preciso deixar de abrir, fecha-se o de menor faturamento entre os que estão abaixo da média. A necessidade de cada turno continua sendo a cobertura de hoje; o faturamento é aproximação do movimento","alternativa":"Redistribuir a necessidade pelo faturamento","origem":"pedido","situacao":"adotado em 05/11/2026","regras":[]},{"id":"D58","tema":"Caminhos para os dias que ficam com menos gente","padrao":"A partir do 5x2 com o quadro de hoje: E, contrato intermitente em todos os setores (hora pelo salário-hora da função, 13º e férias com o terço proporcionais, repousos remunerados pela razão 2/5 da D50 e encargos sem as provisões; CLT, arts. 443, § 3º, e 452-A); F, diárias de freelancer só em varejo e bares e restaurantes, pelo valor informado, sem encargos, com o aviso de risco de vínculo quando a mesma pessoa vier toda semana (CLT, art. 3º)","alternativa":"Diárias em todos os setores ou em nenhum","origem":"pedido","situacao":"substituído pela D77 em 10/11/2026","regras":[]},{"id":"D59","tema":"Domingo em bares e restaurantes","padrao":"Aplica a regra do comércio de folga em um domingo a cada três semanas (Lei 10.101/2000, art. 6º, parágrafo único), leitura mais cautelosa; pode ser desligada nos ajustes avançados","alternativa":"Regime das atividades com autorização permanente para o trabalho aos domingos, sem a regra das três semanas","origem":"proposta","situacao":"a validar","regras":["R4"]},{"id":"D60","tema":"Encargos padrão","padrao":"Pelo regime informado: Simples (Anexos I a III e V) só FGTS e provisões; Anexo IV com contribuição patronal e RAT; lucro presumido ou real com contribuição patronal, RAT e terceiros. Sem RAT e terceiros informados, 2% de RAT com FAP 1 e 5,8% de terceiros; regime não informado é tratado como lucro presumido ou real (o mais caro)","alternativa":"Percentual único informado","origem":"proposta","situacao":"a validar","regras":[]},{"id":"D61","tema":"Desempates do caminho sem contratar","padrao":"Com a mesma perda de horas, prefere menos gente nos dias fracos a deixar de abrir um dia. Sem faturamento por dia, no comércio o sábado é o último dia a deixar de abrir; nas demais atividades, a ordem anterior (domingo, sábado, segunda…)","alternativa":"—","origem":"proposta","situacao":"adotado em 05/11/2026","regras":[]},{"id":"D62","tema":"Escala editada","padrao":"Nas escalas semanais, cada dia pode ser trocado entre trabalho e folga; o motor confere as semanas exibidas, sem repetição, com os instrumentos e a atividade do cenário, e aponta por pessoa os problemas e os dias com menos gente que a escala sugerida. Escalas em ciclo de plantões (12x36, 6x2) não são editáveis","alternativa":"—","origem":"proposta","situacao":"adotado em 05/11/2026","regras":[]},{"id":"D63","tema":"Escala personalizada de hoje","padrao":"Ciclo de 1 a 6 semanas informado dia a dia: folga, jornada do turno ou outra duração (com a entrada do turno e o intervalo mínimo do art. 71 para essa duração). Com revezamento, cada pessoa começa o ciclo numa semana diferente; sem ele, todos estão na mesma semana. A necessidade de cada dia é a presença média no ciclo; o horário de cada dia nos cenários é a jornada mais frequente desse dia","alternativa":"Lista fechada de escalas","origem":"pedido","situacao":"adotado em 05/11/2026","regras":[]},{"id":"D64","tema":"Calendário de 2027","padrao":"A escala de hoje e a do caminho escolhido avaliadas no motor de 01/01 a 31/12/2027. Vermelho: algum achado que não cumpre cobre o dia; âmbar: depende de norma ainda não firmada ou fica menos gente que a necessidade de hoje; verde: cumpre e cobre; cinza: ninguém escalado e sem necessidade (os problemas da semana aparecem na janela do dia). Feriados nacionais marcados e tratados como dias normais; a escala editada se repete a cada ciclo exibido","alternativa":"—","origem":"pedido","situacao":"adotado em 05/11/2026","regras":[]},{"id":"D65","tema":"Comparação dos caminhos","padrao":"Uma linha por caminho com o que a empresa faz em termos concretos (dias com menos gente, contratações, intermitentes, diárias), barra de custo mensal contra a folha de hoje, contratações, trabalho perdido e segurança jurídica; caminhos que não se aplicam aparecem com o motivo","alternativa":"Cartões","origem":"pedido","situacao":"adotado em 05/11/2026","regras":[]},{"id":"D66","tema":"Horário por dia","padrao":"Funcionamento da empresa com horário próprio em cada dia (o padrão vale para todos até ser alterado). Nas escalas semanais (6x1, 5x2, 4x3, tempo parcial), cada turno pode ter entrada e saída diferentes por dia, com o intervalo mínimo do art. 71 pela duração do dia; o diagnóstico e os cenários usam o horário de cada dia. O faturamento por dia aceita todos os dias, e a ficha da função avisa quando ela trabalha em dia fechado na empresa","alternativa":"Horário único","origem":"pedido","situacao":"adotado em 06/11/2026","regras":[]},{"id":"D67","tema":"Planilha de preenchimento rápido","padrao":"Modelo com as abas Instruções, Empresa, Funcionamento e Equipe (uma linha por turno), lido no navegador e convertido nas etapas do simulador, com resumo do que entrou, avisos do que não foi aproveitado e opção de desfazer. Fica de fora o que só a simulação completa capta: horário por dia nos turnos, escala personalizada, intervalo, 12x36 com intervalo pago, normas coletivas e ajustes do escritório; o aviso de precisão aparece junto ao botão","alternativa":"—","origem":"pedido","situacao":"substituído pela D78 em 10/11/2026","regras":[]},{"id":"D68","tema":"Downloads fora do claude.ai","padrao":"No claude.ai, o PDF, o Excel e o modelo de planilha saem pela capacidade de downloads, que só funciona para quem está conectado a uma conta do Claude; a página avisa os demais e aponta para os endereços públicos configurados (modelo e cópia hospedada). A mesma página, aberta fora do claude.ai (site do escritório ou arquivo no navegador), baixa os três arquivos direto, sem conta. O claude.ai não serve .xlsx como arquivo anexo à página","alternativa":"—","origem":"pedido","situacao":"adotado em 06/11/2026","regras":[]},{"id":"D69","tema":"Setores e cargos","padrao":"Doze setores com base no simulador Escala Sebrae (consultado em 10/11/2026), mais \"Outro setor\"; cada setor traz uma lista fechada de cargos com escala, duração e dias sugeridos, e a opção \"Outro cargo\" para digitar. Indústria, logística e agro ampliados para empresas médias e grandes (montador, operador de máquinas, inspetor de qualidade, técnicos de manutenção, separador, conferente, almoxarife e outros). As sugestões valem até a pessoa mexer na escala ou no horário da função. Cargos com regra própria trazem a nota: fisioterapeuta (Lei 8.856/1994), técnico em radiologia (Lei 7.394/1985), teleatendimento (NR-17, Anexo II; CLT, art. 227), professor (CLT, arts. 317 a 323), motorista profissional (Lei 13.103/2015), motociclista (CLT, art. 193, § 4º) e trabalho rural (Lei 5.889/1973). Atividade para o motor: comércio para varejo e alimentação (D59); os demais como serviços ou indústria, como antes","alternativa":"Lista anterior de oito setores","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D70","tema":"Salário por hora","padrao":"O salário de cada função pode ser informado por mês ou por hora. Por hora, o mensal é a hora × o divisor da jornada de hoje, horas semanais × 5 (220 para 44 h; 200 para 40 h), com as horas semanais medidas na escala informada (média dos turnos pelas pessoas); o divisor pode ser informado. O mensal assim obtido é o que se mantém depois da Emenda Constitucional 141 (Fim da 6x1), art. 2º (D49), e a hora sobe com a jornada menor. Na 12x36 a fórmula dá 192,5 com intervalo tirado e 210 com intervalo pago; há normas coletivas com 180 ou 210, por isso o aviso e o campo do divisor (a validar)","alternativa":"Divisor 180 ou 210 fixo na 12x36","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026; em parte superado pela D90 em 12/11/2026 (o valor por hora passa a indicar horista)"},{"id":"D71","tema":"Dados setoriais da tela inicial","padrao":"Só números com fonte conferida: proporção de vínculos CLT acima de 40 h por setor (DIEESE, Emprego em Pauta nº 32, maio/2026, Gráfico 2, RAIS 2024), 75% e 36,6 milhões no total, e as estimativas do MTE sobre a 6x1 (33,2% dos vínculos de 44 h, cerca de 15 milhões; alojamento 52%, alimentação 47,1%, comércio 42,2%), na forma divulgada pelo DIEESE. A projeção \"até +x% de pessoas\" é cálculo do simulador (proporção acima de 40 h × 10%, supondo 44 h), identificada como tal e tratada como teto. Não usamos os percentuais de expectativa de impacto que o Escala Sebrae atribui à Pesquisa Pulso, 12ª edição, porque não batem com o relatório público da pesquisa (27% no total)","alternativa":"Reproduzir os números do Escala Sebrae","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D72","tema":"Resultado em abas","padrao":"O resultado abre com o diagnóstico e a linha do tempo da escala de hoje em cada etapa (hoje, 16/12/2026 e 16/12/2027). Os caminhos viram abas (recomendado, sem contratar, horas extras, contratar e os que se aplicarem), com a folha de hoje ao lado da folha do caminho, contratações, horas de trabalho e segurança jurídica, e um parágrafo que compara os caminhos com os valores calculados. A tabela completa fica num bloco que se abre. A escala semanal mostra a transição (até 42 h) e a definitiva (40 h); só a definitiva é editável. Fora do claude.ai, a escala sugerida também sai em arquivo de agenda (.ics), com pessoas identificadas só por número","alternativa":"Tabela de caminhos como primeira leitura","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D73","tema":"Perfil único","padrao":"Sem a escolha entre empresa e escritório: um fluxo só, com os ajustes que eram do escritório (encargos item a item, adicionais, normas coletivas, férias no dimensionamento, domingo do comércio, intervalo e flexibilidade por função, caminho por função e detalhe jurídico) disponíveis a todos e recolhidos em blocos que se abrem","alternativa":"Dois perfis","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D74","tema":"Sem horário de funcionamento da empresa","padrao":"A etapa de funcionamento saiu. O que importa é a cobertura de cada função: cada uma tem os seus dias de trabalho (sugeridos pelo cargo ou pelo setor) e os seus turnos, e o resultado mostra, função por função, se o período fica coberto como hoje. Nome, regime tributário e a pergunta se a empresa aceita reorganizar para não contratar ficam na etapa do setor. Na planilha, a aba Funcionamento virou Faturamento (opcional); a aba antiga ainda é lida, só pelo faturamento","alternativa":"Funcionamento da empresa por dia (D66)","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D75","tema":"Início em branco","padrao":"A simulação começa sem setor e sem funções, sem exemplo pré-carregado; a equipe é montada cargo a cargo. A simulação salva no navegador aparece na tela inicial como \"Continuar simulação\", ao lado de \"Nova simulação\"","alternativa":"Loja de exemplo pré-carregada","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D76","tema":"Resultado no formato do Sebrae, com as horas perdidas","padrao":"Depois do diagnóstico e da linha do tempo, um bloco mostra quanto a equipe deixa de trabalhar por mês sem contratar e sem hora extra: pelo novo teto (42 h e 40 h, soma pessoa a pessoa das horas acima do teto, o mínimo) e pela escala que cumpre sem contratar (caminho \"manter a equipe\", que pode perder mais quando mantém o horário diário de hoje em cinco dias), e o custo de não mudar a escala. Os caminhos ficam em abas: manter a equipe (sem hora extra ou pagando hora extra), contratar +N (reposição integral), tempo parcial, freelancer, norma coletiva e o recomendado; cada aba compara a folha de hoje com a do caminho e diz as horas, as contratações e a segurança jurídica. Horas por mês: horas semanais × 365/12/7","alternativa":"Resultado em tabela de caminhos","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D77","tema":"Sem intermitente; tempo parcial e freelancer","padrao":"O contrato intermitente não é sugerido. O reforço em tempo parcial (CLT, art. 58-A: até 30 h por semana, salário proporcional, dois repousos) entra como caminho próprio (P) quando o melhor contratar é outro, e já aparece dentro do contratar quando ele é o mais barato. Diárias de freelancer só em varejo, alimentação e hospedagem e só quando o que falta cai em até dois dias por semana. Ressalva: o limite de dois dias por semana vem da lei do trabalho doméstico (LC 150/2015, art. 1º); para empresas, o critério é a não eventualidade (CLT, art. 3º), e a mesma pessoa toda semana, mesmo em um ou dois dias, pode ser reconhecida como empregada","alternativa":"Intermitente em todos os setores e diárias sem limite de dias (D58)","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D78","tema":"Entrada por planilha retirada","padrao":"A pedido, a equipe é montada só pelas etapas do simulador: o botão de importar, o modelo de planilha e o arquivo do modelo no pacote do site saem. A exportação em Excel do resultado continua","alternativa":"Planilha de preenchimento rápido (D67)","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026; substitui a D67"},{"id":"D79","tema":"Regime de média do § 2º no resumo e no calendário","padrao":"Com a norma coletiva de média de repousos cadastrada, a semana com um repouso só (R1) fica atendida pela norma quando os meses que ela toca, e que foram apurados, cumprem a média (R2 com a norma); a situação passa a cumpre com a norma coletiva. O calendário segue a mesma regra. Mês fora da janela apurada não conta contra","alternativa":"R1 como descumprimento mesmo com a média cumprida (comportamento anterior)","origem":"derivado","regras":["R1","R2"],"situacao":"adotado em 10/11/2026 (planejador; casos PL31 e PL32); o critério da média continua a validar (D16, pergunta 6a)"},{"id":"D80","tema":"Exercício: folgas pela média do mês","padrao":"Opcional, ligado na etapa da equipe e aberto numa seção própria do resultado, que não altera o resultado principal. Para cada função, fora 12x36 e tempo parcial: ciclos prontos 6-4-5-4 (9 repousos em 28 dias), 6 e 4 alternados (8 em 28) e 6x2 (só com os sete dias), ou ciclo montado dia a dia. Nos prontos, as folgas caem nos dias da função, espalhadas e de preferência emendadas, sem sete dias seguidos (também na volta do ciclo), com domingo de folga a cada duas semanas no comércio, até 8 h por dia e até 40 h por semana (6h40 na semana de seis dias). Conferido no motor com a norma de média cadastrada, nas duas etapas, pelo critério A; mostra horas por pessoa e da função, presença média por dia e a folha, que não muda. Aviso fixo: depende de convenção ou acordo coletivo (CF, art. 7º, § 2º; D46)","alternativa":"Só a opção avançada de média de repousos, que muda o resultado principal","origem":"pedido","regras":["R1","R2","R3","R4","J3"],"situacao":"adotado em 10/11/2026; em todos os ciclos testados, dezembro de 2026 (regra a partir de 16/12, mês parcial) fica abaixo do mínimo para parte da equipe: contagem do mês parcial a validar"},{"id":"D81","tema":"Distribuição da equipe nas 24 horas","padrao":"Barras empilhadas por hora, uma cor por função pela posição na equipe (da oitava em diante, Outras funções), na etapa da equipe e no resultado antes dos caminhos; no resultado, alterna com a escala do caminho escolhido (etapa de 40 h, editada se for o caso, mais as diárias), no mesmo eixo. Presença no local da entrada à saída, com o intervalo; folgas em rodízio pela média (dias por semana da escala ÷ dias marcados; 12x36, metade; 6x2, seis de oito; personalizada, média do ciclo); dia escolhido ou média dos dias de funcionamento; legenda, dica e tabela","alternativa":"—","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D82","tema":"Nome e salário de cada pessoa","padrao":"Opcionais, por turno, como no Escala Sebrae. Em branco, vale o salário do cargo; informado por hora, vale a hora × o divisor da função. O custo de hoje soma os salários; no cálculo, cada turno usa a média das suas pessoas (os custos são lineares no salário) e as contratações entram por essa média. Os nomes rotulam as escalas, o calendário, o PDF, o Excel (aba Equipe) e a agenda e ficam guardados só no navegador, com aviso de cuidado ao compartilhar (LGPD)","alternativa":"Um salário médio por função","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D83","tema":"Mulheres: folga num domingo a cada duas semanas (CLT, art. 386)","padrao":"Opcional: o usuário marca quem é mulher (nos textos, folga 1:1 aos domingos) na tabela de pessoas de cada função, com aviso. Para as marcadas, o motor confere o domingo de folga a cada duas semanas, também no comércio, no lugar das três semanas da Lei 10.101/2000, como entendem a SDI-1 (E-ED-RR-619-11.2017.5.12.0054) e a SDC (ROT-0001503-12.2024.5.21.0000) do TST; sem tese vinculante do STF. Havendo mulher no turno e trabalho aos domingos, o planejador monta os rodízios com domingo de folga a cada duas semanas para todos do turno, o que pode exigir mais contratações; rodízios separados por sexo não estão no simulador","alternativa":"Só apontar a falha, sem refazer as escalas; ou manter a regra de três semanas no comércio também para as mulheres (comportamento anterior do motor)","origem":"pedido","regras":["R4"],"situacao":"adotado em 10/11/2026"},{"id":"D84","tema":"Datas para iniciar férias","padrao":"No calendário de 2027, a vista Datas para iniciar férias mostra, por pessoa e pela escala exibida, os dias em que as férias podem começar: vedados os dois dias que antecedem feriado ou repouso (CLT, art. 134, § 3º), contando os dois repousos semanais, por cautela; repouso e feriado indicados como dias a evitar; sábado e domingo vedados só com a opção marcada (o PN 100 do TST foi cancelado em 30/06/2025). Feriados nacionais do motor mais os estaduais e municipais informados, com sugestões de Paixão, Corpus Christi, Carnaval e 9 de julho (SP). Resumo das regras de férias da CLT (arts. 134 a 145). O período concessivo não é calculado, por falta da data de admissão","alternativa":"Contar só um repouso semanal na vedação; vedar sempre sábado e domingo","origem":"pedido","regras":["F1"],"situacao":"adotado em 10/11/2026"},{"id":"D85","tema":"Nome da emenda nos textos","padrao":"Onde constava a sigla da emenda, o simulador passa a dizer Emenda Constitucional 141 (Fim da 6x1); dentro de parênteses, Emenda Constitucional 141 – Fim da 6x1. No rótulo do ícone do aplicativo, que só comporta nome curto, Fim da 6x1","alternativa":"Manter a sigla","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D86","tema":"Todas as escalas testadas e por que ficaram de fora","padrao":"Para cada turno, o planejador calcula 5x2 em rodízio e com folgas fixas, com tempo parcial, com o quadro de hoje (menos gente ou sem abrir dias), escalonado, com jornada ampliada na transição, 4x3, 6x2 e, agora também para turnos que não são plantão, 12x36 com plantão de 12 h em operação de sete dias com o mesmo horário (dependente de norma coletiva, D39). As famílias que não chegam a ser calculadas saem com o motivo (ex.: 12x36 em operação de seis dias, 4x3 quando a jornada não cabe em 10 h, 6x2 com horário variável). No resultado, a seção Todas as escalas que o simulador testou lista cada escala com a situação, contratações, custo a partir de 16/12/2027, horas perdidas e os motivos de não ter sido a escolhida, comparada ao caminho exibido","alternativa":"Mostrar só os caminhos escolhidos (comportamento anterior; a lista completa ficava apenas no detalhe jurídico, sem motivos)","origem":"pedido","regras":[],"situacao":"adotado em 11/11/2026 (caso PL35)"},{"id":"D87","tema":"Manual e tutorial","padrao":"Na tela inicial, Como preencher, passo a passo: o que ter em mãos, o que cada etapa pede e o que quer dizer cada escala, sem termos jurídicos. Em todas as páginas, botão Tutorial Passo a Passo no alto da tela, que destaca cada campo e explica em linguagem simples, passo a passo (Voltar, Próximo, Fechar, teclado e celular); os passos de campos ausentes na tela são pulados","alternativa":"—","origem":"pedido","regras":[],"situacao":"adotado em 11/11/2026; botão levado para o alto da página a pedido"},{"id":"D88","tema":"Modo simplificado e modo completo","padrao":"Ao começar, a pessoa escolhe o modo. Simplificado: setor, regime tributário e, por cargo, pessoas, salário mensal, escala e horário de hoje; dias típicos do setor, com a opção Personalizar dias (dias do cargo e de cada pessoa); sem faturamento, custos, nomes, folga 1:1 aos domingos, turnos múltiplos, horário por dia nem exercício; resultado com aviso de precisão aproximada e botão para passar ao completo, que aproveita tudo. Completo: todas as etapas, recomendado para RH, DP, Jurídico, Operações e Diretoria. O modo pode ser trocado a qualquer momento pelo topo","alternativa":"Um modo só","origem":"pedido","regras":[],"situacao":"adotado em 11/11/2026; dias do cargo e de cada pessoa liberados no simplificado a pedido"},{"id":"D89","tema":"Dias de trabalho de cada pessoa","padrao":"Opcional, nos dois modos, nas escalas semanais (6x1, 5x2, 4x3, tempo parcial): o usuário marca os dias em que cada pessoa trabalha hoje; sem marcação, a pessoa segue o rodízio do cargo. Os dias informados entram na necessidade de cada dia, no gráfico das 24 horas e viram as folgas da escala de hoje no motor; as folgas de quem segue o rodízio cobrem o que sobra da necessidade. Aviso quando o número de dias difere do previsto pela escala. Na 12x36, no 6x2 e na personalizada, que giram em ciclo, não se aplica","alternativa":"Só dias por cargo","origem":"pedido","regras":["R1"],"situacao":"adotado em 11/11/2026 (caso G16)"},{"id":"D90","tema":"Forma de pagamento do cargo","padrao":"Cada cargo informa como recebe: mensalista (salário por mês) ou horista (valor da hora). O valor por hora deixa de ser só uma forma de digitar o salário: indica horista. Hoje, o mês do horista é a hora × o divisor da jornada (horas semanais × 5, ou o informado), como na D70","alternativa":"Manter o valor por hora como simples conversão para mensal","origem":"pedido","regras":[],"situacao":"adotado em 12/11/2026"},{"id":"D91","tema":"Os dois repousos remunerados do horista","padrao":"Três leituras, com a literal como padrão: (1) literal, cada repouso vale a jornada normal do dia, horas da semana ÷ dias de trabalho (Lei 605/1949, art. 7º, b): 40 h em 5 dias dão 56 h pagas por semana, 240 h no mês; (2) 1/6, cada repouso vale 1/6 das horas da semana, o critério de hoje: 228,6 h no mês; (3) só reajuste, a hora sobe para manter o mês de hoje e o horista custa o mesmo que o mensalista. Mês = hora × (horas da semana + repousos) × 30 ÷ 7, a mesma base do divisor de hoje (44 h × 7/6 × 30/7 = 220). São remunerados até dois repousos por semana (o terceiro dia livre da 4x3 é compensação); na 12x36 a remuneração já abrange os repousos (CLT, art. 59-A, parágrafo único). Quem já está no quadro nunca recebe menos que hoje (Emenda Constitucional 141, art. 2º); contratações seguem a mesma conta, sem esse piso. Nas leituras literal e 1/6, hora extra e adicional noturno usam a hora contratada; no só reajuste, a hora reajustada","alternativa":"Só reajuste como padrão (V. Müller, Migalhas, 29/10/2026), ou o segundo repouso pago à parte também ao mensalista (J. O. Schäfer, Jus, 23/10/2026)","origem":"pedido","regras":[],"situacao":"a validar: sem regulamentação nem jurisprudência; padrão literal escolhido pelo usuário em 12/11/2026, por ser o mais cauteloso para o custo; a liminar na ADI 8.041 (item III) remete as condições da neutralidade salarial a lei ou decreto"},{"id":"D92","tema":"Quadro horista × mensalista","padrao":"Quando algum cargo é horista, o resultado mostra a folha por mês a partir de 16/12/2027, no caminho escolhido (o mesmo caminho em todas as formas), como mensalista com o salário de hoje e como horista nas três leituras da D91, com a diferença para o mensalista; a leitura usada em todo o resultado é escolhida ali. Aviso: trocar horista por mensalista só reduz o custo se o mensal ficar no valor de hoje, o que tira o valor do segundo repouso e pode ser anulado (CLT, arts. 9º e 468; Emenda Constitucional 141, art. 2º); a troca que acompanha o que o horista receberia tem pouco risco e não economiza; para buscar economia, negociar com o sindicato. O quadro vai também para o PDF e para a aba “Horista x mensalista” do Excel","alternativa":"—","origem":"pedido","regras":[],"situacao":"adotado em 12/11/2026"},{"id":"D93","tema":"Ranking das opções no resultado","padrao":"O resultado começa pela comparação de todas as opções, em ordem, com 1º, 2º e 3º para as três primeiras. O usuário escolhe o que pesa mais: segurança jurídica (padrão: cumprir sem depender do sindicato, depois manter as horas de trabalho, depois o menor custo), menor custo (a mais barata entre as que cumprem) ou manter a operação (sem perder horas, depois o custo; a norma coletiva só desempata). Opções com risco de passivo ficam sempre por último e fora do pódio; opções que dão exatamente o mesmo resultado em todas as funções se fundem. A opção exibida é a escolhida pelo usuário ou, sem escolha, a 1ª do ranking; em cada função vale o caminho pelo mesmo critério. O PDF e a aba “Opções” do Excel seguem a mesma ordem","alternativa":"Ordem fixa definida pelo simulador","origem":"pedido","regras":[],"situacao":"adotado em 12/11/2026; critério escolhido pelo usuário"},{"id":"D94","tema":"Telas enxutas, com blocos que se abrem","padrao":"Cada bloco de detalhe mostra só o título e um resumo de uma linha, com um botão “Abrir” claro; o conteúdo aparece ao clicar. Ficam abertos de início só o veredito e a comparação das opções. O impacto por função mostra uma linha por função, que se abre ao clicar. Vale também para a página inicial (manual e números), para o contexto do setor, para o exercício pela média, para as contas e premissas e para os custos avançados","alternativa":"—","origem":"pedido","regras":[],"situacao":"adotado em 12/11/2026"},{"id":"D95","tema":"O que significa poder reduzir o funcionamento","padrao":"A pergunta do passo 1 trata do período do dia em que a equipe precisa estar coberta, não da entrada e da saída de cada pessoa, que podem mudar sempre dentro desse período. “Não” compõe as escalas e o quadro dentro do período informado (por exemplo, 9 h às 22 h). “Sim” permite cenários que fecham mais cedo, abrem mais tarde ou fecham um dia, só na medida do necessário para a jornada caber (por exemplo, de 8h48 para 8 h). Ampliar o período não conta como redução e só gera nota. Aceitar menos gente nos dias fracos virou pergunta separada; sem resposta, segue a do funcionamento","alternativa":"Cenário fixo de fechar 1 h mais cedo (não incluído: o simulador reduz só o que a jornada exige)","origem":"pedido","regras":[],"situacao":"adotado em 12/11/2026; substitui a leitura anterior de “mudar horário”"},{"id":"D96","tema":"Início do novo formato e período do calendário","padrao":"O usuário escolhe a data de início do novo formato e se começa com 42 h (passando a 40 h em 16/12/2027) ou já com 40 h. O calendário, as datas de férias, a escala e a agenda (ICS) vão do início até 31/12/2027; se o início for antes de 16/12/2026, o calendário começa nele. Início depois de 16/12/2026 é aceito com aviso: os dias entre 16/12/2026 e o início usam a escala de hoje e aparecem como período que não cumpre a Emenda Constitucional 141","alternativa":"Calendário fixo do ano de 2027","origem":"pedido","regras":[],"situacao":"adotado em 12/11/2026; período e aviso escolhidos pelo usuário"},{"id":"D97","tema":"Cobertura hora a hora no dia do calendário","padrao":"Os gráficos da equipe nas 24 horas saíram do resultado. Ao clicar num dia do calendário, a janela começa por uma linha do tempo de 24 h com o número de pessoas escaladas em cada horário (faixas de 15 minutos, da entrada à saída, incluindo quem vem da noite anterior) contra a necessidade do dia no horário de funcionamento; a falta aparece em vermelho. O intervalo de refeição não é descontado, porque a empresa o reveza dentro do turno","alternativa":"Descontar o intervalo de cada pessoa, o que mostraria falta falsa no horário de almoço","origem":"pedido","regras":[],"situacao":"adotado em 12/11/2026"},{"id":"D98","tema":"Gente a mais que o necessário num dia","padrao":"A escala não demite: o quadro fica o de hoje ou cresce em pessoas inteiras, e as folgas já se espalham para a sobra cair nos dias em que menos pesa. Os dias com sobra recebem a marca “+” no calendário, e a janela do dia explica a causa: reserva de férias, turno fechado em algum dia, regra do domingo (folga a cada duas semanas das mulheres, CLT, art. 386, ou a cada três no comércio) ou arredondamento em pessoas inteiras. Quando há mulheres no turno e trabalho aos domingos, o simulador testa também dois rodízios no mesmo turno: as mulheres cobrem a parte proporcional a elas com domingo a cada duas semanas, e os demais seguem a regra comum; a opção só aparece se usar menos gente que o 5x2 com a regra das mulheres aplicada a todos","alternativa":"Aplicar a regra do art. 386 à equipe inteira (o que aumenta o quadro)","origem":"pedido","regras":["R3"],"situacao":"adotado em 12/11/2026; a leitura do art. 386 segue a validar"},{"id":"D99","tema":"Revezamento de 4x3 e 6x1 com média mensal de repousos","padrao":"Com norma coletiva que traga a média mensal de repousos (CF, art. 7º, § 2º, na redação da Emenda Constitucional 141) e banco de horas, o simulador testa dois ciclos com dias de até 8 h: 4x3 e 6x1 alternados (8 folgas em 28 dias, o que não cumpre o critério A nos meses de 30 e 31 dias) e 4x3, 6x1, 4x3 e 5x2 (9 folgas em 28 dias, média de 38 h por semana), com semanas de 32 e 48 h compensadas como na “semana espanhola” (OJ 323 da SDI-1). Com os sete dias de funcionamento, cada pessoa segue o ciclo começando num dia diferente; com seis, as semanas ficam alinhadas ao calendário. Até 3/1/2027 a escala é 5x2, para o mês parcial de dezembro de 2026 não falhar a média, com as folgas alinhadas ao início do ciclo de cada pessoa para não passar de seis dias seguidos. Nos casos testados, o ciclo não usa menos gente que o 5x2","alternativa":"Critério C de média, pelo qual o ciclo 4x3 e 6x1 puro passaria","origem":"pedido","regras":["R2","R3"],"situacao":"a validar: depende de norma coletiva e do critério de média adotado (D16); com a liminar na ADI 8.041, o ciclo puro cumpre com a norma e o preâmbulo sai (D102)"},{"id":"D100","tema":"Liminar na ADI 8.041 (STF, 12/11/2026)","padrao":"O motor e o simulador aplicam a medida cautelar deferida em parte pelo Min. Flávio Dino nas ADIs 8.041 e 8.042 (efeito para todos e eficácia imediata, pendente de referendo do Plenário). Uma chave no resultado simula sem a liminar, com as leituras de antes da decisão; a chave vai também para o PDF e o Excel. No motor, a configuração liminar (padrão ligada) e a leitura alternativa “Sem a liminar” nas divergências","alternativa":"Aplicar sempre, sem a chave","origem":"pedido","regras":["J1","J4","R2","R10","R13"],"situacao":"adotado em 12/11/2026; escolha do usuário"},{"id":"D101","tema":"Até 8h24 por dia sem norma coletiva na etapa de 42 h (item I da liminar)","padrao":"Sem convenção ou acordo coletivo, de 16/12/2026 a 15/12/2027, a semana de cinco dias de trabalho com dias de até 8h24 e até 42 h cumpre J1 sem adicional sobre os 24 minutos. Só a semana de cinco dias (leitura literal); a semana com menos dias por férias ou afastamento conta como de cinco; a 4x3 com dias acima de 8 h segue exigindo acordo de compensação. Dias acima de 8h24 seguem a leitura do escritório (norma coletiva do art. 7º da Emenda). Menor e aprendiz ficam fora. Na compensação do mês e no banco de horas, a semana da liminar tem base nas próprias horas até 42 h, sem gerar crédito abaixo de 40 h. O cenário 5x2 de até 8h24 até dez/2027 deixa de depender de negociação; a opção “Manter a equipe” continua com o 5x2 de 8 h e aponta o de 8h24 como alternativa até 15/12/2027","alternativa":"Admitir 8h24 em qualquer semana de até cinco dias; tornar o 5x2 de 8h24 a escolha padrão de “Manter a equipe”","origem":"pedido","regras":["J1","J4","J5"],"situacao":"a validar; leitura literal escolhida pelo usuário em 12/11/2026"},{"id":"D102","tema":"Repousos com norma coletiva sem trava na semana e no mês (item IV da liminar)","padrao":"Com norma coletiva de média de repousos, o § 2º deixa de ser apurado no mês-calendário: o motor confere pelo menos 8 repousos em cada janela de 28 dias seguidos, a partir de 16/12/2026 (proporcional aos dias em serviço). Substitui o critério A da D16 enquanto a liminar estiver ligada. O revezamento 4x3 e 6x1 puro passa a cumprir com a norma; o preâmbulo de 5x2 até 03/01/2027 (D99) deixa de ser usado com a liminar. A 6x2 continua abaixo do mínimo (6 ou 7 repousos em algumas janelas)","alternativa":"Mês-calendário pelo critério A; saldo no ano da norma","origem":"pedido","regras":["R2"],"situacao":"a validar; janela de 4 semanas escolhida pelo usuário em 12/11/2026"},{"id":"D103","tema":"Máximo de seis dias seguidos com norma coletiva","padrao":"Mesmo com a liminar e com norma coletiva, R3 continua: no máximo 6 dias seguidos de trabalho (CLT, art. 67; Lei 605/1949; OJ 410 da SDI-1), porque a liminar trata da trava constitucional e não menciona essas normas","alternativa":"Afastar R3 quando houver norma coletiva","origem":"pedido","regras":["R3"],"situacao":"adotado em 12/11/2026; escolha do usuário"},{"id":"D104","tema":"Demais itens da liminar","padrao":"Contratos com a administração pública (item VII): prazo máximo de 180 dias da publicação para o aditamento, até 13/04/2027 (vigência em 14/04/2027 pela contagem conservadora), no lugar de um ano. Estatais em regime de concorrência (item VIII): empregado com diploma e remuneração mínima entra no art. 8º (campo estatalConcorrencial no motor; sem tela). Só informados nas premissas, sem efeito no cálculo: 90 dias a partir de 16/12/2026 para renegociar contrapartidas das normas coletivas (item II); portaria conjunta possível nos primeiros 90 dias se a negociação sobre compensação fracassar (item IV); neutralidade salarial com condições a fixar em lei ou decreto e sem servir, por si só, a pedidos de equiparação (item III); apelos ao legislador sobre regimes diferenciados e microempresas e empresas de pequeno porte, em 180 dias (itens V e VI). A Lei Complementar 238/2026, citada na decisão, trata do limite do MEI e não muda o cálculo","alternativa":"—","origem":"pedido","regras":["R10","R13"],"situacao":"adotado em 12/11/2026"},{"id":"D105","tema":"Mudar horários no resultado","padrao":"Na escala semanal da opção escolhida, nas duas etapas (transição até 42 h e definitiva de 40 h), o usuário muda entrada, saída e intervalo de cada dia da semana, para todas as pessoas ou para uma só, e troca trabalho e folga clicando nos dias. O motor confere na hora (etapa de 42 h a partir de 04/01/2027; de 40 h a partir de 10/01/2028), com as normas do cenário e as que o usuário marcou como firmadas, e mostra o que falta (por exemplo, a norma do art. 7º para dias acima de 8h24) e a dica da liminar quando cabe. O intervalo fica onde está ou, se não couber, no meio do turno. A escala editada de cada etapa segue para o calendário (a de 42 h até 12/12/2027, a de 40 h a partir de 13/12/2027), para o PDF e para o Excel; a agenda (.ics) continua com a etapa de 40 h. Custos e ranking não mudam com a edição","alternativa":"Edição só de folgas na etapa de 40 h, como antes","origem":"pedido","regras":[],"situacao":"adotado em 12/11/2026"}]; window.BUILD_INFO = {"hash":"0eadc767e55be7286cf911abc781c0afc2bb2a16ec830f4d7dff3ec772f16590","versao":"0.2.0","data":"12/11/2026 15:22","testes":"160 de 160 conferências do motor (seção 11, casos novos e liminar na ADI 8.041); 85 de 85 conferências do planejador; 1.000 cenários do oráculo com 0 divergências; propriedades P1 a P4 sem falha","logo":null}; window.ENDERECOS = {"pasta":"https://czalaf-my.sharepoint.com/:f:/g/personal/guilherme_peixoto_claudiozalaf_com_br/IgBv6kaVq5RpS5q4mgUxb-rNAVVcO5lnDPam6bnrK6l_Xz4?e=dQed9k","simulador":"https://czalaf-my.sharepoint.com/:f:/g/personal/guilherme_peixoto_claudiozalaf_com_br/IgBv6kaVq5RpS5q4mgUxb-rNAVVcO5lnDPam6bnrK6l_Xz4?e=dQed9k"};</script>
<script id="setores-ec141">/* Setores, cargos sugeridos e dados setoriais do simulador.
   - Lista de setores e cargos: base do simulador Escala Sebrae (escala.sebrae.com.br, consultado em 10/11/2026), com a
     indústria, a logística e o agro ampliados para empresas médias e grandes. Escala, duração e dias de cada cargo são
     sugestões de partida, editáveis, e não estatística.
   - Dados setoriais: DIEESE, Boletim Emprego em Pauta nº 32, maio de 2026, Gráfico 2 (MTE, RAIS 2024, vínculos ativos
     em 31/12/2024); e estimativas do MTE sobre a escala 6x1 (eSocial, apresentadas em 10/03/2026), na forma divulgada
     pelo DIEESE. Nada aqui é inventado: setor sem número publicado fica sem número. */
(function () {
  'use strict';
  const SS = 'ss', SX = 'sx', TD = 'td', TS = 'ts';

    const usa = (e) => fs.some((f) => f.escala === e);

    return `<header class="cab-etapa"><span class="eyebrow">${rotEtapa(E.EQUIPE)}</span><h1>Quem trabalha, em que escala e em que horário</h1>
        <p class="lead">Monte a equipe por cargo: escolha o cargo, informe quantas pessoas e o salário e clique em Adicionar. Depois ajuste em cada ficha a escala, os dias e o horário como a equipe trabalha hoje, mesmo que já passem do novo limite.</p></header>

    if (m.modo === 'dia') { const v = m.dia.map((x) => num(x) || 0); const s = soma(v); return s > 0 ? { mensal: s * SEM, dia: v } : null; }

          <p>${enc.manual ? 'Percentual informado.' : esc(regNome) + (enc.naosei ? ' (regime não informado: usamos o mais caro)' : '') + '. ' + (enc.estimados.length ? 'RAT de 2% e terceiros de 5,8% são estimativas, que podem ser ajustadas nos ajustes avançados.' : '')}</p>

        <div class="bloco"><span class="rot">Encargos e adicionais</span><div class="campos">

          ${!S.op.empresa.regime || S.op.empresa.regime === 'lucro' || S.op.empresa.regime === 'naosei' ? campo('terceiros', 'Terceiros (%)', 'conforme o FPAS', '', '%') : ''}
          ${campo('encargos', 'Ou informe o total (%)', 'substitui o cálculo acima', '', '%')}
          ${campo('he', 'Adicional de hora extra (%)', 'mínimo de 50%', '', '%')}
          ${campo('noturno', 'Adicional noturno (%)', 'mínimo de 20%', '', '%')}</div></div>
      <div class="bloco"><span class="rot">Normas coletivas e premissas</span><div class="pilha">
          ${marca('art7', 'Jornada diária ampliada até dez/2027 (Emenda Constitucional 141 – Fim da 6x1, art. 7º)' + (liminar() ? '; com a liminar na ADI 8.041, só é preciso acima de 8h24' : ''))}${marca('par2', liminar() ? 'Média de repousos (CF, art. 7º, § 2º), no período que a norma definir, pela liminar na ADI 8.041' : 'Média de repousos no mês (CF, art. 7º, § 2º)')}${marca('intervalo', 'Intervalo de 30 min (CLT, art. 611-A, III)')}${marca('x12', '12x36 por norma coletiva (CLT, art. 59-A)')}
          ${setor().atividade === 'comercio' ? `<label class="check"><input type="checkbox" id="prem-domingo" data-domingo="1"${comercioDomingo() ? ' checked' : ''}> <span>Folga em um domingo a cada três semanas (Lei 10.101/2000, art. 6º, parágrafo único)</span></label>` : ''}
          <div class="campo" style="max-width:360px"><label class="rot" for="prem-ferias">Férias no dimensionamento</label><select id="prem-ferias" data-premissa="ferias">${[['hoje', 'Manter a cobertura de hoje'], ['reserva', 'Reservar gente para todas as férias'], ['nao', 'Não considerar']].map(([k, n]) => `<option value="${k}"${S.op.ferias === k ? ' selected' : ''}>${n}</option>`).join('')}</select></div>
        </div></div></details>
      ${vNavegar(E.MOV, E.RES, 'Ver o resultado →')}`;
  }

  /* ================================================================ resultado */

  /** Aviso de precisão no resultado do modo simplificado (D88). */
  function vAvisoSimples() {
    if (!simples()) return '';
    return `<div class="aviso-simples"><p><b>Modo simplificado: resultado aproximado.</b> O simulador usou os dias de trabalho típicos de cada cargo no setor, um horário por cargo, o mesmo salário para todos do cargo e os encargos do regime tributário, sem benefícios, faturamento nem normas coletivas. Com os dados reais, os números podem mudar bastante. Para decidir, revise no modo completo: tudo o que você preencheu é aproveitado.</p>
      <button class="btn prim" data-acao="modo" data-v="completo" id="ir-completo-res">Passar para o modo completo</button></div>`;
  }
  function vResultado() {
    const ts = turnosCalc();
    garantir(ts);
    const as = ts.map((t) => ({ t: t, a: analise(t) }));
    const calc = as.filter((x) => x.a.estado === 'calc').length;
    const erros = as.filter((x) => x.a.estado === 'erro');
    const prontos = as.filter((x) => x.a.estado === 'ok');
    const cab = `<header class="res-cab"><div class="cab-etapa"><span class="eyebrow">Resultado${S.op.empresa.nome ? ' · ' + esc(S.op.empresa.nome) : ''}</span><h1>O que muda com a Emenda Constitucional 141 (Fim da 6x1)</h1></div>
      <div class="acoes"><button class="btn" data-acao="ir" data-etapa="${E.EQUIPE}" id="editar-dados">Editar os dados</button>
        <button class="btn" data-acao="pdf" id="baixar-pdf"${S.downloads === null ? ' disabled title="Downloads indisponíveis nesta visualização"' : ''}>Baixar PDF</button>
        <button class="btn" data-acao="xlsx" id="baixar-xlsx"${S.downloads === null ? ' disabled title="Downloads indisponíveis nesta visualização"' : ''}>Baixar Excel</button>
        ${DENTRO_CLAUDE ? '' : '<button class="btn" data-acao="ics" id="baixar-ics" title="Arquivo para importar a escala no Google Agenda, Apple ou Outlook">Escala na agenda (.ics)</button>'}</div>
      ${S.downloads === null ? `<p class="nota" style="flex-basis:100%">Nesta página, o PDF e o Excel só podem ser baixados por quem está conectado a uma conta do Claude.${END.simulador ? ` Para baixar sem conta, use a versão do simulador que fica <a href="${esc(END.simulador)}" target="_blank" rel="noopener">na pasta do escritório</a>: baixe o arquivo simulador-ec141.html e abra no navegador.` : ''}</p>` : ''}</header>`;
    if (!ts.length) return cab + `<p class="aviso forte">Nenhuma função completa: informe horário e pessoas na etapa da equipe.</p>`;
    if (calc) return cab + faixaExemplo() + `<p class="carregando">Calculando ${ts.length - calc} de ${ts.length} turnos…</p>`;
    const avisoErro = erros.length ? `<p class="aviso forte">Não foi possível calcular ${erros.map((x) => esc(x.t.nome) + ': ' + esc(x.a.erro)).join('; ')}.</p>` : '';
    if (!prontos.length) return cab + avisoErro;
    const rk = ranking(ts), opc = opcDe(rk);
    const nT = prontos.length;
    return cab + faixaExemplo() + avisoErro + vAvisoSimples() + vVeredito(prontos) + vLiminar() +
      dobra('diag', 'Diagnóstico completo', 'a escala de hoje em cada etapa e quanto a equipe deixa de trabalhar sem contratar', vLinhaRes(prontos) + vTamanho(ts, prontos)) +
      vComparativo(ts, prontos, rk, opc) + vDetalheOpcao(ts, prontos, rk, opc) + vHoristas(ts, opc) + vPorFuncao(prontos, opc) +
      dobra('escala', 'Escala semanal', 'quem trabalha em cada dia, com a opção escolhida' + (nT > 1 ? ', em cada função' : ''), vEscala(prontos, opc)) +
      vCalendario(prontos, opc) + vTestadas(prontos, opc) +
      (simples() ? '' : dobra('exercicio', 'Exercício: folgas pela média do mês', 'hipótese para negociar com o sindicato', vExercicio(), S.op.exercicio.ativo)) +
      dobra('receita', 'Faturamento e custo da equipe', 'o peso da folha no faturamento informado', vReceita(prontos, opc)) +
      dobra('setor', 'O cenário do seu setor', 'dados de jornada e de 6x1 no setor escolhido', `<section class="secao"><header><h2>Entenda o cenário do seu setor</h2></header>${vContextoSetor(S.op.empresa.setor)}</section>`) +
      dobra('contas', 'Como chegamos nestes valores', 'encargos, custo por pessoa, regras de cálculo e premissas', vContas() + vPremissas());
  }

  /* ---------------------------------------------------------------- linha do tempo, caminhos em abas e leitura dos números */

  /** Pessoas que não cumprem (ou dependem de norma coletiva) em cada etapa da Emenda Constitucional 141 (Fim da 6x1), com a escala de hoje. */
  function fases(prontos) {
    const r = { total: 0, e1: { fora: 0, pend: 0 }, e2: { fora: 0, pend: 0 } };
    for (const { t, a } of prontos) {
      r.total += t.pessoas;
      for (const e of ['e1', 'e2']) {
        const st = a.diag && a.diag.etapas && a.diag.etapas[e] ? a.diag.etapas[e].status : null;
        if (st === 'nao_cumpre') r[e].fora += t.pessoas; else if (st === 'pendente') r[e].pend += t.pessoas;
      }
    }
    return r;
  }
  /** Horas de trabalho da equipe por semana, hoje (minutos), pela entrada. */
  const horasEquipe = () => soma(S.op.funcoes.map((f) => (semanaFn(f) || 0) * pessoasFn(f)));
  /** Horas por semana (minutos) que passam do teto, somadas pessoa a pessoa: o que a equipe deixa de trabalhar só pelo novo limite. */
  function horasAcima(teto) {
    let t = 0;
    for (const f of S.op.funcoes) for (const s of f.turnos) { const m = medirTurno(f, s), p = Math.floor(num(s.pessoas) || 0); if (m && p) t += p * Math.max(0, m.semana - teto); }
    return t;
  }
  /** Horas extras do caminho B (minutos por semana na equipe) e as pessoas dos turnos em que ele se aplica. */
  function horasExtrasB(ts) {
    let min = 0, pessoas = 0;
    for (const t of ts) {
      const a = analise(t);
      if (a.estado !== 'ok') continue;
      const e = escolha(t, a, 'B');
      if (!e.x || e.fallback || e.x.id !== 'B' || !e.x.x.horasExtras) continue;
      min += e.x.x.horasExtras.minutos || 0; pessoas += t.pessoas;
    }
    const com = new Set(), sem = new Set();
    for (const t of ts) {
      const a = analise(t); if (a.estado !== 'ok') continue;
      const e = escolha(t, a, 'B'), sa = escolha(t, a, 'A');
      if (e.x && !e.fallback && e.x.id === 'B') com.add(t.fnome);
      else if (!sa.x || sa.fallback || perdaDe(sa.x) > TOL) sem.add(t.fnome);   // sem perda, a hora extra não é necessária
    }
    for (const n of com) sem.delete(n);
    return { min: min, pessoas: pessoas, com: Array.from(com), sem: Array.from(sem) };
  }
  const porMes = (minSemana) => Math.round(minSemana / 60 * SEM);
  const hMes = (minSemana) => porMes(minSemana).toLocaleString('pt-BR') + ' h por mês';
  function vLinhaRes(prontos) {
    const fz = fases(prontos), n = fz.total, h = horasEquipe();
    const chip = (x) => (x.fora ? pill('nok', x.fora === n ? 'Ninguém cumpre' : x.fora + ' de ' + n + ' não cumprem') : x.pend ? pill('pend', x.pend + ' dependem de norma coletiva') : pill('ok', 'Cumpre'));
    return `<section class="secao linha-res"><header><h2>A escala de hoje em cada etapa</h2>
        <p class="nota">Redução progressiva da Emenda Constitucional 141/2026 (Fim da 6x1): dois repousos semanais e teto de 42 h em 16/12/2026; teto de 40 h em 16/12/2027.</p></header>
      ${vMarcos([`<span class="pill neutro">${plural(n, 'pessoa', 'pessoas')} · ${h && n ? durTxt(h / n) + ' por semana em média' : ''}</span>`, chip(fz.e1), chip(fz.e2)])}</section>`;

  /**
   * O tamanho do problema, como no Sebrae: quantas horas a equipe deixa de trabalhar por mês sem contratar, pelo novo

  function vTamanho(ts, prontos) {
    const hEq = horasEquipe(), a42 = horasAcima(2520), a40 = horasAcima(2400);
    const ta = totais(ts, 'A'), expo = prontos.reduce((s, { a }) => s + (!cumpreHoje(a) && a.manter && a.manter.total ? a.manter.total : 0), 0);
    const n44 = S.op.funcoes.reduce((s, f) => s + f.turnos.filter((x) => { const m = medirTurno(f, x); return m && Math.abs(m.semana - 2640) < 1; }).reduce((q, x) => q + (Math.floor(num(x.pessoas) || 0)), 0), 0);
    const pctH = (m) => (hEq ? ' (' + pct(m / hEq, m / hEq < 0.1 ? 1 : 0) + ' das horas de hoje)' : '');

  const deltaTxt = (d, h) => (Math.abs(d) < 0.5 ? 'igual a hoje' : (d > 0 ? '+ ' : '− ') + reais(d) + ' por mês (' + (d > 0 ? '+' : '−') + pct(h ? d / h : 0, h && Math.abs(d / h) < 0.01 ? 1 : 0) + ')');
  const motivoNaoAplica = (k) => (k === 'B' ? 'nenhuma função tem perda que horas extras reponham dentro dos limites (2 h por dia, 10 h de jornada, 11 h entre jornadas); hora extra não põe mais gente no dia, e trabalhar na folga quebraria os dois repousos'
    : k === 'D' ? 'nenhuma função fica mais barata nem contrata menos com norma coletiva'
      : k === 'F' ? 'em nenhuma função o que falta cabe em até dois dias por semana; diária toda semana em mais dias é emprego (CLT, art. 3º)'
        : k === 'P' ? 'o reforço em tempo parcial não traz caminho diferente do contratar'
          : k === 'A' ? 'nenhuma função cumpre sem contratar' : 'não se aplica a estas funções');
  const NOME_CURTO = { rec: 'Recomendado', A: 'Manter a equipe', B: 'Manter a equipe', C: 'Contratar', P: 'Tempo parcial', D: 'Norma coletiva', F: 'Freelancer' };
  /** Motivo, em poucas palavras, de uma opção não se aplicar a nenhuma função. */
  const motivoCurto = (k) => (k === 'B' ? 'hora extra não repõe o que falta (falta gente nos dias, não só horas)' : k === 'D' ? 'a norma coletiva não traz nada mais barato nem com menos contratações'
    : k === 'F' ? 'o que falta não cabe em até dois dias por semana' : k === 'P' ? 'o tempo parcial não muda o resultado de contratar' : k === 'A' ? 'nenhuma função cumpre sem contratar' : 'não se aplica a estas funções');
  /**
   * Comparativo de todas as opções, primeiro no resultado (D93): ranking pelo critério que o usuário escolhe, com 1º, 2º e
   * 3º para as melhores sem risco de passivo. Clicar numa linha escolhe a opção para o resto do resultado.
   */
  function vComparativo(ts, prontos, rk, opc) {
    const crit = CRITERIOS.find((c) => c[0] === rk.crit);
    const linhas = rk.lista.map((o) => {
      const tt = o.tt, d = tt.depois - tt.hoje, seg = SEGURANCA[o.k] && ['B', 'D', 'F'].indexOf(o.k) >= 0 ? SEGURANCA[o.k] : tt.inseg === 'pend' ? ['pend', 'Depende de acordo'] : tt.inseg === 'nok' ? ['nok', 'Há risco'] : ['ok', 'Cumpre'];

  /** A opção escolhida: a folha de hoje ao lado da folha com a opção, com as horas e as contratações (antes, as abas). */
  function vDetalheOpcao(ts, prontos, rk, opc) {
    const o = rk.lista.find((x) => x.k === opc);
    if (!o) return '';
    const tt = o.tt, hoje = tt.hoje, d = tt.depois - tt.hoje;
    const fz = fases(prontos), hEq = horasEquipe(), heB = horasExtrasB(ts);
    const lista = (xs) => juntar(xs.map((x) => x.toLowerCase())).replace(/; e /, ' e ');
    const seg = SEGURANCA[o.k] && ['B', 'D', 'F'].indexOf(o.k) >= 0 ? SEGURANCA[o.k] : tt.inseg === 'pend' ? ['pend', 'Depende de acordo'] : tt.inseg === 'nok' ? ['nok', 'Há risco'] : ['ok', 'Cumpre'];
    let corpo = '';
    if (o.k === 'B') {
      const porPessoa = heB.pessoas ? heB.min / heB.pessoas : 0;
      corpo = `<li><b>${Math.round(porPessoa / 60 * SEM).toLocaleString('pt-BR')} h extras por mês por pessoa</b> em ${esc(lista(heB.com))}, com as horas de hoje mantidas. Teto legal: 2 h extras por dia.</li>

        <li>Horas extras habituais refletem nos repousos, no 13º e nas férias, e o custo varia mês a mês.</li>`;
    } else if (o.k === 'A') {
      // liminar na ADI 8.041 (D101): onde o 5x2 de até 8h24 cumpre sem norma coletiva, a equipe pode manter 42 h até dez/2027
      const c824 = liminar() ? prontos.filter(({ t, a }) => { const e = escolha(t, a, 'A'); return e.x && !e.fallback && /^5x2/.test(e.x.c.id) && e.x.c.id !== '5x2-art7' && a.cen.lista.some((c) => c.id === '5x2-art7' && c.situacao.codigo === 'cumpre'); }).map(({ t }) => t.nome) : [];
      corpo = `<li>Horas de trabalho da equipe: <b>${horasTxt(hEq)} → ${horasTxt(Math.max(0, hEq - tt.perda))} por semana</b>${tt.perda > TOL ? ' (− ' + hMes(tt.perda) + ')' : ''}.</li>

  /* ---------------------------------------------------------------- horista ou mensalista (D91, D92) */

  const LEITURAS_TXT = {
    literal: ['Cada repouso vale um dia de trabalho', 'leitura literal, padrão'],
    sexto: ['Cada repouso vale 1/6 das horas da semana', 'critério de hoje'],
    reajuste: ['Só a hora sobe, para manter o mês de hoje', 'igual ao mensalista'],

  /**
   * Folha mensal, a partir de 16/12/2027, das funções pagas por hora, no caminho escolhido, em cada forma de pagar os
   * dois repousos (D92). O caminho de cada turno é o da leitura em uso, para comparar a mesma escala.
   */
  function dadosHorista(ts, opc) {
    const tsH = ts.filter((t) => horistaDe(t));

  /** Horas pagas no mês por quem trabalha 40 h em 5 dias, em cada leitura (para a frase de explicação). */

    return dobra('horista', 'Horista ou mensalista', resumo, `<section class="secao" id="horista"><header><h2>Horista ou mensalista: quanto custa cada forma de pagar</h2>
        <p class="nota">${nfs} por hora. Folha por mês a partir de 16/12/2027, no caminho escolhido, com encargos e benefícios.</p></header>
      <p>Com a Emenda Constitucional 141 (Fim da 6x1), as duas folgas da semana são repousos remunerados. O mensalista já recebe por todos os dias do mês, então o salário não muda (Lei 605/1949, art. 7º, § 2º). O horista recebe pelas horas trabalhadas e por cada repouso à parte, e ainda não há regra nem decisão da Justiça sobre como pagar o segundo repouso. Por isso o simulador calcula três leituras:</p>
      <ul class="leituras"><li><b>Cada repouso vale um dia de trabalho</b> (leitura literal da Lei 605/1949, art. 7º, b). Com 40 h em 5 dias, são 40 h trabalhadas e dois repousos de 8 h, 56 h pagas por semana, cerca de ${Math.round(hLit)} h no mês. Hoje, com 44 h, são 220 h.</li>

  /* ---------------------------------------------------------------- escala editável */

    const extra = P._interno.instrumentos(['art7', 'par2'], negociacao(), iv);

  function validar(t, x, gr) {

  /** Maior semana de uma pessoa na grade (horas de relógio, sem o intervalo). */

  /** Soma `peso` pessoas no local de `ini` a `fim` (minutos desde a meia-noite do dia d); o que passa da meia-noite cai no dia seguinte. */
  function acumular(mat, d, ini, fim, peso) {
    for (let t = ini; t < fim;) {
      const prox = Math.min(fim, (Math.floor(t / 60) + 1) * 60);

   * dias marcados); na 12x36, metade da equipe em cada dia; no 6x2, seis de cada oito; na personalizada, a média das
   * semanas do ciclo. `dia` traz as pessoas que trabalham em cada dia da semana, em média.

    const mat = matriz(), dia = [0, 0, 0, 0, 0, 0, 0];
    const somar = (d, ini, fim, peso) => { if (!(peso > 0) || !(fim > ini)) return; acumular(mat, d, ini, fim, peso); dia[d] += peso; };

        const W = pd.semanas.length;

  /* ---------------------------------------------------------------- calendário do período (D96) */

  const INICIO_E2 = '2027-12-13';   // semana de apuração que contém 16/12/2027, como no planejador
  /** Junta as partes do calendário (cada uma com índices desde o próprio início) nos índices do período. */
  function juntarCal(rs, partes) {
    const dias = Array.from({ length: NDIAS }, () => ({ t: [], r: [] })), achados = [], erros = [];
    rs.forEach((r, k) => {
      const off = M.lerData(partes[k].inicio) - Z0;

      for (const q of r.achados) achados.push([q[0], q[1], q[2], q[3], q[4] + off, q[5] + off]);

        .then((rs) => { S.cal.set(k, juntarCal(rs, f.partes)); })
        .catch((e) => { S.cal.set(k, { estado: 'erro', erro: e.message }); })

  /** Situação de um dia num turno: 'n' não cumpre, 'p' depende de acordo ou fica abaixo da necessidade, 'ok', 'x' sem expediente. */
  function diaTurno(f, cal, i) {

  /** Feriados para o início das férias: os nacionais do período, os locais informados e o 1º/1/2028 (fecha o período). */
  function feriadosFerias() {
    const m = new Map(FERIADOS);

  function inicioFerias(cal, id, i, fer, sabDom) {

  function vRegrasFerias() {
