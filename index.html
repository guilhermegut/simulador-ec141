  /* ---------------------------------------------------------------- cobertura hora a hora no dia (D97) */

  const PASSO = 15;   // minutos por fatia da linha do tempo
  /** Janela de funcionamento do turno num dia da semana (minutos; o fim pode passar da meia-noite). */
  function janelaTurno(t, wd) {
    const h = t.porDia && t.porDia[wd], ini = M.lerHora(h ? h.inicio : t.inicio), fim0 = M.lerHora(h ? h.fim : t.fim);
    if (ini == null || fim0 == null) return null;
    return [ini, fim0 > ini ? fim0 : fim0 + 1440];
  }
  /**
   * Pessoas no turno e necessidade em cada fatia de 15 min do dia i, por função: conta quem está escalado, da entrada à
   * saída (o intervalo de refeição se reveza dentro do turno), inclusive quem veio do turno da noite anterior; a
   * necessidade é a do dia em toda a janela de funcionamento do turno. As diárias de freelancer, quando há, entram na janela do turno.
   */
  function coberturaDia(fontes, cals, i) {
    const n = 1440 / PASSO, porFn = new Map();
    fontes.forEach((f, k) => {
      const cal = cals[k];
      if (!cal || cal.estado !== 'ok') return;
      const fid = f.t.fid || f.t.chave;
      if (!porFn.has(fid)) porFn.set(fid, { nome: f.t.fnome || f.t.nome, pres: new Array(n).fill(0), nec: new Array(n).fill(0) });
      const o = porFn.get(fid);
      const somar = (ini, fim, pausas, desloc) => {
        for (let q = 0; q < n; q++) {
          const m = q * PASSO + desloc;
          if (m >= ini && m < fim) o.pres[q]++;   // da entrada à saída: o intervalo de refeição se reveza dentro do turno
        }
      };
      for (const x of cal.dias[i].t) somar(x[1], x[2], x[4], 0);
      if (i > 0) for (const x of cal.dias[i - 1].t) if (x[2] > 1440) somar(x[1], x[2], x[4], 1440);
      const necDe = (d, desloc) => {
        const antes = f.corte != null && d < f.corte, wd = diaSem(d), dem = ((antes ? f.demandaPre : f.demanda) || [])[wd] || 0, jt = janelaTurno(f.t, wd);
        const extra = f.extras && !antes ? f.extras[wd] || 0 : 0;
        if (!jt) return;
        for (let q = 0; q < n; q++) { const m = q * PASSO + desloc; if (m >= jt[0] && m < jt[1]) { o.nec[q] += dem; o.pres[q] += desloc === 0 ? extra : 0; } }
      };
      necDe(i, 0);
      if (i > 0) necDe(i - 1, 1440);
    });
    return Array.from(porFn.values()).filter((o) => o.pres.some((v) => v > 0) || o.nec.some((v) => v > 0));
  }
  const hhmm = (m) => String(Math.floor(m / 60) % 24).padStart(2, '0') + 'h' + (m % 60 ? String(m % 60).padStart(2, '0') : '');
  /** Linha do tempo das 24 horas de uma função: pessoas trabalhando (área) contra a necessidade (linha tracejada); falta em vermelho. */
  function vLinhaTempo24(o) {
    const n = o.pres.length, max = Math.max(1, Math.max.apply(null, o.pres), Math.max.apply(null, o.nec));
    const passoY = max <= 5 ? 1 : max <= 12 ? 2 : max <= 30 ? 5 : 10, topo = Math.ceil(max / passoY) * passoY;
    const W = n, H = 100, y = (v) => H - v / topo * H;
    const degraus = (arr) => arr.map((v, q) => `${q === 0 ? 'M' : 'L'}${q},${y(v).toFixed(2)} L${q + 1},${y(v).toFixed(2)}`).join(' ');
    const area = `M0,${H} ` + o.pres.map((v, q) => `L${q},${y(v).toFixed(2)} L${q + 1},${y(v).toFixed(2)}`).join(' ') + ` L${n},${H} Z`;
    const faltas = [];
    for (let q = 0; q < n; q++) if (o.pres[q] < o.nec[q]) faltas.push(`<rect x="${q}" y="${y(o.nec[q]).toFixed(2)}" width="1" height="${(y(o.pres[q]) - y(o.nec[q])).toFixed(2)}" class="lt-falta"/>`);
    const temNec = o.nec.some((v) => v > 0);
    const dicas = Array.from({ length: n / 2 }, (_, k) => { const q = 2 * k, p = Math.min(o.pres[q], o.pres[q + 1]), ne = Math.max(o.nec[q], o.nec[q + 1]);
      return `<rect x="${q}" y="0" width="2" height="${H}" class="lt-hit"><title>${hhmm(q * PASSO)} às ${hhmm((q + 2) * PASSO)}: ${p} ${p === 1 ? 'pessoa' : 'pessoas'}${temNec ? ' · necessidade ' + ne : ''}</title></rect>`; }).join('');
    const ticksY = []; for (let v = 0; v <= topo; v += passoY) ticksY.push(v);
    const falta = o.pres.some((v, q) => v < o.nec[q]), sobra = o.pres.some((v, q) => o.nec[q] > 0 && v > o.nec[q]);
    let leitura = 'Cobertura completa no horário de funcionamento.';
    if (falta) { const trs = []; for (let q = 0; q < n; q++) if (o.pres[q] < o.nec[q] && (q === 0 || !(o.pres[q - 1] < o.nec[q - 1]))) { let e = q; while (e < n && o.pres[e] < o.nec[e]) e++; trs.push(hhmm(q * PASSO) + ' às ' + hhmm(e * PASSO)); } leitura = 'Falta gente ' + juntar(trs).replace(/; e /, ' e ') + '.'; }

      <figcaption><b>${esc(o.nome)}</b><span class="${falta ? 'mau' : 'suave'}">${esc(leitura)}${sobra && !falta ? ' Há horários com gente a mais que o necessário.' : ''}</span></figcaption>
      <div class="lt-area"><div class="lt-y" aria-hidden="true">${ticksY.map((v) => `<span style="bottom:${(v / topo * 100).toFixed(2)}%">${v}</span>`).join('')}</div>
        <div class="lt-plot"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-hidden="true">
          ${ticksY.map((v) => `<line x1="0" x2="${W}" y1="${y(v).toFixed(2)}" y2="${y(v).toFixed(2)}" class="lt-grade" vector-effect="non-scaling-stroke"/>`).join('')}

          ${temNec ? `<path d="${degraus(o.nec)}" class="lt-nec" vector-effect="non-scaling-stroke"/>` : ''}${dicas}</svg>

      <div class="lt-leg"><span><i class="lt-i-pres"></i>Pessoas escaladas</span>${temNec ? '<span><i class="lt-i-nec"></i>Necessidade</span>' : ''}${falta ? '<span><i class="lt-i-falta"></i>Falta gente</span>' : ''}</div></figure>`;
  }
  function vCoberturaDia(fontes, cals, i) {

   * Por que há mais gente que o necessário num dia (D98). A escala não demite: o quadro fica o de hoje ou cresce em

  /** Janela com o detalhe de um dia. */

    'fer-add': () => {
      const d = ($('#fer-data') || {}).value, n = (($('#fer-nome') || {}).value || '').trim();

    'fer-rem': (b) => { const k = +b.dataset.v; S.op.feriadosLocais = (S.op.feriadosLocais || []).filter((_, q) => q !== k); editou(); render(); },
    dia: (b) => abrirDia(Number(b.dataset.i)),
    'dia-nav': (b) => { S.ui.dia = Math.max(0, Math.min(NDIAS - 1, S.ui.dia + Number(b.dataset.v))); renderModal(); const n = document.getElementById(Number(b.dataset.v) < 0 ? 'dia-ant' : 'dia-prox'); if (n && !n.disabled) n.focus({ preventScroll: true }); else { const f = document.getElementById('fechar-dia'); if (f) f.focus({ preventScroll: true }); } },
    'fechar-dia': () => fecharDia(),
    pdf: () => baixarPDF(),
    xlsx: () => baixarExcel(),
  };
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-acao]');

  });
  document.addEventListener('input', (ev) => {
    const el = ev.target, d = el.dataset;
    if (el.type === 'checkbox') return;
    if (d.emp === 'nome') { S.op.empresa.nome = el.value; editou(); return; }
    if (d.fn && d.hdia != null) {
      const f = acharFn(d.fn), sh = f && f.turnos.find((x) => x.id === d.sh);
      if (!sh) return;
      if (!Array.isArray(sh.porDia)) sh.porDia = [null, null, null, null, null, null, null];

    }
    if (d.fn && d.pdur) {
      const f = acharFn(d.fn), m = M.lerHora(el.value), pd = f && (d.ex ? exEditavel(f) : f.padrao);

    }
    if (d.fn && d.escalaS) { ACOES.escala({ dataset: { fn: d.fn, v: el.value } }); return; }
    if (d.fn && d.sh && d.pk != null) {
      const f = acharFn(d.fn), s = f && f.turnos.find((x) => x.id === d.sh);
      if (!s) return;
      if (!Array.isArray(s.equipe)) s.equipe = [];
      const k = +d.pk;
      while (s.equipe.length <= k) s.equipe.push({});
      s.equipe[k] = Object.assign({}, s.equipe[k], { [d.pf]: d.pf === 'salario' ? (el.value === '' ? '' : Number(el.value)) : el.value.slice(0, 60) });
      editou(); if (d.pf === 'salario') adiar(); return;
    }
    if (d.fn && d.sh) {
      const f = acharFn(d.fn), s = f && f.turnos.find((x) => x.id === d.sh);
      if (!s) return;
      if (d.f === 'inicio' || d.f === 'fim') f.auto = false;
      if ((d.f === 'inicio' || d.f === 'fim') && Array.isArray(s.porDia)) for (const h of s.porDia) if (h && h[d.f] === s[d.f]) h[d.f] = el.value;
      s[d.f] = d.f === 'pessoas' ? (el.value === '' ? '' : Math.max(0, Math.floor(Number(el.value) || 0))) : el.value;
      editou(); adiar(); return;
    }
    if (d.novo) { S.ui.novo = S.ui.novo || {}; S.ui.novo[d.novo] = el.value; if (d.novo === 'cargo') render(); return; }
    if (d.fn && d.cargo) {
      const f = acharFn(d.fn); if (!f) return;
      const c = (setor().cargos || []).find((x) => x.nome === el.value);
      if (!c) { f.outro = true; f.nome = ''; editou(); render(); const n = document.getElementById(f.id + '-nome'); if (n) n.focus(); return; }
      f.outro = false; f.nome = c.nome;
      if (f.auto) {
        const g = funcaoDeCargo(c, setor());

        f.turnos.forEach((s, k) => { if (k === 0) { s.inicio = g.turnos[0].inicio; s.fim = g.turnos[0].fim; s.porDia = null; } });

    if (d.fn && d.f) {

    }
    if (d.movDia != null) { S.op.movimento.dia[Number(d.movDia)] = el.value === '' ? '' : Number(el.value); editou(); return; }

    if (d.custo) { S.op.custos[d.custo] = el.value === '' ? '' : Number(el.value); editou(); adiar(); return; }
    if (d.premissa) { S.op[d.premissa] = el.value; editou(); render(); return; }
    if (d.escolha) { if (el.value) S.op.escolhas[d.escolha] = el.value; salvar(); render(); return; }
    if (d.calFiltro) { S.ui.calFiltro = el.value; render(); }

  });
  document.addEventListener('change', (ev) => {
    const el = ev.target, d = el.dataset;

    if (d.mov === 'usar') { S.op.movimento.usar = el.checked; editou(); return; }
    if (d.domingo) { S.op.domingo = el.checked ? null : false; editou(); render(); return; }
    if (d.exAtivo) { S.op.exercicio.ativo = el.checked; editou(); render(); return; }
    if (d.fn && d.sh && d.pk != null && d.pf === 'mulher') {
      const f = acharFn(d.fn), s = f && f.turnos.find((x) => x.id === d.sh);

  // horários da escala: aplicados ao sair do campo ou com Enter, para não redesenhar a tela no meio da digitação (D105)
  document.addEventListener('focusout', (ev) => {

  /** Download comum do navegador, para a cópia do simulador hospedada fora do claude.ai. */
  function baixarDireto(nome, data) {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nome; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();

  }

})();
