        tii: !!(o.negociacao && o.negociacao.tii), insal: !!(o.negociacao && o.negociacao.insal), lic60: !!(o.negociacao && o.negociacao.lic60),
        j12: !!(o.negociacao && o.negociacao.j12), mediames: !!(o.negociacao && o.negociacao.mediames) };
      // D113: atividade insalubre e revezamento entre turnos com horário noturno, informados no cadastro da função
      t.turno.insalubre = t.grupos.some((g) => !!g.insalubre);
      t.turno.revezamento = t.grupos.some((g) => !!g.revezamento);
    }
    return lista;
  }
  /**
   * Salário mensal de tempo integral do turno: média ponderada dos grupos em tempo integral; havendo só tempo parcial,
   * o salário informado é convertido pela proporção de horas (CLT, art. 58-A, § 1º), tomando 44 h como tempo integral de hoje.
   */
  function salarioReferencia(t) {
    const comSal = t.grupos.filter((g) => num(g.salario, 0) > 0);
    const integ = comSal.filter((g) => g.escala !== 'parcial');
    if (integ.length) {
      const n = integ.reduce((s, g) => s + num(g.pessoas, 0), 0) || 1;
      return integ.reduce((s, g) => s + num(g.salario, 0) * num(g.pessoas, 0), 0) / n;
    }
    const par = comSal.find((g) => g.escala === 'parcial');
    if (!par) return null;
    const d = P.duracoes({ inicio: t.inicio, fim: t.fim, intervalo: t.intervalo });
    const horas = d ? d.trabalho * DIAS_POR_SEMANA.parcial : 0;
    return horas ? num(par.salario, 0) * 2640 / horas : null;
  }

  /* ================================================================ custos */

  /**
   * Custo mensal completo de um cenário (etapa de 40 h) e da escala de hoje: folha do planejador (salários
   * irredutíveis, adicional noturno e encargos), mais benefícios por pessoa e por dia trabalhado, sem encargos sobre
   * eles. Também traz o custo único das contratações e o valor da produção perdida, quando informado.
   * params: { salario, encargos, he, noturno, porPessoa, porDia, contratacao, valorHora }
   */
  function custoCompleto(c, base, params) {
    const p = params || {};
    const k = P.custos(c, base, p);
    const porPessoa = num(p.porPessoa, 0), porDia = num(p.porDia, 0);
    const beneficios = (eq) => (eq ? porPessoa * eq.pessoas.length + porDia * eq.dias * SEM : null);
    const contr = c.contratarIntegrais + c.contratarParciais;
    const valorHora = num(p.valorHora, null);
    const r = {
      k: k, temSalario: k.temSalario,
      hoje: k.hoje ? { folha: k.hoje.total, beneficios: beneficios(base), total: k.hoje.total + beneficios(base) } : null,
      e1: k.e1 ? { folha: k.e1.total, beneficios: beneficios(c.eco.e1), total: k.e1.total + beneficios(c.eco.e1) } : null,
      e2: k.e2 ? { folha: k.e2.total, beneficios: beneficios(c.eco.e2), total: k.e2.total + beneficios(c.eco.e2) } : null,
      contratacoes: contr, unico: contr * num(p.contratacao, 0),
      perdaHoras: k.horas.perda, perdaValor: valorHora != null && k.horas.perda > 0 ? k.horas.perda / 60 * SEM * valorHora : null,
      horasExtras: null,
    };
    return r;
  }

  /**
   * Exposição estimada de manter a escala de hoje depois de 16/12/2027 (decisão D52, a validar): cada repouso semanal
   * que falta para chegar a dois é dia de repouso trabalhado, pago em dobro (Súmula 146 do TST, por analogia); as horas
   * dos demais dias acima de 40 h são extras, com o adicional informado e reflexo nos repousos. Não inclui multas
   * administrativas, dano moral coletivo nem custos de processo.
   */
  function manterComoEsta(base, params, teto) {
    if (!base) return null;
    const p = params || {};
    const sal = num(p.salario, 0) > 0 ? num(p.salario, 0) : null;
    const enc = num(p.encargos, 0) / 100, pHE = num(p.he, 50) / 100;
    const lim = teto || 2400;
    let repousos = 0, extras = 0, valor = 0;
    for (const x of base.pessoas) {
      if (!(x.dias > 0)) continue;
      const falta = Math.max(0, 2 - (7 - x.dias));
      const normal = x.comp * (x.dias - falta) / x.dias;
      const he = Math.max(0, normal - lim);
      repousos += falta * SEM; extras += he / 60 * SEM;
      if (sal) {
        const s = x.parcial ? sal * x.comp / 2640 : sal;
        const hora = s / (lim / 60 * 5);
        const reflexo = (7 - x.dias) / x.dias;
        valor += falta * SEM * 2 * s / 30 + he / 60 * SEM * hora * (1 + pHE) * (1 + reflexo);
      }
    }
    return { repousosMes: repousos, horasExtrasMes: extras, total: sal ? valor * (1 + enc) : null };
  }

  /* ================================================================ caminhos */

  const LEGAL = ['cumpre', 'condicao', 'rearranjo'];
  const TOL = 30;   // minutos por semana: abaixo disso, não há perda de produção
  /**
   * Até quatro caminhos comparáveis para um turno, a partir dos cenários do planejador:
   * A, sem contratar (pode mudar horário, dias ou o número de pessoas em alguns dias); B, sem contratar, mantendo o
   * horário com horas extras em revezamento; C, mantendo a operação (sem perda de produção), em geral contratando;
   * D, com negociação coletiva, quando ela traz resultado melhor que C. Caminhos iguais se fundem.
   */
  function caminhos(cen, params) {
    if (!cen || cen.erro) return [];
    const base = cen.base;
    const avaliados = cen.lista.map((c) => ({ c: c, x: custoCompleto(c, base, params) }));
    const custoDe = (a) => (a.x.e2 ? a.x.e2.total : null);
    const menor = (lista, chave) => lista.slice().sort((a, b) => { const d = chave(a) - chave(b); return Math.abs(d) > 1e-6 ? d : a.c.nota - b.c.nota; })[0] || null;
    const porCusto = (a) => (custoDe(a) != null ? custoDe(a) : a.c.nota * 1000);
    const legal = avaliados.filter((a) => LEGAL.indexOf(a.c.situacao.codigo) >= 0);
    const semContratar = legal.filter((a) => !a.x.contratacoes);
    const out = [];
    // A: sem contratar, a menor perda de produção
    // empate na perda: prefere manter os dias abertos (menos gente nos dias fracos) a deixar de abrir um dia
    const A = menor(semContratar, (a) => a.x.perdaHoras * 1e3 + (a.c.fecha && a.c.fecha.length ? 500 : 0) + porCusto(a) / 1e3);
    // C: sem perda de produção, o menor custo
    const semPerda = legal.filter((a) => a.x.perdaHoras <= TOL);
    const C = menor(semPerda, porCusto) || menor(legal.filter((a) => a.x.contratacoes), (a) => a.x.perdaHoras);
    // B: sem contratar, com horas extras que repõem toda a produção perdida
    let B = null;
    for (const a of semContratar) {
      const he = a.x.k.he;
      if (a.x.perdaHoras <= TOL || !he) continue;
      const cobre = (he.tipo === 'janela' && he.minutos > 0 && !he.inviaveis.length && !he.fechados.length && he.minutos + TOL >= a.x.perdaHoras)
        || (he.tipo === 'horas' && he.cabe && !he.naoRepoePessoas);
      if (!cobre) continue;
      const total = custoDe(a) != null && he.total != null ? custoDe(a) + he.total : null;
      const cand = { c: a.c, x: Object.assign({}, a.x, { horasExtras: he, perdaHorasResidual: 0, totalComHE: total }) };
      if (!B || (total != null && B.x.totalComHE != null ? total < B.x.totalComHE : cand.c.nota < B.c.nota)) B = cand;
    }
    // D: com norma coletiva ainda não negociada, se for mais barato ou contratar menos que C (a perda de produção aparece)
    const pend = avaliados.filter((a) => a.c.situacao.codigo === 'pendente');
    const D0 = menor(pend, (a) => a.x.perdaHoras * 1e3 + porCusto(a) / 1e3);
    // só entra se melhora algo na etapa definitiva: sem perda e mais barato ou com menos contratações que C, ou com menos
    // perda que A sem contratar mais (a transição do art. 7º, que só muda a etapa de 42 h, fica de fora)
    const melhorQueC = D0 && D0.x.perdaHoras <= TOL && (!C || (custoDe(D0) != null && custoDe(C) != null ? custoDe(D0) < custoDe(C) - 1 : D0.x.contratacoes < C.x.contratacoes));
    const melhorQueA = D0 && A && D0.x.perdaHoras < A.x.perdaHoras - TOL && D0.x.contratacoes <= A.x.contratacoes;
    const D = D0 && (melhorQueC || melhorQueA || (!A && !C)) ? D0 : null;

    if (A && C && A.c === C.c) out.push(Object.assign({ id: 'A', rotulo: A.x.contratacoes ? 'Mantendo a operação' : 'Sem contratar e sem perder produção' }, A));
    else {
      if (A) out.push(Object.assign({ id: 'A', rotulo: rotuloA(A) }, A));
      if (B) out.push(Object.assign({ id: 'B', rotulo: 'Sem contratar, com horas extras em revezamento' }, B));
      if (C) out.push(Object.assign({ id: 'C', rotulo: C.x.contratacoes ? 'Mantendo a operação, contratando' : 'Mantendo a operação' }, C));
    }
    // P: contratar com reforço em tempo parcial (CLT, art. 58-A), sem perda de produção, quando o melhor caminho C é outro
    const P = menor(semPerda.filter((a) => a.c.contratarParciais > 0), porCusto);
    if (P && (!C || P.c !== C.c)) out.push(Object.assign({ id: 'P', rotulo: 'Mantendo a operação, com reforço em tempo parcial' }, P));
    if (D) out.push(Object.assign({ id: 'D', rotulo: 'Com norma coletiva' }, D));
    return out;
  }
  function rotuloA(a) {
    const c = a.c;
    if (a.x.perdaHoras <= TOL) return 'Sem contratar';
    if (c.fecha && c.fecha.length) return 'Sem contratar, sem abrir em dias de menor movimento';
    if (c.descoberto) return 'Sem contratar, com menos gente em alguns dias';
    if (c.mudaHorario) return 'Sem contratar, com horário menor';
    return 'Sem contratar';
  }
  /** Caminho sugerido: se o funcionamento pode mudar, o sem contratação; senão, o de menor custo sem perda de produção. */
  function sugerido(lista, funcionamento) {
    if (!lista.length) return null;
    const a = lista.find((x) => x.id === 'A');
    if (funcionamento === 'flexivel' && a) return a.id;
    const semPerda = lista.filter((x) => x.id !== 'A' || x.x.perdaHoras <= TOL);
    const total = (x) => (x.x.totalComHE != null ? x.x.totalComHE : x.x.e2 ? x.x.e2.total : null);
    const comCusto = semPerda.filter((x) => total(x) != null && x.id !== 'D');
    if (comCusto.length) return comCusto.sort((p, q) => total(p) - total(q))[0].id;
    const c = lista.find((x) => x.id === 'C');
    return (c || a || lista[0]).id;
  }

  /* ================================================================ picos */

  const PROV = 1 / 12 + 1 / 12 * 4 / 3;   // 13º e férias com o terço, sobre a remuneração
  /** Encargos sem as provisões, a partir do percentual total (encargos e provisões) informado: e = (total − prov) ÷ (1 + prov). */
  const semProvisoes = (total) => Math.max(0, (num(total, 0) / 100 - PROV) / (1 + PROV));
  /**
   * Caminho para cobrir os dias que ficam com menos gente quando o quadro de hoje passa para 5x2 sem contratar
   * (cenário "sem-contratar" do planejador): F, diárias de freelancer, só onde o setor admite (varejo, alimentação e
   * hospedagem, pedido do usuário) e só quando as faltas caem em até dois dias da semana. Cada presença que falta por
   * semana vira uma diária, pelo valor informado, fora da folha e sem encargos. O contrato intermitente saiu a pedido do
   * usuário (D77); o reforço em tempo parcial é o caminho P, calculado pelo planejador (cenário 5x2-parcial).
   * params: os de custoCompleto, mais { diaria, freelancer: true quando o setor admite }
   */
  const MAX_DIAS_DIARIA = 2;
  function picos(cen, params) {
    if (!cen || cen.erro) return [];
    const p = params || {};
    if (!p.freelancer) return [];
    const sc = cen.lista.find((c) => c.id === 'sem-contratar' && c.descoberto && LEGAL.concat(['descoberto']).indexOf(c.situacao.codigo) >= 0 && !c.semFerias);
    if (!sc) return [];
    const dem = sc.demanda || cen.demanda;
    const faltas = sc.faltas.slice();
    const presencas = faltas.reduce((a, b) => a + b, 0);
    const diasFalta = faltas.filter((x) => x > 0).length;
    if (!presencas || diasFalta > MAX_DIAS_DIARIA) return [];
    // jornada de trabalho de cada dia no cenário (sem intervalos), para medir as horas de cada presença que falta
    const trabDia = [0, 0, 0, 0, 0, 0, 0];
    for (const l of sc.grade2.linhas) l.horas.forEach((h, i) => { if (h) trabDia[i % 7] = Math.max(trabDia[i % 7], h[1] - h[0] - (h[2] || []).reduce((s, q) => s + q[1] - q[0], 0)); });
    const minutos = faltas.reduce((s, f, d) => s + f * trabDia[d], 0);
    const base = custoCompleto(sc, cen.base, p);
    const diaria = num(p.diaria, null);
    const diarias = presencas * SEM;
    const valor = diaria != null && diaria > 0 ? diarias * diaria : null;
    return [{ id: 'F', rotulo: 'Sem contratar, com diárias de freelancer nos dias que faltam', c: sc,
      x: Object.assign({}, base, { perdaHoras: 0, faltas: faltas, presencas: presencas, minutos: minutos, demanda: dem, diasFalta: diasFalta, contratacoes: 0, unico: 0,
        picos: { tipo: 'diarias', diarias: diarias, valor: valor }, totalPicos: base.e2 && valor != null ? base.e2.total + valor : null }) }];
  }

  /**
   * Itens do percentual de encargos e provisões (decisão D53), para o quadro "como chegamos neste valor". Sem RAT ou
   * terceiros informados, usa 2% de RAT, FAP 1 e 5,8% de terceiros (FPAS de comércio, indústria e transporte), sinalizados
   * como estimativa.
   */
  function detalheEncargos(o) {
    const reg = o.regime || 'lucro';
    const est = [];
    let rat = num(o.rat, null), terc = num(o.terceiros, null);
    const fap = num(o.fap, 1) || 1;
    if (reg !== 'simples' && rat == null) { rat = 2; est.push('RAT'); }
    if (reg === 'lucro' && terc == null) { terc = 5.8; est.push('terceiros'); }
    const itens = [];
    if (reg !== 'simples') { itens.push(['Contribuição patronal ao INSS', 20]); itens.push(['RAT × FAP', Math.round(rat * fap * 100) / 100]); }
    if (reg === 'lucro') itens.push(['Terceiros (Sistema S, salário-educação, Incra)', terc]);
    itens.push(['FGTS', 8]);
    const e = itens.reduce((s, x) => s + x[1], 0);
    const prov = [['13º salário', 100 / 12], ['Férias com o terço', 100 / 12 * 4 / 3]];
    const sobre = e * (PROV * 100) / 100;
    const total = Math.round((e + PROV * 100 + sobre) * 100) / 100;
    return { regime: reg, itens: itens, provisoes: prov, sobreProvisoes: sobre, total: total, estimados: est };
  }

  /* ================================================================ escala editada */

  const INICIO_EDICAO = '2028-01-10';   // uma segunda-feira já sob o teto de 40 h
  const dataIso = (z) => { const c = M.civil(z); return c.a + '-' + String(c.m).padStart(2, '0') + '-' + String(c.d).padStart(2, '0'); };
  /**
   * Confere no motor uma escala semanal editada (as semanas exibidas, sem repetição): linhas { id, nome, contrato,
   * dias: ['T'|'F'|'R'] × 7S, horas: [[entrada, saída, pausas]] × 7S }, com os instrumentos e a atividade do cenário.
   * Devolve a situação, os problemas por pessoa, as horas semanais de cada pessoa e a cobertura mínima de cada dia.
   */
  function validarGrade(linhas, semanas, opcoes) {
    let o = opcoes || {};
    // o.inicio: segunda-feira da primeira semana conferida (a etapa de 42 h usa 2027-01-04); o.etapa: 1 ou 2
    // o.repetir: semanas mínimas da conferência; a grade se repete, como no calendário, para conferir também a virada do
    // ciclo (dias seguidos, média do mês e saldo do mês) (D113)
    if (o.repetir && semanas > 0 && semanas < o.repetir) {
      const vezes = Math.ceil(o.repetir / semanas), nd = 7 * semanas;
      linhas = linhas.map((l) => Object.assign({}, l, { dias: Array.from({ length: nd * vezes }, (_, i) => l.dias[i % nd]), horas: Array.from({ length: nd * vezes }, (_, i) => l.horas[i % nd]) }));
      const semOrig = semanas;
      semanas = semOrig * vezes;
      o = Object.assign({}, o, { semanasCobertura: semOrig });
    }
    const ini0 = o.inicio || INICIO_EDICAO, z0 = M.lerData(ini0), n = 7 * semanas;
    const turnos = new Map(), escalas = [], empregados = [], atribuicoes = [];
    const idTurno = (h) => {
      const k = h[0] + '|' + h[1] + '|' + (h[2] || []).map((q) => q[0] + '-' + q[1]).join(',');
      if (!turnos.has(k)) {
        const id = 'T' + turnos.size;
        turnos.set(k, { id: id, nome: id, inicio: M.fmtHora(h[0]), fim: M.fmtHora(h[1]), pausas: (h[2] || []).map((q) => ({ inicio: M.fmtHora(q[0]), duracao: q[1] - q[0], tipo: 'usufruido' })) });
      }
      return turnos.get(k).id;
    };
    for (const l of linhas) {
      const dias = [];
      for (let i = 0; i < n; i++) dias.push(l.dias[i] === 'T' && l.horas[i] ? idTurno(l.horas[i]) : null);
      empregados.push(Object.assign({ id: l.id, nome: l.nome, admissao: '2020-01-01', setor: 'S' }, l.contrato === 'parcial' ? { tipo: 'parcial' } : {}, l.art386 ? { art386: true } : {},
        o.insalubre ? { insalubre: true } : {}, o.revezamento ? { revezamento: true } : {}));
      escalas.push({ id: 'E-' + l.id, tipo: 'semanal', dias: dias, trabalhaFeriados: true });
      atribuicoes.push({ empregado: l.id, escala: 'E-' + l.id, inicio: ini0, fim: dataIso(z0 + n - 1), ancora: ini0 });
    }
    const fim = M.civil(z0 + n - 1);
    const entrada = { empresa: { atividade: o.atividade || 'servicos' }, horizonte: { inicio: ini0, fim: fim.a + '-' + String(fim.m).padStart(2, '0') + '-' + String(fim.d).padStart(2, '0') }, feriados: [],
      turnos: Array.from(turnos.values()), escalas: escalas, empregados: empregados, atribuicoes: atribuicoes, excecoes: [], instrumentos: o.instrumentos || [] };
    const r = M.avaliar(entrada, { liminar: o.liminar !== false });
    const resumo = P._interno.resumir(r, o.etapa === 1 ? 1 : 2);
    const nomes = new Map(linhas.map((l) => [l.id, l.nome]));
    const problemas = [];
    for (const e of r.empregados) {
      const vistos = new Set();
      for (const a of e.achados) if (a.status === 'nao_cumpre' && !vistos.has(a.regra) && !(a.regra === 'R2' && !a.instrumento)) { vistos.add(a.regra); problemas.push({ pessoa: nomes.get(e.id) || e.id, regra: a.regra, porque: a.porque }); }
    }
    const ext = {};
    for (const l of linhas) ext[l.id] = { contrato: l.contrato === 'parcial' ? 'parcial' : 'integral', nova: !!l.nova };
    const eq = P._interno.medirEquipe(r, z0, n, ext);
    const horas = new Map(eq.pessoas.map((x) => [x.id, { rel: x.rel, comp: x.comp, dias: x.dias }]));
    const cobertura = [Infinity, Infinity, Infinity, Infinity, Infinity, Infinity, Infinity];
    for (let s = 0; s < (o.semanasCobertura || semanas); s++) for (let d = 0; d < 7; d++) {
      let c = 0;
      for (const l of linhas) if (l.dias[s * 7 + d] === 'T') c++;
      cobertura[d] = Math.min(cobertura[d], c);
    }
    // D113: a medida da equipe (eco) permite recalcular a folha da escala ajustada pelo mesmo cálculo dos cenários
    let maxJ = 0;
    for (const l of linhas) for (const h of l.horas) if (h) maxJ = Math.max(maxJ, h[1] - h[0] - (h[2] || []).reduce((s, q) => s + q[1] - q[0], 0));
    return { status: resumo.status, motivos: resumo.motivos, pendente: resumo.pendente, depende: resumo.depende, problemas: problemas, horas: horas, cobertura: cobertura, erros: r.erros.map((x) => x.onde + ': ' + x.msg),
      liminar: resumo.liminar, leituras: resumo.leituras, fundamentos: resumo.fundamentos, alertas: resumo.alertas, certeza: resumo.certeza, eco: Object.assign(eq, { maxJornada: maxJ }) };
  }

  /* "Conferir uma escala" (D114) e casos de referência: uma semana (ou ciclo de semanas) de uma pessoa, informada à mão, no
     formato { atividade, insalubre, revezamento, mulher, parcial, instr: [chaves], dias: [[{ t, ini, fim, iv } x 7], ...] }.
     A página e os testes de referência usam estas mesmas funções. */
  const INSTR_CONFERENCIA = { comp: 'comp', art7: 'art7', par2: 'par2!', media: 'media!', banco: 'banco!', x12: '12x36' };
  function linhaConferencia(c) {
    const dias = [], horas = [];
    for (const w of c.dias) for (const x of w) {
      const ini = M.lerHora(x.ini), fim0 = M.lerHora(x.fim);
      if (!x.t || ini == null || fim0 == null) { dias.push('F'); horas.push(null); continue; }
      let fim = fim0; while (fim <= ini) fim += 1440;

  /* ================================================================ avaliação e cartão */

  function situacaoDe(e1, e2, negociar, e3) {

    if (e2.status === 'nao_cumpre') return { codigo: 'transitorio', texto: 'Cumpre só até 15/12/2027' };
    if (e3 && e3.status === 'nao_cumpre') return { codigo: 'transitorio', texto: 'Não fecha todos os meses a partir de 16/12/2027' };

    for (const g of grupos) for (const p of g.pessoas) papel.set(p.id, g.papel);
    const rel = ajustesRelogio(grupos, meses);
    return meses.filter((m) => m.ini <= h1 && m.fim >= m0).map((m) => {
      const c = M.civil(m.ini);
      const r = { rot: m.rot, parcial: c.d > 1 ? M.fmtDataCurta(m.ini) : null, dia: 0, noite: 0, maxDia: 0, maxNoite: 0, relogio: rel.get(m.rot) || { dia: 0, noite: 0 } };

  function ponderacoesComuns(equipe, reg) {

:"proposta","situacao":"pendente","regras":["R6"]},{"id":"D14","tema":"Até 42 h em cinco dias na etapa de 42 h","padrao":"Depende de norma coletiva (EC, art. 7º)","alternativa":"Acordo individual de compensação","origem":"prompt","situacao":"aguarda validação (pergunta 6j)","regras":["J1"]},{"id":"D15","tema":"Compensação no mês (J4) e banco de horas (J5)","padrao":"Saldo das semanas de apuração atribuídas ao mês ou ao período (pela quinta-feira) contra a base semanal; base de 40 h quando já vigoram dois repousos e não há norma do art. 7º nem regime do § 2º; semana parcial entra só com eventual excesso; feriado não trabalhado reduz a base da semana em um quinto e não gera crédito","alternativa":"Limite da seção 4.6 (teto ÷ 7 por dia do mês), exibido como referência","origem":"proposta","situacao":"pendente (discordância 3); revista nesta etapa porque o limite diário da seção 4.6 acusa excesso falso em meses com 23 dias úteis","regras":["J4","J5"]},{"id":"D16","tema":"Critério da média mensal do § 2º","padrao":"Critério A: ⌈dias ÷ 7 × 2⌉","alternativa":"Critérios B e C, sempre exibidos","origem":"prompt","situacao":"aguarda validação (pergunta 6a); com a liminar na ADI 8.041 ligada, substituído pela janela de 28 dias (D102); critério A confirmado pela Portaria MTE 2.041/2026, art. 4º, § 4º (\"dobro do número de dias do mês dividido por sete, arredondado para o número inteiro imediatamente superior\"); desde 24/11/2026 vale também com a liminar, sem a janela de 28 dias (D119). Fica a validar só o mês de 28 dias, em que a conta é exata (8): o simulador não arredonda para 9","regras":["R2"]},{"id":"D17","tema":"Meses parciais no § 2º","padrao":"Forma proporcional de cada critério (seção 4.7)","alternativa":"—","origem":"prompt","situacao":"aguarda validação (pergunta 6h)","regras":["R2"]},{"id":"D18","tema":"Art. 9º","padrao":"Leitura literal: o inciso XV vale desde 16/12/2026","alternativa":"Dois repousos também diferidos até o aditamento","origem":"prompt","situacao":"aguarda validação (pergunta 6e)","regras":["R13","R1"]},{"id":"D19","tema":"Art. 8º","padrao":"Remuneração vigente no 1º dia do mês contra 2,5 × teto do RGPS do ano; controle mantido por liberalidade ou norma coletiva afasta o enquadramento; teto do ano não informado não enquadra; R5, R6 e R8 informativos","alternativa":"—","origem":"proposta","situacao":"pendente (discordância 9 e pergunta 6d)","regras":["R10"]},{"id":"D20","tema":"Instrumentos coletivos anteriores à Emenda","padrao":"Sem marca de compatibilidade, deixam de valer a partir de 16/12/2026; acordos individuais não são alcançados pelo art. 3º","alternativa":"—","origem":"proposta","situacao":"pendente (discordância 10)","regras":["R15","R2","J1","R6"]},{"id":"D21","tema":"Significado de \"cumpre com condição\"","padrao":"A escala depende do instrumento indicado; a marca \"atendida\" diz se ele está cadastrado, vigente e compatível","alternativa":"—","origem":"proposta","situacao":"pendente","regras":["J1","J2","J3","J4","R6","R7","R8"]},{"id":"D22","tema":"Turnos sobrepostos do mesmo empregado","padrao":"Cada turno conta as próprias horas e a sobreposição é sinalizada em R5 como erro de cadastro","alternativa":"—","origem":"proposta","situacao":"pendente","regras":["R5"]},{"id":"D23","tema":"Feriado em dia de trabalho","padrao":"Não trabalhado, salvo escala marcada para trabalhar em feriados ou exceção do dia; a 12x36 trabalha por padrão","alternativa":"—","origem":"proposta","situacao":"pendente","regras":["R7"]},{"id":"D24","tema":"Folga compensatória de feriado trabalhado (R7)","padrao":"Aceita se registrada entre 6 dias antes e 13 dias depois do feriado","alternativa":"—","origem":"proposta","situacao":"pendente; a lei não fixa prazo e a janela foi escolhida por mim","regras":["R7"]},{"id":"D25","tema":"Sequência de dias de trabalho (R3)","padrao":"Qualquer dia sem início de turno interrompe a sequência","alternativa":"—","origem":"proposta","situacao":"pendente","regras":["R3"]},{"id":"D26","tema":"Detecção de turno ininterrupto de revezamento (R8)","padrao":"No mês, horários de início que diferem 4 h ou mais e algum turno com minutos entre 22h e 5h","alternativa":"—","origem":"proposta","situacao":"pendente","regras":["R8"]},{"id":"D27","tema":"Intervalo intrajornada (R6)","padrao":"30 a 59 min depende de norma coletiva (art. 611-A, III) ou autorização do art. 71, § 3º; abaixo de 30 min não cumpre; acima de 2 h depende de acordo escrito ou norma coletiva; fracionado depende de norma coletiva (art. 71, § 5º); indenizado só na 12x36; alerta para intervalo na primeira ou na última hora","alternativa":"—","origem":"pedido","situacao":"implementado conforme pedido de 26/10/2026; detalhes pendentes de validação","regras":["R6"]},{"id":"D28","tema":"Início de férias (F1)","padrao":"Não cumpre se um dos dois dias seguintes for feriado ou folga da escala","alternativa":"—","origem":"proposta","situacao":"pendente (discordância 5)","regras":["F1"]},{"id":"D29","tema":"Escalas combinadas e trocas no mês","padrao":"Toda escala é um padrão cíclico de N dias com âncora; atribuições por período com qualquer data de início; modelos semanais ancorados na segunda-feira","alternativa":"—","origem":"pedido","situacao":"implementado","regras":["R1","R3","R5"]},{"id":"D30","tema":"Divergência no caso 11.1 (semana de 27/12/2027)","padrao":"O motor apura 4 h de excedente na semana de 27/12/2027, porque o teto já é 40 h","alternativa":"—","origem":"prompt","situacao":"resolvido: esperado do caso 11.1 corrigido para 4 h por decisão do usuário em 26/10/2026","regras":["J3"]},{"id":"D31","tema":"Desempenho","padrao":"Avaliação padrão a cada alteração; leituras alternativas calculadas em segundo plano no navegador","alternativa":"—","origem":"proposta","situacao":"meta de 2 s a conferir no navegador num notebook comum","regras":[]},{"id":"D32","tema":"12x36 com troca de escala no mês da transição","padrao":"Na regra J6, a média de cada ciclo de 12x36 é comparada ao teto das semanas em que aquela escala é usada; antes, era comparada a todas as semanas do mês","alternativa":"—","origem":"proposta","situacao":"corrigido em 26/10/2026 (motor 0.1.1), com o caso N21; os 51 testes anteriores continuam passando sem alteração de esperados","regras":["J6"]},{"id":"D33","tema":"Quadro mínimo e distribuição de folgas nos cenários","padrao":"Quadro = maior necessidade diária ou soma da semana dividida pelos dias de trabalho por pessoa, o que for maior; folgas nos dias com mais sobra de pessoas; rodízio semanal em que a primeira folga de uma semana não vem depois da última folga da anterior (no máximo 6 dias seguidos)","alternativa":"Folgas fixas por pessoa, oferecidas como cenário separado fora do comércio","origem":"proposta","situacao":"a validar","regras":["R1","R3"]},{"id":"D34","tema":"Comércio com operação aos domingos","padrao":"Toda pessoa que trabalha aos domingos entra em rodízio com folga em ao menos um domingo a cada três semanas (Lei 10.101/2000, art. 6º, parágrafo único); por isso o cenário de folgas fixas não é oferecido nesse caso","alternativa":"—","origem":"proposta","situacao":"a validar; norma coletiva ou lei municipal podem prever regra própria","regras":["R4"]},{"id":"D35","tema":"Tempo parcial nos cenários","padrao":"Até 30 h semanais sem horas extras (CLT, art. 58-A), medidas em horas computadas (no turno noturno, a hora reduzida conta); dias por semana = 30 h divididas pela jornada computada, até 5; os parciais ficam nos dias de maior necessidade; o cenário só aparece quando o turno precisa contratar e não substitui ninguém do quadro atual","alternativa":"Modalidade de até 26 h com até 6 h extras, não modelada","origem":"proposta","situacao":"a validar","regras":["R14"]},{"id":"D36","tema":"Férias no dimensionamento","padrao":"Com a premissa ligada (padrão da tela), cada cenário recebe gente suficiente para que a capacidade semanal da equipe, descontados 30 dias de férias por pessoa no ano, cubra a necessidade: capacidade × 335 ≥ necessidade × 365. Substitui o cenário separado de reserva e a aproximação de 22 dias úteis","alternativa":"Premissa desligada: quadro mínimo, sem cobertura de férias","origem":"pedido","situacao":"pedido do usuário em 27/10/2026","regras":[]},{"id":"D37","tema":"Ordem dos cenários sugeridos","padrao":"Primeiro a situação jurídica (cumpre; com acordo individual; depende de negociação coletiva; não cobre a operação; cumpre só até 15/12/2027; não cumpre), depois as horas contratadas por semana e o número de contratações; os três primeiros são os sugeridos","alternativa":"O usuário pode escolher qualquer cenário ou montar o seu","origem":"pedido","situacao":"pedido do usuário em 26/10/2026 (ao menos 3 sugestões)","regras":[]},{"id":"D38","tema":"Feriados","padrao":"Os cenários tratam feriados como dias normais de trabalho e exibem aviso sobre os requisitos do trabalho em feriado: autorização (no comércio, convenção coletiva e legislação municipal, Lei 10.101/2000, art. 6º-A; nas demais atividades, conforme o caso, acordo ou convenção coletiva) e contrapartida (folga compensatória ou pagamento em dobro, Lei 605/1949, art. 9º; Súmula 146 do TST)","alternativa":"Feriados avaliados dia a dia pelo motor (R7), como no calendário por empregado","origem":"pedido","situacao":"pedido do usuário em 27/10/2026","regras":["R7"]},{"id":"D39","tema":"12x36 só com norma coletiva","padrao":"O planejador só aceita a 12x36 com convenção ou acordo coletivo marcado; sem isso, os cenários de 12x36 e o diagnóstico de quem já está em 12x36 aparecem como dependentes de negociação. O acordo individual escrito, embora previsto no art. 59-A da CLT, não assegura a validade da escala. O motor continua reconhecendo o acordo individual pela letra da lei; a exigência fica no planejador","alternativa":"Aceitar acordo individual escrito (letra do art. 59-A)","origem":"pedido","situacao":"pedido do usuário em 27/10/2026; o Decreto 13.173/2026 (art. 3º) remete à norma coletiva só a compensação ou o pagamento das horas acima do limite e não trata do acordo individual: a leitura segue a validar; a Portaria MTE 2.041/2026 (art. 13, § 4º) manda adequar \"no que couber\" os acordos individuais de 12x36, o que pressupõe que eles existam, e remete à norma coletiva só o excedente da média (art. 8º); a leitura segue até decisão do usuário (D119)","regras":["J2","J6"]},{"id":"D40","tema":"Dias de folga escolhidos pelo usuário","padrao":"No cadastro, cada empregado em escala semanal pode ter os dias de folga marcados; o diagnóstico usa esses dias e distribui conforme a necessidade só as folgas não informadas. No cenário montado, os dias de folga podem ser escolhidos pessoa a pessoa, fixos ou girando entre as pessoas a cada semana; se o giro passar de 6 dias seguidos (ou, no comércio, de três semanas sem domingo), as folgas ficam fixas e o cenário avisa","alternativa":"—","origem":"pedido","situacao":"pedido do usuário em 27/10/2026","regras":["R1","R3","R4"]},{"id":"D41","tema":"12x36 noturna e teto de 40 h","padrao":"Com a leitura padrão (horas computadas), o plantão de 19h às 7h com 1 h usufruída (das 0h30 à 1h30) tem 11 h de relógio e 11h51min26s computadas pela hora reduzida sobre as 6 h trabalhadas entre 22h e 5h; a média do ciclo é de 41h30, acima do teto de 40 h a partir de 16/12/2027. Pela leitura alternativa (horas de relógio), a média é de 38h30","alternativa":"Horas de relógio nas regras de teto","origem":"derivado","situacao":"a validar: leitura com impacto relevante em vigilância, portaria e saúde; desde 23/11/2026 (D118), a média acima do limite não tira a 12x36 da adequação: depende de norma coletiva com compensação ou pagamento das horas (Decreto 13.173/2026, art. 3º)","regras":["J6"]},{"id":"D42","tema":"Horário de funcionamento","padrao":"Cada turno pode ter horário por dia da semana. Cenários que alteram entrada ou saída em algum dia de operação são marcados como mudança de horário; se o turno foi marcado como de horário fixo, ficam abaixo dos que mantêm o horário (4x3 no horário atual, quando cada dia cabe em 10 h e a semana em 40 h; ou duas equipes de até 8 h escalonadas). Sem resposta, o simulador pergunta","alternativa":"—","origem":"pedido","situacao":"pedido do usuário em 27/10/2026","regras":["J1","J3"]},{"id":"D43","tema":"Semana de 42 h com o último dia mais curto","padrao":"Quando todos trabalham os mesmos cinco dias e a jornada atual passa de 40 h: até 8h30 nos quatro primeiros dias e o restante até 42 h no último, até 12/12/2027; depois, até 8 h por dia. Pela leitura adotada (D14), depende de convenção ou acordo coletivo do art. 7º; pela alternativa, de acordo individual de compensação","alternativa":"Acordo individual escrito de compensação (leitura alternativa do art. 7º)","origem":"pedido","situacao":"a validar: o exemplo do usuário (seg a qui 8h às 17h30, sex 8h às 17h) depende da norma coletiva pela leitura adotada","regras":["J1","J4"]},{"id":"D44","tema":"Cenário montado com horário por dia","padrao":"Dias acima de 8 h em semana de até 40 h: acordo individual de compensação, registrado só a partir da etapa em que for necessário; semana acima de 40 h com dias acima de 8 h (etapa de 42 h): norma coletiva do art. 7º, sem a qual o excedente é hora extra","alternativa":"—","origem":"proposta","situacao":"a validar","regras":["J1","J4"]},{"id":"D45","tema":"Descrição da operação em texto","padrao":"O texto é enviado ao Claude na conta de quem usa a página e volta em formato fixo; a página confere cada campo, deixa em branco o que não veio, lista as interpretações e o que faltou e só usa os dados após confirmação. Intervalo não informado vira 60 min e escala não informada vira 6x1, ambos sinalizados para conferência","alternativa":"—","origem":"pedido","situacao":"retirado em 27/10/2026, a pedido do usuário, para não consumir uso do Claude; a página não declara mais esse recurso","regras":[]},{"id":"D46","tema":"Acordo individual × negociação coletiva","padrao":"Acordo individual escrito só para redistribuir horas dentro da mesma semana, mantidos dois repousos em cada semana (por exemplo, 4x3 de até 10 h ou dias acima de 8 h em semana de até 40 h). Arranjos que tenham como premissa a média mensal de dois repousos semanais (CF, art. 7º, § 2º) dependem de convenção ou acordo coletivo; o motor não aceita o regime de média, a ampliação do art. 7º, o turno ininterrupto de até 8 h, o banco anual nem as demais hipóteses reservadas à negociação coletiva quando cadastrados como acordo individual (motor 0.1.2, caso N22)","alternativa":"—","origem":"pedido","situacao":"leitura do usuário em 27/10/2026; a distribuição de 42 h em cinco dias segue a leitura D14 (norma coletiva do art. 7º)","regras":["R2","J1","J4","R8"]},{"id":"D47","tema":"Férias no dimensionamento","padrao":"Padrão: manter a cobertura de hoje. Se a equipe atual já comporta 30 dias de férias por pessoa no ano (capacidade × 335 ≥ necessidade × 365), os cenários mantêm essa folga; se não comporta, também não contratam por causa das férias, porque a lacuna não decorre da Emenda Constitucional 141 (Fim da 6x1). Opções: reservar sempre (comportamento anterior) ou não considerar. Dados salvos com a premissa ligada passam a manter a cobertura de hoje","alternativa":"Reservar gente para todas as férias em todo cenário","origem":"pedido","situacao":"adotado em 27/10/2026 a partir da observação do usuário de que os cenários sempre contratavam","regras":[]},{"id":"D48","tema":"Rearranjo do funcionamento sem contratar","padrao":"Quando o horário do turno não foi marcado como fixo: (a) deixar de abrir em um ou dois dias, só entre os dias com necessidade até a média da semana, escolhendo o menor número de dias e a menor perda de horas; (b) 5x2 com o quadro atual e menos gente nos dias de menor movimento; (c) no plantão de 12 h, 5x2 de até 8 h com horário encurtado. Situação: cumpre, com rearranjo. Se o horário pode mudar, o melhor cenário sem contratação vem em primeiro; sem resposta, fica entre as três sugestões. Com horário fixo, esses cenários não aparecem ou aparecem como lacuna","alternativa":"—","origem":"pedido","situacao":"a validar; a posição entre as sugestões deixou de aparecer no resultado com a D112 (18/11/2026)","regras":[]},{"id":"D49","tema":"Modelo de custo","padrao":"Salário mensal de tempo integral informado por turno; quem já está no quadro mantém o salário (Emenda Constitucional 141/2026 – Fim da 6x1, art. 2º); tempo parcial proporcional às horas computadas do tempo integral (CLT, art. 58-A, § 1º), sem redução para quem já está no quadro. Salário-hora = salário ÷ (horas semanais computadas × 5): 220 para 44 h, 210 para 42 h e 200 para 40 h (Súmula 431 do TST para 40 h; 42 h pela mesma fórmula, a conferir). 365 ÷ 12 ÷ 7 semanas por mês. Adicional noturno sobre as horas noturnas pagas como reduzidas, com o percentual informado (20% por padrão, CLT, art. 73). Encargos: percentual informado pelo usuário, sem valor padrão. Horas medidas em 04/01 a 28/02/2027 (hoje e etapa de 42 h) e em 13/12/2027 a 30/01/2028 (etapa de 40 h)","alternativa":"Divisor por outra fórmula ou pela norma coletiva","origem":"proposta","situacao":"a validar; divisores de 210 (42 h) e 200 (40 h) confirmados pelo Decreto 13.173/2026, art. 5º, com o inferior prevalecendo quando a jornada é menor (aplicado em 23/11/2026, D118)","regras":[]},{"id":"D50","tema":"Reflexo das horas extras habituais nos repousos","padrao":"Estimado pela razão entre dias de repouso e dias de trabalho da semana (2/5 na 5x2, 3/4 na 4x3), considerando os dois repousos semanais remunerados (CF, art. 7º, XV; Lei 605/1949, art. 7º; Súmula 172 do TST)","alternativa":"Só o repouso semanal de um dia, ou a conta mês a mês por dias úteis e repousos","origem":"proposta","situacao":"a validar: a incidência sobre o segundo repouso decorre da nova redação do inciso XV e ainda não tem jurisprudência","regras":[]},{"id":"D51","tema":"Horas extras em revezamento como alternativa","padrao":"Quando o cenário encurta o horário de hoje, as pessoas necessárias estendem a jornada em revezamento até a entrada ou a saída de hoje, só se a extensão for de até 2 h por dia (CLT, art. 59), a jornada total ficar em até 10 h e restarem 11 h até a jornada seguinte (art. 66). Não cobrem dia em que o turno deixa de abrir (seria trabalho em dia de repouso) nem jornadas que já chegam a 10 h, como a 12x36. Sem encurtamento, a perda de horas é repartida entre os dias de trabalho dos integrais, com o aviso de que horas extras não repõem a pessoa que falta num dia. A hora extra habitual integra a remuneração e sua supressão após um ano gera indenização (Súmula 291 do TST)","alternativa":"—","origem":"pedido","situacao":"a validar","regras":["J1","J2","R5"]},{"id":"D52","tema":"Custo de manter a escala de hoje","padrao":"Referência, não caminho de conformidade: cada repouso semanal que falta para chegar a dois é dia de repouso trabalhado pago em dobro (Súmula 146 do TST, por analogia, 2 × salário/30); as horas dos demais dias acima de 40 h são extras, com o adicional informado e reflexo nos repousos; encargos informados. Não inclui multas administrativas, dano moral coletivo nem custos de processo","alternativa":"Tratar todo o excedente como hora extra, sem dobra","origem":"pedido","situacao":"a validar (protótipo de 29/10/2026)","regras":["R1","J3"]},{"id":"D53","tema":"Calculadora de encargos por regime","padrao":"Lucro real ou presumido: 20% de contribuição patronal, RAT × FAP e terceiros conforme o FPAS (Lei 8.212/1991, art. 22), FGTS de 8% (Lei 8.036/1990, art. 15), provisões de 13º (1/12) e de férias com o terço (1/9), e os encargos sobre as provisões. Simples Nacional, Anexos I a III e V: só FGTS e provisões; Anexo IV: contribuição patronal e RAT à parte, sem terceiros. Só no perfil do escritório, com conferência pela contabilidade","alternativa":"Percentual informado diretamente","origem":"proposta","situacao":"a validar","regras":[]},{"id":"D54","tema":"Entrada por grupos","padrao":"Uma linha por grupo de pessoas com a mesma escala e o mesmo horário. A necessidade por dia passa a ser a cobertura de hoje (pessoas × dias de trabalho da escala, divididas pelos dias de funcionamento; a sobra vai para sábado, sexta e segunda), ajustável; grupos com o mesmo horário e dias formam um só turno; o intervalo é o mínimo do art. 71 da CLT pela duração da presença, salvo informação diferente no perfil do escritório; empregados com nomes genéricos e folgas distribuídas pelo planejador","alternativa":"Cadastro individual com folgas (simulador completo)","origem":"pedido","situacao":"protótipo para teste de uso; a cobertura presumida supõe que o quadro de hoje reflete a necessidade","regras":[]},{"id":"D55","tema":"Caminhos comparados","padrao":"Até quatro por grupo: sem contratar (menor perda de produção), sem contratar com horas extras em revezamento (só se as horas extras repõem toda a perda), mantendo a operação (sem perda, menor custo) e com norma coletiva (só se, na etapa de 40 h, for mais barato ou contratar menos que manter a operação, ou perder menos que o sem contratar). Sugerido: o sem contratar quando o horário pode mudar; senão, o de menor custo sem perda de produção, exceto o que depende de negociação. Produção perdida medida pelas horas que cobrem a necessidade","alternativa":"—","origem":"pedido","situacao":"protótipo para teste de uso","regras":[]},{"id":"D56","tema":"Entrada em quatro etapas, por função","padrao":"Empresa (setor com funções e horários sugeridos, dias e horário de funcionamento, se o funcionamento pode mudar, regime tributário), Equipe (uma ficha por função com escala, salário, dias e um ou mais turnos com pessoas), Movimento (opcional) e Custos (opcional). Funções diferentes não se juntam no cálculo, porque uma não cobre a necessidade da outra; os dias de funcionamento não se confundem com os dias de trabalho de cada pessoa","alternativa":"Cadastro individual (versão 1) ou pergunta única (protótipos)","origem":"pedido","situacao":"adotado em 05/11/2026 (meio-termo após o teste do simulador do Sebrae)","regras":[]},{"id":"D57","tema":"Faturamento por dia na escolha dos dias","padrao":"Opcional. Quando informado por dia e marcado para uso: as folgas desempatam pelos dias de menor faturamento, o tempo parcial vai para os de maior, os dias acima da média ficam protegidos quando o quadro não cobre tudo (cada dia fraco perde no máximo metade da necessidade) e, se for preciso deixar de abrir, fecha-se o de menor faturamento entre os que estão abaixo da média. A necessidade de cada turno continua sendo a cobertura de hoje; o faturamento é aproximação do movimento","alternativa":"Redistribuir a necessidade pelo faturamento","origem":"pedido","situacao":"adotado em 05/11/2026","regras":[]},{"id":"D58","tema":"Caminhos para os dias que ficam com menos gente","padrao":"A partir do 5x2 com o quadro de hoje: E, contrato intermitente em todos os setores (hora pelo salário-hora da função, 13º e férias com o terço proporcionais, repousos remunerados pela razão 2/5 da D50 e encargos sem as provisões; CLT, arts. 443, § 3º, e 452-A); F, diárias de freelancer só em varejo e bares e restaurantes, pelo valor informado, sem encargos, com o aviso de risco de vínculo quando a mesma pessoa vier toda semana (CLT, art. 3º)","alternativa":"Diárias em todos os setores ou em nenhum","origem":"pedido","situacao":"substituído pela D77 em 10/11/2026","regras":[]},{"id":"D59","tema":"Domingo em bares e restaurantes","padrao":"Aplica a regra do comércio de folga em um domingo a cada três semanas (Lei 10.101/2000, art. 6º, parágrafo único), leitura mais cautelosa; pode ser desligada nos ajustes avançados","alternativa":"Regime das atividades com autorização permanente para o trabalho aos domingos, sem a regra das três semanas","origem":"proposta","situacao":"a validar","regras":["R4"]},{"id":"D60","tema":"Encargos padrão","padrao":"Pelo regime informado: Simples (Anexos I a III e V) só FGTS e provisões; Anexo IV com contribuição patronal e RAT; lucro presumido ou real com contribuição patronal, RAT e terceiros. Sem RAT e terceiros informados, 2% de RAT com FAP 1 e 5,8% de terceiros; regime não informado é tratado como lucro presumido ou real (o mais caro)","alternativa":"Percentual único informado","origem":"proposta","situacao":"a validar","regras":[]},{"id":"D61","tema":"Desempates do caminho sem contratar","padrao":"Com a mesma perda de horas, prefere menos gente nos dias fracos a deixar de abrir um dia. Sem faturamento por dia, no comércio o sábado é o último dia a deixar de abrir; nas demais atividades, a ordem anterior (domingo, sábado, segunda…)","alternativa":"—","origem":"proposta","situacao":"adotado em 05/11/2026","regras":[]},{"id":"D62","tema":"Escala editada","padrao":"Nas escalas semanais, cada dia pode ser trocado entre trabalho e folga; o motor confere as semanas exibidas, sem repetição, com os instrumentos e a atividade do cenário, e aponta por pessoa os problemas e os dias com menos gente que a escala sugerida. Escalas em ciclo de plantões (12x36, 6x2) não são editáveis","alternativa":"—","origem":"proposta","situacao":"adotado em 05/11/2026","regras":[]},{"id":"D63","tema":"Escala personalizada de hoje","padrao":"Ciclo de 1 a 6 semanas informado dia a dia: folga, jornada do turno ou outra duração (com a entrada do turno e o intervalo mínimo do art. 71 para essa duração). Com revezamento, cada pessoa começa o ciclo numa semana diferente; sem ele, todos estão na mesma semana. A necessidade de cada dia é a presença média no ciclo; o horário de cada dia nos cenários é a jornada mais frequente desse dia","alternativa":"Lista fechada de escalas","origem":"pedido","situacao":"adotado em 05/11/2026","regras":[]},{"id":"D64","tema":"Calendário de 2027","padrao":"A escala de hoje e a do caminho escolhido avaliadas no motor de 01/01 a 31/12/2027. Vermelho: algum achado que não cumpre cobre o dia; âmbar: depende de norma ainda não firmada ou fica menos gente que a necessidade de hoje; verde: cumpre e cobre; cinza: ninguém escalado e sem necessidade (os problemas da semana aparecem na janela do dia). Feriados nacionais marcados e tratados como dias normais; a escala editada se repete a cada ciclo exibido","alternativa":"—","origem":"pedido","situacao":"adotado em 05/11/2026","regras":[]},{"id":"D65","tema":"Comparação dos caminhos","padrao":"Uma linha por caminho com o que a empresa faz em termos concretos (dias com menos gente, contratações, intermitentes, diárias), barra de custo mensal contra a folha de hoje, contratações, trabalho perdido e segurança jurídica; caminhos que não se aplicam aparecem com o motivo","alternativa":"Cartões","origem":"pedido","situacao":"adotado em 05/11/2026","regras":[]},{"id":"D66","tema":"Horário por dia","padrao":"Funcionamento da empresa com horário próprio em cada dia (o padrão vale para todos até ser alterado). Nas escalas semanais (6x1, 5x2, 4x3, tempo parcial), cada turno pode ter entrada e saída diferentes por dia, com o intervalo mínimo do art. 71 pela duração do dia; o diagnóstico e os cenários usam o horário de cada dia. O faturamento por dia aceita todos os dias, e a ficha da função avisa quando ela trabalha em dia fechado na empresa","alternativa":"Horário único","origem":"pedido","situacao":"adotado em 06/11/2026","regras":[]},{"id":"D67","tema":"Planilha de preenchimento rápido","padrao":"Modelo com as abas Instruções, Empresa, Funcionamento e Equipe (uma linha por turno), lido no navegador e convertido nas etapas do simulador, com resumo do que entrou, avisos do que não foi aproveitado e opção de desfazer. Fica de fora o que só a simulação completa capta: horário por dia nos turnos, escala personalizada, intervalo, 12x36 com intervalo pago, normas coletivas e ajustes do escritório; o aviso de precisão aparece junto ao botão","alternativa":"—","origem":"pedido","situacao":"substituído pela D78 em 10/11/2026","regras":[]},{"id":"D68","tema":"Downloads fora do claude.ai","padrao":"No claude.ai, o PDF, o Excel e o modelo de planilha saem pela capacidade de downloads, que só funciona para quem está conectado a uma conta do Claude; a página avisa os demais e aponta para os endereços públicos configurados (modelo e cópia hospedada). A mesma página, aberta fora do claude.ai (site do escritório ou arquivo no navegador), baixa os três arquivos direto, sem conta. O claude.ai não serve .xlsx como arquivo anexo à página","alternativa":"—","origem":"pedido","situacao":"adotado em 06/11/2026","regras":[]},{"id":"D69","tema":"Setores e cargos","padrao":"Doze setores com base no simulador Escala Sebrae (consultado em 10/11/2026), mais \"Outro setor\"; cada setor traz uma lista fechada de cargos com escala, duração e dias sugeridos, e a opção \"Outro cargo\" para digitar. Indústria, logística e agro ampliados para empresas médias e grandes (montador, operador de máquinas, inspetor de qualidade, técnicos de manutenção, separador, conferente, almoxarife e outros). As sugestões valem até a pessoa mexer na escala ou no horário da função. Cargos com regra própria trazem a nota: fisioterapeuta (Lei 8.856/1994), técnico em radiologia (Lei 7.394/1985), teleatendimento (NR-17, Anexo II; CLT, art. 227), professor (CLT, arts. 317 a 323), motorista profissional (Lei 13.103/2015), motociclista (CLT, art. 193, § 4º) e trabalho rural (Lei 5.889/1973). Atividade para o motor: comércio para varejo e alimentação (D59); os demais como serviços ou indústria, como antes","alternativa":"Lista anterior de oito setores","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D70","tema":"Salário por hora","padrao":"O salário de cada função pode ser informado por mês ou por hora. Por hora, o mensal é a hora × o divisor da jornada de hoje, horas semanais × 5 (220 para 44 h; 200 para 40 h), com as horas semanais medidas na escala informada (média dos turnos pelas pessoas); o divisor pode ser informado. O mensal assim obtido é o que se mantém depois da Emenda Constitucional 141 (Fim da 6x1), art. 2º (D49), e a hora sobe com a jornada menor. Na 12x36 a fórmula dá 192,5 com intervalo tirado e 210 com intervalo pago; há normas coletivas com 180 ou 210, por isso o aviso e o campo do divisor (a validar)","alternativa":"Divisor 180 ou 210 fixo na 12x36","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026; em parte superado pela D90 em 12/11/2026 (o valor por hora passa a indicar horista)"},{"id":"D71","tema":"Dados setoriais da tela inicial","padrao":"Só números com fonte conferida: proporção de vínculos CLT acima de 40 h por setor (DIEESE, Emprego em Pauta nº 32, maio/2026, Gráfico 2, RAIS 2024), 75% e 36,6 milhões no total, e as estimativas do MTE sobre a 6x1 (33,2% dos vínculos de 44 h, cerca de 15 milhões; alojamento 52%, alimentação 47,1%, comércio 42,2%), na forma divulgada pelo DIEESE. A projeção \"até +x% de pessoas\" é cálculo do simulador (proporção acima de 40 h × 10%, supondo 44 h), identificada como tal e tratada como teto. Não usamos os percentuais de expectativa de impacto que o Escala Sebrae atribui à Pesquisa Pulso, 12ª edição, porque não batem com o relatório público da pesquisa (27% no total)","alternativa":"Reproduzir os números do Escala Sebrae","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D72","tema":"Resultado em abas","padrao":"O resultado abre com o diagnóstico e a linha do tempo da escala de hoje em cada etapa (hoje, 16/12/2026 e 16/12/2027). Os caminhos viram abas (recomendado, sem contratar, horas extras, contratar e os que se aplicarem), com a folha de hoje ao lado da folha do caminho, contratações, horas de trabalho e segurança jurídica, e um parágrafo que compara os caminhos com os valores calculados. A tabela completa fica num bloco que se abre. A escala semanal mostra a transição (até 42 h) e a definitiva (40 h); só a definitiva é editável. Fora do claude.ai, a escala sugerida também sai em arquivo de agenda (.ics), com pessoas identificadas só por número","alternativa":"Tabela de caminhos como primeira leitura","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D73","tema":"Perfil único","padrao":"Sem a escolha entre empresa e escritório: um fluxo só, com os ajustes que eram do escritório (encargos item a item, adicionais, normas coletivas, férias no dimensionamento, domingo do comércio, intervalo e flexibilidade por função, caminho por função e detalhe jurídico) disponíveis a todos e recolhidos em blocos que se abrem","alternativa":"Dois perfis","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D74","tema":"Sem horário de funcionamento da empresa","padrao":"A etapa de funcionamento saiu. O que importa é a cobertura de cada função: cada uma tem os seus dias de trabalho (sugeridos pelo cargo ou pelo setor) e os seus turnos, e o resultado mostra, função por função, se o período fica coberto como hoje. Nome, regime tributário e a pergunta se a empresa aceita reorganizar para não contratar ficam na etapa do setor. Na planilha, a aba Funcionamento virou Faturamento (opcional); a aba antiga ainda é lida, só pelo faturamento","alternativa":"Funcionamento da empresa por dia (D66)","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D75","tema":"Início em branco","padrao":"A simulação começa sem setor e sem funções, sem exemplo pré-carregado; a equipe é montada cargo a cargo. A simulação salva no navegador aparece na tela inicial como \"Continuar simulação\", ao lado de \"Nova simulação\"","alternativa":"Loja de exemplo pré-carregada","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D76","tema":"Resultado no formato do Sebrae, com as horas perdidas","padrao":"Depois do diagnóstico e da linha do tempo, um bloco mostra quanto a equipe deixa de trabalhar por mês sem contratar e sem hora extra: pelo novo teto (42 h e 40 h, soma pessoa a pessoa das horas acima do teto, o mínimo) e pela escala que cumpre sem contratar (caminho \"manter a equipe\", que pode perder mais quando mantém o horário diário de hoje em cinco dias), e o custo de não mudar a escala. Os caminhos ficam em abas: manter a equipe (sem hora extra ou pagando hora extra), contratar +N (reposição integral), tempo parcial, freelancer, norma coletiva e o recomendado; cada aba compara a folha de hoje com a do caminho e diz as horas, as contratações e a segurança jurídica. Horas por mês: horas semanais × 365/12/7","alternativa":"Resultado em tabela de caminhos","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D77","tema":"Sem intermitente; tempo parcial e freelancer","padrao":"O contrato intermitente não é sugerido. O reforço em tempo parcial (CLT, art. 58-A: até 30 h por semana, salário proporcional, dois repousos) entra como caminho próprio (P) quando o melhor contratar é outro, e já aparece dentro do contratar quando ele é o mais barato. Diárias de freelancer só em varejo, alimentação e hospedagem e só quando o que falta cai em até dois dias por semana. Ressalva: o limite de dois dias por semana vem da lei do trabalho doméstico (LC 150/2015, art. 1º); para empresas, o critério é a não eventualidade (CLT, art. 3º), e a mesma pessoa toda semana, mesmo em um ou dois dias, pode ser reconhecida como empregada","alternativa":"Intermitente em todos os setores e diárias sem limite de dias (D58)","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D78","tema":"Entrada por planilha retirada","padrao":"A pedido, a equipe é montada só pelas etapas do simulador: o botão de importar, o modelo de planilha e o arquivo do modelo no pacote do site saem. A exportação em Excel do resultado continua","alternativa":"Planilha de preenchimento rápido (D67)","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026; substitui a D67"},{"id":"D79","tema":"Regime de média do § 2º no resumo e no calendário","padrao":"Com a norma coletiva de média de repousos cadastrada, a semana com um repouso só (R1) fica atendida pela norma quando os meses que ela toca, e que foram apurados, cumprem a média (R2 com a norma); a situação passa a cumpre com a norma coletiva. O calendário segue a mesma regra. Mês fora da janela apurada não conta contra","alternativa":"R1 como descumprimento mesmo com a média cumprida (comportamento anterior)","origem":"derivado","regras":["R1","R2"],"situacao":"adotado em 10/11/2026 (planejador; casos PL31 e PL32); o critério da média continua a validar (D16, pergunta 6a); critério da média confirmado pela Portaria MTE 2.041/2026 (D119): a semana atendida pela média deixou de ser marcada como leitura"},{"id":"D80","tema":"Exercício: folgas pela média do mês","padrao":"Opcional, ligado na etapa da equipe e aberto numa seção própria do resultado, que não altera o resultado principal. Para cada função, fora 12x36 e tempo parcial: ciclos prontos 6-4-5-4 (9 repousos em 28 dias), 6 e 4 alternados (8 em 28) e 6x2 (só com os sete dias), ou ciclo montado dia a dia. Nos prontos, as folgas caem nos dias da função, espalhadas e de preferência emendadas, sem sete dias seguidos (também na volta do ciclo), com domingo de folga a cada duas semanas no comércio, até 8 h por dia e até 40 h por semana (6h40 na semana de seis dias). Conferido no motor com a norma de média cadastrada, nas duas etapas, pelo critério A; mostra horas por pessoa e da função, presença média por dia e a folha, que não muda. Aviso fixo: depende de convenção ou acordo coletivo (CF, art. 7º, § 2º; D46)","alternativa":"Só a opção avançada de média de repousos, que muda o resultado principal","origem":"pedido","regras":["R1","R2","R3","R4","J3"],"situacao":"adotado em 10/11/2026; em todos os ciclos testados, dezembro de 2026 (regra a partir de 16/12, mês parcial) fica abaixo do mínimo para parte da equipe: contagem do mês parcial a validar"},{"id":"D81","tema":"Distribuição da equipe nas 24 horas","padrao":"Barras empilhadas por hora, uma cor por função pela posição na equipe (da oitava em diante, Outras funções), na etapa da equipe e no resultado antes dos caminhos; no resultado, alterna com a escala do caminho escolhido (etapa de 40 h, editada se for o caso, mais as diárias), no mesmo eixo. Presença no local da entrada à saída, com o intervalo; folgas em rodízio pela média (dias por semana da escala ÷ dias marcados; 12x36, metade; 6x2, seis de oito; personalizada, média do ciclo); dia escolhido ou média dos dias de funcionamento; legenda, dica e tabela","alternativa":"—","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D82","tema":"Nome e salário de cada pessoa","padrao":"Opcionais, por turno, como no Escala Sebrae. Em branco, vale o salário do cargo; informado por hora, vale a hora × o divisor da função. O custo de hoje soma os salários; no cálculo, cada turno usa a média das suas pessoas (os custos são lineares no salário) e as contratações entram por essa média. Os nomes rotulam as escalas, o calendário, o PDF, o Excel (aba Equipe) e a agenda e ficam guardados só no navegador, com aviso de cuidado ao compartilhar (LGPD)","alternativa":"Um salário médio por função","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D83","tema":"Mulheres: folga num domingo a cada duas semanas (CLT, art. 386)","padrao":"Opcional: o usuário marca quem é mulher (nos textos, folga 1:1 aos domingos) na tabela de pessoas de cada função, com aviso. Para as marcadas, o motor confere o domingo de folga a cada duas semanas, também no comércio, no lugar das três semanas da Lei 10.101/2000, como entendem a SDI-1 (E-ED-RR-619-11.2017.5.12.0054) e a SDC (ROT-0001503-12.2024.5.21.0000) do TST; sem tese vinculante do STF. Havendo mulher no turno e trabalho aos domingos, o planejador monta os rodízios com domingo de folga a cada duas semanas para todos do turno, o que pode exigir mais contratações; rodízios separados por sexo não estão no simulador","alternativa":"Só apontar a falha, sem refazer as escalas; ou manter a regra de três semanas no comércio também para as mulheres (comportamento anterior do motor)","origem":"pedido","regras":["R4"],"situacao":"adotado em 10/11/2026"},{"id":"D84","tema":"Datas para iniciar férias","padrao":"No calendário de 2027, a vista Datas para iniciar férias mostra, por pessoa e pela escala exibida, os dias em que as férias podem começar: vedados os dois dias que antecedem feriado ou repouso (CLT, art. 134, § 3º), contando os dois repousos semanais, por cautela; repouso e feriado indicados como dias a evitar; sábado e domingo vedados só com a opção marcada (o PN 100 do TST foi cancelado em 30/06/2025). Feriados nacionais do motor mais os estaduais e municipais informados, com sugestões de Paixão, Corpus Christi, Carnaval e 9 de julho (SP). Resumo das regras de férias da CLT (arts. 134 a 145). O período concessivo não é calculado, por falta da data de admissão","alternativa":"Contar só um repouso semanal na vedação; vedar sempre sábado e domingo","origem":"pedido","regras":["F1"],"situacao":"adotado em 10/11/2026"},{"id":"D85","tema":"Nome da emenda nos textos","padrao":"Onde constava a sigla da emenda, o simulador passa a dizer Emenda Constitucional 141 (Fim da 6x1); dentro de parênteses, Emenda Constitucional 141 – Fim da 6x1. No rótulo do ícone do aplicativo, que só comporta nome curto, Fim da 6x1","alternativa":"Manter a sigla","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D86","tema":"Todas as escalas testadas e por que ficaram de fora","padrao":"Para cada turno, o planejador calcula 5x2 em rodízio e com folgas fixas, com tempo parcial, com o quadro de hoje (menos gente ou sem abrir dias), escalonado, com jornada ampliada na transição, 4x3, 6x2 e, agora também para turnos que não são plantão, 12x36 com plantão de 12 h em operação de sete dias com o mesmo horário (dependente de norma coletiva, D39). As famílias que não chegam a ser calculadas saem com o motivo (ex.: 12x36 em operação de seis dias, 4x3 quando a jornada não cabe em 10 h, 6x2 com horário variável). No resultado, a seção Todas as escalas que o simulador testou lista cada escala com a situação, contratações, custo a partir de 16/12/2027, horas perdidas e os motivos de não ter sido a escolhida, comparada ao caminho exibido","alternativa":"Mostrar só os caminhos escolhidos (comportamento anterior; a lista completa ficava apenas no detalhe jurídico, sem motivos)","origem":"pedido","regras":[],"situacao":"adotado em 11/11/2026 (caso PL35)"},{"id":"D87","tema":"Manual e tutorial","padrao":"Na tela inicial, Como preencher, passo a passo: o que ter em mãos, o que cada etapa pede e o que quer dizer cada escala, sem termos jurídicos. Em todas as páginas, botão Tutorial Passo a Passo no alto da tela, que destaca cada campo e explica em linguagem simples, passo a passo (Voltar, Próximo, Fechar, teclado e celular); os passos de campos ausentes na tela são pulados","alternativa":"—","origem":"pedido","regras":[],"situacao":"adotado em 11/11/2026; botão levado para o alto da página a pedido"},{"id":"D88","tema":"Modo simplificado e modo completo","padrao":"Ao começar, a pessoa escolhe o modo. Simplificado: setor, regime tributário e, por cargo, pessoas, salário mensal, escala e horário de hoje; dias típicos do setor, com a opção Personalizar dias (dias do cargo e de cada pessoa); sem faturamento, custos, nomes, folga 1:1 aos domingos, turnos múltiplos, horário por dia nem exercício; resultado com aviso de precisão aproximada e botão para passar ao completo, que aproveita tudo. Completo: todas as etapas, recomendado para RH, DP, Jurídico, Operações e Diretoria. O modo pode ser trocado a qualquer momento pelo topo","alternativa":"Um modo só","origem":"pedido","regras":[],"situacao":"adotado em 11/11/2026; dias do cargo e de cada pessoa liberados no simplificado a pedido"},{"id":"D89","tema":"Dias de trabalho de cada pessoa","padrao":"Opcional, nos dois modos, nas escalas semanais (6x1, 5x2, 4x3, tempo parcial): o usuário marca os dias em que cada pessoa trabalha hoje; sem marcação, a pessoa segue o rodízio do cargo. Os dias informados entram na necessidade de cada dia, no gráfico das 24 horas e viram as folgas da escala de hoje no motor; as folgas de quem segue o rodízio cobrem o que sobra da necessidade. Aviso quando o número de dias difere do previsto pela escala. Na 12x36, no 6x2 e na personalizada, que giram em ciclo, não se aplica","alternativa":"Só dias por cargo","origem":"pedido","regras":["R1"],"situacao":"adotado em 11/11/2026 (caso G16)"},{"id":"D90","tema":"Forma de pagamento do cargo","padrao":"Cada cargo informa como recebe: mensalista (salário por mês) ou horista (valor da hora). O valor por hora deixa de ser só uma forma de digitar o salário: indica horista. Hoje, o mês do horista é a hora × o divisor da jornada (horas semanais × 5, ou o informado), como na D70","alternativa":"Manter o valor por hora como simples conversão para mensal","origem":"pedido","regras":[],"situacao":"adotado em 12/11/2026"},{"id":"D91","tema":"Os dois repousos remunerados do horista","padrao":"Três leituras, com a literal como padrão: (1) literal, cada repouso vale a jornada normal do dia, horas da semana ÷ dias de trabalho (Lei 605/1949, art. 7º, b): 40 h em 5 dias dão 56 h pagas por semana, 240 h no mês; (2) 1/6, cada repouso vale 1/6 das horas da semana, o critério de hoje: 228,6 h no mês; (3) só reajuste, a hora sobe para manter o mês de hoje e o horista custa o mesmo que o mensalista. Mês = hora × (horas da semana + repousos) × 30 ÷ 7, a mesma base do divisor de hoje (44 h × 7/6 × 30/7 = 220). São remunerados até dois repousos por semana (o terceiro dia livre da 4x3 é compensação); na 12x36 a remuneração já abrange os repousos (CLT, art. 59-A, parágrafo único). Quem já está no quadro nunca recebe menos que hoje (Emenda Constitucional 141, art. 2º); contratações seguem a mesma conta, sem esse piso. Nas leituras literal e 1/6, hora extra e adicional noturno usam a hora contratada; no só reajuste, a hora reajustada","alternativa":"Só reajuste como padrão (V. Müller, Migalhas, 29/10/2026), ou o segundo repouso pago à parte também ao mensalista (J. O. Schäfer, Jus, 23/10/2026)","origem":"pedido","regras":[],"situacao":"a validar: sem regulamentação nem jurisprudência; padrão literal escolhido pelo usuário em 12/11/2026, por ser o mais cauteloso para o custo; a liminar na ADI 8.041 (item III) remete as condições da neutralidade salarial a lei ou decreto; a Portaria MTE 2.041/2026 (art. 10, §§ 4º e 5º; art. 11, II e § 4º) manda reajustar o valor da hora para manter a remuneração mensal anterior (média dos 12 meses antes de 16/12/2026) e calcula o repouso pelas horas semanais ÷ 6, o que aponta para a leitura só reajuste; o padrão literal foi mantido até decisão do usuário (D119). A versão 4 não usa horista"},{"id":"D92","tema":"Quadro horista × mensalista","padrao":"Quando algum cargo é horista, o resultado mostra a folha por mês a partir de 16/12/2027, no caminho escolhido (o mesmo caminho em todas as formas), como mensalista com o salário de hoje e como horista nas três leituras da D91, com a diferença para o mensalista; a leitura usada em todo o resultado é escolhida ali. Aviso: trocar horista por mensalista só reduz o custo se o mensal ficar no valor de hoje, o que tira o valor do segundo repouso e pode ser anulado (CLT, arts. 9º e 468; Emenda Constitucional 141, art. 2º); a troca que acompanha o que o horista receberia tem pouco risco e não economiza; para buscar economia, negociar com o sindicato. O quadro vai também para o PDF e para a aba “Horista x mensalista” do Excel","alternativa":"—","origem":"pedido","regras":[],"situacao":"adotado em 12/11/2026"},{"id":"D93","tema":"Ranking das opções no resultado","padrao":"O resultado começa pela comparação de todas as opções, em ordem, com 1º, 2º e 3º para as três primeiras. O usuário escolhe o que pesa mais: segurança jurídica (padrão: cumprir sem depender do sindicato, depois manter as horas de trabalho, depois o menor custo), menor custo (a mais barata entre as que cumprem) ou manter a operação (sem perder horas, depois o custo; a norma coletiva só desempata). Opções com risco de passivo ficam sempre por último e fora do pódio; opções que dão exatamente o mesmo resultado em todas as funções se fundem. A opção exibida é a escolhida pelo usuário ou, sem escolha, a 1ª do ranking; em cada função vale o caminho pelo mesmo critério. O PDF e a aba “Opções” do Excel seguem a mesma ordem","alternativa":"Ordem fixa definida pelo simulador","origem":"pedido","regras":[],"situacao":"adotado em 12/11/2026; critério escolhido pelo usuário; padrão trocado por “Primeiro sem contratar” em 17/11/2026 (D110); substituído pela D112 em 18/11/2026 (sem ranking)"},{"id":"D94","tema":"Telas enxutas, com blocos que se abrem","padrao":"Cada bloco de detalhe mostra só o título e um resumo de uma linha, com um botão “Abrir” claro; o conteúdo aparece ao clicar. Ficam abertos de início só o veredito e a comparação das opções. O impacto por função mostra uma linha por função, que se abre ao clicar. Vale também para a página inicial (manual e números), para o contexto do setor, para o exercício pela média, para as contas e premissas e para os custos avançados","alternativa":"—","origem":"pedido","regras":[],"situacao":"adotado em 12/11/2026"},{"id":"D95","tema":"O que significa poder reduzir o funcionamento","padrao":"A pergunta do passo 1 trata do período do dia em que a equipe precisa estar coberta, não da entrada e da saída de cada pessoa, que podem mudar sempre dentro desse período. “Não” compõe as escalas e o quadro dentro do período informado (por exemplo, 9 h às 22 h). “Sim” permite cenários que fecham mais cedo, abrem mais tarde ou fecham um dia, só na medida do necessário para a jornada caber (por exemplo, de 8h48 para 8 h). Ampliar o período não conta como redução e só gera nota. Aceitar menos gente nos dias fracos virou pergunta separada; sem resposta, segue a do funcionamento","alternativa":"Cenário fixo de fechar 1 h mais cedo (não incluído: o simulador reduz só o que a jornada exige)","origem":"pedido","regras":[],"situacao":"adotado em 12/11/2026; substitui a leitura anterior de “mudar horário”"},{"id":"D96","tema":"Início do novo formato e período do calendário","padrao":"O usuário escolhe a data de início do novo formato e se começa com 42 h (passando a 40 h em 16/12/2027) ou já com 40 h. O calendário, as datas de férias, a escala e a agenda (ICS) vão do início até 31/12/2027; se o início for antes de 16/12/2026, o calendário começa nele. Início depois de 16/12/2026 é aceito com aviso: os dias entre 16/12/2026 e o início usam a escala de hoje e aparecem como período que não cumpre a Emenda Constitucional 141","alternativa":"Calendário fixo do ano de 2027","origem":"pedido","regras":[],"situacao":"adotado em 12/11/2026; período e aviso escolhidos pelo usuário"},{"id":"D97","tema":"Cobertura hora a hora no dia do calendário","padrao":"Os gráficos da equipe nas 24 horas saíram do resultado. Ao clicar num dia do calendário, a janela começa por uma linha do tempo de 24 h com o número de pessoas escaladas em cada horário (faixas de 15 minutos, da entrada à saída, incluindo quem vem da noite anterior) contra a necessidade do dia no horário de funcionamento; a falta aparece em vermelho. O intervalo de refeição não é descontado, porque a empresa o reveza dentro do turno","alternativa":"Descontar o intervalo de cada pessoa, o que mostraria falta falsa no horário de almoço","origem":"pedido","regras":[],"situacao":"adotado em 12/11/2026"},{"id":"D98","tema":"Gente a mais que o necessário num dia","padrao":"A escala não demite: o quadro fica o de hoje ou cresce em pessoas inteiras, e as folgas já se espalham para a sobra cair nos dias em que menos pesa. Os dias com sobra recebem a marca “+” no calendário, e a janela do dia explica a causa: reserva de férias, turno fechado em algum dia, regra do domingo (folga a cada duas semanas das mulheres, CLT, art. 386, ou a cada três no comércio) ou arredondamento em pessoas inteiras. Quando há mulheres no turno e trabalho aos domingos, o simulador testa também dois rodízios no mesmo turno: as mulheres cobrem a parte proporcional a elas com domingo a cada duas semanas, e os demais seguem a regra comum; a opção só aparece se usar menos gente que o 5x2 com a regra das mulheres aplicada a todos","alternativa":"Aplicar a regra do art. 386 à equipe inteira (o que aumenta o quadro)","origem":"pedido","regras":["R3"],"situacao":"adotado em 12/11/2026; a leitura do art. 386 segue a validar"},{"id":"D99","tema":"Revezamento de 4x3 e 6x1 com média mensal de repousos","padrao":"Com norma coletiva que traga a média mensal de repousos (CF, art. 7º, § 2º, na redação da Emenda Constitucional 141) e banco de horas, o simulador testa dois ciclos com dias de até 8 h: 4x3 e 6x1 alternados (8 folgas em 28 dias, o que não cumpre o critério A nos meses de 30 e 31 dias) e 4x3, 6x1, 4x3 e 5x2 (9 folgas em 28 dias, média de 38 h por semana), com semanas de 32 e 48 h compensadas como na “semana espanhola” (OJ 323 da SDI-1). Com os sete dias de funcionamento, cada pessoa segue o ciclo começando num dia diferente; com seis, as semanas ficam alinhadas ao calendário. Até 3/1/2027 a escala é 5x2, para o mês parcial de dezembro de 2026 não falhar a média, com as folgas alinhadas ao início do ciclo de cada pessoa para não passar de seis dias seguidos. Nos casos testados, o ciclo não usa menos gente que o 5x2","alternativa":"Critério C de média, pelo qual o ciclo 4x3 e 6x1 puro passaria","origem":"pedido","regras":["R2","R3"],"situacao":"a validar: depende de norma coletiva e do critério de média adotado (D16); com a liminar na ADI 8.041, o ciclo puro cumpre com a norma e o preâmbulo sai (D102); desde 24/11/2026 (D119), com o critério A confirmado pela Portaria MTE 2.041/2026 e sem a janela de 28 dias, o ciclo puro de 4 e 6 dias falha nos meses de 31 dias já na etapa de 42 h, e o de 4, 6, 4 e 5 dias cumpre com a norma"},{"id":"D100","tema":"Liminar na ADI 8.041 (STF, 12/11/2026)","padrao":"O motor e o simulador aplicam a medida cautelar deferida em parte pelo Min. Flávio Dino nas ADIs 8.041 e 8.042 (efeito para todos e eficácia imediata, pendente de referendo do Plenário). Uma chave no resultado simula sem a liminar, com as leituras de antes da decisão; a chave vai também para o PDF e o Excel. No motor, a configuração liminar (padrão ligada) e a leitura alternativa “Sem a liminar” nas divergências","alternativa":"Aplicar sempre, sem a chave","origem":"pedido","regras":["J1","J4","R2","R10","R13"],"situacao":"adotado em 12/11/2026; escolha do usuário"},{"id":"D101","tema":"Até 8h24 por dia sem norma coletiva na etapa de 42 h (item I da liminar)","padrao":"Sem convenção ou acordo coletivo, de 16/12/2026 a 15/12/2027, a semana de cinco dias de trabalho com dias de até 8h24 e até 42 h cumpre J1 sem adicional sobre os 24 minutos. Só a semana de cinco dias (leitura literal); a semana com menos dias por férias ou afastamento conta como de cinco; a 4x3 com dias acima de 8 h segue exigindo acordo de compensação. Dias acima de 8h24 seguem a leitura do escritório (norma coletiva do art. 7º da Emenda). Menor e aprendiz ficam fora. Na compensação do mês e no banco de horas, a semana da liminar tem base nas próprias horas até 42 h, sem gerar crédito abaixo de 40 h. O cenário 5x2 de até 8h24 até dez/2027 deixa de depender de negociação; a opção “Manter a equipe” continua com o 5x2 de 8 h e aponta o de 8h24 como alternativa até 15/12/2027","alternativa":"Admitir 8h24 em qualquer semana de até cinco dias; tornar o 5x2 de 8h24 a escolha padrão de “Manter a equipe”","origem":"pedido","regras":["J1","J4","J5"],"situacao":"a validar; leitura literal escolhida pelo usuário em 12/11/2026"},{"id":"D102","tema":"Repousos com norma coletiva sem trava na semana e no mês (item IV da liminar)","padrao":"Com norma coletiva de média de repousos, o § 2º deixa de ser apurado no mês-calendário: o motor confere pelo menos 8 repousos em cada janela de 28 dias seguidos, a partir de 16/12/2026 (proporcional aos dias em serviço). Substitui o critério A da D16 enquanto a liminar estiver ligada. O revezamento 4x3 e 6x1 puro passa a cumprir com a norma; o preâmbulo de 5x2 até 03/01/2027 (D99) deixa de ser usado com a liminar. A 6x2 continua abaixo do mínimo (6 ou 7 repousos em algumas janelas)","alternativa":"Mês-calendário pelo critério A; saldo no ano da norma","origem":"pedido","regras":["R2"],"situacao":"a validar; janela de 4 semanas escolhida pelo usuário em 12/11/2026; em 17/11/2026, o mês-calendário passou a ser conferido também (D109); substituída em 24/11/2026 pela média no mês-calendário da Portaria MTE 2.041/2026, art. 4º, §§ 3º e 4º (D119); a janela de 28 dias fica só como opção do motor (cfg.janela28), desligada"},{"id":"D103","tema":"Máximo de seis dias seguidos com norma coletiva","padrao":"Mesmo com a liminar e com norma coletiva, R3 continua: no máximo 6 dias seguidos de trabalho (CLT, art. 67; Lei 605/1949; OJ 410 da SDI-1), porque a liminar trata da trava constitucional e não menciona essas normas","alternativa":"Afastar R3 quando houver norma coletiva","origem":"pedido","regras":["R3"],"situacao":"adotado em 12/11/2026; escolha do usuário; confirmada pela Portaria MTE 2.041/2026, art. 4º, § 3º (ao menos um repouso em, no máximo, seis dias seguidos de trabalho), em 24/11/2026"},{"id":"D104","tema":"Demais itens da liminar","padrao":"Contratos com a administração pública (item VII): prazo máximo de 180 dias da publicação para o aditamento, até 13/04/2027 (vigência em 14/04/2027 pela contagem conservadora), no lugar de um ano. Estatais em regime de concorrência (item VIII): empregado com diploma e remuneração mínima entra no art. 8º (campo estatalConcorrencial no motor; sem tela). Só informados nas premissas, sem efeito no cálculo: 90 dias a partir de 16/12/2026 para renegociar contrapartidas das normas coletivas (item II); portaria conjunta possível nos primeiros 90 dias se a negociação sobre compensação fracassar (item IV); neutralidade salarial com condições
