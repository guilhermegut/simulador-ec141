    const idT = (h) => {
      const k = h[0] + '|' + h[1] + '|' + (h[2] || []).map((q) => q[0] + '-' + q[1]).join(',');
      if (!turnos.has(k)) turnos.set(k, { id: 'G' + turnos.size, nome: 'G' + turnos.size, inicio: hm(h[0]), fim: hm(h[1]), pausas: (h[2] || []).map((q) => ({ inicio: hm(q[0]), duracao: q[1] - q[0], tipo: 'usufruido' })) });
      return turnos.get(k).id;
    };
    const gs = gr.linhas.map((l) => ({ modo: 'padrao', revezar: false, ancora: '2027-01-04', dias: l.dias.map((v, i) => (v === 'T' && l.horas[i] ? idT(l.horas[i]) : null)), pessoas: [{ id: l.id, nome: l.nome, parcial: l.contrato === 'parcial' }] }));
    const lista = Array.from(turnos.values());
    for (const g of gs) g.turnos = lista.length ? lista : [{ id: 'G0', nome: 'G0', inicio: '08:00', fim: '16:00', pausas: [] }];
    return gs;
  }
  /** O que o calendário mostra de um turno: a escala de hoje ou a do caminho escolhido (editada, se for o caso). */
  function fonteCal(t, a, opc, modo) {
    if (modo === 'hoje') {
      const porId = nomesPorId(t);
      const nomes = new Map(a.diag.grade.linhas.map((l, i) => [l.id, porId.get(l.id) || 'Pessoa ' + (i + 1)]));
      return { t: t, chave: 'H|' + chaveCalc(t), grupos: a.diag.grupos, op: a.diag.op, nomes: nomes, demanda: t.turno.demanda, extras: null };
    }
    const x = escolha(t, a, opc).x;
    if (!x) return null;
    const gr = gradeAtual(t, x);
    const nomes = new Map(gr.linhas.map((l) => [l.id, l.nome]));
    const op = { atividade: x.c.atividade, instrumentos: x.c.instrumentos };
    const base = { t: t, x: x, nomes: nomes, op: op, demanda: x.c.demanda || a.cen.demanda, extras: x.x.picos ? x.x.faltas : null, picos: x.x.picos || null, editada: gr.editada };
    if (gr.editada) return Object.assign(base, { chave: 'E|' + chaveEd(t, x) + '|' + gr.linhas.map((l) => l.dias.join('')).join('|'), grupos: gruposEditados(gr), semanas: gr.semanas });
    return Object.assign(base, { chave: 'C|' + chaveCalc(t) + '|' + x.c.id, grupos: x.c.grupos });
  }
  function garantirCal(fontes) {
    for (const f of fontes) {
      if (!f || S.cal.has(f.chave)) continue;
      const k = f.chave;
      S.cal.set(k, { estado: 'calc' });
      pedir({ tipo: 'cal', grupos: f.grupos, op: f.op, inicio: CAL_INI, fim: CAL_FIM })
        .then((r) => { S.cal.set(k, Object.assign({ estado: 'ok' }, r)); })
        .catch((e) => { S.cal.set(k, { estado: 'erro', erro: e.message }); })
        .then(() => { if (S.etapa === E.RES) { renderLogo(); if (S.ui.dia != null) renderModal(); } });
    }
  }
  /** Situação de um dia num turno: 'n' não cumpre, 'p' depende de acordo ou fica abaixo da necessidade, 'ok', 'x' sem expediente. */
  function diaTurno(f, cal, i) {
    const wd = diaSem(i), dia = cal.dias[i];
    const extra = f.extras ? f.extras[wd] || 0 : 0;
    const n = dia.t.length + extra, precisa = f.demanda[wd] || 0;
    const probs = cal.achados.filter((q) => q[4] <= i && i <= q[5]);
    const st = !n && !precisa ? 'x' : probs.some((q) => q[2] === 'n') ? 'n' : probs.length || n < precisa ? 'p' : 'ok';
    return { st: st, n: n, precisa: precisa, extra: extra, probs: probs, dia: dia };
  }
  const PESO = { x: 0, ok: 1, p: 2, n: 3 };
  function fontesAtivas(prontos, opc) {
    const modo = S.ui.calModo || 'caminho';
    const sel = prontos.filter((p) => !S.ui.calFiltro || S.ui.calFiltro === 'todos' || p.t.chave === S.ui.calFiltro);
    return sel.map((p) => fonteCal(p.t, p.a, opc, modo)).filter(Boolean);
  }
  function statusAno(fontes) {
    const cals = fontes.map((f) => S.cal.get(f.chave));
    if (cals.some((c) => !c || c.estado === 'calc')) return { estado: 'calc' };
    const erro = cals.find((c) => c.estado === 'erro');
    if (erro) return { estado: 'erro', erro: erro.erro };
    const sts = [];
    for (let i = 0; i < NDIAS; i++) {
      let pior = 'x';
      fontes.forEach((f, k) => { const s = diaTurno(f, cals[k], i).st; if (PESO[s] > PESO[pior]) pior = s; });
      sts.push(pior);
    }
    return { estado: 'ok', sts: sts, cals: cals };
  }
  function vCalendario(prontos, opc) {
    if (!prontos.length) return '';
    const fontes = fontesAtivas(prontos, opc);
    garantirCal(fontes);
    const sa = statusAno(fontes);
    const modo = S.ui.calModo || 'caminho';
    const ctl = `<div class="cal-ctl">${chips('Escala exibida', [['caminho', 'Com o caminho escolhido'], ['hoje', 'Escala de hoje']], modo, 'data-acao="cal-modo"')}
      ${prontos.length > 1 ? `<label class="mini">Mostrar <select id="cal-filtro" data-cal-filtro="1"><option value="todos">Todas as funções</option>${prontos.map((p) => `<option value="${esc(p.t.chave)}"${S.ui.calFiltro === p.t.chave ? ' selected' : ''}>${esc(p.t.nome)}</option>`).join('')}</select></label>` : ''}</div>`;
    const vista = S.ui.calVista === 'ferias' ? 'ferias' : 'ec';
    const ctlVista = `<div class="cal-ctl">${chips('O que mostrar', [['ec', 'Situação de cada dia'], ['ferias', 'Datas para iniciar férias']], vista, 'data-acao="cal-vista"')}</div>`;
    const cab = `<header><h2>Calendário de 2027</h2><p class="nota">${vista === 'ferias' ? `Para cada pessoa, os dias de 2027 em que as férias podem começar, pela escala ${modo === 'hoje' ? 'de hoje' : 'do caminho escolhido'}.` : `Cada dia de 2027 com a escala ${modo === 'hoje' ? 'de hoje' : 'do caminho escolhido'}, conferida no motor dia a dia. Clique num dia para ver quem trabalha, quem folga e o que precisa de atenção.`}</p></header>`;
    if (sa.estado === 'calc') return `<section class="secao" id="calendario">${cab}${ctlVista}${ctl}<p class="carregando">Montando o calendário do ano…</p></section>`;
    if (sa.estado === 'erro') return `<section class="secao" id="calendario">${cab}${ctlVista}${ctl}<p class="aviso forte">Não foi possível montar o calendário: ${esc(sa.erro)}</p></section>`;
    if (vista === 'ferias') return vFerias(fontes, sa, cab, ctlVista + ctl);
    const cont = { ok: 0, p: 0, n: 0, x: 0 };
    sa.sts.forEach((s) => { cont[s]++; });
    const meses = MESES.map((nome, m) => {
      const i0 = M.lerData('2027-' + String(m + 1).padStart(2, '0') + '-01') - Z0;
      const n = M.diasNoMes(2027, m + 1);
      const vazios = Array.from({ length: diaSem(i0) }, () => '<span></span>').join('');
      const dias = Array.from({ length: n }, (_, k) => {
        const i = i0 + k, st = sa.sts[i], fer = FERIADOS.get(i);

        return `<button type="button" class="dc s-${st}${fer ? ' fer' : ''}${i === MARCO_40 ? ' marco' : ''}" data-acao="dia" data-i="${i}" aria-label="${esc(rot)}" title="${esc(rot)}">${k + 1}</button>`;

    }).join('');
    const legenda = `<div class="cal-leg"><span><i class="s-ok"></i>Cumpre e cobre a necessidade · ${cont.ok} dias</span><span><i class="s-p"></i>Atenção: menos gente que o necessário ou depende de acordo · ${cont.p}</span>
      <span><i class="s-n"></i>Não cumpre a Emenda Constitucional 141 (Fim da 6x1) · ${cont.n}</span><span><i class="s-x"></i>Sem expediente · ${cont.x}</span><span><i class="fer"></i>Feriado nacional (tratado como dia normal)</span><span><i class="marco"></i>16/12: início do teto de 40 h</span></div>`;
    const ed = fontes.some((f) => f.editada) ? '<p class="nota">A escala editada se repete ao longo do ano a cada ciclo exibido na grade semanal.</p>' : '';
    return `<section class="secao" id="calendario">${cab}${ctlVista}${ctl}${legenda}${ed}<div class="meses">${meses}</div></section>`;
  }
  /* ---------------------------------------------------------------- férias: datas para iniciar (D84) */

  /** Feriados para o início das férias: os nacionais de 2027, os locais informados e o 1º/1/2028 (fecha o ano). */
  function feriadosFerias() {
    const m = new Map(FERIADOS);
    for (const x of S.op.feriadosLocais || []) { const i = M.lerData(x.data) - Z0; if (i >= 0 && i <= NDIAS + 1) m.set(i, x.nome || 'feriado local'); }
    m.set(NDIAS, 'Confraternização Universal de 2028');
    return m;
  }
  const dataCurta = (i) => { const c = M.civil(Z0 + i); return String(c.d).padStart(2, '0') + '/' + String(c.m).padStart(2, '0'); };
  /**
   * Se a pessoa pode iniciar férias no dia i, pela escala do calendário: vedado nos dois dias que antecedem feriado ou
   * repouso (CLT, art. 134, § 3º; com dois repousos por semana, os dois contam, D84); a evitar no próprio repouso ou
   * feriado; e, com a opção marcada, vedado também em sábado e domingo (norma coletiva ou política da empresa).
   */
  function inicioFerias(cal, id, i, fer, sabDom) {
    const trab = (k) => k < NDIAS && cal.dias[k].t.some((x) => x[0] === id);
    const rep = (k) => k < NDIAS && cal.dias[k].r.indexOf(id) >= 0;
    if (fer.has(i)) return { c: 'evitar', m: 'feriado: ' + fer.get(i) };
    if (!trab(i)) return { c: 'evitar', m: rep(i) ? 'dia de repouso na escala' : 'sem escala neste dia' };
    if (sabDom && diaSem(i) >= 5) return { c: 'veda', m: (diaSem(i) === 5 ? 'sábado' : 'domingo') + ', vedado pela opção de sábado e domingo' };
    for (let j = 1; j <= 2; j++) {
      const k = i + j;
      if (fer.has(k)) return { c: 'veda', m: 'antecede o feriado de ' + dataCurta(k) + ' (CLT, art. 134, § 3º)' };
      if (rep(k)) return { c: 'veda', m: 'antecede o repouso de ' + dataCurta(k) + ' (CLT, art. 134, § 3º)' };
    }
    return { c: 'ok', m: 'pode iniciar' };
  }
  function vRegrasFerias() {
    return `<details class="regras-ferias" data-abre="regras-ferias"${S.ui['regras-ferias'] === false ? '' : ' open'}><summary>Regras para programar as férias</summary>
      <ul>
        <li><b>Início.</b> Não pode cair nos dois dias que antecedem feriado ou dia de repouso semanal remunerado (CLT, art. 134, § 3º). Com dois repousos por semana, o simulador trata os dois como repouso para essa regra, por cautela. Também não indica o início no próprio dia de repouso ou feriado: a lei não trata disso expressamente, mas o descanso seria absorvido pelas férias.</li>
        <li><b>Sábado e domingo.</b> A vedação geral vinha do Precedente Normativo 100 do TST, cancelado em 30/06/2025. Hoje depende da convenção ou do acordo coletivo, ou da política da empresa: marque a opção abaixo quando for o caso.</li>
        <li><b>Prazo.</b> As férias são concedidas nos 12 meses seguintes ao período aquisitivo (art. 134); fora desse prazo, são devidas em dobro (art. 137).</li>
        <li><b>Divisão.</b> Com a concordância do empregado, em até três períodos: um de ao menos 14 dias corridos e os demais de ao menos 5 dias corridos cada (art. 134, § 1º).</li>
        <li><b>Aviso e pagamento.</b> Aviso por escrito com ao menos 30 dias de antecedência (art. 135) e pagamento até 2 dias antes do início (art. 145).</li>
        <li><b>Abono.</b> O empregado pode converter um terço das férias em dinheiro, pedindo até 15 dias antes do fim do período aquisitivo (art. 143, § 1º).</li>
        <li><b>Época.</b> Definida pelo empregador (art. 136). Membros da mesma família que trabalham na empresa podem sair juntos, se quiserem e não houver prejuízo ao serviço (§ 1º); o estudante menor de 18 anos pode fazer coincidir com as férias escolares (§ 2º).</li>
        <li><b>Férias coletivas.</b> Até dois períodos por ano, nenhum menor que 10 dias corridos, com comunicação ao órgão local do Ministério do Trabalho e ao sindicato com 15 dias de antecedência (art. 139).</li>
      </ul></details>`;
  }
  function vFeriadosLocais() {

    const sug = [[mv.paixao, 'Sexta-feira da Paixão'], [mv.corpusChristi, 'Corpus Christi'], [mv.carnaval, 'Carnaval (terça-feira)']].concat(sp.map((f) => [f.data, f.nome + ' (SP)']))

      <div class="add-fer"><input type="date" id="fer-data" min="2027-01-01" max="2027-12-31" aria-label="Data do feriado"><input type="text" id="fer-nome" placeholder="Nome (opcional)" maxlength="60" aria-label="Nome do feriado"><button class="btn peq" data-acao="fer-add" id="fer-add">Incluir</button></div>
      ${sug.length ? `<div class="sug-fer"><span class="suave">Sugestões:</span>${sug.map(([d, n]) => `<button type="button" class="btn peq texto" data-acao="fer-sug" data-v="${d}" data-n="${esc(n)}">+ ${esc(n)}, ${esc(dataCurta(M.lerData(d) - Z0))}</button>`).join('')}</div>` : ''}</div>`;

  /** Vista de férias do calendário: por pessoa, os dias em que as férias podem começar em 2027. */
  function vFerias(fontes, sa, cab, ctl) {
    const pessoas = [];
    fontes.forEach((f, k) => { for (const [id, nome] of f.nomes) pessoas.push({ v: k + '|' + id, k: k, id: id, nome: nome, fn: f.t.nome }); });

    const cls = Array.from({ length: NDIAS }, (_, i) => inicioFerias(cal, p.id, i, fer, sabDom));
    const n = { ok: 0, veda: 0, evitar: 0 };
    cls.forEach((x) => { n[x.c]++; });
    // dias da semana em que o início costuma ser possível na escala da pessoa
    const porDia = [0, 1, 2, 3, 4, 5, 6].map((d) => { let t = 0, ok = 0; cls.forEach((x, i) => { if (diaSem(i) === d) { t++; if (x.c === 'ok') ok++; } }); return ok / Math.max(1, t); });
    const bons = porDia.map((v, d) => [v, d]).filter(([v]) => v >= 0.5).map(([, d]) => LONGOS[d]);
    const sel = `<label class="mini">Pessoa <select id="fer-pessoa" data-fer-pessoa="1">${fontes.map((f, k) => `<optgroup label="${esc(f.t.nome)}">${pessoas.filter((x) => x.k === k).map((x) => `<option value="${esc(x.v)}"${x === p ? ' selected' : ''}>${esc(x.nome)}</option>`).join('')}</optgroup>`).join('')}</select></label>`;
    const op = `<label class="check"><input type="checkbox" id="ferias-sd" data-ferias-sd="1"${sabDom ? ' checked' : ''}> <span>Vedar também o início em sábado e domingo (quando a norma coletiva ou a política da empresa preveem)</span></label>`;

      const i0 = M.lerData('2027-' + String(m + 1).padStart(2, '0') + '-01') - Z0, nd = M.diasNoMes(2027, m + 1);

      const dias = Array.from({ length: nd }, (_, q) => { const i = i0 + q, x = cls[i], rot = (q + 1) + ' de ' + nome + ': ' + x.m; return `<span class="dc f-${x.c}${fer.has(i) ? ' fer' : ''}" title="${esc(rot)}" aria-label="${esc(rot)}">${q + 1}</span>`; }).join('');
      return `<div class="mes"><b>${nome}</b><div class="mes-grade">${DIAS.map((d) => `<span class="ds">${d.charAt(0)}</span>`).join('')}${vazios}${dias}</div></div>`;
    }).join('');
    const resumo = `<p class="fer-resumo"><b>${esc(p.nome)}</b> (${esc(p.fn)}) pode iniciar férias em <b>${n.ok} dias</b> de 2027${bons.length ? ', na maior parte das vezes ' + (bons.length > 1 ? 'nestes dias: ' : 'neste dia: ') + esc(bons.length > 1 ? bons.slice(0, -1).join(', ') + ' e ' + bons[bons.length - 1] : bons[0]) : ''}. Vedados: ${n.veda} dias; a evitar, por serem repouso ou feriado: ${n.evitar}. Passe o mouse num dia para ver o motivo.</p>`;
    const leg = `<div class="cal-leg"><span><i class="f-ok"></i>Pode iniciar</span><span><i class="f-veda"></i>Vedado: dois dias antes de repouso ou feriado${sabDom ? ', ou sábado e domingo' : ''}</span><span><i class="f-evitar"></i>Repouso ou feriado</span><span><i class="fer"></i>Feriado</span></div>`;
    return `<section class="secao" id="calendario">${cab}${ctl}${vRegrasFerias()}<div class="fer-ctl">${sel}${op}</div>${vFeriadosLocais()}${resumo}${leg}<div class="meses">${meses}</div>
      <p class="nota">As datas seguem a escala ${(S.ui.calModo || 'caminho') === 'hoje' ? 'de hoje' : 'do caminho escolhido'} de cada pessoa em 2027. Confira também o período concessivo de cada um, que depende da data de admissão e não entra no simulador.</p></section>`;
  }

  /** Janela com o detalhe de um dia. */
  function vModal(prontos, opc, i) {
    const fontes = fontesAtivas(prontos, opc);
    const cals = fontes.map((f) => S.cal.get(f.chave));
    const z = Z0 + i, c = M.civil(z), wd = diaSem(i), fer = FERIADOS.get(i);

      const r = diaTurno(f, cal, i);
      if (PESO[r.st] > PESO[pior]) pior = r.st;
      const trab = r.dia.t.slice().sort((p, q) => p[1] - q[1]);
      const ids = new Set(trab.map((x) => x[0]));
      const folga = Array.from(f.nomes.keys()).filter((id) => !ids.has(id)).map((id) => f.nomes.get(id));
      const vistos = new Set();
      const probs = r.probs.filter((q) => { const kk = q[0] + q[1]; if (vistos.has(kk)) return false; vistos.add(kk); return true; });
      const pessoas = trab.map(([id, ini, fim, pausa]) => `<li class="pp"><b>${esc(f.nomes.get(id) || id)}</b><span>${hm(ini)}–${hm(fim)}${pausa ? ' · intervalo de ' + durTxt(pausa) : ''}</span></li>`).join('') +
        Array.from({ length: r.extra }, (_, q) => `<li class="pp extra"><b>Diária ${q + 1}</b><span>${f.picos && f.picos.tipo === 'diarias' ? 'freelancer' : 'convocação'}</span></li>`).join('');
      const stTxt = { ok: ['ok', 'Cumpre'], p: ['pend', r.n < r.precisa ? 'Menos gente que o necessário' : 'Depende de acordo'], n: ['nok', 'Não cumpre'], x: ['neutro', 'Sem expediente'] }[r.st];

      return `<section class="md-turno">${nota}<header><b>${esc(f.t.nome)}</b><span>${r.n} ${r.n === 1 ? 'pessoa' : 'pessoas'} trabalhando${r.precisa ? ', ' + r.precisa + (r.precisa === 1 ? ' necessária' : ' necessárias') : ''}</span>${pill(stTxt[0], stTxt[1])}</header>
        ${pessoas ? `<ul class="md-pessoas">${pessoas}</ul>` : '<p class="suave">Ninguém escalado neste dia.</p>'}
        ${folga.length ? `<p class="md-folga"><b>Em folga:</b> ${esc(folga.join(', '))}</p>` : ''}

      editou(); if (d.f === 'escala' || d.f === 'muda') render(); else if (d.f !== 'nome') adiar(); return;

    if (d.movDia != null) { S.op.movimento.dia[Number(d.movDia)] = el.value === '' ? '' : Number(el.value); editou(); return; }
    if (d.mov) { S.op.movimento[d.mov] = el.value === '' ? '' : Number(el.value); editou(); return; }
    if (d.custo) { S.op.custos[d.custo] = el.value === '' ? '' : Number(el.value); editou(); adiar(); return; }
    if (d.premissa) { S.op[d.premissa] = el.value; editou(); render(); return; }
    if (d.escolha) { if (el.value) S.op.escolhas[d.escolha] = el.value; salvar(); render(); return; }
    if (d.calFiltro) { S.ui.calFiltro = el.value; render(); }
    if (d.ferPessoa) { S.ui.ferPessoa = el.value; render(); }
  });
  document.addEventListener('change', (ev) => {
    const el = ev.target, d = el.dataset;
    if (d.neg) { S.op.negociacao[d.neg] = el.checked; editou(); render(); return; }
    if (d.mov === 'usar') { S.op.movimento.usar = el.checked; editou(); return; }
    if (d.domingo) { S.op.domingo = el.checked ? null : false; editou(); render(); return; }
    if (d.exAtivo) { S.op.exercicio.ativo = el.checked; editou(); render(); return; }
    if (d.fn && d.sh && d.pk != null && d.pf === 'mulher') {
      const f = acharFn(d.fn), s = f && f.turnos.find((x) => x.id === d.sh);
      if (!s) return;
      if (!Array.isArray(s.equipe)) s.equipe = [];
      const k = +d.pk;
      while (s.equipe.length <= k) s.equipe.push({});
      s.equipe[k] = Object.assign({}, s.equipe[k], { mulher: el.checked });
      editou(); render(); return;
    }
    if (d.feriasSd) { S.op.feriasSabDom = el.checked; editou(); render(); }
  });
  // dica do gráfico das 24 horas: ao passar o mouse (ou tocar) numa hora
  document.addEventListener('pointerover', (ev) => {
    const c = ev.target.closest && ev.target.closest('.g24-col');
    if (c) { fecharDicas(c.closest('.g24')); dica24(c); } else if (!(ev.target.closest && ev.target.closest('.g24-dica'))) fecharDicas(null);
  });
  document.addEventListener('pointerdown', (ev) => { const c = ev.target.closest && ev.target.closest('.g24-col'); if (c) dica24(c); });

  document.addEventListener('toggle', (ev) => { const d = ev.target; if (d && d.dataset && d.dataset.abre) S.ui[d.dataset.abre] = d.open; }, true);
  document.addEventListener('keydown', (ev) => {
    if (S.ui.dia == null) return;
    if (ev.key === 'Escape') { ev.preventDefault(); fecharDia(); return; }
    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') { ev.preventDefault(); S.ui.dia = Math.max(0, Math.min(NDIAS - 1, S.ui.dia + (ev.key === 'ArrowLeft' ? -1 : 1))); renderModal(); const f = document.getElementById('fechar-dia'); if (f) f.focus({ preventScroll: true }); return; }
    if (ev.key === 'Tab') {
      const foc = Array.from(document.querySelectorAll('#modal button:not([disabled])'));
      if (!foc.length) return;
      const i = foc.indexOf(document.activeElement);
      if (ev.shiftKey && i <= 0) { ev.preventDefault(); foc[foc.length - 1].focus(); } else if (!ev.shiftKey && i === foc.length - 1) { ev.preventDefault(); foc[0].focus(); }
    }
  });

  /* ================================================================ início */

  /** Download comum do navegador, para a cópia do simulador hospedada fora do claude.ai. */
  function baixarDireto(nome, data) {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nome; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  const DENTRO_CLAUDE = !!(window.claude && window.claude.use);
  async function iniciarDownloads() {
    if (!DENTRO_CLAUDE) S.downloads = { save: async (o) => { baixarDireto(o.filename, o.data); return { status: 'saved' }; } };
    else { try { S.downloads = await window.claude.use('downloads'); } catch (e) { S.downloads = null; } }
    if (S.etapa === E.RES || S.etapa === E.SETOR) render();
  }
  document.documentElement.lang = 'pt-BR';
  if (!$('#modal')) { const m = document.createElement('div'); m.id = 'modal'; m.hidden = true; document.body.appendChild(m); }
  $('#rodape').textContent = 'Simulador de escalas da Emenda Constitucional 141 (Fim da 6x1) · Claudio Zalaf Advogados Associados · motor ' + (INFO.versao || M.VERSAO) + (INFO.data ? ' · versão de ' + INFO.data : '') + ' · ferramenta de planejamento; as leituras marcadas “a validar” dependem de confirmação jurídica.';
  // versão hospedada como site: service worker para abrir sem internet e instalar como app
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !DENTRO_CLAUDE && document.querySelector('link[rel="manifest"]')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
  carregar();
  criarWorker();
  render();
  if (S.etapa) garantir(turnosCalc());
  iniciarDownloads();
  window.__simulador = S;
})();
</script>
