    const instsSemana = new Map(), livresSemana = new Map();
    for (const x of insts) { const w = inicioSemana(x.dia, si); if (!instsSemana.has(w)) instsSemana.set(w, []); instsSemana.get(w).push(x); }
    for (const g of RP.intervalos) { const w = inicioSemana(g.ate.dia, si); if (!livresSemana.has(w)) livresSemana.set(w, []); livresSemana.get(w).push(g); }
    for (let ws = ctx.semIni; ws <= ctx.semFim; ws += 7) {
      const we = ws + 6;
      let dServ = 0, tRel = 0, tComp = 0, rp = 0, rc = 0, rb = 0, nFer = 0;
      const repDias = [];
      for (let k = 0; k < 7; k++) {
        const d = ws + k, i = d - A, r = dias[i];
        if (emServico(r)) dServ++;
        if (r.estado === 'feriado') nFer++;
        tRel += rel[i]; tComp += comp[i];
        if (RP.rep.has(d)) { rp++; repDias.push(d); }
        if (repCal.has(d)) rc++;
        if (RP.blocos.has(d)) rb++;
      }
      const tw = [];
      for (let k = 0; k < 7; k++) tw.push(T.teto(ws + k));
      const limU = cfg.transicao === 'semana' ? Math.min.apply(null, tw) * HORA : tw.reduce((s, x) => s + x, 0) * 60;
      let xvSem = false;
      if (cfg.transicao === 'semana') { for (let k = 0; k < 7; k++) if (T.xv(ws + k)) xvSem = true; }
      else xvSem = T.xv(ws);
      const totU = medidaRel ? tRel * U : tComp;
      const totAlt = medidaRel ? tComp : tRel * U;
      const sem = { ini: ws, fim: we, dServ: dServ, rel: tRel, comp: tComp, total: medidaRel ? tRel * U : tComp, feriados: nFer, repousos: rp, repCal: rc, repBlocos: rb, repDias: repDias, limite: limU, xv: xvSem };
      semanas.push(sem);
      const per = { tipo: 'semana', ini: ws, fim: we };
      const rotSem = fmtDataCurta(ws) + ' a ' + fmtData(we);

      /* R1 — dois repousos na semana */
      {
        const req = xvSem ? 2 : 1;
        // Semana parcial: os dias fora de serviço (férias, afastamento, antes da admissão ou depois do desligamento) contam como dias sem trabalho.
        const exig = dServ === 0 ? null : Math.max(0, req - (7 - dServ));
        sem.exigido = exig;
        const metodos = { padrao: rp, calendario: rc, blocos: rb };
        const diverge = rc !== rp || rb !== rp;
        const base = xvSem ? 'CF, art. 7º, XV (Emenda Constitucional 141/2026 – Fim da 6x1); Lei 605/1949, art. 1º' : 'CF, art. 7º, XV (redação anterior); Lei 605/1949, art. 1º';
        const conta = 'Repousos pela fórmula r = min(k, ⌊(G − 11 h) ÷ 24 h⌋)' + (repDias.length ? ': ' + repDias.map(fmtDataCurta).join(', ') : ': nenhum') +
          '. Calendário: ' + rc + '; blocos: ' + rb + '.' + (dServ < 7 && dServ > 0 ? ' Semana parcial: ' + dServ + ' dias em serviço e ' + (7 - dServ) + ' fora de serviço; exigência max(0, ' + req + ' − ' + (7 - dServ) + ') = ' + exig + '.' : '');
        if (exig == null) push({ regra: 'R1', periodo: per, status: 'na', porque: 'Semana inteira fora de serviço (férias, afastamento, sem escala ou fora do contrato).', base: base, conta: conta, valores: metodos });
        else if (rp >= exig) push({ regra: 'R1', periodo: per, status: 'cumpre', porque: rp + ' repouso(s) na semana de ' + rotSem + '; mínimo ' + exig + '.', base: base, conta: conta, valores: metodos, divergenciaMetodo: diverge });
        else push({ regra: 'R1', periodo: per, status: 'nao_cumpre', porque: rp + ' repouso(s) na semana de ' + rotSem + '; mínimo ' + exig + (xvSem ? ' desde a vigência do inciso XV.' : '.'), base: base, conta: conta, valores: metodos, divergenciaMetodo: diverge });
      }

      /* J3 — teto semanal */
      {
        const base = 'Emenda Constitucional 141/2026 (Fim da 6x1), art. 6º; CF, art. 7º, XIII';
        const so12 = (() => { let tem = false; for (let k = 0; k < 7; k++) { const r = dias[ws + k - A]; if (r.turnos.length) { if (r.especial !== '12x36') return false; tem = true; } } return tem; })();
        const conta = 'Horas da semana: ' + fmtHoras(totU) + (medidaRel ? ' de relógio' : ' computadas') + ' (' + fmtHoras(totAlt) + (medidaRel ? ' computadas' : ' de relógio') + '); limite ' + fmtHoras(limU) + '.';
        const valores = { total: totU, alternativa: totAlt, limite: limU, excedente: Math.max(0, totU - limU) };
        let disp = true; for (let k = 0; k < 7; k++) if (!dispensado(ws + k)) disp = false;
        if (disp && dServ > 0) push({ regra: 'J3', periodo: per, status: 'na', porque: art62 ? 'Empregado excluído do controle de jornada (CLT, art. 62).' : 'Empregado enquadrado no art. 8º da Emenda Constitucional 141/2026 (Fim da 6x1).', base: base, conta: conta, valores: valores });
        else if (so12) push({ regra: 'J3', periodo: per, status: 'na', porque: 'Escala 12x36: avaliada em J6.', base: base, conta: conta, valores: valores });
        else if (totU <= limU) push({ regra: 'J3', periodo: per, status: 'cumpre', porque: fmtHoras(totU) + ' na semana; teto de ' + fmtHoras(limU) + '.', base: base, conta: conta, valores: valores });
        else {
          const b = buscarInstrumento(ctx, emp, TIPOS_COMPENSACAO, ws);
          if (b && b.ok) push({ regra: 'J3', periodo: per, status: 'condicao', atendida: true, exige: textoInstrumento(TIPOS_COMPENSACAO), nota: 'cadastrado: ' + b.instr.nome,
            porque: 'Excedente de ' + fmtHoras(totU - limU) + ' sobre o teto, a ser absorvido no regime de compensação cadastrado (ver J4 ou J5).', base: base, conta: conta, valores: valores });
          else push({ regra: 'J3', periodo: per, status: 'nao_cumpre', porque: 'Excedente de ' + fmtHoras(totU - limU) + ' sobre o teto de ' + fmtHoras(limU) + ', sem regime de compensação cadastrado: o excedente é hora extra.', base: base, conta: conta, valores: valores });
        }
      }

      /* J1 e J2 — limites diários; R14 — jornadas especiais; R9 — menores e aprendizes */
      {
        const j1 = [], j2 = [], r14 = [], r9 = [];
        const baseU = xvSem ? Math.min(limU, 40 * HORA) : limU;
        for (let k = 0; k < 7; k++) {
          const d = ws + k, i = d - A, r = dias[i];
          if (!r.turnos.length) continue;
          const m = med(i);
          const e12 = r.especial === '12x36';
          if (!dispensado(d)) {
            if (m > 8 * HORA && !e12) j1.push({ d: d, m: m });
            const relDia = rel[i];
            if (e12 ? relDia > 10 * 60 : m > 10 * HORA) j2.push({ d: d, m: m, rel: relDia, e12: e12 });
            if (emp.limiteDiario != null && m > emp.limiteDiario * HORA) r14.push({ d: d, m: m, tipo: 'diario' });
          }
          if (emp.tipo === 'menor') {
            for (const x of (instsSemana.get(ws) || [])) if (x.dia === d && x.noctUrb > 0) r9.push({ d: d, motivo: 'trabalho noturno (CLT, art. 404)' });
          }
          if (emp.tipo === 'aprendiz') {
            const lim = emp.aprendiz8h ? 8 : 6;
            if (rel[i] > lim * 60) r9.push({ d: d, motivo: 'aprendiz acima de ' + lim + ' h diárias (CLT, art. 432)' });
          }
        }
        // J1
        const baseJ1 = 'CF, art. 7º, XIII; CLT, art. 59; Súmula 85 do TST';
        if (j1.length) {
          const diasTxt = j1.map((x) => fmtDataCurta(x.d) + ' (' + fmtHoras(x.m) + ')').join(', ');
          const conta = 'Dias acima de 8 h: ' + diasTxt + '. Semana: ' + fmtHoras(totU) + '; base compensável sem norma coletiva: ' + fmtHoras(baseU) + '; teto: ' + fmtHoras(limU) + '.';
          let a;
          if (emp.tipo === 'aprendiz') {
            a = { status: 'nao_cumpre', porque: 'Aprendiz não pode ter prorrogação nem compensação de jornada.', base: 'CLT, art. 432' };
          } else if (totU <= baseU) {
            const tipos = TIPOS_COMPENSACAO;
            const filtro = emp.tipo === 'menor' ? (i) => i.natureza === 'coletivo' : null;
            const b = buscarInstrumento(ctx, emp, tipos, ws, filtro);
            a = { status: 'condicao', atendida: !!(b && b.ok), instrumento: emp.tipo === 'menor' ? 'compensacao_coletiva' : 'compensacao',
              exige: emp.tipo === 'menor' ? 'compensação por convenção ou acordo coletivo (CLT, art. 413, I)' : 'acordo de compensação (individual escrito ou coletivo)',
              nota: b ? (b.ok ? 'cadastrado: ' + b.instr.nome : b.nota) : 'não cadastrado',
              porque: 'Dias acima de 8 h compensados por horas não trabalhadas em dia útil da mesma semana.', base: baseJ1 };
          } else if (totU <= limU && limU > 40 * HORA) {
            if (cfg.leitura8h24 === 'coletiva') {
              const c = condicao(['ampliacao_art7'], ctx, emp, ws);
              a = Object.assign(c, { porque: 'Para distribuir mais de 40 h em até cinco dias é preciso ampliar a duração diária: não há dia útil a compensar, porque o sexto dia virou repouso. Leitura do escritório.', base: 'Emenda Constitucional 141/2026 (Fim da 6x1), art. 7º; CF, art. 7º, XIII' });
            } else {
              const b = buscarInstrumento(ctx, emp, TIPOS_COMPENSACAO, ws);
              a = { status: 'condicao', atendida: !!(b && b.ok), instrumento: 'compensacao', exige: 'acordo individual de compensação', nota: b ? (b.ok ? 'cadastrado: ' + b.instr.nome : b.nota) : 'não cadastrado',
                porque: 'Leitura alternativa: acordo individual de compensação basta para distribuir o teto semanal.', base: 'CF, art. 7º, XIII; CLT, art. 59, § 6º; Súmula 85, I, do TST' };
            }
          } else {
            a = { status: 'nao_cumpre', porque: 'Horas acima de 8 h por dia sem dia útil a compensar na semana: o excedente é hora extra.', base: baseJ1 };
          }
          push(Object.assign({ regra: 'J1', periodo: per, conta: conta, valores: { dias: j1.map((x) => x.d), total: totU, base: baseU, limite: limU } }, a));
        } else {
          let maiorDia = 0;
          for (let k = 0; k < 7; k++) maiorDia = Math.max(maiorDia, med(ws + k - A));
          push({ regra: 'J1', periodo: per, status: dServ ? 'cumpre' : 'na', porque: 'Nenhum dia acima de 8 h.', base: baseJ1, valores: { maiorDia: maiorDia } });
        }
        // J2
        const baseJ2 = 'CLT, arts. 59 e 59-A';
        if (j2.length) {
          const parts = j2.map((x) => {
            if (x.e12) {
              if (x.rel > 12 * 60) return { status: 'nao_cumpre', porque: 'Plantão acima de 12 h na escala 12x36.', base: 'CLT, art. 59-A' };
              const c = condicao(['escala_12x36'], ctx, emp, x.d);
              return Object.assign(c, { porque: 'Plantão de 12 h: depende de acordo individual escrito ou norma coletiva.', base: 'CLT, art. 59-A' });
            }
            if (x.m <= 12 * HORA) {
              const b = buscarInstrumento(ctx, emp, ['jornada_12h'], x.d);
              if (b && b.ok) return { status: 'condicao', atendida: true, exige: textoInstrumento(['jornada_12h']), nota: 'cadastrado: ' + b.instr.nome,
                porque: 'Jornada acima de 10 h fora da 12x36 autorizada em norma coletiva; risco de questionamento (art. 611-A, I; Tema 1.046).', base: 'CLT, art. 611-A, I; STF, Tema 1.046' };
            }
            return { status: 'nao_cumpre', porque: 'Jornada acima de 10 h fora da 12x36' + (x.m <= 12 * HORA ? ', sem norma coletiva específica.' : '.'), base: baseJ2 };
          });
          const w = pior(parts);
          push(Object.assign({ regra: 'J2', periodo: per, conta: j2.map((x) => fmtDataCurta(x.d) + ': ' + (x.e12 ? fmtMinutos(x.rel) + ' de relógio' : fmtHoras(x.m))).join('; '), valores: { dias: j2.map((x) => x.d) } }, w));
        } else push({ regra: 'J2', periodo: per, status: dServ ? 'cumpre' : 'na', porque: 'Nenhum dia acima de 10 h.', base: baseJ2, conta: '' });
        // R14
        if (emp.limiteDiario != null || emp.limiteSemanal != null) {
          const viol = r14.slice();
          if (emp.limiteSemanal != null && totU > emp.limiteSemanal * HORA && !dispensado(ws)) viol.push({ d: ws, m: totU, tipo: 'semanal' });
          push({ regra: 'R14', periodo: per, status: viol.length ? 'nao_cumpre' : 'cumpre',
            porque: viol.length ? 'Acima do limite especial do empregado (' + [emp.limiteDiario != null ? emp.limiteDiario + ' h por dia' : null, emp.limiteSemanal != null ? emp.limiteSemanal + ' h por semana' : null].filter(Boolean).join(', ') + ').' : 'Dentro do limite especial do empregado.',
            base: emp.baseLimite, conta: viol.map((x) => (x.tipo === 'semanal' ? 'semana' : fmtDataCurta(x.d)) + ': ' + fmtHoras(x.m)).join('; '), valores: { violacoes: viol.length } });
        }
        // R9
        if (emp.tipo === 'menor' || emp.tipo === 'aprendiz') {
          push({ regra: 'R9', periodo: per, status: r9.length ? 'nao_cumpre' : 'cumpre', porque: r9.length ? r9.map((x) => fmtDataCurta(x.d) + ': ' + x.motivo).join('; ') : 'Sem trabalho noturno e dentro do limite diário.',
            base: 'CLT, arts. 404, 413 e 432', conta: '' });
        }
      }

      /* R5 — interjornada; R6 — intervalo intrajornada; R7 — feriados */
      {
        const viol = [];
        for (const g of (livresSemana.get(ws) || [])) {
          if (g.G < 0) viol.push({ txt: 'turnos sobrepostos em ' + fmtDataCurta(g.ate.dia), G: g.G });
          else if (g.G < 660) viol.push({ txt: fmtDataCurta(g.de.dia) + ' ' + fmtHora(g.de.fim) + ' → ' + fmtDataCurta(g.ate.dia) + ' ' + fmtHora(g.ate.ini) + ': ' + fmtMinutos(g.G), G: g.G });
        }
        const base5 = 'CLT, art. 66; Súmula 110 do TST';
        const st5 = viol.length ? 'nao_cumpre' : (dServ ? 'cumpre' : 'na');
        const a5 = { regra: 'R5', periodo: per, status: st5, porque: viol.length ? 'Intervalo entre jornadas inferior a 11 h: ' + viol.map((v) => v.txt).join('; ') + '.' : 'Todos os intervalos entre jornadas têm ao menos 11 h.', base: base5, conta: '', valores: { violacoes: viol.length, menor: viol.length ? Math.min(...viol.map((v) => v.G)) : null } };
        if (art62) { a5.status = 'na'; a5.porque = 'Empregado excluído do controle de jornada (CLT, art. 62).'; }
        else if (dispensado(ws) && st5 !== 'na') { a5.valores.statusAvaliado = st5; a5.status = 'info'; a5.porque = 'Art. 8º da Emenda Constitucional 141/2026 (Fim da 6x1): leitura sobre a interjornada pendente de validação. Avaliação informativa: ' + a5.porque; }
        push(a5);

        const r6 = [];
        for (const x of (instsSemana.get(ws) || [])) r6.push(avaliarIntervalo(x, emp, ctx));
        const w6 = r6.length ? pior(r6) : null;
        const alertas6 = r6.some((a) => a.alertas.length) ? ALERTA_POSICAO.slice() : [];
        const a6 = w6 ? Object.assign({ regra: 'R6', periodo: per, alertas: alertas6, conta: r6.filter((a) => a.status !== 'cumpre').map((a) => a.conta).join('; ') }, w6)
          : { regra: 'R6', periodo: per, status: 'na', porque: 'Sem turnos na semana.', base: 'CLT, art. 71', conta: '' };
        a6.regra = 'R6'; a6.periodo = per;
        if (w6 && art62) { a6.status = 'na'; a6.porque = 'Empregado excluído do controle de jornada (CLT, art. 62).'; }
        else if (w6 && dispensado(ws) && a6.status !== 'cumpre') { a6.valores = { statusAvaliado: a6.status }; a6.status = 'info'; a6.porque = 'Art. 8º da Emenda Constitucional 141/2026 (Fim da 6x1): leitura sobre o intervalo pendente de validação. Avaliação informativa: ' + w6.porque; }
        push(a6);

        const fers = [];
        for (let k = 0; k < 7; k++) { const r = dias[ws + k - A]; if (r.feriadoTrabalhado) fers.push(r); }
        if (fers.length) {
          const parts = fers.map((r) => {
            if (r.especial === '12x36') return { status: 'cumpre', porque: 'Feriado em plantão 12x36 considerado compensado.', base: 'CLT, art. 59-A, parágrafo único' };
            if (ctx.comercio) {
              const b = buscarInstrumento(ctx, emp, ['feriado_comercio'], r.d);
              if (!b || !b.ok) return { status: 'nao_cumpre', porque: 'Trabalho em feriado no comércio sem autorização em convenção coletiva.', base: 'Lei 10.101/2000, art. 6º-A' };
            }
            let comp = false;
            for (let x = r.d - 6; x <= r.d + 13; x++) { const q = reg(x); if (q && q.marca === 'folga_comp') comp = true; }
            if (comp) return { status: 'cumpre', porque: 'Feriado trabalhado com folga compensatória registrada.', base: 'Lei 605/1949, art. 9º' };
            return { status: 'condicao', atendida: false, exige: 'folga compensatória ou pagamento em dobro (Lei 605/1949, art. 9º; Súmula 146 do TST)', nota: 'sem folga compensatória registrada', porque: 'Feriado trabalhado sem folga compensatória registrada: devido o pagamento em dobro.', base: 'Lei 605/1949, art. 9º; Súmula 146 do TST' };
          });
          push(Object.assign({ regra: 'R7', periodo: per, conta: fers.map((r) => fmtDataCurta(r.d) + ' (' + r.fer.nome + ')').join('; ') }, pior(parts)));
        }
      }
    }

    /** Saldo (em 1/7 de unidade) das semanas contra a base semanal. */
    function saldoSemanas(lista, comNorma) {
      let saldo7 = 0;
      const partes = [];
      for (const x of lista) {
        if (!x.dServ) continue;
        const base = (comNorma || cfg.leitura8h24 === 'individual' || !x.xv) ? x.limite : Math.min(x.limite, 40 * HORA);
        // Feriado não trabalhado em dia de escala reduz a base em base ÷ 5: as horas do feriado não geram crédito de compensação.
        // Semana parcial: capacidade de base ÷ 5 por dia em serviço, limitada à base; entra só com eventual excesso, sem gerar crédito.
        const semFer = Math.max(0, base - Math.floor(base * (x.feriados || 0) / 5));
        const d7 = x.dServ === 7 ? 7 * (x.total - semFer) : 7 * Math.max(0, x.total - Math.max(0, Math.min(base, Math.floor(base * x.dServ / 5)) - Math.floor(base * (x.feriados || 0) / 5)));
        saldo7 += d7;
        partes.push(fmtDataCurta(x.ini) + ': ' + (d7 >= 0 ? '+' : '−') + fmtHoras(Math.round(Math.abs(d7) / 7)));
      }
      return { saldo7: saldo7, texto: (partes.length ? partes.join('; ') : 'sem semanas') + ' → saldo ' + (saldo7 > 0 ? '+' : saldo7 < 0 ? '−' : '') + fmtHoras(Math.round(Math.abs(saldo7) / 7)) };
    }

    /* ---------- meses */
    const meses = [];
    const c0 = civil(ctx.mesIni), c1 = civil(ctx.mesFim);
    const semFalhaR1 = achados.filter((a) => a.regra === 'R1' && a.status === 'nao_cumpre').map((a) => a.periodo);
    const instsMes = new Map();
    for (const x of insts) { const c = civil(x.dia); const k = diaDe(c.a, c.m, 1); if (!instsMes.has(k)) instsMes.set(k, []); instsMes.get(k).push(x); }
    for (let t = c0.a * 12 + c0.m - 1; t <= c1.a * 12 + c1.m - 1; t++) {
      const a = Math.floor(t / 12), m = t % 12 + 1, nd = diasNoMes(a, m);
      const ini = diaDe(a, m, 1), fim = ini + nd - 1;
      const per = { tipo: 'mes', ini: ini, fim: fim };
      const rot = NOMES_MES[m - 1] + '/' + a;
      let dServ = 0, fds = 0, tRel = 0, tComp = 0, rp = 0, rc = 0, domRep = 0, noc = 0, ferTrab = 0;
      let limTeto = 0;
      const bNorma = !!(buscarInstrumento(ctx, emp, ['ampliacao_art7', 'media_par2'], ini) || {}).ok || !!(buscarInstrumento(ctx, emp, ['ampliacao_art7', 'media_par2'], fim) || {}).ok;
      for (let d = ini; d <= fim; d++) {
        const i = d - A, r = dias[i];
        if (emServico(r)) {
          dServ++;
          if (diaSemana(d) >= 5) fds++;
          limTeto += T.tetoEf(d) * 60;
        }
        tRel += rel[i]; tComp += comp[i]; noc += noct[i];
        if (r.feriadoTrabalhado) ferTrab += civ[i];
        if (RP.rep.has(d)) { rp++; if (diaSemana(d) === 6) domRep++; }
        if (repCal.has(d)) rc++;
      }
      const totU = medidaRel ? tRel * U : tComp;
      const minA = Math.ceil(2 * dServ / 7), minB = fds, minC = Math.ceil(8 * dServ / nd);
      const mes = { a: a, m: m, ini: ini, fim: fim, dServ: dServ, rel: tRel, comp: tComp, repousos: rp, repCal: rc, minimos: { A: minA, B: minB, C: minC }, domingosRepouso: domRep, noturnas: noc, feriadoTrabalhado: ferTrab };
      meses.push(mes);
      if (fim < ctx.h0 || ini > ctx.h1) continue;

      /* R2 — média do § 2º */
      {
        const falhas = semFalhaR1.filter((p) => p.fim >= ini && p.ini <= fim);
        const base = 'CF, art. 7º, § 2º (Emenda Constitucional 141/2026 – Fim da 6x1)';
        const crit = { A: minA, B: minB, C: minC };
        const valores = { repousos: rp, A: minA, B: minB, C: minC, cumpreA: rp >= minA, cumpreB: rp >= minB, cumpreC: rp >= minC };
        const conta = rot + ': ' + rp + ' repousos; mínimo de ' + minA + ' pelo critério A, ' + minB + ' pelo B e ' + minC + ' pelo C' + (dServ < nd ? ' (mês parcial: ' + dServ + ' dias em serviço)' : '') + '.';
        if (!falhas.length) push({ regra: 'R2', periodo: per, status: 'na', porque: 'R1 cumprido em todas as semanas: o regime de média não é necessário.', base: base, conta: conta, valores: valores });
        else {
          const b = buscarInstrumento(ctx, emp, ['media_par2'], ini) || buscarInstrumento(ctx, emp, ['media_par2'], fim);
          if (!b || !b.ok) push({ regra: 'R2', periodo: per, status: 'nao_cumpre', porque: 'Há semana com menos de dois repousos e não há norma coletiva com regime de média cadastrada' + (b ? ' válida (' + b.nota + ')' : '') + '.', base: base, conta: conta, valores: valores });
          else {
            const min = crit[cfg.criterioMedia];
            const ok = rp >= min;
            push({ regra: 'R2', periodo: per, status: ok ? 'cumpre' : 'nao_cumpre', instrumento: 'media_par2', nota: 'cadastrado: ' + b.instr.nome,
              porque: rp + ' repousos no mês; mínimo de ' + min + ' pelo critério ' + cfg.criterioMedia + '.', base: base, conta: conta, valores: valores });
          }
        }
      }

      /* R3 — dias consecutivos */
      {
        const viol = corridas.filter((c) => c.n >= 7 && c.fim >= ini && c.ini <= fim);
        const maior = corridas.filter((c) => c.fim >= ini && c.ini <= fim).reduce((s, c) => Math.max(s, c.n), 0);
        push({ regra: 'R3', periodo: per, status: viol.length ? 'nao_cumpre' : (dServ ? 'cumpre' : 'na'),
          porque: viol.length ? viol.map((c) => c.n + ' dias seguidos de trabalho, de ' + fmtData(c.ini) + ' a ' + fmtData(c.fim)).join('; ') + '. Repouso após o 7º dia é devido em dobro.' : 'Maior sequência no mês: ' + maior + ' dia(s).',
          base: 'CF, art. 7º, XV e § 2º; OJ 410 da SDI-1 do TST', conta: '', valores: { maior: maior, sequencias: viol.map((c) => ({ ini: c.ini, fim: c.fim, n: c.n })) } });
      }

      /* R4 — repouso no domingo (comércio: a cada três semanas; art. 386: quinzenal, também no comércio — TST, SDI-1,
         E-ED-RR-619-11.2017.5.12.0054; D83) */
      {
        const janelaSem = emp.art386 ? 2 : ctx.comercio ? 3 : 0;
        const falhas = [];
        if (janelaSem) {
          for (let d = ini; d <= fim; d++) {
            if (diaSemana(d) !== 6) continue;
            let algumServico = false, ok = false;
            for (let j = 0; j < janelaSem; j++) {
              const s = d - 7 * j, r = reg(s);
              if (!r) continue;
              if (emServico(r)) algumServico = true;
              if (RP.rep.has(s) || !emServico(r)) ok = true;
            }
            if (algumServico && !ok) falhas.push(d);
          }
        }
        const base = emp.art386 ? 'CLT, art. 386' : ctx.comercio ? 'Lei 10.101/2000, art. 6º, parágrafo único' : 'CF, art. 7º, XV; CLT, art. 67';
        push({ regra: 'R4', periodo: per, status: falhas.length ? 'nao_cumpre' : janelaSem ? (dServ ? 'cumpre' : 'na') : 'info',
          porque: falhas.length ? 'Sem repouso em domingo nas ' + janelaSem + ' semanas encerradas em ' + falhas.map(fmtDataCurta).join(', ') + '.' : domRep + ' repouso(s) em domingo no mês.',
          base: base, conta: '', valores: { domingos: domRep } });
      }

      /* R8 — turno ininterrupto de revezamento */
      {
        const xs = instsMes.get(ini) || [];
        const inicios = Array.from(new Set(xs.map((x) => mod(x.ini, DIA))));
        let espalho = 0;
        for (let i = 0; i < inicios.length; i++) for (let j = i + 1; j < inicios.length; j++) {
          const dd = Math.abs(inicios[i] - inicios[j]);
          espalho = Math.max(espalho, Math.min(dd, DIA - dd));
        }
        const noturno = xs.some((x) => x.noctUrb > 0);
        if (espalho >= 240 && noturno && !art62) {
          let maxDia = 0;
          for (let d = ini; d <= fim; d++) maxDia = Math.max(maxDia, med(d - A));
          let a;
          if (maxDia <= 6 * HORA) a = { status: 'cumpre', porque: 'Turnos alternados com jornada de até 6 h.' };
          else if (maxDia <= 8 * HORA) a = Object.assign(condicao(['turno_ininterrupto_8h'], ctx, emp, ini), { porque: 'Turnos alternados entre o dia e a noite com jornada acima de 6 h: depende de norma coletiva, até 8 h.' });
          else a = { status: 'nao_cumpre', porque: 'Turnos alternados entre o dia e a noite com jornada acima de 8 h.' };
          if (dispensado(ini) && a.status !== 'cumpre') { a.valores = { statusAvaliado: a.status }; a.status = 'info'; a.porque = 'Art. 8º da Emenda Constitucional 141/2026 (Fim da 6x1): avaliação informativa. ' + a.porque; }
          push(Object.assign({ regra: 'R8', periodo: per, base: 'CF, art. 7º, XIV; Súmula 423 e OJ 360 da SDI-1 do TST', conta: 'Horários de início no mês: ' + inicios.map(fmtHora).join(', ') + '; maior jornada: ' + fmtHoras(maxDia) + '.' }, a));
        }
      }

      /* J4 — compensação no mês: saldo das semanas de apuração atribuídas ao mês (pela quinta-feira) contra a base semanal */
      {
        const b = buscarInstrumento(ctx, emp, ['compensacao_mensal'], ini) || buscarInstrumento(ctx, emp, ['compensacao_mensal'], fim);
        if (b && b.ok && !dispensado(ini)) {
          const sal = saldoSemanas(semanas.filter((x) => x.ini + 3 >= ini && x.ini + 3 <= fim), bNorma);
          const conta = 'Saldo das semanas atribuídas a ' + rot + ' (base semanal ' + (bNorma ? 'pelo teto, há norma do art. 7º ou do § 2º' : cfg.leitura8h24 === 'individual' ? 'pelo teto, leitura alternativa de J1' : 'de 8 h × 5 dias quando vigoram dois repousos') + '): ' + sal.texto +
            '. Referência da seção 4.6 (teto ÷ 7 por dia do mês): ' + fmtHoras(totU) + ' contra ' + fmtHoras(limTeto) + '.';
          const valores = { saldo7: sal.saldo7, excedente: Math.max(0, Math.ceil(sal.saldo7 / 7)), total: totU, limiteTeto: limTeto, statusSecao46: totU <= limTeto ? 'cumpre' : 'nao_cumpre' };
          const alt = [{ criterio: 'limite mensal da seção 4.6', status: valores.statusSecao46 }];
          if (sal.saldo7 <= 0) push({ regra: 'J4', periodo: per, status: 'condicao', atendida: true, exige: textoInstrumento(['compensacao_mensal']), nota: 'cadastrado: ' + b.instr.nome, porque: 'As horas acima da base em algumas semanas são compensadas no próprio mês.', base: 'CLT, art. 59, § 6º', conta: conta, valores: valores, alternativas: alt });
          else push({ regra: 'J4', periodo: per, status: 'nao_cumpre', porque: 'Saldo positivo de ' + fmtHoras(valores.excedente) + ' nas semanas do mês: hora extra.', base: 'CLT, art. 59, § 6º', conta: conta, valores: valores, alternativas: alt });
        }
      }

      /* J6 — 12x36 */
      {
        // Cada ciclo é comparado ao teto das semanas em que a escala é usada (troca de escala no mês da transição).
        const escs = new Map();
        for (let d = ini; d <= fim; d++) {
          const r = dias[d - A];
          if (r.especial === '12x36' && r.turnos.length) { if (!escs.has(r.escala)) escs.set(r.escala, []); escs.get(r.escala).push(d); }
        }
        if (escs.size && !dispensado(ini)) {
          const ciclos = [];
          for (const [e, usados] of escs) ciclos.push(Object.assign({ escala: e, usados: usados }, mediaCiclo(e, ctx)));
          let stCiclo = 'cumpre', pior1 = null;
          for (const s of semanas) {
            if (s.fim < ini || s.ini > fim) continue;
            for (const c of ciclos) {
              if (!c.usados.some((d) => d >= s.ini && d <= s.fim)) continue;
              if (c.totalCiclo * 7 > s.limite * c.n) { stCiclo = 'nao_cumpre'; pior1 = s; }
            }
          }
          const media = ciclos.map((c) => fmtHoras(Math.round(c.totalCiclo * 7 / c.n)) + (c.totalCiclo * 7 % c.n ? ' (aprox.)' : '')).join(', ');
          const stMes = totU <= limTeto ? 'cumpre' : 'nao_cumpre';
          push({ regra: 'J6', periodo: per, status: stCiclo,
            porque: 'Média semanal do ciclo: ' + media + (stCiclo === 'cumpre' ? ', dentro do teto.' : ', acima do teto' + (pior1 ? ' de ' + fmtHoras(pior1.limite) : '') + '.'),
            base: 'CLT, art. 59-A; Emenda Constitucional 141/2026 (Fim da 6x1), art. 6º',
            conta: 'Apuração pela média do ciclo (padrão): ' + media + '. Apuração mensal alternativa (seção 4.6): ' + fmtHoras(totU) + ' no mês contra limite de ' + fmtHoras(limTeto) + ' → ' + (stMes === 'cumpre' ? 'cumpre' : 'não cumpre') + '.',
            valores: { mediaCiclo: ciclos.map((c) => ({ escala: c.escala, total: c.totalCiclo, dias: c.n })), totalMes: totU, limiteMes: limTeto, statusMensal: stMes },
            alternativas: [{ criterio: 'apuração mensal', status: stMes }] });
        }
      }

      /* R10 — art. 8º */
      if (emp.nivelSuperior) {
        const s = art8Dia(ini);
        push({ regra: 'R10', periodo: per, status: 'info', porque: s.enquadrado ? 'Enquadrado no art. 8º: ' + s.motivo + '. Dispensa J1 a J6; R1 a R3 continuam.' : 'Não enquadrado no art. 8º: ' + s.motivo + '.', base: 'Emenda Constitucional 141/2026 (Fim da 6x1), art. 8º', conta: '', valores: { enquadrado: s.enquadrado } });
      }

      /* F1 — início de férias */
      {
        const viol = [];
        for (let d = ini; d <= fim; d++) {
          const r = reg(d), ant = reg(d - 1);
          if (!r || r.estado !== 'ferias' || (ant && ant.estado === 'ferias')) continue;
          for (let j = 1; j <= 2; j++) {
            const q = reg(d + j);
            if (!q) continue;
            if (q.fer || (q.servico && q.escala && q.base == null)) { viol.push({ d: d, motivo: fmtDataCurta(d + j) + (q.fer ? ' é feriado' : ' é dia de repouso na escala') }); break; }
          }
        }
        const temFerias = (() => { for (let d = ini; d <= fim; d++) { const r = reg(d), ant = reg(d - 1); if (r && r.estado === 'ferias' && !(ant && ant.estado === 'ferias')) return true; } return false; })();
        if (temFerias) push({ regra: 'F1', periodo: per, status: viol.length ? 'nao_cumpre' : 'cumpre',
          porque: viol.length ? viol.map((v) => 'Férias iniciadas em ' + fmtData(v.d) + ', e ' + v.motivo).join('; ') + '.' : 'Início de férias fora dos dois dias que antecedem feriado ou repouso.',
          base: 'CLT, art. 134, § 3º', conta: '' });
      }

      /* indicadores operacionais */
      let fdsLivres = 0, domLivres = 0, isoladas = 0;
      for (let d = ini; d <= fim; d++) {
        const r = reg(d);
        if (!r || r.estado !== 'folga') continue;
        if (diaSemana(d) === 6) { domLivres++; const sab = reg(d - 1); if (sab && sab.estado === 'folga') fdsLivres++; }
        const ant = reg(d - 1), pos = reg(d + 1);
        if (!(ant && ant.estado === 'folga') && !(pos && pos.estado === 'folga')) isoladas++;
      }
      mes.indicadores = { finsDeSemanaLivres: fdsLivres, domingosLivres: domLivres, folgasIsoladas: isoladas };
    }

    /* ---------- J5 — banco de horas */
    for (const i of ctx.dados.instrumentos) {
      if ((i.tipo !== 'banco_semestral' && i.tipo !== 'banco_anual') || !abrange(i, emp)) continue;
      const passo = i.tipo === 'banco_semestral' ? 6 : 12;
      let p0 = i.vigenciaInicio > -1e8 ? i.vigenciaInicio : ctx.mesIni;
      while (p0 <= ctx.h1) {
        const p1 = somarMeses(p0, passo) - 1;
        if (p1 >= ctx.h0) {
          const comNorma = !!(buscarInstrumento(ctx, emp, ['ampliacao_art7', 'media_par2'], p0) || {}).ok;
          const sal = saldoSemanas(semanas.filter((x) => x.ini + 3 >= p0 && x.ini + 3 <= p1), comNorma);
          const s = situacaoInstrumento(i, p0, D) || { ok: false, nota: 'fora da vigência' };
          const per = { tipo: 'periodo', ini: p0, fim: p1 };
          const exc = Math.max(0, Math.ceil(sal.saldo7 / 7));
          const conta = 'Saldo das semanas do período (' + fmtData(p0) + ' a ' + fmtData(p1) + '): saldo ' + (sal.saldo7 > 0 ? '+' : sal.saldo7 < 0 ? '−' : '') + fmtHoras(Math.round(Math.abs(sal.saldo7) / 7)) + '.';
          if (!s.ok) push({ regra: 'J5', periodo: per, status: 'nao_cumpre', porque: 'Banco de horas sem validade no período: ' + s.nota + '.', base: TIPOS_INSTRUMENTO[i.tipo].base, conta: conta });
          else push({ regra: 'J5', periodo: per, status: sal.saldo7 <= 0 ? 'condicao' : 'nao_cumpre', atendida: sal.saldo7 <= 0, exige: textoInstrumento([i.tipo]), nota: 'cadastrado: ' + i.nome,
            porque: sal.saldo7 <= 0 ? 'Saldo do banco fechado sem horas a pagar no período.' : 'Saldo positivo de ' + fmtHoras(exc) + ' ao fim do período: hora extra.', base: TIPOS_INSTRUMENTO[i.tipo].base, conta: conta, valores: { saldo7: sal.saldo7, excedente: exc } });
        }
        p0 = p1 + 1;
      }
    }

    /* ---------- sinalizações de repouso */
    const sinais = [];
    for (const x of RP.semRep) if (x.dia >= ctx.mesIni && x.dia <= ctx.mesFim) sinais.push({ dia: x.dia, tipo: 'folga_sem_repouso', texto: 'Folga em ' + fmtData(x.dia) + ' sem 24 h mais 11 h íntegras (intervalo livre de ' + fmtMinutos(x.G) + ').' });
    for (const d of dependentes) if (d >= ctx.mesIni && d <= ctx.mesFim) sinais.push({ dia: d, tipo: 'repouso_dependente', texto: 'O repouso de ' + fmtData(d) + ' só se completa graças a feriado, férias, afastamento ou falta: pela escala programada, não se completaria.' });

    /* ---------- dias para calendário */
    const saidaDias = [];
    for (let d = ctx.mesIni; d <= ctx.mesFim; d++) {
      const i = d - A, r = dias[i];
      saidaDias.push({
        d: d, estado: r.estado, feriado: r.fer ? r.fer.nome : null, escala: r.escala, turnos: r.turnos,
        rel: rel[i], comp: comp[i], noct: noct[i], repouso: RP.rep.has(d), repousoCalendario: repCal.has(d), repousoBlocos: RP.blocos.has(d),
        folgaSemRepouso: semRep.has(d), repousoDependente: dependentes.has(d),
      });
    }
    const turnosSaida = insts.filter((x) => x.fim > ctx.mesIni * DIA && x.ini < (ctx.mesFim + 1) * DIA).map((x) => ({
      dia: x.dia, turno: x.turno, ini: x.ini, fim: x.fim, segmentos: x.segmentos, pausas: x.pausas, rel: x.rel, comp: x.comp, noct: x.noct,
    }));

    const interjornadas = RP.intervalos.filter((g) => g.G < 660 && g.ate.dia >= ctx.mesIni && g.ate.dia <= ctx.mesFim)
      .map((g) => ({ dia: g.ate.dia, fimTurno: g.de.fim, inicioTurno: g.ate.ini, G: g.G }));
    const livres = RP.intervalos.filter((g) => (g.G >= 35 * 60 || g.k > 0) && g.ate.dia >= ctx.mesIni && g.de.dia <= ctx.mesFim)
      .map((g) => ({ de: g.de.dia, fimTurno: g.de.fim, ate: g.ate.dia, inicioTurno: g.ate.ini, G: g.G, k: g.k, r: g.r }));

    return { id: emp.id, nome: emp.nome, setor: emp.setor, tipo: emp.tipo, dias: saidaDias, turnos: turnosSaida, semanas: semanas, meses: meses, achados: achados, sinais: sinais, livres: livres, interjornadas: interjornadas, corridas: corridas.filter((c) => c.fim >= ctx.mesIni && c.ini <= ctx.mesFim) };
  }

  /* ==================================================== intervalo (R6) */

  const SEM_ALERTAS = Object.freeze([]);
  const ALERTA_POSICAO = Object.freeze(['Intervalo na primeira ou na última hora de trabalho: tende a ser visto como sem a finalidade de repouso e alimentação.']);

  function avaliarIntervalo(x, emp, ctx) {
    const W = x.rel;
    let L = 0, S = 0, nUs = 0, nInd = 0;
    let alertas = SEM_ALERTAS;
    for (const p of x.pausas) {
      if (p.tipo === 'indenizado') { nInd++; continue; }
      const dur = p.fim - p.ini;
      nUs++; S += dur; if (dur > L) L = dur;
      if (p.ini - x.ini < 60 || x.fim - p.fim < 60) alertas = ALERTA_POSICAO;
    }
    const us = { length: nUs }, ind = { length: nInd };
    const e12 = x.especial === '12x36';
    const base = 'CLT, art. 71';
    const R = (o) => {
      o.base = o.base || base; o.alertas = alertas;
      if (o.status !== 'cumpre' || alertas.length) o.conta = fmtDataCurta(x.dia) + ' ' + fmtHora(x.ini) + '–' + fmtHora(x.fim) + ' (' + fmtMinutos(W) + ' de trabalho, intervalo de ' + L + ' min)';
      return o;
    };
    if (W <= 240) return R({ status: 'cumpre', porque: 'Até 4 h de trabalho: sem intervalo obrigatório.' });
    if (W <= 360) {
      if (L >= 15) return R({ status: 'cumpre', porque: 'Acima de 4 h até 6 h: intervalo de 15 min atendido.' });
      if (e12 && ind.length) return R({ status: 'cumpre', porque: 'Intervalo indenizado na 12x36.', base: 'CLT, art. 59-A' });
      return R({ status: 'nao_cumpre', porque: 'Acima de 4 h até 6 h de trabalho exige intervalo de 15 min (art. 71, § 1º).' });
    }
    if (L === 0) {
      if (ind.length && e12) return R({ status: 'cumpre', porque: 'Intervalo indenizado na 12x36.', base: 'CLT, art. 59-A' });
      if (ind.length) return R({ status: 'nao_cumpre', porque: 'Intervalo indenizado fora da 12x36 equivale a supressão (art. 71, § 4º).' });
      return R({ status: 'nao_cumpre', porque: 'Trabalho acima de 6 h sem intervalo previsto.' });
    }
    if (L >= 60 && L <= 120) return R({ status: 'cumpre', porque: 'Intervalo de ' + L + ' min, entre 1 h e 2 h.' });
    if (L > 120) {
      const b = buscarInstrumento(ctx, emp, ['intervalo_superior_2h'], x.dia, (i) => i.parametros.maximo == null || L <= Number(i.parametros.maximo));
      return R({ status: 'condicao', atendida: !!(b && b.ok), instrumento: 'intervalo_superior_2h', exige: 'acordo escrito (individual) ou norma coletiva que admita intervalo superior a 2 h (CLT, art. 71, caput)',
        nota: b ? (b.ok ? 'cadastrado: ' + b.instr.nome : b.nota) : 'não cadastrado', porque: 'Intervalo de ' + L + ' min, acima de 2 h.' });
    }
    if (S >= 60 && us.length > 1) {
      const b = buscarInstrumento(ctx, emp, ['fracionamento_intervalo'], x.dia);
      return R({ status: 'condicao', atendida: !!(b && b.ok), instrumento: 'fracionamento_intervalo', exige: 'norma coletiva de fracionamento, restrita a motoristas, cobradores e afins (CLT, art. 71, § 5º)',
        nota: b ? (b.ok ? 'cadastrado: ' + b.instr.nome : b.nota) : 'não cadastrado', porque: 'Intervalo fracionado (' + x.pausas.filter((p) => p.tipo === 'usufruido').map((p) => (p.fim - p.ini) + ' min').join(' + ') + ').' });
    }
    if (L >= 30) {
      const b = buscarInstrumento(ctx, emp, ['reducao_intervalo', 'reducao_intervalo_mte'], x.dia, (i) => i.parametros.minimo == null || L >= Number(i.parametros.minimo));
      return R({ status: 'condicao', atendida: !!(b && b.ok), instrumento: 'reducao_intervalo', exige: 'norma coletiva que reduza o intervalo a no mínimo 30 min (CLT, art. 611-A, III) ou autorização do art. 71, § 3º',
        nota: b ? (b.ok ? 'cadastrado: ' + b.instr.nome : b.nota) : 'não cadastrado', porque: 'Intervalo de ' + L + ' min, abaixo de 1 h.' });
    }
    return R({ status: 'nao_cumpre', porque: 'Intervalo de ' + L + ' min, abaixo do mínimo de 30 min admitido para negociação coletiva (art. 611-A, III).' });
  }

  /* ============================================ achados da empresa (R15, I1) */

  function avaliarEmpresa(dados, ctx) {
    const D = ctx.D;
    const achados = [];
    for (const i of dados.instrumentos) {
      if (i.natureza !== 'coletivo') continue;
      const alertas = [];
      if (i.celebracao != null && i.celebracao < D.publicacao) alertas.push('Instrumento anterior à Emenda Constitucional 141/2026 (Fim da 6x1): verificar compatibilidade; cláusulas incompatíveis perdem efeito em ' + fmtData(D.art3) + '.');
      else alertas.push('Verificar compatibilidade com a Emenda Constitucional 141/2026 (Fim da 6x1), art. 3º.');
      if (i.tipo === 'ampliacao_art7') alertas.push('A ampliação do art. 7º só vale até ' + fmtData(D.teto40 - 1) + '.');
      if (i.tipo === 'escala_12x36' || i.tipo === 'jornada_12h' || i.tipo === 'banco_anual') alertas.push('Cláusula compatível com 42 h pode tornar-se incompatível com o teto de 40 h em ' + fmtData(D.teto40) + '.');
      achados.push({ regra: 'R15', instrumento: i.id, status: i.compativel === true ? 'cumpre' : i.compativel === false ? 'nao_cumpre' : 'condicao', atendida: i.compativel === true,
        exige: 'verificação de compatibilidade pelo advogado', porque: alertas.join(' '), base: 'Emenda Constitucional 141/2026 (Fim da 6x1), art. 3º' });
    }
    const porte = dados.empresa.porte;
    if (porte === 'MEI' || porte === 'ME' || porte === 'EPP') {
      achados.push({ regra: 'I1', status: 'info', porque: 'Empresa de pequeno porte: lei complementar ainda inexistente poderá prever medidas transitórias.', base: 'Emenda Constitucional 141/2026 (Fim da 6x1), art. 5º' });
    }
    return { achados: achados };
  }

  /* ====================================================== avaliação */

  function avaliar(entrada, cfgParcial) {
    const dados = normalizar(entrada);
    const cfg = Object.assign({}, CONFIG_PADRAO, { semanaInicio: dados.semanaInicio || 0 }, cfgParcial || {});
    const D = datasVigencia(cfg.prazos);
    const ctx = criarContexto(dados, cfg, D);
    const empregados = dados.empregados.map((e) => avaliarEmpregado(e, ctx));
    return {
      versao: VERSAO, baseNormativa: BASE_NORMATIVA, config: cfg, datas: D, horizonte: dados.horizonte,
      erros: dados.erros, empregados: empregados, empresa: avaliarEmpresa(dados, ctx),
    };
  }

  const VARIANTES = [
    { id: 'medida', rotulo: 'Horas de relógio, e não computadas, nas regras de teto', patch: { medida: 'relogio' } },
    { id: 'leitura8h24', rotulo: 'Distribuição de até 42 h por acordo individual de compensação', patch: { leitura8h24: 'individual' } },
    { id: 'transicao', rotulo: 'Regra aplicada dia a dia na semana de transição', patch: { transicao: 'diaria' } },
    { id: 'prazos', rotulo: 'Contagem de prazos pelo Código Civil (art. 132, § 3º)', patch: { prazos: 'civil' } },
    { id: 'art9', rotulo: 'Art. 9º: dois repousos também diferidos até o aditamento', patch: { art9: 'diferido' }, aplicavel: (d) => d.empregados.some((e) => e.contratoPublico) },
    { id: 'turnoDia', rotulo: 'Turno que cruza a meia-noite rateado pelo dia civil', patch: { turnoDia: 'civil' } },
    { id: 'prorrogacao', rotulo: 'Hora reduzida só entre 22h e 5h, sem estender à prorrogação', patch: { prorrogacaoReduzida: false } },
  ];

  function chaveAchado(a) { return a.regra + '|' + (a.periodo ? a.periodo.tipo + '|' + a.periodo.ini : a.instrumento || ''); }
  function rotuloStatus(a) {
    if (!a) return '—';
    if (a.status === 'condicao') return 'cumpre com condição' + (a.instrumento && TIPOS_INSTRUMENTO[a.instrumento] ? ': ' + TIPOS_INSTRUMENTO[a.instrumento].nome.toLowerCase() : a.exige ? ': ' + a.exige : '') + (a.atendida ? ' (atendida)' : ' (pendente)');
    return { cumpre: 'cumpre', nao_cumpre: 'não cumpre', info: 'informativo', na: 'não se aplica' }[a.status] || a.status;
  }

  /** Avalia pelo critério padrão e, para cada leitura alternativa, registra onde o resultado muda. */
  function avaliarComAlternativas(entrada, cfgParcial) {
    const dados = normalizar(entrada);
    const base = avaliar(dados, cfgParcial);
    const divergencias = [];
    for (const v of VARIANTES) {
      if (v.aplicavel && !v.aplicavel(dados)) continue;
      const patch = Object.assign({}, cfgParcial || {}, v.patch);
      let difere = false;
      for (const k of Object.keys(v.patch)) if (base.config[k] !== v.patch[k]) difere = true;
      if (!difere) continue;
      const alt = avaliar(dados, patch);
      alt.empregados.forEach((ea, idx) => {
        const eb = base.empregados[idx];
        const mapa = new Map(eb.achados.map((a) => [chaveAchado(a), a]));
        const vistos = new Set();
        for (const a of ea.achados) {
          const k = chaveAchado(a);
          vistos.add(k);
          const b = mapa.get(k);
          if (!b || b.status !== a.status || !!b.atendida !== !!a.atendida || (b.instrumento || null) !== (a.instrumento || null)) {
            divergencias.push({ variante: v.id, rotulo: v.rotulo, empregado: eb.id, regra: a.regra, periodo: a.periodo, padrao: b ? rotuloStatus(b) : '—', alternativo: rotuloStatus(a), porqueAlternativo: a.porque });
          }
        }
        for (const [k, b] of mapa) if (!vistos.has(k)) divergencias.push({ variante: v.id, rotulo: v.rotulo, empregado: eb.id, regra: b.regra, periodo: b.periodo, padrao: rotuloStatus(b), alternativo: '—' });
      });
    }
    base.divergencias = divergencias;
    return base;
  }

  /* ====================================================== limite mensal (4.6) */

  function limiteMensal(a, m, opcoes) {
    const o = Object.assign({ transicao: 'semana', prazos: 'conservador', cenario: 'legal', semanaInicio: 0, base: 'teto' }, opcoes || {});
    const D = datasVigencia(o.prazos);
    const ctx = { cfg: Object.assign({}, CONFIG_PADRAO, o), D: D, si: o.semanaInicio };
    const T = criarTetos({ contratoPublico: null }, ctx);
    let u = 0;
    for (let d = diaDe(a, m, 1); d <= diaDe(a, m, diasNoMes(a, m)); d++) u += o.base === 'teto' ? T.tetoEf(d) * 60 : T.baseDia(d, false);
    return u;
  }

  /* ============================================================ cobertura */

  function demandaDia(setor, d) {
    const exc = setor.excecoes.filter((x) => x.data === d);
    const lista = exc.length ? exc.map((x) => ({ inicio: x.inicio, fim: x.fim, pessoas: x.pessoas })) : setor.necessidade.filter((n) => n.dias.indexOf(diaSemana(d)) >= 0);
    return lista.map((n) => { const a = d * DIA + n.inicio; const b = d * DIA + (n.fim > n.inicio ? n.fim : n.fim + DIA); return [a, b, n.pessoas]; });
  }

  /** Cobertura exata (ao minuto) de um setor entre dois dias: segmentos com presença e necessidade. */
  function cobertura(resultado, entrada, setorId, ini, fim) {
    const dados = normalizar(entrada);
    const setor = dados.setores.get(String(setorId));
    const pres = [];
    for (const e of resultado.empregados) if (e.setor === String(setorId)) for (const x of e.turnos) for (const s of x.segmentos) pres.push(s);
    const dias = [];
    let descoberto = 0, excesso = 0, demandaTotal = 0, ofertaTotal = 0;
    for (let d = ini; d <= fim; d++) {
      const d0 = d * DIA, d1 = d0 + DIA;
      const ev = new Map();
      const add = (t, dp, dq) => { const v = ev.get(t) || [0, 0]; v[0] += dp; v[1] += dq; ev.set(t, v); };
      add(d0, 0, 0); add(d1, 0, 0);
      for (const s of pres) { const a = Math.max(s[0], d0), b = Math.min(s[1], d1); if (a < b) { add(a, 1, 0); add(b, -1, 0); } }
      if (setor) for (const dd of [d - 1, d]) for (const q of demandaDia(setor, dd)) { const a = Math.max(q[0], d0), b = Math.min(q[1], d1); if (a < b) { add(a, 0, q[2]); add(b, 0, -q[2]); } }
      const ts = Array.from(ev.keys()).sort((x, y) => x - y);
      let p = 0, q = 0;
      const segs = [];
      for (let k = 0; k < ts.length - 1; k++) {
        const v = ev.get(ts[k]); p += v[0]; q += v[1];
        const a = ts[k], b = ts[k + 1];
        if (b <= d0 || a >= d1 || a === b) continue;
        const ult = segs[segs.length - 1];
        if (ult && ult.presenca === p && ult.demanda === q && ult.fim === a) ult.fim = b;
        else segs.push({ ini: a, fim: b, presenca: p, demanda: q });
        const len = b - a;
        descoberto += Math.max(0, q - p) * len; excesso += Math.max(0, p - q) * len;
        demandaTotal += q * len; ofertaTotal += p * len;
      }
      dias.push({ d: d, segmentos: segs });
    }
    return { dias: dias, descobertoMin: descoberto, excessoMin: excesso, demandaMin: demandaTotal, ofertaMin: ofertaTotal };
  }

  /** Cobertura por faixas para o mapa de calor: cada faixa recebe a menor cobertura (presença − necessidade) dentro dela. */
  function faixas(diaCobertura, tamanho) {
    const out = [];
    const d0 = diaCobertura.d * DIA;
    for (let a = d0; a < d0 + DIA; a += tamanho) {
      const b = a + tamanho;
      let minSaldo = Infinity, pres = 0, dem = 0;
      for (const s of diaCobertura.segmentos) {
        if (s.fim <= a || s.ini >= b) continue;
        const saldo = s.presenca - s.demanda;
        if (saldo < minSaldo) { minSaldo = saldo; pres = s.presenca; dem = s.demanda; }
      }
      out.push({ ini: a, fim: b, saldo: minSaldo === Infinity ? 0 : minSaldo, presenca: pres, demanda: dem });
    }
    return out;
  }

  /** Quadro mínimo teórico (limite inferior): ⌈demanda ÷ (horas por empregado × (1 − taxa))⌉. */
  function quadroMinimo(demandaMinSemana, horasSemanaisEmpregado, taxaIndisponibilidadePct) {
    const t = taxaIndisponibilidadePct || 0;
    if (!(horasSemanaisEmpregado > 0) || t >= 100) return null;
    const num = demandaMinSemana * 100;
    const den = horasSemanaisEmpregado * 60 * (100 - t);
    return Math.ceil(num / den);
  }

  /* ============================================= comparação de escalas (R11) */

  /** Compara a escala atual com a proposta de um empregado e devolve alertas (art. 2º da EC, art. 468 da CLT, art. 71, limites especiais). */
  function compararEscalas(entrada, empId, escalaAtualId, escalaPropostaId) {
    const dados = normalizar(entrada);
    const emp = dados.empregados.find((e) => e.id === String(empId));
    const ctx = criarContexto(dados, Object.assign({}, CONFIG_PADRAO), datasVigencia('conservador'));
    const resumo = (id) => {
      const esc = dados.escalas.get(id);
      let tot = 0, maxDia = 0, maxIntervalo = 0;
      const itens = [];
      esc.dias.forEach((tid, i) => {
        if (!tid) return;
        const t = dados.turnos.get(tid);
        const x = medir(instanciar(t, 100000 + i, esc.especial), ctx);
        tot += x.rel; maxDia = Math.max(maxDia, x.rel);
        itens.push({ x: x, t: t });
        maxIntervalo = Math.max(maxIntervalo, x.fim - x.ini);
      });
      return { esc: esc, mediaSemanalMin: tot * 7 / esc.dias.length, maxDiaMin: maxDia, maxPermanenciaMin: maxIntervalo, itens: itens };
    };
    const at = resumo(escalaAtualId), pr = resumo(escalaPropostaId);
    const alertas = [];
    if (pr.maxDiaMin > at.maxDiaMin) {
      alertas.push({ regra: 'art468', texto: 'A duração diária sobe de ' + fmtMinutos(at.maxDiaMin) + ' para ' + fmtMinutos(pr.maxDiaMin) + ' e a permanência no estabelecimento, de ' + fmtMinutos(at.maxPermanenciaMin) + ' para ' + fmtMinutos(pr.maxPermanenciaMin) + ': alteração contratual que depende de anuência do empregado.', base: 'CLT, art. 468' });
    }
    for (const it of pr.itens) {
      const r = avaliarIntervalo(it.x, emp || { id: '', setor: '' }, ctx);
      if (r.status !== 'cumpre') { alertas.push({ regra: 'R6', texto: 'Turno ' + it.t.id + ': ' + r.porque + (it.x.rel > 360 ? ' Acima de 6 h de trabalho, o intervalo mínimo passa a ser de 1 h.' : ''), base: 'CLT, art. 71' }); break; }
    }
    if (emp && emp.limiteDiario != null && pr.maxDiaMin > emp.limiteDiario * 60) {
      alertas.push({ regra: 'R14', texto: 'A proposta excede o limite diário de ' + emp.limiteDiario + ' h do empregado: não pode ser adotada.', base: emp.baseLimite });
    }
    if (pr.mediaSemanalMin < at.mediaSemanalMin) {
      alertas.push({ regra: 'R11', texto: 'A média semanal cai de ' + fmtMinutos(Math.round(at.mediaSemanalMin)) + ' para ' + fmtMinutos(Math.round(pr.mediaSemanalMin)) + ': o salário mensal não pode ser reduzido.', base: 'Emenda Constitucional 141/2026 (Fim da 6x1), art. 2º' });
    }
    return { atual: { mediaSemanalMin: at.mediaSemanalMin, maxDiaMin: at.maxDiaMin }, proposta: { mediaSemanalMin: pr.mediaSemanalMin, maxDiaMin: pr.maxDiaMin }, alertas: alertas };
  }

  /* ================================================== construtores de escala */

  const Escalas = {
    /** Modelo semanal: sete dias, de segunda a domingo (null = folga). */
    semanal: (id, dias7, op) => Object.assign({ id: id, dias: dias7.slice(), tipo: 'semanal' }, op || {}),
    /** Ciclo de N dias de trabalho por M de folga com um único turno (6x2, 4x4, 12x36 …). */
    ciclo: (id, trabalho, folga, turno, op) => Object.assign({ id: id, dias: Array(trabalho).fill(turno).concat(Array(folga).fill(null)), tipo: 'ciclo' }, op || {}),
    /** Sequência de modelos semanais (por exemplo, A, A, B, A). */
    sequencia: (id, modelos, op) => Object.assign({ id: id, dias: [].concat.apply([], modelos), tipo: 'semanal' }, op || {}),
  };

  /* ============================================================ metadados */

  const REGRAS = {

      prefP = PREF_PARCIAL.slice().sort((a, b) => prio[b] - prio[a] || PREF_PARCIAL.indexOf(a) - PREF_PARCIAL.indexOf(b));
      const mP = operacao.reduce((s, d) => s + prio[d], 0) / operacao.length;

    const o = opcoes || {};
    // Férias: 'hoje' mantém a cobertura que a equipe atual já tem (reserva só se hoje há folga para as férias);

      atual: semana.map((s) => s && { ini: s.ini, trab: s.trabalho, intervalo: s.intervalo }),
      funcionamento: turno.funcionamento === 'fixo' || turno.funcionamento === 'flexivel' ? turno.funcionamento : null,

  /**
   * Padrão de escala informado dia a dia (escala personalizada de hoje): { semanas: [[null | {ini, trab, intervalo}] × 7] × N,

  function lerPadrao(x) {

      const c = w && w[d];

  /**
   * Férias: com a premissa ligada, a equipe precisa de capacidade semanal (dias de trabalho somados) que, descontados

  function capacidadeOk(ctx, diasSemana, somaDem) {

  }
  function comFerias(ctx, dem, eq, op) {
    if (!eq) return { eq: null, r: 0 };

    let I = eq.I;
    while (!capacidadeOk(ctx, eq.w * I + eq.k * eq.P)) I++;

  }
  const textoFerias = (rf) => (rf.r ? 'Inclui ' + pl(rf.r, 'pessoa', 'pessoas') + ' para cobrir 30 dias de férias de cada empregado no ano; sem as férias, o mínimo seria ' + rf.min + '.' : null);
  /** Se a capacidade semanal da equipe comporta as férias, qualquer que seja a premissa (cenário montado pelo usuário). */

    if (cap * (ANO - FERIAS) >= ctx.somaDem * ANO) return 'A equipe comporta 30 dias de férias de cada empregado no ano.';
    return ctx.exigeFerias ? 'A equipe não comporta 30 dias de férias de cada empregado no ano: as férias abrem lacunas.'
      : 'A equipe não comporta 30 dias de férias de cada empregado no ano, como a de hoje: nas férias, o turno fica abaixo da necessidade.';
  }
  /** Aviso quando a premissa é manter a cobertura de hoje e a equipe atual já não tem folga para as férias. */
  const textoFeriasHoje = (ctx) => (ctx.feriasModo === 'hoje' && !ctx.feriasHoje && ctx.atuais.length
    ? 'Férias: como hoje, a equipe não tem folga para cobrir 30 dias de férias de cada pessoa; o cenário mantém essa condição e não contrata por causa delas.' : null);

  /** Gera os grupos de um cenário semanal a partir de uma composição e do horário (turnos e períodos). */
  function gruposSemanais(ctx, eq, hc, prefixoI, desdeI) {
    const g = [];
    if (eq.I > 0) g.push({ modo: eq.rodizioI ? 'rodizio' : 'fixo', turnos: hc.turnos, periodos: hc.periodos, folgas: eq.folgasI, pessoas: nomesPessoas(eq.I, ctx.integraisAtuais, prefixoI || 'Nova contratação', false, desdeI) });
    if (eq.P > 0) g.push({ modo: eq.rodizioP ? 'rodizio' : 'fixo', turnos: hc.turnos, periodos: hc.periodos, folgas: eq.folgasP, pessoas: nomesPessoas(eq.P, ctx.parciaisAtuais, 'Novo tempo parcial', true) });
    return g;
  }
  function descreverFolgas(eq) {
    if (!eq.I) return null;
    if (eq.rodizioI) return 'Folgas em rodízio: a escala se repete a cada ' + eq.folgasI.length + ' semana' + (eq.folgasI.length > 1 ? 's' : '') + ' e cada pessoa passa por todos os pares de folga' + (eq.folgasI.some((f) => f.indexOf(6) >= 0) ? ', inclusive domingos' : '') + '.';
    const tipos = new Set(eq.folgasI.map((f) => f.join()));
    if (tipos.size === 1) return 'Todos folgam ' + eq.folgasI[0].map((d) => DIAS_LONGOS[d]).join(' e ') + '.';

  }
  function diasParciais(eq) {

  const semanasGrade = (eq) => (eq.rodizioI ? Math.min(Math.max(eq.folgasI.length, 3), 6) : 3);
  /** Duas equipes de até 8 h: uma entra na abertura, outra sai no fechamento, mantendo a janela de cada dia. */
  function defEscalonado(ctx, eqR, rf) {
    const ops = ctx.operacao;
    const eA = limitarDia(ctx, 480);
    const eB = ctx.semana.map((s, d) => {
      if (!s) return null;

      for (;;) {
        ini = ((s.fim - trab - s.intervalo) % 1440 + 1440) % 1440;

      resumo: 'Mantém o horário de funcionamento com duas equipes de até 8 h: uma entra na abertura, outra sai no fechamento; nas horas do meio, as duas se sobrepõem.',
      jornada: 'Equipe da abertura: ' + textoJanela(eA, ops, true) + ' · equipe do fechamento: ' + textoJanela(eB, ops, true),

  const PERGUNTA_HORARIO = 'Este cenário muda o horário de funcionamento. Se a operação não comporta a mudança, marque no passo 1 que o horário precisa ser mantido.';

  /** Lista de cenários sugeridos para um turno, avaliados e ordenados. */

    // escalas que o planejador testou e deixou de fora antes de calcular, com o motivo (D86)

    const descartar = (familia, nome, motivo) => { if (!fora.some((x) => x.familia === familia)) fora.push({ familia: familia, nome: nome, motivo: motivo }); };
    const Pa = ctx.parciaisAtuais.length, Ia = ctx.integraisAtuais.length;

        const unico = !eqR.rodizioI;
        const base = uniforme8 ? '5x2 de ' + fh(trabU) : excede ? '5x2 com até 8 h por dia' : '5x2 no horário atual';
        defs.push({
          id: '5x2', nome: unico ? base : base + ' com rodízio de folgas',

          jornada: textoHorarioCenario(ctx, e8), grupos: gruposSemanais(ctx, eqR, hc8), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario), horasSemana: horasDe(eqR, e8),

          if (eqF) defs.push({
            id: '5x2-fixas', nome: base + ' com folgas fixas',
            resumo: 'Mesma equipe do rodízio, mas cada pessoa folga sempre nos mesmos dias. Mais simples de administrar, menos equilibrado no fim de semana.',
            jornada: textoHorarioCenario(ctx, e8), grupos: gruposSemanais(ctx, eqF, hc8), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario), horasSemana: horasDe(eqF, e8),

      // 42 h com o último dia da semana mais curto (ex.: seg a qui até 8h30 e sexta menor), depois 8 h por dia

          for (const d of trabalha.slice(0, 4)) { eS[d].trab = Math.min(atual[d].trab, ajustarJornada(atual[d].ini, atual[d].intervalo, 510)); soma += eS[d].trab; }
          eS[ultimo].trab = Math.min(atual[ultimo].trab, ajustarJornada(atual[ultimo].ini, atual[ultimo].intervalo, Math.max(240, 2520 - soma)));
