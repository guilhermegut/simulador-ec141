<style>
/* Layout: barra translúcida no alto com a trilha das etapas; páginas sobre fundo cinza-claro com cartões brancos de
   cantos amplos. Base clara no estilo Apple, azul como cor de ação e de destaque, e verde, âmbar e vermelho só para os
   estados (cumpre, atenção, não cumpre), sempre acompanhados de texto ou símbolo. Ícones de setor com cor própria.
   Tipografia do sistema (SF nos aparelhos Apple; Inter como alternativa). */
:root {
  --papel: #f5f5f7; --superficie: #ffffff; --tinta: #1d1d1f; --suave: #6e6e73; --linha: #d2d2d7; --campo: #ffffff; --leve: #f2f2f5;
  --marca: #0071e3; --marca-forte: #0062c3; --marca-suave: #e8f1fd; --marca-tinta: #0058b0;
  --laranja: #b25000; --laranja-marca: #ff9f0a; --laranja-suave: #fff4e0;
  --painel: #0b2545; --painel-grad: linear-gradient(135deg, #0a1d36 0%, #0b3b78 62%, #0a6fd6 130%); --painel-tinta: #ffffff; --painel-suave: rgba(255, 255, 255, .72); --painel-linha: rgba(255, 255, 255, .2); --painel-cartao: rgba(255, 255, 255, .08);
  --ok: #1a7f37; --ok-bg: #e6f4ea; --ok-forte: #34c759; --nok: #c4161c; --nok-bg: #fdecec; --nok-forte: #ff3b30; --pend: #9a4d00; --pend-bg: #fff3dc; --pend-forte: #ff9f0a;
  --painel-ok: #7ee2a0; --painel-nok: #ffb4ad;
  --vidro: rgba(255, 255, 255, .8); --listra: #f6c56f; --foco: rgba(0, 113, 227, .22); --sombra: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 16px rgba(0, 0, 0, .04);
  --f-titulo: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-texto: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --raio: 12px; --raio-g: 20px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --papel: #000000; --superficie: #1c1c1e; --tinta: #f5f5f7; --suave: #98989d; --linha: #38383a; --campo: #1c1c1e; --leve: #2c2c2e;
  --marca: #2997ff; --marca-forte: #4aa8ff; --marca-suave: #0c2b4f; --marca-tinta: #6cb8ff;
  --laranja: #ffb340; --laranja-marca: #ff9f0a; --laranja-suave: #3a2a0a;
  --painel: #0a1e38; --painel-grad: linear-gradient(135deg, #061224 0%, #0a2c5c 62%, #0057b3 130%); --painel-tinta: #ffffff; --painel-suave: rgba(255, 255, 255, .7); --painel-linha: rgba(255, 255, 255, .16); --painel-cartao: rgba(255, 255, 255, .06);
  --ok: #30d158; --ok-bg: #0f2e1a; --ok-forte: #30d158; --nok: #ff6961; --nok-bg: #3a1414; --nok-forte: #ff453a; --pend: #ffb340; --pend-bg: #33270b; --pend-forte: #ff9f0a;
  --vidro: rgba(22, 22, 23, .8); --listra: #6b4a10; --foco: rgba(41, 151, 255, .3); --sombra: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --papel: #000000; --superficie: #1c1c1e; --tinta: #f5f5f7; --suave: #98989d; --linha: #38383a; --campo: #1c1c1e; --leve: #2c2c2e;
  --marca: #2997ff; --marca-forte: #4aa8ff; --marca-suave: #0c2b4f; --marca-tinta: #6cb8ff;
  --laranja: #ffb340; --laranja-marca: #ff9f0a; --laranja-suave: #3a2a0a;
  --painel: #0a1e38; --painel-grad: linear-gradient(135deg, #061224 0%, #0a2c5c 62%, #0057b3 130%); --painel-tinta: #ffffff; --painel-suave: rgba(255, 255, 255, .7); --painel-linha: rgba(255, 255, 255, .16); --painel-cartao: rgba(255, 255, 255, .06);
  --ok: #30d158; --ok-bg: #0f2e1a; --ok-forte: #30d158; --nok: #ff6961; --nok-bg: #3a1414; --nok-forte: #ff453a; --pend: #ffb340; --pend-bg: #33270b; --pend-forte: #ff9f0a;
  --vidro: rgba(22, 22, 23, .8); --listra: #6b4a10; --foco: rgba(41, 151, 255, .3); --sombra: none; color-scheme: dark }

/* ---------------------------------------------------------------- base */
[hidden] { display: none !important; }
body { background: var(--papel); color: var(--tinta); font-family: var(--f-texto); font-size: 17px; line-height: 1.47; letter-spacing: -.012em; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--vidro); }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
h1, h2, h3 { font-family: var(--f-titulo); font-weight: 700; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(32px, 4.4vw, 48px); line-height: 1.08; letter-spacing: -.03em; }
h2 { font-size: clamp(24px, 2.8vw, 32px); line-height: 1.12; letter-spacing: -.025em; }
h3 { font-size: 21px; line-height: 1.2; font-weight: 600; letter-spacing: -.02em; }
p { margin: 0; }
small { font-size: 13px; color: var(--suave); letter-spacing: -.005em; }
a { color: var(--marca-tinta); text-underline-offset: .15em; }
.eyebrow { font-size: 14px; font-weight: 600; color: var(--suave); display: block; letter-spacing: -.01em; }
.lead { color: var(--suave); font-size: 19px; line-height: 1.42; max-width: 60ch; letter-spacing: -.02em; }
.nota { font-size: 14px; color: var(--suave); max-width: 80ch; line-height: 1.45; }
.suave { color: var(--suave); }
.num { font-variant-numeric: tabular-nums; }
.pilha { display: grid; gap: 10px; }

/* ---------------------------------------------------------------- barra e trilha */
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--vidro); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--linha); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.marca { display: flex; align-items: baseline; gap: 6px; line-height: 1.1; }
.marca b { color: var(--tinta); font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
.marca span { color: var(--suave); font-size: 12px; }
.produto { font-size: 14px; color: var(--suave); padding-left: 14px; border-left: 1px solid var(--linha); }
.perfil { display: inline-flex; border-radius: 999px; padding: 2px; background: var(--leve); margin-left: auto; }
.perfil button { border: 0; background: none; border-radius: 999px; padding: 5px 14px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--suave); }
.perfil button[aria-pressed="true"] { background: var(--superficie); color: var(--tinta); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.trilha { display: flex; gap: 2px; flex-wrap: wrap; width: 100%; padding-top: 8px; border-top: 1px solid var(--linha); }
.trilha button { border: 0; background: none; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; cursor: pointer; color: var(--suave); font-weight: 500; font-size: 14px; }
.trilha button:hover:not(:disabled) { color: var(--tinta); }
.trilha button i { font-style: normal; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--linha); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.trilha button[aria-current="step"] { color: var(--tinta); font-weight: 600; }
.trilha button[aria-current="step"] i { background: var(--marca); border-color: var(--marca); color: #fff; }
.trilha button.feita i { border-color: var(--marca); color: var(--marca); }
.trilha button:disabled { cursor: not-allowed; opacity: .45; }
.trilha .opc { font-weight: 400; font-size: 12px; color: var(--suave); }
@media (max-width: 760px) { .barra { position: static; gap: 6px 12px; } .produto { display: none; } .trilha button { padding-right: 8px; } .trilha .rot-longo { display: none; } }

main { max-width: 1024px; margin: 0 auto; padding-block: 48px 72px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 32px; }
main.largo { max-width: 1240px; }
@media (max-width: 560px) { main, .barra { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } main { padding-block: 28px 48px; } }

/* ---------------------------------------------------------------- botões e campos */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--linha); background: var(--superficie); border-radius: 999px; padding: 9px 18px; cursor: pointer; font-weight: 500; font-size: 15px; color: var(--tinta); text-decoration: none; line-height: 1.2; }
.btn:hover { border-color: var(--marca); color: var(--marca-tinta); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.prim { background: var(--marca); border-color: var(--marca); color: #fff; }
.btn.prim:hover { background: var(--marca-forte); border-color: var(--marca-forte); color: #fff; }
.btn.texto { border-color: transparent; background: none; color: var(--marca-tinta); padding-inline: 4px; text-decoration: none; }
.btn.texto:hover { text-decoration: underline; text-underline-offset: .2em; }
.btn.peq { padding: 6px 12px; font-size: 13.5px; }
.btn.claro { background: var(--painel-tinta); color: var(--painel); border-color: var(--painel-tinta); }
.btn.contorno-claro { background: transparent; color: var(--painel-tinta); border-color: var(--painel-linha); }
input[type=number], input[type=time], input[type=text], select { border: 1px solid var(--linha); background: var(--campo); border-radius: var(--raio); padding: 10px 12px; font-size: 16px; color: var(--tinta); min-width: 0; box-sizing: border-box; }
input:focus, select:focus { border-color: var(--marca); outline: none; box-shadow: 0 0 0 4px var(--foco); }
input[type=number] { font-variant-numeric: tabular-nums; }
input::placeholder { color: var(--suave); opacity: .7; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--linha); background: var(--superficie); border-radius: 999px; padding: 7px 16px; cursor: pointer; font-weight: 500; font-size: 14.5px; color: var(--tinta); }
.chip:hover { border-color: var(--marca); }
.chip[aria-pressed="true"] { background: var(--marca); border-color: var(--marca); color: #fff; }
.dias { display: flex; flex-wrap: wrap; gap: 6px; }
.dia { min-width: 46px; height: 38px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--linha); background: var(--superficie); font-weight: 500; font-size: 14px; cursor: pointer; color: var(--suave); }
@media (max-width: 560px) { .dias { flex-wrap: nowrap; } .dias .dia { flex: 1 1 0; min-width: 0; padding: 0 4px; } }
.dia[aria-pressed="true"] { background: var(--marca); border-color: var(--marca); color: #fff; }
.campo { display: grid; gap: 6px; min-width: 0; align-content: start; }
.campo > .rot, .rot { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
.campo small, .bloco small { line-height: 1.4; }
.campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 20px; }
.horario { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.horario input { width: 132px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.check input { margin-top: 4px; accent-color: var(--marca); width: 16px; height: 16px; flex: none; }
.prefixo { display: flex; align-items: center; border: 1px solid var(--linha); border-radius: var(--raio); background: var(--campo); max-width: 240px; }
.prefixo:focus-within { border-color: var(--marca); box-shadow: 0 0 0 4px var(--foco); }
.prefixo span { padding-left: 12px; color: var(--suave); font-size: 15px; }
.prefixo input { border: 0; background: transparent; width: 100%; box-shadow: none !important; }
.prefixo.pos span { padding: 0 12px 0 0; }

/* ---------------------------------------------------------------- perfil */
.op-perfil { text-align: left; display: grid; gap: 8px; background: var(--superficie); border: 1px solid transparent; border-radius: var(--raio-g); padding: 26px; cursor: pointer; color: var(--tinta); box-shadow: var(--sombra); }
.op-perfil b { font-family: var(--f-titulo); font-size: 24px; font-weight: 700; letter-spacing: -.025em; }
.op-perfil span { color: var(--suave); font-size: 15px; }
.op-perfil:hover { border-color: var(--marca); box-shadow: 0 0 0 4px var(--foco); }

/* ---------------------------------------------------------------- etapas */
.cab-etapa { display: grid; gap: 10px; }
.cab-etapa .acoes-cab { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 4px; }
.faixa-exemplo { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--superficie); border-radius: var(--raio); padding: 12px 16px; font-size: 14.5px; border: 1px dashed var(--linha); }
.faixa-exemplo b { font-weight: 600; }
.bloco { display: grid; gap: 12px; padding-top: 28px; border-top: 1px solid var(--linha); min-width: 0; }
.bloco > .rot { font-size: 17px; }
.setores, .regimes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.setor { text-align: left; display: grid; gap: 2px; border: 1px solid transparent; background: var(--superficie); border-radius: 14px; padding: 14px 16px; cursor: pointer; color: var(--tinta); }
.setor b { font-size: 15px; font-weight: 600; }
.setor span { font-size: 13px; color: var(--suave); }
.setor:hover { border-color: var(--linha); }
.setor[aria-pressed="true"] { border-color: var(--marca); box-shadow: inset 0 0 0 1px var(--marca); background: var(--marca-suave); }
.aviso { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--tinta); background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 12px 14px; max-width: 80ch; }
.aviso::before { content: "i"; flex: none; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--marca); color: #fff; font-size: 11px; font-weight: 700; font-style: italic; font-family: Georgia, serif; margin-top: 1px; }
.aviso.forte { border-color: var(--nok); background: var(--nok-bg); }
.aviso.forte::before { background: var(--nok); }
.aviso.leve { background: var(--marca-suave); border-color: transparent; }
.aviso.forte::before { content: "!"; font-style: normal; font-family: var(--f-texto); }
.navegar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding-top: 28px; border-top: 1px solid var(--linha); }
.navegar .dir { display: flex; flex-wrap: wrap; gap: 10px; margin-left: auto; }

/* equipe */
.vivo { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 104px); z-index: 5; display: flex; flex-wrap: wrap; gap: 4px 30px; align-items: baseline; background: var(--painel-grad); color: var(--painel-tinta); border-radius: 16px; padding: 14px 22px; }
.vivo div { display: grid; }
.vivo span { font-size: 12px; font-weight: 500; color: var(--painel-suave); }
.vivo b { font-family: var(--f-titulo); font-size: 22px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.vivo small { color: var(--painel-suave); flex-basis: 100%; }
@media (max-width: 760px) { .vivo { position: static; } }
.funcao { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; background: var(--superficie); border-radius: var(--raio-g); padding: 22px 24px; min-width: 0; }
.fn-cab { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.fn-nome { font-family: var(--f-titulo); font-size: 22px !important; font-weight: 700; letter-spacing: -.02em; border-color: transparent !important; background: transparent !important; padding-left: 0 !important; flex: 1 1 220px; min-width: 0; }
.fn-nome:hover, .fn-nome:focus { border-color: var(--linha) !important; padding-left: 10px !important; background: var(--campo) !important; }
.fn-resumo { font-size: 14px; color: var(--suave); font-variant-numeric: tabular-nums; }
.fn-grade { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 18px 24px; }
.fn-grade .largo { grid-column: 1 / -1; }
@media (max-width: 700px) { .fn-grade { grid-template-columns: minmax(0, 1fr); } }
.turnos-fn { display: grid; gap: 8px; }
.turno-linha { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 14px; border-radius: 14px; background: var(--leve); }
.turno-linha input[type=time] { width: 132px; }
.turno-linha input[type=number] { width: 84px; }
.turno-linha label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--suave); }
.turno-linha .info { font-size: 13.5px; color: var(--suave); font-variant-numeric: tabular-nums; }
.turno-linha .btn { margin-left: auto; }
.selo { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 9px; background: var(--leve); color: var(--suave); border: 1px solid var(--linha); }
.selo.noite { background: #2c2a5e; color: #fff; border-color: #2c2a5e; }
.selo.acima { background: var(--pend-bg); color: var(--pend); border-color: transparent; }
.selo.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.linha-tempo { position: relative; height: 34px; border-radius: 8px; background: var(--leve); overflow: hidden; }
.linha-tempo .aberto { position: absolute; top: 0; bottom: 0; background: var(--marca-suave); }
.linha-tempo .faixa { position: absolute; height: 10px; border-radius: 5px; background: var(--marca); }
.linha-tempo .hora { position: absolute; bottom: 1px; font-size: 10px; color: var(--suave); transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.add-fn { display: grid; gap: 10px; }
.add-fn .chip { font-weight: 400; }

/* movimento */
.fat-dias { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.fat-dias label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--suave); }
.fat-dias input { width: 100%; padding: 9px; font-size: 15px; }
@media (max-width: 700px) { .fat-dias { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

/* custos */
.caixa-enc { display: grid; gap: 10px; background: var(--superficie); border-radius: var(--raio-g); padding: 18px 20px; }
.caixa-enc .total { font-family: var(--f-titulo); font-size: 34px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- resultado */
.res-cab { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; }
.res-cab .acoes { display: flex; flex-wrap: wrap; gap: 8px; }
.veredito { background: var(--painel-grad); color: var(--painel-tinta); border-radius: 24px; padding: 36px 36px 28px; display: grid; gap: 24px; }
.veredito .eyebrow { color: var(--painel-suave); }
.veredito .frase { font-family: var(--f-titulo); font-size: clamp(26px, 3.2vw, 38px); line-height: 1.12; font-weight: 700; letter-spacing: -.03em; max-width: 30ch; text-wrap: balance; }
.veredito .frase em { font-style: normal; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: .14em; }
.veredito .frase em { text-decoration-color: var(--painel-nok); }
.veredito .frase em.ok { text-decoration: none; color: var(--painel-ok); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0; border-top: 1px solid var(--painel-linha); }
.kpis > div { display: grid; gap: 3px; padding: 18px 18px 4px 0; }
.kpis > div + div { padding-left: 20px; border-left: 1px solid var(--painel-linha); }

/* ---------------------------------------------------------------- janela do dia */

.ic-logistica { --c: #0a84ff; } .ic-construcao { --c: #d98a00; } .ic-locais { --c: #a2845e; } .ic-beleza { --c: #e0408a; } .ic-saude { --c: #e5352b; }

/* ---------------------------------------------------------------- tela inicial */

.pergunta-perfil { font-weight: 600; font-size: 19px; margin-top: 18px; }
.opcoes-perfil { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; width: 100%; text-align: left; }
.op-perfil i { font-style: normal; font-weight: 600; color: var(--marca-tinta); font-size: 15px; margin-top: 4px; }
.marcos { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; width: 100%; text-align: left; position: relative; }

.marco::after { content: ""; position: absolute; top: 0; left: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--suave); box-shadow: 0 0 0 4px var(--papel); }
.marco.t1::after { background: var(--laranja-marca); } .marco.t2::after { background: var(--marca); }
.marco .m-rot { font-size: 13px; font-weight: 600; color: var(--suave); }

.marco b { font-family: var(--f-titulo); font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.marco > span:not(.m-rot):not(.pill) { font-size: 14px; color: var(--suave); }
.marco .pill { justify-self: start; margin-top: 6px; white-space: normal; }
@media (max-width: 640px) { .marcos { grid-template-columns: minmax(0, 1fr); gap: 14px; } .marco { padding: 0 0 0 24px; } .marco::before { top: 0; bottom: -14px; left: 5px; right: auto; width: 2px; height: auto; } .marco:last-child::before { display: none; } .marco::after { top: 3px; } }
.numeros-inicio { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.numeros-inicio > div { background: var(--superficie); border-radius: var(--raio-g); padding: 20px 22px; display: grid; gap: 6px; box-shadow: var(--sombra); }
.numeros-inicio b { font-family: var(--f-titulo); font-size: 34px; font-weight: 700; letter-spacing: -.03em; color: var(--marca-tinta); font-variant-numeric: tabular-nums; }
.numeros-inicio span { font-size: 14.5px; color: var(--suave); line-height: 1.4; }
.setores-afetados { display: grid; gap: 16px; background: var(--superficie); border-radius: 24px; padding: 28px 30px; box-shadow: var(--sombra); }

.lista-barras { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.set-barra { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1.5fr) minmax(0, .95fr); gap: 6px 18px; align-items: center; }

/* ---------------------------------------------------------------- etapa setor */
.setores-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }

.sc-txt { display: grid; gap: 2px; min-width: 0; }

.sc-txt span { font-size: 13px; color: var(--suave); line-height: 1.35; }
.sc-txt em { font-style: normal; font-size: 12px; font-weight: 600; justify-self: start; margin-top: 5px; border-radius: 999px; padding: 2px 9px; background: var(--leve); color: var(--suave); }
.sc-txt em.alto { background: var(--pend-bg); color: var(--pend); }
.contexto { display: flex; gap: 18px; align-items: flex-start; background: var(--superficie); border-radius: var(--raio-g); padding: 22px 24px; box-shadow: var(--sombra); }

.ctx-num b { font-family: var(--f-titulo); font-size: 26px; font-weight: 700; letter-spacing: -.02em; color: var(--marca-tinta); font-variant-numeric: tabular-nums; }

@media (max-width: 640px) { .contexto { flex-direction: column; padding: 18px; } }
.setor-atual { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 15px; }

/* ---------------------------------------------------------------- equipe: cargo, salário e adição rápida */
.fn-cargo { flex: 1 1 260px; min-width: 0; display: flex; }
.fn-cargo select { font-family: var(--f-titulo); font-size: 20px; font-weight: 700; letter-spacing: -.02em; border-color: transparent; background-color: var(--leve); padding: 8px 12px; max-width: 100%; }
.fn-cab .fn-nome { flex-basis: 100%; }
.conta-sal { display: block; line-height: 1.45; }
.conta-sal b { color: var(--tinta); }
.add-fn { display: grid; gap: 10px; background: var(--superficie); border-radius: var(--raio-g); padding: 18px 22px; box-shadow: var(--sombra); }
.add-linha { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }

.add-linha > label:first-child select { width: 100%; }
.add-linha input[type=number] { width: 110px; }

/* ---------------------------------------------------------------- resultado: etapas e caminhos em abas */
.linha-res .marcos { margin-top: 0; }
.linha-res .marco b { font-size: 17px; }
.abas-cam { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px; background: var(--leve); border-radius: 18px; }
.aba-cam { flex: 1 1 150px; display: grid; gap: 2px; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 13px; padding: 10px 14px; cursor: pointer; color: var(--tinta); font: inherit; }
.aba-cam b { font-size: 15px; font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.aba-cam span { font-size: 12.5px; color: var(--suave); font-variant-numeric: tabular-nums; }
.aba-cam:hover { background: var(--superficie); }
.aba-cam.sel { background: var(--superficie); border-color: var(--marca); box-shadow: 0 1px 4px rgba(0, 0, 0, .08), inset 0 0 0 1px var(--marca); }

.cartao-cam { display: grid; gap: 8px; align-content: start; background: var(--superficie); border-radius: var(--raio-g); padding: 22px 24px; box-shadow: var(--sombra); border: 1px solid var(--linha); min-width: 0; }
.cartao-cam.depois { border: 1px solid var(--marca); border-left: 5px solid var(--marca); }
.cartao-cam .valor { font-family: var(--f-titulo); font-size: clamp(30px, 3.6vw, 40px); font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.cartao-cam > small { margin-top: -6px; }
.delta { justify-self: start; font-size: 14px; font-weight: 600; border-radius: 999px; padding: 3px 11px; background: var(--leve); color: var(--suave); font-variant-numeric: tabular-nums; }
.cartao-cam.mais .delta { background: var(--laranja-suave); color: var(--laranja); }
.cartao-cam.menos .delta { background: var(--ok-bg); color: var(--ok); }
.frase-cam { font-size: 15.5px; line-height: 1.45; }
.fatos { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 0; font-size: 14.5px; }
.fatos li { padding: 9px 0; border-top: 1px solid var(--linha); }

.fatos li.bom { color: var(--ok); font-weight: 600; }
.numeros-mostram { display: grid; gap: 8px; background: var(--marca-suave); border-radius: var(--raio-g); padding: 20px 24px; }

/* impacto por função */
.fr2 { display: grid; gap: 14px; background: var(--superficie); border-radius: var(--raio-g); padding: 20px 24px; box-shadow: var(--sombra); min-width: 0; }

.fr2-hoje, .fr2-dep { display: grid; gap: 8px; align-content: start; border-radius: 16px; padding: 16px 18px; border: 1px solid var(--linha); min-width: 0; }

.segmento { display: inline-flex; border-radius: 999px; padding: 3px; background: var(--leve); justify-self: start; }

.segmento button[aria-pressed="true"] { background: var(--superficie); color: var(--marca-tinta); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); font-weight: 600; }

.numeros .pill { white-space: normal; }
.prefixo span { white-space: nowrap; }
.prefixo.pos { max-width: 260px; }
.mini input[data-f="divisor"] { width: 110px; }

/* ---------------------------------------------------------------- perfil único, início em branco e o tamanho do problema */
.cta-inicio { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 12px; }
.btn.grande { padding: 14px 26px; font-size: 17px; }
.nota.centro { text-align: center; margin-inline: auto; }
.barra .nova { margin-left: auto; }
.empresa-dados { display: grid; gap: 22px; }

.vazio-equipe { background: var(--superficie); border: 1px dashed var(--linha); border-radius: var(--raio-g); padding: 28px; text-align: center; color: var(--suave); }

.tam-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.tam { display: grid; gap: 4px; align-content: start; background: var(--superficie); border-radius: var(--raio-g); padding: 18px 20px; box-shadow: var(--sombra); border-top: 4px solid var(--laranja-marca); }

.tam b { font-family: var(--f-titulo); font-size: 30px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }

#caminhos > .segmento { margin-top: -4px; }
.fr2-hoje, .fr2-dep, .cartao-cam, .tam, .fr2 { grid-template-columns: minmax(0, 1fr); }

/* ---------------------------------------------------------------- gráfico das 24 horas (D81)
   Paleta categórica de referência (validada para daltonismo; o contraste claro pede legenda e tabela, que existem).
   A cor segue a posição da função na equipe; da oitava em diante, “Outras funções” em cinza. */
:root { --s0: #2a78d6; --s1: #eb6834; --s2: #1baf7a; --s3: #eda100; --s4: #e87ba4; --s5: #008300; --s6: #6250d6; --s7: #e34948; --s-outras: #8e8e93; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s0: #3987e5; --s1: #d95926; --s2: #199e70; --s3: #c98500; --s4: #d55181; --s5: #008300; --s6: #9085e9; --s7: #e66767; --s-outras: #7c7c80; } }
:root[data-theme="dark"] { --s0: #3987e5; --s1: #d95926; --s2: #199e70; --s3: #c98500; --s4: #d55181; --s5: #008300; --s6: #9085e9; --s7: #e66767; --s-outras: #7c7c80; }
.g24 .c-0 { background: var(--s0); } .g24 .c-1 { background: var(--s1); } .g24 .c-2 { background: var(--s2); } .g24 .c-3 { background: var(--s3); }
.g24 .c-4 { background: var(--s4); } .g24 .c-5 { background: var(--s5); } .g24 .c-6 { background: var(--s6); } .g24 .c-7 { background: var(--s7); } .g24 .c-outras { background: var(--s-outras); }
.g24 { margin: 0; display: grid; gap: 14px; background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-g); padding: 18px 20px 16px; min-width: 0; }
.g24-cab { display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: space-between; align-items: flex-start; }
.g24-cab > div:first-child { display: grid; gap: 2px; min-width: 0; flex: 1 1 280px; }
.g24-cab .suave { font-size: 14px; }
.g24-ctl { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.g24-area { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr); height: 230px; margin-bottom: 22px; }
.g24-y { position: relative; }
.g24-y span { position: absolute; right: 8px; transform: translateY(50%); font-size: 12px; color: var(--suave); font-variant-numeric: tabular-nums; line-height: 1; }
.g24-plot { position: relative; min-width: 0; }
.g24-grade i { position: absolute; left: 0; right: 0; border-top: 1px solid var(--linha); opacity: .55; }
.g24-grade i:first-child { opacity: 1; }
.g24-cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); }
.g24-col { height: 100%; display: flex; align-items: flex-end; justify-content: center; padding: 0 2px; border-radius: 6px 6px 0 0; }
.g24-col.ativa { background: var(--leve); }
.g24-pilha { width: 100%; max-width: 24px; display: flex; flex-direction: column-reverse; border-radius: 4px 4px 0 0; overflow: hidden; }
.g24-seg { display: block; width: 100%; flex: none; box-sizing: border-box; }
.g24-seg + .g24-seg { border-bottom: 2px solid var(--superficie); }
.g24-col.ativa .g24-seg + .g24-seg { border-bottom-color: var(--leve); }
.g24-x { position: absolute; left: 0; right: 0; top: calc(100% + 6px); display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); }
.g24-x span { font-size: 12px; color: var(--suave); white-space: nowrap; transform: translateX(-50%); justify-self: start; line-height: 1; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .g24 { padding: 14px 12px; } .g24-x span.menor { visibility: hidden; } .g24-col { padding: 0 1px; } .g24-area { height: 200px; } }
.g24-dica { position: absolute; top: 0; z-index: 5; display: grid; gap: 3px; min-width: 170px; max-width: 260px; background: var(--superficie); color: var(--tinta); border: 1px solid var(--linha); border-radius: 10px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0, 0, 0, .12); pointer-events: none; }
.g24-dica span { display: flex; align-items: center; gap: 6px; }
.g24-dica span b { margin-left: auto; padding-left: 10px; font-variant-numeric: tabular-nums; }
.g24 i[class^="c-"] { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legenda { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--tinta); }
.legenda li { display: inline-flex; align-items: center; gap: 7px; }
.g24-tab > summary { cursor: pointer; font-size: 14px; font-weight: 500; color: var(--marca-tinta); }
.g24-tab[open] > .rolagem { margin-top: 10px; max-height: 360px; overflow: auto; }
.distribuicao .g24 { background: var(--superficie); }

/* ---------------------------------------------------------------- pessoas da função (D82) */
details.mais-fn, .pessoas-fn { min-width: 0; max-width: 100%; }

/* ---------------------------------------------------------------- exercício pela média do mês (D80) */
.exercicio-chave .check b { font-weight: 600; }
.convite-ex { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; background: var(--superficie); border-radius: var(--raio-g); padding: 18px 22px; }

.aviso-ex { display: grid; gap: 8px; font-size: 15px; background: var(--pend-bg); border: 1px solid var(--pend-forte); border-radius: var(--raio); padding: 14px 16px; }
.ex-fn { display: grid; gap: 18px; background: var(--superficie); border-radius: var(--raio-g); padding: 20px 22px; min-width: 0; }
.ex-tit { font-size: 17px; }
.ex-etapas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.ex-etapa { border: 1px solid var(--linha); border-radius: var(--raio); padding: 12px 14px; display: grid; gap: 8px; align-content: start; }
.ex-etapa > div { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between; }
.ex-etapa .eyebrow { display: inline; }
.ex-etapa ul { margin: 0; padding-left: 18px; font-size: 14px; display: grid; gap: 4px; }
.ex-etapa p { font-size: 14px; }
.kpis.ex-kpis { border-top-color: var(--linha); }
.kpis.ex-kpis > div + div { border-left-color: var(--linha); }
.kpis.ex-kpis span, .kpis.ex-kpis small { color: var(--suave); }
.kpis.ex-kpis b { font-size: 24px; }
.cob-ex td.menos { color: var(--nok); font-weight: 600; }
.cob-ex th:first-child, .cob-ex td:first-child { white-space: nowrap; }

/* ---------------------------------------------------------------- férias e art. 386 (D83, D84) */

.fer-locais { display: grid; gap: 8px; background: var(--superficie); border-radius: var(--raio); padding: 14px 16px; }
.chips-fer { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-fer { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; background: var(--leve); border-radius: 999px; padding: 4px 6px 4px 12px; }
.chip-fer button { border: 0; background: transparent; color: var(--suave); font-size: 16px; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 999px; }
.chip-fer button:hover { color: var(--nok); }
.add-fer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.fer-resumo { font-size: 16px; }
.mes-grade .dc.f-ok { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
.mes-grade .dc.f-veda { background: var(--nok-bg); color: var(--nok); }
.mes-grade .dc.f-evitar { background: transparent; color: var(--suave); }
.cal-leg i.f-ok { background: var(--ok-bg); border: 1px solid var(--ok); }
.cal-leg i.f-veda { background: var(--nok-bg); border: 1px solid var(--nok); }
.cal-leg i.f-evitar { background: transparent; border: 1px solid var(--linha); }
span.dc { display: flex; align-items: center; justify-content: center; cursor: default; }

/* ---------------------------------------------------------------- escalas testadas (D86) */
.testadas > summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; list-style: none; background: var(--superficie); border-radius: var(--raio-g); padding: 16px 20px; }
.testadas > summary::-webkit-details-marker { display: none; }
.testadas > summary::before { content: '▸'; color: var(--marca-tinta); }
.testadas[open] > summary::before { content: '▾'; }
.testadas > summary span { display: grid; gap: 2px; }
.testadas > summary small { color: var(--suave); font-size: 14px; }
.testadas[open] { display: grid; gap: 16px; }
.tst-turno { display: grid; gap: 10px; background: var(--superficie); border-radius: var(--raio-g); padding: 16px 20px; min-width: 0; }
.tst-turno h3 { font-size: 17px; margin: 0; }
.tst-turno h3 small { font-weight: 400; color: var(--suave); margin-left: 6px; }
.tst-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.tst-lista > li { border: 1px solid var(--linha); border-radius: var(--raio); padding: 12px 14px; display: grid; gap: 6px; }

.tst-num { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--suave); font-variant-numeric: tabular-nums; }
.tst-lista ul, .tst-fora ul { margin: 0; padding-left: 18px; font-size: 14px; display: grid; gap: 3px; }
.tst-fora { display: grid; gap: 6px; font-size: 14px; }
@media (max-width: 560px) { .tst-turno { padding: 14px 12px; } .testadas > summary { padding: 14px; } }

/* ---------------------------------------------------------------- modos, manual e tutorial (D87, D88) */
.modos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; margin-top: 8px; text-align: left; }
.modo-c { display: grid; gap: 6px; align-content: start; background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-g); padding: 18px 20px; cursor: pointer; font: inherit; color: var(--tinta); text-align: left; }

.modo-c > span:not(.eyebrow) { color: var(--suave); font-size: 15px; }
.modo-c em { font-style: normal; font-weight: 600; color: var(--marca-tinta); margin-top: 4px; }
.manual { display: grid; gap: 16px; background: var(--superficie); border-radius: var(--raio-g); padding: 24px; }

.manual-g { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 24px; }

.manual-mao h3 { margin: 0 0 8px; font-size: 16px; }
.manual-mao ul, .manual-passos { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 15px; }
.glossario > summary { cursor: pointer; font-weight: 600; color: var(--marca-tinta); }
.glossario dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 12px 0 0; font-size: 15px; }
.glossario dt { font-weight: 600; }
.glossario dd { margin: 0; color: var(--suave); }
@media (max-width: 760px) { .manual-g { grid-template-columns: minmax(0, 1fr); } .manual { padding: 18px 16px; } .glossario dl { grid-template-columns: minmax(0, 1fr); } .glossario dd { margin-bottom: 6px; } }
.modo-atual { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--suave); }
.aviso-simples { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; background: var(--pend-bg); border: 1px solid var(--pend-forte); border-radius: var(--raio-g); padding: 16px 20px; }
.aviso-simples p { max-width: 80ch; }
.tab.simples-eq input[type="number"] { width: 84px; }
.tab.simples-eq .prefixo { max-width: 150px; }
.tab.simples-eq input[type="time"] { width: 112px; }
.tab.simples-eq td { vertical-align: middle; }
.tab.simples-eq td small { display: block; }
.tutorial-topo { display: flex; justify-content: flex-end; margin: 0 0 -6px; }

#tour { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
#tour[hidden] { display: none; }
.tour-luz { position: fixed; border-radius: 12px; box-shadow: 0 0 0 3px var(--marca), 0 0 0 200vmax rgba(10, 15, 25, .45); transition: top .2s, left .2s, width .2s, height .2s; pointer-events: none; }
.tour-caixa { position: fixed; pointer-events: auto; background: var(--superficie); color: var(--tinta); border-radius: 14px; padding: 16px 18px; box-shadow: 0 12px 40px rgba(0, 0, 0, .28); display: grid; gap: 6px; max-width: calc(100vw - 16px); }
.tour-caixa h3 { margin: 0; font-size: 17px; }
.tour-caixa p { margin: 0; font-size: 15px; }
.tour-acoes { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.tour-acoes span { flex: 1; }
@media (prefers-reduced-motion: reduce) { .tour-luz { transition: none; } }

/* ---------------------------------------------------------------- dias por pessoa (D89) */
.dias.mini { gap: 4px; flex-wrap: nowrap; }
.dias.mini .dia { min-width: 34px; height: 32px; padding: 0 6px; font-size: 13px; }
.dias .dia.auto { border-style: dashed; color: var(--suave); background: transparent; }

.tab.dias-p td { vertical-align: middle; padding-block: 6px; }

.tab.dias-p .alerta { color: var(--nok); font-weight: 600; margin-left: 4px; }
details.dias-pes[open] { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.sx-linha > td { background: var(--leve); }
.sx-dias { display: grid; gap: 14px; padding: 6px 4px; min-width: 0; }
.dias-pes.solto { display: grid; gap: 8px; }
.tab.simples-eq td .btn.texto { display: block; padding-left: 0; margin-top: 2px; }

<script id="motor-escalas">/*
 * Simulador de Escalas — Emenda Constitucional nº 141/2026 (Fim da 6x1)
 * Motor de cálculo (módulo puro, sem DOM)
 * Claudio Zalaf Advogados Associados · Área Trabalhista
 *
 * Unidades internas
 *   datas  → número inteiro de dias desde 01/01/1970 (sem fuso horário)
 *   tempo  → minutos inteiros; horas computadas em unidades de 1/7 de minuto (U = 7 por minuto),
 *            porque a hora noturna reduzida vale 8/7 da hora de relógio
 *   moeda  → centavos inteiros
 * Nenhum arredondamento antes da exibição.
 */
(function (raiz, fabrica) {
  'use strict';
  var M = fabrica();
  if (typeof module === 'object' && module.exports) module.exports = M;
  else raiz.MotorEscalas = M;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const VERSAO = '0.1.2';
  const BASE_NORMATIVA = '26/10/2026';
  const U = 7;
  const HORA = 60 * U;
  const DIA = 1440;

  /* ================================================================== datas */

  function diaDe(a, m, d) {
    const y = a - (m <= 2 ? 1 : 0);
    const era = Math.floor(y / 400);
    const yoe = y - era * 400;
    const mp = (m + 9) % 12;
    const doy = Math.floor((153 * mp + 2) / 5) + d - 1;
    const doe = yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy;
    return era * 146097 + doe - 719468;
  }
  function civil(z) {
    const zz = z + 719468;
    const era = Math.floor(zz / 146097);
    const doe = zz - era * 146097;
    const yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365);
    const doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100));
    const mp = Math.floor((5 * doy + 2) / 153);
    const d = doy - Math.floor((153 * mp + 2) / 5) + 1;
    const m = mp < 10 ? mp + 3 : mp - 9;
    return { a: yoe + era * 400 + (m <= 2 ? 1 : 0), m: m, d: d };
  }
  /** 0 = segunda-feira … 6 = domingo (01/01/1970 foi quinta-feira). */
  function diaSemana(z) { return (((z + 3) % 7) + 7) % 7; }
  function inicioSemana(z, base) { return z - ((diaSemana(z) - (base || 0) + 7) % 7); }
  function diasNoMes(a, m) { return m === 12 ? 31 : diaDe(a, m + 1, 1) - diaDe(a, m, 1); }
  function mod(a, n) { return ((a % n) + n) % n; }
  function p2(n) { return String(n).padStart(2, '0'); }
  function somarMeses(z, n) {
    const c = civil(z);
    const t = c.a * 12 + (c.m - 1) + n;
    const a = Math.floor(t / 12), m = mod(t, 12) + 1;
    return diaDe(a, m, Math.min(c.d, diasNoMes(a, m)));
  }

  const NOMES_DIA = ['segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado', 'domingo'];
  const NOMES_MES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

  function lerData(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return Number.isInteger(v) ? v : null;
    const s = String(v).trim();
    let m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
    if (m) return dataValida(+m[1], +m[2], +m[3]);
    m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
    if (m) return dataValida(+m[3], +m[2], +m[1]);
    return null;
  }
  function dataValida(a, m, d) {
    if (!(m >= 1 && m <= 12) || !(d >= 1 && d <= diasNoMes(a, m))) return null;
    return diaDe(a, m, d);
  }
  function fmtData(z) { const c = civil(z); return p2(c.d) + '/' + p2(c.m) + '/' + c.a; }
  function fmtDataCurta(z) { const c = civil(z); return p2(c.d) + '/' + p2(c.m); }
  function lerHora(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return Number.isInteger(v) && v >= 0 && v < DIA ? v : null;
    const m = /^(\d{1,2})[:hH](\d{2})$/.exec(String(v).trim());
    if (!m) return null;
    const h = +m[1], mi = +m[2];
    if (h > 23 || mi > 59) return null;
    return h * 60 + mi;
  }
  function fmtHora(min) { const x = mod(min, DIA); return p2(Math.floor(x / 60)) + ':' + p2(x % 60); }

  /**
   * Exibe uma quantidade em unidades de 1/7 de minuto como horas.
   * Arredondamento de exibição: meia unidade para cima, ao segundo.
   */
  function fmtHoras(u) {
    const neg = u < 0;
    const v = neg ? -u : u;
    const s = Math.floor((120 * v + 7) / 14);
    const h = Math.floor(s / 3600), mi = Math.floor((s % 3600) / 60), se = s % 60;
    return (neg ? '−' : '') + h + 'h' + p2(mi) + (se ? 'min' + p2(se) + 's' : '');
  }
  function fmtMinutos(min) { return fmtHoras(min * U); }

  function centavos(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return Math.round(v * 100);
    let s = String(v).replace(/[R$\s]/g, '');
    if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
    const n = Number(s);
    return Number.isFinite(n) ? Math.round(n * 100) : null;
  }
  function fmtReais(c) {
    if (c == null) return '—';
    const neg = c < 0, v = Math.abs(c);
    const int = String(Math.floor(v / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (neg ? '−' : '') + 'R$ ' + int + ',' + p2(v % 100);
  }

  /* =============================================================== feriados */

  function pascoa(a) {
    const A = a % 19, B = Math.floor(a / 100), C = a % 100, D = Math.floor(B / 4), E = B % 4;
    const F = Math.floor((B + 8) / 25), G = Math.floor((B - F + 1) / 3);
    const H = (19 * A + B - D - G + 15) % 30, I = Math.floor(C / 4), K = C % 4;
    const L = (32 + 2 * E + 2 * I - H - K) % 7, Mm = Math.floor((A + 11 * H + 22 * L) / 451);
    const mes = Math.floor((H + L - 7 * Mm + 114) / 31), dia = ((H + L - 7 * Mm + 114) % 31) + 1;
    return diaDe(a, mes, dia);
  }
  function feriadosNacionais(a) {
    const f = (m, d, nome, base) => ({ data: diaDe(a, m, d), nome: nome, esfera: 'nacional', base: base || null });
    return [
      f(1, 1, 'Confraternização Universal'), f(4, 21, 'Tiradentes'), f(5, 1, 'Dia do Trabalho'),
      f(9, 7, 'Independência do Brasil'), f(10, 12, 'Nossa Senhora Aparecida'), f(11, 2, 'Finados'),
      f(11, 15, 'Proclamação da República'), f(11, 20, 'Dia Nacional de Zumbi e da Consciência Negra', 'Lei 14.759/2023'),
      f(12, 25, 'Natal'),
    ];
  }
  /** Datas móveis. Nenhuma é feriado nacional: a Paixão depende de lei municipal (Lei 9.093/1995); Carnaval e Corpus Christi são pontos facultativos, salvo lei local. */
  function datasMoveis(a) {
    const p = pascoa(a);
    return { pascoa: p, paixao: p - 2, carnaval: p - 47, corpusChristi: p + 60 };
  }
  function feriadosEstaduais(uf, a) {
    if (uf === 'SP') return [{ data: diaDe(a, 7, 9), nome: 'Revolução Constitucionalista de 1932', esfera: 'estadual', base: null }];
    return [];
  }

  /* ========================================================= configuração */

  const CONFIG_PADRAO = Object.freeze({
    cenario: 'legal',            // 'legal' | '42' | '40'
    prazos: 'conservador',       // 'conservador' (LC 95/1998) | 'civil' (CC, art. 132, § 3º)
    transicao: 'semana',         // 'semana' (limite mais rigoroso na semana inteira) | 'diaria'
    medida: 'computadas',        // 'computadas' | 'relogio' (regras de teto)
    leitura8h24: 'coletiva',     // 'coletiva' (EC, art. 7º) | 'individual' (acordo de compensação)
    art9: 'literal',             // 'literal' (XV desde 16/12/2026) | 'diferido'
    turnoDia: 'inicio',          // 'inicio' | 'civil' (rateio pelo dia civil)
    prorrogacaoReduzida: true,   // hora reduzida estendida à prorrogação (art. 73, § 5º)
    criterioMedia: 'A',          // 'A' | 'B' | 'C' (§ 2º)
    semanaInicio: 0,             // 0 = segunda-feira
    sinalContrafactual: true,
  });

  function datasVigencia(prazos) {
    const c = prazos === 'civil' ? 1 : 0;
    return {
      publicacao: diaDe(2026, 10, 16),
      xv: diaDe(2026, 12, 16) + c,
      teto42: diaDe(2026, 12, 16) + c,
      art3: diaDe(2026, 12, 16) + c,
      art9: diaDe(2027, 10, 16) + c,      // primeiro dia após o fim do prazo de aditamento
      teto40: diaDe(2027, 12, 16) + c,
    };
  }

  const TIPOS_INSTRUMENTO = {
    compensacao_mensal: { nome: 'Acordo de compensação no mês', natureza: 'individual', base: 'CLT, art. 59, § 6º; Súmula 85, I, do TST' },
    banco_semestral: { nome: 'Banco de horas semestral', natureza: 'individual', base: 'CLT, art. 59, § 5º' },
    banco_anual: { nome: 'Banco de horas anual', natureza: 'coletivo', base: 'CLT, art. 59, § 2º' },
    media_par2: { nome: 'Regime de média de repousos', natureza: 'coletivo', base: 'CF, art. 7º, § 2º' },
    ampliacao_art7: { nome: 'Ampliação da duração diária na etapa de 42 h', natureza: 'coletivo', base: 'Emenda Constitucional 141/2026 (Fim da 6x1), art. 7º' },
    escala_12x36: { nome: 'Escala 12x36', natureza: 'individual', base: 'CLT, art. 59-A' },
    jornada_12h: { nome: 'Jornada de 12 h fora da 12x36', natureza: 'coletivo', base: 'CLT, art. 611-A, I; STF, Tema 1.046' },
    turno_ininterrupto_8h: { nome: 'Turno ininterrupto de até 8 h', natureza: 'coletivo', base: 'CF, art. 7º, XIV; Súmula 423 do TST' },
    reducao_intervalo: { nome: 'Redução do intervalo intrajornada', natureza: 'coletivo', base: 'CLT, art. 611-A, III' },
    reducao_intervalo_mte: { nome: 'Autorização ministerial para reduzir o intervalo', natureza: 'ato do Ministério do Trabalho', base: 'CLT, art. 71, § 3º' },
    intervalo_superior_2h: { nome: 'Intervalo superior a 2 h', natureza: 'individual', base: 'CLT, art. 71, caput' },
    fracionamento_intervalo: { nome: 'Fracionamento do intervalo', natureza: 'coletivo', base: 'CLT, art. 71, § 5º' },
    feriado_comercio: { nome: 'Trabalho em feriados no comércio', natureza: 'coletivo', base: 'Lei 10.101/2000, art. 6º-A' },
  };
  const TIPOS_COMPENSACAO = ['compensacao_mensal', 'banco_semestral', 'banco_anual'];

  const LIMITES_TIPO = {
    bancario: { diario: 6, semanal: 30, base: 'CLT, art. 224' },
    teleatendimento: { diario: 6, semanal: 36, base: 'NR-17, Anexo II (redação vigente a conferir)' },
    parcial: { diario: null, semanal: 30, base: 'CLT, art. 58-A' },
  };

  /* =========================================================== normalização */

  const MARCAS = new Set(['ferias', 'afastamento', 'falta', 'folga_comp', 'folga']);
  const FORA_DE_SERVICO = new Set(['fora', 'sem_escala', 'ferias', 'afastamento']);
  const AUSENCIA_CONTRAFACTUAL = new Set(['feriado', 'ferias', 'afastamento', 'falta', 'folga_comp']);

  function normalizar(entrada) {
    if (entrada && entrada.__normalizado) return entrada;
    const E = entrada || {};
    const erros = [];
    const err = (onde, msg) => erros.push({ onde: onde, msg: msg });

    const e0 = E.empresa || {};
    const empresa = {
      razaoSocial: e0.razaoSocial || '', municipio: e0.municipio || '', uf: String(e0.uf || '').toUpperCase(),
      atividade: e0.atividade || 'industria', ruralTipo: e0.ruralTipo || 'lavoura', porte: e0.porte || null,
    };
    const hz = E.horizonte || {};
    const horizonte = {
      inicio: lerData(hz.inicio) != null ? lerData(hz.inicio) : diaDe(2026, 12, 14),
      fim: lerData(hz.fim) != null ? lerData(hz.fim) : diaDe(2028, 12, 31),
    };

    const turnos = new Map();
    (E.turnos || []).forEach((t, i) => {
      const id = String(t.id == null ? '' : t.id).trim();
      if (!id) { err('turnos, linha ' + (i + 1), 'Turno sem identificador.'); return; }
      const ini = lerHora(t.inicio), fim = lerHora(t.fim);
      if (ini == null || fim == null) { err('turno ' + id, 'Horário de início ou de fim inválido (use hh:mm).'); return; }
      if (ini === fim) { err('turno ' + id, 'Início e fim iguais.'); return; }
      const duracao = fim > ini ? fim - ini : fim + DIA - ini;
      const pausas = [];
      for (const p of (t.pausas || t.intervalos || [])) {
        const pi = lerHora(p.inicio), pd = Number(p.duracao);
        if (pi == null || !(pd > 0) || !Number.isInteger(pd)) { err('turno ' + id, 'Intervalo com início ou duração inválidos.'); continue; }
        const off = mod(pi - ini, DIA);
        if (off <= 0 || off + pd >= duracao) { err('turno ' + id, 'Intervalo das ' + fmtHora(pi) + ' fora do turno.'); continue; }
        pausas.push({ offset: off, duracao: pd, inicio: pi, tipo: p.tipo === 'indenizado' ? 'indenizado' : 'usufruido' });
      }
      pausas.sort((a, b) => a.offset - b.offset);
      for (let j = 1; j < pausas.length; j++) {
        if (pausas[j].offset < pausas[j - 1].offset + pausas[j - 1].duracao) err('turno ' + id, 'Intervalos sobrepostos.');
      }
      turnos.set(id, { id: id, nome: t.nome || id, inicio: ini, fim: fim, duracao: duracao, pausas: pausas });
    });

    const escalas = new Map();
    (E.escalas || []).forEach((e, i) => {
      const id = String(e.id == null ? '' : e.id).trim();
      const dias = (e.dias || []).map((x) => (x == null || x === '' || x === '-' || String(x).toLowerCase() === 'folga') ? null : String(x).trim());
      if (!id || !dias.length) { err('escalas, linha ' + (i + 1), 'Escala sem identificador ou sem dias.'); return; }
      for (const x of dias) if (x && !turnos.has(x)) err('escala ' + id, 'Turno "' + x + '" não cadastrado.');
      const especial = e.especial === '12x36' ? '12x36' : null;
      escalas.set(id, {
        id: id, nome: e.nome || id, dias: dias, especial: especial,
        tipo: e.tipo || (dias.length % 7 === 0 ? 'semanal' : 'ciclo'),
        trabalhaFeriados: e.trabalhaFeriados != null ? !!e.trabalhaFeriados : especial === '12x36',
      });
    });

    const empregados = [];
    const idsEmp = new Set();
    (E.empregados || []).forEach((p, i) => {
      const id = String(p.id == null ? '' : p.id).trim();
      if (!id) { err('empregados, linha ' + (i + 1), 'Empregado sem identificador.'); return; }
      if (idsEmp.has(id)) { err('empregado ' + id, 'Identificador repetido.'); return; }
      idsEmp.add(id);
      let rems = p.remuneracoes;
      if (!rems && p.remuneracao != null) rems = [{ desde: null, valor: p.remuneracao }];
      rems = (rems || []).map((r) => ({ desde: lerData(r.desde) != null ? lerData(r.desde) : -1e9, valor: centavos(r.valor) }))
        .filter((r) => r.valor != null).sort((a, b) => a.desde - b.desde);
      const tipo = p.tipo || 'comum';
      const lim = LIMITES_TIPO[tipo] || {};
      empregados.push({
        id: id, nome: p.nome || '', setor: p.setor == null ? '' : String(p.setor), cargo: p.cargo || '',
        salario: centavos(p.salario), remuneracoes: rems,
        nivelSuperior: !!p.nivelSuperior, controleMantido: !!p.controleMantido, empregadoPublico: !!p.empregadoPublico,
        admissao: lerData(p.admissao) != null ? lerData(p.admissao) : -1e9,
        desligamento: lerData(p.desligamento),
        tipo: tipo,
        limiteDiario: p.limiteDiario != null ? Number(p.limiteDiario) : lim.diario != null ? lim.diario : null,
        limiteSemanal: p.limiteSemanal != null ? Number(p.limiteSemanal) : lim.semanal != null ? lim.semanal : null,
        baseLimite: lim.base || 'limite fixado em norma ou contrato',
        aprendiz8h: !!p.aprendiz8h, art386: !!p.art386,
        contratoPublico: p.contratoPublico ? { aditamento: lerData(p.contratoPublico.aditamento) } : null,
      });
    });

    const atribuicoes = [];
    (E.atribuicoes || []).forEach((a, i) => {
      const ini = lerData(a.inicio);
      const esc = escalas.get(String(a.escala));
      if (!idsEmp.has(String(a.empregado))) { err('atribuições, linha ' + (i + 1), 'Empregado "' + a.empregado + '" não cadastrado.'); return; }
      if (!esc) { err('atribuições, linha ' + (i + 1), 'Escala "' + a.escala + '" não cadastrada.'); return; }
      if (ini == null) { err('atribuições, linha ' + (i + 1), 'Data de início inválida.'); return; }
      let anc = lerData(a.ancora);
      if (anc == null) anc = esc.tipo === 'semanal' ? inicioSemana(ini, E.semanaInicio || 0) : ini;
      atribuicoes.push({ empregado: String(a.empregado), escala: esc.id, inicio: ini, fim: lerData(a.fim), ancora: anc });
    });

    const excecoes = [];
    (E.excecoes || []).forEach((x, i) => {
      const tipo = x.tipo;
      const okTipo = MARCAS.has(tipo) || tipo === 'troca' || tipo === 'extra' || tipo === 'feriado_trabalhado';
      if (!okTipo) { err('exceções, linha ' + (i + 1), 'Tipo de exceção desconhecido: ' + tipo); return; }
      if (!idsEmp.has(String(x.empregado))) { err('exceções, linha ' + (i + 1), 'Empregado "' + x.empregado + '" não cadastrado.'); return; }
      if ((tipo === 'troca' || tipo === 'extra') && !turnos.has(String(x.turno))) { err('exceções, linha ' + (i + 1), 'Turno "' + x.turno + '" não cadastrado.'); return; }
      const d0 = lerData(x.data != null ? x.data : x.inicio);
      const d1 = x.fim != null ? lerData(x.fim) : d0;
      if (d0 == null || d1 == null || d1 < d0) { err('exceções, linha ' + (i + 1), 'Data inválida.'); return; }
      for (let d = d0; d <= d1; d++) excecoes.push({ empregado: String(x.empregado), data: d, tipo: tipo, turno: x.turno != null ? String(x.turno) : null });
    });

    let feriados;
    if (Array.isArray(E.feriados)) {
      feriados = E.feriados.map((f) => ({ data: lerData(f.data), nome: f.nome || 'Feriado', esfera: f.esfera || 'municipal', base: f.base || null })).filter((f) => f.data != null);
    } else {
      feriados = [];
      const a0 = civil(horizonte.inicio).a - 1, a1 = civil(horizonte.fim).a + 1;
      for (let a = a0; a <= a1; a++) { feriados.push(...feriadosNacionais(a)); feriados.push(...feriadosEstaduais(empresa.uf, a)); }
      for (const f of (E.feriadosAdicionais || [])) { const d = lerData(f.data); if (d != null) feriados.push({ data: d, nome: f.nome || 'Feriado', esfera: f.esfera || 'municipal', base: f.base || null }); }
    }

    const instrumentos = [];
    (E.instrumentos || []).forEach((x, i) => {
      const meta = TIPOS_INSTRUMENTO[x.tipo];
      if (!meta) { err('instrumentos, linha ' + (i + 1), 'Tipo de instrumento desconhecido: ' + x.tipo); return; }
      const ab = x.abrangencia || { todos: true };
      instrumentos.push({
        id: x.id || x.tipo + '-' + (i + 1), tipo: x.tipo, nome: x.nome || meta.nome,
        natureza: x.natureza || meta.natureza,
        celebracao: lerData(x.celebracao),
        vigenciaInicio: lerData(x.vigenciaInicio) != null ? lerData(x.vigenciaInicio) : -1e9,
        vigenciaFim: lerData(x.vigenciaFim),
        compativel: x.compativel == null ? null : !!x.compativel,
        compativel40: x.compativel40 == null ? null : !!x.compativel40,
        abrangencia: { todos: !!ab.todos, setores: (ab.setores || []).map(String), empregados: (ab.empregados || []).map(String) },
        parametros: x.parametros || {},
      });
    });

    const setores = new Map();
    (E.setores || []).forEach((s) => {
      const id = String(s.id);
      const nec = (s.necessidade || []).map((n) => ({ dias: n.dias || [0, 1, 2, 3, 4, 5, 6], inicio: lerHora(n.inicio), fim: lerHora(n.fim), pessoas: Number(n.pessoas) || 0 }))
        .filter((n) => n.inicio != null && n.fim != null);
      const exc = (s.excecoes || []).map((n) => ({ data: lerData(n.data), inicio: lerHora(n.inicio), fim: lerHora(n.fim), pessoas: Number(n.pessoas) || 0 }))
        .filter((n) => n.data != null && n.inicio != null && n.fim != null);
      setores.set(id, { id: id, nome: s.nome || id, necessidade: nec, excecoes: exc });
    });

    const tetoRGPS = Object.assign({ 2026: 847555 }, {});
    for (const k of Object.keys(E.tetoRGPS || {})) { const v = centavos(E.tetoRGPS[k]); if (v != null) tetoRGPS[k] = v; }

    return {
      __normalizado: true, erros: erros, empresa: empresa, horizonte: horizonte, turnos: turnos, escalas: escalas,
      empregados: empregados, atribuicoes: atribuicoes, excecoes: excecoes, feriados: feriados,
      instrumentos: instrumentos, setores: setores, tetoRGPS: tetoRGPS, semanaInicio: E.semanaInicio || 0,
    };
  }

  /* ============================================================ contexto */

  function criarContexto(dados, cfg, D) {
    const si = cfg.semanaInicio;
    const h0 = dados.horizonte.inicio, h1 = dados.horizonte.fim;
    const c0 = civil(h0), c1 = civil(h1);
    const mesIni = diaDe(c0.a, c0.m, 1), mesFim = diaDe(c1.a, c1.m, diasNoMes(c1.a, c1.m));
    const semIni = inicioSemana(h0, si), semFim = inicioSemana(h1, si);
    const janela = { a: Math.min(mesIni, semIni) - 35, b: Math.max(mesFim, semFim + 6) + 35 };
    const feriados = new Map();
    for (const f of dados.feriados) if (!feriados.has(f.data)) feriados.set(f.data, f);
    const atrib = new Map();
    for (const x of dados.atribuicoes) { if (!atrib.has(x.empregado)) atrib.set(x.empregado, []); atrib.get(x.empregado).push(x); }
    for (const l of atrib.values()) l.sort((p, q) => p.inicio - q.inicio);
    const exc = new Map();
    for (const x of dados.excecoes) {
      if (!exc.has(x.empregado)) exc.set(x.empregado, new Map());
      const m = exc.get(x.empregado);
      if (!m.has(x.data)) m.set(x.data, []);
      m.get(x.data).push(x);
    }
    return {
      dados: dados, cfg: cfg, D: D, si: si, h0: h0, h1: h1, mesIni: mesIni, mesFim: mesFim, semIni: semIni, semFim: semFim,
      janela: janela, feriados: feriados, atrib: atrib, exc: exc, turnos: dados.turnos, escalas: dados.escalas,
      rural: dados.empresa.atividade === 'rural' ? dados.empresa.ruralTipo : null,
      comercio: dados.empresa.atividade === 'comercio', cacheCiclo: new Map(),
    };
  }

  /* ================================================== expansão da escala */

  function expandir(emp, ctx) {
    const A = ctx.janela.a, B = ctx.janela.b;
    const atr = ctx.atrib.get(emp.id) || [];
    const exc = ctx.exc.get(emp.id) || new Map();
    const dias = new Array(B - A + 1);
    for (let d = A; d <= B; d++) {
      let at = null;
      for (let j = atr.length - 1; j >= 0; j--) {
        const x = atr[j];
        if (x.inicio <= d && (x.fim == null || d <= x.fim)) { at = x; break; }
      }
      const esc = at ? ctx.escalas.get(at.escala) : null;
      const base = esc ? esc.dias[mod(d - at.ancora, esc.dias.length)] : null;
      const servico = d >= emp.admissao && (emp.desligamento == null || d <= emp.desligamento);
      const lista = exc.get(d) || [];
      let marca = null, troca = null, ferTrab = false;
      const extras = [];
      for (const e of lista) {
        if (MARCAS.has(e.tipo)) marca = e.tipo;
        else if (e.tipo === 'troca') troca = e.turno;
        else if (e.tipo === 'extra') extras.push(e.turno);
        else if (e.tipo === 'feriado_trabalhado') ferTrab = true;
      }
      const fer = ctx.feriados.get(d) || null;
      const turnos = [];
      let estado;
      if (!servico) estado = 'fora';
      else if (!esc && !troca && !extras.length) estado = 'sem_escala';
      else if (marca && marca !== 'folga') estado = marca;
      else {
        let t = marca === 'folga' ? null : base;
        if (troca) t = troca;
        if (t && fer && !troca && !ferTrab && !(esc && esc.trabalhaFeriados)) { estado = 'feriado'; t = null; }
        if (t) turnos.push(t);
        for (const x of extras) turnos.push(x);
        if (!estado) estado = turnos.length ? 'trabalho' : 'folga';
      }
      dias[d - A] = {
        d: d, servico: servico, estado: estado, marca: marca, fer: fer, base: base,
        escala: esc ? esc.id : null, especial: esc ? esc.especial : null, turnos: turnos,
        feriadoTrabalhado: !!(fer && turnos.length),
      };
    }
    return dias;
  }

  /* ================================================== medição dos turnos */

  function instanciar(t, d, especial) {
    const ini = d * DIA + t.inicio;
    return {
      dia: d, turno: t.id, ini: ini, fim: ini + t.duracao, especial: especial || null,
      pausas: t.pausas.map((p) => ({ ini: ini + p.offset, fim: ini + p.offset + p.duracao, tipo: p.tipo })),
    };
  }
  function segmentosTrabalho(x) {
    const segs = [];
    let c = x.ini;
    for (const p of x.pausas) {
      if (p.tipo !== 'usufruido') continue;
      if (p.ini > c) segs.push([c, p.ini]);
      c = Math.max(c, p.fim);
    }
    if (x.fim > c) segs.push([c, x.fim]);
    return segs;
  }
  function sobrepor(a, b, c, d) { return Math.max(0, Math.min(b, d) - Math.max(a, c)); }
  function janelaNoturna(k, rural) {
    if (rural === 'lavoura') return [k * DIA + 1260, k * DIA + 1740];
    if (rural === 'pecuaria') return [k * DIA + 1200, k * DIA + 1680];
    return [k * DIA + 1320, k * DIA + 1740];
  }
  function minutosNoturnos(a, b, rural) {
    const i0 = rural === 'lavoura' ? 1260 : rural === 'pecuaria' ? 1200 : 1320;
    const i1 = rural === 'pecuaria' ? 1680 : 1740;
    let n = 0;
    const kf = Math.floor(b / DIA);
    for (let k = Math.floor(a / DIA) - 1; k <= kf; k++) {
      const ws = k * DIA + i0, we = k * DIA + i1;
      const x = (b < we ? b : we) - (a > ws ? a : ws);
      if (x > 0) n += x;
    }
    return n;
  }

  /**
   * Mede um turno: minutos de relógio, unidades computadas (1/7 min) e minutos noturnos,
   * por dia civil. Hora reduzida das 22h às 5h (art. 73, § 1º); prorrogação de jornada
   * integralmente noturna (Súmula 60, II; art. 73, § 5º) conforme configuração; na 12x36,
   * prorrogação compensada (art. 59-A, parágrafo único). Rural: sem hora reduzida (Lei 5.889/1973).
   */
  function medir(x, ctx) {
    const rural = ctx.rural;
    let prorrog = null;
    for (let k = Math.floor(x.ini / DIA) - 1; k <= Math.floor(x.fim / DIA); k++) {
      const ws = k * DIA + 1320, we = k * DIA + 1740;
      if (x.ini <= ws && x.fim >= we) { if (x.fim > we) prorrog = [we, x.fim]; break; }
    }
    const reduz = !rural && !!prorrog && ctx.cfg.prorrogacaoReduzida && x.especial !== '12x36';
    const adic = !!prorrog && x.especial !== '12x36';
    const segs = segmentosTrabalho(x);
    const porDia = [];
    let rel = 0, comp = 0, noct = 0, noctUrb = 0;
    for (const s of segs) {
      let a = s[0];
      while (a < s[1]) {
        const b = Math.min(s[1], (Math.floor(a / DIA) + 1) * DIA);
        const r = b - a;
        const nUrb = minutosNoturnos(a, b, null);
        const n = rural ? minutosNoturnos(a, b, rural) : nUrb;
        const p = prorrog ? sobrepor(a, b, prorrog[0], prorrog[1]) : 0;
        const red = rural ? 0 : nUrb + (reduz ? p : 0);
        const c = U * r + red;
        const na = n + (adic && !rural ? p : 0);
        const dia = Math.floor(a / DIA);
        let q = porDia.length ? porDia[porDia.length - 1] : null;
        if (!q || q.dia !== dia) { q = { dia: dia, rel: 0, comp: 0, noct: 0 }; porDia.push(q); }
        q.rel += r; q.comp += c; q.noct += na;
        rel += r; comp += c; noct += na; noctUrb += nUrb;
        a = b;
      }
    }
    x.segmentos = segs; x.porDia = porDia; x.rel = rel; x.comp = comp; x.noct = noct; x.noctUrb = noctUrb;
    x.prorrogacao = prorrog ? prorrog[1] - prorrog[0] : 0;
    return x;
  }

  /* ============================================================ repousos */

  /**
   * Fórmula padrão (seção 4.4): para cada intervalo livre G entre o fim de um turno e o início
   * do seguinte, com k folgas programadas entre os dias de início, r = min(k, ⌊(G − 11 h) ÷ 24 h⌋)
   * se G ≥ 35 h (Súmula 110 do TST). Os r repousos vão às folgas em ordem cronológica.
   * Também calcula o método de blocos (versão anterior).
   */
  function calcularRepousos(insts, folga, janela) {
    const rep = new Set(), semRep = [], blocos = new Set(), intervalos = [];
    // Antes do primeiro turno e depois do último não há jornada que limite o descanso: as folgas programadas contam como repouso.
    if (janela) {
      const prim = insts.length ? insts[0].dia : janela.b + 1;
      for (let x = janela.a; x < prim; x++) if (folga(x)) rep.add(x);
      if (insts.length) for (let x = insts[insts.length - 1].dia + 1; x <= janela.b; x++) if (folga(x)) rep.add(x);
    }
    for (let i = 0; i + 1 < insts.length; i++) {
      const s1 = insts[i], s2 = insts[i + 1];
      const G = s2.ini - s1.fim;
      const fol = [];
      for (let x = s1.dia + 1; x < s2.dia; x++) if (folga(x)) fol.push(x);
      const k = fol.length;
      const r = G >= 35 * 60 ? Math.min(k, Math.floor((G - 660) / 1440)) : 0;
      for (let j = 0; j < r; j++) rep.add(fol[j]);
      for (let j = r; j < k; j++) semRep.push({ dia: fol[j], G: G });
      if (G >= 35 * 60) {
        const nb = Math.floor((G - 660) / 1440);
        for (let j = 0; j < nb; j++) blocos.add(Math.floor((s1.fim + 660 + j * 1440) / DIA));
      }
      intervalos.push({ de: s1, ate: s2, G: G, k: k, r: r });
    }
    return { rep: rep, semRep: semRep, blocos: blocos, intervalos: intervalos };
  }

  /* ======================================================= instrumentos */

  function situacaoInstrumento(i, d, D) {
    if (d < i.vigenciaInicio || (i.vigenciaFim != null && d > i.vigenciaFim)) return null;
    // Regime que a Constituição ou a lei reservam à negociação coletiva (média de repousos do § 2º, ampliação do art. 7º,
    // turno ininterrupto de até 8 h, banco anual etc.) não produz efeito quando cadastrado como acordo individual.
    const meta = TIPOS_INSTRUMENTO[i.tipo];
    if (meta && meta.natureza === 'coletivo' && i.natureza !== 'coletivo') {
      return { ok: false, nota: 'cadastrado como ' + (i.natureza || 'acordo individual') + ', mas o regime depende de convenção ou acordo coletivo (' + meta.base + ')' };
    }
    if (i.natureza === 'coletivo' && d >= D.art3) {
      if (i.compativel === false) return { ok: false, nota: 'cláusula sem efeito desde ' + fmtData(D.art3) + ' (Emenda Constitucional 141/2026 – Fim da 6x1, art. 3º)' };
      if (d >= D.teto40 && i.compativel40 === false) return { ok: false, nota: 'cláusula incompatível com o teto de 40 h' };
      if (i.celebracao != null && i.celebracao < D.publicacao && i.compativel !== true) {
        return { ok: false, nota: 'instrumento anterior à Emenda Constitucional 141/2026 (Fim da 6x1) sem verificação de compatibilidade (art. 3º)' };
      }
    }
    return { ok: true, nota: null };
  }
  function abrange(i, emp) {
    const a = i.abrangencia;
    return a.todos || a.empregados.indexOf(emp.id) >= 0 || (emp.setor && a.setores.indexOf(emp.setor) >= 0);
  }
  function buscarInstrumento(ctx, emp, tipos, d, filtro) {
    let melhor = null;
    for (const i of ctx.dados.instrumentos) {
      if (tipos.indexOf(i.tipo) < 0 || !abrange(i, emp)) continue;
      if (filtro && !filtro(i)) continue;
      const s = situacaoInstrumento(i, d, ctx.D);
      if (!s) continue;
      if (s.ok) return { instr: i, ok: true, nota: null };
      if (!melhor) melhor = { instr: i, ok: false, nota: s.nota };
    }
    return melhor;
  }
  function textoInstrumento(tipos) {
    return tipos.map((t) => TIPOS_INSTRUMENTO[t].nome.toLowerCase() + ' (' + TIPOS_INSTRUMENTO[t].base + ')').join(' ou ');
  }

  /* ================================================== status e achados */

  function peso(a) {
    switch (a.status) {
      case 'nao_cumpre': return 5;
      case 'condicao': return a.atendida ? 3 : 4;
      case 'cumpre': return 2;
      case 'info': return 1;
      default: return 0;
    }
  }
  function pior(lista) {
    let p = null;
    for (const a of lista) if (!p || peso(a) > peso(p)) p = a;
    return p;
  }
  function condicao(tipos, ctx, emp, d) {
    const b = buscarInstrumento(ctx, emp, tipos, d);
    return {
      status: 'condicao', instrumento: tipos[0], exige: textoInstrumento(tipos), atendida: !!(b && b.ok),
      nota: b ? (b.ok ? 'cadastrado: ' + b.instr.nome : b.nota) : 'não cadastrado',
    };
  }

  /* ========================================================= tetos */

  function criarTetos(emp, ctx) {
    const cfg = ctx.cfg, D = ctx.D, si = ctx.si;
    const contrato = emp.contratoPublico;
    const apl9 = contrato ? (contrato.aditamento != null ? contrato.aditamento : D.art9) : null;
    function teto(d) {
      if (cfg.cenario === '42') return 42;
      if (cfg.cenario === '40') return 40;
      if (contrato && d < apl9) return 44;
      return d < D.teto42 ? 44 : d < D.teto40 ? 42 : 40;
    }
    function xv(d) {
      if (d < D.xv) return false;
      if (contrato && cfg.art9 === 'diferido' && d < apl9) return false;
      return true;
    }
    function tetoEf(d) {
      if (cfg.transicao !== 'semana') return teto(d);
      const w = inicioSemana(d, si);
      let m = 99;
      for (let k = 0; k < 7; k++) m = Math.min(m, teto(w + k));
      return m;
    }
    /** Limite diário (unidades) para compensação: teto ÷ 7; sem norma do art. 7º nem regime do § 2º, e na leitura padrão de J1, limitado a 40 h ÷ 7 quando já vigoram dois repousos. */
    function baseDia(d, comNorma) {
      const t = tetoEf(d);
      if (comNorma || cfg.leitura8h24 === 'individual' || !xv(d)) return t * 60;
      return Math.min(t, 40) * 60;
    }
    return { teto: teto, xv: xv, tetoEf: tetoEf, baseDia: baseDia, apl9: apl9 };
  }

  /* ========================================================= art. 8º */

  function remuneracaoEm(emp, d) {
    let v = null;
    for (const r of emp.remuneracoes) if (r.desde <= d) v = r.valor;
    return v;
  }
  function art8(emp, d, ctx) {
    const ano = civil(d).a;
    if (!emp.nivelSuperior) return { enquadrado: false, motivo: 'sem diploma de nível superior' };
    if (emp.empregadoPublico) return { enquadrado: false, motivo: 'empregado público (art. 8º, § 1º)' };
    const rem = remuneracaoEm(emp, d);
    if (rem == null) return { enquadrado: false, motivo: 'remuneração não informada' };
    const teto = ctx.dados.tetoRGPS[ano];
    if (teto == null) return { enquadrado: false, motivo: 'teto do RGPS de ' + ano + ' não informado' };
    if (2 * rem < 5 * teto) return { enquadrado: false, motivo: 'remuneração de ' + fmtReais(rem) + ' abaixo de 2,5 × ' + fmtReais(teto) };
    if (emp.controleMantido) return { enquadrado: false, motivo: 'controle mantido por liberalidade ou norma coletiva (art. 8º, caput, parte final)' };
    return { enquadrado: true, motivo: 'diploma de nível superior e remuneração de ' + fmtReais(rem) + ' ≥ 2,5 × ' + fmtReais(teto) };
  }

  /* ===================================================== média do ciclo 12x36 */

  function mediaCiclo(escId, ctx) {
    const chave = escId + '|' + ctx.cfg.medida + '|' + ctx.cfg.prorrogacaoReduzida;
    if (ctx.cacheCiclo.has(chave)) return ctx.cacheCiclo.get(chave);
    const esc = ctx.escalas.get(escId);
    let tot = 0;
    esc.dias.forEach((tid, i) => {
      if (!tid) return;
      const x = medir(instanciar(ctx.turnos.get(tid), 100000 + i, esc.especial), ctx);
      tot += ctx.cfg.medida === 'relogio' ? x.rel * U : x.comp;
    });
    const r = { totalCiclo: tot, n: esc.dias.length };
    ctx.cacheCiclo.set(chave, r);
    return r;
  }

  /* ================================================ avaliação do empregado */

  function avaliarEmpregado(emp, ctx) {
    const cfg = ctx.cfg, D = ctx.D, si = ctx.si;
    const A = ctx.janela.a, N = ctx.janela.b - A + 1;
    const dias = expandir(emp, ctx);
    const reg = (d) => dias[d - A];
    const T0 = criarTetos(emp, ctx);
    // tetos e vigência do inciso XV pré-calculados por dia da janela
    const aTeto = new Int8Array(N), aTetoEf = new Int8Array(N), aXv = new Int8Array(N);
    for (let i = 0; i < N; i++) { aTeto[i] = T0.teto(A + i); aXv[i] = T0.xv(A + i) ? 1 : 0; }
    for (let i = 0; i < N; i++) {
      if (cfg.transicao !== 'semana') { aTetoEf[i] = aTeto[i]; continue; }
      const w = inicioSemana(A + i, si) - A;
      let m = 99;
      for (let k = 0; k < 7; k++) { const j = w + k; m = Math.min(m, j >= 0 && j < N ? aTeto[j] : T0.teto(A + j)); }
      aTetoEf[i] = m;
    }
    const T = {
      teto: (d) => { const i = d - A; return i >= 0 && i < N ? aTeto[i] : T0.teto(d); },
      xv: (d) => { const i = d - A; return i >= 0 && i < N ? aXv[i] === 1 : T0.xv(d); },
      tetoEf: (d) => { const i = d - A; return i >= 0 && i < N ? aTetoEf[i] : T0.tetoEf(d); },
      baseDia: (d, comNorma) => {
        const i = d - A;
        if (i < 0 || i >= N) return T0.baseDia(d, comNorma);
        const t = aTetoEf[i];
        if (comNorma || cfg.leitura8h24 === 'individual' || aXv[i] !== 1) return t * 60;
        return Math.min(t, 40) * 60;
      },
    };
    const medidaRel = cfg.medida === 'relogio';
    const art62 = emp.tipo === 'art62';

    const insts = [];
    for (const r of dias) for (const tid of r.turnos) {
      const t = ctx.turnos.get(tid);
      if (t) insts.push(medir(instanciar(t, r.d, r.especial), ctx));
    }
    insts.sort((p, q) => p.ini - q.ini || p.fim - q.fim);

    const rel = new Array(N).fill(0), comp = new Array(N).fill(0), noct = new Array(N).fill(0);
    const civ = new Array(N).fill(0), nIni = new Array(N).fill(0);
    for (const x of insts) {
      nIni[x.dia - A]++;
      for (const p of x.porDia) {
        const ic = p.dia - A;
        if (ic >= 0 && ic < N) civ[ic] += p.rel;
        const j = (cfg.turnoDia === 'civil' ? p.dia : x.dia) - A;
        if (j >= 0 && j < N) { rel[j] += p.rel; comp[j] += p.comp; noct[j] += p.noct; }
      }
    }
    const med = (i) => medidaRel ? rel[i] * U : comp[i];
    const medAlt = (i) => medidaRel ? comp[i] : rel[i] * U;

    const folga = (d) => { const r = reg(d); return !!r && r.estado === 'folga'; };
    const RP = calcularRepousos(insts, folga, ctx.janela);
    const repCal = new Set();
    for (const r of dias) if (r.estado === 'folga' && civ[r.d - A] === 0) repCal.add(r.d);

    const dependentes = new Set();
    if (cfg.sinalContrafactual) {
      const cf = insts.slice();
      let add = 0;
      for (const r of dias) {
        if (r.base && AUSENCIA_CONTRAFACTUAL.has(r.estado)) {
          const t = ctx.turnos.get(r.base);
          if (t) { cf.push(instanciar(t, r.d, r.especial)); add++; }
        }
      }
      if (add) {
        cf.sort((p, q) => p.ini - q.ini || p.fim - q.fim);
        const rcf = calcularRepousos(cf, folga, ctx.janela);
        for (const d of RP.rep) if (!rcf.rep.has(d)) dependentes.add(d);
      }
    }
    const semRep = new Set(RP.semRep.map((x) => x.dia));

    const trabalhou = (d) => {
      const i = d - A;
      if (i < 0 || i >= N) return false;
      return cfg.turnoDia === 'civil' ? civ[i] > 0 : nIni[i] > 0;
    };
    const emServico = (r) => !FORA_DE_SERVICO.has(r.estado);
    const art8Cache = new Map();
    const art8Dia = (d) => {
      const c = civil(d), k = c.a * 12 + c.m;
      if (!art8Cache.has(k)) art8Cache.set(k, art8(emp, diaDe(c.a, c.m, 1), ctx));
      return art8Cache.get(k);
    };
    const dispCache = new Int8Array(N);
    const dispensado = (d) => {
      if (art62) return true;
      const i = d - A;
      if (i < 0 || i >= N) return art8Dia(d).enquadrado;
      if (!dispCache[i]) dispCache[i] = art8Dia(d).enquadrado ? 1 : 2;
      return dispCache[i] === 1;
    };

    const achados = [];
    const push = (a) => { achados.push(a); return a; };

    /* ---------- sequências de dias trabalhados (R3) */
    const corridas = [];
    {
      let ini = null;
      for (let d = A; d <= ctx.janela.b + 1; d++) {
        if (d <= ctx.janela.b && trabalhou(d)) { if (ini == null) ini = d; }
        else if (ini != null) { corridas.push({ ini: ini, fim: d - 1, n: d - ini }); ini = null; }
      }
    }

    /* ---------- semanas */
    const semanas = [];
