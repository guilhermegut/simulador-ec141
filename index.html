      defs.push(Object.assign({}, comum, {
        id: '12x36-usufruido', nome: '12x36 com intervalo usufruído',
        resumo: 'Dois empregados por posto, em dias alternados, com 1 h de intervalo usufruído: média de ' + fh(Math.round((dur.presenca - 60) * 3.5)) + ' semanais.',
        jornada: hm(dur.ini) + ' às ' + fimP + ', 1 h de intervalo', grupos: [{ modo: 'ciclo', turnos: [tUsu], ciclo: [1, 0], especial: '12x36', deslocamentos: desl, pessoas: ps }],
        horasSemana: horas(dur.presenca - 60, N),
        ponderacoes: [textoFerias(rf), 'Durante o intervalo o posto precisa de rendição (outra pessoa ou intervalos escalonados).', ponderNoite, 'Feriados trabalhados na 12x36 são considerados compensados (CLT, art. 59-A, parágrafo único).'],
      }));
      defs.push(Object.assign({}, comum, {
        id: '12x36-transicao', nome: '12x36 com intervalo indenizado até dez/2027',
        resumo: 'Mantém o intervalo indenizado (média de 42 h) na etapa de 42 h e passa ao intervalo usufruído a partir de 13/12/2027.',
        jornada: hm(dur.ini) + ' às ' + fimP, grupos: [{ modo: 'ciclo', turnos: [tInd, tUsu], periodos: [{ turno: 'T12', inicio: JANELA1.inicio }, { turno: 'T11', inicio: iso(SEMANA_40) }], ciclo: [1, 0], especial: '12x36', deslocamentos: desl, pessoas: ps }],
        horasSemana: horas(dur.presenca, N),
        ponderacoes: [textoFerias(rf), 'Na etapa de 40 h, a média de 42 h da 12x36 com intervalo indenizado ultrapassa o teto.', 'A mudança exige organizar a rendição durante o intervalo a partir de dezembro de 2027.', ponderNoite],
      }));
      defs.push(Object.assign({}, comum, {
        id: '12x36-indenizado', nome: '12x36 com intervalo indenizado',
        resumo: 'Mantém o plantão de 12 h corridas, com intervalo indenizado: média de 42 h semanais.',
        jornada: hm(dur.ini) + ' às ' + fimP, grupos: [{ modo: 'ciclo', turnos: [tInd], ciclo: [1, 0], especial: '12x36', deslocamentos: desl, pessoas: ps }],
        horasSemana: horas(dur.presenca, N),
        ponderacoes: [textoFerias(rf), 'Cabe na etapa de 42 h, mas ultrapassa o teto de 40 h a partir de 16/12/2027.', ponderNoite],
      }));
      {
        const op5 = { pref: ctx.pref, prefP: ctx.prefP, w: 5, k: 0, P: 0, domingoComercio: ctx.domingo, rodizio: true };
        const rf5 = comFerias(ctx, dem, comporMinimo(dem, op5), op5);
        if (rf5.eq) defs.push(defEscalonado(Object.assign({}, ctx, { parciaisAtuais: [] }), rf5.eq, rf5));
      }
      // Rearranjo do funcionamento: o plantão encolhe para até 8 h por dia, em 5x2, sem 12x36 e sem norma coletiva
      if (ctx.funcionamento !== 'fixo') {
        const e8 = limitarDia(ctx, 480);
        const op5 = { pref: ctx.pref, prefP: ctx.prefP, w: 5, k: 0, P: 0, domingoComercio: ctx.domingo, rodizio: true };
        const rfE = comFerias(ctx, dem, comporMinimo(dem, op5), op5);
        if (rfE.eq) {
          const h8 = infoHorario(ctx, e8, null);
          const ctxI = Object.assign({}, ctx, { parciaisAtuais: [] });
          defs.push({
            id: '5x2-encurtado', nome: '5x2 de ' + fh(e8[ops[0]].trab) + ', encurtando o plantão', rearranjo: true,
            resumo: 'Em vez da 12x36, o posto funciona em horário menor, com 5x2 de até 8 h e dois repousos por semana. Não depende de norma coletiva.',
            jornada: textoHorarioCenario(ctx, e8), grupos: gruposSemanais(ctxI, rfE.eq, horarioCenario('T', e8, null)), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario),
            horasSemana: horasDe(rfE.eq, e8), reservaFerias: rfE.r, horario: h8,
            ponderacoes: ['Rearranjo do funcionamento: o posto fica descoberto fora do novo horário (hoje ' + h8.atual + '; passa a ' + h8.e1 + ').',
              !ctx.funcionamento ? 'Confirme no passo 1 se o funcionamento deste turno pode mudar.' : null, textoFerias(rfE), descreverFolgas(rfE.eq)],
            semanasGrade: semanasGrade(rfE.eq), cicloSemanas: rfE.eq.rodizioI ? rfE.eq.folgasI.length : null,
          });
        }
      }
      if (Ia > 0 && Ia < N) {
        const pa = nomesPessoas(Ia, ctx.integraisAtuais, 'Nova contratação', false);
        defs.push(Object.assign({}, comum, {
          id: 'sem-contratar', nome: '12x36 com o quadro atual, sem contratar', reservaFerias: 0, semFerias: ctx.ferias && !capacidadeOk(ctx, Ia * 3.5),
          resumo: 'As mesmas ' + Ia + ' pessoas em 12x36' + (Ia >= 2 * R ? ': cobrem os postos nas semanas normais, mas não as férias.' : ': cobrem menos postos do que a necessidade informada.'),
          jornada: hm(dur.ini) + ' às ' + fimP, grupos: [{ modo: 'ciclo', turnos: [tUsu], ciclo: [1, 0], especial: '12x36', deslocamentos: pa.map((_, j) => j % 2), pessoas: pa }],
          horasSemana: horas(dur.presenca - 60, Ia), ponderacoes: [],
        }));
      }
    }

    const base = equipeHoje(ctx);
    if (ctx.longo) {
      descartar('4x3', '4x3', 'O plantão de hoje, de cerca de 12 h, passa do limite de 10 h por dia da compensação semanal.');
      descartar('6x2', '6x2', 'Seis plantões de cerca de 12 h passariam muito de 40 h na semana.');
    }
    const lista = defs.map((d) => avaliarCenario(ctx, d));
    lista.sort((a, b) => a.nota - b.nota);
    // Quando o funcionamento não precisa ser mantido, o melhor cenário que cumpre sem contratar fica entre as sugestões;
    // se o usuário disse que o horário pode mudar, ele vem primeiro (decisão D48).
    if (ctx.funcionamento !== 'fixo') {
      const semContratar = (c) => !c.contratarIntegrais && !c.contratarParciais && ['cumpre', 'condicao', 'rearranjo'].indexOf(c.situacao.codigo) >= 0;
      const melhor = lista.find(semContratar);
      if (melhor) {
        const pos = lista.indexOf(melhor), alvo = ctx.funcionamento === 'flexivel' ? 0 : 2;
        if (pos > alvo) { lista.splice(pos, 1); lista.splice(alvo, 0, melhor); }
      }
    }
    lista.forEach((c, i) => { c.ordem = i + 1; c.sugerido = i < 3; });
    return {
      lista: lista, descartes: fora, quadro: Object.assign(quadro, { feriasModo: ctx.feriasModo, feriasHoje: ctx.feriasHoje, exigeFerias: ctx.exigeFerias }), demanda: dem, duracao: dur, longo: ctx.longo, ferias: ctx.ferias,
      base: base, operacao: ops, semContratar: lista.some((c) => !c.contratarIntegrais && !c.contratarParciais && ['cumpre', 'condicao', 'rearranjo'].indexOf(c.situacao.codigo) >= 0),
      horarioAtual: textoJanela(ctx.atual, ctx.operacao, true), funcionamento: ctx.funcionamento, uniforme: ctx.uniforme,
      mudaHorario: lista.some((c) => c.mudaHorario),
    };
  }

  /**
   * Cenário montado pelo usuário.
   * op: { escala '5x2'|'4x3'|'12x36', integrais, parciais, diasParcial, folgas 'rodizio'|'fixas'|'escolher',
   *       dias: [{ parcial, folgas: [0..6] }] (com 'escolher'), rodiziar (com 'escolher'),
   *       horario: { e1: [7 × {inicio, fim, intervalo} | null], e2: idem ou null } (horário escolhido por dia, por etapa) }
   */
  function personalizado(turno, empresa, opcoes, op) {
    const ctx = contexto(turno, empresa, opcoes);
    if (ctx.erro) return { erro: ctx.erro };
    const dur = ctx.dur, dem = ctx.dem, ops = ctx.operacao;
    if (op.escala === '12x36') {
      const I = Math.max(0, Math.floor(op.integrais || 0));
      if (!I) return { erro: 'Informe ao menos uma pessoa.' };
      const iv = dur.intervalo || 60;
      const t = turnoMotor('T12', dur.ini, dur.presenca - iv, iv, ctx.indenizado ? 'indenizado' : 'usufruido');
      const ps = nomesPessoas(I, ctx.integraisAtuais, 'Nova contratação', false);
      return avaliarCenario(ctx, {
        id: 'personalizado', personalizado: true, nome: 'Meu cenário: 12x36', resumo: pl(I, 'pessoa', 'pessoas') + ' em 12x36, intervalo ' + (ctx.indenizado ? 'indenizado' : 'usufruído') + '.', jornada: hm(dur.ini) + ' às ' + t.fim,
        grupos: [{ modo: 'ciclo', turnos: [t], ciclo: [1, 0], especial: '12x36', deslocamentos: ps.map((_, j) => j % 2), pessoas: ps }],
        instrumentos: instrumentos(['12x36'], ctx.neg, { intervalo: iv }), negociar: ['x12'],
        horasSemana: Math.round((ctx.indenizado ? dur.presenca : dur.presenca - iv) * 3.5) * I, semanasGrade: 2,
        horario: { muda: false, atual: textoJanela(ctx.atual, ops), e1: textoJanela(ctx.atual, ops), e2: null },
        ponderacoes: [textoComporta(ctx, I * 3.5)],
      });
    }
    const w = op.escala === '4x3' ? 4 : 5;
    let e1, e2 = null;
    if (op.horario && Array.isArray(op.horario.e1)) {
      e1 = especsDe(op.horario.e1);
      if (e1.erro) return { erro: e1.erro };
      if (op.horario.e2) { e2 = especsDe(op.horario.e2); if (e2.erro) return { erro: e2.erro }; }
      if (!e1.some(Boolean)) return { erro: 'Informe o horário de ao menos um dia.' };
    } else if (w === 4) {
      const cabe = ops.every((d) => ctx.atual[d].trab <= 600);
      e1 = ctx.semana.map((s) => s && (cabe && s.trabalho > 480 ? { ini: s.ini, trab: s.trabalho, intervalo: s.intervalo } : { ini: s.ini, trab: 600, intervalo: s.intervalo || 60 }));
    } else e1 = limitarDia(ctx, 480);
    const hc = horarioCenario('T', e1, e2);
    const diasHor = [0, 1, 2, 3, 4, 5, 6].filter((d) => e1[d]);
    const pond = [];
    let eq;
    if (op.folgas === 'escolher' && Array.isArray(op.dias) && op.dias.length) {
      const di = op.dias.filter((x) => !x.parcial).map((x) => normalizarFolgas(x.folgas) || []);
      const dp = op.dias.filter((x) => x.parcial).map((x) => normalizarFolgas(x.folgas) || []);
      let folgasI = di, rodI = false;
      if (op.rodiziar && new Set(di.map((f) => f.join())).size > 1) {
        const r = ordenarRodizio(di, ctx.domingo);
        if (r) { folgasI = r; rodI = true; pond.push('Os padrões escolhidos giram entre as pessoas a cada semana; o ciclo se repete a cada ' + di.length + ' semanas.'); }
        else pond.push('Não foi possível girar os padrões escolhidos sem passar de 6 dias seguidos' + (ctx.domingo ? ' ou sem folga num domingo a cada ' + (ctx.domingo === 2 ? 'duas' : 'três') + ' semanas' : '') + '; as folgas ficaram fixas por pessoa.');
      } else pond.push('Folgas escolhidas por você, fixas por pessoa.');
      if (di.some((f) => f.length !== 7 - w)) pond.push('Há integral com número de folgas diferente de ' + (7 - w) + ' por semana: a jornada semanal muda junto.');
      eq = { I: di.length, P: dp.length, w: w, k: 0, folgasI: folgasI, folgasP: dp, rodizioI: rodI, rodizioP: false, cobertura: cobrir(folgasI.concat(dp)) };
    } else {
      const I = Math.max(0, Math.floor(op.integrais || 0)), Pn = Math.max(0, Math.floor(op.parciais || 0));
      if (I + Pn === 0) return { erro: 'Informe ao menos uma pessoa.' };
      const kMax = Math.max(1, kParcialSemana(e1, diasHor));
      const k = Math.max(1, Math.min(kMax, Math.floor(op.diasParcial || kMax)));
      eq = compor(dem, { pref: ctx.pref, prefP: ctx.prefP, w: w, k: k, P: Pn, I: I, domingoComercio: ctx.domingo, rodizio: op.folgas !== 'fixas', forcar: true });
      if (!eq) return { erro: 'Não foi possível distribuir as folgas com essa composição.' };
      pond.push(descreverFolgas(eq), Pn ? 'Dias dos parciais: ' + diasParciais(eq) + '.' : null);
    }
    if (!eq.I && !eq.P) return { erro: 'Informe ao menos uma pessoa.' };
    const capacidade = eq.cobertura.reduce((s, x) => s + x, 0);
    pond.push(textoComporta(ctx, capacidade));
    const h = infoHorario(ctx, e1, e2);
    pond.unshift(textoMudanca(h));
    const ivs = diasHor.map((d) => e1[d].intervalo);
    // Dias acima de 8 h: na semana de até 40 h, acordo de compensação; acima de 40 h (etapa de 42 h), norma coletiva do art. 7º
    // pela leitura adotada, sem a qual o excedente é hora extra. O acordo só vale a partir da etapa em que é necessário.
    const semanaMax = (esp) => Math.max.apply(null, eq.folgasI.concat(eq.folgasP).map((f) => [0, 1, 2, 3, 4, 5, 6].reduce((s, d) => s + (f.indexOf(d) < 0 && esp[d] ? esp[d].trab : 0), 0)));
    const acima8 = (esp) => esp.some((x) => x && x.trab > 480);
    const lista = [], negociarMeu = [];
    let compDesde = null;
    const ate824 = (esp) => esp.every((x) => !x || x.trab <= 504);
    if (acima8(e1) && semanaMax(e1) > 2400 && !(ctx.liminar && ate824(e1))) { lista.push('art7'); negociarMeu.push('art7'); }
    else if (acima8(e1)) compDesde = JANELA1.inicio;
    const e2v = e2 || e1;
    if (!compDesde && acima8(e2v) && semanaMax(e2v) <= 2400) compDesde = iso(SEMANA_40);
    const inst = instrumentos(lista, ctx.neg, { intervaloMin: Math.min.apply(null, ivs), intervaloMax: Math.max.apply(null, ivs) });
    if (compDesde) {
      inst.push({ id: M.TIPOS_INSTRUMENTO.compensacao_mensal.nome, tipo: 'compensacao_mensal', natureza: 'individual', vigenciaInicio: compDesde });
      pond.push('Dias acima de 8 h em semana de até 40 h: basta acordo individual escrito, porque as horas se compensam dentro da mesma semana. Se alguma semana ficar com menos de dois repousos, o arranjo passa a depender da média mensal, só por norma coletiva.');
    }
    return avaliarCenario(ctx, {
      id: 'personalizado', personalizado: true, nome: 'Meu cenário: ' + (w === 4 ? '4x3' : '5x2') + (eq.P ? ' + ' + pl(eq.P, 'parcial', 'parciais') : ''),
      resumo: pl(eq.I, 'integral', 'integrais') + (eq.P ? ' e ' + pl(eq.P, 'parcial', 'parciais') : '') + '; folgas ' + (op.folgas === 'escolher' ? 'escolhidas' : eq.rodizioI ? 'em rodízio' : 'fixas') + (op.horario ? '; horário escolhido por dia' : '') + '.',
      jornada: textoHorarioCenario(ctx, e1, e2), grupos: gruposSemanais(ctx, eq, hc),
      instrumentos: inst, negociar: negociarMeu, acordos: compDesde ? [ACORDO_COMP] : [],
      horasSemana: horasDe(eq, e1), ponderacoes: pond, horario: h,
      semanasGrade: eq.rodizioI ? Math.min(Math.max(eq.folgasI.length, 3), 6) : 3, cicloSemanas: eq.rodizioI ? eq.folgasI.length : null,
    });
  }

  /** Folgas padrão para um cenário montado: a distribuição automática, fixa por pessoa, para o usuário editar. */
  function folgasPadrao(turno, empresa, opcoes, op) {
    const ctx = contexto(turno, empresa, opcoes);
    if (ctx.erro) return null;
    const w = op.escala === '4x3' ? 4 : 5;
    const e = limitarDia(ctx, w === 4 ? 600 : 480);
    const kMax = Math.max(1, kParcialSemana(e, ctx.operacao));
    const k = Math.max(1, Math.min(kMax, Math.floor(op.diasParcial || kMax)));
    const eq = compor(ctx.dem, { pref: ctx.pref, prefP: ctx.prefP, w: w, k: k, P: Math.max(0, op.parciais | 0), I: Math.max(0, op.integrais | 0), domingoComercio: ctx.domingo, rodizio: false, forcar: true });
    if (!eq) return null;
    return eq.folgasI.map((f) => ({ parcial: false, folgas: f.slice() })).concat(eq.folgasP.map((f) => ({ parcial: true, folgas: f.slice() })));
  }

  /** Grupos da escala de hoje: horário de cada dia, folgas informadas e, para quem não as informou, folgas distribuídas conforme a necessidade. */
  function gruposHoje(ctx) {
    const dur = ctx.dur;
    const porEscala = new Map();
    for (const p of ctx.atuais) { const k = ESCALAS_ATUAIS[p.escala] ? p.escala : '6x1'; if (!porEscala.has(k)) porEscala.set(k, []); porEscala.get(k).push(p); }
    const grupos = [], rotulos = [];
    const hcAtual = horarioCenario('H', ctx.atual, null);
    let informadas = 0;
    for (const [k, ps] of porEscala) {
      const e = ESCALAS_ATUAIS[k];
      rotulos.push(ps.length + ' em ' + e.rotulo);
      const pess = ps.map((p) => Object.assign({ id: p.id, nome: p.nome || p.id, parcial: !!e.parcial || p.contrato === 'parcial' }, p.art386 ? { art386: true } : {}));
      if (e.padrao && ctx.padrao) {
        const turnos = new Map(), dias = [];
        for (const w of ctx.padrao.semanas) for (const c of w) {
          if (!c) { dias.push(null); continue; }
          const k = c.ini + '|' + c.trab + '|' + c.intervalo;
          if (!turnos.has(k)) turnos.set(k, turnoMotor('P' + turnos.size, c.ini, c.trab, c.intervalo));
          dias.push(turnos.get(k).id);
        }
        grupos.push({ modo: 'padrao', turnos: Array.from(turnos.values()), dias: dias, revezar: ctx.padrao.revezar, pessoas: pess });
        continue;
      }
      if (e.ciclo) {
        const t = turnoMotor('T', dur.ini, dur.trabalho, dur.intervalo, e.especial && ctx.indenizado ? 'indenizado' : 'usufruido');
        grupos.push({ modo: 'ciclo', turnos: [t], ciclo: e.ciclo, especial: e.especial || null, deslocamentos: pess.map((_, j) => (e.especial ? j % 2 : Math.floor(j * e.ciclo.length / pess.length))), pessoas: pess });
      } else {
        const escolhidas = ps.map((p) => normalizarFolgas(p.folgas));
        informadas += escolhidas.filter(Boolean).length;
        const auto = escolhidas.filter((f) => !f).length;
        const off = 7 - e.dias;
        let padroes = [];
        if (auto) {
          // quem tem folgas informadas já cobre parte de cada dia; as folgas dos demais seguem a necessidade que sobra (D89)
          const resto = ctx.dem.slice();
          for (const f of escolhidas) if (f) for (let d = 0; d < 7; d++) if (f.indexOf(d) < 0 && ctx.dem[d] > 0) resto[d] = Math.max(0, resto[d] - 1);
          const c = [0, 0, 0, 0, 0, 0, 0];
          for (let q = 0; q < off * auto; q++) {
            let best = -1;
            for (const d of ctx.pref || PREF_FOLGA) if (c[d] < auto && (best < 0 || auto - resto[d] - c[d] > auto - resto[best] - c[best])) best = d;
            c[best]++;
          }
          padroes = agrupar(c, off, ctx.pref) || Array.from({ length: auto }, () => [6]);
        }
        let q = 0;
        grupos.push({ modo: 'fixo', turnos: hcAtual.turnos, periodos: hcAtual.periodos, folgas: escolhidas.map((f) => f || padroes[q++]), pessoas: pess });
      }
    }
    const extras = Object.fromEntries(ctx.atuais.map((p) => [p.id, { nome: p.nome || p.id, contrato: p.contrato === 'parcial' || p.escala === 'parcial' ? 'parcial' : 'integral' }]));
    return { grupos: grupos, rotulos: rotulos, informadas: informadas, extras: extras, op: { insalubre: ctx.insalubre, revezamento: ctx.revezamento, atividade: ctx.atividade, instrumentos: instrumentos(['12x36', 'par2'], ctx.neg, ctx.turnoUsuario), liminar: ctx.liminar } };   // par2: hipótese de norma coletiva com média de repousos, quando o usuário a liga (D79)
  }
  /**
   * Calendário de um período (por exemplo, o ano de 2027) para os grupos de um cenário ou da escala de hoje, avaliados no
   * motor de uma vez. Devolve, por dia, quem trabalha ([id, entrada, saída, minutos de intervalo], em minutos desde a
   * meia-noite do dia) e quem está em repouso, e a lista de achados que não cumprem ('n') ou dependem de norma ainda
   * não firmada ('p'), com o período de cada um. Feriados tratados como dias normais, como nos cenários.
   */
  function calendario(grupos, op, inicio, fim) {
    const r = avaliarM(montarEntrada(grupos, { inicio: inicio, fim: fim }, op || {}), op);
    const z0 = M.lerData(inicio), z1 = M.lerData(fim), n = z1 - z0 + 1;
    const dias = Array.from({ length: n }, () => ({ t: [], r: [] }));
    const achados = [];
    for (const e of r.empregados) {
      const pelaMedia = semanaPelaMedia(e);   // como em resumir (D79)
      for (const t of e.turnos) {
        const i = t.dia - z0;
        if (i < 0 || i >= n) continue;
        const z = t.dia * 1440;
        const pz = (t.pausas || []).filter((q) => q.tipo !== 'indenizado');
        dias[i].t.push([e.id, t.ini - z, t.fim - z, pz.reduce((x, q) => x + q.fim - q.ini, 0), pz.map((q) => [q.ini - z, q.fim - z])]);
      }
      for (const x of e.dias) { const i = x.d - z0; if (i >= 0 && i < n && x.repouso) dias[i].r.push(e.id); }
      for (const a of e.achados) {
        const st = a.status === 'nao_cumpre' ? 'n' : a.status === 'condicao' && !a.atendida ? 'p' : null;
        if (!st || !a.periodo || (a.regra === 'R2' && !a.instrumento)) continue;
        if (pelaMedia(a)) continue;
        const lo = Math.max(a.periodo.ini, z0), hi = Math.min(a.periodo.fim, z1);
        if (hi < lo) continue;
        achados.push([a.regra, e.id, st, a.porque || '', lo - z0, hi - z0]);
      }
    }
    return { inicio: z0, dias: dias, achados: achados, erros: r.erros.map((x) => x.onde + ': ' + x.msg) };
  }

      hoje: k.hoje ? { folha: k.hoje.total, beneficios: beneficios(base), total: k.hoje.total + beneficios(base) } : null,
      e1: k.e1 ? { folha: k.e1.total, beneficios: beneficios(c.eco.e1), total: k.e1.total + beneficios(c.eco.e1) } : null,
      e2: k.e2 ? { folha: k.e2.total, beneficios: beneficios(c.eco.e2), total: k.e2.total + beneficios(c.eco.e2) } : null,
      contratacoes: contr, unico: contr * num(p.contratacao, 0),
      perdaHoras: k.horas.perda, perdaValor: valorHora != null && k.horas.perda > 0 ? k.horas.perda / 60 * SEM * valorHora : null,
      horasExtras: null,
    };
    return r;
  }

  /**
   * Exposição estimada de manter a escala de hoje depois de 16/12/2027 (decisão D52, a validar): cada repouso semanal
   * que falta para chegar a dois é dia de repouso trabalhado, pago em dobro (Súmula 146 do TST, por analogia); as horas
   * dos demais dias acima de 40 h são extras, com o adicional informado e reflexo nos repousos. Não inclui multas
   * administrativas, dano moral coletivo nem custos de processo.
   */
  function manterComoEsta(base, params, teto) {
    if (!base) return null;
    const p = params || {};
    const sal = num(p.salario, 0) > 0 ? num(p.salario, 0) : null;
    const enc = num(p.encargos, 0) / 100, pHE = num(p.he, 50) / 100;
    const lim = teto || 2400;
    let repousos = 0, extras = 0, valor = 0;
    for (const x of base.pessoas) {
      if (!(x.dias > 0)) continue;
      const falta = Math.max(0, 2 - (7 - x.dias));
      const normal = x.comp * (x.dias - falta) / x.dias;
      const he = Math.max(0, normal - lim);
      repousos += falta * SEM; extras += he / 60 * SEM;
      if (sal) {
        const s = x.parcial ? sal * x.comp / 2640 : sal;
        const hora = s / (lim / 60 * 5);
        const reflexo = (7 - x.dias) / x.dias;
        valor += falta * SEM * 2 * s / 30 + he / 60 * SEM * hora * (1 + pHE) * (1 + reflexo);
      }
    }
    return { repousosMes: repousos, horasExtrasMes: extras, total: sal ? valor * (1 + enc) : null };
  }

  /* ================================================================ caminhos */

  const LEGAL = ['cumpre', 'condicao', 'rearranjo'];
  const TOL = 30;   // minutos por semana: abaixo disso, não há perda de produção
  /**
   * Até quatro caminhos comparáveis para um turno, a partir dos cenários do planejador:
   * A, sem contratar (pode mudar horário, dias ou o número de pessoas em alguns dias); B, sem contratar, mantendo o
   * horário com horas extras em revezamento; C, mantendo a operação (sem perda de produção), em geral contratando;
   * D, com negociação coletiva, quando ela traz resultado melhor que C. Caminhos iguais se fundem.
   */
  function caminhos(cen, params) {
    if (!cen || cen.erro) return [];
    const base = cen.base;
    const avaliados = cen.lista.map((c) => ({ c: c, x: custoCompleto(c, base, params) }));
    const custoDe = (a) => (a.x.e2 ? a.x.e2.total : null);
    const menor = (lista, chave) => lista.slice().sort((a, b) => { const d = chave(a) - chave(b); return Math.abs(d) > 1e-6 ? d : a.c.nota - b.c.nota; })[0] || null;
    const porCusto = (a) => (custoDe(a) != null ? custoDe(a) : a.c.nota * 1000);
    const legal = avaliados.filter((a) => LEGAL.indexOf(a.c.situacao.codigo) >= 0);
    const semContratar = legal.filter((a) => !a.x.contratacoes);
    const out = [];
    // A: sem contratar, a menor perda de produção
    // empate na perda: prefere manter os dias abertos (menos gente nos dias fracos) a deixar de abrir um dia
    const A = menor(semContratar, (a) => a.x.perdaHoras * 1e3 + (a.c.fecha && a.c.fecha.length ? 500 : 0) + porCusto(a) / 1e3);
    // C: sem perda de produção, o menor custo
    const semPerda = legal.filter((a) => a.x.perdaHoras <= TOL);
    const C = menor(semPerda, porCusto) || menor(legal.filter((a) => a.x.contratacoes), (a) => a.x.perdaHoras);
    // B: sem contratar, com horas extras que repõem toda a produção perdida
    let B = null;
    for (const a of semContratar) {
      const he = a.x.k.he;
      if (a.x.perdaHoras <= TOL || !he) continue;
      const cobre = (he.tipo === 'janela' && he.minutos > 0 && !he.inviaveis.length && !he.fechados.length && he.minutos + TOL >= a.x.perdaHoras)
        || (he.tipo === 'horas' && he.cabe && !he.naoRepoePessoas);
      if (!cobre) continue;
      const total = custoDe(a) != null && he.total != null ? custoDe(a) + he.total : null;
      const cand = { c: a.c, x: Object.assign({}, a.x, { horasExtras: he, perdaHorasResidual: 0, totalComHE: total }) };
      if (!B || (total != null && B.x.totalComHE != null ? total < B.x.totalComHE : cand.c.nota < B.c.nota)) B = cand;
    }
    // D: com norma coletiva ainda não negociada, se for mais barato ou contratar menos que C (a perda de produção aparece)
    const pend = avaliados.filter((a) => a.c.situacao.codigo === 'pendente');
    const D0 = menor(pend, (a) => a.x.perdaHoras * 1e3 + porCusto(a) / 1e3);
    // só entra se melhora algo na etapa definitiva: sem perda e mais barato ou com menos contratações que C, ou com menos
    // perda que A sem contratar mais (a transição do art. 7º, que só muda a etapa de 42 h, fica de fora)
    const melhorQueC = D0 && D0.x.perdaHoras <= TOL && (!C || (custoDe(D0) != null && custoDe(C) != null ? custoDe(D0) < custoDe(C) - 1 : D0.x.contratacoes < C.x.contratacoes));
    const melhorQueA = D0 && A && D0.x.perdaHoras < A.x.perdaHoras - TOL && D0.x.contratacoes <= A.x.contratacoes;
    const D = D0 && (melhorQueC || melhorQueA || (!A && !C)) ? D0 : null;

    if (A && C && A.c === C.c) out.push(Object.assign({ id: 'A', rotulo: A.x.contratacoes ? 'Mantendo a operação' : 'Sem contratar e sem perder produção' }, A));
    else {
      if (A) out.push(Object.assign({ id: 'A', rotulo: rotuloA(A) }, A));
      if (B) out.push(Object.assign({ id: 'B', rotulo: 'Sem contratar, com horas extras em revezamento' }, B));
      if (C) out.push(Object.assign({ id: 'C', rotulo: C.x.contratacoes ? 'Mantendo a operação, contratando' : 'Mantendo a operação' }, C));
    }
    // P: contratar com reforço em tempo parcial (CLT, art. 58-A), sem perda de produção, quando o melhor caminho C é outro
    const P = menor(semPerda.filter((a) => a.c.contratarParciais > 0), porCusto);
    if (P && (!C || P.c !== C.c)) out.push(Object.assign({ id: 'P', rotulo: 'Mantendo a operação, com reforço em tempo parcial' }, P));
    if (D) out.push(Object.assign({ id: 'D', rotulo: 'Com norma coletiva' }, D));
    return out;
  }
  function rotuloA(a) {
    const c = a.c;
    if (a.x.perdaHoras <= TOL) return 'Sem contratar';
    if (c.fecha && c.fecha.length) return 'Sem contratar, sem abrir em dias de menor movimento';
    if (c.descoberto) return 'Sem contratar, com menos gente em alguns dias';
    if (c.mudaHorario) return 'Sem contratar, com horário menor';
    return 'Sem contratar';
  }
  /** Caminho sugerido: se o funcionamento pode mudar, o sem contratação; senão, o de menor custo sem perda de produção. */
  function sugerido(lista, funcionamento) {
    if (!lista.length) return null;
    const a = lista.find((x) => x.id === 'A');
    if (funcionamento === 'flexivel' && a) return a.id;
    const semPerda = lista.filter((x) => x.id !== 'A' || x.x.perdaHoras <= TOL);
    const total = (x) => (x.x.totalComHE != null ? x.x.totalComHE : x.x.e2 ? x.x.e2.total : null);
    const comCusto = semPerda.filter((x) => total(x) != null && x.id !== 'D');
    if (comCusto.length) return comCusto.sort((p, q) => total(p) - total(q))[0].id;
    const c = lista.find((x) => x.id === 'C');
    return (c || a || lista[0]).id;
  }

  /* ================================================================ picos */

  const PROV = 1 / 12 + 1 / 12 * 4 / 3;   // 13º e férias com o terço, sobre a remuneração
  /** Encargos sem as provisões, a partir do percentual total (encargos e provisões) informado: e = (total − prov) ÷ (1 + prov). */
  const semProvisoes = (total) => Math.max(0, (num(total, 0) / 100 - PROV) / (1 + PROV));
  /**
   * Caminho para cobrir os dias que ficam com menos gente quando o quadro de hoje passa para 5x2 sem contratar
   * (cenário "sem-contratar" do planejador): F, diárias de freelancer, só onde o setor admite (varejo, alimentação e
   * hospedagem, pedido do usuário) e só quando as faltas caem em até dois dias da semana. Cada presença que falta por
   * semana vira uma diária, pelo valor informado, fora da folha e sem encargos. O contrato intermitente saiu a pedido do
   * usuário (D77); o reforço em tempo parcial é o caminho P, calculado pelo planejador (cenário 5x2-parcial).
   * params: os de custoCompleto, mais { diaria, freelancer: true quando o setor admite }
   */
  const MAX_DIAS_DIARIA = 2;
  function picos(cen, params) {
    if (!cen || cen.erro) return [];
    const p = params || {};
    if (!p.freelancer) return [];
    const sc = cen.lista.find((c) => c.id === 'sem-contratar' && c.descoberto && LEGAL.concat(['descoberto']).indexOf(c.situacao.codigo) >= 0 && !c.semFerias);
    if (!sc) return [];
    const dem = sc.demanda || cen.demanda;
    const faltas = sc.faltas.slice();
    const presencas = faltas.reduce((a, b) => a + b, 0);
    const diasFalta = faltas.filter((x) => x > 0).length;
    if (!presencas || diasFalta > MAX_DIAS_DIARIA) return [];
    // jornada de trabalho de cada dia no cenário (sem intervalos), para medir as horas de cada presença que falta
    const trabDia = [0, 0, 0, 0, 0, 0, 0];
    for (const l of sc.grade2.linhas) l.horas.forEach((h, i) => { if (h) trabDia[i % 7] = Math.max(trabDia[i % 7], h[1] - h[0] - (h[2] || []).reduce((s, q) => s + q[1] - q[0], 0)); });
    const minutos = faltas.reduce((s, f, d) => s + f * trabDia[d], 0);
    const base = custoCompleto(sc, cen.base, p);
    const diaria = num(p.diaria, null);
    const diarias = presencas * SEM;
    const valor = diaria != null && diaria > 0 ? diarias * diaria : null;
    return [{ id: 'F', rotulo: 'Sem contratar, com diárias de freelancer nos dias que faltam', c: sc,
      x: Object.assign({}, base, { perdaHoras: 0, faltas: faltas, presencas: presencas, minutos: minutos, demanda: dem, diasFalta: diasFalta, contratacoes: 0, unico: 0,
        picos: { tipo: 'diarias', diarias: diarias, valor: valor }, totalPicos: base.e2 && valor != null ? base.e2.total + valor : null }) }];
  }

  /**
   * Itens do percentual de encargos e provisões (decisão D53), para o quadro "como chegamos neste valor". Sem RAT ou
   * terceiros informados, usa 2% de RAT, FAP 1 e 5,8% de terceiros (FPAS de comércio, indústria e transporte), sinalizados
   * como estimativa.
   */
  function detalheEncargos(o) {
    const reg = o.regime || 'lucro';
    const est = [];
    let rat = num(o.rat, null), terc = num(o.terceiros, null);
    const fap = num(o.fap, 1) || 1;
    if (reg !== 'simples' && rat == null) { rat = 2; est.push('RAT'); }
    if (reg === 'lucro' && terc == null) { terc = 5.8; est.push('terceiros'); }
    const itens = [];
    if (reg !== 'simples') { itens.push(['Contribuição patronal ao INSS', 20]); itens.push(['RAT × FAP', Math.round(rat * fap * 100) / 100]); }
    if (reg === 'lucro') itens.push(['Terceiros (Sistema S, salário-educação, Incra)', terc]);
    itens.push(['FGTS', 8]);
    const e = itens.reduce((s, x) => s + x[1], 0);
    const prov = [['13º salário', 100 / 12], ['Férias com o terço', 100 / 12 * 4 / 3]];
    const sobre = e * (PROV * 100) / 100;
    const total = Math.round((e + PROV * 100 + sobre) * 100) / 100;
    return { regime: reg, itens: itens, provisoes: prov, sobreProvisoes: sobre, total: total, estimados: est };
  }

  /* ================================================================ escala editada */

  const INICIO_EDICAO = '2028-01-10';   // uma segunda-feira já sob o teto de 40 h
  const dataIso = (z) => { const c = M.civil(z); return c.a + '-' + String(c.m).padStart(2, '0') + '-' + String(c.d).padStart(2, '0'); };
  /**
   * Confere no motor uma escala semanal editada (as semanas exibidas, sem repetição): linhas { id, nome, contrato,
   * dias: ['T'|'F'|'R'] × 7S, horas: [[entrada, saída, pausas]] × 7S }, com os instrumentos e a atividade do cenário.
   * Devolve a situação, os problemas por pessoa, as horas semanais de cada pessoa e a cobertura mínima de cada dia.
   */
  function validarGrade(linhas, semanas, opcoes) {
    let o = opcoes || {};
    // o.inicio: segunda-feira da primeira semana conferida (a etapa de 42 h usa 2027-01-04); o.etapa: 1 ou 2
    // o.repetir: semanas mínimas da conferência; a grade se repete, como no calendário, para conferir também a virada do
    // ciclo (dias seguidos, média do mês e saldo do mês) (D113)
    if (o.repetir && semanas > 0 && semanas < o.repetir) {
      const vezes = Math.ceil(o.repetir / semanas), nd = 7 * semanas;
      linhas = linhas.map((l) => Object.assign({}, l, { dias: Array.from({ length: nd * vezes }, (_, i) => l.dias[i % nd]), horas: Array.from({ length: nd * vezes }, (_, i) => l.horas[i % nd]) }));
      const semOrig = semanas;
      semanas = semOrig * vezes;
      o = Object.assign({}, o, { semanasCobertura: semOrig });
    }
    const ini0 = o.inicio || INICIO_EDICAO, z0 = M.lerData(ini0), n = 7 * semanas;
    const turnos = new Map(), escalas = [], empregados = [], atribuicoes = [];
    const idTurno = (h) => {
      const k = h[0] + '|' + h[1] + '|' + (h[2] || []).map((q) => q[0] + '-' + q[1]).join(',');
      if (!turnos.has(k)) {
        const id = 'T' + turnos.size;
        turnos.set(k, { id: id, nome: id, inicio: M.fmtHora(h[0]), fim: M.fmtHora(h[1]), pausas: (h[2] || []).map((q) => ({ inicio: M.fmtHora(q[0]), duracao: q[1] - q[0], tipo: 'usufruido' })) });
      }
      return turnos.get(k).id;
    };
    for (const l of linhas) {
      const dias = [];
      for (let i = 0; i < n; i++) dias.push(l.dias[i] === 'T' && l.horas[i] ? idTurno(l.horas[i]) : null);
      empregados.push(Object.assign({ id: l.id, nome: l.nome, admissao: '2020-01-01', setor: 'S' }, l.contrato === 'parcial' ? { tipo: 'parcial' } : {}, l.art386 ? { art386: true } : {},
        o.insalubre ? { insalubre: true } : {}, o.revezamento ? { revezamento: true } : {}));
      escalas.push({ id: 'E-' + l.id, tipo: 'semanal', dias: dias, trabalhaFeriados: true });
      atribuicoes.push({ empregado: l.id, escala: 'E-' + l.id, inicio: ini0, fim: dataIso(z0 + n - 1), ancora: ini0 });
    }
    const fim = M.civil(z0 + n - 1);
    const entrada = { empresa: { atividade: o.atividade || 'servicos' }, horizonte: { inicio: ini0, fim: fim.a + '-' + String(fim.m).padStart(2, '0') + '-' + String(fim.d).padStart(2, '0') }, feriados: [],
      turnos: Array.from(turnos.values()), escalas: escalas, empregados: empregados, atribuicoes: atribuicoes, excecoes: [], instrumentos: o.instrumentos || [] };
    const r = M.avaliar(entrada, { liminar: o.liminar !== false });
    const resumo = P._interno.resumir(r, o.etapa === 1 ? 1 : 2);
    const nomes = new Map(linhas.map((l) => [l.id, l.nome]));
    const problemas = [];
    for (const e of r.empregados) {
      const vistos = new Set();
      for (const a of e.achados) if (a.status === 'nao_cumpre' && !vistos.has(a.regra) && !(a.regra === 'R2' && !a.instrumento)) { vistos.add(a.regra); problemas.push({ pessoa: nomes.get(e.id) || e.id, regra: a.regra, porque: a.porque }); }
    }
    const ext = {};
    for (const l of linhas) ext[l.id] = { contrato: l.contrato === 'parcial' ? 'parcial' : 'integral', nova: !!l.nova };
    const eq = P._interno.medirEquipe(r, z0, n, ext);
    const horas = new Map(eq.pessoas.map((x) => [x.id, { rel: x.rel, comp: x.comp, dias: x.dias }]));
    const cobertura = [Infinity, Infinity, Infinity, Infinity, Infinity, Infinity, Infinity];
    for (let s = 0; s < (o.semanasCobertura || semanas); s++) for (let d = 0; d < 7; d++) {
      let c = 0;
      for (const l of linhas) if (l.dias[s * 7 + d] === 'T') c++;
      cobertura[d] = Math.min(cobertura[d], c);
    }
    // D113: a medida da equipe (eco) permite recalcular a folha da escala ajustada pelo mesmo cálculo dos cenários
    let maxJ = 0;
    for (const l of linhas) for (const h of l.horas) if (h) maxJ = Math.max(maxJ, h[1] - h[0] - (h[2] || []).reduce((s, q) => s + q[1] - q[0], 0));
    return { status: resumo.status, motivos: resumo.motivos, pendente: resumo.pendente, depende: resumo.depende, problemas: problemas, horas: horas, cobertura: cobertura, erros: r.erros.map((x) => x.onde + ': ' + x.msg),
      liminar: resumo.liminar, leituras: resumo.leituras, fundamentos: resumo.fundamentos, alertas: resumo.alertas, certeza: resumo.certeza, eco: Object.assign(eq, { maxJornada: maxJ }) };
  }

  /* "Conferir uma escala" (D114) e casos de referência: uma semana (ou ciclo de semanas) de uma pessoa, informada à mão, no
     formato { atividade, insalubre, revezamento, mulher, parcial, instr: [chaves], dias: [[{ t, ini, fim, iv } x 7], ...] }.
     A página e os testes de referência usam estas mesmas funções. */
  const INSTR_CONFERENCIA = { comp: 'comp', art7: 'art7', par2: 'par2!', media: 'media!', banco: 'banco!', x12: '12x36' };
  function linhaConferencia(c) {
    const dias = [], horas = [];
    for (const w of c.dias) for (const x of w) {
      const ini = M.lerHora(x.ini), fim0 = M.lerHora(x.fim);
      if (!x.t || ini == null || fim0 == null) { dias.push('F'); horas.push(null); continue; }
      let fim = fim0; while (fim <= ini) fim += 1440;
      const iv = Math.max(0, Number(x.iv) || 0), p0 = ini + Math.max(0, Math.round((fim - ini - iv) / 2 / 30) * 30);
      dias.push('T'); horas.push([ini, fim, iv > 0 && fim - ini > iv ? [[p0, p0 + iv]] : []]);
    }
    return { id: 'P1', nome: 'Pessoa', contrato: c.parcial ? 'parcial' : 'integral', art386: !!c.mulher, dias: dias, horas: horas };
  }
  function instrConferencia(c, l) {
    const ivs = l.horas.filter(Boolean).map((h) => (h[2] || []).reduce((a, q) => a + q[1] - q[0], 0));
    const iv = ivs.length ? { intervalo: Math.min.apply(null, ivs), intervaloMin: Math.min.apply(null, ivs), intervaloMax: Math.max.apply(null, ivs) } : { intervalo: 60 };
    const on = new Set(c.instr || []), ch = [];
    for (const k in INSTR_CONFERENCIA) if (on.has(k)) ch.push(INSTR_CONFERENCIA[k]);
    return P._interno.instrumentos(ch, { art7: true, x12: true, x12e: on.has('x12e'), intervalo: on.has('intervalo'), tii: on.has('tii'), insal: on.has('insal'), lic60: on.has('lic60') }, iv);
  }
  /** fase 'e1' (42 h, a partir de 04/01/2027) ou 'e2' (40 h); liminar: false simula a liminar derrubada. */
  function conferirEscala(c, fase, liminar) {
    const l = linhaConferencia(c);
    return validarGrade([l], c.dias.length, { atividade: c.atividade, instrumentos: instrConferencia(c, l), liminar: liminar !== false, inicio: fase === 'e1' ? '2027-01-04' : undefined,
      etapa: fase === 'e1' ? 1 : 2, insalubre: !!c.insalubre, revezamento: !!c.revezamento, repetir: 8 });
  }

  /** Frase curta do diagnóstico de hoje, com o que precisa mudar nas duas etapas. */
  function veredito(diag) {
    if (!diag || diag.vazio || diag.erro) return null;
    const e1 = diag.etapas.e1.status, e2 = diag.etapas.e2.status;
    const cod = e1 === 'nao_cumpre' ? 'nao_cumpre' : e1 === 'pendente' ? 'pendente' : e2 === 'nao_cumpre' ? 'transitorio' : e2 === 'pendente' ? 'pendente' : diag.situacao.codigo;
    const textos = [];
    const vistos = new Set();
    let semana42 = false, semana40 = false;
    for (const e of ['e1', 'e2']) for (const m of (diag.mudancas && diag.mudancas[e]) || []) {
      if (m.texto === 'Reduzir a semana a 42 h') { semana42 = true; continue; }
      if (m.texto === 'Reduzir a semana a 40 h') { semana40 = true; continue; }
      if (!vistos.has(m.texto)) { vistos.add(m.texto); textos.push(m.texto.charAt(0).toLowerCase() + m.texto.slice(1)); }
    }
    if (semana42 && semana40) textos.push('reduzir a semana a 42 h até 15/12/2027 e a 40 h depois');
    else if (semana40) textos.push('reduzir a semana a 40 h a partir de 16/12/2027');
    else if (semana42) textos.push('reduzir a semana a 42 h');

    mte: { nome: 'MTE, levantamento sobre a escala 6x1 com dados do eSocial (10/03/2026)', url: 'https://agenciagov.ebc.com.br/noticias/202603/escala-6x1-atinge-33-2-dos-empregos-no-brasil-aponta-levantamento' },

<script>/* Simulador da Emenda Constitucional 141 (Fim da 6x1), versão 4 (D116, D117): uma tela, uma equipe com até três turnos.
   A pergunta do RH vem primeiro: dá para se adaptar sem aumentar o custo, sem mudar os dias de funcionamento e com as
   mesmas pessoas por dia? Depois, todos os caminhos, agrupados pelo que mantêm e mudam, cada um com o que fazer para
   avançar. O dia da equipe em 24 horas mostra os turnos e quantas pessoas trabalham em cada horário, hoje e em cada
   escala; o calendário, opcional, abre ao clicar. Os refinamentos ficam fechados. */
(function () {
  'use strict';
  const M = window.MotorEscalas, P = window.PlanejadorEscalas, G = window.GruposEscalas, E = window.EstudoEC141;
  const SETORES = (window.SETORES_EC141 && window.SETORES_EC141.setores) || {};
  const CHAVE = 'simulador-ec141-v4';
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (v) => { if (v === '' || v == null) return null; const n = Number(String(v).trim()); return Number.isFinite(n) ? n : null; };
  const reais = (v) => (v == null ? '—' : 'R$ ' + Math.round(Math.abs(v)).toLocaleString('pt-BR'));
  const pct = (x) => (Math.abs(x) * 100).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + '%';
  const plural = (n, um, varios) => n + ' ' + (n === 1 ? um : varios);
  const juntarE = (xs) => (xs.length <= 1 ? xs.join('') : xs.slice(0, -1).join(', ') + ' e ' + xs[xs.length - 1]);
  const hm = (m) => M.fmtHora(((Math.round(m) % 1440) + 1440) % 1440);
  const DIAS = E.DIAS, ROT = E.ROT_TURNO;
  const ESC_PRINC = ['6x1', '5x2', '12x36'];
  const REGIMES = [['', 'Não sei (usa lucro presumido ou real)'], ['simples', 'Simples Nacional (Anexos I a III e V)'], ['simples4', 'Simples Nacional, Anexo IV'], ['lucro', 'Lucro presumido ou real']];
  const NIVEL_CLS = { ok: 'ok', acordo: 'ok', norma: 'pend', nao: 'nok' };
  const CERT_TXT = { lei: 'pela lei', liminar: 'pela liminar do STF', leitura: 'leitura a validar' };
  const CERT_DICA = { lei: 'Decorre do texto da Constituição, da Emenda, da CLT, do Decreto 13.173/2026 ou de súmula do TST.', liminar: 'Depende da liminar do STF na ADI 8.041, em vigor até o julgamento de mérito.', leitura: 'Depende de leitura jurídica do escritório ainda não pacificada.' };
  const FASES = [['e1', 'De 16/12/2026 a 15/12/2027', 'limite de 42 h'], ['e2', 'A partir de 16/12/2027', 'limite de 40 h']];
  const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const SEMANA_LONGA = ['segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado', 'domingo'];

  /* ================================================================ estado */

  function carregar() {
    try { const t = localStorage.getItem(CHAVE); if (t) return E.normalizar(JSON.parse(t)); } catch (e) { /* sem armazenamento */ }
    return E.normalizar(E.padrao());
  }
  let tSalvar = null;
  function salvar() { clearTimeout(tSalvar); tSalvar = setTimeout(() => { try { localStorage.setItem(CHAVE, JSON.stringify(S.op)); } catch (e) { /* sem armazenamento */ } }, 300); }
  const S = { op: carregar(), estado: 'vazio', est: null, partes: [], k: '', erro: '', ajustes: {}, semana: {}, turnoVer: {}, dia: {}, abertos: new Set(), seq: 0, cal: new Map(), calMes: {}, calDia: {} };
  const setor = () => SETORES[S.op.setor] || null;
  const varios = () => S.op.turnos.length > 1;

  /* ================================================================ cálculo no worker */

  let worker = null, wseq = 0;
  const pend = new Map();
  function criarWorker() {
    try {
      const src = document.getElementById('motor-escalas').textContent + '\n;' + document.getElementById('planejador-escalas').textContent +
        '\n;self.onmessage=function(e){var m=e.data,P=self.PlanejadorEscalas;try{var r=m.tipo==="cal"?P.calendario(m.grupos,m.op,m.inicio,m.fim):{cen:P.cenarios(m.turno,m.empresa,m.opcoes),diag:P.diagnostico(m.turno,m.empresa,m.opcoes)};self.postMessage({id:m.id,r:r});}catch(err){self.postMessage({id:m.id,erro:String(err&&err.message||err)});}};';
      worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      worker.onmessage = (ev) => { const p = pend.get(ev.data.id); if (!p) return; pend.delete(ev.data.id); if (ev.data.erro) p.rej(new Error(ev.data.erro)); else p.res(ev.data.r); };
      worker.onerror = () => { worker = null; for (const [, p] of pend) p.rej(new Error('cálculo interrompido')); pend.clear(); };
    } catch (e) { worker = null; }
  }
  function pedir(m) {
    if (worker) return new Promise((res, rej) => { const id = ++wseq; pend.set(id, { res: res, rej: rej }); worker.postMessage(Object.assign({ id: id }, m)); });
    return new Promise((res, rej) => setTimeout(() => { try { res(m.tipo === 'cal' ? P.calendario(m.grupos, m.op, m.inicio, m.fim) : { cen: P.cenarios(m.turno, m.empresa, m.opcoes), diag: P.diagnostico(m.turno, m.empresa, m.opcoes) }); } catch (e) { rej(e); } }, 0));
  }
  let tCalc = null;
  function agendar() { clearTimeout(tCalc); tCalc = setTimeout(calcular, 350); }
  function calcular() {
    const op = S.op, er = E.erros(op);
    if (er.length) { S.estado = 'vazio'; S.erro = er.join(' '); S.est = null; renderResultado(); return; }
    let views, ms;
    try { views = op.turnos.map((_, i) => E.visao(op, i)); ms = views.map((v) => E.montar(v, setor())); } catch (e) { S.estado = 'erro'; S.erro = e.message; renderResultado(); return; }
    const k = JSON.stringify(ms.map((m) => [m.t.turno, m.atividade, m.t.opcoes, m.pr]));
    if (k === S.k && S.est) return;
    S.k = k; S.estado = 'calc'; const seq = ++S.seq; renderResultado();
    Promise.all(ms.map((m) => pedir({ turno: m.t.turno, empresa: { atividade: m.atividade }, opcoes: m.t.opcoes }))).then((rs) => {
      if (seq !== S.seq) return;
      for (const r of rs) if (r.cen && r.cen.erro) throw new Error(r.cen.erro);
      S.partes = rs.map((r, i) => ({ op: views[i], m: ms[i], cen: r.cen, diag: r.diag, est: E.estudar(views[i], ms[i], r.cen, r.diag) }));
      S.est = E.combinar(S.partes, op); S.estado = 'ok'; S.ajustes = {}; S.semana = {}; S.cal.clear();
      renderResultado();
    }).catch((e) => { if (seq !== S.seq) return; S.estado = 'erro'; S.erro = e.message; renderResultado(); });
  }

  /* ================================================================ formulário */

  const chip = (acao, v, rot, on, extra) => `<button type="button" class="chip" data-acao="${acao}" data-v="${esc(v)}" aria-pressed="${!!on}"${extra || ''}>${esc(rot)}</button>`;
  function intervaloTxt() {
    const op = S.op, iv = num(op.ref.intervalo);
    const legs = op.turnos.map((t) => G.intervaloLegal(t.inicio, t.fim)).filter((x) => x != null);
    if (iv != null) return iv ? 'Com ' + (iv >= 60 && iv % 60 === 0 ? iv / 60 + ' h' : iv + ' min') + ' de intervalo.' : 'Sem intervalo.';
    if (!legs.length) return '';
    const v = Math.max.apply(null, legs);
    return v ? 'Com ' + (v >= 60 && v % 60 === 0 ? v / 60 + ' h' : v + ' min') + ' de intervalo, o mínimo da lei; para mudar, use os refinamentos.' : 'Sem intervalo (jornada de até 4 h).';
  }
  /** Os turnos no dia, em 24 horas, a partir do que foi digitado (antes de calcular). */
  function vTurnosNoDia() {
    const ts = S.op.turnos.map((t, i) => ({ i: i, a: M.lerHora(t.inicio), b: M.lerHora(t.fim), n: Math.floor(num(t.pessoas) || 0) })).filter((t) => t.a != null && t.b != null && t.a !== t.b);
    if (!ts.length) return '';
    const W = 300, H = 14, alt = ts.length * (H + 4) + 18;
    const x = (m) => (m / 1440) * W;
    const barras = ts.map((t, r) => { const y = r * (H + 4); const fx = t.b > t.a ? [[t.a, t.b]] : [[t.a, 1440], [0, t.b]];
      return fx.map(([a, b]) => `<rect x="${x(a).toFixed(1)}" y="${y}" width="${Math.max(1, x(b) - x(a)).toFixed(1)}" height="${H}" rx="3" class="faixa"/>`).join('') + `<text x="${(x(fx[0][0]) + 4).toFixed(1)}" y="${y + 10.5}" class="faixa-rot">${esc((varios() ? ROT[t.i] + ' · ' : '') + (t.n ? t.n + ' p.' : ''))}</text>`; }).join('');
    const eixo = [0, 6, 12, 18, 24].map((h) => `<text x="${x(h * 60).toFixed(1)}" y="${alt - 2}" class="eixo" text-anchor="${h === 0 ? 'start' : h === 24 ? 'end' : 'middle'}">${h}h</text>`).join('');
    return `<figure class="mini24"><svg viewBox="0 0 ${W} ${alt}" role="img" aria-label="Turnos ao longo das 24 horas">${barras}${eixo}</svg></figure>`;
  }
  function vTurnos() {
    const op = S.op, n = op.turnos.length;
    const linhas = op.turnos.map((t, i) => `<div class="turno-linha">${n > 1 ? `<span class="rot-t">${ROT[i]}</span>` : ''}
        <div class="horario"><input type="time" data-t="${i}" data-tc="inicio" id="f-t${i}-ini" value="${esc(t.inicio)}" aria-label="Entrada${n > 1 ? ' do ' + ROT[i] : ''}"><span>às</span><input type="time" data-t="${i}" data-tc="fim" id="f-t${i}-fim" value="${esc(t.fim)}" aria-label="Saída${n > 1 ? ' do ' + ROT[i] : ''}"></div>
        <label class="pess"><input type="text" inputmode="numeric" data-t="${i}" data-tc="pessoas" id="f-t${i}-pess" value="${esc(t.pessoas)}" placeholder="0" aria-label="Pessoas${n > 1 ? ' no ' + ROT[i] : ''}"><span>pessoas</span></label>
        ${n > 1 ? `<button type="button" class="btn mini sem-borda" data-acao="turno-menos" data-v="${i}" aria-label="Tirar o ${ROT[i]}">Tirar</button>` : ''}</div>`).join('');
    return `<div class="campo"><span class="rot">${n > 1 ? 'Turnos, horário e pessoas' : 'Horário de trabalho e pessoas'}</span>${linhas}
      ${n < E.MAX_TURNOS ? `<button type="button" class="btn mini" data-acao="turno-mais" id="f-turno-mais">Incluir outro turno</button>` : ''}
      <small id="f-iv">${esc(intervaloTxt())}</small>${vTurnosNoDia()}</div>`;
  }
  function vNecessidade() {
    const op = S.op, ds = E.diasDe(op);
    return op.turnos.map((t, i) => {
      const v = E.visao(op, i);
      let cob = [0, 0, 0, 0, 0, 0, 0];
      try { const g = E.grupoDe(v); if (g.pessoas > 0 && !G.conferir(g).length) cob = G.coberturaHoje(g); } catch (e) { /* entrada incompleta */ }
      return `<div class="nec-linha">${varios() ? `<span class="rot-t">${ROT[i]}</span>` : ''}<div class="necs">${DIAS.map((d, j) => `<label class="nec"><span>${esc(d)}</span><input type="text" inputmode="numeric" data-nec="${i}:${j}" value="${esc(t.necessidade[j])}" placeholder="${ds[j] ? esc(cob[j] || '') : '–'}"${ds[j] ? '' : ' disabled'} aria-label="Pessoas necessárias na ${esc(E.DIAS_LONGOS[j])}${varios() ? ', ' + ROT[i] : ''}"></label>`).join('')}</div></div>`;
    }).join('');
  }
  function vForm() {
    const op = S.op, r = op.ref, cic = E.CICLICAS.indexOf(op.escala) >= 0, outra = ESC_PRINC.indexOf(op.escala) < 0;
    const setores = Object.keys(SETORES).map((k) => `<option value="${esc(k)}"${op.setor === k ? ' selected' : ''}>${esc(SETORES[k].nome)}</option>`).join('');
    const mulheres = op.turnos.map((t, i) => `<label class="pess">${varios() ? `<span class="rot-t">${ROT[i]}</span>` : ''}<input type="text" inputmode="numeric" data-tm="${i}" value="${esc(t.mulheres)}" placeholder="0" aria-label="Mulheres que trabalham aos domingos${varios() ? ', ' + ROT[i] : ''}"></label>`).join('');
    return `<form class="form" id="form" autocomplete="off" onsubmit="return false">
      <div class="form-cab"><h2>Sua equipe hoje</h2><p class="nota">Uma função por vez, com a mesma escala e o mesmo salário. Se ela trabalha em turnos, inclua até três.</p></div>
      <label class="campo"><span class="rot">Setor</span><select id="f-setor"><option value="">Escolha o setor</option>${setores}</select></label>
      <div class="campo"><span class="rot">Escala de hoje</span><div class="chips" role="group" aria-label="Escala de hoje">${ESC_PRINC.map((e) => chip('escala', e, e, op.escala === e)).join('')}
        <select id="f-outra" class="chip-select${outra ? ' on' : ''}" aria-label="Outra escala"><option value="">Outra</option>${E.ESCALAS.filter((e) => ESC_PRINC.indexOf(e[0]) < 0).map((e) => `<option value="${e[0]}"${op.escala === e[0] ? ' selected' : ''}>${e[1]}</option>`).join('')}</select></div></div>
      <div class="campo"${cic ? ' hidden' : ''}><span class="rot">Dias de funcionamento</span><div class="chips dias" role="group" aria-label="Dias de funcionamento">${DIAS.map((d, i) => chip('dia', i, d, op.dias[i], ` id="f-dia-${i}"`)).join('')}</div></div>
      ${cic ? `<p class="nota">Na ${esc(op.escala)}, a equipe se reveza nos sete dias da semana.</p>` : ''}
      <div id="f-turnos">${vTurnos()}</div>
      <label class="campo"><span class="rot">Salário médio, por mês</span><div class="prefixo"><span>R$</span><input id="f-salario" data-campo="salario" type="text" inputmode="decimal" value="${esc(op.salario)}" placeholder="Ex.: 2.500"></div></label>
      <details class="refinar" id="refinar"${S.abertos.has('refinar') ? ' open' : ''}><summary>Refinar a simulação <span class="suave">(opcional)</span></summary>
        <div class="ref">
          <label class="campo"><span class="rot">Nome da equipe, para o relatório</span><input data-ref="nome" type="text" value="${esc(r.nome)}" placeholder="Ex.: Caixas, Operadores de produção"></label>
          <label class="campo"><span class="rot">Intervalo de refeição, em minutos</span><input data-ref="intervalo" type="text" inputmode="numeric" value="${esc(r.intervalo)}" placeholder="o mínimo da lei"></label>
          <div class="campo"><span class="rot">Pessoas necessárias em cada dia</span>${vNecessidade()}<small>Em branco, vale o número de pessoas que trabalham hoje em cada dia.</small></div>
          <label class="check"><input type="checkbox" data-ref="horarioFixo"${r.horarioFixo ? ' checked' : ''}><span>O horário de trabalho precisa ficar como está</span></label>
          <label class="check"><input type="checkbox" data-ref="insalubre"${r.insalubre ? ' checked' : ''}><span>A atividade é insalubre <small>dias acima de 8 h dependem de norma coletiva que os autorize ou de autorização da Inspeção do Trabalho (Portaria MTE 2.041/2026, art. 15)</small></span></label>
          <label class="check"><input type="checkbox" data-ref="revezamento"${r.revezamento ? ' checked' : ''}><span>As pessoas giram entre os turnos, inclusive à noite <small>turno ininterrupto de revezamento: até 6 h por dia, ou até 8 h com norma coletiva (CF, art. 7º, XIV)</small></span></label>
          <div class="campo"><span class="rot">Mulheres que trabalham aos domingos</span><div class="mulheres">${mulheres}</div><small>Têm folga a cada duas semanas aos domingos (CLT, art. 386).</small></div>
          <fieldset class="campo"><legend class="rot">Acordos e normas que a empresa já tem</legend>${E.ACORDOS.map(([k, n]) => `<label class="check"><input type="checkbox" data-acordo="${k}"${r.acordos.indexOf(k) >= 0 ? ' checked' : ''}><span>${esc(n)}</span></label>`).join('')}</fieldset>
          <label class="campo"><span class="rot">Regime tributário, para os encargos</span><select data-ref="regime">${REGIMES.map(([k, n]) => `<option value="${k}"${(r.regime || '') === k ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select></label>
          <label class="check"><input type="checkbox" data-ref="semLiminar"${r.semLiminar ? ' checked' : ''}><span>Simular sem a liminar do STF <small>para ver o que muda se o Plenário não mantiver a decisão na ADI 8.041</small></span></label>
        </div></details>
      <div class="form-pe"><button type="button" class="btn" data-acao="limpar">Começar de novo</button></div>
    </form>`;
  }

  /* ================================================================ resultado: textos */

  const certTag = (s) => (s && s.cert && s.nivel !== 'nao' ? `<span class="cert c-${s.cert}" title="${esc(CERT_DICA[s.cert])}">${esc(CERT_TXT[s.cert])}</span>` : '');
  const pill = (s) => `<span class="pill ${NIVEL_CLS[s.nivel]}">${esc(s.rot)}</span>`;
  function vEtapas(x) {
    return `<div class="etapas">${FASES.map(([f, rot, lim]) => { const s = x.etapas[f]; return `<div class="etapa"><span class="eyebrow">${rot} · ${lim}</span><p>${pill(s)} ${certTag(s)}</p>${s.det ? `<p class="det">${esc(s.det)}</p>` : ''}</div>`; }).join('')}</div>`;
  }
  function custoTxt(f) {
    const c = f.custo;
    if (c.e2 == null || c.hoje == null) return '—';
    const d = c.e2 - c.hoje;
    if (Math.abs(d) < 1) return 'igual à de hoje (' + reais(c.hoje) + ')';
    return reais(c.e2) + ` <span class="${d > 0 ? 'sobe' : 'desce'}">${d > 0 ? '+' : '−'} ${reais(d)} (${d > 0 ? '+' : '−'}${pct(d / c.hoje)})</span>`;
  }
  function pessoasTxt(f) {
    const p = f.pessoas, c = p.contrI + p.contrP;
    if (c) return `${p.usadas} <span class="sobe">+ ${c} ${c === 1 ? 'contratação' : 'contratações'}${p.contrP ? (p.contrI ? ', ' + p.contrP + ' em tempo parcial' : ' em tempo parcial') : ''}</span>`;
    if (p.usadas < p.hoje) return `${p.usadas} das ${p.hoje} de hoje`;
    return `as ${p.hoje} de hoje`;
  }
  const quebra = (t) => esc(t).replace(/; /g, '<br>');
  function horarioTxt(f) {
    const h = f.horario;
    if (!h.muda) return 'o de hoje';
    if (h.e1 !== h.e2) return `até 15/12/2027: ${quebra(h.e1)}<br>depois: ${quebra(h.e2)}`;

  }
  function vFatos(x) {
    const f = x.fatos;

      ['Pessoas', pessoasTxt(f)],
      ['Folha por mês, com encargos', x.id === 'hoje' ? reais(f.custo.hoje) : custoTxt(f)],
      ['Dias de funcionamento', f.dias.iguais ? 'os de hoje' : `<span class="sobe">${esc(f.dias.texto)}</span>`],

      ['Horário', x.id === 'hoje' ? quebra(f.horario.atual || '—') : horarioTxt(f)],
    ];
    return `<dl class="fatos">${linhas.map(([k, v]) => `<div${k === 'Horário' && varios() ? ' class="largo"' : ''}><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
  }
  function vPassos(x) {
    if (!x.passos.length) return `<div class="avancar"><h5>Para avançar</h5><p class="det">Implantar a escala e o horário. Veja abaixo o que vale para qualquer escala.</p></div>`;
    return `<div class="avancar"><h5>Para avançar</h5><ol>${x.passos.map((p) => `<li class="p-${p.tipo}">${esc(p.texto)}${p.base ? ` <span class="base">(${esc(p.base)})</span>` : ''}</li>`).join('')}</ol></div>`;
  }
  const ST_FUND = { nao_cumpre: 'não atende', condicao: 'atende com', pendente: 'depende de' };
  function vFundamentos(x) {
    const out = [];
    for (const [f, rot] of FASES) {
      const s = x.etapas[f], fs = (s.fundamentos || []).filter((u) => ST_FUND[u.status]);
      const itens = fs.map((u) => `<li>${esc((M.REGRAS[u.regra] || {}).nome || u.regra)}: ${ST_FUND[u.status]}${u.status === 'nao_cumpre' ? '' : ' ' + esc(E.semCitacao(u.oque || 'acordo ou norma'))} <span class="base">(${esc(u.base)})</span></li>`);
      for (const l of s.leituras || []) itens.push(`<li>Leitura a validar: ${esc(String(l).replace(/\s*\((?:D\d+(?:,\s*D\d+)*)\)/g, ''))}</li>`);
      if (s.liminar) itens.push('<li>Usa a liminar do STF na ADI 8.041, em vigor até o julgamento de mérito.</li>');
      out.push(`<div><span class="eyebrow">${rot}</span>${itens.length ? `<ul class="fund">${itens.join('')}</ul>` : '<p class="det">Cumpre todas as regras conferidas, sem depender de acordo, norma ou leitura.</p>'}</div>`);
    }
    const obs = Array.from(new Set([].concat.apply([], (x.partes || [x]).map((p) => (p.c && p.c.ponderacoes) || [])).filter(Boolean)));
    return `<div class="fundamentos"><h5>Por quê</h5>${out.join('')}${obs.length ? `<h5>Observações</h5><ul class="fund">${obs.map((o) => `<li>${esc(o)}</li>`).join('')}</ul>` : ''}</div>`;
  }

  /* ================================================================ o dia em 24 horas */

  const chaveAj = (id, i) => id + '|' + i;
  const gradeBase = (p) => (p && p.c ? p.c.grade2 || p.c.grade || null : null);
  const gradeTurno = (x, i) => S.ajustes[chaveAj(x.id, i)] || gradeBase(x.partes[i]);
  const gradesHoje = () => (S.est && S.est.hoje ? S.est.hoje.partes.map((p) => p.c.grade) : []);
  const diasAbertos = () => [0, 1, 2, 3, 4, 5, 6].filter((d) => (S.est.demanda[d] || 0) > 0);
  const faixaTxt = (a, b) => hm(a * 30) + ' às ' + (b * 30 >= 1440 ? '24:00' : hm(b * 30));
  /** Horários do dia em que a escala deixa a equipe sem ninguém, onde hoje há gente. */
  function buracos(v, h) {
    const out = [];
    let s = 0;
    while (s < 48) { if (v[s] === 0 && h && h[s] > 0) { let e = s; while (e < 48 && v[e] === 0 && h[e] > 0) e++; out.push([s, e]); s = e; } else s++; }
    return out;
  }
  function vDia24(x) {
    const id = x.id, ab = diasAbertos();
    if (!ab.length) return '';
    const d = S.dia[id] != null && ab.indexOf(S.dia[id]) >= 0 ? S.dia[id] : ab[0];
    const grades = x.partes.map((_, i) => gradeTurno(x, i));
    const v = E.dia24(grades, d), ehHoje = id === 'hoje', h = ehHoje ? null : E.dia24(gradesHoje(), d);
    const max = Math.max(1, Math.max.apply(null, v.concat(h || [])));
    // no celular, a figura usa uma largura menor, para o texto não encolher demais
    const estreito = typeof window !== 'undefined' && window.innerWidth < 640;
    const n = x.partes.length, BH = 14, top = n * (BH + 4) + 6, ch = estreito ? 110 : 120, W = estreito ? 380 : 720, X0 = 26, X1 = W - 8, bw = (X1 - X0) / 48;
    const xs = (m) => X0 + (m / 1440) * (X1 - X0), ys = (c) => top + ch - (c / max) * ch;
    const faixas = grades.map((g, i) => E.faixasTurno(g).map(([a, b]) => `<rect x="${xs(a).toFixed(1)}" y="${i * (BH + 4)}" width="${Math.max(1, xs(b) - xs(a)).toFixed(1)}" height="${BH}" rx="3" class="faixa"/>`).join('')
      + (() => { const fx = E.faixasTurno(g); if (!fx.length) return ''; const m = fx.reduce((a, b) => (b[1] - b[0] > a[1] - a[0] ? b : a)); return `<text x="${(xs(m[0]) + 4).toFixed(1)}" y="${i * (BH + 4) + 10.5}" class="faixa-rot">${esc(n > 1 ? ROT[i] : 'Turno')}</text>`; })()).join('');
    const barras = v.map((c, s) => `<rect x="${(X0 + s * bw + (estreito ? 0.5 : 1)).toFixed(1)}" y="${ys(c).toFixed(1)}" width="${(bw - (estreito ? 1 : 2)).toFixed(1)}" height="${(top + ch - ys(c)).toFixed(1)}" rx="2" class="b24"/>`).join('');
    const alvos = v.map((c, s) => `<rect x="${(X0 + s * bw).toFixed(1)}" y="${top}" width="${bw.toFixed(1)}" height="${ch}" class="alvo" data-acao="s24" data-id="${esc(id)}" data-s="${s}" data-v="${c}" data-h="${h ? h[s] : ''}"/>`).join('');
    let linha = '';
    if (h) { let dpath = ''; h.forEach((c, s) => { const y = ys(c).toFixed(1); dpath += (s ? ' H' + (X0 + s * bw).toFixed(1) + ' V' + y : 'M' + X0 + ' ' + y) ; }); dpath += ' H' + X1; linha = `<path d="${dpath}" class="l24"/>`; }
    const eixoY = `<text x="${X0 - 6}" y="${(ys(max) + 4).toFixed(1)}" class="eixo" text-anchor="end">${max}</text><text x="${X0 - 6}" y="${top + ch + 4}" class="eixo" text-anchor="end">0</text><line x1="${X0}" x2="${X1}" y1="${top + ch}" y2="${top + ch}" class="base24"/>`;
    const eixoX = (estreito ? [0, 6, 12, 18, 24] : [0, 3, 6, 9, 12, 15, 18, 21, 24]).map((hh) => `<text x="${xs(hh * 60).toFixed(1)}" y="${top + ch + 18}" class="eixo" text-anchor="middle">${hh}h</text>`).join('');
    const bs = buracos(v, h);
    const nota = bs.length ? `<p class="aviso">Com esta escala, ninguém trabalha ${juntarE(bs.map(([a, b]) => 'das ' + faixaTxt(a, b)))} ${SEMANA_LONGA[d] === 'sábado' || SEMANA_LONGA[d] === 'domingo' ? 'no ' : 'na '}${SEMANA_LONGA[d]}, horário em que hoje há gente trabalhando.</p>` : '';
    const leg = h ? '<p class="leg24"><span class="ch-b"></span>com esta escala <span class="ch-l"></span>hoje</p>' : '';
    return `<div class="dia24" id="d24-${esc(id)}"><h5>O dia da equipe em 24 horas</h5>
      <div class="chips" role="group" aria-label="Dia da semana">${ab.map((j) => `<button type="button" class="chip mini" data-acao="dia24" data-id="${esc(id)}" data-v="${j}" aria-pressed="${j === d}">${DIAS[j]}</button>`).join('')}</div>
      <figure><svg viewBox="0 0 ${W} ${top + ch + 24}" role="img" aria-label="Pessoas trabalhando em cada meia hora de ${SEMANA_LONGA[d]}">${faixas}${eixoY}${barras}${linha}${eixoX}${alvos}</svg></figure>
      ${leg}<p class="det leitura24" id="l24-${esc(id)}">Toque ou passe o mouse numa barra para ver quantas pessoas trabalham naquela meia hora.</p>${nota}
      <p class="det">O menor número de pessoas em cada meia hora, considerando todas as semanas do ciclo${n > 1 ? ' e somando os turnos' : ''}. O intervalo de refeição não é descontado.</p></div>`;
  }

  /* ================================================================ escala pessoa por pessoa e ajustes */

  function ajustada(x, i) { const k = chaveAj(x.id, i); if (!S.ajustes[k]) { const g = gradeBase(x.partes[i]); if (!g) return null; S.ajustes[k] = E.copiaGrade(g); } return S.ajustes[k]; }

    if (!g || !g.linhas || !g.linhas.length) return `<div class="escala"><h5>A escala pessoa por pessoa</h5>${sel}<p class="det">Esta escala não tem grade pessoa por pessoa para mostrar.</p></div>`;
    const k = chaveAj(x.id, i), W = g.semanas, w = Math.min(S.semana[k] || 0, W - 1), h = horaDaGrade(g), aj = !!S.ajustes[k], rod = E.rodizio(p.c, g);

    const rot = g.linhas.map((l) => (l.nova ? 'Nova ' + (++kn) : 'Pessoa ' + (++k0)));
    const cab = `<tr><th scope="col">Pessoa</th>${DIAS.map((d) => `<th scope="col">${d}</th>`).join('')}</tr>`;
    const linhas = g.linhas.map((l, li) => `<tr${l.nova ? ' class="nova"' : ''}><th scope="row">${rot[li]}</th>${DIAS.map((_, d) => {
      const j = w * 7 + d, t = l.dias[j] === 'T', hh = l.horas[j];
      return `<td><button type="button" class="dia ${t ? 't' : 'f'}" data-acao="celula" data-id="${esc(x.id)}" data-t="${i}" data-l="${li}" data-j="${j}" aria-label="${esc(rot[li] + ', ' + E.DIAS_LONGOS[d] + ': ' + (t ? 'trabalha' : 'folga'))}" title="${t && hh ? esc(hm(hh[0]) + '–' + hm(hh[1])) : 'folga'}">${t ? 'T' : 'F'}</button></td>`;
    }).join('')}</tr>`).join('');
    const cob = [0, 1, 2, 3, 4, 5, 6].map((d) => g.linhas.filter((l) => l.dias[w * 7 + d] === 'T').length);
    const pe = `<tr class="tot"><th scope="row">Trabalham</th>${cob.map((c) => `<td>${c}</td>`).join('')}</tr>`;
    const iv = h && h[2] && h[2].length ? h[2][0][1] - h[2][0][0] : 0;
    return `<div class="escala"><h5>A escala pessoa por pessoa</h5>${sel}
      <p class="det">${h ? 'Horário: ' + esc(hm(h[0]) + ' às ' + hm(h[1])) + (iv ? ', com ' + (iv >= 60 && iv % 60 === 0 ? iv / 60 + ' h' : iv + ' min') + ' de intervalo' : '') + (p.c.grade2 && p.c.grade && p.c.grade2 !== p.c.grade ? ' (escala a partir de 16/12/2027)' : '') + '. ' : ''}${rod ? 'A grade mostra ' + W + ' das ' + rod + ' semanas do rodízio de folgas; as demais seguem a mesma troca de folgas. ' : W > 1 ? 'O ciclo tem ' + W + ' semanas e se repete. ' : ''}T é dia de trabalho e F é folga. Clique num dia para trocar e testar.</p>
      ${sem}<div class="tab-rol"><table class="grade">${cab}${linhas}${pe}</table></div>
      <div class="ajuste-ctl"><div class="horario mini"><label>Entrada <input type="time" data-aj="inicio" data-id="${esc(x.id)}" data-t="${i}" value="${h ? esc(hm(h[0])) : ''}"></label><label>Saída <input type="time" data-aj="fim" data-id="${esc(x.id)}" data-t="${i}" value="${h ? esc(hm(h[1])) : ''}"></label></div>
        <button type="button" class="btn mini" data-acao="pessoa-mais" data-id="${esc(x.id)}" data-t="${i}">Mais uma pessoa</button>
        <button type="button" class="btn mini" data-acao="pessoa-menos" data-id="${esc(x.id)}" data-t="${i}"${g.linhas.length < 2 ? ' disabled' : ''}>Uma pessoa a menos</button>
        ${aj ? `<button type="button" class="btn mini" data-acao="desfazer" data-id="${esc(x.id)}" data-t="${i}">Desfazer os ajustes</button>` : ''}</div>
      ${aj ? vConferencia(x, i) : ''}</div>`;
  }
  const memoAj = new Map();
  function conferir(x, i) {
    const g = S.ajustes[chaveAj(x.id, i)], k = chaveAj(x.id, i) + '|' + JSON.stringify(g.linhas.map((l) => [l.dias.join(''), l.horas.map((h) => (h ? h[0] + '-' + h[1] : '')).join(','), !!l.nova])) + '|' + S.k;
    if (!memoAj.has(k)) { if (memoAj.size > 60) memoAj.clear(); const pt = S.partes[i]; memoAj.set(k, E.conferirAjuste(x.partes[i], g, pt.op, pt.m, pt.cen)); }
    return memoAj.get(k);
  }
  function vConferencia(x, i) {
    const v = conferir(x, i);
    if (v.erro) return `<div class="conf nok"><p>Não foi possível conferir o ajuste: ${esc(v.erro)}</p></div>`;
    const pior = [v.e1, v.e2].some((s) => s.nivel === 'nao') ? 'nok' : [v.e1, v.e2].some((s) => s.nivel === 'norma') ? 'pend' : 'ok';
    const hoje = x.partes[i].fatos.custo.hoje, c2 = v.custo && v.custo.e2 ? v.custo.e2.total : null;
    return `<div class="conf ${pior}" aria-live="polite"><h5>Com os seus ajustes${varios() ? ' no ' + ROT[i] : ''}</h5>
      <div class="etapas">${FASES.map(([f, rot]) => { const s = v[f]; return `<div class="etapa"><span class="eyebrow">${rot}</span><p>${pill(s)} ${certTag(s)}</p>${s.det ? `<p class="det">${esc(s.det)}</p>` : ''}</div>`; }).join('')}</div>
      <p class="det">${plural(v.pessoas, 'pessoa', 'pessoas')}${v.novas ? ' (' + plural(v.novas, 'nova', 'novas') + ')' : ''}${v.porDia ? ' · ' + esc(v.porDia.texto) + ' por dia, hoje ' + esc(v.porDia.hoje) : ''}${c2 != null && hoje != null ? ' · folha de ' + reais(c2) + (Math.abs(c2 - hoje) >= 1 ? ' (' + (c2 > hoje ? '+' : '−') + ' ' + reais(c2 - hoje) + ' em relação a hoje)' : ', igual à de hoje') : ''}.</p>
      ${v.problemas.length ? `<ul class="fund">${v.problemas.slice(0, 8).map((q) => `<li>${esc(q)}</li>`).join('')}${v.problemas.length > 8 ? `<li>e mais ${v.problemas.length - 8}</li>` : ''}</ul>` : ''}
      ${x.partes[i].c.grade && x.partes[i].c.grade2 && x.partes[i].c.grade !== x.partes[i].c.grade2 ? '<p class="det">O ajuste parte da escala a partir de 16/12/2027 e é conferido nas duas etapas.</p>' : ''}</div>`;
  }

  /* ================================================================ calendário (opcional) */

  const Z0 = M.lerData(E.CAL_INI), NDIAS = M.lerData(E.CAL_FIM) - Z0 + 1;
  const FERIADOS = (() => { const m = new Map(); for (const a of [2026, 2027]) for (const f of M.feriadosNacionais(a)) { const i = f.data - Z0; if (i >= 0 && i < NDIAS) m.set(i, f.nome); } return m; })();
  const MESES_CAL = (() => { const out = []; for (let i = 0; i < NDIAS; i++) { const c = M.civil(Z0 + i); const k = c.a * 12 + c.m - 1; if (!out.length || out[out.length - 1].k !== k) out.push({ k: k, a: c.a, m: c.m, ini: i }); } return out; })();
  /** As fontes do calendário de uma escala: os grupos e as regras de cada turno, com os ajustes do teste quando houver. */
  function fontesCal(x) {
    const liminar = !S.op.ref.semLiminar, fl = { insalubre: !!S.op.ref.insalubre, revezamento: !!S.op.ref.revezamento };
    return x.partes.map((p, i) => {
      const pt = S.partes[i], aj = S.ajustes[chaveAj(x.id, i)];
      const op = x.id === 'hoje' && pt.diag && pt.diag.op ? pt.diag.op : { atividade: pt.m.atividade, instrumentos: p.c.instrumentos || [], liminar: liminar, insalubre: fl.insalubre, revezamento: fl.revezamento };
      const grupos = aj ? E.gruposEditados(aj) : E.gruposNoPeriodo(p.c.grupos, E.CAL_INI);
      return { grupos: grupos, op: op, chave: x.id + '|' + i + '|' + S.k + '|' + (aj ? JSON.stringify(aj.linhas.map((l) => [l.dias.join(''), l.horas.map((h) => (h ? h[0] + '-' + h[1] : '')).join(',')])) : '-'), grade: aj || (x.id === 'hoje' ? p.c.grade : gradeBase(p)) };
    });
  }
  function calDe(x) {
    const fs = fontesCal(x), k = fs.map((f) => f.chave).join('||');
    if (!S.cal.has(k)) {
      S.cal.set(k, { estado: 'calc' });
      Promise.all(fs.map((f) => pedir({ tipo: 'cal', grupos: f.grupos, op: f.op, inicio: E.CAL_INI, fim: E.CAL_FIM })))
        .then((rs) => { S.cal.set(k, { estado: 'ok', rs: rs, fs: fs }); })
        .catch((e) => { S.cal.set(k, { estado: 'erro', erro: e.message }); })
        .then(() => { const n = document.querySelector(`[data-cal="${CSS.escape(x.id)}"]`); if (n && n.open) n.querySelector('.cal-corpo').innerHTML = vCalCorpo(x); });
    }
    return S.cal.get(k);
  }
  /** Situação de cada dia, somando os turnos: 'n' não cumpre, 'p' depende de acordo ou fica abaixo da necessidade, 'ok', 'x' sem expediente. */
  function diasCal(c) {
    const out = [];
    const dem = S.est.demanda;
    for (let i = 0; i < NDIAS; i++) {
      let n = 0, st = 'ok';
      c.rs.forEach((r) => { n += (r.dias[i] || { t: [] }).t.length; });
      for (const r of c.rs) for (const a of r.achados) if (i >= a[4] && i <= a[5]) { if (a[2] === 'n') st = 'n'; else if (st !== 'n') st = 'p'; }
      const wd = M.diaSemana(Z0 + i);
      // dia sem expediente fica cinza, mesmo dentro de uma semana que não cumpre: o problema é da semana, não do dia
      if (n === 0 && !(dem[wd] > 0)) st = 'x';
      else if (st === 'ok' && n < (dem[wd] || 0)) st = 'p';
      out.push({ n: n, st: st });
    }
    return out;
  }
  const ST_CAL = { ok: 'cumpre', p: 'atenção', n: 'não cumpre', x: 'sem expediente' };
  function vCalCorpo(x) {
    const c = calDe(x);
    if (c.estado === 'calc') return '<p class="det">Montando o calendário, dia a dia…</p>';
    if (c.estado === 'erro') return `<p class="aviso">Não foi possível montar o calendário: ${esc(c.erro)}</p>`;
    const dias = diasCal(c), mi = Math.min(S.calMes[x.id] || 0, MESES_CAL.length - 1), mes = MESES_CAL[mi];
    const fimMes = mi + 1 < MESES_CAL.length ? MESES_CAL[mi + 1].ini : NDIAS;
    const pri = M.civil(Z0 + mes.ini), wd0 = M.diaSemana(Z0 + mes.ini) - (pri.d - 1) % 7;
    const offset = ((wd0 % 7) + 7) % 7;
    const cels = [];
    for (let k = 0; k < offset; k++) cels.push('<span class="cd vazio"></span>');
    // dias do mês antes de 16/12/2026 ficam vazios
    for (let d = 1; d < pri.d; d++) cels.push(`<span class="cd fora">${d}</span>`);
    for (let i = mes.ini; i < fimMes; i++) {
      const dc = M.civil(Z0 + i), q = dias[i], fer = FERIADOS.get(i), sel = S.calDia[x.id] === i;
      cels.push(`<button type="button" class="cd s-${q.st}${fer ? ' fer' : ''}" data-acao="cal-dia" data-id="${esc(x.id)}" data-v="${i}" aria-pressed="${sel}" aria-label="${dc.d} de ${MESES[dc.m - 1]}: ${q.n} ${q.n === 1 ? 'pessoa' : 'pessoas'}, ${ST_CAL[q.st]}${fer ? ', feriado: ' + esc(fer) : ''}"><b>${dc.d}</b><i>${q.st === 'x' ? '–' : q.n}</i>${q.st === 'n' ? '<em>✕</em>' : q.st === 'p' ? '<em>!</em>' : ''}</button>`);
    }
    const resumo = { n: 0, p: 0 }; dias.forEach((q) => { if (q.st === 'n') resumo.n++; if (q.st === 'p') resumo.p++; });
    return `<div class="cal-nav"><button type="button" class="btn mini" data-acao="cal-mes" data-id="${esc(x.id)}" data-v="${mi - 1}"${mi === 0 ? ' disabled' : ''} aria-label="Mês anterior">‹</button><b>${MESES[mes.m - 1].charAt(0).toUpperCase() + MESES[mes.m - 1].slice(1)} de ${mes.a}</b><button type="button" class="btn mini" data-acao="cal-mes" data-id="${esc(x.id)}" data-v="${mi + 1}"${mi + 1 >= MESES_CAL.length ? ' disabled' : ''} aria-label="Próximo mês">›</button></div>
      <div class="cal-grade" role="group" aria-label="Dias de ${MESES[mes.m - 1]} de ${mes.a}">${DIAS.map((d) => `<span class="cd cab">${d}</span>`).join('')}${cels.join('')}</div>
      <p class="leg-cal"><span class="cd s-ok"></span>cumpre <span class="cd s-p"></span>atenção (!) <span class="cd s-n"></span>não cumpre (✕) <span class="cd s-x"></span>sem expediente <span class="cd fer"></span>feriado nacional</p>
      ${ajCal(x)}<p class="det">De 16/12/2026 a 31/12/2027: ${resumo.n ? plural(resumo.n, 'dia que não cumpre', 'dias que não cumprem') : 'nenhum dia que não cumpre'} e ${plural(resumo.p, 'dia de atenção', 'dias de atenção')}. O número em cada dia é o de pessoas trabalhando${varios() ? ', somando os turnos' : ''}. Clique num dia para ver quem trabalha e por quê.</p>
