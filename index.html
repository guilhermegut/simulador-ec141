      feriados = E.feriados.map((f) => ({ data: lerData(f.data), nome: f.nome || 'Feriado', esfera: f.esfera || 'municipal', base: f.base || null })).filter((f) => f.data != null);
    } else {
      feriados = [];
      const a0 = civil(horizonte.inicio).a - 1, a1 = civil(horizonte.fim).a + 1;
      for (let a = a0; a <= a1; a++) { feriados.push(...feriadosNacionais(a)); feriados.push(...feriadosEstaduais(empresa.uf, a)); }
      for (const f of (E.feriadosAdicionais || [])) { const d = lerData(f.data); if (d != null) feriados.push({ data: d, nome: f.nome || 'Feriado', esfera: f.esfera || 'municipal', base: f.base || null }); }
    }

    const instrumentos = [];
    (E.instrumentos || []).forEach((x, i) => {
      const meta = TIPOS_INSTRUMENTO[x.tipo];
      if (!meta) { err('instrumentos, linha ' + (i + 1), 'Tipo de instrumento desconhecido: ' + x.tipo); return; }
      const ab = x.abrangencia || { todos: true };
      instrumentos.push({
        id: x.id || x.tipo + '-' + (i + 1), tipo: x.tipo, nome: x.nome || meta.nome,
        natureza: x.natureza || meta.natureza,
        celebracao: lerData(x.celebracao),
        vigenciaInicio: lerData(x.vigenciaInicio) != null ? lerData(x.vigenciaInicio) : -1e9,
        vigenciaFim: lerData(x.vigenciaFim),
        compativel: x.compativel == null ? null : !!x.compativel,
        compativel40: x.compativel40 == null ? null : !!x.compativel40,
        abrangencia: { todos: !!ab.todos, setores: (ab.setores || []).map(String), empregados: (ab.empregados || []).map(String) },
        parametros: x.parametros || {},
      });
    });

    const setores = new Map();
    (E.setores || []).forEach((s) => {
      const id = String(s.id);
      const nec = (s.necessidade || []).map((n) => ({ dias: n.dias || [0, 1, 2, 3, 4, 5, 6], inicio: lerHora(n.inicio), fim: lerHora(n.fim), pessoas: Number(n.pessoas) || 0 }))
        .filter((n) => n.inicio != null && n.fim != null);
      const exc = (s.excecoes || []).map((n) => ({ data: lerData(n.data), inicio: lerHora(n.inicio), fim: lerHora(n.fim), pessoas: Number(n.pessoas) || 0 }))
        .filter((n) => n.data != null && n.inicio != null && n.fim != null);
      setores.set(id, { id: id, nome: s.nome || id, necessidade: nec, excecoes: exc });
    });

    const tetoRGPS = Object.assign({ 2026: 847555 }, {});
    for (const k of Object.keys(E.tetoRGPS || {})) { const v = centavos(E.tetoRGPS[k]); if (v != null) tetoRGPS[k] = v; }

    return {
      __normalizado: true, erros: erros, empresa: empresa, horizonte: horizonte, turnos: turnos, escalas: escalas,
      empregados: empregados, atribuicoes: atribuicoes, excecoes: excecoes, feriados: feriados,
      instrumentos: instrumentos, setores: setores, tetoRGPS: tetoRGPS, semanaInicio: E.semanaInicio || 0,
    };
  }

  /* ============================================================ contexto */

  function criarContexto(dados, cfg, D) {
    const si = cfg.semanaInicio;
    const h0 = dados.horizonte.inicio, h1 = dados.horizonte.fim;
    const c0 = civil(h0), c1 = civil(h1);
    const mesIni = diaDe(c0.a, c0.m, 1), mesFim = diaDe(c1.a, c1.m, diasNoMes(c1.a, c1.m));
    const semIni = inicioSemana(h0, si), semFim = inicioSemana(h1, si);
    const janela = { a: Math.min(mesIni, semIni) - 35, b: Math.max(mesFim, semFim + 6) + 35 };
    const feriados = new Map();
    for (const f of dados.feriados) if (!feriados.has(f.data)) feriados.set(f.data, f);
    const atrib = new Map();
    for (const x of dados.atribuicoes) { if (!atrib.has(x.empregado)) atrib.set(x.empregado, []); atrib.get(x.empregado).push(x); }
    for (const l of atrib.values()) l.sort((p, q) => p.inicio - q.inicio);
    const exc = new Map();
    for (const x of dados.excecoes) {
      if (!exc.has(x.empregado)) exc.set(x.empregado, new Map());
      const m = exc.get(x.empregado);
      if (!m.has(x.data)) m.set(x.data, []);
      m.get(x.data).push(x);
    }
    return {
      dados: dados, cfg: cfg, D: D, si: si, h0: h0, h1: h1, mesIni: mesIni, mesFim: mesFim, semIni: semIni, semFim: semFim,
      janela: janela, feriados: feriados, atrib: atrib, exc: exc, turnos: dados.turnos, escalas: dados.escalas,
      rural: dados.empresa.atividade === 'rural' ? dados.empresa.ruralTipo : null,
      comercio: dados.empresa.atividade === 'comercio', cacheCiclo: new Map(),
    };
  }

  /* ================================================== expansão da escala */

  function expandir(emp, ctx) {
    const A = ctx.janela.a, B = ctx.janela.b;
    const atr = ctx.atrib.get(emp.id) || [];
    const exc = ctx.exc.get(emp.id) || new Map();
    const dias = new Array(B - A + 1);
    for (let d = A; d <= B; d++) {
      let at = null;
      for (let j = atr.length - 1; j >= 0; j--) {
        const x = atr[j];
        if (x.inicio <= d && (x.fim == null || d <= x.fim)) { at = x; break; }
      }
      const esc = at ? ctx.escalas.get(at.escala) : null;
      const base = esc ? esc.dias[mod(d - at.ancora, esc.dias.length)] : null;
      const servico = d >= emp.admissao && (emp.desligamento == null || d <= emp.desligamento);
      const lista = exc.get(d) || [];
      let marca = null, troca = null, ferTrab = false;
      const extras = [];
      for (const e of lista) {
        if (MARCAS.has(e.tipo)) marca = e.tipo;
        else if (e.tipo === 'troca') troca = e.turno;
        else if (e.tipo === 'extra') extras.push(e.turno);
        else if (e.tipo === 'feriado_trabalhado') ferTrab = true;
      }
      const fer = ctx.feriados.get(d) || null;
      const turnos = [];
      let estado;
      if (!servico) estado = 'fora';
      else if (!esc && !troca && !extras.length) estado = 'sem_escala';
      else if (marca && marca !== 'folga') estado = marca;
      else {
        let t = marca === 'folga' ? null : base;
        if (troca) t = troca;
        if (t && fer && !troca && !ferTrab && !(esc && esc.trabalhaFeriados)) { estado = 'feriado'; t = null; }
        if (t) turnos.push(t);
        for (const x of extras) turnos.push(x);
        if (!estado) estado = turnos.length ? 'trabalho' : 'folga';
      }
      dias[d - A] = {
        d: d, servico: servico, estado: estado, marca: marca, fer: fer, base: base,
        escala: esc ? esc.id : null, especial: esc ? esc.especial : null, turnos: turnos, ciclo: esc ? esc.dias.length : 0,
        feriadoTrabalhado: !!(fer && turnos.length),
      };
    }
    return dias;
  }

  /* ================================================== medição dos turnos */

  function instanciar(t, d, especial) {
    const ini = d * DIA + t.inicio;
    return {
      dia: d, turno: t.id, ini: ini, fim: ini + t.duracao, especial: especial || null,
      pausas: t.pausas.map((p) => ({ ini: ini + p.offset, fim: ini + p.offset + p.duracao, tipo: p.tipo })),
    };
  }
  function segmentosTrabalho(x) {
    const segs = [];
    let c = x.ini;
    for (const p of x.pausas) {
      if (p.tipo !== 'usufruido') continue;
      if (p.ini > c) segs.push([c, p.ini]);
      c = Math.max(c, p.fim);
    }
    if (x.fim > c) segs.push([c, x.fim]);
    return segs;
  }
  function sobrepor(a, b, c, d) { return Math.max(0, Math.min(b, d) - Math.max(a, c)); }
  function janelaNoturna(k, rural) {
    if (rural === 'lavoura') return [k * DIA + 1260, k * DIA + 1740];
    if (rural === 'pecuaria') return [k * DIA + 1200, k * DIA + 1680];
    return [k * DIA + 1320, k * DIA + 1740];
  }
  function minutosNoturnos(a, b, rural) {
    const i0 = rural === 'lavoura' ? 1260 : rural === 'pecuaria' ? 1200 : 1320;
    const i1 = rural === 'pecuaria' ? 1680 : 1740;
    let n = 0;
    const kf = Math.floor(b / DIA);
    for (let k = Math.floor(a / DIA) - 1; k <= kf; k++) {
      const ws = k * DIA + i0, we = k * DIA + i1;
      const x = (b < we ? b : we) - (a > ws ? a : ws);
      if (x > 0) n += x;
    }
    return n;
  }

  /**
   * Mede um turno: minutos de relógio, unidades computadas (1/7 min) e minutos noturnos,
   * por dia civil. Hora reduzida das 22h às 5h (art. 73, § 1º); prorrogação de jornada
   * integralmente noturna (Súmula 60, II; art. 73, § 5º) conforme configuração; na 12x36,
   * prorrogação compensada (art. 59-A, parágrafo único). Rural: sem hora reduzida (Lei 5.889/1973).
   */
  function medir(x, ctx) {
    const rural = ctx.rural;
    let prorrog = null;
    for (let k = Math.floor(x.ini / DIA) - 1; k <= Math.floor(x.fim / DIA); k++) {
      const ws = k * DIA + 1320, we = k * DIA + 1740;
      if (x.ini <= ws && x.fim >= we) { if (x.fim > we) prorrog = [we, x.fim]; break; }
    }
    const reduz = !rural && !!prorrog && ctx.cfg.prorrogacaoReduzida && x.especial !== '12x36';
    const adic = !!prorrog && x.especial !== '12x36';
    const segs = segmentosTrabalho(x);
    const porDia = [];
    let rel = 0, comp = 0, noct = 0, noctUrb = 0;
    for (const s of segs) {
      let a = s[0];
      while (a < s[1]) {
        const b = Math.min(s[1], (Math.floor(a / DIA) + 1) * DIA);
        const r = b - a;
        const nUrb = minutosNoturnos(a, b, null);
        const n = rural ? minutosNoturnos(a, b, rural) : nUrb;
        const p = prorrog ? sobrepor(a, b, prorrog[0], prorrog[1]) : 0;
        const red = rural ? 0 : nUrb + (reduz ? p : 0);
        const c = U * r + red;
        const na = n + (adic && !rural ? p : 0);
        const dia = Math.floor(a / DIA);
        let q = porDia.length ? porDia[porDia.length - 1] : null;
        if (!q || q.dia !== dia) { q = { dia: dia, rel: 0, comp: 0, noct: 0 }; porDia.push(q); }
        q.rel += r; q.comp += c; q.noct += na;
        rel += r; comp += c; noct += na; noctUrb += nUrb;
        a = b;
      }
    }
    x.segmentos = segs; x.porDia = porDia; x.rel = rel; x.comp = comp; x.noct = noct; x.noctUrb = noctUrb;
    x.prorrogacao = prorrog ? prorrog[1] - prorrog[0] : 0;
    return x;
  }

  /* ============================================================ repousos */

  /**
   * Fórmula padrão (seção 4.4): para cada intervalo livre G entre o fim de um turno e o início
   * do seguinte, com k folgas programadas entre os dias de início, r = min(k, ⌊(G − 11 h) ÷ 24 h⌋)
   * se G ≥ 35 h (Súmula 110 do TST). Os r repousos vão às folgas em ordem cronológica.
   * Também calcula o método de blocos (versão anterior).
   */
  function calcularRepousos(insts, folga, janela) {
    const rep = new Set(), semRep = [], blocos = new Set(), intervalos = [];
    // Antes do primeiro turno e depois do último não há jornada que limite o descanso: as folgas programadas contam como repouso.
    if (janela) {
      const prim = insts.length ? insts[0].dia : janela.b + 1;
      for (let x = janela.a; x < prim; x++) if (folga(x)) rep.add(x);
      if (insts.length) for (let x = insts[insts.length - 1].dia + 1; x <= janela.b; x++) if (folga(x)) rep.add(x);
    }
    for (let i = 0; i + 1 < insts.length; i++) {
      const s1 = insts[i], s2 = insts[i + 1];
      const G = s2.ini - s1.fim;
      const fol = [];
      for (let x = s1.dia + 1; x < s2.dia; x++) if (folga(x)) fol.push(x);
      const k = fol.length;
      const r = G >= 35 * 60 ? Math.min(k, Math.floor((G - 660) / 1440)) : 0;
      for (let j = 0; j < r; j++) rep.add(fol[j]);
      for (let j = r; j < k; j++) semRep.push({ dia: fol[j], G: G });
      if (G >= 35 * 60) {
        const nb = Math.floor((G - 660) / 1440);
        for (let j = 0; j < nb; j++) blocos.add(Math.floor((s1.fim + 660 + j * 1440) / DIA));
      }
      intervalos.push({ de: s1, ate: s2, G: G, k: k, r: r });
    }
    return { rep: rep, semRep: semRep, blocos: blocos, intervalos: intervalos };
  }

  /* ======================================================= instrumentos */

  function situacaoInstrumento(i, d, D) {
    if (d < i.vigenciaInicio || (i.vigenciaFim != null && d > i.vigenciaFim)) return null;
    // Regime que a Constituição ou a lei reservam à negociação coletiva (média de repousos do § 2º, ampliação do art. 7º,
    // turno ininterrupto de até 8 h, banco anual etc.) não produz efeito quando cadastrado como acordo individual.
    const meta = TIPOS_INSTRUMENTO[i.tipo];
    if (meta && meta.natureza === 'coletivo' && i.natureza !== 'coletivo') {
      return { ok: false, nota: 'cadastrado como ' + (i.natureza || 'acordo individual') + ', mas o regime depende de convenção ou acordo coletivo (' + meta.base + ')' };
    }
    if (i.natureza === 'coletivo' && d >= D.art3) {
      if (i.compativel === false) return { ok: false, nota: 'cláusula sem efeito desde ' + fmtData(D.art3) + ' (Emenda Constitucional 141/2026 – Fim da 6x1, art. 3º)' };
      if (d >= D.teto40 && i.compativel40 === false) return { ok: false, nota: 'cláusula incompatível com o teto de 40 h' };
      if (i.celebracao != null && i.celebracao < D.publicacao && i.compativel !== true) {
        return { ok: false, nota: 'instrumento anterior à Emenda Constitucional 141/2026 (Fim da 6x1) sem verificação de compatibilidade (art. 3º)' };
      }
    }
    return { ok: true, nota: null };
  }
  function abrange(i, emp) {
    const a = i.abrangencia;
    return a.todos || a.empregados.indexOf(emp.id) >= 0 || (emp.setor && a.setores.indexOf(emp.setor) >= 0);
  }
  function buscarInstrumento(ctx, emp, tipos, d, filtro) {
    let melhor = null;
    for (const i of ctx.dados.instrumentos) {
      if (tipos.indexOf(i.tipo) < 0 || !abrange(i, emp)) continue;
      if (filtro && !filtro(i)) continue;
      const s = situacaoInstrumento(i, d, ctx.D);
      if (!s) continue;
      if (s.ok) return { instr: i, ok: true, nota: null };
      if (!melhor) melhor = { instr: i, ok: false, nota: s.nota };
    }
    return melhor;
  }
  function textoInstrumento(tipos) {
    return tipos.map((t) => TIPOS_INSTRUMENTO[t].nome.toLowerCase() + ' (' + TIPOS_INSTRUMENTO[t].base + ')').join(' ou ');
  }

  /* ================================================== status e achados */

  function peso(a) {
    switch (a.status) {
      case 'nao_cumpre': return 5;
      case 'condicao': return a.atendida ? 3 : 4;
      case 'cumpre': return 2;
      case 'info': return 1;
      default: return 0;
    }
  }
  function pior(lista) {
    let p = null;
    for (const a of lista) if (!p || peso(a) > peso(p)) p = a;
    return p;
  }
  function condicao(tipos, ctx, emp, d) {
    const b = buscarInstrumento(ctx, emp, tipos, d);
    return {
      status: 'condicao', instrumento: tipos[0], exige: textoInstrumento(tipos), atendida: !!(b && b.ok),
      nota: b ? (b.ok ? 'cadastrado: ' + b.instr.nome : b.nota) : 'não cadastrado',
    };
  }

  /* ========================================================= tetos */

  function criarTetos(emp, ctx) {
    const cfg = ctx.cfg, D = ctx.D, si = ctx.si;
    const contrato = emp.contratoPublico;
    const lim9 = cfg.liminar !== false;
    const apl9 = contrato ? (lim9 ? (contrato.aditamento != null ? Math.min(contrato.aditamento, D.art9Liminar) : D.art9Liminar) : (contrato.aditamento != null ? contrato.aditamento : D.art9)) : null;
    function teto(d) {
      if (cfg.cenario === '42') return 42;
      if (cfg.cenario === '40') return 40;
      if (contrato && d < apl9) return 44;
      return d < D.teto42 ? 44 : d < D.teto40 ? 42 : 40;
    }
    function xv(d) {
      if (d < D.xv) return false;
      if (contrato && cfg.art9 === 'diferido' && d < apl9) return false;
      return true;
    }
    function tetoEf(d) {
      if (cfg.transicao !== 'semana') return teto(d);
      const w = inicioSemana(d, si);
      let m = 99;
      for (let k = 0; k < 7; k++) m = Math.min(m, teto(w + k));
      return m;
    }
    /** Limite diário (unidades) para compensação: teto ÷ 7; sem norma do art. 7º nem regime do § 2º, e na leitura padrão de J1, limitado a 40 h ÷ 7 quando já vigoram dois repousos. */
    function baseDia(d, comNorma) {
      const t = tetoEf(d);
      if (comNorma || cfg.leitura8h24 === 'individual' || !xv(d)) return t * 60;
      return Math.min(t, 40) * 60;
    }
    return { teto: teto, xv: xv, tetoEf: tetoEf, baseDia: baseDia, apl9: apl9 };
  }

  /* ========================================================= art. 8º */

  function remuneracaoEm(emp, d) {
    let v = null;
    for (const r of emp.remuneracoes) if (r.desde <= d) v = r.valor;
    return v;
  }
  function art8(emp, d, ctx) {
    const ano = civil(d).a;
    if (!emp.nivelSuperior) return { enquadrado: false, motivo: 'sem diploma de nível superior' };
    if (emp.empregadoPublico && !(emp.estatalConcorrencial && !(ctx.cfg && ctx.cfg.liminar === false))) return { enquadrado: false, motivo: 'empregado público (art. 8º, § 1º)' };
    const rem = remuneracaoEm(emp, d);
    if (rem == null) return { enquadrado: false, motivo: 'remuneração não informada' };
    const teto = ctx.dados.tetoRGPS[ano];
    if (teto == null) return { enquadrado: false, motivo: 'teto do RGPS de ' + ano + ' não informado' };
    if (2 * rem < 5 * teto) return { enquadrado: false, motivo: 'remuneração de ' + fmtReais(rem) + ' abaixo de 2,5 × ' + fmtReais(teto) };
    if (emp.controleMantido) return { enquadrado: false, motivo: 'controle mantido por liberalidade ou norma coletiva (art. 8º, caput, parte final)' };
    return { enquadrado: true, motivo: 'diploma de nível superior e remuneração de ' + fmtReais(rem) + ' ≥ 2,5 × ' + fmtReais(teto) };
  }

  /* ===================================================== média do ciclo 12x36 */

  function mediaCiclo(escId, ctx) {
    const chave = escId + '|' + ctx.cfg.medida + '|' + ctx.cfg.prorrogacaoReduzida;
    if (ctx.cacheCiclo.has(chave)) return ctx.cacheCiclo.get(chave);
    const esc = ctx.escalas.get(escId);
    let tot = 0;
    esc.dias.forEach((tid, i) => {
      if (!tid) return;
      const x = medir(instanciar(ctx.turnos.get(tid), 100000 + i, esc.especial), ctx);
      tot += ctx.cfg.medida === 'relogio' ? x.rel * U : x.comp;
    });
    const r = { totalCiclo: tot, n: esc.dias.length };
    ctx.cacheCiclo.set(chave, r);
    return r;
  }

  /* ================================================ avaliação do empregado */

  function avaliarEmpregado(emp, ctx) {
    const cfg = ctx.cfg, D = ctx.D, si = ctx.si;
    const A = ctx.janela.a, N = ctx.janela.b - A + 1;
    const dias = expandir(emp, ctx);
    const reg = (d) => dias[d - A];
    const T0 = criarTetos(emp, ctx);
    // tetos e vigência do inciso XV pré-calculados por dia da janela
    const aTeto = new Int8Array(N), aTetoEf = new Int8Array(N), aXv = new Int8Array(N);
    for (let i = 0; i < N; i++) { aTeto[i] = T0.teto(A + i); aXv[i] = T0.xv(A + i) ? 1 : 0; }
    for (let i = 0; i < N; i++) {
      if (cfg.transicao !== 'semana') { aTetoEf[i] = aTeto[i]; continue; }
      const w = inicioSemana(A + i, si) - A;
      let m = 99;
      for (let k = 0; k < 7; k++) { const j = w + k; m = Math.min(m, j >= 0 && j < N ? aTeto[j] : T0.teto(A + j)); }
      aTetoEf[i] = m;
    }
    const T = {
      teto: (d) => { const i = d - A; return i >= 0 && i < N ? aTeto[i] : T0.teto(d); },
      xv: (d) => { const i = d - A; return i >= 0 && i < N ? aXv[i] === 1 : T0.xv(d); },
      tetoEf: (d) => { const i = d - A; return i >= 0 && i < N ? aTetoEf[i] : T0.tetoEf(d); },
      baseDia: (d, comNorma) => {
        const i = d - A;
        if (i < 0 || i >= N) return T0.baseDia(d, comNorma);
        const t = aTetoEf[i];
        if (comNorma || cfg.leitura8h24 === 'individual' || aXv[i] !== 1) return t * 60;
        return Math.min(t, 40) * 60;
      },
    };
    const medidaRel = cfg.medida === 'relogio';
    const art62 = emp.tipo === 'art62';

    const insts = [];
    for (const r of dias) for (const tid of r.turnos) {
      const t = ctx.turnos.get(tid);
      if (t) insts.push(medir(instanciar(t, r.d, r.especial), ctx));
    }
    insts.sort((p, q) => p.ini - q.ini || p.fim - q.fim);

    const rel = new Array(N).fill(0), comp = new Array(N).fill(0), noct = new Array(N).fill(0);
    const civ = new Array(N).fill(0), nIni = new Array(N).fill(0);
    for (const x of insts) {
      nIni[x.dia - A]++;
      for (const p of x.porDia) {
        const ic = p.dia - A;
        if (ic >= 0 && ic < N) civ[ic] += p.rel;
        const j = (cfg.turnoDia === 'civil' ? p.dia : x.dia) - A;
        if (j >= 0 && j < N) { rel[j] += p.rel; comp[j] += p.comp; noct[j] += p.noct; }
      }
    }
    const med = (i) => medidaRel ? rel[i] * U : comp[i];
    const medAlt = (i) => medidaRel ? comp[i] : rel[i] * U;

    const folga = (d) => { const r = reg(d); return !!r && r.estado === 'folga'; };
    const RP = calcularRepousos(insts, folga, ctx.janela);
    const repCal = new Set();
    for (const r of dias) if (r.estado === 'folga' && civ[r.d - A] === 0) repCal.add(r.d);

    const dependentes = new Set();
    if (cfg.sinalContrafactual) {
      const cf = insts.slice();
      let add = 0;
      for (const r of dias) {
        if (r.base && AUSENCIA_CONTRAFACTUAL.has(r.estado)) {
          const t = ctx.turnos.get(r.base);
          if (t) { cf.push(instanciar(t, r.d, r.especial)); add++; }
        }
      }
      if (add) {
        cf.sort((p, q) => p.ini - q.ini || p.fim - q.fim);
        const rcf = calcularRepousos(cf, folga, ctx.janela);
        for (const d of RP.rep) if (!rcf.rep.has(d)) dependentes.add(d);
      }
    }
    const semRep = new Set(RP.semRep.map((x) => x.dia));

    const trabalhou = (d) => {
      const i = d - A;
      if (i < 0 || i >= N) return false;
      return cfg.turnoDia === 'civil' ? civ[i] > 0 : nIni[i] > 0;
    };
    const emServico = (r) => !FORA_DE_SERVICO.has(r.estado);
    const art8Cache = new Map();
    const art8Dia = (d) => {
      const c = civil(d), k = c.a * 12 + c.m;
      if (!art8Cache.has(k)) art8Cache.set(k, art8(emp, diaDe(c.a, c.m, 1), ctx));
      return art8Cache.get(k);
    };
    const dispCache = new Int8Array(N);
    const dispensado = (d) => {
      if (art62) return true;
      const i = d - A;
      if (i < 0 || i >= N) return art8Dia(d).enquadrado;
      if (!dispCache[i]) dispCache[i] = art8Dia(d).enquadrado ? 1 : 2;
      return dispCache[i] === 1;
    };

    const achados = [];
    const push = (a) => { achados.push(a); return a; };

    /* ---------- sequências de dias trabalhados (R3) */
    const corridas = [];
    {
      let ini = null;
      for (let d = A; d <= ctx.janela.b + 1; d++) {
        if (d <= ctx.janela.b && trabalhou(d)) { if (ini == null) ini = d; }
        else if (ini != null) { corridas.push({ ini: ini, fim: d - 1, n: d - ini }); ini = null; }
      }
    }

    /**
     * Média do mês-calendário que contém o dia d (D119; Portaria MTE 2.041/2026, art. 3º: "o limite médio da duração semanal e
     * mensal do trabalho será aferido no mês-calendário"): horas do mês, na medida das regras de teto, contra o limite semanal
     * dividido por sete em cada dia em serviço, a mesma conta de J4 e J6. Antes (D108), a média se tomava no ciclo da escala.
     */
    function mediaMes(d) {
      const c = civil(d), ini = diaDe(c.a, c.m, 1), fim = ini + diasNoMes(c.a, c.m) - 1;
      let tot = 0, lim = 0, sv = 0;
      for (let x = Math.max(ini, A); x <= Math.min(fim, ctx.janela.b); x++) {
        if (emServico(dias[x - A])) { sv++; lim += T.tetoEf(x) * 60; }
        tot += med(x - A);
      }
      return { ok: tot <= lim + 1e-6, tot: tot, lim: lim, semanal: sv ? tot * 7 / sv : 0, rot: NOMES_MES[c.m - 1] + '/' + c.a };
    }

    /* ---------- semanas */
    const semanas = [];
    const instsSemana = new Map(), livresSemana = new Map();
    for (const x of insts) { const w = inicioSemana(x.dia, si); if (!instsSemana.has(w)) instsSemana.set(w, []); instsSemana.get(w).push(x); }
    for (const g of RP.intervalos) { const w = inicioSemana(g.ate.dia, si); if (!livresSemana.has(w)) livresSemana.set(w, []); livresSemana.get(w).push(g); }
    for (let ws = ctx.semIni; ws <= ctx.semFim; ws += 7) {
      const we = ws + 6;
      let dServ = 0, tRel = 0, tComp = 0, rp = 0, rc = 0, rb = 0, nFer = 0;
      const repDias = [];
      for (let k = 0; k < 7; k++) {
        const d = ws + k, i = d - A, r = dias[i];
        if (emServico(r)) dServ++;
        if (r.estado === 'feriado') nFer++;
        tRel += rel[i]; tComp += comp[i];
        if (RP.rep.has(d)) { rp++; repDias.push(d); }
        if (repCal.has(d)) rc++;
        if (RP.blocos.has(d)) rb++;
      }
      const tw = [];
      for (let k = 0; k < 7; k++) tw.push(T.teto(ws + k));
      const limU = cfg.transicao === 'semana' ? Math.min.apply(null, tw) * HORA : tw.reduce((s, x) => s + x, 0) * 60;
      let xvSem = false;
      if (cfg.transicao === 'semana') { for (let k = 0; k < 7; k++) if (T.xv(ws + k)) xvSem = true; }
      else xvSem = T.xv(ws);
      const totU = medidaRel ? tRel * U : tComp;
      const totAlt = medidaRel ? tComp : tRel * U;
      const sem = { ini: ws, fim: we, dServ: dServ, rel: tRel, comp: tComp, total: medidaRel ? tRel * U : tComp, feriados: nFer, repousos: rp, repCal: rc, repBlocos: rb, repDias: repDias, limite: limU, xv: xvSem };
      semanas.push(sem);
      const per = { tipo: 'semana', ini: ws, fim: we };
      const rotSem = fmtDataCurta(ws) + ' a ' + fmtData(we);

      /* R1 — dois repousos na semana */
      {
        const req = xvSem ? 2 : 1;
        // Semana parcial: os dias fora de serviço (férias, afastamento, antes da admissão ou depois do desligamento) contam como dias sem trabalho.
        const exig = dServ === 0 ? null : Math.max(0, req - (7 - dServ));
        sem.exigido = exig;
        const metodos = { padrao: rp, calendario: rc, blocos: rb };
        const diverge = rc !== rp || rb !== rp;
        const base = xvSem ? 'CF, art. 7º, XV (Emenda Constitucional 141/2026 – Fim da 6x1); Lei 605/1949, art. 1º' : 'CF, art. 7º, XV (redação anterior); Lei 605/1949, art. 1º';
        const conta = 'Repousos pela fórmula r = min(k, ⌊(G − 11 h) ÷ 24 h⌋)' + (repDias.length ? ': ' + repDias.map(fmtDataCurta).join(', ') : ': nenhum') +
          '. Calendário: ' + rc + '; blocos: ' + rb + '.' + (dServ < 7 && dServ > 0 ? ' Semana parcial: ' + dServ + ' dias em serviço e ' + (7 - dServ) + ' fora de serviço; exigência max(0, ' + req + ' − ' + (7 - dServ) + ') = ' + exig + '.' : '');
        if (exig == null) push({ regra: 'R1', periodo: per, status: 'na', porque: 'Semana inteira fora de serviço (férias, afastamento, sem escala ou fora do contrato).', base: base, conta: conta, valores: metodos });
        else if (rp >= exig) push({ regra: 'R1', periodo: per, status: 'cumpre', porque: rp + ' repouso(s) na semana de ' + rotSem + '; mínimo ' + exig + '.', base: base, conta: conta, valores: metodos, divergenciaMetodo: diverge });
        else push({ regra: 'R1', periodo: per, status: 'nao_cumpre', porque: rp + ' repouso(s) na semana de ' + rotSem + '; mínimo ' + exig + (xvSem ? ' desde a vigência do inciso XV.' : '.'), base: base, conta: conta, valores: metodos, divergenciaMetodo: diverge });
      }

      /* J3 — teto semanal */
      {
        const base = 'Emenda Constitucional 141/2026 (Fim da 6x1), art. 6º; CF, art. 7º, XIII';
        const so12 = (() => { let tem = false; for (let k = 0; k < 7; k++) { const r = dias[ws + k - A]; if (r.turnos.length) { if (r.especial !== '12x36') return false; tem = true; } } return tem; })();
        const conta = 'Horas da semana: ' + fmtHoras(totU) + (medidaRel ? ' de relógio' : ' computadas') + ' (' + fmtHoras(totAlt) + (medidaRel ? ' computadas' : ' de relógio') + '); limite ' + fmtHoras(limU) + '.';
        const valores = { total: totU, alternativa: totAlt, limite: limU, excedente: Math.max(0, totU - limU) };
        let disp = true; for (let k = 0; k < 7; k++) if (!dispensado(ws + k)) disp = false;
        if (disp && dServ > 0) push({ regra: 'J3', periodo: per, status: 'na', porque: art62 ? 'Empregado excluído do controle de jornada (CLT, art. 62).' : 'Empregado enquadrado no art. 8º da Emenda Constitucional 141/2026 (Fim da 6x1).', base: base, conta: conta, valores: valores });
        else if (so12) push({ regra: 'J3', periodo: per, status: 'na', porque: 'Escala 12x36: avaliada em J6.', base: base, conta: conta, valores: valores });
        else if (totU <= limU) push({ regra: 'J3', periodo: per, status: 'cumpre', porque: fmtHoras(totU) + ' na semana; teto de ' + fmtHoras(limU) + '.', base: base, conta: conta, valores: valores });
        else {
          const b = buscarInstrumento(ctx, emp, TIPOS_COMPENSACAO, ws);
          if (b && b.ok) push({ regra: 'J3', periodo: per, status: 'condicao', atendida: true, exige: textoInstrumento(TIPOS_COMPENSACAO), nota: 'cadastrado: ' + b.instr.nome,
            porque: 'Excedente de ' + fmtHoras(totU - limU) + ' sobre o teto, a ser absorvido no regime de compensação cadastrado (ver J4 ou J5).', base: base, conta: conta, valores: valores });
          else push({ regra: 'J3', periodo: per, status: 'nao_cumpre', porque: 'Excedente de ' + fmtHoras(totU - limU) + ' sobre o teto de ' + fmtHoras(limU) + ', sem regime de compensação cadastrado: o excedente é hora extra.', base: base, conta: conta, valores: valores });
        }
      }

      /* J1 e J2 — limites diários; R14 — jornadas especiais; R9 — menores e aprendizes */
      {
        const j1 = [], j2 = [], r14 = [], r9 = [];
        // Sem norma coletiva, a semana de dois repousos com mais de 40 h só se distribui pela liminar (dias de até 8h24, abaixo);
        // dias acima de 8h24 seguem a leitura do escritório (norma coletiva do art. 7º), com ou sem a liminar.
        const baseU = xvSem ? Math.min(limU, 40 * HORA) : limU;
        let nTrab = 0, maiorJ1 = 0;
        for (let k = 0; k < 7; k++) {
          const d = ws + k, i = d - A, r = dias[i];
          if (!r.turnos.length) continue;
          nTrab++;
          const m = med(i);
          if (!dispensado(d) && r.especial !== '12x36') maiorJ1 = Math.max(maiorJ1, m);
          const e12 = r.especial === '12x36';
          if (!dispensado(d)) {
            if (m > 8 * HORA && !e12) j1.push({ d: d, m: m });
            const relDia = rel[i];
            if (e12 ? relDia > 10 * 60 : m > 10 * HORA) j2.push({ d: d, m: m, rel: relDia, e12: e12 });
            if (emp.limiteDiario != null && m > emp.limiteDiario * HORA) r14.push({ d: d, m: m, tipo: 'diario' });
          }
          if (emp.tipo === 'menor') {
            for (const x of (instsSemana.get(ws) || [])) if (x.dia === d && x.noctUrb > 0) r9.push({ d: d, motivo: 'trabalho noturno (CLT, art. 404)' });
          }
          if (emp.tipo === 'aprendiz') {
            const lim = emp.aprendiz8h ? 8 : 6;
            if (rel[i] > lim * 60) r9.push({ d: d, motivo: 'aprendiz acima de ' + lim + ' h diárias (CLT, art. 432)' });
          }
        }
        {
          const e42 = cfg.liminar !== false && xvSem && limU > 40 * HORA && limU <= 42 * HORA;
          const c5 = nTrab === 5 || (nTrab < 5 && dServ < 7 && nTrab + (7 - dServ) >= 5);
          sem.lim42 = e42 && c5 && maiorJ1 <= 8 * HORA + 24 * U && emp.tipo !== 'aprendiz' && emp.tipo !== 'menor';
        }
        // J1
        const baseJ1 = 'CF, art. 7º, XIII; CLT, art. 59; Súmula 85 do TST';
        if (j1.length) {
          const diasTxt = j1.map((x) => fmtDataCurta(x.d) + ' (' + fmtHoras(x.m) + ')').join(', ');
          const conta = 'Dias acima de 8 h: ' + diasTxt + '. Semana: ' + fmtHoras(totU) + ' em ' + nTrab + (nTrab === 1 ? ' dia' : ' dias') + '; base compensável sem norma coletiva: ' + fmtHoras(baseU) + '; teto: ' + fmtHoras(limU) + '.';
          let a;
          // Liminar na ADI 8.041 (D101): na etapa de 42 h, sem norma coletiva, até 8h24 por dia para distribuir as 42 h em
          // cinco dias de trabalho, sem adicional; a semana com menos dias só por férias ou afastamento conta como de cinco.
          const etapa42 = cfg.liminar !== false && xvSem && limU > 40 * HORA && limU <= 42 * HORA;
          const cincoDias = nTrab === 5 || (nTrab < 5 && dServ < 7 && nTrab + (7 - dServ) >= 5);
          const liminarOk = etapa42 && cincoDias && maiorJ1 <= 8 * HORA + 24 * U && totU <= limU && emp.tipo !== 'aprendiz' && emp.tipo !== 'menor';
          if (emp.tipo === 'aprendiz') {
            a = { status: 'nao_cumpre', porque: 'Aprendiz não pode ter prorrogação nem compensação de jornada.', base: 'CLT, art. 432' };
          } else if (liminarOk) {
            a = { status: 'cumpre', liminar: true, porque: 'Dias de até 8h24 para distribuir as 42 h em cinco dias, sem norma coletiva e sem adicional sobre os 24 minutos, pela liminar na ADI 8.041 (12/11/2026, em vigor até o julgamento de mérito pelo Plenário).',
              base: 'STF, ADI 8.041 MC (12/11/2026), item I; Emenda Constitucional 141/2026 (Fim da 6x1), arts. 6º, I, e 7º' };
          } else if (totU <= baseU) {
            const tipos = TIPOS_COMPENSACAO;
            const filtro = emp.tipo === 'menor' ? (i) => i.natureza === 'coletivo' : null;
            const b = buscarInstrumento(ctx, emp, tipos, ws, filtro);
            a = { status: 'condicao', atendida: !!(b && b.ok), instrumento: emp.tipo === 'menor' ? 'compensacao_coletiva' : 'compensacao',
              exige: emp.tipo === 'menor' ? 'compensação por convenção ou acordo coletivo (CLT, art. 413, I)' : 'acordo de compensação (individual escrito ou coletivo)',
              nota: b ? (b.ok ? 'cadastrado: ' + b.instr.nome : b.nota) : 'não cadastrado',
              porque: 'Dias acima de 8 h compensados por horas não trabalhadas em dia útil da mesma semana.', base: baseJ1 };
          } else if (totU <= limU && limU > 40 * HORA) {
            if (cfg.leitura8h24 === 'coletiva') {
              const c = condicao(['ampliacao_art7'], ctx, emp, ws);
              a = Object.assign(c, { porque: 'Para distribuir mais de 40 h em até cinco dias é preciso ampliar a duração diária: não há dia útil a compensar, porque o sexto dia virou repouso. Leitura do escritório.' +
                (etapa42 ? ' A liminar na ADI 8.041 dispensa a norma coletiva só com dias de até 8h24 em semana de cinco dias de trabalho.' : ''), base: 'Emenda Constitucional 141/2026 (Fim da 6x1), art. 7º; CF, art. 7º, XIII' });
            } else {
              const b = buscarInstrumento(ctx, emp, TIPOS_COMPENSACAO, ws);
              a = { status: 'condicao', atendida: !!(b && b.ok), instrumento: 'compensacao', exige: 'acordo individual de compensação', nota: b ? (b.ok ? 'cadastrado: ' + b.instr.nome : b.nota) : 'não cadastrado',
                porque: 'Leitura alternativa: acordo individual de compensação basta para distribuir o teto semanal.', base: 'CF, art. 7º, XIII; CLT, art. 59, § 6º; Súmula 85, I, do TST' };
            }
          } else {
            // D108: semana de até 42 h acima do teto, com dias acima de 8 h, só com norma coletiva específica de compensação
            // pela média; D119: a média se confere no mês-calendário (Portaria MTE 2.041/2026, art. 3º), em cada mês que a
            // semana toca. Os repousos ficam com R1 e R2 (a média de repousos do mês só vale com a norma do § 2º e só quando
            // alguma semana tem menos de dois); antes, J1 os conferia de novo e reprovava um 5x2 em mês com oito dias de fim de semana.
            // D122: sem teto semanal, com a norma específica, a semana acima de 42 h também fecha pela média do mês
            const tiposM = totU <= 42 * HORA ? ['compensacao_media', 'compensacao_media_mes'] : ['compensacao_media_mes'];
            const bm = emp.tipo !== 'menor' ? buscarInstrumento(ctx, emp, tiposM, ws) : null;
            const semTeto = !!(bm && bm.ok && bm.instr.tipo === 'compensacao_media_mes'), tipoM = semTeto ? 'compensacao_media_mes' : 'compensacao_media';
            if (bm && bm.ok) {
              const hs = [mediaMes(ws), mediaMes(ws + 6)].filter((x, k, xs) => k === 0 || x.rot !== xs[0].rot), hRuim = hs.find((x) => !x.ok), ok = !hRuim;
              const txtH = hs.map((x) => x.rot + ', ' + fmtHoras(x.tot) + ' para o limite de ' + fmtHoras(x.lim) + ' (média de ' + fmtHoras(Math.round(x.semanal)) + ' por semana)').join('; ');
              a = { status: ok ? 'condicao' : 'nao_cumpre', atendida: ok ? true : undefined, instrumento: tipoM, exige: textoInstrumento([tipoM]), nota: 'cadastrado: ' + bm.instr.nome,
                porque: ok ? (semTeto ? 'Semana de ' + fmtHoras(totU) + ' fechada pela compensação pela média do mês em norma coletiva, sem teto semanal: no mês-calendário, ' + txtH + '.' + (totU > 42 * HORA ? ' Admitir semana acima de 42 h compensada no mês é leitura do escritório (D122), a validar.' : '')
                  : 'Semana de até 42 h fechada pela compensação pela média em norma coletiva: no mês-calendário, ' + txtH + '.')
                  : 'A norma coletiva de compensação pela média não fecha a semana: no mês-calendário, ' + hRuim.rot + ' soma ' + fmtHoras(hRuim.tot) + ', acima do limite de ' + fmtHoras(hRuim.lim) + '. O excedente é hora extra.',
                base: 'CF, art. 7º, XIII; Portaria MTE 2.041/2026, arts. 2º e 3º', valoresMedia: hs };
            } else {
              a = { status: 'nao_cumpre', porque: 'Horas acima de 8 h por dia sem dia útil a compensar na semana: o excedente é hora extra.' + (totU <= 42 * HORA && limU < totU ? ' Só norma coletiva específica de compensação pela média, com a média no teto, fecharia a semana (leitura do escritório).' : ''), base: baseJ1 };
            }
          }
          push(Object.assign({ regra: 'J1', periodo: per, conta: conta, valores: { dias: j1.map((x) => x.d), total: totU, base: baseU, limite: limU } }, a));
        } else {
          let maiorDia = 0;
          for (let k = 0; k < 7; k++) maiorDia = Math.max(maiorDia, med(ws + k - A));
          push({ regra: 'J1', periodo: per, status: dServ ? 'cumpre' : 'na', porque: 'Nenhum dia acima de 8 h.', base: baseJ1, valores: { maiorDia: maiorDia } });
        }
        // J2
        const baseJ2 = 'CLT, arts. 59 e 59-A';
        if (j2.length) {
          const parts = j2.map((x) => {
            if (x.e12) {
              if (x.rel > 12 * 60) return { status: 'nao_cumpre', porque: 'Plantão acima de 12 h na escala 12x36.', base: 'CLT, art. 59-A' };
              const c = condicao(['escala_12x36'], ctx, emp, x.d);
              return Object.assign(c, { porque: 'Plantão de 12 h: depende de acordo individual escrito ou norma coletiva.', base: 'CLT, art. 59-A' });
            }
            if (x.m <= 12 * HORA) {
              const b = buscarInstrumento(ctx, emp, ['jornada_12h'], x.d);
              if (b && b.ok) return { status: 'condicao', atendida: true, exige: textoInstrumento(['jornada_12h']), nota: 'cadastrado: ' + b.instr.nome,
                porque: 'Jornada acima de 10 h fora da 12x36 autorizada em norma coletiva; risco de questionamento, porque há decisões do TST que aplicam o limite de 10 h do art. 59, § 2º, da CLT. Admitir até 12 h por norma coletiva é leitura do escritório (art. 611-A, I; STF, Tema 1.046; D122), a validar.', base: 'CLT, art. 611-A, I; STF, Tema 1.046' };
            }
            return { status: 'nao_cumpre', porque: 'Jornada acima de 10 h fora da 12x36' + (x.m <= 12 * HORA ? ', sem norma coletiva específica.' : '.'), base: baseJ2 };
          });
          const w = pior(parts);
          push(Object.assign({ regra: 'J2', periodo: per, conta: j2.map((x) => fmtDataCurta(x.d) + ': ' + (x.e12 ? fmtMinutos(x.rel) + ' de relógio' : fmtHoras(x.m))).join('; '), valores: { dias: j2.map((x) => x.d) } }, w));
        } else push({ regra: 'J2', periodo: per, status: dServ ? 'cumpre' : 'na', porque: 'Nenhum dia acima de 10 h.', base: baseJ2, conta: '' });
        // R14
        if (emp.limiteDiario != null || emp.limiteSemanal != null) {
          const viol = r14.slice();
          if (emp.limiteSemanal != null && totU > emp.limiteSemanal * HORA && !dispensado(ws)) viol.push({ d: ws, m: totU, tipo: 'semanal' });
          push({ regra: 'R14', periodo: per, status: viol.length ? 'nao_cumpre' : 'cumpre',
            porque: viol.length ? 'Acima do limite especial do empregado (' + [emp.limiteDiario != null ? emp.limiteDiario + ' h por dia' : null, emp.limiteSemanal != null ? emp.limiteSemanal + ' h por semana' : null].filter(Boolean).join(', ') + ').' : 'Dentro do limite especial do empregado.',
            base: emp.baseLimite, conta: viol.map((x) => (x.tipo === 'semanal' ? 'semana' : fmtDataCurta(x.d)) + ': ' + fmtHoras(x.m)).join('; '), valores: { violacoes: viol.length } });
        }
        // R9
        if (emp.tipo === 'menor' || emp.tipo === 'aprendiz') {
          push({ regra: 'R9', periodo: per, status: r9.length ? 'nao_cumpre' : 'cumpre', porque: r9.length ? r9.map((x) => fmtDataCurta(x.d) + ': ' + x.motivo).join('; ') : 'Sem trabalho noturno e dentro do limite diário.',
            base: 'CLT, arts. 404, 413 e 432', conta: '' });
        }
      }

      /* R5 — interjornada; R6 — intervalo intrajornada; R7 — feriados */
      {
        const viol = [];
        for (const g of (livresSemana.get(ws) || [])) {
          if (g.G < 0) viol.push({ txt: 'turnos sobrepostos em ' + fmtDataCurta(g.ate.dia), G: g.G });
          else if (g.G < 660) viol.push({ txt: fmtDataCurta(g.de.dia) + ' ' + fmtHora(g.de.fim) + ' → ' + fmtDataCurta(g.ate.dia) + ' ' + fmtHora(g.ate.ini) + ': ' + fmtMinutos(g.G), G: g.G });
        }
        const base5 = 'CLT, art. 66; Súmula 110 do TST';
        const st5 = viol.length ? 'nao_cumpre' : (dServ ? 'cumpre' : 'na');
        const a5 = { regra: 'R5', periodo: per, status: st5, porque: viol.length ? 'Intervalo entre jornadas inferior a 11 h: ' + viol.map((v) => v.txt).join('; ') + '.' : 'Todos os intervalos entre jornadas têm ao menos 11 h.', base: base5, conta: '', valores: { violacoes: viol.length, menor: viol.length ? Math.min(...viol.map((v) => v.G)) : null } };
        if (art62) { a5.status = 'na'; a5.porque = 'Empregado excluído do controle de jornada (CLT, art. 62).'; }
        else if (dispensado(ws) && st5 !== 'na') { a5.valores.statusAvaliado = st5; a5.status = 'info'; a5.porque = 'Art. 8º da Emenda Constitucional 141/2026 (Fim da 6x1): leitura sobre a interjornada pendente de validação. Avaliação informativa: ' + a5.porque; }
        push(a5);

        const r6 = [];
        for (const x of (instsSemana.get(ws) || [])) r6.push(avaliarIntervalo(x, emp, ctx));
        const w6 = r6.length ? pior(r6) : null;
        const alertas6 = r6.some((a) => a.alertas.length) ? ALERTA_POSICAO.slice() : [];
        const a6 = w6 ? Object.assign({ regra: 'R6', periodo: per, alertas: alertas6, conta: r6.filter((a) => a.status !== 'cumpre').map((a) => a.conta).join('; ') }, w6)
          : { regra: 'R6', periodo: per, status: 'na', porque: 'Sem turnos na semana.', base: 'CLT, art. 71', conta: '' };
        a6.regra = 'R6'; a6.periodo = per;
        if (w6 && art62) { a6.status = 'na'; a6.porque = 'Empregado excluído do controle de jornada (CLT, art. 62).'; }
        else if (w6 && dispensado(ws) && a6.status !== 'cumpre') { a6.valores = { statusAvaliado: a6.status }; a6.status = 'info'; a6.porque = 'Art. 8º da Emenda Constitucional 141/2026 (Fim da 6x1): leitura sobre o intervalo pendente de validação. Avaliação informativa: ' + w6.porque; }
        push(a6);

        const fers = [];
        for (let k = 0; k < 7; k++) { const r = dias[ws + k - A]; if (r.feriadoTrabalhado) fers.push(r); }
        if (fers.length) {
          const parts = fers.map((r) => {
            if (r.especial === '12x36') return { status: 'cumpre', porque: 'Feriado em plantão 12x36 considerado compensado.', base: 'CLT, art. 59-A, parágrafo único' };
            if (ctx.comercio) {
              const b = buscarInstrumento(ctx, emp, ['feriado_comercio'], r.d);
              if (!b || !b.ok) return { status: 'nao_cumpre', porque: 'Trabalho em feriado no comércio sem autorização em convenção coletiva.', base: 'Lei 10.101/2000, art. 6º-A' };
            }
            let comp = false;
            for (let x = r.d - 6; x <= r.d + 13; x++) { const q = reg(x); if (q && q.marca === 'folga_comp') comp = true; }
            if (comp) return { status: 'cumpre', porque: 'Feriado trabalhado com folga compensatória registrada.', base: 'Lei 605/1949, art. 9º' };
            return { status: 'condicao', atendida: false, exige: 'folga compensatória ou pagamento em dobro (Lei 605/1949, art. 9º; Súmula 146 do TST)', nota: 'sem folga compensatória registrada', porque: 'Feriado trabalhado sem folga compensatória registrada: devido o pagamento em dobro.', base: 'Lei 605/1949, art. 9º; Súmula 146 do TST' };
          });
          push(Object.assign({ regra: 'R7', periodo: per, conta: fers.map((r) => fmtDataCurta(r.d) + ' (' + r.fer.nome + ')').join('; ') }, pior(parts)));
        }
      }
    }

    /** Saldo (em 1/7 de unidade) das semanas contra a base semanal. */
    function saldoSemanas(lista, comNorma) {
      let saldo7 = 0;
      const partes = [];
      for (const x of lista) {
        if (!x.dServ) continue;
        // Liminar na ADI 8.041 (D101): a semana de cinco dias de até 8h24 tem base nas próprias horas, até o teto de 42 h, sem
        // gerar crédito abaixo das 40 h (a liminar tira o adicional dos 24 minutos, não amplia a compensação).
        const base = (comNorma || cfg.leitura8h24 === 'individual' || !x.xv) ? x.limite : x.lim42 ? Math.min(x.limite, Math.max(40 * HORA, x.total)) : Math.min(x.limite, 40 * HORA);
        // Feriado não trabalhado em dia de escala reduz a base em base ÷ 5: as horas do feriado não geram crédito de compensação.
        // Semana parcial: capacidade de base ÷ 5 por dia em serviço, limitada à base; entra só com eventual excesso, sem gerar crédito.
        const semFer = Math.max(0, base - Math.floor(base * (x.feriados || 0) / 5));
        const d7 = x.dServ === 7 ? 7 * (x.total - semFer) : 7 * Math.max(0, x.total - Math.max(0, Math.min(base, Math.floor(base * x.dServ / 5)) - Math.floor(base * (x.feriados || 0) / 5)));
        saldo7 += d7;
        partes.push(fmtDataCurta(x.ini) + ': ' + (d7 >= 0 ? '+' : '−') + fmtHoras(Math.round(Math.abs(d7) / 7)));
      }
      return { saldo7: saldo7, texto: (partes.length ? partes.join('; ') : 'sem semanas') + ' → saldo ' + (saldo7 > 0 ? '+' : saldo7 < 0 ? '−' : '') + fmtHoras(Math.round(Math.abs(saldo7) / 7)) };
    }

    /* ---------- janelas de 28 dias (liminar na ADI 8.041, D102): com norma coletiva, os repousos se conferiam em qualquer
       período de quatro semanas seguidas. Desligadas por padrão desde a Portaria MTE 2.041/2026, que apura a média no
       mês-calendário (art. 4º, §§ 3º e 4º; D119); ficam só com cfg.janela28 */
    // As janelas começam na vigência dos dois repousos (16/12/2026): antes dela vale a regra de um repouso por semana (R1).
    const NJ = 28, BJ = ctx.janela.b;
    let pRep = null, pExig = null, xv0 = null;
    if (cfg.liminar !== false && cfg.janela28) {
      const n = BJ - A + 1;
      pRep = new Int32Array(n + 1); pExig = new Float64Array(n + 1);
      for (let i = 0; i < n; i++) {
        const d = A + i, sv = emServico(dias[i]);
        if (xv0 == null && T.xv(d)) xv0 = d;
        pRep[i + 1] = pRep[i] + (sv && RP.rep.has(d) ? 1 : 0);
        pExig[i + 1] = pExig[i] + (sv ? 2 / 7 : 0);
      }
    }
    /** A janela de 28 dias com menos folga entre as que tocam o período (ou o período inteiro, se a escala tiver menos de 28 dias). */
    function piorJanela(ini, fim) {
      let pior = null;
      const avalia = (a0, a1) => {
        const rp = pRep[a1 - A + 1] - pRep[a0 - A], ex = Math.ceil(pExig[a1 - A + 1] - pExig[a0 - A] - 1e-9);
        if (!pior || rp - ex < pior.folga) pior = { ini: a0, fim: a1, repousos: rp, exigidos: ex, folga: rp - ex };
      };
      const a0 = Math.max(A, xv0), s0 = Math.max(a0, ini - NJ + 1), s1 = Math.min(fim, BJ - NJ + 1);
      if (s0 <= s1) for (let x = s0; x <= s1; x++) avalia(x, x + NJ - 1);
      else if (Math.max(a0, ini) <= Math.min(BJ, fim)) avalia(Math.max(a0, ini), Math.min(BJ, fim));
      return pior;
    }

    /* ---------- meses */
    const meses = [];
    const c0 = civil(ctx.mesIni), c1 = civil(ctx.mesFim);
    const semFalhaR1 = achados.filter((a) => a.regra === 'R1' && a.status === 'nao_cumpre').map((a) => a.periodo);
    const instsMes = new Map();
    for (const x of insts) { const c = civil(x.dia); const k = diaDe(c.a, c.m, 1); if (!instsMes.has(k)) instsMes.set(k, []); instsMes.get(k).push(x); }
    for (let t = c0.a * 12 + c0.m - 1; t <= c1.a * 12 + c1.m - 1; t++) {
      const a = Math.floor(t / 12), m = t % 12 + 1, nd = diasNoMes(a, m);
      const ini = diaDe(a, m, 1), fim = ini + nd - 1;
      const per = { tipo: 'mes', ini: ini, fim: fim };
      const rot = NOMES_MES[m - 1] + '/' + a;
      let dServ = 0, fds = 0, tRel = 0, tComp = 0, rp = 0, rc = 0, domRep = 0, noc = 0, ferTrab = 0;
      // D120: a média de repousos do § 2º só conta os dias em que os dois repousos já valem (desde 16/12/2026; D18): no mês da
      // mudança, o mínimo é proporcional a esses dias (D17), e não depende de onde começa a janela simulada
      let dXv = 0, fdsXv = 0, rpXv = 0;
      let limTeto = 0;
      const bNorma = !!(buscarInstrumento(ctx, emp, ['ampliacao_art7', 'media_par2'], ini) || {}).ok || !!(buscarInstrumento(ctx, emp, ['ampliacao_art7', 'media_par2'], fim) || {}).ok;
      for (let d = ini; d <= fim; d++) {
        const i = d - A, r = dias[i];
        if (emServico(r)) {
          dServ++;
          if (diaSemana(d) >= 5) fds++;
          limTeto += T.tetoEf(d) * 60;
          if (T.xv(d)) { dXv++; if (diaSemana(d) >= 5) fdsXv++; }
        }
        tRel += rel[i]; tComp += comp[i]; noc += noct[i];
        if (r.feriadoTrabalhado) ferTrab += civ[i];
        if (RP.rep.has(d)) { rp++; if (diaSemana(d) === 6) domRep++; if (T.xv(d)) rpXv++; }
        if (repCal.has(d)) rc++;
      }
      const totU = medidaRel ? tRel * U : tComp;
      // critério A = Portaria MTE 2.041/2026, art. 4º, § 4º: o dobro dos dias do mês dividido por sete, arredondado para cima
      const minA = Math.ceil(2 * dXv / 7 - 1e-9), minB = fdsXv, minC = Math.ceil(8 * dXv / nd - 1e-9);
      const mes = { a: a, m: m, ini: ini, fim: fim, dServ: dServ, diasXv: dXv, rel: tRel, comp: tComp, repousos: rp, repousosXv: rpXv, repCal: rc, minimos: { A: minA, B: minB, C: minC }, domingosRepouso: domRep, noturnas: noc, feriadoTrabalhado: ferTrab };
      meses.push(mes);
      if (fim < ctx.h0 || ini > ctx.h1) continue;

      /* R2 — média do § 2º */
      {
        const falhas = semFalhaR1.filter((p) => p.fim >= ini && p.ini <= fim);
        const base = 'CF, art. 7º, § 2º (Emenda Constitucional 141/2026 – Fim da 6x1); Portaria MTE 2.041/2026, art. 4º, §§ 1º e 3º';
        const crit = { A: minA, B: minB, C: minC };
        const rp2 = rpXv, valores = { repousos: rp2, dias: dXv, A: minA, B: minB, C: minC, cumpreA: rp2 >= minA, cumpreB: rp2 >= minB, cumpreC: rp2 >= minC };
        const conta = rot + ': ' + rp2 + ' repousos; mínimo de ' + minA + ' pelo critério A (2 × ' + dXv + ' dias ÷ 7, arredondado para cima), ' + minB + ' pelo B e ' + minC + ' pelo C' + (dXv < nd ? ' (mês parcial: ' + dXv + ' dias com os dois repousos em vigor e em serviço)' : '') + '.';
        if (!falhas.length) push({ regra: 'R2', periodo: per, status: 'na', porque: 'R1 cumprido em todas as semanas: o regime de média não é necessário.', base: base, conta: conta, valores: valores });
        else {
          const b = buscarInstrumento(ctx, emp, ['media_par2'], ini) || buscarInstrumento(ctx, emp, ['media_par2'], fim);
          if (!b || !b.ok) push({ regra: 'R2', periodo: per, status: 'nao_cumpre', porque: 'Há semana com menos de dois repousos e não há norma coletiva com regime de média cadastrada' + (b ? ' válida (' + b.nota + ')' : '') + '.', base: base, conta: conta, valores: valores });
          else {
            // D119: média de dois repousos por semana no mês-calendário, pelo critério do art. 4º, § 4º, da Portaria MTE
            // 2.041/2026 (critério A), com ao menos um repouso a cada seis dias seguidos de trabalho (art. 4º, § 3º; ver R3).
            // As janelas de 28 dias da D102 só entram com cfg.janela28.
            const min = crit[cfg.criterioMedia], okM = rp2 >= min;
            const j = cfg.janela28 && pRep && xv0 != null && fim >= xv0 ? piorJanela(ini, fim) : null, okJ = !j || j.folga >= 0, ok = okM && okJ;
            const txtM = rp2 + ' repousos no mês; mínimo de ' + min + ' pelo critério ' + cfg.criterioMedia + (cfg.criterioMedia === 'A' ? ' (o dobro dos ' + dXv + ' dias' + (dXv < nd ? ' com os dois repousos em vigor' : ' do mês') + ' dividido por sete, arredondado para cima)' : '');
            const txtJ = j ? j.repousos + ' repousos para ' + j.exigidos + ' exigidos entre ' + fmtDataCurta(j.ini) + ' e ' + fmtData(j.fim) : '';
            push({ regra: 'R2', periodo: per, status: ok ? 'cumpre' : 'nao_cumpre', instrumento: 'media_par2', nota: 'cadastrado: ' + b.instr.nome,
              porque: txtM + '.' + (j ? (okJ ? ' Na janela de 28 dias mais apertada, ' : ' Faltam repousos numa janela de 28 dias: ') + txtJ + '.' : '') + ' A sequência de dias de trabalho sem repouso, de no máximo seis, se confere em R3.',
              base: 'CF, art. 7º, § 2º; Portaria MTE 2.041/2026, art. 4º, §§ 3º e 4º' + (j ? '; STF, ADI 8.041 MC (12/11/2026), item IV' : ''), conta: conta + (j ? ' Janela de 28 dias mais apertada: ' + txtJ + '.' : ''), valores: j ? Object.assign({ janela: j }, valores) : valores });
          }
        }
      }

      /* R3 — dias consecutivos */
      {
        const viol = corridas.filter((c) => c.n >= 7 && c.fim >= ini && c.ini <= fim);
        const maior = corridas.filter((c) => c.fim >= ini && c.ini <= fim).reduce((s, c) => Math.max(s, c.n), 0);
        push({ regra: 'R3', periodo: per, status: viol.length ? 'nao_cumpre' : (dServ ? 'cumpre' : 'na'),
          porque: viol.length ? viol.map((c) => c.n + ' dias seguidos de trabalho, de ' + fmtData(c.ini) + ' a ' + fmtData(c.fim)).join('; ') + '. Repouso após o 7º dia é devido em dobro.' : 'Maior sequência no mês: ' + maior + ' dia(s).',
          base: 'CF, art. 7º, XV e § 2º; Portaria MTE 2.041/2026, art. 4º, § 3º; OJ 410 da SDI-1 do TST', conta: '', valores: { maior: maior, sequencias: viol.map((c) => ({ ini: c.ini, fim: c.fim, n: c.n })) } });
      }

      /* R4 — repouso no domingo (comércio: a cada três semanas; art. 386: quinzenal, também no comércio — TST, SDI-1,
         E-ED-RR-619-11.2017.5.12.0054; D83). D119: fora do comércio, a Portaria MTE 2.041/2026 (art. 5º, § 5º) pede o domingo
         preferencialmente a cada quatro semanas: a falta vira alerta (status 'info'), não descumprimento. */
      {
        const pref = !emp.art386 && !ctx.comercio;
        const janelaSem = emp.art386 ? 2 : ctx.comercio ? 3 : 4;
        const falhas = [];
        for (let d = ini; d <= fim; d++) {
          if (diaSemana(d) !== 6) continue;
          let algumServico = false, ok = false;
          for (let j = 0; j < janelaSem; j++) {
            const s = d - 7 * j, r = reg(s);
            if (!r) continue;
            if (emServico(r)) algumServico = true;
            if (RP.rep.has(s) || !emServico(r)) ok = true;
          }
          if (algumServico && !ok) falhas.push(d);
        }
        const base = emp.art386 ? 'CLT, art. 386; Portaria MTE 2.041/2026, art. 5º, § 3º' : ctx.comercio ? 'Lei 10.101/2000, art. 6º, parágrafo único; Portaria MTE 2.041/2026, art. 5º, § 4º' : 'CF, art. 7º, XV; CLT, art. 67; Portaria MTE 2.041/2026, art. 5º, § 5º';
        const txtF = 'Sem repouso em domingo nas ' + janelaSem + ' semanas encerradas em ' + falhas.map(fmtDataCurta).join(', ') + '.';
        push({ regra: 'R4', periodo: per, status: pref ? 'info' : falhas.length ? 'nao_cumpre' : (dServ ? 'cumpre' : 'na'),
          porque: falhas.length ? txtF + (pref ? ' Fora do comércio, o repouso deve coincidir com o domingo preferencialmente ao menos uma vez a cada quatro semanas: é recomendação, não exigência.' : '') : domRep + ' repouso(s) em domingo no mês.',
          base: base, conta: '', valores: { domingos: domRep, alerta: pref && falhas.length > 0, semanasSemDomingo: falhas } });
      }

      /* R8 — turno ininterrupto de revezamento */
      {
        const xs = instsMes.get(ini) || [];
        const inicios = Array.from(new Set(xs.map((x) => mod(x.ini, DIA))));
        let espalho = 0;
        for (let i = 0; i < inicios.length; i++) for (let j = i + 1; j < inicios.length; j++) {
          const dd = Math.abs(inicios[i] - inicios[j]);
          espalho = Math.max(espalho, Math.min(dd, DIA - dd));
        }
        const noturno = xs.some((x) => x.noctUrb > 0);
        // D113: equipe que gira entre turnos com horário noturno, informada no cadastro, mesmo que a grade não mostre o giro
        const informado = !!emp.revezamento && xs.length > 0 && !(espalho >= 240 && noturno);
        if (((espalho >= 240 && noturno) || informado) && !art62) {
          let maxDia = 0;
          for (let d = ini; d <= fim; d++) maxDia = Math.max(maxDia, med(d - A));
          let a;
          if (maxDia <= 6 * HORA) a = { status: 'cumpre', porque: 'Turnos alternados com jornada de até 6 h.' };
          else if (maxDia <= 8 * HORA) a = Object.assign(condicao(['turno_ininterrupto_8h'], ctx, emp, ini), { porque: 'Turnos alternados entre o dia e a noite com jornada acima de 6 h: depende de norma coletiva, até 8 h.' });
          else a = { status: 'nao_cumpre', porque: 'Turnos alternados entre o dia e a noite com jornada acima de 8 h.' };
          if (informado) a.porque = 'Revezamento entre turnos com horário noturno informado no cadastro. ' + a.porque;
          if (dispensado(ini) && a.status !== 'cumpre') { a.valores = { statusAvaliado: a.status }; a.status = 'info'; a.porque = 'Art. 8º da Emenda Constitucional 141/2026 (Fim da 6x1): avaliação informativa. ' + a.porque; }
          push(Object.assign({ regra: 'R8', periodo: per, base: 'CF, art. 7º, XIV; Decreto 13.173/2026, art. 2º; Portaria MTE 2.041/2026, art. 7º; Súmula 423 e OJ 360 da SDI-1 do TST', conta: 'Horários de início no mês: ' + inicios.map(fmtHora).join(', ') + '; maior jornada: ' + fmtHoras(maxDia) + '.' }, a));
        }
      }

      /* J7 — atividade insalubre (D113; D119): todo dia acima de 8 h, inclusive as 8h24 da liminar (leitura a validar), é
         prorrogação e depende de norma coletiva que a autorize expressamente ou de autorização da chefia de segurança e saúde
         no trabalho da Inspeção do Trabalho (Portaria MTE 2.041/2026, art. 15, II e III; CLT, arts. 60 e 611-A, XIII). A 12x36
         fica de fora (art. 15, I; CLT, art. 60, parágrafo único). */
      if (emp.insalubre && !art62) {
        let maxDia = 0, nDias = 0;
        for (let d = ini; d <= fim; d++) {
          const i = d - A, r = dias[i];
          if (!r || !r.turnos.length || r.especial === '12x36') continue;
          const m = med(i);
          if (m > 8 * HORA) { nDias++; maxDia = Math.max(maxDia, m); }
        }
        if (nDias) {
          const bL = buscarInstrumento(ctx, emp, ['licenca_art60'], ini), bN = buscarInstrumento(ctx, emp, ['prorrogacao_insalubre'], ini);
          const okL = !!(bL && bL.ok), okN = !!(bN && bN.ok);
          const a = { status: 'condicao', atendida: okL || okN, instrumento: okL ? 'licenca_art60' : okN ? 'prorrogacao_insalubre' : 'insalubre',
            exige: textoInstrumento(['licenca_art60', 'prorrogacao_insalubre']), nota: okL ? 'cadastrado: ' + bL.instr.nome : okN ? 'cadastrado: ' + bN.instr.nome : 'não cadastrado',
            porque: nDias + (nDias === 1 ? ' dia' : ' dias') + ' acima de 8 h em atividade insalubre no mês (maior: ' + fmtHoras(maxDia) + '): depende de norma coletiva que autorize expressamente a prorrogação ou de autorização da Inspeção do Trabalho.' +
              (!okL && !okN && maxDia <= 8 * HORA + 24 * U ? ' Tratar as 8h24 da liminar como prorrogação é leitura do escritório (D113).' : ''),
            base: okL ? 'CLT, art. 60; Portaria MTE 2.041/2026, art. 15, III' : okN ? 'CLT, art. 611-A, XIII; Portaria MTE 2.041/2026, art. 15, II' : 'CLT, arts. 60 e 611-A, XIII; Portaria MTE 2.041/2026, art. 15' };
          if (dispensado(ini)) { a.valores = { statusAvaliado: a.status }; a.status = 'info'; a.porque = 'Art. 8º da Emenda Constitucional 141/2026 (Fim da 6x1): avaliação informativa. ' + a.porque; }
          push(Object.assign({ regra: 'J7', periodo: per, conta: '' }, a));
        }
      }

      /* J4 — compensação no mês: saldo das semanas de apuração atribuídas ao mês (pela quinta-feira) contra a base semanal */
      {
        const b = buscarInstrumento(ctx, emp, ['compensacao_mensal'], ini) || buscarInstrumento(ctx, emp, ['compensacao_mensal'], fim);
        const bMed = buscarInstrumento(ctx, emp, ['compensacao_media', 'compensacao_media_mes'], ini) || buscarInstrumento(ctx, emp, ['compensacao_media', 'compensacao_media_mes'], fim);
        if (b && b.ok && bMed && bMed.ok && !dispensado(ini)) {
          // D108 e D119: com a compensação pela média em norma coletiva, a média do mês-calendário se confere em J1
          push({ regra: 'J4', periodo: per, status: 'na', porque: 'Há norma coletiva de compensação pela média: as semanas acima da base se conferem pela média do mês-calendário (ver J1).', base: 'CF, art. 7º, XIII; Portaria MTE 2.041/2026, art. 3º' });
        } else if (b && b.ok && !dispensado(ini)) {
          const sal = saldoSemanas(semanas.filter((x) => x.ini + 3 >= ini && x.ini + 3 <= fim), bNorma);
          const conta = 'Saldo das semanas atribuídas a ' + rot + ' (base semanal ' + (bNorma ? 'pelo teto, há norma do art. 7º ou do § 2º' : cfg.leitura8h24 === 'individual' ? 'pelo teto, leitura alternativa de J1' : 'de 8 h × 5 dias quando vigoram dois repousos' + (cfg.liminar !== false ? ', ou as horas da semana até 42 h na semana de cinco dias de até 8h24 (liminar na ADI 8.041)' : '')) + '): ' + sal.texto +
            '. Referência da seção 4.6 (teto ÷ 7 por dia do mês): ' + fmtHoras(totU) + ' contra ' + fmtHoras(limTeto) + '.';
          const valores = { saldo7: sal.saldo7, excedente: Math.max(0, Math.ceil(sal.saldo7 / 7)), total: totU, limiteTeto: limTeto, statusSecao46: totU <= limTeto ? 'cumpre' : 'nao_cumpre' };
          const alt = [{ criterio: 'limite mensal da seção 4.6', status: valores.statusSecao46 }];
          if (sal.saldo7 <= 0) push({ regra: 'J4', periodo: per, status: 'condicao', atendida: true, exige: textoInstrumento(['compensacao_mensal']), nota: 'cadastrado: ' + b.instr.nome, porque: 'As horas acima da base em algumas semanas são compensadas no próprio mês.', base: 'CLT, art. 59, § 6º', conta: conta, valores: valores, alternativas: alt });
          else push({ regra: 'J4', periodo: per, status: 'nao_cumpre', porque: 'Saldo positivo de ' + fmtHoras(valores.excedente) + ' nas semanas do mês: hora extra.', base: 'CLT, art. 59, § 6º', conta: conta, valores: valores, alternativas: alt });
        }
      }

      /* J6 — 12x36 (D118): apuração no mês-calendário (Decreto 13.173/2026, art. 3º; Portaria MTE 2.041/2026, arts. 3º e 8º). Média do mês acima do limite semanal
         constitucional não invalida a escala: as horas excedentes são compensadas ou pagas como extras, nos termos de
         convenção ou acordo coletivo. A média do ciclo fica como referência. */
      {
        const escs = new Map();
        let usados12 = 0;
        for (let d = ini; d <= fim; d++) {
          const r = dias[d - A];
          if (r.especial === '12x36' && r.turnos.length) { usados12++; if (!escs.has(r.escala)) escs.set(r.escala, []); escs.get(r.escala).push(d); }
        }
        if (escs.size && !dispensado(ini)) {
          const ciclos = [];
          for (const [e, usados] of escs) ciclos.push(Object.assign({ escala: e, usados: usados }, mediaCiclo(e, ctx)));
          const media = ciclos.map((c) => fmtHoras(Math.round(c.totalCiclo * 7 / c.n)) + (c.totalCiclo * 7 % c.n ? ' (aprox.)' : '')).join(', ');
          const exced = Math.max(0, totU - limTeto);
          const base = 'CLT, art. 59-A; Decreto 13.173/2026, art. 3º; Portaria MTE 2.041/2026, arts. 3º e 8º';
          const conta = 'Mês-calendário: ' + fmtHoras(totU) + (medidaRel ? ' de relógio' : ' computadas') + ' contra limite de ' + fmtHoras(limTeto) + ' (limite semanal ÷ 7 por dia do mês). Média do ciclo, como referência: ' + media + '.';
          const valores = { mediaCiclo: ciclos.map((c) => ({ escala: c.escala, total: c.totalCiclo, dias: c.n })), totalMes: totU, limiteMes: limTeto, excedente: exced, plantoes: usados12 };
          if (exced <= 0) push({ regra: 'J6', periodo: per, status: 'cumpre', porque: rot + ': ' + fmtHoras(totU) + ' no mês, dentro do limite de ' + fmtHoras(limTeto) + '.', base: base, conta: conta, valores: valores });
          else {
            const b = buscarInstrumento(ctx, emp, ['excesso_12x36'], ini), ok = !!(b && b.ok);
            push({ regra: 'J6', periodo: per, status: 'condicao', atendida: ok, instrumento: 'excesso_12x36', exige: textoInstrumento(['excesso_12x36']), nota: ok ? 'cadastrado: ' + b.instr.nome : 'não cadastrado',
              porque: rot + ': ' + fmtHoras(totU) + ' no mês, acima do limite de ' + fmtHoras(limTeto) + ' (excedente de ' + fmtHoras(exced) + '): as horas excedentes são compensadas ou pagas como extras, nos termos de convenção ou acordo coletivo.',
              base: base, conta: conta, valores: valores });
          }
        }
      }

      /* R10 — art. 8º */
      if (emp.nivelSuperior) {
        const s = art8Dia(ini);
        push({ regra: 'R10', periodo: per, status: 'info', porque: s.enquadrado ? 'Enquadrado no art. 8º: ' + s.motivo + '. Dispensa J1 a J6; R1 a R3 continuam.' : 'Não enquadrado no art. 8º: ' + s.motivo + '.', base: 'Emenda Constitucional 141/2026 (Fim da 6x1), art. 8º; Portaria MTE 2.041/2026, art. 9º', conta: '', valores: { enquadrado: s.enquadrado } });
      }

      /* F1 — início de férias */
      {
        const viol = [];
        for (let d = ini; d <= fim; d++) {
          const r = reg(d), ant = reg(d - 1);
          if (!r || r.estado !== 'ferias' || (ant && ant.estado === 'ferias')) continue;
          for (let j = 1; j <= 2; j++) {
            const q = reg(d + j);
            if (!q) continue;
            if (q.fer || (q.servico && q.escala && q.base == null)) { viol.push({ d: d, motivo: fmtDataCurta(d + j) + (q.fer ? ' é feriado' : ' é dia de repouso na escala') }); break; }
          }
        }
        const temFerias = (() => { for (let d = ini; d <= fim; d++) { const r = reg(d), ant = reg(d - 1); if (r && r.estado === 'ferias' && !(ant && ant.estado === 'ferias')) return true; } return false; })();
        if (temFerias) push({ regra: 'F1', periodo: per, status: viol.length ? 'nao_cumpre' : 'cumpre',
          porque: viol.length ? viol.map((v) => 'Férias iniciadas em ' + fmtData(v.d) + ', e ' + v.motivo).join('; ') + '.' : 'Início de férias fora dos dois dias que antecedem feriado ou repouso.',
          base: 'CLT, art. 134, § 3º', conta: '' });
      }

      /* indicadores operacionais */
      let fdsLivres = 0, domLivres = 0, isoladas = 0;
      for (let d = ini; d <= fim; d++) {
        const r = reg(d);
        if (!r || r.estado !== 'folga') continue;
        if (diaSemana(d) === 6) { domLivres++; const sab = reg(d - 1); if (sab && sab.estado === 'folga') fdsLivres++; }
        const ant = reg(d - 1), pos = reg(d + 1);
        if (!(ant && ant.estado === 'folga') && !(pos && pos.estado === 'folga')) isoladas++;
      }
      mes.indicadores = { finsDeSemanaLivres: fdsLivres, domingosLivres: domLivres, folgasIsoladas: isoladas };
    }

    /* ---------- J5 — banco de horas */
    for (const i of ctx.dados.instrumentos) {
      if ((i.tipo !== 'banco_semestral' && i.tipo !== 'banco_anual') || !abrange(i, emp)) continue;
      const passo = i.tipo === 'banco_semestral' ? 6 : 12;
      let p0 = i.vigenciaInicio > -1e8 ? i.vigenciaInicio : ctx.mesIni;
      while (p0 <= ctx.h1) {
        const p1 = somarMeses(p0, passo) - 1;
        if (p1 >= ctx.h0) {
          const comNorma = !!(buscarInstrumento(ctx, emp, ['ampliacao_art7', 'media_par2'], p0) || {}).ok;
          const sal = saldoSemanas(semanas.filter((x) => x.ini + 3 >= p0 && x.ini + 3 <= p1), comNorma);
          const s = situacaoInstrumento(i, p0, D) || { ok: false, nota: 'fora da vigência' };
          const per = { tipo: 'periodo', ini: p0, fim: p1 };
          const exc = Math.max(0, Math.ceil(sal.saldo7 / 7));
          const conta = 'Saldo das semanas do período (' + fmtData(p0) + ' a ' + fmtData(p1) + '): saldo ' + (sal.saldo7 > 0 ? '+' : sal.saldo7 < 0 ? '−' : '') + fmtHoras(Math.round(Math.abs(sal.saldo7) / 7)) + '.';
          if (!s.ok) push({ regra: 'J5', periodo: per, status: 'nao_cumpre', porque: 'Banco de horas sem validade no período: ' + s.nota + '.', base: TIPOS_INSTRUMENTO[i.tipo].base, conta: conta });
          else push({ regra: 'J5', periodo: per, status: sal.saldo7 <= 0 ? 'condicao' : 'nao_cumpre', atendida: sal.saldo7 <= 0, exige: textoInstrumento([i.tipo]), nota: 'cadastrado: ' + i.nome,
            porque: sal.saldo7 <= 0 ? 'Saldo do banco fechado sem horas a pagar no período.' : 'Saldo positivo de ' + fmtHoras(exc) + ' ao fim do período: hora extra.', base: TIPOS_INSTRUMENTO[i.tipo].base, conta: conta, valores: { saldo7: sal.saldo7, excedente: exc } });
        }
        p0 = p1 + 1;
      }
    }

    /* ---------- sinalizações de repouso */
    const sinais = [];
    for (const x of RP.semRep) if (x.dia >= ctx.mesIni && x.dia <= ctx.mesFim) sinais.push({ dia: x.dia, tipo: 'folga_sem_repouso', texto: 'Folga em ' + fmtData(x.dia) + ' sem 24 h mais 11 h íntegras (intervalo livre de ' + fmtMinutos(x.G) + ').' });
    for (const d of dependentes) if (d >= ctx.mesIni && d <= ctx.mesFim) sinais.push({ dia: d, tipo: 'repouso_dependente', texto: 'O repouso de ' + fmtData(d) + ' só se completa graças a feriado, férias, afastamento ou falta: pela escala programada, não se completaria.' });

    /* ---------- dias para calendário */
    const saidaDias = [];
    for (let d = ctx.mesIni; d <= ctx.mesFim; d++) {
      const i = d - A, r = dias[i];
      saidaDias.push({
        d: d, estado: r.estado, feriado: r.fer ? r.fer.nome : null, escala: r.escala, turnos: r.turnos,
        rel: rel[i], comp: comp[i], noct: noct[i], repouso: RP.rep.has(d), repousoCalendario: repCal.has(d), repousoBlocos: RP.blocos.has(d),
        folgaSemRepouso: semRep.has(d), repousoDependente: dependentes.has(d),
      });
    }
    const turnosSaida = insts.filter((x) => x.fim > ctx.mesIni * DIA && x.ini < (ctx.mesFim + 1) * DIA).map((x) => ({
      dia: x.dia, turno: x.turno, ini: x.ini, fim: x.fim, segmentos: x.segmentos, pausas: x.pausas, rel: x.rel, comp: x.comp, noct: x.noct,
    }));

    const interjornadas = RP.intervalos.filter((g) => g.G < 660 && g.ate.dia >= ctx.mesIni && g.ate.dia <= ctx.mesFim)
      .map((g) => ({ dia: g.ate.dia, fimTurno: g.de.fim, inicioTurno: g.ate.ini, G: g.G }));
    const livres = RP.intervalos.filter((g) => (g.G >= 35 * 60 || g.k > 0) && g.ate.dia >= ctx.mesIni && g.de.dia <= ctx.mesFim)
      .map((g) => ({ de: g.de.dia, fimTurno: g.de.fim, ate: g.ate.dia, inicioTurno: g.ate.ini, G: g.G, k: g.k, r: g.r }));

    return { id: emp.id, nome: emp.nome, setor: emp.setor, tipo: emp.tipo, dias: saidaDias, turnos: turnosSaida, semanas: semanas, meses: meses, achados: achados, sinais: sinais, livres: livres, interjornadas: interjornadas, corridas: corridas.filter((c) => c.fim >= ctx.mesIni && c.ini <= ctx.mesFim) };
  }

  /* ==================================================== intervalo (R6) */

  const SEM_ALERTAS = Object.freeze([]);
  const ALERTA_POSICAO = Object.freeze(['Intervalo na primeira ou na última hora de trabalho: tende a ser visto como sem a finalidade de repouso e alimentação.']);

  function avaliarIntervalo(x, emp, ctx) {
    const W = x.rel;
    let L = 0, S = 0, nUs = 0, nInd = 0;
    let alertas = SEM_ALERTAS;
    for (const p of x.pausas) {
      if (p.tipo === 'indenizado') { nInd++; continue; }
      const dur = p.fim - p.ini;
      nUs++; S += dur; if (dur > L) L = dur;
      if (p.ini - x.ini < 60 || x.fim - p.fim < 60) alertas = ALERTA_POSICAO;
    }
    const us = { length: nUs }, ind = { length: nInd };
    const e12 = x.especial === '12x36';
    const base = 'CLT, art. 71';
    const R = (o) => {
      o.base = o.base || base; o.alertas = alertas;
      if (o.status !== 'cumpre' || alertas.length) o.conta = fmtDataCurta(x.dia) + ' ' + fmtHora(x.ini) + '–' + fmtHora(x.fim) + ' (' + fmtMinutos(W) + ' de trabalho, intervalo de ' + L + ' min)';
      return o;
    };
    if (W <= 240) return R({ status: 'cumpre', porque: 'Até 4 h de trabalho: sem intervalo obrigatório.' });
    if (W <= 360) {
      if (L >= 15) return R({ status: 'cumpre', porque: 'Acima de 4 h até 6 h: intervalo de 15 min atendido.' });
      if (e12 && ind.length) return R({ status: 'cumpre', porque: 'Intervalo indenizado na 12x36.', base: 'CLT, art. 59-A' });
      return R({ status: 'nao_cumpre', porque: 'Acima de 4 h até 6 h de trabalho exige intervalo de 15 min (art. 71, § 1º).' });
    }
    if (L === 0) {
      if (ind.length && e12) return R({ status: 'cumpre', porque: 'Intervalo indenizado na 12x36.', base: 'CLT, art. 59-A' });
      if (ind.length) return R({ status: 'nao_cumpre', porque: 'Intervalo indenizado fora da 12x36 equivale a supressão (art. 71, § 4º).' });
      return R({ status: 'nao_cumpre', porque: 'Trabalho acima de 6 h sem intervalo previsto.' });
    }
    if (L >= 60 && L <= 120) return R({ status: 'cumpre', porque: 'Intervalo de ' + L + ' min, entre 1 h e 2 h.' });
    if (L > 120) {
      const b = buscarInstrumento(ctx, emp, ['intervalo_superior_2h'], x.dia, (i) => i.parametros.maximo == null || L <= Number(i.parametros.maximo));
      return R({ status: 'condicao', atendida: !!(b && b.ok), instrumento: 'intervalo_superior_2h', exige: 'acordo escrito (individual) ou norma coletiva que admita intervalo superior a 2 h (CLT, art. 71, caput)',
        nota: b ? (b.ok ? 'cadastrado: ' + b.instr.nome : b.nota) : 'não cadastrado', porque: 'Intervalo de ' + L + ' min, acima de 2 h.' });
    }
    if (S >= 60 && us.length > 1) {
      const b = buscarInstrumento(ctx, emp, ['fracionamento_intervalo'], x.dia);
      return R({ status: 'condicao', atendida: !!(b && b.ok), instrumento: 'fracionamento_intervalo', exige: 'norma coletiva de fracionamento, restrita a motoristas, cobradores e afins (CLT, art. 71, § 5º)',
        nota: b ? (b.ok ? 'cadastrado: ' + b.instr.nome : b.nota) : 'não cadastrado', porque: 'Intervalo fracionado (' + x.pausas.filter((p) => p.tipo === 'usufruido').map((p) => (p.fim - p.ini) + ' min').join(' + ') + ').' });
    }
    if (L >= 30) {
      const b = buscarInstrumento(ctx, emp, ['reducao_intervalo', 'reducao_intervalo_mte'], x.dia, (i) => i.parametros.minimo == null || L >= Number(i.parametros.minimo));
      return R({ status: 'condicao', atendida: !!(b && b.ok), instrumento: 'reducao_intervalo', exige: 'norma coletiva que reduza o intervalo a no mínimo 30 min (CLT, art. 611-A, III) ou autorização do art. 71, § 3º',
        nota: b ? (b.ok ? 'cadastrado: ' + b.instr.nome : b.nota) : 'não cadastrado', porque: 'Intervalo de ' + L + ' min, abaixo de 1 h.' });
    }
    return R({ status: 'nao_cumpre', porque: 'Intervalo de ' + L + ' min, abaixo do mínimo de 30 min admitido para negociação coletiva (art. 611-A, III).' });
  }

  /* ============================================ achados da empresa (R15, I1) */

  function avaliarEmpresa(dados, ctx) {
    const D = ctx.D;
    const achados = [];
    for (const i of dados.instrumentos) {
      if (i.natureza !== 'coletivo') continue;
      const alertas = [];
      if (i.celebracao != null && i.celebracao < D.publicacao) alertas.push('Instrumento anterior à Emenda Constitucional 141/2026 (Fim da 6x1): verificar compatibilidade; cláusulas incompatíveis perdem efeito em ' + fmtData(D.art3) + '.');
      else alertas.push('Verificar compatibilidade com a Emenda Constitucional 141/2026 (Fim da 6x1), art. 3º.');
      if (i.tipo === 'ampliacao_art7') alertas.push('A ampliação do art. 7º só vale até ' + fmtData(D.teto40 - 1) + '.');
      if (i.tipo === 'escala_12x36' || i.tipo === 'jornada_12h' || i.tipo === 'banco_anual') alertas.push('Cláusula compatível com 42 h pode tornar-se incompatível com o teto de 40 h em ' + fmtData(D.teto40) + '.');
      achados.push({ regra: 'R15', instrumento: i.id, status: i.compativel === true ? 'cumpre' : i.compativel === false ? 'nao_cumpre' : 'condicao', atendida: i.compativel === true,
        exige: 'verificação de compatibilidade pelo advogado', porque: alertas.join(' '), base: 'Emenda Constitucional 141/2026 (Fim da 6x1), art. 3º' });
    }
    const porte = dados.empresa.porte;
    if (porte === 'MEI' || porte === 'ME' || porte === 'EPP') {
      achados.push({ regra: 'I1', status: 'info', porque: 'Empresa de pequeno porte: lei complementar ainda inexistente poderá prever medidas transitórias.', base: 'Emenda Constitucional 141/2026 (Fim da 6x1), art. 5º' });
    }
    return { achados: achados };
  }

  /* ====================================================== avaliação */

  function avaliar(entrada, cfgParcial) {
    const dados = normalizar(entrada);
    const cfg = Object.assign({}, CONFIG_PADRAO, { semanaInicio: dados.semanaInicio || 0 }, cfgParcial || {});
    const D = datasVigencia(cfg.prazos);
    const ctx = criarContexto(dados, cfg, D);
    const empregados = dados.empregados.map((e) => avaliarEmpregado(e, ctx));
    return {
      versao: VERSAO, baseNormativa: BASE_NORMATIVA, config: cfg, datas: D, horizonte: dados.horizonte,
      erros: dados.erros, empregados: empregados, empresa: avaliarEmpresa(dados, ctx),
    };
  }

  const VARIANTES = [
    { id: 'medida', rotulo: 'Horas de relógio, e não computadas, nas regras de teto', patch: { medida: 'relogio' } },
    { id: 'liminar', rotulo: 'Sem a liminar na ADI 8.041, se o Plenário não a referendar', patch: { liminar: false } },
    { id: 'leitura8h24', rotulo: 'Distribuição de até 42 h por acordo individual de compensação', patch: { leitura8h24: 'individual' } },
    { id: 'transicao', rotulo: 'Regra aplicada dia a dia na semana de transição', patch: { transicao: 'diaria' } },
    { id: 'prazos', rotulo: 'Contagem de prazos pelo Código Civil (art. 132, § 3º)', patch: { prazos: 'civil' } },
    { id: 'art9', rotulo: 'Art. 9º: dois repousos também diferidos até o aditamento', patch: { art9: 'diferido' }, aplicavel: (d) => d.empregados.some((e) => e.contratoPublico) },
    { id: 'turnoDia', rotulo: 'Turno que cruza a meia-noite rateado pelo dia civil', patch: { turnoDia: 'civil' } },
    { id: 'prorrogacao', rotulo: 'Hora reduzida só entre 22h e 5h, sem estender à prorrogação', patch: { prorrogacaoReduzida: false } },
  ];

  function chaveAchado(a) { return a.regra + '|' + (a.periodo ? a.periodo.tipo + '|' + a.periodo.ini : a.instrumento || ''); }
  function rotuloStatus(a) {
    if (!a) return '—';
    if (a.status === 'condicao') return 'cumpre com condição' + (a.instrumento && TIPOS_INSTRUMENTO[a.instrumento] ? ': ' + TIPOS_INSTRUMENTO[a.instrumento].nome.toLowerCase() : a.exige ? ': ' + a.exige : '') + (a.atendida ? ' (atendida)' : ' (pendente)');
    return { cumpre: 'cumpre', nao_cumpre: 'não cumpre', info: 'informativo', na: 'não se aplica' }[a.status] || a.status;
  }

  /** Avalia pelo critério padrão e, para cada leitura alternativa, registra onde o resultado muda. */
  function avaliarComAlternativas(entrada, cfgParcial) {
    const dados = normalizar(entrada);
    const base = avaliar(dados, cfgParcial);
    const divergencias = [];
    for (const v of VARIANTES) {
      if (v.aplicavel && !v.aplicavel(dados)) continue;
      const patch = Object.assign({}, cfgParcial || {}, v.patch);
      let difere = false;
      for (const k of Object.keys(v.patch)) if (base.config[k] !== v.patch[k]) difere = true;
      if (!difere) continue;
      const alt = avaliar(dados, patch);
      alt.empregados.forEach((ea, idx) => {
        const eb = base.empregados[idx];
        const mapa = new Map(eb.achados.map((a) => [chaveAchado(a), a]));
