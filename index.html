        const vistos = new Set();
        for (const a of ea.achados) {
          const k = chaveAchado(a);
          vistos.add(k);
          const b = mapa.get(k);
          if (!b || b.status !== a.status || !!b.atendida !== !!a.atendida || (b.instrumento || null) !== (a.instrumento || null)) {
            divergencias.push({ variante: v.id, rotulo: v.rotulo, empregado: eb.id, regra: a.regra, periodo: a.periodo, padrao: b ? rotuloStatus(b) : '—', alternativo: rotuloStatus(a), porqueAlternativo: a.porque });
          }
        }
        for (const [k, b] of mapa) if (!vistos.has(k)) divergencias.push({ variante: v.id, rotulo: v.rotulo, empregado: eb.id, regra: b.regra, periodo: b.periodo, padrao: rotuloStatus(b), alternativo: '—' });
      });
    }
    base.divergencias = divergencias;
    return base;
  }

  /* ====================================================== limite mensal (4.6) */

  function limiteMensal(a, m, opcoes) {
    const o = Object.assign({ transicao: 'semana', prazos: 'conservador', cenario: 'legal', semanaInicio: 0, base: 'teto' }, opcoes || {});
    const D = datasVigencia(o.prazos);
    const ctx = { cfg: Object.assign({}, CONFIG_PADRAO, o), D: D, si: o.semanaInicio };
    const T = criarTetos({ contratoPublico: null }, ctx);
    let u = 0;
    for (let d = diaDe(a, m, 1); d <= diaDe(a, m, diasNoMes(a, m)); d++) u += o.base === 'teto' ? T.tetoEf(d) * 60 : T.baseDia(d, false);
    return u;
  }

  /* ============================================================ cobertura */

  function demandaDia(setor, d) {
    const exc = setor.excecoes.filter((x) => x.data === d);
    const lista = exc.length ? exc.map((x) => ({ inicio: x.inicio, fim: x.fim, pessoas: x.pessoas })) : setor.necessidade.filter((n) => n.dias.indexOf(diaSemana(d)) >= 0);
    return lista.map((n) => { const a = d * DIA + n.inicio; const b = d * DIA + (n.fim > n.inicio ? n.fim : n.fim + DIA); return [a, b, n.pessoas]; });
  }

  /** Cobertura exata (ao minuto) de um setor entre dois dias: segmentos com presença e necessidade. */
  function cobertura(resultado, entrada, setorId, ini, fim) {
    const dados = normalizar(entrada);
    const setor = dados.setores.get(String(setorId));
    const pres = [];
    for (const e of resultado.empregados) if (e.setor === String(setorId)) for (const x of e.turnos) for (const s of x.segmentos) pres.push(s);
    const dias = [];
    let descoberto = 0, excesso = 0, demandaTotal = 0, ofertaTotal = 0;
    for (let d = ini; d <= fim; d++) {
      const d0 = d * DIA, d1 = d0 + DIA;
      const ev = new Map();
      const add = (t, dp, dq) => { const v = ev.get(t) || [0, 0]; v[0] += dp; v[1] += dq; ev.set(t, v); };
      add(d0, 0, 0); add(d1, 0, 0);
      for (const s of pres) { const a = Math.max(s[0], d0), b = Math.min(s[1], d1); if (a < b) { add(a, 1, 0); add(b, -1, 0); } }
      if (setor) for (const dd of [d - 1, d]) for (const q of demandaDia(setor, dd)) { const a = Math.max(q[0], d0), b = Math.min(q[1], d1); if (a < b) { add(a, 0, q[2]); add(b, 0, -q[2]); } }
      const ts = Array.from(ev.keys()).sort((x, y) => x - y);
      let p = 0, q = 0;
      const segs = [];
      for (let k = 0; k < ts.length - 1; k++) {
        const v = ev.get(ts[k]); p += v[0]; q += v[1];
        const a = ts[k], b = ts[k + 1];
        if (b <= d0 || a >= d1 || a === b) continue;
        const ult = segs[segs.length - 1];
        if (ult && ult.presenca === p && ult.demanda === q && ult.fim === a) ult.fim = b;
        else segs.push({ ini: a, fim: b, presenca: p, demanda: q });
        const len = b - a;
        descoberto += Math.max(0, q - p) * len; excesso += Math.max(0, p - q) * len;
        demandaTotal += q * len; ofertaTotal += p * len;
      }
      dias.push({ d: d, segmentos: segs });
    }
    return { dias: dias, descobertoMin: descoberto, excessoMin: excesso, demandaMin: demandaTotal, ofertaMin: ofertaTotal };
  }

  /** Cobertura por faixas para o mapa de calor: cada faixa recebe a menor cobertura (presença − necessidade) dentro dela. */
  function faixas(diaCobertura, tamanho) {
    const out = [];
    const d0 = diaCobertura.d * DIA;
    for (let a = d0; a < d0 + DIA; a += tamanho) {
      const b = a + tamanho;
      let minSaldo = Infinity, pres = 0, dem = 0;
      for (const s of diaCobertura.segmentos) {
        if (s.fim <= a || s.ini >= b) continue;
        const saldo = s.presenca - s.demanda;
        if (saldo < minSaldo) { minSaldo = saldo; pres = s.presenca; dem = s.demanda; }
      }
      out.push({ ini: a, fim: b, saldo: minSaldo === Infinity ? 0 : minSaldo, presenca: pres, demanda: dem });
    }
    return out;
  }

  /** Quadro mínimo teórico (limite inferior): ⌈demanda ÷ (horas por empregado × (1 − taxa))⌉. */
  function quadroMinimo(demandaMinSemana, horasSemanaisEmpregado, taxaIndisponibilidadePct) {
    const t = taxaIndisponibilidadePct || 0;
    if (!(horasSemanaisEmpregado > 0) || t >= 100) return null;
    const num = demandaMinSemana * 100;
    const den = horasSemanaisEmpregado * 60 * (100 - t);
    return Math.ceil(num / den);
  }

  /* ============================================= comparação de escalas (R11) */

  /** Compara a escala atual com a proposta de um empregado e devolve alertas (art. 2º da EC, art. 468 da CLT, art. 71, limites especiais). */
  function compararEscalas(entrada, empId, escalaAtualId, escalaPropostaId) {
    const dados = normalizar(entrada);
    const emp = dados.empregados.find((e) => e.id === String(empId));
    const ctx = criarContexto(dados, Object.assign({}, CONFIG_PADRAO), datasVigencia('conservador'));
    const resumo = (id) => {
      const esc = dados.escalas.get(id);
      let tot = 0, maxDia = 0, maxIntervalo = 0;
      const itens = [];
      esc.dias.forEach((tid, i) => {
        if (!tid) return;
        const t = dados.turnos.get(tid);
        const x = medir(instanciar(t, 100000 + i, esc.especial), ctx);
        tot += x.rel; maxDia = Math.max(maxDia, x.rel);
        itens.push({ x: x, t: t });
        maxIntervalo = Math.max(maxIntervalo, x.fim - x.ini);
      });
      return { esc: esc, mediaSemanalMin: tot * 7 / esc.dias.length, maxDiaMin: maxDia, maxPermanenciaMin: maxIntervalo, itens: itens };
    };
    const at = resumo(escalaAtualId), pr = resumo(escalaPropostaId);
    const alertas = [];
    if (pr.maxDiaMin > at.maxDiaMin) {
      alertas.push({ regra: 'art468', texto: 'A duração diária sobe de ' + fmtMinutos(at.maxDiaMin) + ' para ' + fmtMinutos(pr.maxDiaMin) + ' e a permanência no estabelecimento, de ' + fmtMinutos(at.maxPermanenciaMin) + ' para ' + fmtMinutos(pr.maxPermanenciaMin) + ': alteração contratual que depende de anuência do empregado.', base: 'CLT, art. 468' });
    }
    for (const it of pr.itens) {
      const r = avaliarIntervalo(it.x, emp || { id: '', setor: '' }, ctx);
      if (r.status !== 'cumpre') { alertas.push({ regra: 'R6', texto: 'Turno ' + it.t.id + ': ' + r.porque + (it.x.rel > 360 ? ' Acima de 6 h de trabalho, o intervalo mínimo passa a ser de 1 h.' : ''), base: 'CLT, art. 71' }); break; }
    }
    if (emp && emp.limiteDiario != null && pr.maxDiaMin > emp.limiteDiario * 60) {
      alertas.push({ regra: 'R14', texto: 'A proposta excede o limite diário de ' + emp.limiteDiario + ' h do empregado: não pode ser adotada.', base: emp.baseLimite });
    }
    if (pr.mediaSemanalMin < at.mediaSemanalMin) {
      alertas.push({ regra: 'R11', texto: 'A média semanal cai de ' + fmtMinutos(Math.round(at.mediaSemanalMin)) + ' para ' + fmtMinutos(Math.round(pr.mediaSemanalMin)) + ': o salário mensal não pode ser reduzido.', base: 'Emenda Constitucional 141/2026 (Fim da 6x1), art. 2º' });
    }
    return { atual: { mediaSemanalMin: at.mediaSemanalMin, maxDiaMin: at.maxDiaMin }, proposta: { mediaSemanalMin: pr.mediaSemanalMin, maxDiaMin: pr.maxDiaMin }, alertas: alertas };
  }

  /* ================================================== construtores de escala */

  const Escalas = {
    /** Modelo semanal: sete dias, de segunda a domingo (null = folga). */
    semanal: (id, dias7, op) => Object.assign({ id: id, dias: dias7.slice(), tipo: 'semanal' }, op || {}),
    /** Ciclo de N dias de trabalho por M de folga com um único turno (6x2, 4x4, 12x36 …). */
    ciclo: (id, trabalho, folga, turno, op) => Object.assign({ id: id, dias: Array(trabalho).fill(turno).concat(Array(folga).fill(null)), tipo: 'ciclo' }, op || {}),
    /** Sequência de modelos semanais (por exemplo, A, A, B, A). */
    sequencia: (id, modelos, op) => Object.assign({ id: id, dias: [].concat.apply([], modelos), tipo: 'semanal' }, op || {}),
  };

  /* ============================================================ metadados */

  const REGRAS = {

  }

  /* ================================================================ o que precisa mudar (diagnóstico) */

  const MUDANCA = {
    R1: 'Garantir dois repousos em cada semana',
    R2: 'Garantir a média mínima de repousos no mês prevista na norma coletiva',
    R3: 'Limitar a sequência de trabalho a 6 dias seguidos',
    R4: 'Dar folga em um domingo ao menos a cada três semanas no comércio e folga 1:1 aos domingos às mulheres',
    R5: 'Garantir 11 h de descanso entre o fim de uma jornada e o início da seguinte',
    R6: 'Ajustar o intervalo de refeição ao padrão legal',
    R7: 'Compensar o feriado trabalhado com folga em outro dia ou pagá-lo em dobro',
    R8: 'Limitar o turno de revezamento a 6 h por dia, ou a até 8 h com norma coletiva',
    R9: 'Ajustar a escala de menor ou aprendiz às regras próprias',
    R14: 'Limitar o tempo parcial a 30 h por semana',
    J1: 'Limitar a jornada a 8 h por dia ou firmar acordo de compensação',
    J2: 'Limitar a jornada a 10 h por dia',
    J4: 'Zerar no próprio mês as horas acima do teto',
    J5: 'Zerar o saldo do banco de horas no prazo',
    J7: 'Limitar a 8 h os dias em atividade insalubre ou obter norma coletiva que autorize expressamente a prorrogação ou autorização da Inspeção do Trabalho (Portaria MTE 2.041/2026, art. 15)',
  };
  /** O que precisa mudar na escala de hoje para cumprir a regra em cada etapa (texto do diagnóstico). */
  function mudancas(e, etapa) {
    const out = e.motivos.map((m) => ({
      regra: m.regra, pessoas: m.pessoas, hoje: m.exemplo,
      texto: m.regra === 'J3' ? 'Reduzir a semana a ' + (etapa === 1 ? '42 h' : '40 h')
        : m.regra === 'J6' ? 'Reduzir a média semanal da 12x36 a ' + (etapa === 1 ? '42 h' : '40 h')
          : MUDANCA[m.regra] || 'Corrigir: ' + (MOTIVO[m.regra] || m.regra),
    }));
    for (const p of e.pendente) out.push({ regra: p.regra, pessoas: null, hoje: null, texto: 'Firmar ' + p.nome.charAt(0).toLowerCase() + p.nome.slice(1) });
    return out;
  }

  /* ================================================================ horas e custos */

  /**
   * Horas médias por semana de cada pessoa num período, a partir dos dias avaliados pelo motor, em minutos:
   * de relógio (rel), computadas com a hora noturna reduzida (comp), noturnas de relógio (noct, inclusive a
   * prorrogação após as 5 h quando devida) e noturnas pagas como horas reduzidas (noctPago).
   */
  function medirEquipe(res, ini, nDias, extras) {
    const fim = ini + nDias - 1, sem = nDias / 7;
    const pessoas = res.empregados.map((e) => {
      let rel = 0, comp = 0, noct = 0, turnos = 0;
      for (const x of e.dias) if (x.d >= ini && x.d <= fim) { rel += x.rel; comp += x.comp; noct += x.noct; }
      for (const t of e.turnos) if (t.dia >= ini && t.dia <= fim) turnos++;
      const ex = (extras && extras[e.id]) || {};
      const reduzidos = (comp - M.U * rel) / M.U;   // minutos acrescidos pela hora noturna reduzida
      return { id: e.id, nova: !!ex.nova, parcial: ex.contrato === 'parcial', rel: rel / sem, comp: comp / M.U / sem, noct: noct / sem, noctPago: (noct + reduzidos) / sem, dias: turnos / sem };
    });
    const tot = (k) => pessoas.reduce((s, p) => s + p[k], 0);
    return { pessoas: pessoas, rel: tot('rel'), comp: tot('comp'), noct: tot('noct'), noctPago: tot('noctPago'), dias: tot('dias') };
  }

  /**
   * Horas úteis por semana (minutos): em cada dia da grade, a presença minuto a minuto de quem começa o turno naquele
   * dia, limitada à necessidade informada do dia. Horas além da necessidade não contam; o intervalo usufruído também não.
   */
  function horasUteis(g, dem) {
    if (!g || !g.linhas.length || !g.semanas) return 0;
    let total = 0;
    const dif = new Int32Array(2 * 1440 + 2);
    for (let i = 0; i < g.semanas * 7; i++) {
      const precisa = dem[i % 7] || 0;
      if (!precisa) continue;
      dif.fill(0);
      const soma = (a, b, v) => { const x = Math.max(0, Math.min(2880, a)), y = Math.max(0, Math.min(2880, b)); if (y > x) { dif[x] += v; dif[y] -= v; } };
      let algum = false;
      for (const l of g.linhas) { const h = l.horas[i]; if (!h) continue; algum = true; soma(h[0], h[1], 1); for (const q of (h[2] || [])) soma(q[0], q[1], -1); }
      if (!algum) continue;
      let c = 0;
      for (let m = 0; m < 2880; m++) { c += dif[m]; if (c > 0) total += Math.min(c, precisa); }
    }
    return total / g.semanas;
  }
  /** Minutos de [a, b) entre 22 h e 5 h, com a e b em minutos a partir da meia-noite do dia (podem passar de 1440). */
  function minutosNoite(a, b) {
    let n = 0;
    for (let k = -1; k <= 2; k++) { const x = Math.max(a, 1320 + 1440 * k), y = Math.min(b, 1740 + 1440 * k); if (y > x) n += y - x; }
    return n;
  }
  /**
   * Horas extras para manter o horário de hoje quando o cenário encurta a janela do turno: em cada dia de operação, as
   * pessoas necessárias estendem a jornada até a entrada ou a saída de hoje, em revezamento. Só vale até 2 h por dia
   * (CLT, art. 59), com a jornada total até 10 h e 11 h de descanso até a jornada seguinte (art. 66). Dia em que o
   * turno deixa de abrir não se cobre com hora extra: seria trabalho em dia de repouso.
   */
  function horasExtrasJanela(ctx, g, dem) {
    if (!g || !g.linhas.length) return null;
    const cedo = [], tarde = [], maior = [];
    for (let d = 0; d < 7; d++) { cedo.push(Infinity); tarde.push(-Infinity); maior.push(0); }
    for (const l of g.linhas) l.horas.forEach((h, i) => {
      if (!h) return;
      const d = i % 7, pausas = (h[2] || []).reduce((s, p) => s + (p[1] - p[0]), 0);
      cedo[d] = Math.min(cedo[d], h[0]); tarde[d] = Math.max(tarde[d], h[1]); maior[d] = Math.max(maior[d], h[1] - h[0] - pausas);
    });
    const dias = [], inviaveis = [], fechados = [];
    let minutos = 0, noturnos = 0;
    for (const d of ctx.operacao) {
      const a = ctx.atual[d];
      if (!a || !(dem[d] > 0) && !(ctx.dem[d] > 0)) continue;
      if (cedo[d] === Infinity) { fechados.push(d); continue; }
      const ini = a.ini, fim = a.ini + a.trab + a.intervalo;
      const antes = Math.max(0, cedo[d] - ini), depois = Math.max(0, fim - tarde[d]);
      const ext = antes + depois;
      if (!ext) continue;
      const prox = cedo[(d + 1) % 7] === Infinity ? null : cedo[(d + 1) % 7] + 1440;
      let motivo = null;
      if (ext > 120) motivo = 'faltam ' + fh(ext) + ' por dia, acima do limite de 2 h de horas extras';
      else if (maior[d] + ext > 600) motivo = 'a jornada passaria de 10 h';
      else if (prox != null && prox - (tarde[d] + depois) < 660) motivo = 'ficariam menos de 11 h até a jornada seguinte';
      const n = dem[d] || ctx.dem[d];
      if (motivo) { inviaveis.push({ d: d, ext: ext, motivo: motivo }); continue; }
      const noite = minutosNoite(ini, ini + antes) + minutosNoite(tarde[d], tarde[d] + depois);
      dias.push({ d: d, ext: ext, pessoas: n });
      minutos += n * ext; noturnos += n * noite;
    }
    if (!minutos && !inviaveis.length && !fechados.length) return null;
    return { minutos: minutos, noturnos: noturnos, dias: dias, inviaveis: inviaveis, fechados: fechados };
  }

  /**
   * Custo mensal estimado da escala de hoje e de um cenário nas duas etapas, e das alternativas para não perder horas
   * de trabalho (decisões D49 a D51). Valores em reais; sem salário informado, só as horas.
   * params: { salario: salário mensal de tempo integral do turno, encargos: % sobre a folha (encargos e provisões),
   *           he: % do adicional de horas extras (50 se vazio), noturno: % do adicional noturno (20 se vazio),

  function custos(c, base, params) {
    const p = params || {};
    const num = (v, padrao) => (v === '' || v == null || !Number.isFinite(Number(v)) ? padrao : Math.max(0, Number(v)));
    const sal = num(p.salario, 0) > 0 ? num(p.salario, 0) : null;
    const enc = num(p.encargos, 0) / 100, pHE = num(p.he, 50) / 100, pNot = num(p.noturno, 20) / 100;
    // horista (D91): com os dois repousos remunerados, o mensal sai da hora; 'reajuste' mantém o mensal de hoje, como o mensalista
    const leitura = p.horista && LEITURAS_HORISTA.indexOf(p.horista.leitura) >= 0 ? p.horista.leitura : 'literal';
    const hor = sal && p.horista && num(p.horista.hora, 0) > 0 && leitura !== 'reajuste'

    const mediaInt = (eq, padrao) => { const xs = eq ? eq.pessoas.filter((x) => !x.parcial && x.comp > 0) : []; return xs.length ? xs.reduce((s, x) => s + x.comp, 0) / xs.length : padrao; };
    const intHoje = mediaInt(base, 2640);

    if (base && sal) for (const x of base.pessoas) salHoje.set(x.id, x.parcial ? sal * x.comp / intHoje : sal);

    // folha da equipe: salário mensal de cada pessoa (irredutível, Emenda Constitucional 141/2026 – Fim da 6x1, art. 2º), mais adicional noturno pelo salário-hora
    // divisor do salário-hora (Decreto 13.173/2026, art. 5º): 210 com jornada máxima de 42 h e 200 com 40 h (220 hoje, 44 h);
    // prevalece o inferior quando a jornada contratual é menor (as horas semanais da pessoa × 5)
    const DIVISOR_MAX = { hoje: 220, e1: 210, e2: 200 };
    function folha(eq, padraoInt, etapa, fase) {
      if (!eq || !sal) return null;
      const intE = mediaInt(eq, padraoInt);

      const lim = fase === 'e1' ? 2520 : fase === 'e2' ? 2400 : 2640;
      for (const x of eq.pessoas) {

        let s = salHoje.has(x.id) ? Math.max(salHoje.get(x.id), x.parcial ? prop : 0) : prop;
        // horista nas etapas da Emenda: hora × (horas da semana + repousos remunerados); quem já está no quadro não recebe menos que hoje
        if (etapa && hor) s = salHoje.has(x.id) ? Math.max(salHoje.get(x.id), mensal(x)) : mensal(x);
        const divisor = Math.min(x.comp / 60 * 5, DIVISOR_MAX[fase] || 220);
        salarios += s;
        if (etapa && hor) noturno += x.noctPago / 60 * SEMANAS_MES * hor.hora * pNot;
        else if (divisor > 0) noturno += x.noctPago / 60 * SEMANAS_MES * (s / divisor) * pNot;
        // D118: na 12x36, as horas acima do limite (média da etapa) entram como extras, estimativa conservadora
        if (etapa && c.familia === '12x36' && !x.parcial && x.comp > lim && divisor > 0) {
          const h = (x.comp - lim) / 60 * SEMANAS_MES;
          horas12 += h; extras12 += h * (hor ? hor.hora : s / divisor) * (1 + pHE);
        }
      }
      return { salarios: salarios, noturno: noturno, extras12: extras12, horas12: horas12, total: (salarios + noturno + extras12) * (1 + enc) };
    }
    const hoje = folha(base, 2640, false, 'hoje'), e1 = folha(c.eco.e1, 2520, true, 'e1'), e2 = folha(c.eco.e2, 2400, true, 'e2');
    // tempo parcial de hoje com mais horas no cenário: o salário proporcional sobe junto (aparece como aviso)
    const compHoje = new Map(base ? base.pessoas.map((x) => [x.id, x.comp]) : []);
    const parciaisMais = c.eco.e2.pessoas.filter((x) => x.parcial && compHoje.has(x.id) && x.comp > compHoje.get(x.id) + 30).map((x) => ({ id: x.id, de: compHoje.get(x.id), para: x.comp }));
    const ints2 = c.eco.e2.pessoas.filter((x) => !x.parcial && x.comp > 0);
    const diasInt = ints2.length ? ints2.reduce((s, x) => s + x.dias, 0) / ints2.length : 5;
    // salário-hora da etapa de 40 h: o do mensal ÷ divisor; o horista (leituras literal e 1/6) mantém a hora contratada
    const hora2 = sal && ints2.length ? (hor ? hor.hora : sal / Math.min(mediaInt(c.eco.e2, 2400) / 60 * 5, 200)) : null;
    // mensal de uma contratação em tempo integral: o salário do cargo, ou o mensal do horista pela jornada do cenário
    const salNovo = sal ? (hor ? mensalHorista(hor.hora, mediaInt(c.eco.e2, 2400), diasInt, hor.leitura, hor.inclui) : sal) : null;
    const reflexo = diasInt > 0 ? (7 - diasInt) / diasInt : 0;  // repousos ÷ dias de trabalho na semana (estimativa, D50)
    function precoHE(min, noite) {
      if (!hora2) return null;
      const dia = (min - noite) / 60 * SEMANAS_MES * hora2 * (1 + pHE);
      const not = noite * 8 / 7 / 60 * SEMANAS_MES * hora2 * (1 + pNot) * (1 + pHE);
      const valor = dia + not;
      return { valor: valor, reflexo: valor * reflexo, total: valor * (1 + reflexo) * (1 + enc) };
    }
    // perda de produção: horas que cobrem a necessidade informada (horas úteis), hoje contra a etapa de 40 h
    const util2 = c.eco.util2 != null ? c.eco.util2 : c.eco.e2.rel, utilHoje = base ? (base.util != null ? base.util : base.rel) : null;

    else if (jan && (jan.minutos > 0 || jan.inviaveis.length || jan.fechados.length)) {

    } else if (perda > 0 && c.descoberto) he = { tipo: 'nao', motivo: 'a perda vem de pessoas a menos em alguns dias; hora extra alonga a jornada de quem está, mas não põe mais gente no dia, e trabalhar no dia de folga quebraria os dois repousos' };
    else if (perda > 0 && !(c.fecha && c.fecha.length)) {

      he = Object.assign({ tipo: 'horas', minutos: perda, noturnos: noite, porPessoa: perda / Math.max(1, ints2.length), porDia: porDia, cabe: porDia <= margem, naoRepoePessoas: !!c.descoberto }, precoHE(perda, noite) || {});
    }
    const fte = perda > 0 ? perda / relInt2 : 0;   // fração de uma jornada integral da etapa de 40 h
    return {
      temSalario: !!sal, encargos: p.encargos !== '' && p.encargos != null, fator: 1 + enc, hoje: hoje, e1: e1, e2: e2,
      horas: { hoje: base ? base.rel : null, e1: c.eco.e1.rel, e2: c.eco.e2.rel, utilHoje: utilHoje, util2: util2, perda: perda, produtividade: perda > 0 && util2 > 0 ? utilHoje / util2 - 1 : 0,
        noturnasHoje: base ? base.noctPago : null, noturnasE2: c.eco.e2.noctPago },
      he: he, fechados: c.fecha || (jan ? jan.fechados : []), parciaisMais: parciaisMais,
      contratacao: fte ? { fte: fte, integrais: Math.ceil(fte - 1e-9), totalIntegrais: sal ? Math.ceil(fte - 1e-9) * salNovo * (1 + enc) : null, totalProporcional: sal ? fte * salNovo * (1 + enc) : null } : null,
      salarioHora: { hoje: sal && base ? sal / Math.min(intHoje / 60 * 5, 220) : null, e2: hora2 },

  }

  /* ================================================================ instrumentos */

  function instrumentos(lista, neg, turnoUsuario) {
    const out = [];
    const coletivo = (tipo) => ({ id: M.TIPOS_INSTRUMENTO[tipo].nome, tipo: tipo, natureza: 'coletivo', celebracao: '2026-12-01', vigenciaInicio: '2026-12-01', compativel: true, compativel40: true });
    const individual = (tipo) => ({ id: M.TIPOS_INSTRUMENTO[tipo].nome, tipo: tipo, natureza: 'individual', vigenciaInicio: '2020-01-01' });
    for (const x of lista) {
      if (x === 'art7' && neg.art7) out.push(coletivo('ampliacao_art7'));
      if (x === 'par2' && neg.par2) out.push(coletivo('media_par2'));
      // 12x36 só com convenção ou acordo coletivo: o acordo individual não assegura a validade da escala (decisão D39)
      if (x === '12x36' && neg.x12) out.push(coletivo('escala_12x36'));
      // D118: cláusula de compensação ou pagamento das horas acima do limite do mês (Decreto 13.173/2026, art. 3º)
      if (x === '12x36' && neg.x12e) out.push(coletivo('excesso_12x36'));
      if (x === 'comp') out.push(individual('compensacao_mensal'));
      // hipóteses de norma coletiva que o cenário supõe firmada (D99): a situação fica "depende de negociação" quando não marcada
      if (x === 'par2!') out.push(coletivo('media_par2'));
      if (x === 'banco!') out.push(coletivo('banco_anual'));
      // D108: compensação pela média em norma coletiva (semanas de até 42 h com a média do ciclo no teto)
      if (x === 'media!') out.push(coletivo('compensacao_media'));
      // D122: compensação pela média do mês sem teto semanal e jornada de até 12 h fora da 12x36, hipóteses de norma coletiva
      if (x === 'mediames!') out.push(coletivo('compensacao_media_mes'));
      if (x === 'j12!') out.push(coletivo('jornada_12h'));
    }
    // intervalo: a redução depende de norma coletiva; o intervalo acima de 2 h admite acordo escrito
    // D113: normas e licença que a empresa informou ter (turno ininterrupto até 8 h, atividade insalubre)
    if (neg.tii) out.push(coletivo('turno_ininterrupto_8h'));
    if (neg.insal) out.push(coletivo('prorrogacao_insalubre'));
    if (neg.lic60) out.push({ id: M.TIPOS_INSTRUMENTO.licenca_art60.nome, tipo: 'licenca_art60', natureza: 'ato do Ministério do Trabalho', vigenciaInicio: '2020-01-01' });

    const ivMax = turnoUsuario.intervaloMax != null ? turnoUsuario.intervaloMax : turnoUsuario.intervalo;
    if (ivMin > 0 && ivMin < 60 && neg.intervalo) out.push(coletivo('reducao_intervalo'));
    if (ivMax > 120) out.push(individual('intervalo_superior_2h'));
    return out;
  }
  const ACORDO_COMP = 'Acordo individual escrito de compensação de jornada (CLT, art. 59, § 6º; Súmula 85, I, do TST)';
  const ROTULO_NEGOCIACAO = {
    art7: 'Convenção ou acordo coletivo que amplie a duração diária para distribuir as 42 h em cinco dias ou menos (Emenda Constitucional 141/2026 – Fim da 6x1, art. 7º)',
    par2: 'Convenção ou acordo coletivo com regime de média de repousos no mês-calendário (CF, art. 7º, § 2º; Portaria MTE 2.041/2026, art. 4º, §§ 3º e 4º)',
    intervalo: 'Norma coletiva que reduza o intervalo de refeição a no mínimo 30 min (CLT, art. 611-A, III)',
    x12: 'Convenção ou acordo coletivo que autorize a 12x36 (CLT, art. 59-A). O acordo individual escrito, embora previsto na lei, não assegura a validade da escala',
    media: 'Convenção ou acordo coletivo de compensação pela média: semanas de até 42 h (leitura do escritório), com a média do mês-calendário no teto semanal e dois repousos por semana na média do mês (Portaria MTE 2.041/2026, arts. 3º e 4º)',
    tii: 'Convenção ou acordo coletivo de turno ininterrupto de revezamento de até 8 h (CF, art. 7º, XIV; Súmula 423 do TST; Portaria MTE 2.041/2026, art. 7º)',

  function cenarios(turno, empresa, opcoes) {
    const ctx = contexto(turno, empresa, opcoes);
    if (ctx.erro) return { erro: ctx.erro };
    const dur = ctx.dur, dem = ctx.dem, ops = ctx.operacao;
    const defs = [];
    // escalas que o planejador testou e deixou de fora antes de calcular, com o motivo (D86)
    const fora = [];
    const descartar = (familia, nome, motivo) => { if (!fora.some((x) => x.familia === familia)) fora.push({ familia: familia, nome: nome, motivo: motivo }); };
    const Pa = ctx.parciaisAtuais.length, Ia = ctx.integraisAtuais.length;
    const quadro = { atual: Ia + Pa, integraisAtuais: Ia, parciaisAtuais: Pa, ferias: 0 };
    const avisoFixo = (h) => (h && h.muda ? (ctx.funcionamento === 'fixo' ? 'O horário deste turno foi marcado como fixo: este cenário não serve sem mudar o funcionamento.' : ctx.funcionamento ? null : PERGUNTA_HORARIO) : null);

    if (!ctx.longo) {
      const atual = ctx.atual;
      const e8 = limitarDia(ctx, 480);
      const excede = ops.some((d) => e8[d].trab < atual[d].trab);
      const hc8 = horarioCenario('T', e8, null);
      const h8 = infoHorario(ctx, e8, null);
      const k = kParcialSemana(e8, ops);
      const uniforme8 = ctx.uniforme;
      const trabU = e8[ops[0]].trab;
      const noturno = ops.some((d) => computadas(turnoMotor('x', e8[d].ini, e8[d].trab, e8[d].intervalo)) > e8[d].trab * M.U)
        ? 'Turno com hora noturna reduzida: as horas de relógio valem mais em horas computadas, e o limite é aplicado sobre elas.' : null;
      const opBase = { pref: ctx.pref, prefP: ctx.prefP, w: 5, k: k, P: Pa, domingoComercio: ctx.domingo, rodizio: true };

      // 5x2 em rodízio (ou com folgas comuns a todos), já com a reserva de férias quando a premissa estiver ligada
      const eqMin = comporMinimo(dem, opBase);
      const rf = comFerias(ctx, dem, eqMin, opBase);
      const eqR = rf.eq;
      if (eqR) {
        quadro.minimo = rf.min; quadro.necessario = eqR.I + eqR.P; quadro.integrais = eqR.I; quadro.parciais = eqR.P; quadro.ferias = rf.r;
        const unico = !eqR.rodizioI;
        const base = uniforme8 ? '5x2 de ' + fh(trabU) : excede ? '5x2 com até 8 h por dia' : '5x2 no horário atual';
        defs.push({
          id: '5x2', nome: unico ? base : base + ' com rodízio de folgas',
          resumo: 'Cinco dias de trabalho e dois repousos por semana, até 40 h semanais. Não depende de negociação.',
          jornada: textoHorarioCenario(ctx, e8), grupos: gruposSemanais(ctx, eqR, hc8), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario), horasSemana: horasDe(eqR, e8),
          reservaFerias: rf.r, horario: h8,
          ponderacoes: [textoMudanca(h8), avisoFixo(h8), textoFerias(rf), noturno, descreverFolgas(eqR), eqR.P ? 'Tempo parcial atual mantido em ' + k + ' dias (' + diasParciais(eqR) + ').' : null,
            textoDomingo(ctx)],
          cicloSemanas: eqR.rodizioI ? eqR.folgasI.length : null, semanasGrade: semanasGrade(eqR),
        });
        // folga 1:1 aos domingos só para as mulheres (D98): rodízio próprio para elas e o comum para os demais, em vez de
        // dar a todos o domingo a cada duas semanas, o que pede mais gente e deixa sobra nos outros dias
        const eqS = ctx.art386 && dem[6] > 0 && Pa === 0 ? doisRodizios(ctx, dem, opBase) : null;
        if (eqS && eqS.W + eqS.eqM.I < eqR.I) {
          const lcm = (a, b) => { const g = (x, y) => (y ? g(y, x % y) : x); return a * b / g(a, b); };
          const ciclo = Math.min(12, lcm(eqS.eqW.rodizioI ? eqS.eqW.folgasI.length : 1, eqS.eqM.rodizioI ? eqS.eqM.folgasI.length : 1));
          defs.push({
            id: '5x2-mulheres', familia: '5x2', nome: base + ' com domingo 1:1 só para as mulheres',
            resumo: 'Cinco dias de trabalho e dois repousos por semana. As mulheres seguem um rodízio próprio, com folga num domingo e trabalho no outro; os demais, o rodízio comum. Não depende de negociação.',
            jornada: textoHorarioCenario(ctx, e8),
            grupos: [{ modo: eqS.eqW.rodizioI ? 'rodizio' : 'fixo', turnos: hc8.turnos, periodos: hc8.periodos, folgas: eqS.eqW.folgasI, pessoas: nomesPessoas(eqS.W, eqS.mulheres, 'Nova contratação', false) },
              { modo: eqS.eqM.rodizioI ? 'rodizio' : 'fixo', turnos: hc8.turnos, periodos: hc8.periodos, folgas: eqS.eqM.folgasI, pessoas: nomesPessoas(eqS.eqM.I, eqS.outros, 'Nova contratação', false) }],
            instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario), horasSemana: horasDe(eqS.eqW, e8) + horasDe(eqS.eqM, e8),
            reservaFerias: eqS.reserva, horario: h8,
            ponderacoes: [textoMudanca(h8), avisoFixo(h8),
              'Rodízio das mulheres: folga num domingo a cada duas semanas (CLT, art. 386). Demais: ' + (ctx.comercio ? 'um domingo de folga a cada três semanas (Lei 10.101/2000, art. 6º, parágrafo único).' : 'o rodízio comum.') + ' Se uma das contratações for mulher, ela entra no rodízio das mulheres e o quadro pode mudar.',
              'Pede ' + pl(eqR.I - eqS.W - eqS.eqM.I, 'pessoa', 'pessoas') + ' a menos que dar o domingo a cada duas semanas a todos.',
              eqS.reserva ? 'Inclui ' + pl(eqS.reserva, 'pessoa', 'pessoas') + ' para cobrir 30 dias de férias de cada empregado no ano.' : null, noturno],
            cicloSemanas: ciclo > 1 ? ciclo : null, semanasGrade: Math.min(Math.max(ciclo, 3), 6),
          });
        }
        if (!unico && ctx.domingo) descartar('5x2-fixas', '5x2 com folgas fixas', 'Com folgas sempre nos mesmos dias, quem trabalha aos domingos nunca folgaria num domingo, e o prazo do domingo de folga (' + (ctx.domingo === 2 ? 'folga 1:1 aos domingos para as mulheres' : 'um a cada três semanas no comércio') + ') não seria cumprido.');
        if (!unico && !ctx.domingo) {
          const eqF = compor(dem, Object.assign({}, opBase, { I: eqR.I, rodizio: false, forcar: true }));
          if (eqF) defs.push({
            id: '5x2-fixas', nome: base + ' com folgas fixas',
            resumo: 'Mesma equipe do rodízio, mas cada pessoa folga sempre nos mesmos dias. Mais simples de administrar, menos equilibrado no fim de semana.',
            jornada: textoHorarioCenario(ctx, e8), grupos: gruposSemanais(ctx, eqF, hc8), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario), horasSemana: horasDe(eqF, e8),
            reservaFerias: rf.r, horario: h8, ponderacoes: [textoMudanca(h8), textoFerias(rf), descreverFolgas(eqF)], semanasGrade: 3,
          });
        }
      }

      // 5x2 com tempo parcial: só quando o turno precisa contratar, sem tirar ninguém do quadro atual
      if (eqR && eqR.I > 1 && Ia < eqR.I && k >= 2 && Math.min.apply(null, ops.map((d) => e8[d].trab)) > 360) {
        let melhor = null;
        for (let I = Math.max(1, Ia); I < eqR.I; I++) {
          for (let P = Pa + 1; P <= Pa + 3 * Math.max.apply(null, dem) + 3; P++) {
            if (!capacidadeOk(ctx, 5 * I + k * P)) continue;
            const e = compor(dem, { pref: ctx.pref, prefP: ctx.prefP, w: 5, k: k, P: P, I: I, domingoComercio: ctx.domingo, rodizio: true });
            if (!e) continue;
            const horas = horasDe(e, e8);
            if (!melhor || horas < melhor.horas || (horas === melhor.horas && I + P < melhor.eq.I + melhor.eq.P)) melhor = { eq: e, horas: horas };
            break;
          }
        }
        if (melhor) {
          const e = melhor.eq, h5 = horasDe(eqR, e8);
          const novosI = Math.max(0, e.I - Ia), novosP = Math.max(0, e.P - Pa), nI = Math.max(0, eqR.I - Ia);
          defs.push({
            id: '5x2-parcial', nome: '5x2 com reforço em tempo parcial',
            resumo: pl(e.I, 'pessoa', 'pessoas') + ' em tempo integral (5x2) e ' + e.P + ' em tempo parcial de ' + k + ' dias por semana, nos dias de maior movimento.',
            jornada: textoHorarioCenario(ctx, e8), grupos: gruposSemanais(ctx, e, hc8), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario), horasSemana: melhor.horas, horario: h8,
            ponderacoes: [
              'Contratação: ' + (novosI ? pl(novosI, 'integral', 'integrais') + ' e ' : '') + pl(novosP, 'parcial', 'parciais') + ', em vez de ' + pl(nI, 'integral', 'integrais') + ' no 5x2 só com tempo integral.',
              melhor.horas < h5 ? 'Contrata menos horas: ' + fh(melhor.horas) + ' contra ' + fh(h5) + ' por semana.'
                : melhor.horas === h5 ? 'Mesmas horas contratadas (' + fh(h5) + ' por semana), com mais gente nos dias de pico.'
                : 'Contrata mais horas: ' + fh(melhor.horas) + ' contra ' + fh(h5) + ' por semana. Pode compensar se for difícil contratar em tempo integral.',
              ctx.exigeFerias ? 'A equipe já comporta 30 dias de férias de cada empregado no ano.' : textoFeriasHoje(ctx),
              'Tempo parcial: até 30 h semanais sem horas extras, salário proporcional e também dois repousos por semana (CLT, art. 58-A)' + (noturno ? '; no turno noturno, conta a hora reduzida.' : '.'),
              'Dias dos parciais: ' + diasParciais(e) + '.', textoMudanca(h8), avisoFixo(h8),
            ],
            semanasGrade: semanasGrade(e),
          });
        }
      }

      // 5x2 com até 8h24 na etapa de 42 h: sem norma coletiva pela liminar na ADI 8.041 (D101); sem ela, art. 7º da Emenda
      if (eqR && excede) {
        const e42 = limitarDia(ctx, 504);
        if (ops.some((d) => e42[d].trab > e8[d].trab)) {
          const h42 = infoHorario(ctx, e42, e8), lim = ctx.liminar;
          defs.push({
            id: '5x2-art7', nome: uniforme8 ? '5x2 de ' + fh(e42[ops[0]].trab) + ' até dez/2027, depois ' + fh(trabU) : '5x2 com até 8h24 por dia até dez/2027, depois 8 h',
            resumo: lim ? 'Transição em dois tempos: até 8h24 por dia na etapa de 42 h, sem norma coletiva e sem adicional, pela liminar na ADI 8.041, e até 8 h a partir de 13/12/2027.'
              : 'Transição em dois tempos: até 8h24 por dia na etapa de 42 h, por norma coletiva (Emenda Constitucional 141/2026 – Fim da 6x1, art. 7º), e até 8 h a partir de 13/12/2027.',
            jornada: textoHorarioCenario(ctx, e42, e8), grupos: gruposSemanais(ctx, eqR, horarioCenario('T', e42, e8)), instrumentos: instrumentos(lim ? [] : ['art7'], ctx.neg, ctx.turnoUsuario), negociar: lim ? [] : ['art7'],
            horasSemana: horasDe(eqR, e42), reservaFerias: rf.r, horario: h42, liminar: lim,
            ponderacoes: [
              lim ? 'A liminar na ADI 8.041 (STF, 12/11/2026) admite, sem convenção ou acordo coletivo firmado até 15/12/2026, dias de até 8h24 para distribuir as 42 h em cinco dias, sem adicional sobre os 24 minutos, até 15/12/2027. Ela vale até o julgamento de mérito pelo Plenário do STF: se não for mantida, os dias acima de 8 h voltam a depender de norma coletiva (art. 7º da Emenda).'
                : 'Pela leitura adotada, o art. 7º exige convenção ou acordo coletivo; há quem sustente que basta acordo individual de compensação.',
              'O quadro é o mesmo do 5x2 de 8 h: a vantagem é manter 42 h por pessoa até dezembro de 2027 e mudar o horário em duas etapas.',
              textoMudanca(h42), avisoFixo(h42), textoFerias(rf), descreverFolgas(eqR),
            ],
            semanasGrade: semanasGrade(eqR),
          });
        }
      }

      // 42 h com o último dia da semana mais curto (ex.: seg a qui até 8h30 e sexta menor), depois 8 h por dia
      if (eqR && excede && !eqR.rodizioI && eqR.P === 0 && new Set(eqR.folgasI.map((f) => f.join())).size === 1) {
        const trabalha = [0, 1, 2, 3, 4, 5, 6].filter((d) => eqR.folgasI[0].indexOf(d) < 0 && ctx.semana[d]);
        if (trabalha.length === 5 && trabalha.reduce((s, d) => s + atual[d].trab, 0) > 2400) {
          const ultimo = trabalha[4], eS = atual.map((x) => x && Object.assign({}, x));
          let soma = 0;
          for (const d of trabalha.slice(0, 4)) { eS[d].trab = Math.min(atual[d].trab, ajustarJornada(atual[d].ini, atual[d].intervalo, 510)); soma += eS[d].trab; }
          eS[ultimo].trab = Math.min(atual[ultimo].trab, ajustarJornada(atual[ultimo].ini, atual[ultimo].intervalo, Math.max(240, 2520 - soma)));
          const total = soma + eS[ultimo].trab;
          if (total > 2400 && total <= 2520 && eS[ultimo].trab < Math.max.apply(null, trabalha.slice(0, 4).map((d) => eS[d].trab))) {
            for (let d = 0; d < 7; d++) if (eS[d] && trabalha.indexOf(d) < 0) eS[d] = e8[d];
            const hS = infoHorario(ctx, eS, e8);
            const dia = DIAS_LONGOS[ultimo], curto = ultimo >= 5 ? 'mais curto' : 'mais curta';
            defs.push({
              id: '5x2-semana-curta', nome: '5x2 com ' + dia + ' ' + curto + ': 42 h até dez/2027, depois 40 h',
              resumo: 'Na etapa de 42 h, até 8h30 nos quatro primeiros dias e ' + fh(eS[ultimo].trab) + ' na ' + dia + '; a partir de 13/12/2027, até 8 h por dia.',
              jornada: textoHorarioCenario(ctx, eS, e8), grupos: gruposSemanais(ctx, eqR, horarioCenario('T', eS, e8)), instrumentos: instrumentos(['art7'], ctx.neg, ctx.turnoUsuario), negociar: ['art7'],
              horasSemana: horasDe(eqR, eS), reservaFerias: rf.r, horario: hS,
              ponderacoes: [
                (ctx.liminar ? 'A liminar na ADI 8.041 dispensa a norma coletiva só com dias de até 8h24; aqui há dias de até 8h30. ' : '') + 'Pela leitura adotada, distribuir mais de 40 h em cinco dias, com dias acima de 8 h, exige convenção ou acordo coletivo (Emenda Constitucional 141/2026 – Fim da 6x1, art. 7º). Pela leitura alternativa, basta acordo individual escrito de compensação.',
                'Na etapa de 40 h a mesma grade passaria do teto: por isso volta a até 8 h por dia em 13/12/2027.',
                textoMudanca(hS), avisoFixo(hS), textoFerias(rf),
              ],
              semanasGrade: 3,
            });
          }
        }
      }

      // 4x3: no horário atual quando a jornada passa de 8 h e cabe em 10 h; senão, 4 dias de 10 h
      if (ops.length < 4) descartar('4x3', '4x3', 'O turno funciona em menos de quatro dias por semana.');
      if (ops.length >= 4) {
        const maiores = ops.map((d) => atual[d].trab).sort((a, b) => b - a).slice(0, 4).reduce((s, x) => s + x, 0);
        const manter = excede && ops.every((d) => atual[d].trab <= 600 && computadas(turnoMotor('x', atual[d].ini, atual[d].trab, atual[d].intervalo)) <= 600 * M.U) && maiores <= 2400;
        let e4 = null;
        if (manter) e4 = atual;
        else if (!excede) {
          e4 = ctx.semana.map((s) => s && { ini: s.ini, trab: 600, intervalo: s.intervalo || 60 });
          if (ops.some((d) => computadas(turnoMotor('x', e4[d].ini, 600, e4[d].intervalo)) > 600 * M.U)) e4 = null;
        }
        if (!e4) descartar('4x3', '4x3', excede ? 'A jornada de hoje não cabe em quatro dias sem passar de 10 h por dia ou de 40 h por semana (limite da compensação, CLT, art. 59, § 2º).'
          : 'No turno noturno, quatro dias de 10 h passariam do limite de 10 h computadas por dia, por causa da hora noturna reduzida.');
        if (e4) {
          const op4 = { pref: ctx.pref, prefP: ctx.prefP, w: 4, k: 3, P: Pa, domingoComercio: ctx.domingo, rodizio: true };
          const rf4 = comFerias(ctx, dem, comporMinimo(dem, op4), op4);
          const eq4 = rf4.eq;
          if (!eq4) descartar('4x3', '4x3', 'Não houve equipe em 4x3 que cobrisse a necessidade de todos os dias com as folgas exigidas.');
          if (eq4) {
            const h4 = infoHorario(ctx, e4, null);
            const ivs = new Set(ops.map((d) => e4[d].intervalo));
            defs.push({
              id: '4x3', nome: manter ? '4x3 no horário atual' : '4x3 de 10 h',
              resumo: manter ? 'Mantém o horário de funcionamento: cada pessoa trabalha quatro dias no horário de hoje e folga três; a semana de cada uma fica abaixo de 40 h.'
                : 'Quatro dias de 10 h e três folgas por semana: 40 h semanais, com compensação dentro da própria semana.',
              jornada: textoHorarioCenario(ctx, e4), grupos: gruposSemanais(ctx, eq4, horarioCenario('Q', e4, null)), instrumentos: instrumentos(['comp'], ctx.neg, { intervaloMin: Math.min.apply(null, Array.from(ivs)), intervaloMax: Math.max.apply(null, Array.from(ivs)) }),
              acordos: [ACORDO_COMP], horasSemana: horasDe(eq4, e4), reservaFerias: rf4.r, horario: h4,
              ponderacoes: [
                textoMudanca(h4), avisoFixo(h4), textoFerias(rf4),
                manter ? 'Dias acima de 8 h, com a semana abaixo de 40 h: basta acordo individual escrito de compensação, porque as horas se redistribuem dentro da própria semana e todas as semanas mantêm os repousos (CLT, art. 59, § 6º; Súmula 85, I, do TST).'
                  : '10 h é o limite diário com compensação (CLT, art. 59, § 2º): não sobra margem para hora extra. Basta acordo individual escrito, porque a compensação ocorre dentro da própria semana.',
                'Em atividade insalubre, a prorrogação depende de norma coletiva que a autorize expressamente ou de autorização da Inspeção do Trabalho (Portaria MTE 2.041/2026, art. 15).',
                eqR && eq4.I > eqR.I ? 'Pede ' + pl(eq4.I - eqR.I, 'pessoa', 'pessoas') + ' a mais que o 5x2, porque cada uma trabalha um dia a menos.' : null,
                eq4.P ? 'Tempo parcial atual em 3 dias.' : null,
                descreverFolgas(eq4),
              ],
              semanasGrade: semanasGrade(eq4),
            });
          }
        }
      }

      // Mantém a janela com duas equipes de 8 h escalonadas, sempre que a jornada passa de 8 h: entra entre as opções mesmo
      // quando o 4x3 também mantém o horário, porque o simulador expõe as escalas sem escolher entre elas (D112)
      if (eqR && excede) defs.push(defEscalonado(ctx, eqR, rf));

      // Sem contratar: 5x2 com o quadro atual. Quando o funcionamento pode mudar, é um rearranjo do atendimento
      // (menos gente nos dias de menor movimento), não uma falha; quando precisa ser mantido, aparece como lacuna.
      if (eqR && Ia + Pa > 0 && Ia < eqR.I) {
        const eqS = compor(dem, { pref: ctx.pref, prefP: ctx.prefP, w: 5, k: k, P: Pa, I: Ia, domingoComercio: ctx.domingo, rodizio: true, forcar: true, protege: ctx.protege });
        if (eqS) {
          const cobre = !eqS.faltas.some((x) => x > 0);
          // menos gente nos dias fracos é pergunta própria (D95); sem resposta a ela, vale a do funcionamento, como antes
          const livre = ctx.menosGente ? ctx.menosGente !== 'nao' : ctx.funcionamento !== 'fixo';
          const nec = ctx.somaDem, ofer = dem.reduce((s, x, d) => s + Math.min(x, eqS.cobertura[d]), 0);
          const semRes = ctx.exigeFerias && !capacidadeOk(ctx, 5 * Ia + k * Pa);
          defs.push({
            id: 'sem-contratar', nome: cobre ? '5x2 com o quadro atual, sem contratar' : livre ? '5x2 com o quadro atual e menos gente em alguns dias' : '5x2 com o quadro atual, sem contratar',
            resumo: 'As mesmas ' + (Ia + Pa) + ' pessoas passam para 5x2. ' + (cobre ? 'Cobre a necessidade nas semanas normais' + (semRes ? ', mas não as férias.' : '.')
              : livre ? 'Para cumprir a Emenda Constitucional 141 (Fim da 6x1) sem contratar, o atendimento passa de ' + nec + ' para ' + ofer + ' presenças por semana, com menos gente nos dias de menor movimento.'
                : 'Atende à Emenda Constitucional 141 (Fim da 6x1), mas abre lacunas na cobertura.'),
            jornada: textoHorarioCenario(ctx, e8), grupos: gruposSemanais(ctx, eqS, hc8), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario), horasSemana: horasDe(eqS, e8), horario: h8,
            semFerias: semRes, rearranjo: livre && !cobre,
            ponderacoes: [cobre ? null : livre ? 'Rearranjo do funcionamento: serve se a operação comporta menos pessoas nesses dias, por exemplo com atendimento reduzido, fila maior ou tarefas remanejadas.'
              : 'Só faz sentido se a necessidade informada puder ser reduzida, por exemplo com mudança no horário de atendimento.',
              !cobre && livre && !ctx.menosGente && !ctx.funcionamento ? 'Confirme no passo 1 se a empresa aceita menos gente nos dias de menor movimento.' : null,
              semRes ? 'Sem reserva para as férias: em cada período de férias, o turno fica abaixo da necessidade.' : null, textoMudanca(h8), avisoFixo(h8)],
            semanasGrade: 3,
          });
        }
      }

      // Rearranjo do funcionamento: deixar de abrir no dia (ou nos dois dias) de menor movimento, para atender os demais
      // com o quadro atual em 5x2, sem contratar. Só quando o funcionamento não foi marcado como fixo.
      if (ctx.funcionamento !== 'fixo' && eqR && Ia > 0 && Ia < eqR.I && ops.length >= 6) {
        // só dias de movimento até a média dos dias de operação: fechar o dia de pico não é rearranjo razoável
        const perda = (C) => C.reduce((s, d) => s + dem[d] * e8[d].trab, 0);
        const media = ctx.somaDem / ops.length;
        const mPrio = ctx.prio ? ops.reduce((s, d) => s + ctx.prio[d], 0) / ops.length : null;
        const baixos = ops.filter((d) => dem[d] <= media && (!ctx.prio || ctx.prio[d] <= mPrio + 1e-9));
        const somaPrio = (C) => (ctx.prio ? C.reduce((s, d) => s + ctx.prio[d], 0) : 0);
        const cands = baixos.map((d) => [d]);

    } else {

      const ps = nomesPessoas(N, ctx.integraisAtuais, 'Nova contratação', false);
      const desl = ps.map((_, j) => j % 2);
      const tInd = turnoMotor('T12', dur.ini, dur.presenca - 60, 60, 'indenizado');
      const tUsu = turnoMotor('T11', dur.ini, dur.presenca - 60, 60, 'usufruido');
      const inst12 = instrumentos(['12x36'], ctx.neg, { intervalo: 60 });
      const horas = (m, n) => Math.round(m * 3.5) * n;
      const ponderNoite = computadas(tUsu, '12x36') > (dur.presenca - 60) * M.U ? 'Plantão noturno: a hora reduzida eleva as horas computadas; confira o tratamento na norma coletiva.' : null;
      const fimP = hm(dur.ini + dur.presenca);
      const sem12 = { muda: false, atual: textoJanela(ctx.atual, ops), e1: textoJanela(ctx.atual, ops), e2: null };
      const comum = { familia: '12x36', instrumentos: inst12, negociar: ['x12'], reservaFerias: rf.r, semanasGrade: 2, horario: sem12 };
      defs.push(Object.assign({}, comum, {
        id: '12x36-usufruido', nome: '12x36 com intervalo usufruído',
        resumo: 'Dois empregados por posto, em dias alternados, com 1 h de intervalo usufruído: média de ' + fh(Math.round((dur.presenca - 60) * 3.5)) + ' semanais.',
        jornada: hm(dur.ini) + ' às ' + fimP + ', 1 h de intervalo', grupos: [{ modo: 'ciclo', turnos: [tUsu], ciclo: [1, 0], especial: '12x36', deslocamentos: desl, pessoas: ps }],
        horasSemana: horas(dur.presenca - 60, N),
        ponderacoes: [textoFerias(rf), 'Durante o intervalo o posto precisa de rendição (outra pessoa ou intervalos escalonados).', ponderNoite, 'Feriados trabalhados na 12x36 são considerados compensados (CLT, art. 59-A, parágrafo único).'],
      }));
      defs.push(Object.assign({}, comum, {
        id: '12x36-transicao', nome: '12x36 com intervalo indenizado até dez/2027',
        resumo: 'Mantém o intervalo indenizado (média de 42 h) na etapa de 42 h e passa ao intervalo usufruído a partir de 13/12/2027.',
        jornada: hm(dur.ini) + ' às ' + fimP, grupos: [{ modo: 'ciclo', turnos: [tInd, tUsu], periodos: [{ turno: 'T12', inicio: JANELA1.inicio }, { turno: 'T11', inicio: iso(SEMANA_40) }], ciclo: [1, 0], especial: '12x36', deslocamentos: desl, pessoas: ps }],
        horasSemana: horas(dur.presenca, N),
        ponderacoes: [textoFerias(rf), 'Na etapa de 40 h, a média de 42 h da 12x36 com intervalo indenizado ultrapassa o teto.', 'A mudança exige organizar a rendição durante o intervalo a partir de dezembro de 2027.', ponderNoite],
      }));
      defs.push(Object.assign({}, comum, {
        id: '12x36-indenizado', nome: '12x36 com intervalo indenizado',
        resumo: 'Mantém o plantão de 12 h corridas, com intervalo indenizado: média de 42 h semanais.',
        jornada: hm(dur.ini) + ' às ' + fimP, grupos: [{ modo: 'ciclo', turnos: [tInd], ciclo: [1, 0], especial: '12x36', deslocamentos: desl, pessoas: ps }],
        horasSemana: horas(dur.presenca, N),
        ponderacoes: [textoFerias(rf), 'Cabe na etapa de 42 h, mas ultrapassa o teto de 40 h a partir de 16/12/2027.', ponderNoite],
      }));
      {
        const op5 = { pref: ctx.pref, prefP: ctx.prefP, w: 5, k: 0, P: 0, domingoComercio: ctx.domingo, rodizio: true };
        const rf5 = comFerias(ctx, dem, comporMinimo(dem, op5), op5);
        if (rf5.eq) defs.push(defEscalonado(Object.assign({}, ctx, { parciaisAtuais: [] }), rf5.eq, rf5));
      }
      // Rearranjo do funcionamento: o plantão encolhe para até 8 h por dia, em 5x2, sem 12x36 e sem norma coletiva
      if (ctx.funcionamento !== 'fixo') {
        const e8 = limitarDia(ctx, 480);
        const op5 = { pref: ctx.pref, prefP: ctx.prefP, w: 5, k: 0, P: 0, domingoComercio: ctx.domingo, rodizio: true };
        const rfE = comFerias(ctx, dem, comporMinimo(dem, op5), op5);
        if (rfE.eq) {
          const h8 = infoHorario(ctx, e8, null);
          const ctxI = Object.assign({}, ctx, { parciaisAtuais: [] });
          defs.push({
            id: '5x2-encurtado', nome: '5x2 de ' + fh(e8[ops[0]].trab) + ', encurtando o plantão', rearranjo: true,
            resumo: 'Em vez da 12x36, o posto funciona em horário menor, com 5x2 de até 8 h e dois repousos por semana. Não depende de norma coletiva.',
            jornada: textoHorarioCenario(ctx, e8), grupos: gruposSemanais(ctxI, rfE.eq, horarioCenario('T', e8, null)), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario),
            horasSemana: horasDe(rfE.eq, e8), reservaFerias: rfE.r, horario: h8,
            ponderacoes: ['Rearranjo do funcionamento: o posto fica descoberto fora do novo horário (hoje ' + h8.atual + '; passa a ' + h8.e1 + ').',
              !ctx.funcionamento ? 'Confirme no passo 1 se o funcionamento deste turno pode mudar.' : null, textoFerias(rfE), descreverFolgas(rfE.eq)],
            semanasGrade: semanasGrade(rfE.eq), cicloSemanas: rfE.eq.rodizioI ? rfE.eq.folgasI.length : null,
          });
        }
      }
      if (Ia > 0 && Ia < N) {
        const pa = nomesPessoas(Ia, ctx.integraisAtuais, 'Nova contratação', false);
        defs.push(Object.assign({}, comum, {
          id: 'sem-contratar', nome: '12x36 com o quadro atual, sem contratar', reservaFerias: 0, semFerias: ctx.ferias && !capacidadeOk(ctx, Ia * 3.5),
          resumo: 'As mesmas ' + Ia + ' pessoas em 12x36' + (Ia >= 2 * R ? ': cobrem os postos nas semanas normais, mas não as férias.' : ': cobrem menos postos do que a necessidade informada.'),
          jornada: hm(dur.ini) + ' às ' + fimP, grupos: [{ modo: 'ciclo', turnos: [tUsu], ciclo: [1, 0], especial: '12x36', deslocamentos: pa.map((_, j) => j % 2), pessoas: pa }],
          horasSemana: horas(dur.presenca - 60, Ia), ponderacoes: [],
        }));
      }
    }

    const base = equipeHoje(ctx);
    if (ctx.longo) {
      descartar('4x3', '4x3', 'O plantão de hoje, de cerca de 12 h, passa do limite de 10 h por dia da compensação semanal.');
      descartar('6x2', '6x2', 'Seis plantões de cerca de 12 h passariam muito de 40 h na semana.');
    }
    const lista = defs.map((d) => avaliarCenario(ctx, d));
    lista.sort((a, b) => a.nota - b.nota);
    // Quando o funcionamento não precisa ser mantido, o melhor cenário que cumpre sem contratar fica entre as sugestões;
    // se o usuário disse que o horário pode mudar, ele vem primeiro (decisão D48).
    if (ctx.funcionamento !== 'fixo') {
      const semContratar = (c) => !c.contratarIntegrais && !c.contratarParciais && ['cumpre', 'condicao', 'rearranjo'].indexOf(c.situacao.codigo) >= 0;
      const melhor = lista.find(semContratar);
      if (melhor) {
        const pos = lista.indexOf(melhor), alvo = ctx.funcionamento === 'flexivel' ? 0 : 2;
        if (pos > alvo) { lista.splice(pos, 1); lista.splice(alvo, 0, melhor); }
      }
    }
    lista.forEach((c, i) => { c.ordem = i + 1; c.sugerido = i < 3; });
    return {
      lista: lista, descartes: fora, quadro: Object.assign(quadro, { feriasModo: ctx.feriasModo, feriasHoje: ctx.feriasHoje, exigeFerias: ctx.exigeFerias }), demanda: dem, duracao: dur, longo: ctx.longo, ferias: ctx.ferias,
      base: base, operacao: ops, semContratar: lista.some((c) => !c.contratarIntegrais && !c.contratarParciais && ['cumpre', 'condicao', 'rearranjo'].indexOf(c.situacao.codigo) >= 0),
      horarioAtual: textoJanela(ctx.atual, ctx.operacao, true), funcionamento: ctx.funcionamento, uniforme: ctx.uniforme,
      mudaHorario: lista.some((c) => c.mudaHorario),
    };
  }

  /**
   * Cenário montado pelo usuário.
   * op: { escala '5x2'|'4x3'|'12x36', integrais, parciais, diasParcial, folgas 'rodizio'|'fixas'|'escolher',
   *       dias: [{ parcial, folgas: [0..6] }] (com 'escolher'), rodiziar (com 'escolher'),
   *       horario: { e1: [7 × {inicio, fim, intervalo} | null], e2: idem ou null } (horário escolhido por dia, por etapa) }
   */
  function personalizado(turno, empresa, opcoes, op) {
    const ctx = contexto(turno, empresa, opcoes);
    if (ctx.erro) return { erro: ctx.erro };
    const dur = ctx.dur, dem = ctx.dem, ops = ctx.operacao;
    if (op.escala === '12x36') {
      const I = Math.max(0, Math.floor(op.integrais || 0));
      if (!I) return { erro: 'Informe ao menos uma pessoa.' };
      const iv = dur.intervalo || 60;
      const t = turnoMotor('T12', dur.ini, dur.presenca - iv, iv, ctx.indenizado ? 'indenizado' : 'usufruido');
      const ps = nomesPessoas(I, ctx.integraisAtuais, 'Nova contratação', false);
      return avaliarCenario(ctx, {
        id: 'personalizado', personalizado: true, nome: 'Meu cenário: 12x36', resumo: pl(I, 'pessoa', 'pessoas') + ' em 12x36, intervalo ' + (ctx.indenizado ? 'indenizado' : 'usufruído') + '.', jornada: hm(dur.ini) + ' às ' + t.fim,
        grupos: [{ modo: 'ciclo', turnos: [t], ciclo: [1, 0], especial: '12x36', deslocamentos: ps.map((_, j) => j % 2), pessoas: ps }],
        instrumentos: instrumentos(['12x36'], ctx.neg, { intervalo: iv }), negociar: ['x12'],
        horasSemana: Math.round((ctx.indenizado ? dur.presenca : dur.presenca - iv) * 3.5) * I, semanasGrade: 2,
        horario: { muda: false, atual: textoJanela(ctx.atual, ops), e1: textoJanela(ctx.atual, ops), e2: null },
        ponderacoes: [textoComporta(ctx, I * 3.5)],
      });
    }
    const w = op.escala === '4x3' ? 4 : 5;
    let e1, e2 = null;
    if (op.horario && Array.isArray(op.horario.e1)) {
      e1 = especsDe(op.horario.e1);
      if (e1.erro) return { erro: e1.erro };
      if (op.horario.e2) { e2 = especsDe(op.horario.e2); if (e2.erro) return { erro: e2.erro }; }
      if (!e1.some(Boolean)) return { erro: 'Informe o horário de ao menos um dia.' };
    } else if (w === 4) {
      const cabe = ops.every((d) => ctx.atual[d].trab <= 600);
      e1 = ctx.semana.map((s) => s && (cabe && s.trabalho > 480 ? { ini: s.ini, trab: s.trabalho, intervalo: s.intervalo } : { ini: s.ini, trab: 600, intervalo: s.intervalo || 60 }));
    } else e1 = limitarDia(ctx, 480);
    const hc = horarioCenario('T', e1, e2);
    const diasHor = [0, 1, 2, 3, 4, 5, 6].filter((d) => e1[d]);
    const pond = [];
    let eq;
    if (op.folgas === 'escolher' && Array.isArray(op.dias) && op.dias.length) {
      const di = op.dias.filter((x) => !x.parcial).map((x) => normalizarFolgas(x.folgas) || []);
      const dp = op.dias.filter((x) => x.parcial).map((x) => normalizarFolgas(x.folgas) || []);
      let folgasI = di, rodI = false;
      if (op.rodiziar && new Set(di.map((f) => f.join())).size > 1) {
        const r = ordenarRodizio(di, ctx.domingo);
        if (r) { folgasI = r; rodI = true; pond.push('Os padrões escolhidos giram entre as pessoas a cada semana; o ciclo se repete a cada ' + di.length + ' semanas.'); }
        else pond.push('Não foi possível girar os padrões escolhidos sem passar de 6 dias seguidos' + (ctx.domingo ? ' ou sem folga num domingo a cada ' + (ctx.domingo === 2 ? 'duas' : 'três') + ' semanas' : '') + '; as folgas ficaram fixas por pessoa.');
      } else pond.push('Folgas escolhidas por você, fixas por pessoa.');
      if (di.some((f) => f.length !== 7 - w)) pond.push('Há integral com número de folgas diferente de ' + (7 - w) + ' por semana: a jornada semanal muda junto.');
      eq = { I: di.length, P: dp.length, w: w, k: 0, folgasI: folgasI, folgasP: dp, rodizioI: rodI, rodizioP: false, cobertura: cobrir(folgasI.concat(dp)) };
    } else {
      const I = Math.max(0, Math.floor(op.integrais || 0)), Pn = Math.max(0, Math.floor(op.parciais || 0));
      if (I + Pn === 0) return { erro: 'Informe ao menos uma pessoa.' };
      const kMax = Math.max(1, kParcialSemana(e1, diasHor));
      const k = Math.max(1, Math.min(kMax, Math.floor(op.diasParcial || kMax)));
      eq = compor(dem, { pref: ctx.pref, prefP: ctx.prefP, w: w, k: k, P: Pn, I: I, domingoComercio: ctx.domingo, rodizio: op.folgas !== 'fixas', forcar: true });
      if (!eq) return { erro: 'Não foi possível distribuir as folgas com essa composição.' };
      pond.push(descreverFolgas(eq), Pn ? 'Dias dos parciais: ' + diasParciais(eq) + '.' : null);
    }
    if (!eq.I && !eq.P) return { erro: 'Informe ao menos uma pessoa.' };
    const capacidade = eq.cobertura.reduce((s, x) => s + x, 0);
    pond.push(textoComporta(ctx, capacidade));
    const h = infoHorario(ctx, e1, e2);
    pond.unshift(textoMudanca(h));
    const ivs = diasHor.map((d) => e1[d].intervalo);
    // Dias acima de 8 h: na semana de até 40 h, acordo de compensação; acima de 40 h (etapa de 42 h), norma coletiva do art. 7º
    // pela leitura adotada, sem a qual o excedente é hora extra. O acordo só vale a partir da etapa em que é necessário.
    const semanaMax = (esp) => Math.max.apply(null, eq.folgasI.concat(eq.folgasP).map((f) => [0, 1, 2, 3, 4, 5, 6].reduce((s, d) => s + (f.indexOf(d) < 0 && esp[d] ? esp[d].trab : 0), 0)));
    const acima8 = (esp) => esp.some((x) => x && x.trab > 480);
    const lista = [], negociarMeu = [];
    let compDesde = null;
    const ate824 = (esp) => esp.every((x) => !x || x.trab <= 504);
    if (acima8(e1) && semanaMax(e1) > 2400 && !(ctx.liminar && ate824(e1))) { lista.push('art7'); negociarMeu.push('art7'); }
    else if (acima8(e1)) compDesde = JANELA1.inicio;
    const e2v = e2 || e1;
    if (!compDesde && acima8(e2v) && semanaMax(e2v) <= 2400) compDesde = iso(SEMANA_40);
    const inst = instrumentos(lista, ctx.neg, { intervaloMin: Math.min.apply(null, ivs), intervaloMax: Math.max.apply(null, ivs) });
    if (compDesde) {
      inst.push({ id: M.TIPOS_INSTRUMENTO.compensacao_mensal.nome, tipo: 'compensacao_mensal', natureza: 'individual', vigenciaInicio: compDesde });
      pond.push('Dias acima de 8 h em semana de até 40 h: basta acordo individual escrito, porque as horas se compensam dentro da mesma semana. Se alguma semana ficar com menos de dois repousos, o arranjo passa a depender da média mensal, só por norma coletiva.');
    }
    return avaliarCenario(ctx, {
      id: 'personalizado', personalizado: true, nome: 'Meu cenário: ' + (w === 4 ? '4x3' : '5x2') + (eq.P ? ' + ' + pl(eq.P, 'parcial', 'parciais') : ''),
      resumo: pl(eq.I, 'integral', 'integrais') + (eq.P ? ' e ' + pl(eq.P, 'parcial', 'parciais') : '') + '; folgas ' + (op.folgas === 'escolher' ? 'escolhidas' : eq.rodizioI ? 'em rodízio' : 'fixas') + (op.horario ? '; horário escolhido por dia' : '') + '.',
      jornada: textoHorarioCenario(ctx, e1, e2), grupos: gruposSemanais(ctx, eq, hc),
      instrumentos: inst, negociar: negociarMeu, acordos: compDesde ? [ACORDO_COMP] : [],
      horasSemana: horasDe(eq, e1), ponderacoes: pond, horario: h,
      semanasGrade: eq.rodizioI ? Math.min(Math.max(eq.folgasI.length, 3), 6) : 3, cicloSemanas: eq.rodizioI ? eq.folgasI.length : null,
    });
  }

  /** Folgas padrão para um cenário montado: a distribuição automática, fixa por pessoa, para o usuário editar. */
  function folgasPadrao(turno, empresa, opcoes, op) {
    const ctx = contexto(turno, empresa, opcoes);
    if (ctx.erro) return null;
    const w = op.escala === '4x3' ? 4 : 5;
    const e = limitarDia(ctx, w === 4 ? 600 : 480);
    const kMax = Math.max(1, kParcialSemana(e, ctx.operacao));
    const k = Math.max(1, Math.min(kMax, Math.floor(op.diasParcial || kMax)));
    const eq = compor(ctx.dem, { pref: ctx.pref, prefP: ctx.prefP, w: w, k: k, P: Math.max(0, op.parciais | 0), I: Math.max(0, op.integrais | 0), domingoComercio: ctx.domingo, rodizio: false, forcar: true });
    if (!eq) return null;
    return eq.folgasI.map((f) => ({ parcial: false, folgas: f.slice() })).concat(eq.folgasP.map((f) => ({ parcial: true, folgas: f.slice() })));
  }

  /** Grupos da escala de hoje: horário de cada dia, folgas informadas e, para quem não as informou, folgas distribuídas conforme a necessidade. */
  function gruposHoje(ctx) {
    const dur = ctx.dur;
    const porEscala = new Map();
    for (const p of ctx.atuais) { const k = ESCALAS_ATUAIS[p.escala] ? p.escala : '6x1'; if (!porEscala.has(k)) porEscala.set(k, []); porEscala.get(k).push(p); }
    const grupos = [], rotulos = [];
    const hcAtual = horarioCenario('H', ctx.atual, null);
    let informadas = 0;
    for (const [k, ps] of porEscala) {
      const e = ESCALAS_ATUAIS[k];
      rotulos.push(ps.length + ' em ' + e.rotulo);
      const pess = ps.map((p) => Object.assign({ id: p.id, nome: p.nome || p.id, parcial: !!e.parcial || p.contrato === 'parcial' }, p.art386 ? { art386: true } : {}));
      if (e.padrao && ctx.padrao) {
        const turnos = new Map(), dias = [];
        for (const w of ctx.padrao.semanas) for (const c of w) {
          if (!c) { dias.push(null); continue; }
          const k = c.ini + '|' + c.trab + '|' + c.intervalo;
          if (!turnos.has(k)) turnos.set(k, turnoMotor('P' + turnos.size, c.ini, c.trab, c.intervalo));
          dias.push(turnos.get(k).id);
        }
        grupos.push({ modo: 'padrao', turnos: Array.from(turnos.values()), dias: dias, revezar: ctx.padrao.revezar, pessoas: pess });
        continue;
      }
      if (e.ciclo) {
        const t = turnoMotor('T', dur.ini, dur.trabalho, dur.intervalo, e.especial && ctx.indenizado ? 'indenizado' : 'usufruido');
        grupos.push({ modo: 'ciclo', turnos: [t], ciclo: e.ciclo, especial: e.especial || null, deslocamentos: pess.map((_, j) => (e.especial ? j % 2 : Math.floor(j * e.ciclo.length / pess.length))), pessoas: pess });
      } else {
        const escolhidas = ps.map((p) => normalizarFolgas(p.folgas));
        informadas += escolhidas.filter(Boolean).length;
        const auto = escolhidas.filter((f) => !f).length;
        const off = 7 - e.dias;
        let padroes = [];
        if (auto) {
          // quem tem folgas informadas já cobre parte de cada dia; as folgas dos demais seguem a necessidade que sobra (D89)
          const resto = ctx.dem.slice();
          for (const f of escolhidas) if (f) for (let d = 0; d < 7; d++) if (f.indexOf(d) < 0 && ctx.dem[d] > 0) resto[d] = Math.max(0, resto[d] - 1);
          const c = [0, 0, 0, 0, 0, 0, 0];
          for (let q = 0; q < off * auto; q++) {
            let best = -1;
            for (const d of ctx.pref || PREF_FOLGA) if (c[d] < auto && (best < 0 || auto - resto[d] - c[d] > auto - resto[best] - c[best])) best = d;
            c[best]++;
          }
          padroes = agrupar(c, off, ctx.pref) || Array.from({ length: auto }, () => [6]);
        }
        let q = 0;
        grupos.push({ modo: 'fixo', turnos: hcAtual.turnos, periodos: hcAtual.periodos, folgas: escolhidas.map((f) => f || padroes[q++]), pessoas: pess });
      }
    }
    const extras = Object.fromEntries(ctx.atuais.map((p) => [p.id, { nome: p.nome || p.id, contrato: p.contrato === 'parcial' || p.escala === 'parcial' ? 'parcial' : 'integral' }]));
    return { grupos: grupos, rotulos: rotulos, informadas: informadas, extras: extras, op: { insalubre: ctx.insalubre, revezamento: ctx.revezamento, atividade: ctx.atividade, instrumentos: instrumentos(['12x36', 'par2'], ctx.neg, ctx.turnoUsuario), liminar: ctx.liminar } };   // par2: hipótese de norma coletiva com média de repousos, quando o usuário a liga (D79)
  }
  /**
   * Calendário de um período (por exemplo, o ano de 2027) para os grupos de um cenário ou da escala de hoje, avaliados no
   * motor de uma vez. Devolve, por dia, quem trabalha ([id, entrada, saída, minutos de intervalo], em minutos desde a
   * meia-noite do dia) e quem está em repouso, e a lista de achados que não cumprem ('n') ou dependem de norma ainda
   * não firmada ('p'), com o período de cada um. Feriados tratados como dias normais, como nos cenários.
   */
  function calendario(grupos, op, inicio, fim) {
    const r = avaliarM(montarEntrada(grupos, { inicio: inicio, fim: fim }, op || {}), op);
    const z0 = M.lerData(inicio), z1 = M.lerData(fim), n = z1 - z0 + 1;
    const dias = Array.from({ length: n }, () => ({ t: [], r: [] }));
    const achados = [], meses = new Map();
    for (const e of r.empregados) {
      const pelaMedia = semanaPelaMedia(e);   // como em resumir (D79)
