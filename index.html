            const dia = DIAS_LONGOS[ultimo], curto = ultimo >= 5 ? 'mais curto' : 'mais curta';
            defs.push({
              id: '5x2-semana-curta', nome: '5x2 com ' + dia + ' ' + curto + ': 42 h até dez/2027, depois 40 h',
              resumo: 'Na etapa de 42 h, até 8h30 nos quatro primeiros dias e ' + fh(eS[ultimo].trab) + ' na ' + dia + '; a partir de 13/12/2027, até 8 h por dia.',
              jornada: textoHorarioCenario(ctx, eS, e8), grupos: gruposSemanais(ctx, eqR, horarioCenario('T', eS, e8)), instrumentos: instrumentos(['art7'], ctx.neg, ctx.turnoUsuario), negociar: ['art7'],
              horasSemana: horasDe(eqR, eS), reservaFerias: rf.r, horario: hS,
              ponderacoes: [
                'Pela leitura adotada, distribuir mais de 40 h em cinco dias, com dias acima de 8 h, exige convenção ou acordo coletivo (Emenda Constitucional 141/2026 – Fim da 6x1, art. 7º). Pela leitura alternativa, basta acordo individual escrito de compensação.',
                'Na etapa de 40 h a mesma grade passaria do teto: por isso volta a até 8 h por dia em 13/12/2027.',
                textoMudanca(hS), avisoFixo(hS), textoFerias(rf),
              ],
              semanasGrade: 3,
            });
          }
        }
      }

      // 4x3: no horário atual quando a jornada passa de 8 h e cabe em 10 h; senão, 4 dias de 10 h
      if (ops.length < 4) descartar('4x3', '4x3', 'O turno funciona em menos de quatro dias por semana.');
      if (ops.length >= 4) {
        const maiores = ops.map((d) => atual[d].trab).sort((a, b) => b - a).slice(0, 4).reduce((s, x) => s + x, 0);
        const manter = excede && ops.every((d) => atual[d].trab <= 600 && computadas(turnoMotor('x', atual[d].ini, atual[d].trab, atual[d].intervalo)) <= 600 * M.U) && maiores <= 2400;
        let e4 = null;
        if (manter) e4 = atual;
        else if (!excede) {
          e4 = ctx.semana.map((s) => s && { ini: s.ini, trab: 600, intervalo: s.intervalo || 60 });
          if (ops.some((d) => computadas(turnoMotor('x', e4[d].ini, 600, e4[d].intervalo)) > 600 * M.U)) e4 = null;
        }
        if (!e4) descartar('4x3', '4x3', excede ? 'A jornada de hoje não cabe em quatro dias sem passar de 10 h por dia ou de 40 h por semana (limite da compensação, CLT, art. 59, § 2º).'
          : 'No turno noturno, quatro dias de 10 h passariam do limite de 10 h computadas por dia, por causa da hora noturna reduzida.');
        if (e4) {
          const op4 = { pref: ctx.pref, prefP: ctx.prefP, w: 4, k: 3, P: Pa, domingoComercio: ctx.domingo, rodizio: true };
          const rf4 = comFerias(ctx, dem, comporMinimo(dem, op4), op4);
          const eq4 = rf4.eq;
          if (!eq4) descartar('4x3', '4x3', 'Não houve equipe em 4x3 que cobrisse a necessidade de todos os dias com as folgas exigidas.');
          if (eq4) {
            const h4 = infoHorario(ctx, e4, null);
            const ivs = new Set(ops.map((d) => e4[d].intervalo));
            defs.push({
              id: '4x3', nome: manter ? '4x3 no horário atual' : '4x3 de 10 h',
              resumo: manter ? 'Mantém o horário de funcionamento: cada pessoa trabalha quatro dias no horário de hoje e folga três; a semana de cada uma fica abaixo de 40 h.'
                : 'Quatro dias de 10 h e três folgas por semana: 40 h semanais, com compensação dentro da própria semana.',
              jornada: textoHorarioCenario(ctx, e4), grupos: gruposSemanais(ctx, eq4, horarioCenario('Q', e4, null)), instrumentos: instrumentos(['comp'], ctx.neg, { intervaloMin: Math.min.apply(null, Array.from(ivs)), intervaloMax: Math.max.apply(null, Array.from(ivs)) }),
              acordos: [ACORDO_COMP], horasSemana: horasDe(eq4, e4), reservaFerias: rf4.r, horario: h4,
              ponderacoes: [
                textoMudanca(h4), avisoFixo(h4), textoFerias(rf4),
                manter ? 'Dias acima de 8 h, com a semana abaixo de 40 h: basta acordo individual escrito de compensação, porque as horas se redistribuem dentro da própria semana e todas as semanas mantêm os repousos (CLT, art. 59, § 6º; Súmula 85, I, do TST).'
                  : '10 h é o limite diário com compensação (CLT, art. 59, § 2º): não sobra margem para hora extra. Basta acordo individual escrito, porque a compensação ocorre dentro da própria semana.',
                'Em atividade insalubre, a prorrogação depende de licença prévia (CLT, art. 60), salvo norma coletiva (art. 611-A, XIII).',
                eqR && eq4.I > eqR.I ? 'Pede ' + pl(eq4.I - eqR.I, 'pessoa', 'pessoas') + ' a mais que o 5x2, porque cada uma trabalha um dia a menos.' : null,
                eq4.P ? 'Tempo parcial atual em 3 dias.' : null,
                descreverFolgas(eq4),
              ],
              semanasGrade: semanasGrade(eq4),
            });
          }
        }
      }

      // Mantém a janela com duas equipes de 8 h escalonadas (quando a jornada passa de 8 h e o 4x3 não cabe)
      if (eqR && excede && !defs.some((x) => x.id === '4x3' && !x.horario.muda)) defs.push(defEscalonado(ctx, eqR, rf));

      // Sem contratar: 5x2 com o quadro atual. Quando o funcionamento pode mudar, é um rearranjo do atendimento
      // (menos gente nos dias de menor movimento), não uma falha; quando precisa ser mantido, aparece como lacuna.
      if (eqR && Ia + Pa > 0 && Ia < eqR.I) {
        const eqS = compor(dem, { pref: ctx.pref, prefP: ctx.prefP, w: 5, k: k, P: Pa, I: Ia, domingoComercio: ctx.domingo, rodizio: true, forcar: true, protege: ctx.protege });
        if (eqS) {
          const cobre = !eqS.faltas.some((x) => x > 0);
          const livre = ctx.funcionamento !== 'fixo';
          const nec = ctx.somaDem, ofer = dem.reduce((s, x, d) => s + Math.min(x, eqS.cobertura[d]), 0);
          const semRes = ctx.exigeFerias && !capacidadeOk(ctx, 5 * Ia + k * Pa);
          defs.push({
            id: 'sem-contratar', nome: cobre ? '5x2 com o quadro atual, sem contratar' : livre ? '5x2 com o quadro atual e menos gente em alguns dias' : '5x2 com o quadro atual, sem contratar',
            resumo: 'As mesmas ' + (Ia + Pa) + ' pessoas passam para 5x2. ' + (cobre ? 'Cobre a necessidade nas semanas normais' + (semRes ? ', mas não as férias.' : '.')
              : livre ? 'Para cumprir a Emenda Constitucional 141 (Fim da 6x1) sem contratar, o atendimento passa de ' + nec + ' para ' + ofer + ' presenças por semana, com menos gente nos dias de menor movimento.'
                : 'Atende à Emenda Constitucional 141 (Fim da 6x1), mas abre lacunas na cobertura.'),
            jornada: textoHorarioCenario(ctx, e8), grupos: gruposSemanais(ctx, eqS, hc8), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario), horasSemana: horasDe(eqS, e8), horario: h8,
            semFerias: semRes, rearranjo: livre && !cobre,
            ponderacoes: [cobre ? null : livre ? 'Rearranjo do funcionamento: serve se a operação comporta menos pessoas nesses dias, por exemplo com atendimento reduzido, fila maior ou tarefas remanejadas.'
              : 'Só faz sentido se a necessidade informada puder ser reduzida, por exemplo com mudança no horário de atendimento.',
              !cobre && livre && !ctx.funcionamento ? 'Confirme no passo 1 se o funcionamento deste turno pode mudar.' : null,
              semRes ? 'Sem reserva para as férias: em cada período de férias, o turno fica abaixo da necessidade.' : null, textoMudanca(h8), avisoFixo(h8)],
            semanasGrade: 3,
          });
        }
      }

      // Rearranjo do funcionamento: deixar de abrir no dia (ou nos dois dias) de menor movimento, para atender os demais
      // com o quadro atual em 5x2, sem contratar. Só quando o funcionamento não foi marcado como fixo.
      if (ctx.funcionamento !== 'fixo' && eqR && Ia > 0 && Ia < eqR.I && ops.length >= 6) {
        // só dias de movimento até a média dos dias de operação: fechar o dia de pico não é rearranjo razoável
        const perda = (C) => C.reduce((s, d) => s + dem[d] * e8[d].trab, 0);
        const media = ctx.somaDem / ops.length;
        const mPrio = ctx.prio ? ops.reduce((s, d) => s + ctx.prio[d], 0) / ops.length : null;
        const baixos = ops.filter((d) => dem[d] <= media && (!ctx.prio || ctx.prio[d] <= mPrio + 1e-9));
        const somaPrio = (C) => (ctx.prio ? C.reduce((s, d) => s + ctx.prio[d], 0) : 0);
        const cands = baixos.map((d) => [d]);
        for (let i = 0; i < baixos.length; i++) for (let j = i + 1; j < baixos.length; j++) cands.push([baixos[i], baixos[j]]);
        // sem o movimento por dia, no comércio o sábado é o último a fechar (costuma ser o dia de maior movimento)
        const ordemFecha = ctx.comercio ? [6, 0, 1, 2, 3, 4, 5] : PREF_FOLGA;
        cands.sort((x, y) => x.length - y.length || perda(x) - perda(y) || somaPrio(x) - somaPrio(y) || ordemFecha.indexOf(x[0]) - ordemFecha.indexOf(y[0]));
        let achou = null;
        for (const C of cands) {
          const d2 = dem.map((x, d) => (C.indexOf(d) >= 0 ? 0 : x));
          if (!capacidadeOk(ctx, 5 * Ia + k * Pa, d2.reduce((s, x) => s + x, 0))) continue;
          const e = compor(d2, { pref: ctx.pref, prefP: ctx.prefP, w: 5, k: k, P: Pa, I: Ia, domingoComercio: d2[6] > 0 ? (ctx.art386 ? 2 : ctx.comercio ? 3 : 0) : 0, rodizio: true });
          if (e) { achou = { C: C.slice().sort((a, b) => a - b), dem: d2, eq: e }; break; }
        }
        if (achou) {
          const C = achou.C, eF = e8.map((s, d) => (C.indexOf(d) >= 0 ? null : s));
          const hF = infoHorario(ctx, eF, null);
          const deixa = C.reduce((s, d) => s + dem[d], 0);
          defs.push({
            id: 'fechar-dias', nome: '5x2 com o quadro atual, sem abrir ' + aosDias(C),
            resumo: 'Para atender os demais dias com as mesmas ' + (Ia + Pa) + ' pessoas em 5x2, o turno deixa de funcionar ' + aosDias(C) + '. Nos dias em que abre, cobre a necessidade informada.',
            jornada: textoHorarioCenario(ctx, eF), grupos: gruposSemanais(ctx, achou.eq, horarioCenario('T', eF, null)), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario),
            horasSemana: horasDe(achou.eq, eF), horario: hF, demanda: achou.dem, fecha: C, rearranjo: true,
            ponderacoes: ['Rearranjo do funcionamento: deixam de ser atendidas ' + pl(deixa, 'presença', 'presenças') + ' por semana ' + aosDias(C) + (C.length === 1 ? ', o dia' : ', os dias') + ' com menos horas de trabalho a perder.',
              !ctx.funcionamento ? 'Confirme no passo 1 se o funcionamento deste turno pode mudar.' : null,
              textoMudanca(hF), descreverFolgas(achou.eq), achou.eq.P ? 'Dias dos parciais: ' + diasParciais(achou.eq) + '.' : null],
            semanasGrade: semanasGrade(achou.eq), cicloSemanas: achou.eq.rodizioI ? achou.eq.folgasI.length : null,
          });
        }
      }

      // 6x2 com regime de média (só com o mesmo horário em todos os dias: o ciclo de 8 dias não acompanha a semana)
      if (ops.length < 6) descartar('6x2', '6x2', 'O turno funciona em menos de seis dias por semana, e o ciclo de 8 dias do 6x2 passa por todos os dias.');
      else if (!ctx.uniforme) descartar('6x2', '6x2', 'O horário muda conforme o dia, e o ciclo de 8 dias do 6x2 não acompanha a semana.');
      if (ops.length >= 6 && ctx.uniforme) {
        const t62 = Math.min(dur.trabalho, ajustarJornada(dur.ini, dur.intervalo, 400));
        const tt = turnoMotor('T62', dur.ini, t62, dur.intervalo);
        const R = Math.max.apply(null, dem);
        let desl = null;
        for (let n = R; n <= 2 * R + 6 && !desl; n++) {
          if (!capacidadeOk(ctx, n * 6 * 7 / 8)) continue;
          const dd = Array.from({ length: n }, (_, j) => Math.floor(j * 8 / n));
          const ok = [0, 1, 2, 3, 4, 5, 6].every((wd) => {
            for (let s = 0; s < 8; s++) { let c = 0; for (const x of dd) if ((((s * 7 + wd + x) % 8) + 8) % 8 < 6) c++; if (c < dem[wd]) return false; }
            return true;
          });
          if (ok) desl = dd;
        }
        if (desl) {
          const ps = nomesPessoas(desl.length, ctx.integraisAtuais, 'Nova contratação', false);
          const e62 = ctx.semana.map((s) => s && { ini: dur.ini, trab: t62, intervalo: dur.intervalo });
          const h62 = infoHorario(ctx, e62, null);
          defs.push({
            id: '6x2', nome: '6x2 com regime de média',
            resumo: 'Seis dias de trabalho e duas folgas, em ciclo de 8 dias, com média de repousos por norma coletiva (CF, art. 7º, § 2º, na redação da Emenda Constitucional 141/2026 – Fim da 6x1).',
            jornada: hm(dur.ini) + ' às ' + tt.fim + ' (' + fh(t62) + ')',
            grupos: [{ modo: 'ciclo', turnos: [tt], ciclo: [1, 1, 1, 1, 1, 1, 0, 0], deslocamentos: desl, pessoas: ps }],
            instrumentos: instrumentos(['par2'], ctx.neg, ctx.turnoUsuario), negociar: ['par2'], horasSemana: Math.round(t62 * 6 * 7 / 8) * ps.length, horario: h62,
            ponderacoes: [
              'A 6x2 entrega 7 ou 8 repousos por mês, e há semanas com um só repouso. Pelo critério de média adotado (A), o mês precisa de 9 ou mais.',
              'Por depender da média mensal de repousos, não se faz por acordo individual de compensação (CF, art. 7º, § 2º).',
              'Jornada limitada a ' + fh(t62) + ' para que a semana de 6 dias não passe de 40 h.', textoMudanca(h62),
              ctx.exigeFerias ? 'Quadro dimensionado com 30 dias de férias por pessoa no ano.' : textoFeriasHoje(ctx),
            ],
            semanasGrade: 4,
          });
        } else descartar('6x2', '6x2', 'Nem com o dobro da necessidade diária o ciclo de 6x2 cobriu todos os dias.');
      }

      // 12x36 estendendo o turno a um plantão de 12 h: só em operação de todos os dias, com o mesmo horário; depende de
      // norma coletiva (D39). Entra na comparação para mostrar o custo de trocar o turno por plantões (D86).
      if (ops.length < 7) descartar('12x36', '12x36', 'A 12x36 alterna dias e passa por todos os dias da semana; o turno funciona em ' + ops.length + ' dias.');
      else if (!ctx.uniforme) descartar('12x36', '12x36', 'O horário muda conforme o dia, e o plantão de 12 h teria de ser o mesmo todos os dias.');
      else {
        const R = Math.max.apply(null, dem);
        let N = 2 * R;
        while (!capacidadeOk(ctx, N * 3.5) && N < 4 * R + 6) N++;
        const ps = nomesPessoas(N, ctx.integraisAtuais, 'Nova contratação', false);
        const t12 = turnoMotor('T11', dur.ini, 660, 60, 'usufruido');
        const e12 = ctx.semana.map((x) => x && { ini: dur.ini, trab: 660, intervalo: 60 });
        const h12 = infoHorario(ctx, e12, null);
        const rf12 = { r: N - 2 * R, min: 2 * R };
        defs.push({
          id: '12x36-estendido', familia: '12x36', nome: '12x36 com plantão de 12 h',
          resumo: 'O turno vira plantão de 12 h (' + hm(dur.ini) + ' às ' + hm(dur.ini + 720) + ', 1 h de intervalo), com duas pessoas por posto em dias alternados: média de 38h30 por semana. Depende de convenção ou acordo coletivo.',
          jornada: hm(dur.ini) + ' às ' + hm(dur.ini + 720) + ', 1 h de intervalo',
          grupos: [{ modo: 'ciclo', turnos: [t12], ciclo: [1, 0], especial: '12x36', deslocamentos: ps.map((_, j) => j % 2), pessoas: ps }],
          instrumentos: instrumentos(['12x36'], ctx.neg, { intervalo: 60 }), negociar: ['x12'],
          horasSemana: Math.round(660 * 3.5) * N, reservaFerias: rf12.r, horario: h12,
          ponderacoes: [
            'O plantão de 12 h vai além do horário de hoje (' + textoJanela(ctx.atual, ops) + '); as horas a mais só valem se a operação precisar delas.',
            'Cada posto precisa de duas pessoas, em dias alternados: o quadro fica no dobro das pessoas que trabalham por dia.',
            'Depende de convenção ou acordo coletivo que autorize a 12x36 (CLT, art. 59-A; o acordo individual não é aceito pelo simulador).',
            textoFerias(rf12),
          ],
          semanasGrade: 2,
        });
      }

      if (!excede) {
        descartar('escalonado', '5x2 em dois horários escalonados', 'A jornada de hoje já cabe em 8 h por dia: não há janela maior que 8 h para cobrir com dois horários.');
        descartar('5x2-art7', '5x2 com jornada ampliada na transição', 'A jornada de hoje já cabe em 8 h por dia: não há o que ampliar até dezembro de 2027.');
      } else if (!defs.some((x) => x.id === 'escalonado')) descartar('escalonado', '5x2 em dois horários escalonados', 'O 4x3 no horário atual já mantém a janela de hoje com menos mudança.');
      if (eqR && !defs.some((x) => x.id === '5x2-parcial')) {
        const minT = Math.min.apply(null, ops.map((d) => e8[d].trab));
        descartar('5x2-parcial', '5x2 com reforço em tempo parcial', Ia >= eqR.I ? 'O quadro de hoje já cobre a operação em 5x2: não falta gente para reforçar com tempo parcial.'
          : eqR.I <= 1 ? 'Em 5x2 o turno precisa de uma pessoa só.' : minT <= 360 ? 'A jornada de até 6 h já é curta: o tempo parcial não reduz o quadro.'
          : k < 2 ? 'O turno funciona em poucos dias para encaixar a escala de tempo parcial.' : 'Nenhuma combinação com tempo parcial cobriu a necessidade com menos horas que contratar em tempo integral.');
      }
      if (!eqR) descartar('5x2', '5x2', 'Não foi possível montar um 5x2 que cubra a necessidade de todos os dias com as folgas exigidas.');
    } else {
      /* turno de cerca de 12 h: o revezamento 12x36, que depende de convenção ou acordo coletivo */
      const R = Math.max.apply(null, dem);
      let N = 2 * R;
      while (!capacidadeOk(ctx, N * 3.5)) N++;
      quadro.minimo = 2 * R; quadro.necessario = N; quadro.integrais = N; quadro.parciais = 0; quadro.ferias = N - 2 * R;
      const rf = { r: N - 2 * R, min: 2 * R };
      const ps = nomesPessoas(N, ctx.integraisAtuais, 'Nova contratação', false);
      const desl = ps.map((_, j) => j % 2);
      const tInd = turnoMotor('T12', dur.ini, dur.presenca - 60, 60, 'indenizado');
      const tUsu = turnoMotor('T11', dur.ini, dur.presenca - 60, 60, 'usufruido');
      const inst12 = instrumentos(['12x36'], ctx.neg, { intervalo: 60 });
      const horas = (m, n) => Math.round(m * 3.5) * n;
      const ponderNoite = computadas(tUsu, '12x36') > (dur.presenca - 60) * M.U ? 'Plantão noturno: a hora reduzida eleva as horas computadas; confira o tratamento na norma coletiva.' : null;
      const fimP = hm(dur.ini + dur.presenca);
      const sem12 = { muda: false, atual: textoJanela(ctx.atual, ops), e1: textoJanela(ctx.atual, ops), e2: null };
      const comum = { familia: '12x36', instrumentos: inst12, negociar: ['x12'], reservaFerias: rf.r, semanasGrade: 2, horario: sem12 };
      defs.push(Object.assign({}, comum, {
        id: '12x36-usufruido', nome: '12x36 com intervalo usufruído',
        resumo: 'Dois empregados por posto, em dias alternados, com 1 h de intervalo usufruído: média de ' + fh(Math.round((dur.presenca - 60) * 3.5)) + ' semanais.',
        jornada: hm(dur.ini) + ' às ' + fimP + ', 1 h de intervalo', grupos: [{ modo: 'ciclo', turnos: [tUsu], ciclo: [1, 0], especial: '12x36', deslocamentos: desl, pessoas: ps }],
        horasSemana: horas(dur.presenca - 60, N),
        ponderacoes: [textoFerias(rf), 'Durante o intervalo o posto precisa de rendição (outra pessoa ou intervalos escalonados).', ponderNoite, 'Feriados trabalhados na 12x36 são considerados compensados (CLT, art. 59-A, parágrafo único).'],
      }));
      defs.push(Object.assign({}, comum, {
        id: '12x36-transicao', nome: '12x36 com intervalo indenizado até dez/2027',
        resumo: 'Mantém o intervalo indenizado (média de 42 h) na etapa de 42 h e passa ao intervalo usufruído a partir de 13/12/2027.',
        jornada: hm(dur.ini) + ' às ' + fimP, grupos: [{ modo: 'ciclo', turnos: [tInd, tUsu], periodos: [{ turno: 'T12', inicio: JANELA1.inicio }, { turno: 'T11', inicio: iso(SEMANA_40) }], ciclo: [1, 0], especial: '12x36', deslocamentos: desl, pessoas: ps }],
        horasSemana: horas(dur.presenca, N),
        ponderacoes: [textoFerias(rf), 'Na etapa de 40 h, a média de 42 h da 12x36 com intervalo indenizado ultrapassa o teto.', 'A mudança exige organizar a rendição durante o intervalo a partir de dezembro de 2027.', ponderNoite],
      }));
      defs.push(Object.assign({}, comum, {
        id: '12x36-indenizado', nome: '12x36 com intervalo indenizado',
        resumo: 'Mantém o plantão de 12 h corridas, com intervalo indenizado: média de 42 h semanais.',
        jornada: hm(dur.ini) + ' às ' + fimP, grupos: [{ modo: 'ciclo', turnos: [tInd], ciclo: [1, 0], especial: '12x36', deslocamentos: desl, pessoas: ps }],
        horasSemana: horas(dur.presenca, N),
        ponderacoes: [textoFerias(rf), 'Cabe na etapa de 42 h, mas ultrapassa o teto de 40 h a partir de 16/12/2027.', ponderNoite],
      }));
      {
        const op5 = { pref: ctx.pref, prefP: ctx.prefP, w: 5, k: 0, P: 0, domingoComercio: ctx.domingo, rodizio: true };
        const rf5 = comFerias(ctx, dem, comporMinimo(dem, op5), op5);
        if (rf5.eq) defs.push(defEscalonado(Object.assign({}, ctx, { parciaisAtuais: [] }), rf5.eq, rf5));
      }
      // Rearranjo do funcionamento: o plantão encolhe para até 8 h por dia, em 5x2, sem 12x36 e sem norma coletiva
      if (ctx.funcionamento !== 'fixo') {
        const e8 = limitarDia(ctx, 480);
        const op5 = { pref: ctx.pref, prefP: ctx.prefP, w: 5, k: 0, P: 0, domingoComercio: ctx.domingo, rodizio: true };
        const rfE = comFerias(ctx, dem, comporMinimo(dem, op5), op5);
        if (rfE.eq) {
          const h8 = infoHorario(ctx, e8, null);
          const ctxI = Object.assign({}, ctx, { parciaisAtuais: [] });
          defs.push({
            id: '5x2-encurtado', nome: '5x2 de ' + fh(e8[ops[0]].trab) + ', encurtando o plantão', rearranjo: true,
            resumo: 'Em vez da 12x36, o posto funciona em horário menor, com 5x2 de até 8 h e dois repousos por semana. Não depende de norma coletiva.',
            jornada: textoHorarioCenario(ctx, e8), grupos: gruposSemanais(ctxI, rfE.eq, horarioCenario('T', e8, null)), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario),
            horasSemana: horasDe(rfE.eq, e8), reservaFerias: rfE.r, horario: h8,
            ponderacoes: ['Rearranjo do funcionamento: o posto fica descoberto fora do novo horário (hoje ' + h8.atual + '; passa a ' + h8.e1 + ').',
              !ctx.funcionamento ? 'Confirme no passo 1 se o funcionamento deste turno pode mudar.' : null, textoFerias(rfE), descreverFolgas(rfE.eq)],
            semanasGrade: semanasGrade(rfE.eq), cicloSemanas: rfE.eq.rodizioI ? rfE.eq.folgasI.length : null,
          });
        }
      }
      if (Ia > 0 && Ia < N) {
        const pa = nomesPessoas(Ia, ctx.integraisAtuais, 'Nova contratação', false);
        defs.push(Object.assign({}, comum, {
          id: 'sem-contratar', nome: '12x36 com o quadro atual, sem contratar', reservaFerias: 0, semFerias: ctx.ferias && !capacidadeOk(ctx, Ia * 3.5),
          resumo: 'As mesmas ' + Ia + ' pessoas em 12x36' + (Ia >= 2 * R ? ': cobrem os postos nas semanas normais, mas não as férias.' : ': cobrem menos postos do que a necessidade informada.'),
          jornada: hm(dur.ini) + ' às ' + fimP, grupos: [{ modo: 'ciclo', turnos: [tUsu], ciclo: [1, 0], especial: '12x36', deslocamentos: pa.map((_, j) => j % 2), pessoas: pa }],
          horasSemana: horas(dur.presenca - 60, Ia), ponderacoes: [],
        }));
      }
    }

    const base = equipeHoje(ctx);
    if (ctx.longo) {
      descartar('4x3', '4x3', 'O plantão de hoje, de cerca de 12 h, passa do limite de 10 h por dia da compensação semanal.');
      descartar('6x2', '6x2', 'Seis plantões de cerca de 12 h passariam muito de 40 h na semana.');
    }
    const lista = defs.map((d) => avaliarCenario(ctx, d));
    lista.sort((a, b) => a.nota - b.nota);
    // Quando o funcionamento não precisa ser mantido, o melhor cenário que cumpre sem contratar fica entre as sugestões;
    // se o usuário disse que o horário pode mudar, ele vem primeiro (decisão D48).
    if (ctx.funcionamento !== 'fixo') {
      const semContratar = (c) => !c.contratarIntegrais && !c.contratarParciais && ['cumpre', 'condicao', 'rearranjo'].indexOf(c.situacao.codigo) >= 0;
      const melhor = lista.find(semContratar);
      if (melhor) {
        const pos = lista.indexOf(melhor), alvo = ctx.funcionamento === 'flexivel' ? 0 : 2;
        if (pos > alvo) { lista.splice(pos, 1); lista.splice(alvo, 0, melhor); }
      }
    }
    lista.forEach((c, i) => { c.ordem = i + 1; c.sugerido = i < 3; });
    return {
      lista: lista, descartes: fora, quadro: Object.assign(quadro, { feriasModo: ctx.feriasModo, feriasHoje: ctx.feriasHoje, exigeFerias: ctx.exigeFerias }), demanda: dem, duracao: dur, longo: ctx.longo, ferias: ctx.ferias,
      base: base, operacao: ops, semContratar: lista.some((c) => !c.contratarIntegrais && !c.contratarParciais && ['cumpre', 'condicao', 'rearranjo'].indexOf(c.situacao.codigo) >= 0),
      horarioAtual: textoJanela(ctx.atual, ctx.operacao, true), funcionamento: ctx.funcionamento, uniforme: ctx.uniforme,
      mudaHorario: lista.some((c) => c.mudaHorario),
    };
  }

  /**
   * Cenário montado pelo usuário.
   * op: { escala '5x2'|'4x3'|'12x36', integrais, parciais, diasParcial, folgas 'rodizio'|'fixas'|'escolher',
   *       dias: [{ parcial, folgas: [0..6] }] (com 'escolher'), rodiziar (com 'escolher'),
   *       horario: { e1: [7 × {inicio, fim, intervalo} | null], e2: idem ou null } (horário escolhido por dia, por etapa) }
   */
  function personalizado(turno, empresa, opcoes, op) {
    const ctx = contexto(turno, empresa, opcoes);
    if (ctx.erro) return { erro: ctx.erro };
    const dur = ctx.dur, dem = ctx.dem, ops = ctx.operacao;
    if (op.escala === '12x36') {
      const I = Math.max(0, Math.floor(op.integrais || 0));
      if (!I) return { erro: 'Informe ao menos uma pessoa.' };
      const iv = dur.intervalo || 60;
      const t = turnoMotor('T12', dur.ini, dur.presenca - iv, iv, ctx.indenizado ? 'indenizado' : 'usufruido');
      const ps = nomesPessoas(I, ctx.integraisAtuais, 'Nova contratação', false);
      return avaliarCenario(ctx, {
        id: 'personalizado', personalizado: true, nome: 'Meu cenário: 12x36', resumo: pl(I, 'pessoa', 'pessoas') + ' em 12x36, intervalo ' + (ctx.indenizado ? 'indenizado' : 'usufruído') + '.', jornada: hm(dur.ini) + ' às ' + t.fim,
        grupos: [{ modo: 'ciclo', turnos: [t], ciclo: [1, 0], especial: '12x36', deslocamentos: ps.map((_, j) => j % 2), pessoas: ps }],
        instrumentos: instrumentos(['12x36'], ctx.neg, { intervalo: iv }), negociar: ['x12'],
        horasSemana: Math.round((ctx.indenizado ? dur.presenca : dur.presenca - iv) * 3.5) * I, semanasGrade: 2,
        horario: { muda: false, atual: textoJanela(ctx.atual, ops), e1: textoJanela(ctx.atual, ops), e2: null },
        ponderacoes: [textoComporta(ctx, I * 3.5)],
      });
    }
    const w = op.escala === '4x3' ? 4 : 5;
    let e1, e2 = null;
    if (op.horario && Array.isArray(op.horario.e1)) {
      e1 = especsDe(op.horario.e1);
      if (e1.erro) return { erro: e1.erro };
      if (op.horario.e2) { e2 = especsDe(op.horario.e2); if (e2.erro) return { erro: e2.erro }; }
      if (!e1.some(Boolean)) return { erro: 'Informe o horário de ao menos um dia.' };
    } else if (w === 4) {
      const cabe = ops.every((d) => ctx.atual[d].trab <= 600);
      e1 = ctx.semana.map((s) => s && (cabe && s.trabalho > 480 ? { ini: s.ini, trab: s.trabalho, intervalo: s.intervalo } : { ini: s.ini, trab: 600, intervalo: s.intervalo || 60 }));
    } else e1 = limitarDia(ctx, 480);
    const hc = horarioCenario('T', e1, e2);
    const diasHor = [0, 1, 2, 3, 4, 5, 6].filter((d) => e1[d]);
    const pond = [];
    let eq;
    if (op.folgas === 'escolher' && Array.isArray(op.dias) && op.dias.length) {
      const di = op.dias.filter((x) => !x.parcial).map((x) => normalizarFolgas(x.folgas) || []);
      const dp = op.dias.filter((x) => x.parcial).map((x) => normalizarFolgas(x.folgas) || []);
      let folgasI = di, rodI = false;
      if (op.rodiziar && new Set(di.map((f) => f.join())).size > 1) {
        const r = ordenarRodizio(di, ctx.domingo);
        if (r) { folgasI = r; rodI = true; pond.push('Os padrões escolhidos giram entre as pessoas a cada semana; o ciclo se repete a cada ' + di.length + ' semanas.'); }
        else pond.push('Não foi possível girar os padrões escolhidos sem passar de 6 dias seguidos' + (ctx.domingo ? ' ou sem folga num domingo a cada ' + (ctx.domingo === 2 ? 'duas' : 'três') + ' semanas' : '') + '; as folgas ficaram fixas por pessoa.');
      } else pond.push('Folgas escolhidas por você, fixas por pessoa.');
      if (di.some((f) => f.length !== 7 - w)) pond.push('Há integral com número de folgas diferente de ' + (7 - w) + ' por semana: a jornada semanal muda junto.');
      eq = { I: di.length, P: dp.length, w: w, k: 0, folgasI: folgasI, folgasP: dp, rodizioI: rodI, rodizioP: false, cobertura: cobrir(folgasI.concat(dp)) };
    } else {
      const I = Math.max(0, Math.floor(op.integrais || 0)), Pn = Math.max(0, Math.floor(op.parciais || 0));
      if (I + Pn === 0) return { erro: 'Informe ao menos uma pessoa.' };
      const kMax = Math.max(1, kParcialSemana(e1, diasHor));
      const k = Math.max(1, Math.min(kMax, Math.floor(op.diasParcial || kMax)));
      eq = compor(dem, { pref: ctx.pref, prefP: ctx.prefP, w: w, k: k, P: Pn, I: I, domingoComercio: ctx.domingo, rodizio: op.folgas !== 'fixas', forcar: true });
      if (!eq) return { erro: 'Não foi possível distribuir as folgas com essa composição.' };
      pond.push(descreverFolgas(eq), Pn ? 'Dias dos parciais: ' + diasParciais(eq) + '.' : null);
    }
    if (!eq.I && !eq.P) return { erro: 'Informe ao menos uma pessoa.' };
    const capacidade = eq.cobertura.reduce((s, x) => s + x, 0);
    pond.push(textoComporta(ctx, capacidade));
    const h = infoHorario(ctx, e1, e2);
    pond.unshift(textoMudanca(h));
    const ivs = diasHor.map((d) => e1[d].intervalo);
    // Dias acima de 8 h: na semana de até 40 h, acordo de compensação; acima de 40 h (etapa de 42 h), norma coletiva do art. 7º
    // pela leitura adotada, sem a qual o excedente é hora extra. O acordo só vale a partir da etapa em que é necessário.
    const semanaMax = (esp) => Math.max.apply(null, eq.folgasI.concat(eq.folgasP).map((f) => [0, 1, 2, 3, 4, 5, 6].reduce((s, d) => s + (f.indexOf(d) < 0 && esp[d] ? esp[d].trab : 0), 0)));
    const acima8 = (esp) => esp.some((x) => x && x.trab > 480);
    const lista = [], negociarMeu = [];
    let compDesde = null;
    if (acima8(e1) && semanaMax(e1) > 2400) { lista.push('art7'); negociarMeu.push('art7'); }
    else if (acima8(e1)) compDesde = JANELA1.inicio;
    const e2v = e2 || e1;
    if (!compDesde && acima8(e2v) && semanaMax(e2v) <= 2400) compDesde = iso(SEMANA_40);
    const inst = instrumentos(lista, ctx.neg, { intervaloMin: Math.min.apply(null, ivs), intervaloMax: Math.max.apply(null, ivs) });
    if (compDesde) {
      inst.push({ id: M.TIPOS_INSTRUMENTO.compensacao_mensal.nome, tipo: 'compensacao_mensal', natureza: 'individual', vigenciaInicio: compDesde });
      pond.push('Dias acima de 8 h em semana de até 40 h: basta acordo individual escrito, porque as horas se compensam dentro da mesma semana. Se alguma semana ficar com menos de dois repousos, o arranjo passa a depender da média mensal, só por norma coletiva.');
    }
    return avaliarCenario(ctx, {
      id: 'personalizado', personalizado: true, nome: 'Meu cenário: ' + (w === 4 ? '4x3' : '5x2') + (eq.P ? ' + ' + pl(eq.P, 'parcial', 'parciais') : ''),
      resumo: pl(eq.I, 'integral', 'integrais') + (eq.P ? ' e ' + pl(eq.P, 'parcial', 'parciais') : '') + '; folgas ' + (op.folgas === 'escolher' ? 'escolhidas' : eq.rodizioI ? 'em rodízio' : 'fixas') + (op.horario ? '; horário escolhido por dia' : '') + '.',
      jornada: textoHorarioCenario(ctx, e1, e2), grupos: gruposSemanais(ctx, eq, hc),
      instrumentos: inst, negociar: negociarMeu, acordos: compDesde ? [ACORDO_COMP] : [],
      horasSemana: horasDe(eq, e1), ponderacoes: pond, horario: h,
      semanasGrade: eq.rodizioI ? Math.min(Math.max(eq.folgasI.length, 3), 6) : 3, cicloSemanas: eq.rodizioI ? eq.folgasI.length : null,
    });
  }

  /** Folgas padrão para um cenário montado: a distribuição automática, fixa por pessoa, para o usuário editar. */
  function folgasPadrao(turno, empresa, opcoes, op) {
    const ctx = contexto(turno, empresa, opcoes);
    if (ctx.erro) return null;
    const w = op.escala === '4x3' ? 4 : 5;
    const e = limitarDia(ctx, w === 4 ? 600 : 480);
    const kMax = Math.max(1, kParcialSemana(e, ctx.operacao));
    const k = Math.max(1, Math.min(kMax, Math.floor(op.diasParcial || kMax)));
    const eq = compor(ctx.dem, { pref: ctx.pref, prefP: ctx.prefP, w: w, k: k, P: Math.max(0, op.parciais | 0), I: Math.max(0, op.integrais | 0), domingoComercio: ctx.domingo, rodizio: false, forcar: true });
    if (!eq) return null;
    return eq.folgasI.map((f) => ({ parcial: false, folgas: f.slice() })).concat(eq.folgasP.map((f) => ({ parcial: true, folgas: f.slice() })));
  }

  /** Grupos da escala de hoje: horário de cada dia, folgas informadas e, para quem não as informou, folgas distribuídas conforme a necessidade. */
  function gruposHoje(ctx) {
    const dur = ctx.dur;
    const porEscala = new Map();
    for (const p of ctx.atuais) { const k = ESCALAS_ATUAIS[p.escala] ? p.escala : '6x1'; if (!porEscala.has(k)) porEscala.set(k, []); porEscala.get(k).push(p); }
    const grupos = [], rotulos = [];
    const hcAtual = horarioCenario('H', ctx.atual, null);
    let informadas = 0;
    for (const [k, ps] of porEscala) {
      const e = ESCALAS_ATUAIS[k];
      rotulos.push(ps.length + ' em ' + e.rotulo);
      const pess = ps.map((p) => Object.assign({ id: p.id, nome: p.nome || p.id, parcial: !!e.parcial || p.contrato === 'parcial' }, p.art386 ? { art386: true } : {}));
      if (e.padrao && ctx.padrao) {
        const turnos = new Map(), dias = [];
        for (const w of ctx.padrao.semanas) for (const c of w) {
          if (!c) { dias.push(null); continue; }
          const k = c.ini + '|' + c.trab + '|' + c.intervalo;
          if (!turnos.has(k)) turnos.set(k, turnoMotor('P' + turnos.size, c.ini, c.trab, c.intervalo));
          dias.push(turnos.get(k).id);
        }
        grupos.push({ modo: 'padrao', turnos: Array.from(turnos.values()), dias: dias, revezar: ctx.padrao.revezar, pessoas: pess });
        continue;
      }
      if (e.ciclo) {
        const t = turnoMotor('T', dur.ini, dur.trabalho, dur.intervalo, e.especial && ctx.indenizado ? 'indenizado' : 'usufruido');
        grupos.push({ modo: 'ciclo', turnos: [t], ciclo: e.ciclo, especial: e.especial || null, deslocamentos: pess.map((_, j) => (e.especial ? j % 2 : Math.floor(j * e.ciclo.length / pess.length))), pessoas: pess });
      } else {
        const escolhidas = ps.map((p) => normalizarFolgas(p.folgas));
        informadas += escolhidas.filter(Boolean).length;
        const auto = escolhidas.filter((f) => !f).length;
        const off = 7 - e.dias;
        let padroes = [];
        if (auto) {
          // quem tem folgas informadas já cobre parte de cada dia; as folgas dos demais seguem a necessidade que sobra (D89)
          const resto = ctx.dem.slice();
          for (const f of escolhidas) if (f) for (let d = 0; d < 7; d++) if (f.indexOf(d) < 0 && ctx.dem[d] > 0) resto[d] = Math.max(0, resto[d] - 1);
          const c = [0, 0, 0, 0, 0, 0, 0];
          for (let q = 0; q < off * auto; q++) {
            let best = -1;
            for (const d of ctx.pref || PREF_FOLGA) if (c[d] < auto && (best < 0 || auto - resto[d] - c[d] > auto - resto[best] - c[best])) best = d;
            c[best]++;
          }
          padroes = agrupar(c, off, ctx.pref) || Array.from({ length: auto }, () => [6]);
        }
        let q = 0;
        grupos.push({ modo: 'fixo', turnos: hcAtual.turnos, periodos: hcAtual.periodos, folgas: escolhidas.map((f) => f || padroes[q++]), pessoas: pess });
      }
    }
    const extras = Object.fromEntries(ctx.atuais.map((p) => [p.id, { nome: p.nome || p.id, contrato: p.contrato === 'parcial' || p.escala === 'parcial' ? 'parcial' : 'integral' }]));
    return { grupos: grupos, rotulos: rotulos, informadas: informadas, extras: extras, op: { atividade: ctx.atividade, instrumentos: instrumentos(['12x36', 'par2'], ctx.neg, ctx.turnoUsuario) } };   // par2: hipótese de norma coletiva com média de repousos, quando o usuário a liga (D79)
  }
  /**
   * Calendário de um período (por exemplo, o ano de 2027) para os grupos de um cenário ou da escala de hoje, avaliados no
   * motor de uma vez. Devolve, por dia, quem trabalha ([id, entrada, saída, minutos de intervalo], em minutos desde a
   * meia-noite do dia) e quem está em repouso, e a lista de achados que não cumprem ('n') ou dependem de norma ainda
   * não firmada ('p'), com o período de cada um. Feriados tratados como dias normais, como nos cenários.
   */
  function calendario(grupos, op, inicio, fim) {
    const r = M.avaliar(montarEntrada(grupos, { inicio: inicio, fim: fim }, op || {}));
    const z0 = M.lerData(inicio), z1 = M.lerData(fim), n = z1 - z0 + 1;
    const dias = Array.from({ length: n }, () => ({ t: [], r: [] }));
    const achados = [];
    for (const e of r.empregados) {
      const pelaMedia = semanaPelaMedia(e);   // como em resumir (D79)
      for (const t of e.turnos) {
        const i = t.dia - z0;
        if (i < 0 || i >= n) continue;
        const z = t.dia * 1440;
        dias[i].t.push([e.id, t.ini - z, t.fim - z, (t.pausas || []).filter((q) => q.tipo !== 'indenizado').reduce((x, q) => x + q.fim - q.ini, 0)]);
      }
      for (const x of e.dias) { const i = x.d - z0; if (i >= 0 && i < n && x.repouso) dias[i].r.push(e.id); }
      for (const a of e.achados) {
        const st = a.status === 'nao_cumpre' ? 'n' : a.status === 'condicao' && !a.atendida ? 'p' : null;
        if (!st || !a.periodo || (a.regra === 'R2' && !a.instrumento)) continue;
        if (pelaMedia(a)) continue;
        const lo = Math.max(a.periodo.ini, z0), hi = Math.min(a.periodo.fim, z1);
        if (hi < lo) continue;
        achados.push([a.regra, e.id, st, a.porque || '', lo - z0, hi - z0]);
      }
    }
    return { inicio: z0, dias: dias, achados: achados, erros: r.erros.map((x) => x.onde + ': ' + x.msg) };
  }

  /** Horas da equipe de hoje por semana (relógio, computadas e noturnas), na janela de janeiro e fevereiro de 2027. */
  function equipeHoje(ctx) {
    if (!ctx.atuais.length) return null;
    const g = gruposHoje(ctx);
    const r = M.avaliar(montarEntrada(g.grupos, JANELA1, g.op));
    return Object.assign(medirEquipe(r, PERIODO_E1.ini, PERIODO_E1.dias, g.extras), { util: horasUteis(grade(r, 8, g.extras, PERIODO_E1.ini), ctx.dem) });
  }

  /** Diagnóstico da escala atual: usa o horário de cada dia, as folgas informadas e distribui as demais conforme a necessidade. */
  function diagnostico(turno, empresa, opcoes) {
    const ctx = contexto(turno, empresa, opcoes);
    if (ctx.erro) return { erro: ctx.erro };
    if (!ctx.atuais.length) return { vazio: true, horarioAtual: textoJanela(ctx.atual, ctx.operacao, true) };
    const dur = ctx.dur;
    const g = gruposHoje(ctx);
    const r1 = M.avaliar(montarEntrada(g.grupos, JANELA1, g.op));
    const r2 = M.avaliar(montarEntrada(g.grupos, JANELA2, g.op));
    const d = { etapas: { e1: resumir(r1, 1), e2: resumir(r2, 2) }, composicao: g.rotulos.join(', '), jornada: fh(dur.trabalho), grade: grade(r1, 2, g.extras, GRADE_INICIO), erros: r1.erros.map((x) => x.onde + ': ' + x.msg),
      folgasInformadas: g.informadas, semanais: ctx.atuais.filter((p) => { const e = ESCALAS_ATUAIS[p.escala]; return !e || !e.ciclo; }).length,
      horarioAtual: textoJanela(ctx.atual, ctx.operacao, true), uniforme: ctx.uniforme, horas: medirEquipe(r1, PERIODO_E1.ini, PERIODO_E1.dias, g.extras) };
    d.mudancas = { e1: mudancas(d.etapas.e1, 1), e2: mudancas(d.etapas.e2, 2) };
    d.grupos = g.grupos; d.op = g.op;
    d.situacao = situacao(Object.assign({ descoberto: false, negociar: [], acordos: [] }, d));
    return d;
  }

  return {
    ESCALAS_ATUAIS: ESCALAS_ATUAIS, DIAS: DIAS, DIAS_LONGOS: DIAS_LONGOS, JANELA1: JANELA1, JANELA2: JANELA2, ROTULO_NEGOCIACAO: ROTULO_NEGOCIACAO, MOTIVO: MOTIVO, AVISO_FERIADOS: AVISO_FERIADOS,
    duracoes: duracoes, compor: compor, comporMinimo: comporMinimo, agrupar: agrupar, ordenarRodizio: ordenarRodizio,
    cenarios: cenarios, personalizado: personalizado, folgasPadrao: folgasPadrao, diagnostico: diagnostico, montarEntrada: montarEntrada, capacidadeOk: capacidadeOk, calendario: calendario,
    custos: custos, MUDANCA: MUDANCA, SEMANAS_MES: SEMANAS_MES,

      if (!cobre) continue;
      const total = custoDe(a) != null && he.total != null ? custoDe(a) + he.total : null;
      const cand = { c: a.c, x: Object.assign({}, a.x, { horasExtras: he, perdaHorasResidual: 0, totalComHE: total }) };
      if (!B || (total != null && B.x.totalComHE != null ? total < B.x.totalComHE : cand.c.nota < B.c.nota)) B = cand;
    }
    // D: com norma coletiva ainda não negociada, se for mais barato ou contratar menos que C (a perda de produção aparece)
    const pend = avaliados.filter((a) => a.c.situacao.codigo === 'pendente');
    const D0 = menor(pend, (a) => a.x.perdaHoras * 1e3 + porCusto(a) / 1e3);
    // só entra se melhora algo na etapa definitiva: sem perda e mais barato ou com menos contratações que C, ou com menos
    // perda que A sem contratar mais (a transição do art. 7º, que só muda a etapa de 42 h, fica de fora)
    const melhorQueC = D0 && D0.x.perdaHoras <= TOL && (!C || (custoDe(D0) != null && custoDe(C) != null ? custoDe(D0) < custoDe(C) - 1 : D0.x.contratacoes < C.x.contratacoes));
    const melhorQueA = D0 && A && D0.x.perdaHoras < A.x.perdaHoras - TOL && D0.x.contratacoes <= A.x.contratacoes;
    const D = D0 && (melhorQueC || melhorQueA || (!A && !C)) ? D0 : null;

    if (A && C && A.c === C.c) out.push(Object.assign({ id: 'A', rotulo: A.x.contratacoes ? 'Mantendo a operação' : 'Sem contratar e sem perder produção' }, A));
    else {
      if (A) out.push(Object.assign({ id: 'A', rotulo: rotuloA(A) }, A));
      if (B) out.push(Object.assign({ id: 'B', rotulo: 'Sem contratar, com horas extras em revezamento' }, B));
      if (C) out.push(Object.assign({ id: 'C', rotulo: C.x.contratacoes ? 'Mantendo a operação, contratando' : 'Mantendo a operação' }, C));
    }
    // P: contratar com reforço em tempo parcial (CLT, art. 58-A), sem perda de produção, quando o melhor caminho C é outro
    const P = menor(semPerda.filter((a) => a.c.contratarParciais > 0), porCusto);
    if (P && (!C || P.c !== C.c)) out.push(Object.assign({ id: 'P', rotulo: 'Mantendo a operação, com reforço em tempo parcial' }, P));
    if (D) out.push(Object.assign({ id: 'D', rotulo: 'Com norma coletiva' }, D));
    return out;
  }
  function rotuloA(a) {
    const c = a.c;
    if (a.x.perdaHoras <= TOL) return 'Sem contratar';
    if (c.fecha && c.fecha.length) return 'Sem contratar, sem abrir em dias de menor movimento';
    if (c.descoberto) return 'Sem contratar, com menos gente em alguns dias';
    if (c.mudaHorario) return 'Sem contratar, com horário menor';
    return 'Sem contratar';
  }
  /** Caminho sugerido: se o funcionamento pode mudar, o sem contratação; senão, o de menor custo sem perda de produção. */
  function sugerido(lista, funcionamento) {
    if (!lista.length) return null;
    const a = lista.find((x) => x.id === 'A');
    if (funcionamento === 'flexivel' && a) return a.id;
    const semPerda = lista.filter((x) => x.id !== 'A' || x.x.perdaHoras <= TOL);
    const total = (x) => (x.x.totalComHE != null ? x.x.totalComHE : x.x.e2 ? x.x.e2.total : null);
    const comCusto = semPerda.filter((x) => total(x) != null && x.id !== 'D');
    if (comCusto.length) return comCusto.sort((p, q) => total(p) - total(q))[0].id;
    const c = lista.find((x) => x.id === 'C');
    return (c || a || lista[0]).id;
  }

  /* ================================================================ picos */

  const PROV = 1 / 12 + 1 / 12 * 4 / 3;   // 13º e férias com o terço, sobre a remuneração
  /** Encargos sem as provisões, a partir do percentual total (encargos e provisões) informado: e = (total − prov) ÷ (1 + prov). */
  const semProvisoes = (total) => Math.max(0, (num(total, 0) / 100 - PROV) / (1 + PROV));
  /**
   * Caminho para cobrir os dias que ficam com menos gente quando o quadro de hoje passa para 5x2 sem contratar
   * (cenário "sem-contratar" do planejador): F, diárias de freelancer, só onde o setor admite (varejo, alimentação e
   * hospedagem, pedido do usuário) e só quando as faltas caem em até dois dias da semana. Cada presença que falta por
   * semana vira uma diária, pelo valor informado, fora da folha e sem encargos. O contrato intermitente saiu a pedido do
   * usuário (D77); o reforço em tempo parcial é o caminho P, calculado pelo planejador (cenário 5x2-parcial).
   * params: os de custoCompleto, mais { diaria, freelancer: true quando o setor admite }
   */
  const MAX_DIAS_DIARIA = 2;
  function picos(cen, params) {
    if (!cen || cen.erro) return [];
    const p = params || {};
    if (!p.freelancer) return [];
    const sc = cen.lista.find((c) => c.id === 'sem-contratar' && c.descoberto && LEGAL.concat(['descoberto']).indexOf(c.situacao.codigo) >= 0 && !c.semFerias);
    if (!sc) return [];
    const dem = sc.demanda || cen.demanda;
    const faltas = sc.faltas.slice();
    const presencas = faltas.reduce((a, b) => a + b, 0);
    const diasFalta = faltas.filter((x) => x > 0).length;
    if (!presencas || diasFalta > MAX_DIAS_DIARIA) return [];
    // jornada de trabalho de cada dia no cenário (sem intervalos), para medir as horas de cada presença que falta
    const trabDia = [0, 0, 0, 0, 0, 0, 0];
    for (const l of sc.grade2.linhas) l.horas.forEach((h, i) => { if (h) trabDia[i % 7] = Math.max(trabDia[i % 7], h[1] - h[0] - (h[2] || []).reduce((s, q) => s + q[1] - q[0], 0)); });
    const minutos = faltas.reduce((s, f, d) => s + f * trabDia[d], 0);
    const base = custoCompleto(sc, cen.base, p);
    const diaria = num(p.diaria, null);
    const diarias = presencas * SEM;
    const valor = diaria != null && diaria > 0 ? diarias * diaria : null;
    return [{ id: 'F', rotulo: 'Sem contratar, com diárias de freelancer nos dias que faltam', c: sc,
      x: Object.assign({}, base, { perdaHoras: 0, faltas: faltas, presencas: presencas, minutos: minutos, demanda: dem, diasFalta: diasFalta, contratacoes: 0, unico: 0,
        picos: { tipo: 'diarias', diarias: diarias, valor: valor }, totalPicos: base.e2 && valor != null ? base.e2.total + valor : null }) }];
  }

  /**
   * Itens do percentual de encargos e provisões (decisão D53), para o quadro "como chegamos neste valor". Sem RAT ou
   * terceiros informados, usa 2% de RAT, FAP 1 e 5,8% de terceiros (FPAS de comércio, indústria e transporte), sinalizados
   * como estimativa.
   */
  function detalheEncargos(o) {
    const reg = o.regime || 'lucro';
    const est = [];
    let rat = num(o.rat, null), terc = num(o.terceiros, null);
    const fap = num(o.fap, 1) || 1;
    if (reg !== 'simples' && rat == null) { rat = 2; est.push('RAT'); }
    if (reg === 'lucro' && terc == null) { terc = 5.8; est.push('terceiros'); }
    const itens = [];
    if (reg !== 'simples') { itens.push(['Contribuição patronal ao INSS', 20]); itens.push(['RAT × FAP', Math.round(rat * fap * 100) / 100]); }
    if (reg === 'lucro') itens.push(['Terceiros (Sistema S, salário-educação, Incra)', terc]);
    itens.push(['FGTS', 8]);
    const e = itens.reduce((s, x) => s + x[1], 0);
    const prov = [['13º salário', 100 / 12], ['Férias com o terço', 100 / 12 * 4 / 3]];
    const sobre = e * (PROV * 100) / 100;
    const total = Math.round((e + PROV * 100 + sobre) * 100) / 100;
    return { regime: reg, itens: itens, provisoes: prov, sobreProvisoes: sobre, total: total, estimados: est };
  }

  /* ================================================================ escala editada */

  const INICIO_EDICAO = '2028-01-10';   // uma segunda-feira já sob o teto de 40 h
  const dataIso = (z) => { const c = M.civil(z); return c.a + '-' + String(c.m).padStart(2, '0') + '-' + String(c.d).padStart(2, '0'); };
  /**
   * Confere no motor uma escala semanal editada (as semanas exibidas, sem repetição): linhas { id, nome, contrato,
   * dias: ['T'|'F'|'R'] × 7S, horas: [[entrada, saída, pausas]] × 7S }, com os instrumentos e a atividade do cenário.
   * Devolve a situação, os problemas por pessoa, as horas semanais de cada pessoa e a cobertura mínima de cada dia.
   */
  function validarGrade(linhas, semanas, opcoes) {
    const o = opcoes || {};
    const z0 = M.lerData(INICIO_EDICAO), n = 7 * semanas;
    const turnos = new Map(), escalas = [], empregados = [], atribuicoes = [];
    const idTurno = (h) => {
      const k = h[0] + '|' + h[1] + '|' + (h[2] || []).map((q) => q[0] + '-' + q[1]).join(',');
      if (!turnos.has(k)) {
        const id = 'T' + turnos.size;
        turnos.set(k, { id: id, nome: id, inicio: M.fmtHora(h[0]), fim: M.fmtHora(h[1]), pausas: (h[2] || []).map((q) => ({ inicio: M.fmtHora(q[0]), duracao: q[1] - q[0], tipo: 'usufruido' })) });
      }
      return turnos.get(k).id;
    };
    for (const l of linhas) {
      const dias = [];
      for (let i = 0; i < n; i++) dias.push(l.dias[i] === 'T' && l.horas[i] ? idTurno(l.horas[i]) : null);
      empregados.push(Object.assign({ id: l.id, nome: l.nome, admissao: '2020-01-01', setor: 'S' }, l.contrato === 'parcial' ? { tipo: 'parcial' } : {}, l.art386 ? { art386: true } : {}));
      escalas.push({ id: 'E-' + l.id, tipo: 'semanal', dias: dias, trabalhaFeriados: true });
      atribuicoes.push({ empregado: l.id, escala: 'E-' + l.id, inicio: INICIO_EDICAO, fim: dataIso(z0 + n - 1), ancora: INICIO_EDICAO });
    }
    const fim = M.civil(z0 + n - 1);
    const entrada = { empresa: { atividade: o.atividade || 'servicos' }, horizonte: { inicio: INICIO_EDICAO, fim: fim.a + '-' + String(fim.m).padStart(2, '0') + '-' + String(fim.d).padStart(2, '0') }, feriados: [],
      turnos: Array.from(turnos.values()), escalas: escalas, empregados: empregados, atribuicoes: atribuicoes, excecoes: [], instrumentos: o.instrumentos || [] };
    const r = M.avaliar(entrada);
    const resumo = P._interno.resumir(r, 2);
    const nomes = new Map(linhas.map((l) => [l.id, l.nome]));
    const problemas = [];
    for (const e of r.empregados) {
      const vistos = new Set();
      for (const a of e.achados) if (a.status === 'nao_cumpre' && !vistos.has(a.regra) && !(a.regra === 'R2' && !a.instrumento)) { vistos.add(a.regra); problemas.push({ pessoa: nomes.get(e.id) || e.id, regra: a.regra, porque: a.porque }); }
    }
    const eq = P._interno.medirEquipe(r, z0, n, null);
    const horas = new Map(eq.pessoas.map((x) => [x.id, { rel: x.rel, comp: x.comp, dias: x.dias }]));
    const cobertura = [Infinity, Infinity, Infinity, Infinity, Infinity, Infinity, Infinity];
    for (let s = 0; s < semanas; s++) for (let d = 0; d < 7; d++) {
      let c = 0;
      for (const l of linhas) if (l.dias[s * 7 + d] === 'T') c++;
      cobertura[d] = Math.min(cobertura[d], c);
    }
    return { status: resumo.status, motivos: resumo.motivos, pendente: resumo.pendente, problemas: problemas, horas: horas, cobertura: cobertura, erros: r.erros.map((x) => x.onde + ': ' + x.msg) };
  }

  /** Frase curta do diagnóstico de hoje, com o que precisa mudar nas duas etapas. */
  function veredito(diag) {
    if (!diag || diag.vazio || diag.erro) return null;
    const e1 = diag.etapas.e1.status, e2 = diag.etapas.e2.status;
    const cod = e1 === 'nao_cumpre' ? 'nao_cumpre' : e1 === 'pendente' ? 'pendente' : e2 === 'nao_cumpre' ? 'transitorio' : e2 === 'pendente' ? 'pendente' : diag.situacao.codigo;
    const textos = [];
    const vistos = new Set();
    let semana42 = false, semana40 = false;
    for (const e of ['e1', 'e2']) for (const m of (diag.mudancas && diag.mudancas[e]) || []) {
      if (m.texto === 'Reduzir a semana a 42 h') { semana42 = true; continue; }
      if (m.texto === 'Reduzir a semana a 40 h') { semana40 = true; continue; }
      if (!vistos.has(m.texto)) { vistos.add(m.texto); textos.push(m.texto.charAt(0).toLowerCase() + m.texto.slice(1)); }
    }
    if (semana42 && semana40) textos.push('reduzir a semana a 42 h até 15/12/2027 e a 40 h depois');
    else if (semana40) textos.push('reduzir a semana a 40 h a partir de 16/12/2027');
    else if (semana42) textos.push('reduzir a semana a 42 h');
    if (cod === 'cumpre') return { codigo: 'cumpre', texto: 'A escala de hoje já cumpre a Emenda Constitucional 141 (Fim da 6x1) nas duas etapas.' };
    if (cod === 'condicao') return { codigo: 'condicao', texto: 'A escala de hoje cumpre a Emenda Constitucional 141 (Fim da 6x1) com os acordos que ela já pressupõe.' };
    if (cod === 'pendente') return { codigo: 'pendente', texto: 'A escala de hoje depende de norma coletiva para cumprir a Emenda Constitucional 141 (Fim da 6x1)' + (textos.length ? '. Para cumprir, precisa ' + juntar(textos) : '') + '.' };
    if (cod === 'transitorio') return { codigo: 'transitorio', texto: 'A escala de hoje cumpre até 15/12/2027. Para depois, precisa ' + juntar(textos) + '.' };
    return { codigo: 'nao_cumpre', texto: 'A escala de hoje não cumpre a Emenda Constitucional 141 (Fim da 6x1). Para cumprir, precisa ' + juntar(textos) + '.' };
  }
  function juntar(xs) { return xs.length <= 1 ? xs.join('') : xs.slice(0, -1).join('; ') + ' e ' + xs[xs.length - 1]; }

  /**
   * Percentual de encargos e provisões sobre a folha a partir do regime (calculadora do modo escritório, decisão D53):
   * contribuição patronal de 20% e RAT × FAP (Lei 8.212/1991, art. 22, I e II), terceiros conforme o FPAS, FGTS de 8%
   * (Lei 8.036/1990, art. 15), provisões de 13º (1/12) e de férias com o terço (1/12 × 4/3), com os encargos incidindo
   * também sobre as provisões. No Simples Nacional (Anexos I a III e V) a contribuição patronal, o RAT e terceiros estão no
   * DAS; no Anexo IV, a contribuição patronal e o RAT são recolhidos à parte, sem terceiros.
   */
  function encargosPorRegime(o) {
    const rat = num(o.rat, null), fap = num(o.fap, 1), terc = num(o.terceiros, null);
    let e;
    if (o.regime === 'simples') e = 8;
    else if (o.regime === 'simples4') { if (rat == null) return null; e = 20 + rat * fap + 8; }
    else { if (rat == null || terc == null) return null; e = 20 + rat * fap + terc + 8; }
    const prov = 100 / 12 + 100 / 12 * 4 / 3;
    return Math.round((e + prov + e * prov / 100) * 100) / 100;
  }

  /* ================================================================ exercício: repousos pela média do mês (§ 2º) */

  const SEMANA = [0, 1, 2, 3, 4, 5, 6];
  function subconjuntos(arr, n) {
    const out = [];
    const ir = (i, acc) => { if (acc.length === n) { out.push(acc.slice()); return; } for (let j = i; j < arr.length; j++) { acc.push(arr[j]); ir(j + 1, acc); acc.pop(); } };
    ir(0, []);
    return out;
  }
  /** Maior sequência de dias de trabalho (true) na lista; `ciclico`, contando a volta do fim para o começo. */
  function maiorSequencia(seq, ciclico) {
    const s = ciclico ? seq.concat(seq) : seq;
    let m = 0, c = 0;
    for (const x of s) { c = x ? c + 1 : 0; if (c > m) m = c; }
    return ciclico ? Math.min(m, seq.length) : m;
  }
  const menorLex = (a, b) => { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] < b[i]; return false; };
  /** Dias de trabalho por semana de cada ciclo do exercício. */
  const MODELOS_MEDIA = { '6454': [6, 4, 5, 4], '64': [6, 4] };
  /**
   * Ciclo de exercício para o regime de média de repousos do § 2º, que depende de norma coletiva (D46, D80), no formato da
   * escala personalizada: semanas × dias com 'p' (jornada do turno), minutos de trabalho ou null (folga). As folgas caem
   * nos dias em que a função trabalha, espalhadas para equilibrar a cobertura e de preferência emendadas, sem sete dias
   * seguidos de trabalho (também na volta do ciclo) e, no comércio com domingo, com folga no domingo a cada duas semanas
   * (Lei 10.101/2000, art. 6º, parágrafo único). A jornada de cada dia é a do turno, limitada a 8 h e ao que cabe em 40 h
   * na semana (6h40 na semana de seis dias). Modelos: '6454' (semanas de 6, 4, 5 e 4 dias: 9 repousos em 28 dias),
   * '64' (6 e 4 alternados: 8 em 28) e '6x2' (seis dias de trabalho e dois de folga, em oito semanas; só com os sete dias).
   */
  function modeloMedia(modelo, dias, trab, o) {
    const opc = o || {};
    const D = SEMANA.filter((d) => dias && dias[d]);
    const t0 = Math.round(num(trab, 0));
    if (!(t0 > 0)) return { erro: 'Informe o horário do turno.' };
    const dur = (k) => { const v = Math.min(t0, 480, Math.floor(2400 / k)); return v >= t0 ? 'p' : v; };
    if (modelo === '6x2') {
      if (D.length < 7) return { erro: 'O 6x2 gira pelos dias da semana: só se aplica à função que trabalha todos os dias.' };
      const semanas = [];
      for (let w = 0; w < 8; w++) {
        const on = SEMANA.map((d) => (w * 7 + d) % 8 < 6);
        const k = on.filter(Boolean).length;
        semanas.push(on.map((x) => (x ? dur(k) : null)));
      }
      return { semanas: semanas, revezar: true };
    }
    const ks = MODELOS_MEDIA[modelo];
    if (!ks) return { erro: 'Ciclo desconhecido.' };
    const kmax = Math.max.apply(null, ks);
    if (kmax > D.length) return { erro: 'O ciclo tem semanas de ' + kmax + ' dias de trabalho: a função precisa trabalhar em ao menos ' + kmax + ' dias da semana.' };
    const domingo = !!opc.domingo && !!dias[6];
    for (const modo of ['equilibrio', 'sequencia']) {
      const quedas = {};
      D.forEach((d) => { quedas[d] = 0; });
      const seq = [], semanas = [];
      let semDomingo = 1;
      for (let w = 0; w < ks.length; w++) {
        const n = D.length - ks[w];
        const forca = domingo && n > 0 && semDomingo >= 1;
        let melhor = null, nota = null;
        for (const off of subconjuntos(D, n)) {
          if (forca && off.indexOf(6) < 0) continue;
          const on = SEMANA.map((d) => !!dias[d] && off.indexOf(d) < 0);
          const run = maiorSequencia(seq.concat(on), w === ks.length - 1);
          const bal = off.reduce((s, d) => s + quedas[d], 0);
          let emenda = 0;
          for (let i = 1; i < off.length; i++) if (off[i] === off[i - 1] + 1) emenda++;
          const v = modo === 'equilibrio' ? [run > 6 ? 1 : 0, bal, -emenda, run] : [run, bal, -emenda];
          if (!nota || menorLex(v, nota)) { melhor = { off: off, on: on }; nota = v; }
        }
        melhor.off.forEach((d) => { quedas[d]++; });
        semDomingo = !dias[6] || melhor.off.indexOf(6) >= 0 ? 0 : semDomingo + 1;
        seq.push.apply(seq, melhor.on);
        semanas.push(melhor.on.map((x) => (x ? dur(ks[w]) : null)));
      }
      if (maiorSequencia(seq, true) <= 6) return { semanas: semanas, revezar: true };
    }
    return { erro: 'Não foi possível montar o ciclo sem sete dias seguidos de trabalho nos dias desta função.' };
  }

  return {
    DIAS_POR_SEMANA: DIAS_POR_SEMANA, intervaloLegal: intervaloLegal, coberturaHoje: coberturaHoje, conferir: conferir, turnos: turnos,
    resolverPadrao: resolverPadrao, resolverPorDia: resolverPorDia, SEMANAIS: SEMANAIS, diasSemanaDe: diasSemanaDe, diasDe: diasDe, intervaloTrabalho: intervaloTrabalho,
    custoCompleto: custoCompleto, manterComoEsta: manterComoEsta, caminhos: caminhos, sugerido: sugerido, veredito: veredito, encargosPorRegime: encargosPorRegime,
    picos: picos, detalheEncargos: detalheEncargos, semProvisoes: semProvisoes, validarGrade: validarGrade,
    modeloMedia: modeloMedia, maiorSequencia: maiorSequencia, MODELOS_MEDIA: MODELOS_MEDIA, diasInformados: diasInformados,
  };
});
