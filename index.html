<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador da Emenda Constitucional 141 (Fim da 6x1)</title>
<meta name="description" content="Simulador de escalas para a Emenda Constitucional 141/2026 (Fim da 6x1). Claudio Zalaf Advogados Associados.">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<style>*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0;min-height:100vh}</style>
<style>
/* Versão 4 (D116): uma tela. À esquerda, a equipe de hoje em seis respostas (no celular, em cima); à direita, a resposta
   à pergunta do RH e todos os caminhos. Mesma identidade da versão anterior: fundo cinza-claro, cartões brancos, azul
   para ação, verde, âmbar e vermelho só para estados, sempre com texto. */
:root {
  --papel: #f5f5f7; --superficie: #ffffff; --tinta: #1d1d1f; --suave: #6e6e73; --linha: #d2d2d7; --campo: #ffffff; --leve: #f2f2f5;
  --marca: #0071e3; --marca-forte: #0062c3; --marca-suave: #e8f1fd; --marca-tinta: #0058b0;
  --ok: #1a7f37; --ok-bg: #e6f4ea; --nok: #c4161c; --nok-bg: #fdecec; --pend: #9a4d00; --pend-bg: #fff3dc;
  --vidro: rgba(255, 255, 255, .82); --foco: rgba(0, 113, 227, .22); --sombra: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 16px rgba(0, 0, 0, .04);
  --f: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --raio: 12px; --raio-g: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --papel: #000000; --superficie: #1c1c1e; --tinta: #f5f5f7; --suave: #98989d; --linha: #38383a; --campo: #1c1c1e; --leve: #2c2c2e;
  --marca: #2997ff; --marca-forte: #4aa8ff; --marca-suave: #0c2b4f; --marca-tinta: #6cb8ff;
  --ok: #30d158; --ok-bg: #0f2e1a; --nok: #ff6961; --nok-bg: #3a1414; --pend: #ffb340; --pend-bg: #33270b;
  --vidro: rgba(22, 22, 23, .82); --foco: rgba(41, 151, 255, .3); --sombra: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --papel: #000000; --superficie: #1c1c1e; --tinta: #f5f5f7; --suave: #98989d; --linha: #38383a; --campo: #1c1c1e; --leve: #2c2c2e;
  --marca: #2997ff; --marca-forte: #4aa8ff; --marca-suave: #0c2b4f; --marca-tinta: #6cb8ff;
  --ok: #30d158; --ok-bg: #0f2e1a; --nok: #ff6961; --nok-bg: #3a1414; --pend: #ffb340; --pend-bg: #33270b;
  --vidro: rgba(22, 22, 23, .82); --foco: rgba(41, 151, 255, .3); --sombra: none; color-scheme: dark }

[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--papel); color: var(--tinta); font-family: var(--f); font-size: 16px; line-height: 1.47; letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
html { scroll-behavior: smooth; }
h2, h3, h4, h5 { margin: 0; font-weight: 700; text-wrap: balance; }
h2 { font-size: clamp(22px, 2.4vw, 28px); line-height: 1.15; letter-spacing: -.022em; }
h3 { font-size: 20px; line-height: 1.2; letter-spacing: -.018em; }
h4 { font-size: 17px; line-height: 1.25; font-weight: 650; }
h5 { font-size: 14px; font-weight: 650; color: var(--suave); }
p { margin: 0; }
small { font-size: 13px; color: var(--suave); display: block; line-height: 1.4; }
a { color: var(--marca-tinta); text-underline-offset: .15em; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--suave); display: block; }
.lead { color: var(--suave); font-size: 18px; line-height: 1.42; max-width: 60ch; }
.nota { font-size: 14px; color: var(--suave); line-height: 1.45; }
.det { font-size: 14px; color: var(--suave); line-height: 1.45; }
.suave { color: var(--suave); }
.base { color: var(--suave); font-size: 12.5px; }
.aviso { background: var(--pend-bg); color: var(--pend); border-radius: var(--raio); padding: 10px 14px; font-size: 14px; }

/* ---------------------------------------------------------------- barra */
.barra { position: sticky; top: 0; z-index: 20; background: var(--vidro); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--linha);
  display: flex; align-items: baseline; gap: 6px 16px; flex-wrap: wrap; padding: 10px max(24px, env(safe-area-inset-right, 0px)) 10px max(24px, env(safe-area-inset-left, 0px)); }
.marca b { font-size: 14px; font-weight: 600; }
.produto { font-size: 14px; color: var(--suave); }
.rodape { text-align: center; padding: 8px 16px 32px; }
.rodape p { font-size: 12.5px; color: var(--suave); }

/* ---------------------------------------------------------------- layout */
main { max-width: 1280px; margin: 0 auto; padding: 24px max(24px, env(safe-area-inset-right, 0px)) 48px max(24px, env(safe-area-inset-left, 0px)); }
.app { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 1000px) {
  .app { grid-template-columns: 380px minmax(0, 1fr); align-items: start; }
  .lado { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; border-radius: var(--raio-g); }
}
@media (max-width: 560px) { main { padding: 16px 16px 40px; } .barra { padding-left: 16px; padding-right: 16px; } }
.principal { display: grid; gap: 20px; min-width: 0; }

/* ---------------------------------------------------------------- formulário */
.form { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-g); padding: 20px; display: grid; gap: 16px; box-shadow: var(--sombra); }
.form-cab { display: grid; gap: 4px; }
.campo { display: grid; gap: 6px; min-width: 0; border: 0; margin: 0; padding: 0; }
.rot { font-size: 14px; font-weight: 600; }
input[type="text"], input[type="time"], select { width: 100%; min-width: 0; border: 1px solid var(--linha); background: var(--campo); border-radius: 10px; padding: 9px 12px; font-size: 16px; }
input:focus, select:focus { outline: none; border-color: var(--marca); box-shadow: 0 0 0 4px var(--foco); }
input:disabled { opacity: .45; }
.prefixo { display: flex; align-items: center; border: 1px solid var(--linha); background: var(--campo); border-radius: 10px; padding-left: 12px; }
.prefixo span { color: var(--suave); }
.prefixo input { border: 0; box-shadow: none !important; background: transparent; }
.prefixo:focus-within { border-color: var(--marca); box-shadow: 0 0 0 4px var(--foco); }
.horario { display: flex; align-items: center; gap: 8px; }
.horario input { flex: 1; }
.horario span { color: var(--suave); }
.horario.mini input { padding: 6px 8px; font-size: 15px; }
.horario.mini label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--suave); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--linha); background: var(--superficie); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 15px; font-weight: 500; min-height: 38px; }
.chip[aria-pressed="true"] { background: var(--marca); border-color: var(--marca); color: #fff; }
.chip.mini { padding: 4px 10px; font-size: 13px; min-height: 30px; }
.chips.dias .chip { min-width: 48px; padding: 7px 8px; }
.chip-select { width: auto !important; border-radius: 999px !important; padding: 7px 12px !important; font-size: 15px !important; min-height: 38px; }
.chip-select.on { background: var(--marca); border-color: var(--marca); color: #fff; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; }
.check input { margin-top: 4px; width: 18px; height: 18px; flex: none; accent-color: var(--marca); }
.refinar { border-top: 1px solid var(--linha); padding-top: 12px; }
.refinar summary { cursor: pointer; font-weight: 600; font-size: 15px; list-style: none; }
.refinar summary::-webkit-details-marker { display: none; }
.refinar summary::before { content: "+"; display: inline-block; width: 18px; color: var(--marca); font-weight: 700; }
.refinar[open] summary::before { content: "−"; }
.ref { display: grid; gap: 14px; padding-top: 14px; }
.ref fieldset { display: grid; gap: 8px; }
.necs { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.nec { display: grid; gap: 2px; text-align: center; font-size: 12px; color: var(--suave); }
.nec input { padding: 7px 2px; text-align: center; font-size: 15px; }
.form-pe { display: flex; justify-content: flex-end; }

/* ---------------------------------------------------------------- botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--linha); background: var(--superficie); border-radius: 999px; padding: 9px 18px; cursor: pointer; font-weight: 500; font-size: 15px; line-height: 1.2; min-height: 40px; }
.btn:hover:not(:disabled) { border-color: var(--suave); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primario { background: var(--marca); border-color: var(--marca); color: #fff; }
.btn.mini { padding: 6px 12px; font-size: 14px; min-height: 34px; }
.exportar { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------------------------------------------------------------- resposta */
.vazio, .resposta, .hoje-box, .comum, .base-norm, .caminhos-todos { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-g); padding: 22px; display: grid; gap: 10px; box-shadow: var(--sombra); }
.caminhos-todos { background: transparent; border: 0; box-shadow: none; padding: 8px 2px 0; }
.resposta { border-left: 6px solid var(--linha); }
.resposta.ok { border-left-color: var(--ok); }
.resposta.pend { border-left-color: var(--pend); }
.resposta.nok { border-left-color: var(--nok); }
.pergunta { font-size: clamp(19px, 2vw, 23px); }
.veredito { font-size: clamp(26px, 3vw, 34px); font-weight: 750; letter-spacing: -.025em; line-height: 1.1; }
.resposta.ok .veredito { color: var(--ok); }
.resposta.pend .veredito { color: var(--pend); }
.resposta.nok .veredito { color: var(--nok); }
.caminhos { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.atalhos { border-top: 1px solid var(--linha); padding-top: 10px; display: grid; gap: 4px; }
.atalhos ul { margin: 0; padding-left: 20px; display: grid; gap: 2px; font-size: 15px; }
.grupo { scroll-margin-top: 64px; }
.hoje-box h3 { font-size: 18px; }
.comum ul, .avancar ol, ul.fund { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.comum li { font-size: 15px; }
.base-norm p { font-size: 13px; color: var(--suave); }

/* ---------------------------------------------------------------- grupos e cenários */
.grupo { display: grid; gap: 12px; }
.grupo > h3 { padding: 6px 2px 0; }
.grupo.g-nao > h3 { color: var(--suave); }
.lista { display: grid; gap: 12px; }
.cen { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-g); padding: 18px; display: grid; gap: 14px; box-shadow: var(--sombra); scroll-margin-top: 72px; min-width: 0; }
.cen > header { display: grid; gap: 4px; }
.etapas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .etapas { grid-template-columns: minmax(0, 1fr); } }
.etapa { background: var(--leve); border-radius: var(--raio); padding: 10px 12px; display: grid; gap: 4px; }
.etapa p { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.etapa p.det { display: block; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 14px; font-weight: 600; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.pend { background: var(--pend-bg); color: var(--pend); }
.pill.nok { background: var(--nok-bg); color: var(--nok); }
.cert { font-size: 12px; color: var(--suave); border: 1px solid var(--linha); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.cert.c-leitura { border-style: dashed; }
.fatos { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 16px; }
.fatos div { display: grid; gap: 2px; min-width: 0; }
.fatos dt { font-size: 13px; color: var(--suave); }
.fatos dd { margin: 0; font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.sobe { color: var(--pend); font-weight: 600; }
.desce { color: var(--ok); font-weight: 600; }
.avancar { display: grid; gap: 6px; border-top: 1px solid var(--linha); padding-top: 12px; }
.avancar li { font-size: 15px; }
.avancar li.p-risco, .avancar li.p-aviso { color: var(--pend); }
.detalhes { border-top: 1px solid var(--linha); padding-top: 10px; }
.detalhes summary { cursor: pointer; font-weight: 600; color: var(--marca-tinta); font-size: 15px; }
.fundamentos, .escala { display: grid; gap: 8px; padding-top: 12px; }
ul.fund li { font-size: 14px; }

/* ---------------------------------------------------------------- escala pessoa por pessoa */
.semanas { display: flex; flex-wrap: wrap; gap: 4px; }
.tab-rol { overflow-x: auto; max-width: 100%; }
table.grade { border-collapse: collapse; font-size: 13px; min-width: 100%; }
table.grade th, table.grade td { padding: 2px; text-align: center; }
table.grade th[scope="row"] { text-align: left; font-weight: 500; color: var(--suave); white-space: nowrap; padding-right: 8px; }
table.grade thead th, table.grade tr:first-child th { color: var(--suave); font-weight: 600; }
table.grade tr.nova th { color: var(--marca-tinta); }
table.grade tr.tot th, table.grade tr.tot td { border-top: 1px solid var(--linha); font-weight: 600; padding-top: 6px; }
.dia { width: 100%; min-width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--linha); cursor: pointer; font-weight: 600; font-size: 13px; }
.dia.t { background: var(--marca-suave); color: var(--marca-tinta); border-color: transparent; }
.dia.f { background: var(--superficie); color: var(--suave); }
.ajuste-ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.conf { border-radius: var(--raio); padding: 12px; display: grid; gap: 8px; border: 1px solid var(--linha); }
.conf.ok { background: var(--ok-bg); }
.conf.pend { background: var(--pend-bg); }
.conf.nok { background: var(--nok-bg); }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1d1d1f; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 50; max-width: calc(100vw - 32px); text-align: center; }

/* ---------------------------------------------------------------- turnos (D117) */
.turno-linha { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px 10px; align-items: center; padding: 4px 0; }
.turno-linha .rot-t { grid-column: 1 / -1; font-size: 13px; font-weight: 600; color: var(--suave); }
.turno-linha .sem-borda { justify-self: end; }
@media (max-width: 1240px) and (min-width: 1000px), (max-width: 560px) {
  .turno-linha { grid-template-columns: minmax(0, 1fr) auto; }
  .turno-linha .horario { grid-column: 1 / -1; }
}
.pess { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--suave); }
.pess input { width: 68px; text-align: center; }
.mulheres { display: flex; flex-wrap: wrap; gap: 10px; }
.mulheres .rot-t { font-size: 13px; }
.nec-linha { display: grid; gap: 4px; }
.nec-linha .rot-t { font-size: 13px; font-weight: 600; color: var(--suave); }
.btn.sem-borda { border-color: transparent; color: var(--marca-tinta); padding-left: 0; min-height: 28px; }
.mini24 { margin: 4px 0 0; }
.mini24 svg { width: 100%; height: auto; display: block; }
.faixa { fill: var(--marca-suave); stroke: var(--marca); stroke-width: 1; }
.faixa-rot { font-size: 9px; fill: var(--marca-tinta); font-weight: 600; font-family: var(--f); }
.eixo { font-size: 10px; fill: var(--suave); font-family: var(--f); }

/* ---------------------------------------------------------------- o dia em 24 horas */
.dia24 { display: grid; gap: 8px; padding-top: 12px; }
.dia24 figure { margin: 0; }
.dia24 svg { width: 100%; height: auto; display: block; overflow: visible; }
.dia24 .faixa-rot { font-size: 10px; }
.dia24 .eixo { font-size: 11px; }
.b24 { fill: var(--marca); }
.l24 { fill: none; stroke: var(--suave); stroke-width: 2; stroke-linejoin: round; }
.base24 { stroke: var(--linha); stroke-width: 1; }
.alvo { fill: transparent; cursor: crosshair; }
.alvo:hover { fill: rgba(127, 127, 127, .12); }
.leg24 { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--suave); flex-wrap: wrap; }
.leg24 .ch-b { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--marca); }
.leg24 .ch-l { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--suave); margin-left: 10px; }
.leitura24 { min-height: 1.45em; }
.fatos .largo { grid-column: 1 / -1; }

/* ---------------------------------------------------------------- calendário */
.detalhes.cal { margin-top: -4px; }
.cal-corpo { display: grid; gap: 10px; padding-top: 10px; }
.cal-nav { display: flex; align-items: center; gap: 12px; }
.cal-nav b { min-width: 11em; text-align: center; }
.cal-grade { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; max-width: 520px; }
.cd { position: relative; display: grid; place-items: center; gap: 0; min-height: 44px; border-radius: 8px; border: 1px solid transparent; font-size: 13px; padding: 2px; background: transparent; line-height: 1.15; }
button.cd { cursor: pointer; }
.cd b { font-weight: 600; font-size: 13px; }
.cd i { font-style: normal; font-size: 11px; color: var(--suave); }
.cd em { position: absolute; top: 2px; right: 4px; font-style: normal; font-size: 10px; font-weight: 700; }
.cd.cab { min-height: 20px; font-size: 12px; color: var(--suave); font-weight: 600; }
.cd.vazio { visibility: hidden; }
.cd.fora { color: var(--linha); }
.cd.s-ok { background: var(--ok-bg); }
.cd.s-p { background: var(--pend-bg); }
.cd.s-p em { color: var(--pend); }
.cd.s-n { background: var(--nok-bg); }
.cd.s-n em { color: var(--nok); }
.cd.s-x { background: var(--leve); }
.cd.fer::after { content: ""; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: var(--marca); }
.cd[aria-pressed="true"] { border-color: var(--marca); box-shadow: 0 0 0 2px var(--foco); }
.leg-cal { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12.5px; color: var(--suave); }
.leg-cal .cd { display: inline-block; min-height: 12px; width: 14px; height: 14px; border-radius: 4px; padding: 0; vertical-align: middle; }
.leg-cal .cd.fer { background: transparent; border: 1px solid var(--linha); }
.leg-cal .cd.fer::after { bottom: 3px; }
.cal-dia { border: 1px solid var(--linha); border-radius: var(--raio); padding: 12px; display: grid; gap: 8px; }
.cal-dia h5 { color: var(--tinta); }

</style>
</head>

<header id="topo"></header>
<main id="vista"></main>
<footer class="rodape" id="rodape"></footer>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script id="motor-escalas">/*
 * Simulador de Escalas — Emenda Constitucional nº 141/2026 (Fim da 6x1)
 * Motor de cálculo (módulo puro, sem DOM)
 * Claudio Zalaf Advogados Associados · Área Trabalhista
 *
 * Unidades internas
 *   datas  → número inteiro de dias desde 01/01/1970 (sem fuso horário)
 *   tempo  → minutos inteiros; horas computadas em unidades de 1/7 de minuto (U = 7 por minuto),
 *            porque a hora noturna reduzida vale 8/7 da hora de relógio
 *   moeda  → centavos inteiros
 * Nenhum arredondamento antes da exibição.
 */
(function (raiz, fabrica) {
  'use strict';
  var M = fabrica();
  if (typeof module === 'object' && module.exports) module.exports = M;
  else raiz.MotorEscalas = M;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const VERSAO = '0.5.0';
  const BASE_NORMATIVA = '23/11/2026';   // Emenda 141/2026, liminar na ADI 8.041 (12/11), rito de mérito (17/11), Decreto 13.173/2026 (19/11) e Portaria MTE 2.041/2026 (23/11)
  const U = 7;
  const HORA = 60 * U;
  const DIA = 1440;

  /* ================================================================== datas */

  function diaDe(a, m, d) {
    const y = a - (m <= 2 ? 1 : 0);
    const era = Math.floor(y / 400);
    const yoe = y - era * 400;
    const mp = (m + 9) % 12;
    const doy = Math.floor((153 * mp + 2) / 5) + d - 1;
    const doe = yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy;
    return era * 146097 + doe - 719468;
  }
  function civil(z) {
    const zz = z + 719468;
    const era = Math.floor(zz / 146097);
    const doe = zz - era * 146097;
    const yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365);
    const doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100));
    const mp = Math.floor((5 * doy + 2) / 153);
    const d = doy - Math.floor((153 * mp + 2) / 5) + 1;
    const m = mp < 10 ? mp + 3 : mp - 9;
    return { a: yoe + era * 400 + (m <= 2 ? 1 : 0), m: m, d: d };
  }
  /** 0 = segunda-feira … 6 = domingo (01/01/1970 foi quinta-feira). */
  function diaSemana(z) { return (((z + 3) % 7) + 7) % 7; }
  function inicioSemana(z, base) { return z - ((diaSemana(z) - (base || 0) + 7) % 7); }
  function diasNoMes(a, m) { return m === 12 ? 31 : diaDe(a, m + 1, 1) - diaDe(a, m, 1); }
  function mod(a, n) { return ((a % n) + n) % n; }
  function p2(n) { return String(n).padStart(2, '0'); }
  function somarMeses(z, n) {
    const c = civil(z);
    const t = c.a * 12 + (c.m - 1) + n;
    const a = Math.floor(t / 12), m = mod(t, 12) + 1;
    return diaDe(a, m, Math.min(c.d, diasNoMes(a, m)));
  }

  const NOMES_DIA = ['segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado', 'domingo'];
  const NOMES_MES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

  function lerData(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return Number.isInteger(v) ? v : null;
    const s = String(v).trim();
    let m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
    if (m) return dataValida(+m[1], +m[2], +m[3]);
    m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
    if (m) return dataValida(+m[3], +m[2], +m[1]);
    return null;
  }
  function dataValida(a, m, d) {
    if (!(m >= 1 && m <= 12) || !(d >= 1 && d <= diasNoMes(a, m))) return null;
    return diaDe(a, m, d);
  }
  function fmtData(z) { const c = civil(z); return p2(c.d) + '/' + p2(c.m) + '/' + c.a; }
  function fmtDataCurta(z) { const c = civil(z); return p2(c.d) + '/' + p2(c.m); }
  function lerHora(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return Number.isInteger(v) && v >= 0 && v < DIA ? v : null;
    const m = /^(\d{1,2})[:hH](\d{2})$/.exec(String(v).trim());
    if (!m) return null;
    const h = +m[1], mi = +m[2];
    if (h > 23 || mi > 59) return null;
    return h * 60 + mi;
  }
  function fmtHora(min) { const x = mod(min, DIA); return p2(Math.floor(x / 60)) + ':' + p2(x % 60); }

  /**
   * Exibe uma quantidade em unidades de 1/7 de minuto como horas.
   * Arredondamento de exibição: meia unidade para cima, ao segundo.
   */
  function fmtHoras(u) {
    const neg = u < 0;
    const v = neg ? -u : u;
    const s = Math.floor((120 * v + 7) / 14);
    const h = Math.floor(s / 3600), mi = Math.floor((s % 3600) / 60), se = s % 60;
    return (neg ? '−' : '') + h + 'h' + p2(mi) + (se ? 'min' + p2(se) + 's' : '');
  }
  function fmtMinutos(min) { return fmtHoras(min * U); }

  function centavos(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return Math.round(v * 100);
    let s = String(v).replace(/[R$\s]/g, '');
    if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
    const n = Number(s);
    return Number.isFinite(n) ? Math.round(n * 100) : null;
  }
  function fmtReais(c) {
    if (c == null) return '—';
    const neg = c < 0, v = Math.abs(c);
    const int = String(Math.floor(v / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (neg ? '−' : '') + 'R$ ' + int + ',' + p2(v % 100);
  }

  /* =============================================================== feriados */

  function pascoa(a) {
    const A = a % 19, B = Math.floor(a / 100), C = a % 100, D = Math.floor(B / 4), E = B % 4;
    const F = Math.floor((B + 8) / 25), G = Math.floor((B - F + 1) / 3);
    const H = (19 * A + B - D - G + 15) % 30, I = Math.floor(C / 4), K = C % 4;
    const L = (32 + 2 * E + 2 * I - H - K) % 7, Mm = Math.floor((A + 11 * H + 22 * L) / 451);
    const mes = Math.floor((H + L - 7 * Mm + 114) / 31), dia = ((H + L - 7 * Mm + 114) % 31) + 1;
    return diaDe(a, mes, dia);
  }
  function feriadosNacionais(a) {
    const f = (m, d, nome, base) => ({ data: diaDe(a, m, d), nome: nome, esfera: 'nacional', base: base || null });
    return [
      f(1, 1, 'Confraternização Universal'), f(4, 21, 'Tiradentes'), f(5, 1, 'Dia do Trabalho'),
      f(9, 7, 'Independência do Brasil'), f(10, 12, 'Nossa Senhora Aparecida'), f(11, 2, 'Finados'),
      f(11, 15, 'Proclamação da República'), f(11, 20, 'Dia Nacional de Zumbi e da Consciência Negra', 'Lei 14.759/2023'),
      f(12, 25, 'Natal'),
    ];
  }
  /** Datas móveis. Nenhuma é feriado nacional: a Paixão depende de lei municipal (Lei 9.093/1995); Carnaval e Corpus Christi são pontos facultativos, salvo lei local. */
  function datasMoveis(a) {
    const p = pascoa(a);
    return { pascoa: p, paixao: p - 2, carnaval: p - 47, corpusChristi: p + 60 };
  }
  function feriadosEstaduais(uf, a) {
    if (uf === 'SP') return [{ data: diaDe(a, 7, 9), nome: 'Revolução Constitucionalista de 1932', esfera: 'estadual', base: null }];
    return [];
  }

  /* ========================================================= configuração */

  const CONFIG_PADRAO = Object.freeze({
    cenario: 'legal',            // 'legal' | '42' | '40'
    prazos: 'conservador',       // 'conservador' (LC 95/1998) | 'civil' (CC, art. 132, § 3º)
    transicao: 'semana',         // 'semana' (limite mais rigoroso na semana inteira) | 'diaria'
    medida: 'computadas',        // 'computadas' | 'relogio' (regras de teto)
    leitura8h24: 'coletiva',     // 'coletiva' (EC, art. 7º) | 'individual' (acordo de compensação)
    liminar: true,               // liminar na ADI 8.041 (STF, 12/11/2026, em vigor até o julgamento de mérito, 17/11/2026): D100 a D104
    art9: 'literal',             // 'literal' (XV desde 16/12/2026) | 'diferido'
    turnoDia: 'inicio',          // 'inicio' | 'civil' (rateio pelo dia civil)
    prorrogacaoReduzida: true,   // hora reduzida estendida à prorrogação (art. 73, § 5º)
    criterioMedia: 'A',          // 'A' | 'B' | 'C' (§ 2º); o A é o da Portaria MTE 2.041/2026, art. 4º, § 4º (D119); B e C ficam só como comparação
    janela28: false,             // D102 (janelas de 28 dias com a liminar): desligada desde a Portaria MTE 2.041/2026, que apura a média no mês-calendário (D119)
    semanaInicio: 0,             // 0 = segunda-feira
    sinalContrafactual: true,
  });

  /* D01: 16/12/2026 (42 h e dois repousos) e 16/12/2027 (40 h), confirmadas pela Portaria MTE 2.041/2026, art. 16 (D119);
     a contagem 'civil' fica só como comparação. */
  function datasVigencia(prazos) {
    const c = prazos === 'civil' ? 1 : 0;
    return {
      publicacao: diaDe(2026, 10, 16),
      xv: diaDe(2026, 12, 16) + c,
      teto42: diaDe(2026, 12, 16) + c,
      art3: diaDe(2026, 12, 16) + c,
      art9: diaDe(2027, 10, 16) + c,      // primeiro dia após o fim do prazo de aditamento
      art9Liminar: diaDe(2027, 4, 14) + c, // liminar na ADI 8.041: 180 dias da publicação (16/10/2026 a 13/04/2027)
      teto40: diaDe(2027, 12, 16) + c,
    };
  }

  const TIPOS_INSTRUMENTO = {
    compensacao_mensal: { nome: 'Acordo de compensação no mês', natureza: 'individual', base: 'CLT, art. 59, § 6º; Súmula 85, I, do TST' },
    banco_semestral: { nome: 'Banco de horas semestral', natureza: 'individual', base: 'CLT, art. 59, § 5º' },
    banco_anual: { nome: 'Banco de horas anual', natureza: 'coletivo', base: 'CLT, art. 59, § 2º' },
    media_par2: { nome: 'Regime de média de repousos', natureza: 'coletivo', base: 'CF, art. 7º, § 2º; Portaria MTE 2.041/2026, art. 4º, §§ 3º e 4º' },
    ampliacao_art7: { nome: 'Ampliação da duração diária na etapa de 42 h', natureza: 'coletivo', base: 'Emenda Constitucional 141/2026 (Fim da 6x1), art. 7º' },
    escala_12x36: { nome: 'Escala 12x36', natureza: 'individual', base: 'CLT, art. 59-A' },
    jornada_12h: { nome: 'Jornada de 12 h fora da 12x36', natureza: 'coletivo', base: 'CLT, art. 611-A, I; STF, Tema 1.046' },
    // D108: semanas acima do teto (até 42 h) com dias acima de 8 h, fechadas pela média em norma coletiva específica;
    // D119: a média se apura no mês-calendário (Portaria MTE 2.041/2026, arts. 2º e 3º)
    compensacao_media: { nome: 'Compensação pela média do mês em norma coletiva (semanas de até 42 h)', natureza: 'coletivo', base: 'CF, art. 7º, XIII; Portaria MTE 2.041/2026, arts. 2º e 3º' },
    turno_ininterrupto_8h: { nome: 'Turno ininterrupto de até 8 h', natureza: 'coletivo', base: 'CF, art. 7º, XIV; Súmula 423 do TST; Portaria MTE 2.041/2026, art. 7º' },
    reducao_intervalo: { nome: 'Redução do intervalo intrajornada', natureza: 'coletivo', base: 'CLT, art. 611-A, III' },
    reducao_intervalo_mte: { nome: 'Autorização ministerial para reduzir o intervalo', natureza: 'ato do Ministério do Trabalho', base: 'CLT, art. 71, § 3º' },
    intervalo_superior_2h: { nome: 'Intervalo superior a 2 h', natureza: 'individual', base: 'CLT, art. 71, caput' },
    // D113 e D119: atividade insalubre (CLT, art. 60; Portaria MTE 2.041/2026, art. 15): autorização da chefia de segurança e
    // saúde no trabalho da Inspeção do Trabalho (inciso III), ou norma coletiva que autorize expressamente a prorrogação (inciso II)
    licenca_art60: { nome: 'Autorização da Inspeção do Trabalho para prorrogação em atividade insalubre', natureza: 'ato do Ministério do Trabalho', base: 'CLT, art. 60; Portaria MTE 2.041/2026, art. 15, III' },
    prorrogacao_insalubre: { nome: 'Norma coletiva que autorize expressamente a prorrogação em atividade insalubre', natureza: 'coletivo', base: 'CLT, art. 611-A, XIII; Portaria MTE 2.041/2026, art. 15, II' },
    fracionamento_intervalo: { nome: 'Fracionamento do intervalo', natureza: 'coletivo', base: 'CLT, art. 71, § 5º' },
    feriado_comercio: { nome: 'Trabalho em feriados no comércio', natureza: 'coletivo', base: 'Lei 10.101/2000, art. 6º-A' },
    // D118: 12x36 com média do mês acima do limite semanal: compensação ou pagamento das horas, nos termos de norma coletiva
    excesso_12x36: { nome: 'Compensação ou pagamento das horas da 12x36 acima do limite do mês', natureza: 'coletivo', base: 'Decreto 13.173/2026, art. 3º; Portaria MTE 2.041/2026, art. 8º' },
  };
  const TIPOS_COMPENSACAO = ['compensacao_mensal', 'banco_semestral', 'banco_anual', 'compensacao_media'];

  const LIMITES_TIPO = {
    bancario: { diario: 6, semanal: 30, base: 'CLT, art. 224' },
    teleatendimento: { diario: 6, semanal: 36, base: 'NR-17, Anexo II (redação vigente a conferir)' },
    parcial: { diario: null, semanal: 30, base: 'CLT, art. 58-A' },
  };

  /* =========================================================== normalização */

  const MARCAS = new Set(['ferias', 'afastamento', 'falta', 'folga_comp', 'folga']);
  const FORA_DE_SERVICO = new Set(['fora', 'sem_escala', 'ferias', 'afastamento']);
  const AUSENCIA_CONTRAFACTUAL = new Set(['feriado', 'ferias', 'afastamento', 'falta', 'folga_comp']);

  function normalizar(entrada) {
    if (entrada && entrada.__normalizado) return entrada;
    const E = entrada || {};
    const erros = [];
    const err = (onde, msg) => erros.push({ onde: onde, msg: msg });

    const e0 = E.empresa || {};
    const empresa = {
      razaoSocial: e0.razaoSocial || '', municipio: e0.municipio || '', uf: String(e0.uf || '').toUpperCase(),
      atividade: e0.atividade || 'industria', ruralTipo: e0.ruralTipo || 'lavoura', porte: e0.porte || null,
    };
    const hz = E.horizonte || {};
    const horizonte = {
      inicio: lerData(hz.inicio) != null ? lerData(hz.inicio) : diaDe(2026, 12, 14),
      fim: lerData(hz.fim) != null ? lerData(hz.fim) : diaDe(2028, 12, 31),
    };

    const turnos = new Map();
    (E.turnos || []).forEach((t, i) => {
      const id = String(t.id == null ? '' : t.id).trim();
      if (!id) { err('turnos, linha ' + (i + 1), 'Turno sem identificador.'); return; }
      const ini = lerHora(t.inicio), fim = lerHora(t.fim);
      if (ini == null || fim == null) { err('turno ' + id, 'Horário de início ou de fim inválido (use hh:mm).'); return; }
      if (ini === fim) { err('turno ' + id, 'Início e fim iguais.'); return; }
      const duracao = fim > ini ? fim - ini : fim + DIA - ini;
      const pausas = [];
      for (const p of (t.pausas || t.intervalos || [])) {
        const pi = lerHora(p.inicio), pd = Number(p.duracao);
        if (pi == null || !(pd > 0) || !Number.isInteger(pd)) { err('turno ' + id, 'Intervalo com início ou duração inválidos.'); continue; }
        const off = mod(pi - ini, DIA);
        if (off <= 0 || off + pd >= duracao) { err('turno ' + id, 'Intervalo das ' + fmtHora(pi) + ' fora do turno.'); continue; }
        pausas.push({ offset: off, duracao: pd, inicio: pi, tipo: p.tipo === 'indenizado' ? 'indenizado' : 'usufruido' });
      }
      pausas.sort((a, b) => a.offset - b.offset);
      for (let j = 1; j < pausas.length; j++) {
        if (pausas[j].offset < pausas[j - 1].offset + pausas[j - 1].duracao) err('turno ' + id, 'Intervalos sobrepostos.');
      }
      turnos.set(id, { id: id, nome: t.nome || id, inicio: ini, fim: fim, duracao: duracao, pausas: pausas });
    });

    const escalas = new Map();
    (E.escalas || []).forEach((e, i) => {
      const id = String(e.id == null ? '' : e.id).trim();
      const dias = (e.dias || []).map((x) => (x == null || x === '' || x === '-' || String(x).toLowerCase() === 'folga') ? null : String(x).trim());
      if (!id || !dias.length) { err('escalas, linha ' + (i + 1), 'Escala sem identificador ou sem dias.'); return; }
      for (const x of dias) if (x && !turnos.has(x)) err('escala ' + id, 'Turno "' + x + '" não cadastrado.');
      const especial = e.especial === '12x36' ? '12x36' : null;
      escalas.set(id, {
        id: id, nome: e.nome || id, dias: dias, especial: especial,
        tipo: e.tipo || (dias.length % 7 === 0 ? 'semanal' : 'ciclo'),
        trabalhaFeriados: e.trabalhaFeriados != null ? !!e.trabalhaFeriados : especial === '12x36',
      });
    });

    const empregados = [];
    const idsEmp = new Set();
    (E.empregados || []).forEach((p, i) => {
      const id = String(p.id == null ? '' : p.id).trim();
      if (!id) { err('empregados, linha ' + (i + 1), 'Empregado sem identificador.'); return; }
      if (idsEmp.has(id)) { err('empregado ' + id, 'Identificador repetido.'); return; }
      idsEmp.add(id);
      let rems = p.remuneracoes;
      if (!rems && p.remuneracao != null) rems = [{ desde: null, valor: p.remuneracao }];
      rems = (rems || []).map((r) => ({ desde: lerData(r.desde) != null ? lerData(r.desde) : -1e9, valor: centavos(r.valor) }))
        .filter((r) => r.valor != null).sort((a, b) => a.desde - b.desde);
      const tipo = p.tipo || 'comum';
      const lim = LIMITES_TIPO[tipo] || {};
      empregados.push({
        id: id, nome: p.nome || '', setor: p.setor == null ? '' : String(p.setor), cargo: p.cargo || '',
        salario: centavos(p.salario), remuneracoes: rems,
        nivelSuperior: !!p.nivelSuperior, controleMantido: !!p.controleMantido, empregadoPublico: !!p.empregadoPublico, estatalConcorrencial: !!p.estatalConcorrencial,
        admissao: lerData(p.admissao) != null ? lerData(p.admissao) : -1e9,
        desligamento: lerData(p.desligamento),
        tipo: tipo,
        limiteDiario: p.limiteDiario != null ? Number(p.limiteDiario) : lim.diario != null ? lim.diario : null,
        limiteSemanal: p.limiteSemanal != null ? Number(p.limiteSemanal) : lim.semanal != null ? lim.semanal : null,
        baseLimite: lim.base || 'limite fixado em norma ou contrato',
        aprendiz8h: !!p.aprendiz8h, art386: !!p.art386, insalubre: !!p.insalubre, revezamento: !!p.revezamento,   // D113
        contratoPublico: p.contratoPublico ? { aditamento: lerData(p.contratoPublico.aditamento) } : null,
      });
    });

    const atribuicoes = [];
    (E.atribuicoes || []).forEach((a, i) => {
      const ini = lerData(a.inicio);
      const esc = escalas.get(String(a.escala));
      if (!idsEmp.has(String(a.empregado))) { err('atribuições, linha ' + (i + 1), 'Empregado "' + a.empregado + '" não cadastrado.'); return; }
      if (!esc) { err('atribuições, linha ' + (i + 1), 'Escala "' + a.escala + '" não cadastrada.'); return; }
      if (ini == null) { err('atribuições, linha ' + (i + 1), 'Data de início inválida.'); return; }
      let anc = lerData(a.ancora);
      if (anc == null) anc = esc.tipo === 'semanal' ? inicioSemana(ini, E.semanaInicio || 0) : ini;
      atribuicoes.push({ empregado: String(a.empregado), escala: esc.id, inicio: ini, fim: lerData(a.fim), ancora: anc });
    });

    const excecoes = [];
    (E.excecoes || []).forEach((x, i) => {
      const tipo = x.tipo;
      const okTipo = MARCAS.has(tipo) || tipo === 'troca' || tipo === 'extra' || tipo === 'feriado_trabalhado';
      if (!okTipo) { err('exceções, linha ' + (i + 1), 'Tipo de exceção desconhecido: ' + tipo); return; }
      if (!idsEmp.has(String(x.empregado))) { err('exceções, linha ' + (i + 1), 'Empregado "' + x.empregado + '" não cadastrado.'); return; }
      if ((tipo === 'troca' || tipo === 'extra') && !turnos.has(String(x.turno))) { err('exceções, linha ' + (i + 1), 'Turno "' + x.turno + '" não cadastrado.'); return; }
      const d0 = lerData(x.data != null ? x.data : x.inicio);
      const d1 = x.fim != null ? lerData(x.fim) : d0;
      if (d0 == null || d1 == null || d1 < d0) { err('exceções, linha ' + (i + 1), 'Data inválida.'); return; }
      for (let d = d0; d <= d1; d++) excecoes.push({ empregado: String(x.empregado), data: d, tipo: tipo, turno: x.turno != null ? String(x.turno) : null });
    });

    let feriados;
    if (Array.isArray(E.feriados)) {
      feriados = E.feriados.map((f) => ({ data: lerData(f.data), nome: f.nome || 'Feriado', esfera: f.esfera || 'municipal', base: f.base || null })).filter((f) => f.data != null);
    } else {
      feriados = [];
      const a0 = civil(horizonte.inicio).a - 1, a1 = civil(horizonte.fim).a + 1;
      for (let a = a0; a <= a1; a++) { feriados.push(...feriadosNacionais(a)); feriados.push(...feriadosEstaduais(empresa.uf, a)); }
      for (const f of (E.feriadosAdicionais || [])) { const d = lerData(f.data); if (d != null) feriados.push({ data: d, nome: f.nome || 'Feriado', esfera: f.esfera || 'municipal', base: f.base || null }); }
    }

    const instrumentos = [];
    (E.instrumentos || []).forEach((x, i) => {
      const meta = TIPOS_INSTRUMENTO[x.tipo];
      if (!meta) { err('instrumentos, linha ' + (i + 1), 'Tipo de instrumento desconhecido: ' + x.tipo); return; }
      const ab = x.abrangencia || { todos: true };
      instrumentos.push({
        id: x.id || x.tipo + '-' + (i + 1), tipo: x.tipo, nome: x.nome || meta.nome,
        natureza: x.natureza || meta.natureza,
        celebracao: lerData(x.celebracao),
        vigenciaInicio: lerData(x.vigenciaInicio) != null ? lerData(x.vigenciaInicio) : -1e9,
        vigenciaFim: lerData(x.vigenciaFim),
        compativel: x.compativel == null ? null : !!x.compativel,
        compativel40: x.compativel40 == null ? null : !!x.compativel40,
        abrangencia: { todos: !!ab.todos, setores: (ab.setores || []).map(String), empregados: (ab.empregados || []).map(String) },
        parametros: x.parametros || {},
      });
    });

    const setores = new Map();
    (E.setores || []).forEach((s) => {
      const id = String(s.id);
      const nec = (s.necessidade || []).map((n) => ({ dias: n.dias || [0, 1, 2, 3, 4, 5, 6], inicio: lerHora(n.inicio), fim: lerHora(n.fim), pessoas: Number(n.pessoas) || 0 }))
        .filter((n) => n.inicio != null && n.fim != null);
      const exc = (s.excecoes || []).map((n) => ({ data: lerData(n.data), inicio: lerHora(n.inicio), fim: lerHora(n.fim), pessoas: Number(n.pessoas) || 0 }))
        .filter((n) => n.data != null && n.inicio != null && n.fim != null);
      setores.set(id, { id: id, nome: s.nome || id, necessidade: nec, excecoes: exc });
    });

    const tetoRGPS = Object.assign({ 2026: 847555 }, {});
    for (const k of Object.keys(E.tetoRGPS || {})) { const v = centavos(E.tetoRGPS[k]); if (v != null) tetoRGPS[k] = v; }

    return {
      __normalizado: true, erros: erros, empresa: empresa, horizonte: horizonte, turnos: turnos, escalas: escalas,
      empregados: empregados, atribuicoes: atribuicoes, excecoes: excecoes, feriados: feriados,
      instrumentos: instrumentos, setores: setores, tetoRGPS: tetoRGPS, semanaInicio: E.semanaInicio || 0,
    };
  }

  /* ============================================================ contexto */

  function criarContexto(dados, cfg, D) {
    const si = cfg.semanaInicio;
    const h0 = dados.horizonte.inicio, h1 = dados.horizonte.fim;
    const c0 = civil(h0), c1 = civil(h1);
    const mesIni = diaDe(c0.a, c0.m, 1), mesFim = diaDe(c1.a, c1.m, diasNoMes(c1.a, c1.m));
    const semIni = inicioSemana(h0, si), semFim = inicioSemana(h1, si);
    const janela = { a: Math.min(mesIni, semIni) - 35, b: Math.max(mesFim, semFim + 6) + 35 };
    const feriados = new Map();
    for (const f of dados.feriados) if (!feriados.has(f.data)) feriados.set(f.data, f);
    const atrib = new Map();
    for (const x of dados.atribuicoes) { if (!atrib.has(x.empregado)) atrib.set(x.empregado, []); atrib.get(x.empregado).push(x); }
    for (const l of atrib.values()) l.sort((p, q) => p.inicio - q.inicio);
    const exc = new Map();
    for (const x of dados.excecoes) {
      if (!exc.has(x.empregado)) exc.set(x.empregado, new Map());
      const m = exc.get(x.empregado);
      if (!m.has(x.data)) m.set(x.data, []);
      m.get(x.data).push(x);
    }
    return {
      dados: dados, cfg: cfg, D: D, si: si, h0: h0, h1: h1, mesIni: mesIni, mesFim: mesFim, semIni: semIni, semFim: semFim,
      janela: janela, feriados: feriados, atrib: atrib, exc: exc, turnos: dados.turnos, escalas: dados.escalas,
      rural: dados.empresa.atividade === 'rural' ? dados.empresa.ruralTipo : null,
      comercio: dados.empresa.atividade === 'comercio', cacheCiclo: new Map(),
    };
  }

  /* ================================================== expansão da escala */

  function expandir(emp, ctx) {
    const A = ctx.janela.a, B = ctx.janela.b;
    const atr = ctx.atrib.get(emp.id) || [];
    const exc = ctx.exc.get(emp.id) || new Map();
    const dias = new Array(B - A + 1);
    for (let d = A; d <= B; d++) {
      let at = null;
      for (let j = atr.length - 1; j >= 0; j--) {
        const x = atr[j];
        if (x.inicio <= d && (x.fim == null || d <= x.fim)) { at = x; break; }
      }
      const esc = at ? ctx.escalas.get(at.escala) : null;
      const base = esc ? esc.dias[mod(d - at.ancora, esc.dias.length)] : null;
      const servico = d >= emp.admissao && (emp.desligamento == null || d <= emp.desligamento);
      const lista = exc.get(d) || [];
      let marca = null, troca = null, ferTrab = false;
      const extras = [];
      for (const e of lista) {
        if (MARCAS.has(e.tipo)) marca = e.tipo;
        else if (e.tipo === 'troca') troca = e.turno;
        else if (e.tipo === 'extra') extras.push(e.turno);
        else if (e.tipo === 'feriado_trabalhado') ferTrab = true;
      }
      const fer = ctx.feriados.get(d) || null;
      const turnos = [];
      let estado;
      if (!servico) estado = 'fora';
      else if (!esc && !troca && !extras.length) estado = 'sem_escala';
      else if (marca && marca !== 'folga') estado = marca;
      else {
        let t = marca === 'folga' ? null : base;
        if (troca) t = troca;
        if (t && fer && !troca && !ferTrab && !(esc && esc.trabalhaFeriados)) { estado = 'feriado'; t = null; }
        if (t) turnos.push(t);
        for (const x of extras) turnos.push(x);
        if (!estado) estado = turnos.length ? 'trabalho' : 'folga';
      }
      dias[d - A] = {
        d: d, servico: servico, estado: estado, marca: marca, fer: fer, base: base,
        escala: esc ? esc.id : null, especial: esc ? esc.especial : null, turnos: turnos, ciclo: esc ? esc.dias.length : 0,
        feriadoTrabalhado: !!(fer && turnos.length),
      };
    }
    return dias;
  }

  /* ================================================== medição dos turnos */

  function instanciar(t, d, especial) {
    const ini = d * DIA + t.inicio;
    return {
      dia: d, turno: t.id, ini: ini, fim: ini + t.duracao, especial: especial || null,
      pausas: t.pausas.map((p) => ({ ini: ini + p.offset, fim: ini + p.offset + p.duracao, tipo: p.tipo })),
    };
  }
  function segmentosTrabalho(x) {
    const segs = [];
    let c = x.ini;
    for (const p of x.pausas) {
      if (p.tipo !== 'usufruido') continue;
      if (p.ini > c) segs.push([c, p.ini]);
      c = Math.max(c, p.fim);
    }
    if (x.fim > c) segs.push([c, x.fim]);
    return segs;
  }
  function sobrepor(a, b, c, d) { return Math.max(0, Math.min(b, d) - Math.max(a, c)); }
  function janelaNoturna(k, rural) {
    if (rural === 'lavoura') return [k * DIA + 1260, k * DIA + 1740];
    if (rural === 'pecuaria') return [k * DIA + 1200, k * DIA + 1680];
    return [k * DIA + 1320, k * DIA + 1740];
  }
  function minutosNoturnos(a, b, rural) {
    const i0 = rural === 'lavoura' ? 1260 : rural === 'pecuaria' ? 1200 : 1320;
    const i1 = rural === 'pecuaria' ? 1680 : 1740;
    let n = 0;
    const kf = Math.floor(b / DIA);
    for (let k = Math.floor(a / DIA) - 1; k <= kf; k++) {
      const ws = k * DIA + i0, we = k * DIA + i1;
      const x = (b < we ? b : we) - (a > ws ? a : ws);
      if (x > 0) n += x;
    }
    return n;
  }

  /**
   * Mede um turno: minutos de relógio, unidades computadas (1/7 min) e minutos noturnos,
   * por dia civil. Hora reduzida das 22h às 5h (art. 73, § 1º); prorrogação de jornada
   * integralmente noturna (Súmula 60, II; art. 73, § 5º) conforme configuração; na 12x36,
   * prorrogação compensada (art. 59-A, parágrafo único). Rural: sem hora reduzida (Lei 5.889/1973).
   */
  function medir(x, ctx) {
    const rural = ctx.rural;
    let prorrog = null;
    for (let k = Math.floor(x.ini / DIA) - 1; k <= Math.floor(x.fim / DIA); k++) {
      const ws = k * DIA + 1320, we = k * DIA + 1740;
      if (x.ini <= ws && x.fim >= we) { if (x.fim > we) prorrog = [we, x.fim]; break; }
    }
    const reduz = !rural && !!prorrog && ctx.cfg.prorrogacaoReduzida && x.especial !== '12x36';
    const adic = !!prorrog && x.especial !== '12x36';
    const segs = segmentosTrabalho(x);
    const porDia = [];
    let rel = 0, comp = 0, noct = 0, noctUrb = 0;
    for (const s of segs) {
      let a = s[0];
      while (a < s[1]) {
        const b = Math.min(s[1], (Math.floor(a / DIA) + 1) * DIA);
        const r = b - a;
        const nUrb = minutosNoturnos(a, b, null);
        const n = rural ? minutosNoturnos(a, b, rural) : nUrb;
        const p = prorrog ? sobrepor(a, b, prorrog[0], prorrog[1]) : 0;
        const red = rural ? 0 : nUrb + (reduz ? p : 0);
        const c = U * r + red;
        const na = n + (adic && !rural ? p : 0);
        const dia = Math.floor(a / DIA);
        let q = porDia.length ? porDia[porDia.length - 1] : null;
        if (!q || q.dia !== dia) { q = { dia: dia, rel: 0, comp: 0, noct: 0 }; porDia.push(q); }
        q.rel += r; q.comp += c; q.noct += na;
        rel += r; comp += c; noct += na; noctUrb += nUrb;
        a = b;
      }
    }
    x.segmentos = segs; x.porDia = porDia; x.rel = rel; x.comp = comp; x.noct = noct; x.noctUrb = noctUrb;
    x.prorrogacao = prorrog ? prorrog[1] - prorrog[0] : 0;
    return x;
  }

  /* ============================================================ repousos */

  /**
   * Fórmula padrão (seção 4.4): para cada intervalo livre G entre o fim de um turno e o início
   * do seguinte, com k folgas programadas entre os dias de início, r = min(k, ⌊(G − 11 h) ÷ 24 h⌋)
   * se G ≥ 35 h (Súmula 110 do TST). Os r repousos vão às folgas em ordem cronológica.
   * Também calcula o método de blocos (versão anterior).
   */
  function calcularRepousos(insts, folga, janela) {
    const rep = new Set(), semRep = [], blocos = new Set(), intervalos = [];
    // Antes do primeiro turno e depois do último não há jornada que limite o descanso: as folgas programadas contam como repouso.
    if (janela) {
      const prim = insts.length ? insts[0].dia : janela.b + 1;
      for (let x = janela.a; x < prim; x++) if (folga(x)) rep.add(x);
      if (insts.length) for (let x = insts[insts.length - 1].dia + 1; x <= janela.b; x++) if (folga(x)) rep.add(x);
    }
    for (let i = 0; i + 1 < insts.length; i++) {
      const s1 = insts[i], s2 = insts[i + 1];
      const G = s2.ini - s1.fim;
      const fol = [];
      for (let x = s1.dia + 1; x < s2.dia; x++) if (folga(x)) fol.push(x);
      const k = fol.length;
      const r = G >= 35 * 60 ? Math.min(k, Math.floor((G - 660) / 1440)) : 0;
      for (let j = 0; j < r; j++) rep.add(fol[j]);
      for (let j = r; j < k; j++) semRep.push({ dia: fol[j], G: G });
      if (G >= 35 * 60) {
        const nb = Math.floor((G - 660) / 1440);
        for (let j = 0; j < nb; j++) blocos.add(Math.floor((s1.fim + 660 + j * 1440) / DIA));
      }
      intervalos.push({ de: s1, ate: s2, G: G, k: k, r: r });
    }
    return { rep: rep, semRep: semRep, blocos: blocos, intervalos: intervalos };
  }

  /* ======================================================= instrumentos */

  function situacaoInstrumento(i, d, D) {
    if (d < i.vigenciaInicio || (i.vigenciaFim != null && d > i.vigenciaFim)) return null;
    // Regime que a Constituição ou a lei reservam à negociação coletiva (média de repousos do § 2º, ampliação do art. 7º,
    // turno ininterrupto de até 8 h, banco anual etc.) não produz efeito quando cadastrado como acordo individual.
    const meta = TIPOS_INSTRUMENTO[i.tipo];
    if (meta && meta.natureza === 'coletivo' && i.natureza !== 'coletivo') {
      return { ok: false, nota: 'cadastrado como ' + (i.natureza || 'acordo individual') + ', mas o regime depende de convenção ou acordo coletivo (' + meta.base + ')' };
    }
    if (i.natureza === 'coletivo' && d >= D.art3) {
      if (i.compativel === false) return { ok: false, nota: 'cláusula sem efeito desde ' + fmtData(D.art3) + ' (Emenda Constitucional 141/2026 – Fim da 6x1, art. 3º)' };
      if (d >= D.teto40 && i.compativel40 === false) return { ok: false, nota: 'cláusula incompatível com o teto de 40 h' };
      if (i.celebracao != null && i.celebracao < D.publicacao && i.compativel !== true) {
        return { ok: false, nota: 'instrumento anterior à Emenda Constitucional 141/2026 (Fim da 6x1) sem verificação de compatibilidade (art. 3º)' };
      }
    }
    return { ok: true, nota: null };
  }
  function abrange(i, emp) {
    const a = i.abrangencia;
    return a.todos || a.empregados.indexOf(emp.id) >= 0 || (emp.setor && a.setores.indexOf(emp.setor) >= 0);
  }
  function buscarInstrumento(ctx, emp, tipos, d, filtro) {
    let melhor = null;
    for (const i of ctx.dados.instrumentos) {
      if (tipos.indexOf(i.tipo) < 0 || !abrange(i, emp)) continue;
      if (filtro && !filtro(i)) continue;
      const s = situacaoInstrumento(i, d, ctx.D);
      if (!s) continue;
      if (s.ok) return { instr: i, ok: true, nota: null };
      if (!melhor) melhor = { instr: i, ok: false, nota: s.nota };
    }
    return melhor;
  }
  function textoInstrumento(tipos) {
    return tipos.map((t) => TIPOS_INSTRUMENTO[t].nome.toLowerCase() + ' (' + TIPOS_INSTRUMENTO[t].base + ')').join(' ou ');
  }

  /* ================================================== status e achados */

  function peso(a) {
    switch (a.status) {
      case 'nao_cumpre': return 5;
      case 'condicao': return a.atendida ? 3 : 4;
      case 'cumpre': return 2;
      case 'info': return 1;
      default: return 0;
    }
  }
  function pior(lista) {
    let p = null;
    for (const a of lista) if (!p || peso(a) > peso(p)) p = a;
    return p;
  }
  function condicao(tipos, ctx, emp, d) {
    const b = buscarInstrumento(ctx, emp, tipos, d);
    return {
      status: 'condicao', instrumento: tipos[0], exige: textoInstrumento(tipos), atendida: !!(b && b.ok),
      nota: b ? (b.ok ? 'cadastrado: ' + b.instr.nome : b.nota) : 'não cadastrado',
    };
  }

  /* ========================================================= tetos */

  function criarTetos(emp, ctx) {
    const cfg = ctx.cfg, D = ctx.D, si = ctx.si;
    const contrato = emp.contratoPublico;
    const lim9 = cfg.liminar !== false;
    const apl9 = contrato ? (lim9 ? (contrato.aditamento != null ? Math.min(contrato.aditamento, D.art9Liminar) : D.art9Liminar) : (contrato.aditamento != null ? contrato.aditamento : D.art9)) : null;
    function teto(d) {
      if (cfg.cenario === '42') return 42;
      if (cfg.cenario === '40') return 40;
      if (contrato && d < apl9) return 44;
      return d < D.teto42 ? 44 : d < D.teto40 ? 42 : 40;
    }
    function xv(d) {
      if (d < D.xv) return false;
      if (contrato && cfg.art9 === 'diferido' && d < apl9) return false;
      return true;
    }
    function tetoEf(d) {
      if (cfg.transicao !== 'semana') return teto(d);
      const w = inicioSemana(d, si);
      let m = 99;
      for (let k = 0; k < 7; k++) m = Math.min(m, teto(w + k));
      return m;
    }
    /** Limite diário (unidades) para compensação: teto ÷ 7; sem norma do art. 7º nem regime do § 2º, e na leitura padrão de J1, limitado a 40 h ÷ 7 quando já vigoram dois repousos. */
    function baseDia(d, comNorma) {
      const t = tetoEf(d);
      if (comNorma || cfg.leitura8h24 === 'individual' || !xv(d)) return t * 60;
      return Math.min(t, 40) * 60;
    }
    return { teto: teto, xv: xv, tetoEf: tetoEf, baseDia: baseDia, apl9: apl9 };
  }

  /* ========================================================= art. 8º */

  function remuneracaoEm(emp, d) {
    let v = null;
    for (const r of emp.remuneracoes) if (r.desde <= d) v = r.valor;
    return v;
  }
  function art8(emp, d, ctx) {
    const ano = civil(d).a;
    if (!emp.nivelSuperior) return { enquadrado: false, motivo: 'sem diploma de nível superior' };
    if (emp.empregadoPublico && !(emp.estatalConcorrencial && !(ctx.cfg && ctx.cfg.liminar === false))) return { enquadrado: false, motivo: 'empregado público (art. 8º, § 1º)' };
    const rem = remuneracaoEm(emp, d);
    if (rem == null) return { enquadrado: false, motivo: 'remuneração não informada' };
    const teto = ctx.dados.tetoRGPS[ano];
    if (teto == null) return { enquadrado: false, motivo: 'teto do RGPS de ' + ano + ' não informado' };
    if (2 * rem < 5 * teto) return { enquadrado: false, motivo: 'remuneração de ' + fmtReais(rem) + ' abaixo de 2,5 × ' + fmtReais(teto) };
    if (emp.controleMantido) return { enquadrado: false, motivo: 'controle mantido por liberalidade ou norma coletiva (art. 8º, caput, parte final)' };
    return { enquadrado: true, motivo: 'diploma de nível superior e remuneração de ' + fmtReais(rem) + ' ≥ 2,5 × ' + fmtReais(teto) };
  }

  /* ===================================================== média do ciclo 12x36 */

  function mediaCiclo(escId, ctx) {
    const chave = escId + '|' + ctx.cfg.medida + '|' + ctx.cfg.prorrogacaoReduzida;
    if (ctx.cacheCiclo.has(chave)) return ctx.cacheCiclo.get(chave);
    const esc = ctx.escalas.get(escId);
    let tot = 0;
    esc.dias.forEach((tid, i) => {
      if (!tid) return;
      const x = medir(instanciar(ctx.turnos.get(tid), 100000 + i, esc.especial), ctx);
      tot += ctx.cfg.medida === 'relogio' ? x.rel * U : x.comp;
    });
    const r = { totalCiclo: tot, n: esc.dias.length };
    ctx.cacheCiclo.set(chave, r);
    return r;
  }

  /* ================================================ avaliação do empregado */

  function avaliarEmpregado(emp, ctx) {
    const cfg = ctx.cfg, D = ctx.D, si = ctx.si;
    const A = ctx.janela.a, N = ctx.janela.b - A + 1;
    const dias = expandir(emp, ctx);
    const reg = (d) => dias[d - A];
    const T0 = criarTetos(emp, ctx);
    // tetos e vigência do inciso XV pré-calculados por dia da janela
    const aTeto = new Int8Array(N), aTetoEf = new Int8Array(N), aXv = new Int8Array(N);
    for (let i = 0; i < N; i++) { aTeto[i] = T0.teto(A + i); aXv[i] = T0.xv(A + i) ? 1 : 0; }
    for (let i = 0; i < N; i++) {
      if (cfg.transicao !== 'semana') { aTetoEf[i] = aTeto[i]; continue; }
      const w = inicioSemana(A + i, si) - A;
      let m = 99;
      for (let k = 0; k < 7; k++) { const j = w + k; m = Math.min(m, j >= 0 && j < N ? aTeto[j] : T0.teto(A + j)); }
      aTetoEf[i] = m;
    }
    const T = {
      teto: (d) => { const i = d - A; return i >= 0 && i < N ? aTeto[i] : T0.teto(d); },
      xv: (d) => { const i = d - A; return i >= 0 && i < N ? aXv[i] === 1 : T0.xv(d); },
      tetoEf: (d) => { const i = d - A; return i >= 0 && i < N ? aTetoEf[i] : T0.tetoEf(d); },
      baseDia: (d, comNorma) => {
        const i = d - A;
        if (i < 0 || i >= N) return T0.baseDia(d, comNorma);
        const t = aTetoEf[i];
        if (comNorma || cfg.leitura8h24 === 'individual' || aXv[i] !== 1) return t * 60;
        return Math.min(t, 40) * 60;
      },
    };
    const medidaRel = cfg.medida === 'relogio';
    const art62 = emp.tipo === 'art62';

    const insts = [];
    for (const r of dias) for (const tid of r.turnos) {
      const t = ctx.turnos.get(tid);
      if (t) insts.push(medir(instanciar(t, r.d, r.especial), ctx));
    }
    insts.sort((p, q) => p.ini - q.ini || p.fim - q.fim);

    const rel = new Array(N).fill(0), comp = new Array(N).fill(0), noct = new Array(N).fill(0);
    const civ = new Array(N).fill(0), nIni = new Array(N).fill(0);
    for (const x of insts) {
      nIni[x.dia - A]++;
      for (const p of x.porDia) {
        const ic = p.dia - A;
        if (ic >= 0 && ic < N) civ[ic] += p.rel;
        const j = (cfg.turnoDia === 'civil' ? p.dia : x.dia) - A;
        if (j >= 0 && j < N) { rel[j] += p.rel; comp[j] += p.comp; noct[j] += p.noct; }
      }
    }
    const med = (i) => medidaRel ? rel[i] * U : comp[i];
    const medAlt = (i) => medidaRel ? comp[i] : rel[i] * U;

    const folga = (d) => { const r = reg(d); return !!r && r.estado === 'folga'; };
    const RP = calcularRepousos(insts, folga, ctx.janela);
    const repCal = new Set();
    for (const r of dias) if (r.estado === 'folga' && civ[r.d - A] === 0) repCal.add(r.d);

    const dependentes = new Set();
    if (cfg.sinalContrafactual) {
      const cf = insts.slice();
      let add = 0;
      for (const r of dias) {
        if (r.base && AUSENCIA_CONTRAFACTUAL.has(r.estado)) {
          const t = ctx.turnos.get(r.base);
          if (t) { cf.push(instanciar(t, r.d, r.especial)); add++; }
        }
      }
      if (add) {
        cf.sort((p, q) => p.ini - q.ini || p.fim - q.fim);
        const rcf = calcularRepousos(cf, folga, ctx.janela);
        for (const d of RP.rep) if (!rcf.rep.has(d)) dependentes.add(d);
      }
    }
    const semRep = new Set(RP.semRep.map((x) => x.dia));

    const trabalhou = (d) => {
      const i = d - A;
      if (i < 0 || i >= N) return false;
      return cfg.turnoDia === 'civil' ? civ[i] > 0 : nIni[i] > 0;
    };
    const emServico = (r) => !FORA_DE_SERVICO.has(r.estado);
    const art8Cache = new Map();
    const art8Dia = (d) => {
      const c = civil(d), k = c.a * 12 + c.m;
      if (!art8Cache.has(k)) art8Cache.set(k, art8(emp, diaDe(c.a, c.m, 1), ctx));
      return art8Cache.get(k);
    };
    const dispCache = new Int8Array(N);
    const dispensado = (d) => {
      if (art62) return true;
      const i = d - A;
      if (i < 0 || i >= N) return art8Dia(d).enquadrado;
      if (!dispCache[i]) dispCache[i] = art8Dia(d).enquadrado ? 1 : 2;
      return dispCache[i] === 1;
    };

    const achados = [];
    const push = (a) => { achados.push(a); return a; };

    /* ---------- sequências de dias trabalhados (R3) */
    const corridas = [];
    {
      let ini = null;
      for (let d = A; d <= ctx.janela.b + 1; d++) {
        if (d <= ctx.janela.b && trabalhou(d)) { if (ini == null) ini = d; }
        else if (ini != null) { corridas.push({ ini: ini, fim: d - 1, n: d - ini }); ini = null; }
      }
    }

    /**
     * Média do mês-calendário que contém o dia d (D119; Portaria MTE 2.041/2026, art. 3º: "o limite médio da duração semanal e
     * mensal do trabalho será aferido no mês-calendário"): horas do mês, na medida das regras de teto, contra o limite semanal
     * dividido por sete em cada dia em serviço, a mesma conta de J4 e J6. Antes (D108), a média se tomava no ciclo da escala.
     */
    function mediaMes(d) {
      const c = civil(d), ini = diaDe(c.a, c.m, 1), fim = ini + diasNoMes(c.a, c.m) - 1;
      let tot = 0, lim = 0, sv = 0;
      for (let x = Math.max(ini, A); x <= Math.min(fim, ctx.janela.b); x++) {
        if (emServico(dias[x - A])) { sv++; lim += T.tetoEf(x) * 60; }
        tot += med(x - A);
      }
      return { ok: tot <= lim + 1e-6, tot: tot, lim: lim, semanal: sv ? tot * 7 / sv : 0, rot: NOMES_MES[c.m - 1] + '/' + c.a };
    }

    /* ---------- semanas */
    const semanas = [];
    const instsSemana = new Map(), livresSemana = new Map();
    for (const x of insts) { const w = inicioSemana(x.dia, si); if (!instsSemana.has(w)) instsSemana.set(w, []); instsSemana.get(w).push(x); }
    for (const g of RP.intervalos) { const w = inicioSemana(g.ate.dia, si); if (!livresSemana.has(w)) livresSemana.set(w, []); livresSemana.get(w).push(g); }
    for (let ws = ctx.semIni; ws <= ctx.semFim; ws += 7) {
      const we = ws + 6;
      let dServ = 0, tRel = 0, tComp = 0, rp = 0, rc = 0, rb = 0, nFer = 0;
      const repDias = [];
      for (let k = 0; k < 7; k++) {
        const d = ws + k, i = d - A, r = dias[i];
        if (emServico(r)) dServ++;
        if (r.estado === 'feriado') nFer++;
        tRel += rel[i]; tComp += comp[i];
        if (RP.rep.has(d)) { rp++; repDias.push(d); }
        if (repCal.has(d)) rc++;
        if (RP.blocos.has(d)) rb++;
      }
      const tw = [];
      for (let k = 0; k < 7; k++) tw.push(T.teto(ws + k));
      const limU = cfg.transicao === 'semana' ? Math.min.apply(null, tw) * HORA : tw.reduce((s, x) => s + x, 0) * 60;
      let xvSem = false;
      if (cfg.transicao === 'semana') { for (let k = 0; k < 7; k++) if (T.xv(ws + k)) xvSem = true; }
      else xvSem = T.xv(ws);
      const totU = medidaRel ? tRel * U : tComp;
      const totAlt = medidaRel ? tComp : tRel * U;
      const sem = { ini: ws, fim: we, dServ: dServ, rel: tRel, comp: tComp, total: medidaRel ? tRel * U : tComp, feriados: nFer, repousos: rp, repCal: rc, repBlocos: rb, repDias: repDias, limite: limU, xv: xvSem };
      semanas.push(sem);
      const per = { tipo: 'semana', ini: ws, fim: we };
      const rotSem = fmtDataCurta(ws) + ' a ' + fmtData(we);

      /* R1 — dois repousos na semana */
      {
        const req = xvSem ? 2 : 1;
        // Semana parcial: os dias fora de serviço (férias, afastamento, antes da admissão ou depois do desligamento) contam como dias sem trabalho.
        const exig = dServ === 0 ? null : Math.max(0, req - (7 - dServ));
        sem.exigido = exig;
        const metodos = { padrao: rp, calendario: rc, blocos: rb };
        const diverge = rc !== rp || rb !== rp;
        const base = xvSem ? 'CF, art. 7º, XV (Emenda Constitucional 141/2026 – Fim da 6x1); Lei 605/1949, art. 1º' : 'CF, art. 7º, XV (redação anterior); Lei 605/1949, art. 1º';
        const conta = 'Repousos pela fórmula r = min(k, ⌊(G − 11 h) ÷ 24 h⌋)' + (repDias.length ? ': ' + repDias.map(fmtDataCurta).join(', ') : ': nenhum') +
          '. Calendário: ' + rc + '; blocos: ' + rb + '.' + (dServ < 7 && dServ > 0 ? ' Semana parcial: ' + dServ + ' dias em serviço e ' + (7 - dServ) + ' fora de serviço; exigência max(0, ' + req + ' − ' + (7 - dServ) + ') = ' + exig + '.' : '');
        if (exig == null) push({ regra: 'R1', periodo: per, status: 'na', porque: 'Semana inteira fora de serviço (férias, afastamento, sem escala ou fora do contrato).', base: base, conta: conta, valores: metodos });
        else if (rp >= exig) push({ regra: 'R1', periodo: per, status: 'cumpre', porque: rp + ' repouso(s) na semana de ' + rotSem + '; mínimo ' + exig + '.', base: base, conta: conta, valores: metodos, divergenciaMetodo: diverge });
        else push({ regra: 'R1', periodo: per, status: 'nao_cumpre', porque: rp + ' repouso(s) na semana de ' + rotSem + '; mínimo ' + exig + (xvSem ? ' desde a vigência do inciso XV.' : '.'), base: base, conta: conta, valores: metodos, divergenciaMetodo: diverge });
      }

      /* J3 — teto semanal */
      {
        const base = 'Emenda Constitucional 141/2026 (Fim da 6x1), art. 6º; CF, art. 7º, XIII';
        const so12 = (() => { let tem = false; for (let k = 0; k < 7; k++) { const r = dias[ws + k - A]; if (r.turnos.length) { if (r.especial !== '12x36') return false; tem = true; } } return tem; })();
        const conta = 'Horas da semana: ' + fmtHoras(totU) + (medidaRel ? ' de relógio' : ' computadas') + ' (' + fmtHoras(totAlt) + (medidaRel ? ' computadas' : ' de relógio') + '); limite ' + fmtHoras(limU) + '.';
        const valores = { total: totU, alternativa: totAlt, limite: limU, excedente: Math.max(0, totU - limU) };
        let disp = true; for (let k = 0; k < 7; k++) if (!dispensado(ws + k)) disp = false;
        if (disp && dServ > 0) push({ regra: 'J3', periodo: per, status: 'na', porque: art62 ? 'Empregado excluído do controle de jornada (CLT, art. 62).' : 'Empregado enquadrado no art. 8º da Emenda Constitucional 141/2026 (Fim da 6x1).', base: base, conta: conta, valores: valores });
        else if (so12) push({ regra: 'J3', periodo: per, status: 'na', porque: 'Escala 12x36: avaliada em J6.', base: base, conta: conta, valores: valores });
        else if (totU <= limU) push({ regra: 'J3', periodo: per, status: 'cumpre', porque: fmtHoras(totU) + ' na semana; teto de ' + fmtHoras(limU) + '.', base: base, conta: conta, valores: valores });
        else {
          const b = buscarInstrumento(ctx, emp, TIPOS_COMPENSACAO, ws);
          if (b && b.ok) push({ regra: 'J3', periodo: per, status: 'condicao', atendida: true, exige: textoInstrumento(TIPOS_COMPENSACAO), nota: 'cadastrado: ' + b.instr.nome,
            porque: 'Excedente de ' + fmtHoras(totU - limU) + ' sobre o teto, a ser absorvido no regime de compensação cadastrado (ver J4 ou J5).', base: base, conta: conta, valores: valores });
          else push({ regra: 'J3', periodo: per, status: 'nao_cumpre', porque: 'Excedente de ' + fmtHoras(totU - limU) + ' sobre o teto de ' + fmtHoras(limU) + ', sem regime de compensação cadastrado: o excedente é hora extra.', base: base, conta: conta, valores: valores });
        }
      }

      /* J1 e J2 — limites diários; R14 — jornadas especiais; R9 — menores e aprendizes */
      {
        const j1 = [], j2 = [], r14 = [], r9 = [];
        // Sem norma coletiva, a semana de dois repousos com mais de 40 h só se distribui pela liminar (dias de até 8h24, abaixo);
        // dias acima de 8h24 seguem a leitura do escritório (norma coletiva do art. 7º), com ou sem a liminar.
        const baseU = xvSem ? Math.min(limU, 40 * HORA) : limU;
        let nTrab = 0, maiorJ1 = 0;
        for (let k = 0; k < 7; k++) {
          const d = ws + k, i = d - A, r = dias[i];
          if (!r.turnos.length) continue;
          nTrab++;
          const m = med(i);
          if (!dispensado(d) && r.especial !== '12x36') maiorJ1 = Math.max(maiorJ1, m);
          const e12 = r.especial === '12x36';
          if (!dispensado(d)) {
            if (m > 8 * HORA && !e12) j1.push({ d: d, m: m });
            const relDia = rel[i];
            if (e12 ? relDia > 10 * 60 : m > 10 * HORA) j2.push({ d: d, m: m, rel: relDia, e12: e12 });
            if (emp.limiteDiario != null && m > emp.limiteDiario * HORA) r14.push({ d: d, m: m, tipo: 'diario' });
          }
          if (emp.tipo === 'menor') {
            for (const x of (instsSemana.get(ws) || [])) if (x.dia === d && x.noctUrb > 0) r9.push({ d: d, motivo: 'trabalho noturno (CLT, art. 404)' });
          }
          if (emp.tipo === 'aprendiz') {
            const lim = emp.aprendiz8h ? 8 : 6;
            if (rel[i] > lim * 60) r9.push({ d: d, motivo: 'aprendiz acima de ' + lim + ' h diárias (CLT, art. 432)' });
          }
        }
        {
          const e42 = cfg.liminar !== false && xvSem && limU > 40 * HORA && limU <= 42 * HORA;
          const c5 = nTrab === 5 || (nTrab < 5 && dServ < 7 && nTrab + (7 - dServ) >= 5);
          sem.lim42 = e42 && c5 && maiorJ1 <= 8 * HORA + 24 * U && emp.tipo !== 'aprendiz' && emp.tipo !== 'menor';
        }
        // J1
        const baseJ1 = 'CF, art. 7º, XIII; CLT, art. 59; Súmula 85 do TST';
        if (j1.length) {
          const diasTxt = j1.map((x) => fmtDataCurta(x.d) + ' (' + fmtHoras(x.m) + ')').join(', ');
          const conta = 'Dias acima de 8 h: ' + diasTxt + '. Semana: ' + fmtHoras(totU) + ' em ' + nTrab + (nTrab === 1 ? ' dia' : ' dias') + '; base compensável sem norma coletiva: ' + fmtHoras(baseU) + '; teto: ' + fmtHoras(limU) + '.';
          let a;
          // Liminar na ADI 8.041 (D101): na etapa de 42 h, sem norma coletiva, até 8h24 por dia para distribuir as 42 h em
          // cinco dias de trabalho, sem adicional; a semana com menos dias só por férias ou afastamento conta como de cinco.
          const etapa42 = cfg.liminar !== false && xvSem && limU > 40 * HORA && limU <= 42 * HORA;
          const cincoDias = nTrab === 5 || (nTrab < 5 && dServ < 7 && nTrab + (7 - dServ) >= 5);
          const liminarOk = etapa42 && cincoDias && maiorJ1 <= 8 * HORA + 24 * U && totU <= limU && emp.tipo !== 'aprendiz' && emp.tipo !== 'menor';
          if (emp.tipo === 'aprendiz') {
            a = { status: 'nao_cumpre', porque: 'Aprendiz não pode ter prorrogação nem compensação de jornada.', base: 'CLT, art. 432' };
          } else if (liminarOk) {
            a = { status: 'cumpre', liminar: true, porque: 'Dias de até 8h24 para distribuir as 42 h em cinco dias, sem norma coletiva e sem adicional sobre os 24 minutos, pela liminar na ADI 8.041 (12/11/2026, em vigor até o julgamento de mérito pelo Plenário).',
              base: 'STF, ADI 8.041 MC (12/11/2026), item I; Emenda Constitucional 141/2026 (Fim da 6x1), arts. 6º, I, e 7º' };
          } else if (totU <= baseU) {
            const tipos = TIPOS_COMPENSACAO;
            const filtro = emp.tipo === 'menor' ? (i) => i.natureza === 'coletivo' : null;
            const b = buscarInstrumento(ctx, emp, tipos, ws, filtro);
            a = { status: 'condicao', atendida: !!(b && b.ok), instrumento: emp.tipo === 'menor' ? 'compensacao_coletiva' : 'compensacao',
              exige: emp.tipo === 'menor' ? 'compensação por convenção ou acordo coletivo (CLT, art. 413, I)' : 'acordo de compensação (individual escrito ou coletivo)',
              nota: b ? (b.ok ? 'cadastrado: ' + b.instr.nome : b.nota) : 'não cadastrado',
              porque: 'Dias acima de 8 h compensados por horas não trabalhadas em dia útil da mesma semana.', base: baseJ1 };
          } else if (totU <= limU && limU > 40 * HORA) {
            if (cfg.leitura8h24 === 'coletiva') {
              const c = condicao(['ampliacao_art7'], ctx, emp, ws);
              a = Object.assign(c, { porque: 'Para distribuir mais de 40 h em até cinco dias é preciso ampliar a duração diária: não há dia útil a compensar, porque o sexto dia virou repouso. Leitura do escritório.' +
                (etapa42 ? ' A liminar na ADI 8.041 dispensa a norma coletiva só com dias de até 8h24 em semana de cinco dias de trabalho.' : ''), base: 'Emenda Constitucional 141/2026 (Fim da 6x1), art. 7º; CF, art. 7º, XIII' });
            } else {
              const b = buscarInstrumento(ctx, emp, TIPOS_COMPENSACAO, ws);
              a = { status: 'condicao', atendida: !!(b && b.ok), instrumento: 'compensacao', exige: 'acordo individual de compensação', nota: b ? (b.ok ? 'cadastrado: ' + b.instr.nome : b.nota) : 'não cadastrado',
                porque: 'Leitura alternativa: acordo individual de compensação basta para distribuir o teto semanal.', base: 'CF, art. 7º, XIII; CLT, art. 59, § 6º; Súmula 85, I, do TST' };
            }
          } else {
            // D108: semana de até 42 h acima do teto, com dias acima de 8 h, só com norma coletiva específica de compensação
            // pela média; D119: a média se confere no mês-calendário (Portaria MTE 2.041/2026, art. 3º), em cada mês que a
            // semana toca. Os repousos ficam com R1 e R2 (a média de repousos do mês só vale com a norma do § 2º e só quando
            // alguma semana tem menos de dois); antes, J1 os conferia de novo e reprovava um 5x2 em mês com oito dias de fim de semana.
            const bm = totU <= 42 * HORA && emp.tipo !== 'menor' ? buscarInstrumento(ctx, emp, ['compensacao_media'], ws) : null;
            if (bm && bm.ok) {
              const hs = [mediaMes(ws), mediaMes(ws + 6)].filter((x, k, xs) => k === 0 || x.rot !== xs[0].rot), hRuim = hs.find((x) => !x.ok), ok = !hRuim;
              const txtH = hs.map((x) => x.rot + ', ' + fmtHoras(x.tot) + ' para o limite de ' + fmtHoras(x.lim) + ' (média de ' + fmtHoras(Math.round(x.semanal)) + ' por semana)').join('; ');
              a = { status: ok ? 'condicao' : 'nao_cumpre', atendida: ok ? true : undefined, instrumento: 'compensacao_media', exige: textoInstrumento(['compensacao_media']), nota: 'cadastrado: ' + bm.instr.nome,
                porque: ok ? 'Semana de até 42 h fechada pela compensação pela média em norma coletiva: no mês-calendário, ' + txtH + '.'
                  : 'A norma coletiva de compensação pela média não fecha a semana: no mês-calendário, ' + hRuim.rot + ' soma ' + fmtHoras(hRuim.tot) + ', acima do limite de ' + fmtHoras(hRuim.lim) + '. O excedente é hora extra.',
                base: 'CF, art. 7º, XIII; Portaria MTE 2.041/2026, arts. 2º e 3º', valoresMedia: hs };
            } else {
              a = { status: 'nao_cumpre', porque: 'Horas acima de 8 h por dia sem dia útil a compensar na semana: o excedente é hora extra.' + (totU <= 42 * HORA && limU < totU ? ' Só norma coletiva específica de compensação pela média, com a média no teto, fecharia a semana (leitura do escritório).' : ''), base: baseJ1 };
            }
          }
          push(Object.assign({ regra: 'J1', periodo: per, conta: conta, valores: { dias: j1.map((x) => x.d), total: totU, base: baseU, limite: limU } }, a));
        } else {
          let maiorDia = 0;
          for (let k = 0; k < 7; k++) maiorDia = Math.max(maiorDia, med(ws + k - A));
          push({ regra: 'J1', periodo: per, status: dServ ? 'cumpre' : 'na', porque: 'Nenhum dia acima de 8 h.', base: baseJ1, valores: { maiorDia: maiorDia } });
        }
        // J2
        const baseJ2 = 'CLT, arts. 59 e 59-A';
        if (j2.length) {
          const parts = j2.map((x) => {
            if (x.e12) {
              if (x.rel > 12 * 60) return { status: 'nao_cumpre', porque: 'Plantão acima de 12 h na escala 12x36.', base: 'CLT, art. 59-A' };
              const c = condicao(['escala_12x36'], ctx, emp, x.d);
              return Object.assign(c, { porque: 'Plantão de 12 h: depende de acordo individual escrito ou norma coletiva.', base: 'CLT, art. 59-A' });
            }
            if (x.m <= 12 * HORA) {
              const b = buscarInstrumento(ctx, emp, ['jornada_12h'], x.d);
              if (b && b.ok) return { status: 'condicao', atendida: true, exige: textoInstrumento(['jornada_12h']), nota: 'cadastrado: ' + b.instr.nome,
                porque: 'Jornada acima de 10 h fora da 12x36 autorizada em norma coletiva; risco de questionamento (art. 611-A, I; Tema 1.046).', base: 'CLT, art. 611-A, I; STF, Tema 1.046' };
            }
            return { status: 'nao_cumpre', porque: 'Jornada acima de 10 h fora da 12x36' + (x.m <= 12 * HORA ? ', sem norma coletiva específica.' : '.'), base: baseJ2 };
          });
          const w = pior(parts);
          push(Object.assign({ regra: 'J2', periodo: per, conta: j2.map((x) => fmtDataCurta(x.d) + ': ' + (x.e12 ? fmtMinutos(x.rel) + ' de relógio' : fmtHoras(x.m))).join('; '), valores: { dias: j2.map((x) => x.d) } }, w));
        } else push({ regra: 'J2', periodo: per, status: dServ ? 'cumpre' : 'na', porque: 'Nenhum dia acima de 10 h.', base: baseJ2, conta: '' });
        // R14
        if (emp.limiteDiario != null || emp.limiteSemanal != null) {
          const viol = r14.slice();
          if (emp.limiteSemanal != null && totU > emp.limiteSemanal * HORA && !dispensado(ws)) viol.push({ d: ws, m: totU, tipo: 'semanal' });
          push({ regra: 'R14', periodo: per, status: viol.length ? 'nao_cumpre' : 'cumpre',
            porque: viol.length ? 'Acima do limite especial do empregado (' + [emp.limiteDiario != null ? emp.limiteDiario + ' h por dia' : null, emp.limiteSemanal != null ? emp.limiteSemanal + ' h por semana' : null].filter(Boolean).join(', ') + ').' : 'Dentro do limite especial do empregado.',
            base: emp.baseLimite, conta: viol.map((x) => (x.tipo === 'semanal' ? 'semana' : fmtDataCurta(x.d)) + ': ' + fmtHoras(x.m)).join('; '), valores: { violacoes: viol.length } });
        }
        // R9
        if (emp.tipo === 'menor' || emp.tipo === 'aprendiz') {
          push({ regra: 'R9', periodo: per, status: r9.length ? 'nao_cumpre' : 'cumpre', porque: r9.length ? r9.map((x) => fmtDataCurta(x.d) + ': ' + x.motivo).join('; ') : 'Sem trabalho noturno e dentro do limite diário.',
            base: 'CLT, arts. 404, 413 e 432', conta: '' });
        }
      }

      /* R5 — interjornada; R6 — intervalo intrajornada; R7 — feriados */
      {
        const viol = [];
        for (const g of (livresSemana.get(ws) || [])) {
          if (g.G < 0) viol.push({ txt: 'turnos sobrepostos em ' + fmtDataCurta(g.ate.dia), G: g.G });
          else if (g.G < 660) viol.push({ txt: fmtDataCurta(g.de.dia) + ' ' + fmtHora(g.de.fim) + ' → ' + fmtDataCurta(g.ate.dia) + ' ' + fmtHora(g.ate.ini) + ': ' + fmtMinutos(g.G), G: g.G });
        }
        const base5 = 'CLT, art. 66; Súmula 110 do TST';
        const st5 = viol.length ? 'nao_cumpre' : (dServ ? 'cumpre' : 'na');
        const a5 = { regra: 'R5', periodo: per, status: st5, porque: viol.length ? 'Intervalo entre jornadas inferior a 11 h: ' + viol.map((v) => v.txt).join('; ') + '.' : 'Todos os intervalos entre jornadas têm ao menos 11 h.', base: base5, conta: '', valores: { violacoes: viol.length, menor: viol.length ? Math.min(...viol.map((v) => v.G)) : null } };
        if (art62) { a5.status = 'na'; a5.porque = 'Empregado excluído do controle de jornada (CLT, art. 62).'; }
