        else if (dispensado(ws) && st5 !== 'na') { a5.valores.statusAvaliado = st5; a5.status = 'info'; a5.porque = 'Art. 8º da Emenda Constitucional 141/2026 (Fim da 6x1): leitura sobre a interjornada pendente de validação. Avaliação informativa: ' + a5.porque; }
        push(a5);

        const r6 = [];
        for (const x of (instsSemana.get(ws) || [])) r6.push(avaliarIntervalo(x, emp, ctx));
        const w6 = r6.length ? pior(r6) : null;
        const alertas6 = r6.some((a) => a.alertas.length) ? ALERTA_POSICAO.slice() : [];
        const a6 = w6 ? Object.assign({ regra: 'R6', periodo: per, alertas: alertas6, conta: r6.filter((a) => a.status !== 'cumpre').map((a) => a.conta).join('; ') }, w6)
          : { regra: 'R6', periodo: per, status: 'na', porque: 'Sem turnos na semana.', base: 'CLT, art. 71', conta: '' };
        a6.regra = 'R6'; a6.periodo = per;
        if (w6 && art62) { a6.status = 'na'; a6.porque = 'Empregado excluído do controle de jornada (CLT, art. 62).'; }
        else if (w6 && dispensado(ws) && a6.status !== 'cumpre') { a6.valores = { statusAvaliado: a6.status }; a6.status = 'info'; a6.porque = 'Art. 8º da Emenda Constitucional 141/2026 (Fim da 6x1): leitura sobre o intervalo pendente de validação. Avaliação informativa: ' + w6.porque; }
        push(a6);

        const fers = [];
        for (let k = 0; k < 7; k++) { const r = dias[ws + k - A]; if (r.feriadoTrabalhado) fers.push(r); }
        if (fers.length) {
          const parts = fers.map((r) => {
            if (r.especial === '12x36') return { status: 'cumpre', porque: 'Feriado em plantão 12x36 considerado compensado.', base: 'CLT, art. 59-A, parágrafo único' };
            if (ctx.comercio) {
              const b = buscarInstrumento(ctx, emp, ['feriado_comercio'], r.d);
              if (!b || !b.ok) return { status: 'nao_cumpre', porque: 'Trabalho em feriado no comércio sem autorização em convenção coletiva.', base: 'Lei 10.101/2000, art. 6º-A' };
            }
            let comp = false;
            for (let x = r.d - 6; x <= r.d + 13; x++) { const q = reg(x); if (q && q.marca === 'folga_comp') comp = true; }
            if (comp) return { status: 'cumpre', porque: 'Feriado trabalhado com folga compensatória registrada.', base: 'Lei 605/1949, art. 9º' };
            return { status: 'condicao', atendida: false, exige: 'folga compensatória ou pagamento em dobro (Lei 605/1949, art. 9º; Súmula 146 do TST)', nota: 'sem folga compensatória registrada', porque: 'Feriado trabalhado sem folga compensatória registrada: devido o pagamento em dobro.', base: 'Lei 605/1949, art. 9º; Súmula 146 do TST' };
          });
          push(Object.assign({ regra: 'R7', periodo: per, conta: fers.map((r) => fmtDataCurta(r.d) + ' (' + r.fer.nome + ')').join('; ') }, pior(parts)));
        }
      }
    }

    /** Saldo (em 1/7 de unidade) das semanas contra a base semanal. */
    function saldoSemanas(lista, comNorma) {
      let saldo7 = 0;
      const partes = [];
      for (const x of lista) {
        if (!x.dServ) continue;
        // Liminar na ADI 8.041 (D101): a semana de cinco dias de até 8h24 tem base nas próprias horas, até o teto de 42 h, sem
        // gerar crédito abaixo das 40 h (a liminar tira o adicional dos 24 minutos, não amplia a compensação).
        const base = (comNorma || cfg.leitura8h24 === 'individual' || !x.xv) ? x.limite : x.lim42 ? Math.min(x.limite, Math.max(40 * HORA, x.total)) : Math.min(x.limite, 40 * HORA);
        // Feriado não trabalhado em dia de escala reduz a base em base ÷ 5: as horas do feriado não geram crédito de compensação.
        // Semana parcial: capacidade de base ÷ 5 por dia em serviço, limitada à base; entra só com eventual excesso, sem gerar crédito.
        const semFer = Math.max(0, base - Math.floor(base * (x.feriados || 0) / 5));
        const d7 = x.dServ === 7 ? 7 * (x.total - semFer) : 7 * Math.max(0, x.total - Math.max(0, Math.min(base, Math.floor(base * x.dServ / 5)) - Math.floor(base * (x.feriados || 0) / 5)));
        saldo7 += d7;
        partes.push(fmtDataCurta(x.ini) + ': ' + (d7 >= 0 ? '+' : '−') + fmtHoras(Math.round(Math.abs(d7) / 7)));
      }
      return { saldo7: saldo7, texto: (partes.length ? partes.join('; ') : 'sem semanas') + ' → saldo ' + (saldo7 > 0 ? '+' : saldo7 < 0 ? '−' : '') + fmtHoras(Math.round(Math.abs(saldo7) / 7)) };
    }

    /* ---------- janelas de 28 dias (liminar na ADI 8.041, D102): com norma coletiva, os repousos se conferiam em qualquer
       período de quatro semanas seguidas. Desligadas por padrão desde a Portaria MTE 2.041/2026, que apura a média no
       mês-calendário (art. 4º, §§ 3º e 4º; D119); ficam só com cfg.janela28 */
    // As janelas começam na vigência dos dois repousos (16/12/2026): antes dela vale a regra de um repouso por semana (R1).
    const NJ = 28, BJ = ctx.janela.b;
    let pRep = null, pExig = null, xv0 = null;
    if (cfg.liminar !== false && cfg.janela28) {
      const n = BJ - A + 1;
      pRep = new Int32Array(n + 1); pExig = new Float64Array(n + 1);
      for (let i = 0; i < n; i++) {
        const d = A + i, sv = emServico(dias[i]);
        if (xv0 == null && T.xv(d)) xv0 = d;
        pRep[i + 1] = pRep[i] + (sv && RP.rep.has(d) ? 1 : 0);
        pExig[i + 1] = pExig[i] + (sv ? 2 / 7 : 0);
      }
    }
    /** A janela de 28 dias com menos folga entre as que tocam o período (ou o período inteiro, se a escala tiver menos de 28 dias). */
    function piorJanela(ini, fim) {
      let pior = null;
      const avalia = (a0, a1) => {
        const rp = pRep[a1 - A + 1] - pRep[a0 - A], ex = Math.ceil(pExig[a1 - A + 1] - pExig[a0 - A] - 1e-9);
        if (!pior || rp - ex < pior.folga) pior = { ini: a0, fim: a1, repousos: rp, exigidos: ex, folga: rp - ex };
      };
      const a0 = Math.max(A, xv0), s0 = Math.max(a0, ini - NJ + 1), s1 = Math.min(fim, BJ - NJ + 1);
      if (s0 <= s1) for (let x = s0; x <= s1; x++) avalia(x, x + NJ - 1);
      else if (Math.max(a0, ini) <= Math.min(BJ, fim)) avalia(Math.max(a0, ini), Math.min(BJ, fim));
      return pior;
    }

    /* ---------- meses */
    const meses = [];
    const c0 = civil(ctx.mesIni), c1 = civil(ctx.mesFim);
    const semFalhaR1 = achados.filter((a) => a.regra === 'R1' && a.status === 'nao_cumpre').map((a) => a.periodo);
    const instsMes = new Map();
    for (const x of insts) { const c = civil(x.dia); const k = diaDe(c.a, c.m, 1); if (!instsMes.has(k)) instsMes.set(k, []); instsMes.get(k).push(x); }
    for (let t = c0.a * 12 + c0.m - 1; t <= c1.a * 12 + c1.m - 1; t++) {
      const a = Math.floor(t / 12), m = t % 12 + 1, nd = diasNoMes(a, m);
      const ini = diaDe(a, m, 1), fim = ini + nd - 1;
      const per = { tipo: 'mes', ini: ini, fim: fim };
      const rot = NOMES_MES[m - 1] + '/' + a;
      let dServ = 0, fds = 0, tRel = 0, tComp = 0, rp = 0, rc = 0, domRep = 0, noc = 0, ferTrab = 0;
      let limTeto = 0;
      const bNorma = !!(buscarInstrumento(ctx, emp, ['ampliacao_art7', 'media_par2'], ini) || {}).ok || !!(buscarInstrumento(ctx, emp, ['ampliacao_art7', 'media_par2'], fim) || {}).ok;
      for (let d = ini; d <= fim; d++) {
        const i = d - A, r = dias[i];
        if (emServico(r)) {
          dServ++;
          if (diaSemana(d) >= 5) fds++;
          limTeto += T.tetoEf(d) * 60;
        }
        tRel += rel[i]; tComp += comp[i]; noc += noct[i];
        if (r.feriadoTrabalhado) ferTrab += civ[i];
        if (RP.rep.has(d)) { rp++; if (diaSemana(d) === 6) domRep++; }
        if (repCal.has(d)) rc++;
      }
      const totU = medidaRel ? tRel * U : tComp;
      const minA = Math.ceil(2 * dServ / 7), minB = fds, minC = Math.ceil(8 * dServ / nd);
      const mes = { a: a, m: m, ini: ini, fim: fim, dServ: dServ, rel: tRel, comp: tComp, repousos: rp, repCal: rc, minimos: { A: minA, B: minB, C: minC }, domingosRepouso: domRep, noturnas: noc, feriadoTrabalhado: ferTrab };
      meses.push(mes);
      if (fim < ctx.h0 || ini > ctx.h1) continue;

      /* R2 — média do § 2º */
      {
        const falhas = semFalhaR1.filter((p) => p.fim >= ini && p.ini <= fim);
        const base = 'CF, art. 7º, § 2º (Emenda Constitucional 141/2026 – Fim da 6x1); Portaria MTE 2.041/2026, art. 4º, §§ 1º e 3º';
        const crit = { A: minA, B: minB, C: minC };
        const valores = { repousos: rp, A: minA, B: minB, C: minC, cumpreA: rp >= minA, cumpreB: rp >= minB, cumpreC: rp >= minC };
        const conta = rot + ': ' + rp + ' repousos; mínimo de ' + minA + ' pelo critério A, ' + minB + ' pelo B e ' + minC + ' pelo C' + (dServ < nd ? ' (mês parcial: ' + dServ + ' dias em serviço)' : '') + '.';
        if (!falhas.length) push({ regra: 'R2', periodo: per, status: 'na', porque: 'R1 cumprido em todas as semanas: o regime de média não é necessário.', base: base, conta: conta, valores: valores });
        else {
          const b = buscarInstrumento(ctx, emp, ['media_par2'], ini) || buscarInstrumento(ctx, emp, ['media_par2'], fim);
          if (!b || !b.ok) push({ regra: 'R2', periodo: per, status: 'nao_cumpre', porque: 'Há semana com menos de dois repousos e não há norma coletiva com regime de média cadastrada' + (b ? ' válida (' + b.nota + ')' : '') + '.', base: base, conta: conta, valores: valores });
          else {
            // D119: média de dois repousos por semana no mês-calendário, pelo critério do art. 4º, § 4º, da Portaria MTE
            // 2.041/2026 (critério A), com ao menos um repouso a cada seis dias seguidos de trabalho (art. 4º, § 3º; ver R3).
            // As janelas de 28 dias da D102 só entram com cfg.janela28.
            const min = crit[cfg.criterioMedia], okM = rp >= min;
            const j = cfg.janela28 && pRep && xv0 != null && fim >= xv0 ? piorJanela(ini, fim) : null, okJ = !j || j.folga >= 0, ok = okM && okJ;
            const txtM = rp + ' repousos no mês; mínimo de ' + min + ' pelo critério ' + cfg.criterioMedia + (cfg.criterioMedia === 'A' ? ' (o dobro dos dias do mês dividido por sete, arredondado para cima)' : '');
            const txtJ = j ? j.repousos + ' repousos para ' + j.exigidos + ' exigidos entre ' + fmtDataCurta(j.ini) + ' e ' + fmtData(j.fim) : '';
            push({ regra: 'R2', periodo: per, status: ok ? 'cumpre' : 'nao_cumpre', instrumento: 'media_par2', nota: 'cadastrado: ' + b.instr.nome,
              porque: txtM + '.' + (j ? (okJ ? ' Na janela de 28 dias mais apertada, ' : ' Faltam repousos numa janela de 28 dias: ') + txtJ + '.' : '') + ' A sequência de dias de trabalho sem repouso, de no máximo seis, se confere em R3.',
              base: 'CF, art. 7º, § 2º; Portaria MTE 2.041/2026, art. 4º, §§ 3º e 4º' + (j ? '; STF, ADI 8.041 MC (12/11/2026), item IV' : ''), conta: conta + (j ? ' Janela de 28 dias mais apertada: ' + txtJ + '.' : ''), valores: j ? Object.assign({ janela: j }, valores) : valores });
          }
        }
      }

      /* R3 — dias consecutivos */
      {
        const viol = corridas.filter((c) => c.n >= 7 && c.fim >= ini && c.ini <= fim);
        const maior = corridas.filter((c) => c.fim >= ini && c.ini <= fim).reduce((s, c) => Math.max(s, c.n), 0);
        push({ regra: 'R3', periodo: per, status: viol.length ? 'nao_cumpre' : (dServ ? 'cumpre' : 'na'),
          porque: viol.length ? viol.map((c) => c.n + ' dias seguidos de trabalho, de ' + fmtData(c.ini) + ' a ' + fmtData(c.fim)).join('; ') + '. Repouso após o 7º dia é devido em dobro.' : 'Maior sequência no mês: ' + maior + ' dia(s).',
          base: 'CF, art. 7º, XV e § 2º; Portaria MTE 2.041/2026, art. 4º, § 3º; OJ 410 da SDI-1 do TST', conta: '', valores: { maior: maior, sequencias: viol.map((c) => ({ ini: c.ini, fim: c.fim, n: c.n })) } });
      }

      /* R4 — repouso no domingo (comércio: a cada três semanas; art. 386: quinzenal, também no comércio — TST, SDI-1,
         E-ED-RR-619-11.2017.5.12.0054; D83). D119: fora do comércio, a Portaria MTE 2.041/2026 (art. 5º, § 5º) pede o domingo
         preferencialmente a cada quatro semanas: a falta vira alerta (status 'info'), não descumprimento. */
      {
        const pref = !emp.art386 && !ctx.comercio;
        const janelaSem = emp.art386 ? 2 : ctx.comercio ? 3 : 4;
        const falhas = [];
        for (let d = ini; d <= fim; d++) {
          if (diaSemana(d) !== 6) continue;
          let algumServico = false, ok = false;
          for (let j = 0; j < janelaSem; j++) {
            const s = d - 7 * j, r = reg(s);
            if (!r) continue;
            if (emServico(r)) algumServico = true;
            if (RP.rep.has(s) || !emServico(r)) ok = true;
          }
          if (algumServico && !ok) falhas.push(d);
        }
        const base = emp.art386 ? 'CLT, art. 386; Portaria MTE 2.041/2026, art. 5º, § 3º' : ctx.comercio ? 'Lei 10.101/2000, art. 6º, parágrafo único; Portaria MTE 2.041/2026, art. 5º, § 4º' : 'CF, art. 7º, XV; CLT, art. 67; Portaria MTE 2.041/2026, art. 5º, § 5º';
        const txtF = 'Sem repouso em domingo nas ' + janelaSem + ' semanas encerradas em ' + falhas.map(fmtDataCurta).join(', ') + '.';
        push({ regra: 'R4', periodo: per, status: pref ? 'info' : falhas.length ? 'nao_cumpre' : (dServ ? 'cumpre' : 'na'),
          porque: falhas.length ? txtF + (pref ? ' Fora do comércio, o repouso deve coincidir com o domingo preferencialmente ao menos uma vez a cada quatro semanas: é recomendação, não exigência.' : '') : domRep + ' repouso(s) em domingo no mês.',
          base: base, conta: '', valores: { domingos: domRep, alerta: pref && falhas.length > 0, semanasSemDomingo: falhas } });
      }

      /* R8 — turno ininterrupto de revezamento */
      {
        const xs = instsMes.get(ini) || [];
        const inicios = Array.from(new Set(xs.map((x) => mod(x.ini, DIA))));
        let espalho = 0;
        for (let i = 0; i < inicios.length; i++) for (let j = i + 1; j < inicios.length; j++) {
          const dd = Math.abs(inicios[i] - inicios[j]);
          espalho = Math.max(espalho, Math.min(dd, DIA - dd));
        }
        const noturno = xs.some((x) => x.noctUrb > 0);
        // D113: equipe que gira entre turnos com horário noturno, informada no cadastro, mesmo que a grade não mostre o giro
        const informado = !!emp.revezamento && xs.length > 0 && !(espalho >= 240 && noturno);
        if (((espalho >= 240 && noturno) || informado) && !art62) {
          let maxDia = 0;
          for (let d = ini; d <= fim; d++) maxDia = Math.max(maxDia, med(d - A));
          let a;
          if (maxDia <= 6 * HORA) a = { status: 'cumpre', porque: 'Turnos alternados com jornada de até 6 h.' };
          else if (maxDia <= 8 * HORA) a = Object.assign(condicao(['turno_ininterrupto_8h'], ctx, emp, ini), { porque: 'Turnos alternados entre o dia e a noite com jornada acima de 6 h: depende de norma coletiva, até 8 h.' });
          else a = { status: 'nao_cumpre', porque: 'Turnos alternados entre o dia e a noite com jornada acima de 8 h.' };
          if (informado) a.porque = 'Revezamento entre turnos com horário noturno informado no cadastro. ' + a.porque;
          if (dispensado(ini) && a.status !== 'cumpre') { a.valores = { statusAvaliado: a.status }; a.status = 'info'; a.porque = 'Art. 8º da Emenda Constitucional 141/2026 (Fim da 6x1): avaliação informativa. ' + a.porque; }
          push(Object.assign({ regra: 'R8', periodo: per, base: 'CF, art. 7º, XIV; Decreto 13.173/2026, art. 2º; Portaria MTE 2.041/2026, art. 7º; Súmula 423 e OJ 360 da SDI-1 do TST', conta: 'Horários de início no mês: ' + inicios.map(fmtHora).join(', ') + '; maior jornada: ' + fmtHoras(maxDia) + '.' }, a));
        }
      }

      /* J7 — atividade insalubre (D113; D119): todo dia acima de 8 h, inclusive as 8h24 da liminar (leitura a validar), é
         prorrogação e depende de norma coletiva que a autorize expressamente ou de autorização da chefia de segurança e saúde
         no trabalho da Inspeção do Trabalho (Portaria MTE 2.041/2026, art. 15, II e III; CLT, arts. 60 e 611-A, XIII). A 12x36
         fica de fora (art. 15, I; CLT, art. 60, parágrafo único). */
      if (emp.insalubre && !art62) {
        let maxDia = 0, nDias = 0;
        for (let d = ini; d <= fim; d++) {
          const i = d - A, r = dias[i];
          if (!r || !r.turnos.length || r.especial === '12x36') continue;
          const m = med(i);
          if (m > 8 * HORA) { nDias++; maxDia = Math.max(maxDia, m); }
        }
        if (nDias) {
          const bL = buscarInstrumento(ctx, emp, ['licenca_art60'], ini), bN = buscarInstrumento(ctx, emp, ['prorrogacao_insalubre'], ini);
          const okL = !!(bL && bL.ok), okN = !!(bN && bN.ok);
          const a = { status: 'condicao', atendida: okL || okN, instrumento: okL ? 'licenca_art60' : okN ? 'prorrogacao_insalubre' : 'insalubre',
            exige: textoInstrumento(['licenca_art60', 'prorrogacao_insalubre']), nota: okL ? 'cadastrado: ' + bL.instr.nome : okN ? 'cadastrado: ' + bN.instr.nome : 'não cadastrado',
            porque: nDias + (nDias === 1 ? ' dia' : ' dias') + ' acima de 8 h em atividade insalubre no mês (maior: ' + fmtHoras(maxDia) + '): depende de norma coletiva que autorize expressamente a prorrogação ou de autorização da Inspeção do Trabalho.' +
              (!okL && !okN && maxDia <= 8 * HORA + 24 * U ? ' Tratar as 8h24 da liminar como prorrogação é leitura do escritório (D113).' : ''),
            base: okL ? 'CLT, art. 60; Portaria MTE 2.041/2026, art. 15, III' : okN ? 'CLT, art. 611-A, XIII; Portaria MTE 2.041/2026, art. 15, II' : 'CLT, arts. 60 e 611-A, XIII; Portaria MTE 2.041/2026, art. 15' };
          if (dispensado(ini)) { a.valores = { statusAvaliado: a.status }; a.status = 'info'; a.porque = 'Art. 8º da Emenda Constitucional 141/2026 (Fim da 6x1): avaliação informativa. ' + a.porque; }
          push(Object.assign({ regra: 'J7', periodo: per, conta: '' }, a));
        }
      }

      /* J4 — compensação no mês: saldo das semanas de apuração atribuídas ao mês (pela quinta-feira) contra a base semanal */
      {
        const b = buscarInstrumento(ctx, emp, ['compensacao_mensal'], ini) || buscarInstrumento(ctx, emp, ['compensacao_mensal'], fim);
        const bMed = buscarInstrumento(ctx, emp, ['compensacao_media'], ini) || buscarInstrumento(ctx, emp, ['compensacao_media'], fim);
        if (b && b.ok && bMed && bMed.ok && !dispensado(ini)) {
          // D108 e D119: com a compensação pela média em norma coletiva, a média do mês-calendário se confere em J1
          push({ regra: 'J4', periodo: per, status: 'na', porque: 'Há norma coletiva de compensação pela média: as semanas acima da base se conferem pela média do mês-calendário (ver J1).', base: 'CF, art. 7º, XIII; Portaria MTE 2.041/2026, art. 3º' });
        } else if (b && b.ok && !dispensado(ini)) {
          const sal = saldoSemanas(semanas.filter((x) => x.ini + 3 >= ini && x.ini + 3 <= fim), bNorma);
          const conta = 'Saldo das semanas atribuídas a ' + rot + ' (base semanal ' + (bNorma ? 'pelo teto, há norma do art. 7º ou do § 2º' : cfg.leitura8h24 === 'individual' ? 'pelo teto, leitura alternativa de J1' : 'de 8 h × 5 dias quando vigoram dois repousos' + (cfg.liminar !== false ? ', ou as horas da semana até 42 h na semana de cinco dias de até 8h24 (liminar na ADI 8.041)' : '')) + '): ' + sal.texto +
            '. Referência da seção 4.6 (teto ÷ 7 por dia do mês): ' + fmtHoras(totU) + ' contra ' + fmtHoras(limTeto) + '.';
          const valores = { saldo7: sal.saldo7, excedente: Math.max(0, Math.ceil(sal.saldo7 / 7)), total: totU, limiteTeto: limTeto, statusSecao46: totU <= limTeto ? 'cumpre' : 'nao_cumpre' };
          const alt = [{ criterio: 'limite mensal da seção 4.6', status: valores.statusSecao46 }];
          if (sal.saldo7 <= 0) push({ regra: 'J4', periodo: per, status: 'condicao', atendida: true, exige: textoInstrumento(['compensacao_mensal']), nota: 'cadastrado: ' + b.instr.nome, porque: 'As horas acima da base em algumas semanas são compensadas no próprio mês.', base: 'CLT, art. 59, § 6º', conta: conta, valores: valores, alternativas: alt });
          else push({ regra: 'J4', periodo: per, status: 'nao_cumpre', porque: 'Saldo positivo de ' + fmtHoras(valores.excedente) + ' nas semanas do mês: hora extra.', base: 'CLT, art. 59, § 6º', conta: conta, valores: valores, alternativas: alt });
        }
      }

      /* J6 — 12x36 (D118): apuração no mês-calendário (Decreto 13.173/2026, art. 3º; Portaria MTE 2.041/2026, arts. 3º e 8º). Média do mês acima do limite semanal
         constitucional não invalida a escala: as horas excedentes são compensadas ou pagas como extras, nos termos de
         convenção ou acordo coletivo. A média do ciclo fica como referência. */
      {
        const escs = new Map();
        let usados12 = 0;
        for (let d = ini; d <= fim; d++) {
          const r = dias[d - A];
          if (r.especial === '12x36' && r.turnos.length) { usados12++; if (!escs.has(r.escala)) escs.set(r.escala, []); escs.get(r.escala).push(d); }
        }
        if (escs.size && !dispensado(ini)) {
          const ciclos = [];
          for (const [e, usados] of escs) ciclos.push(Object.assign({ escala: e, usados: usados }, mediaCiclo(e, ctx)));
          const media = ciclos.map((c) => fmtHoras(Math.round(c.totalCiclo * 7 / c.n)) + (c.totalCiclo * 7 % c.n ? ' (aprox.)' : '')).join(', ');
          const exced = Math.max(0, totU - limTeto);
          const base = 'CLT, art. 59-A; Decreto 13.173/2026, art. 3º; Portaria MTE 2.041/2026, arts. 3º e 8º';
          const conta = 'Mês-calendário: ' + fmtHoras(totU) + (medidaRel ? ' de relógio' : ' computadas') + ' contra limite de ' + fmtHoras(limTeto) + ' (limite semanal ÷ 7 por dia do mês). Média do ciclo, como referência: ' + media + '.';
          const valores = { mediaCiclo: ciclos.map((c) => ({ escala: c.escala, total: c.totalCiclo, dias: c.n })), totalMes: totU, limiteMes: limTeto, excedente: exced, plantoes: usados12 };
          if (exced <= 0) push({ regra: 'J6', periodo: per, status: 'cumpre', porque: rot + ': ' + fmtHoras(totU) + ' no mês, dentro do limite de ' + fmtHoras(limTeto) + '.', base: base, conta: conta, valores: valores });
          else {
            const b = buscarInstrumento(ctx, emp, ['excesso_12x36'], ini), ok = !!(b && b.ok);
            push({ regra: 'J6', periodo: per, status: 'condicao', atendida: ok, instrumento: 'excesso_12x36', exige: textoInstrumento(['excesso_12x36']), nota: ok ? 'cadastrado: ' + b.instr.nome : 'não cadastrado',
              porque: rot + ': ' + fmtHoras(totU) + ' no mês, acima do limite de ' + fmtHoras(limTeto) + ' (excedente de ' + fmtHoras(exced) + '): as horas excedentes são compensadas ou pagas como extras, nos termos de convenção ou acordo coletivo.',
              base: base, conta: conta, valores: valores });
          }
        }
      }

      /* R10 — art. 8º */
      if (emp.nivelSuperior) {
        const s = art8Dia(ini);
        push({ regra: 'R10', periodo: per, status: 'info', porque: s.enquadrado ? 'Enquadrado no art. 8º: ' + s.motivo + '. Dispensa J1 a J6; R1 a R3 continuam.' : 'Não enquadrado no art. 8º: ' + s.motivo + '.', base: 'Emenda Constitucional 141/2026 (Fim da 6x1), art. 8º; Portaria MTE 2.041/2026, art. 9º', conta: '', valores: { enquadrado: s.enquadrado } });
      }

      /* F1 — início de férias */
      {
        const viol = [];
        for (let d = ini; d <= fim; d++) {
          const r = reg(d), ant = reg(d - 1);
          if (!r || r.estado !== 'ferias' || (ant && ant.estado === 'ferias')) continue;
          for (let j = 1; j <= 2; j++) {
            const q = reg(d + j);
            if (!q) continue;
            if (q.fer || (q.servico && q.escala && q.base == null)) { viol.push({ d: d, motivo: fmtDataCurta(d + j) + (q.fer ? ' é feriado' : ' é dia de repouso na escala') }); break; }
          }
        }
        const temFerias = (() => { for (let d = ini; d <= fim; d++) { const r = reg(d), ant = reg(d - 1); if (r && r.estado === 'ferias' && !(ant && ant.estado === 'ferias')) return true; } return false; })();
        if (temFerias) push({ regra: 'F1', periodo: per, status: viol.length ? 'nao_cumpre' : 'cumpre',
          porque: viol.length ? viol.map((v) => 'Férias iniciadas em ' + fmtData(v.d) + ', e ' + v.motivo).join('; ') + '.' : 'Início de férias fora dos dois dias que antecedem feriado ou repouso.',
          base: 'CLT, art. 134, § 3º', conta: '' });
      }

      /* indicadores operacionais */
      let fdsLivres = 0, domLivres = 0, isoladas = 0;
      for (let d = ini; d <= fim; d++) {
        const r = reg(d);
        if (!r || r.estado !== 'folga') continue;
        if (diaSemana(d) === 6) { domLivres++; const sab = reg(d - 1); if (sab && sab.estado === 'folga') fdsLivres++; }
        const ant = reg(d - 1), pos = reg(d + 1);
        if (!(ant && ant.estado === 'folga') && !(pos && pos.estado === 'folga')) isoladas++;
      }
      mes.indicadores = { finsDeSemanaLivres: fdsLivres, domingosLivres: domLivres, folgasIsoladas: isoladas };
    }

    /* ---------- J5 — banco de horas */
    for (const i of ctx.dados.instrumentos) {
      if ((i.tipo !== 'banco_semestral' && i.tipo !== 'banco_anual') || !abrange(i, emp)) continue;
      const passo = i.tipo === 'banco_semestral' ? 6 : 12;
      let p0 = i.vigenciaInicio > -1e8 ? i.vigenciaInicio : ctx.mesIni;
      while (p0 <= ctx.h1) {
        const p1 = somarMeses(p0, passo) - 1;
        if (p1 >= ctx.h0) {
          const comNorma = !!(buscarInstrumento(ctx, emp, ['ampliacao_art7', 'media_par2'], p0) || {}).ok;
          const sal = saldoSemanas(semanas.filter((x) => x.ini + 3 >= p0 && x.ini + 3 <= p1), comNorma);
          const s = situacaoInstrumento(i, p0, D) || { ok: false, nota: 'fora da vigência' };
          const per = { tipo: 'periodo', ini: p0, fim: p1 };
          const exc = Math.max(0, Math.ceil(sal.saldo7 / 7));
          const conta = 'Saldo das semanas do período (' + fmtData(p0) + ' a ' + fmtData(p1) + '): saldo ' + (sal.saldo7 > 0 ? '+' : sal.saldo7 < 0 ? '−' : '') + fmtHoras(Math.round(Math.abs(sal.saldo7) / 7)) + '.';
          if (!s.ok) push({ regra: 'J5', periodo: per, status: 'nao_cumpre', porque: 'Banco de horas sem validade no período: ' + s.nota + '.', base: TIPOS_INSTRUMENTO[i.tipo].base, conta: conta });
          else push({ regra: 'J5', periodo: per, status: sal.saldo7 <= 0 ? 'condicao' : 'nao_cumpre', atendida: sal.saldo7 <= 0, exige: textoInstrumento([i.tipo]), nota: 'cadastrado: ' + i.nome,
            porque: sal.saldo7 <= 0 ? 'Saldo do banco fechado sem horas a pagar no período.' : 'Saldo positivo de ' + fmtHoras(exc) + ' ao fim do período: hora extra.', base: TIPOS_INSTRUMENTO[i.tipo].base, conta: conta, valores: { saldo7: sal.saldo7, excedente: exc } });
        }
        p0 = p1 + 1;
      }
    }

    /* ---------- sinalizações de repouso */
    const sinais = [];
    for (const x of RP.semRep) if (x.dia >= ctx.mesIni && x.dia <= ctx.mesFim) sinais.push({ dia: x.dia, tipo: 'folga_sem_repouso', texto: 'Folga em ' + fmtData(x.dia) + ' sem 24 h mais 11 h íntegras (intervalo livre de ' + fmtMinutos(x.G) + ').' });
    for (const d of dependentes) if (d >= ctx.mesIni && d <= ctx.mesFim) sinais.push({ dia: d, tipo: 'repouso_dependente', texto: 'O repouso de ' + fmtData(d) + ' só se completa graças a feriado, férias, afastamento ou falta: pela escala programada, não se completaria.' });

    /* ---------- dias para calendário */
    const saidaDias = [];
    for (let d = ctx.mesIni; d <= ctx.mesFim; d++) {
      const i = d - A, r = dias[i];
      saidaDias.push({
        d: d, estado: r.estado, feriado: r.fer ? r.fer.nome : null, escala: r.escala, turnos: r.turnos,
        rel: rel[i], comp: comp[i], noct: noct[i], repouso: RP.rep.has(d), repousoCalendario: repCal.has(d), repousoBlocos: RP.blocos.has(d),
        folgaSemRepouso: semRep.has(d), repousoDependente: dependentes.has(d),
      });
    }
    const turnosSaida = insts.filter((x) => x.fim > ctx.mesIni * DIA && x.ini < (ctx.mesFim + 1) * DIA).map((x) => ({
      dia: x.dia, turno: x.turno, ini: x.ini, fim: x.fim, segmentos: x.segmentos, pausas: x.pausas, rel: x.rel, comp: x.comp, noct: x.noct,
    }));

    const interjornadas = RP.intervalos.filter((g) => g.G < 660 && g.ate.dia >= ctx.mesIni && g.ate.dia <= ctx.mesFim)
      .map((g) => ({ dia: g.ate.dia, fimTurno: g.de.fim, inicioTurno: g.ate.ini, G: g.G }));
    const livres = RP.intervalos.filter((g) => (g.G >= 35 * 60 || g.k > 0) && g.ate.dia >= ctx.mesIni && g.de.dia <= ctx.mesFim)
      .map((g) => ({ de: g.de.dia, fimTurno: g.de.fim, ate: g.ate.dia, inicioTurno: g.ate.ini, G: g.G, k: g.k, r: g.r }));

    return { id: emp.id, nome: emp.nome, setor: emp.setor, tipo: emp.tipo, dias: saidaDias, turnos: turnosSaida, semanas: semanas, meses: meses, achados: achados, sinais: sinais, livres: livres, interjornadas: interjornadas, corridas: corridas.filter((c) => c.fim >= ctx.mesIni && c.ini <= ctx.mesFim) };
  }

  /* ==================================================== intervalo (R6) */

  const SEM_ALERTAS = Object.freeze([]);
  const ALERTA_POSICAO = Object.freeze(['Intervalo na primeira ou na última hora de trabalho: tende a ser visto como sem a finalidade de repouso e alimentação.']);

  function avaliarIntervalo(x, emp, ctx) {
    const W = x.rel;
    let L = 0, S = 0, nUs = 0, nInd = 0;
    let alertas = SEM_ALERTAS;
    for (const p of x.pausas) {
      if (p.tipo === 'indenizado') { nInd++; continue; }
      const dur = p.fim - p.ini;
      nUs++; S += dur; if (dur > L) L = dur;
      if (p.ini - x.ini < 60 || x.fim - p.fim < 60) alertas = ALERTA_POSICAO;
    }
    const us = { length: nUs }, ind = { length: nInd };
    const e12 = x.especial === '12x36';
    const base = 'CLT, art. 71';
    const R = (o) => {
      o.base = o.base || base; o.alertas = alertas;
      if (o.status !== 'cumpre' || alertas.length) o.conta = fmtDataCurta(x.dia) + ' ' + fmtHora(x.ini) + '–' + fmtHora(x.fim) + ' (' + fmtMinutos(W) + ' de trabalho, intervalo de ' + L + ' min)';
      return o;
    };
    if (W <= 240) return R({ status: 'cumpre', porque: 'Até 4 h de trabalho: sem intervalo obrigatório.' });
    if (W <= 360) {
      if (L >= 15) return R({ status: 'cumpre', porque: 'Acima de 4 h até 6 h: intervalo de 15 min atendido.' });
      if (e12 && ind.length) return R({ status: 'cumpre', porque: 'Intervalo indenizado na 12x36.', base: 'CLT, art. 59-A' });
      return R({ status: 'nao_cumpre', porque: 'Acima de 4 h até 6 h de trabalho exige intervalo de 15 min (art. 71, § 1º).' });
    }
    if (L === 0) {
      if (ind.length && e12) return R({ status: 'cumpre', porque: 'Intervalo indenizado na 12x36.', base: 'CLT, art. 59-A' });
      if (ind.length) return R({ status: 'nao_cumpre', porque: 'Intervalo indenizado fora da 12x36 equivale a supressão (art. 71, § 4º).' });
      return R({ status: 'nao_cumpre', porque: 'Trabalho acima de 6 h sem intervalo previsto.' });
    }
    if (L >= 60 && L <= 120) return R({ status: 'cumpre', porque: 'Intervalo de ' + L + ' min, entre 1 h e 2 h.' });
    if (L > 120) {
      const b = buscarInstrumento(ctx, emp, ['intervalo_superior_2h'], x.dia, (i) => i.parametros.maximo == null || L <= Number(i.parametros.maximo));
      return R({ status: 'condicao', atendida: !!(b && b.ok), instrumento: 'intervalo_superior_2h', exige: 'acordo escrito (individual) ou norma coletiva que admita intervalo superior a 2 h (CLT, art. 71, caput)',
        nota: b ? (b.ok ? 'cadastrado: ' + b.instr.nome : b.nota) : 'não cadastrado', porque: 'Intervalo de ' + L + ' min, acima de 2 h.' });
    }
    if (S >= 60 && us.length > 1) {
      const b = buscarInstrumento(ctx, emp, ['fracionamento_intervalo'], x.dia);
      return R({ status: 'condicao', atendida: !!(b && b.ok), instrumento: 'fracionamento_intervalo', exige: 'norma coletiva de fracionamento, restrita a motoristas, cobradores e afins (CLT, art. 71, § 5º)',
        nota: b ? (b.ok ? 'cadastrado: ' + b.instr.nome : b.nota) : 'não cadastrado', porque: 'Intervalo fracionado (' + x.pausas.filter((p) => p.tipo === 'usufruido').map((p) => (p.fim - p.ini) + ' min').join(' + ') + ').' });
    }
    if (L >= 30) {
      const b = buscarInstrumento(ctx, emp, ['reducao_intervalo', 'reducao_intervalo_mte'], x.dia, (i) => i.parametros.minimo == null || L >= Number(i.parametros.minimo));
      return R({ status: 'condicao', atendida: !!(b && b.ok), instrumento: 'reducao_intervalo', exige: 'norma coletiva que reduza o intervalo a no mínimo 30 min (CLT, art. 611-A, III) ou autorização do art. 71, § 3º',
        nota: b ? (b.ok ? 'cadastrado: ' + b.instr.nome : b.nota) : 'não cadastrado', porque: 'Intervalo de ' + L + ' min, abaixo de 1 h.' });
    }
    return R({ status: 'nao_cumpre', porque: 'Intervalo de ' + L + ' min, abaixo do mínimo de 30 min admitido para negociação coletiva (art. 611-A, III).' });
  }

  /* ============================================ achados da empresa (R15, I1) */

  function avaliarEmpresa(dados, ctx) {
    const D = ctx.D;
    const achados = [];
    for (const i of dados.instrumentos) {
      if (i.natureza !== 'coletivo') continue;
      const alertas = [];
      if (i.celebracao != null && i.celebracao < D.publicacao) alertas.push('Instrumento anterior à Emenda Constitucional 141/2026 (Fim da 6x1): verificar compatibilidade; cláusulas incompatíveis perdem efeito em ' + fmtData(D.art3) + '.');
      else alertas.push('Verificar compatibilidade com a Emenda Constitucional 141/2026 (Fim da 6x1), art. 3º.');
      if (i.tipo === 'ampliacao_art7') alertas.push('A ampliação do art. 7º só vale até ' + fmtData(D.teto40 - 1) + '.');
      if (i.tipo === 'escala_12x36' || i.tipo === 'jornada_12h' || i.tipo === 'banco_anual') alertas.push('Cláusula compatível com 42 h pode tornar-se incompatível com o teto de 40 h em ' + fmtData(D.teto40) + '.');
      achados.push({ regra: 'R15', instrumento: i.id, status: i.compativel === true ? 'cumpre' : i.compativel === false ? 'nao_cumpre' : 'condicao', atendida: i.compativel === true,
        exige: 'verificação de compatibilidade pelo advogado', porque: alertas.join(' '), base: 'Emenda Constitucional 141/2026 (Fim da 6x1), art. 3º' });
    }
    const porte = dados.empresa.porte;
    if (porte === 'MEI' || porte === 'ME' || porte === 'EPP') {
      achados.push({ regra: 'I1', status: 'info', porque: 'Empresa de pequeno porte: lei complementar ainda inexistente poderá prever medidas transitórias.', base: 'Emenda Constitucional 141/2026 (Fim da 6x1), art. 5º' });
    }
    return { achados: achados };
  }

  /* ====================================================== avaliação */

  function avaliar(entrada, cfgParcial) {
    const dados = normalizar(entrada);
    const cfg = Object.assign({}, CONFIG_PADRAO, { semanaInicio: dados.semanaInicio || 0 }, cfgParcial || {});
    const D = datasVigencia(cfg.prazos);
    const ctx = criarContexto(dados, cfg, D);
    const empregados = dados.empregados.map((e) => avaliarEmpregado(e, ctx));
    return {
      versao: VERSAO, baseNormativa: BASE_NORMATIVA, config: cfg, datas: D, horizonte: dados.horizonte,
      erros: dados.erros, empregados: empregados, empresa: avaliarEmpresa(dados, ctx),
    };
  }

  const VARIANTES = [
    { id: 'medida', rotulo: 'Horas de relógio, e não computadas, nas regras de teto', patch: { medida: 'relogio' } },
    { id: 'liminar', rotulo: 'Sem a liminar na ADI 8.041, se o Plenário não a referendar', patch: { liminar: false } },
    { id: 'leitura8h24', rotulo: 'Distribuição de até 42 h por acordo individual de compensação', patch: { leitura8h24: 'individual' } },
    { id: 'transicao', rotulo: 'Regra aplicada dia a dia na semana de transição', patch: { transicao: 'diaria' } },
    { id: 'prazos', rotulo: 'Contagem de prazos pelo Código Civil (art. 132, § 3º)', patch: { prazos: 'civil' } },
    { id: 'art9', rotulo: 'Art. 9º: dois repousos também diferidos até o aditamento', patch: { art9: 'diferido' }, aplicavel: (d) => d.empregados.some((e) => e.contratoPublico) },
    { id: 'turnoDia', rotulo: 'Turno que cruza a meia-noite rateado pelo dia civil', patch: { turnoDia: 'civil' } },
    { id: 'prorrogacao', rotulo: 'Hora reduzida só entre 22h e 5h, sem estender à prorrogação', patch: { prorrogacaoReduzida: false } },
  ];

  function chaveAchado(a) { return a.regra + '|' + (a.periodo ? a.periodo.tipo + '|' + a.periodo.ini : a.instrumento || ''); }
  function rotuloStatus(a) {
    if (!a) return '—';
    if (a.status === 'condicao') return 'cumpre com condição' + (a.instrumento && TIPOS_INSTRUMENTO[a.instrumento] ? ': ' + TIPOS_INSTRUMENTO[a.instrumento].nome.toLowerCase() : a.exige ? ': ' + a.exige : '') + (a.atendida ? ' (atendida)' : ' (pendente)');
    return { cumpre: 'cumpre', nao_cumpre: 'não cumpre', info: 'informativo', na: 'não se aplica' }[a.status] || a.status;
  }

  /** Avalia pelo critério padrão e, para cada leitura alternativa, registra onde o resultado muda. */
  function avaliarComAlternativas(entrada, cfgParcial) {
    const dados = normalizar(entrada);
    const base = avaliar(dados, cfgParcial);
    const divergencias = [];
    for (const v of VARIANTES) {
      if (v.aplicavel && !v.aplicavel(dados)) continue;
      const patch = Object.assign({}, cfgParcial || {}, v.patch);
      let difere = false;
      for (const k of Object.keys(v.patch)) if (base.config[k] !== v.patch[k]) difere = true;
      if (!difere) continue;
      const alt = avaliar(dados, patch);
      alt.empregados.forEach((ea, idx) => {
        const eb = base.empregados[idx];
        const mapa = new Map(eb.achados.map((a) => [chaveAchado(a), a]));
        const vistos = new Set();
        for (const a of ea.achados) {
          const k = chaveAchado(a);
          vistos.add(k);
          const b = mapa.get(k);
          if (!b || b.status !== a.status || !!b.atendida !== !!a.atendida || (b.instrumento || null) !== (a.instrumento || null)) {
            divergencias.push({ variante: v.id, rotulo: v.rotulo, empregado: eb.id, regra: a.regra, periodo: a.periodo, padrao: b ? rotuloStatus(b) : '—', alternativo: rotuloStatus(a), porqueAlternativo: a.porque });
          }
        }
        for (const [k, b] of mapa) if (!vistos.has(k)) divergencias.push({ variante: v.id, rotulo: v.rotulo, empregado: eb.id, regra: b.regra, periodo: b.periodo, padrao: rotuloStatus(b), alternativo: '—' });
      });
    }
    base.divergencias = divergencias;
    return base;
  }

  /* ====================================================== limite mensal (4.6) */

  function limiteMensal(a, m, opcoes) {
    const o = Object.assign({ transicao: 'semana', prazos: 'conservador', cenario: 'legal', semanaInicio: 0, base: 'teto' }, opcoes || {});
    const D = datasVigencia(o.prazos);
    const ctx = { cfg: Object.assign({}, CONFIG_PADRAO, o), D: D, si: o.semanaInicio };
    const T = criarTetos({ contratoPublico: null }, ctx);
    let u = 0;
    for (let d = diaDe(a, m, 1); d <= diaDe(a, m, diasNoMes(a, m)); d++) u += o.base === 'teto' ? T.tetoEf(d) * 60 : T.baseDia(d, false);
    return u;
  }

  /* ============================================================ cobertura */

  function demandaDia(setor, d) {
    const exc = setor.excecoes.filter((x) => x.data === d);
    const lista = exc.length ? exc.map((x) => ({ inicio: x.inicio, fim: x.fim, pessoas: x.pessoas })) : setor.necessidade.filter((n) => n.dias.indexOf(diaSemana(d)) >= 0);
    return lista.map((n) => { const a = d * DIA + n.inicio; const b = d * DIA + (n.fim > n.inicio ? n.fim : n.fim + DIA); return [a, b, n.pessoas]; });
  }

  /** Cobertura exata (ao minuto) de um setor entre dois dias: segmentos com presença e necessidade. */
  function cobertura(resultado, entrada, setorId, ini, fim) {
    const dados = normalizar(entrada);
    const setor = dados.setores.get(String(setorId));
    const pres = [];
    for (const e of resultado.empregados) if (e.setor === String(setorId)) for (const x of e.turnos) for (const s of x.segmentos) pres.push(s);
    const dias = [];
    let descoberto = 0, excesso = 0, demandaTotal = 0, ofertaTotal = 0;
    for (let d = ini; d <= fim; d++) {
      const d0 = d * DIA, d1 = d0 + DIA;
      const ev = new Map();
      const add = (t, dp, dq) => { const v = ev.get(t) || [0, 0]; v[0] += dp; v[1] += dq; ev.set(t, v); };
      add(d0, 0, 0); add(d1, 0, 0);
      for (const s of pres) { const a = Math.max(s[0], d0), b = Math.min(s[1], d1); if (a < b) { add(a, 1, 0); add(b, -1, 0); } }
      if (setor) for (const dd of [d - 1, d]) for (const q of demandaDia(setor, dd)) { const a = Math.max(q[0], d0), b = Math.min(q[1], d1); if (a < b) { add(a, 0, q[2]); add(b, 0, -q[2]); } }
      const ts = Array.from(ev.keys()).sort((x, y) => x - y);
      let p = 0, q = 0;
      const segs = [];
      for (let k = 0; k < ts.length - 1; k++) {
        const v = ev.get(ts[k]); p += v[0]; q += v[1];
        const a = ts[k], b = ts[k + 1];
        if (b <= d0 || a >= d1 || a === b) continue;
        const ult = segs[segs.length - 1];
        if (ult && ult.presenca === p && ult.demanda === q && ult.fim === a) ult.fim = b;

    const alertas = [];

      alertas.push({ regra: 'art468', texto: 'A duração diária sobe de ' + fmtMinutos(at.maxDiaMin) + ' para ' + fmtMinutos(pr.maxDiaMin) + ' e a permanência no estabelecimento, de ' + fmtMinutos(at.maxPermanenciaMin) + ' para ' + fmtMinutos(pr.maxPermanenciaMin) + ': alteração contratual que depende de anuência do empregado.', base: 'CLT, art. 468' });
    }

      if (r.status !== 'cumpre') { alertas.push({ regra: 'R6', texto: 'Turno ' + it.t.id + ': ' + r.porque + (it.x.rel > 360 ? ' Acima de 6 h de trabalho, o intervalo mínimo passa a ser de 1 h.' : ''), base: 'CLT, art. 71' }); break; }

    ciclo: (id, trabalho, folga, turno, op) => Object.assign({ id: id, dias: Array(trabalho).fill(turno).concat(Array(folga).fill(null)), tipo: 'ciclo' }, op || {}),

    J2: { nome: 'Limite diário absoluto', base: 'CLT, arts. 59 e 59-A' },

    J5: { nome: 'Banco de horas', base: 'CLT, art. 59, §§ 2º e 5º' },
    J6: { nome: 'Escala 12x36', base: 'CLT, art. 59-A; Decreto 13.173/2026, art. 3º; Portaria MTE 2.041/2026, art. 8º' },
    J7: { nome: 'Prorrogação em atividade insalubre', base: 'CLT, arts. 60 e 611-A, XIII; Portaria MTE 2.041/2026, art. 15' },
    R1: { nome: 'Dois repousos em cada semana', base: 'CF, art. 7º, XV; Portaria MTE 2.041/2026, art. 4º, §§ 1º e 2º' },
    R2: { nome: 'Média de dois repousos no mês', base: 'CF, art. 7º, § 2º; Portaria MTE 2.041/2026, art. 4º, §§ 3º e 4º' },
    R3: { nome: 'No máximo 6 dias consecutivos de trabalho', base: 'Portaria MTE 2.041/2026, art. 4º, § 3º; OJ 410 da SDI-1 do TST' },
    R4: { nome: 'Repouso no domingo', base: 'CF, art. 7º, XV; Lei 10.101/2000, art. 6º; CLT, art. 386; Portaria MTE 2.041/2026, art. 5º, §§ 3º a 5º' },
    R5: { nome: 'Interjornada de 11 h', base: 'CLT, art. 66' },
    R6: { nome: 'Intervalo intrajornada', base: 'CLT, arts. 71 e 611-A, III' },
    R7: { nome: 'Feriados', base: 'Lei 605/1949, art. 9º; Súmula 146 do TST' },
    R8: { nome: 'Turno ininterrupto de revezamento', base: 'CF, art. 7º, XIV; Decreto 13.173/2026, art. 2º; Portaria MTE 2.041/2026, art. 7º; Súmula 423 do TST' },

    R14: { nome: 'Jornadas especiais', base: 'CLT, arts. 58-A e 224; NR-17, Anexo II' },

    datasVigencia: datasVigencia, normalizar: normalizar, avaliar: avaliar, avaliarComAlternativas: avaliarComAlternativas,

<script id="planejador-escalas">/*

   * 'literal' (padrão): cada repouso vale a jornada normal do dia (horas da semana ÷ dias de trabalho);

    '5x2': { rotulo: '5x2', dias: 5 },
    '4x3': { rotulo: '4x3', dias: 4 },

    '5x1': { rotulo: '5x1', ciclo: [1, 1, 1, 1, 1, 0] },

  /* ================================================================ horários */

  const hm = (m) => M.fmtHora(m);
  const pl = (n, um, varios) => n + ' ' + (n === 1 ? um : varios);
  const fh = (min) => M.fmtMinutos(min);
  function duracoes(t) {

   * Cada grupo inclui obrigatoriamente os dias cuja contagem restante iguala o número de grupos restantes, o que
   * garante a conclusão sempre que nenhum dia tenha mais fichas do que o número de grupos.
   */
  function agrupar(cont, tam, pref) {
    const ordem = pref || PREF_FOLGA;

        for (const d of ordem) {
          if (sel.has(d) || rest[d] <= 0) continue;
          const v = sel.has((d + 1) % 7) || sel.has((d + 6) % 7);
          if (best < 0 || (v && !viz) || (v === viz && rest[d] > rest[best])) { best = d; viz = v; }
        }
        if (best < 0) return null;
        sel.add(best);
      }
      for (const d of sel) rest[d]--;
      grupos.push(Array.from(sel).sort((a, b) => a - b));

   * atual, o que limita a sequência de trabalho a 6 dias. Com `domingo`, exige folga no domingo em toda janela de

  function agruparEspalhado(cont, tam) {

      const ciclos = rest.map((rj) => [].concat.apply([], rj.map((rs) => Array.from({ length: 7 }, (_, d) => (rs.indexOf(d) >= 0 ? 0 : 1)))));
      const pre = preambulo5x2(ctx, dem, n, null, (j, z) => !ciclos[j][z % (7 * N)]);
      if (!pre) continue;
      const pes = nomesPessoas(n, ctx.integraisAtuais, 'Nova contratação', false);
      return { n: n, grupos: pes.map((p, j) => ({ modo: 'ciclo', turnos: [tt], ciclo: ciclos[j], deslocamentos: [0],
        preambulo: { desde: pre.desde, folgas: [pre.folgas[j]], extra: pre.extra ? [pre.extra[j]] : null }, pessoas: [p] })) };
    }
    return { erro: 'Nem com o dobro da necessidade diária o revezamento cobriu todos os dias.' };
  }
  /** Lista de cenários sugeridos para um turno, avaliados e ordenados. */
  function cenarios(turno, empresa, opcoes) {
    const ctx = contexto(turno, empresa, opcoes);
    if (ctx.erro) return { erro: ctx.erro };
    const dur = ctx.dur, dem = ctx.dem, ops = ctx.operacao;
    const defs = [];
    // escalas que o planejador testou e deixou de fora antes de calcular, com o motivo (D86)
    const fora = [];
    const descartar = (familia, nome, motivo) => { if (!fora.some((x) => x.familia === familia)) fora.push({ familia: familia, nome: nome, motivo: motivo }); };
    const Pa = ctx.parciaisAtuais.length, Ia = ctx.integraisAtuais.length;
    const quadro = { atual: Ia + Pa, integraisAtuais: Ia, parciaisAtuais: Pa, ferias: 0 };
    const avisoFixo = (h) => (h && h.muda ? (ctx.funcionamento === 'fixo' ? 'O horário deste turno foi marcado como fixo: este cenário não serve sem mudar o funcionamento.' : ctx.funcionamento ? null : PERGUNTA_HORARIO) : null);

    if (!ctx.longo) {
      const atual = ctx.atual;
      const e8 = limitarDia(ctx, 480);
      const excede = ops.some((d) => e8[d].trab < atual[d].trab);
      const hc8 = horarioCenario('T', e8, null);
      const h8 = infoHorario(ctx, e8, null);
      const k = kParcialSemana(e8, ops);
      const uniforme8 = ctx.uniforme;
      const trabU = e8[ops[0]].trab;
      const noturno = ops.some((d) => computadas(turnoMotor('x', e8[d].ini, e8[d].trab, e8[d].intervalo)) > e8[d].trab * M.U)
        ? 'Turno com hora noturna reduzida: as horas de relógio valem mais em horas computadas, e o limite é aplicado sobre elas.' : null;
      const opBase = { pref: ctx.pref, prefP: ctx.prefP, w: 5, k: k, P: Pa, domingoComercio: ctx.domingo, rodizio: true };

      // 5x2 em rodízio (ou com folgas comuns a todos), já com a reserva de férias quando a premissa estiver ligada
      const eqMin = comporMinimo(dem, opBase);
      const rf = comFerias(ctx, dem, eqMin, opBase);
      const eqR = rf.eq;
      if (eqR) {
        quadro.minimo = rf.min; quadro.necessario = eqR.I + eqR.P; quadro.integrais = eqR.I; quadro.parciais = eqR.P; quadro.ferias = rf.r;
        const unico = !eqR.rodizioI;
        const base = uniforme8 ? '5x2 de ' + fh(trabU) : excede ? '5x2 com até 8 h por dia' : '5x2 no horário atual';
        defs.push({
          id: '5x2', nome: unico ? base : base + ' com rodízio de folgas',
          resumo: 'Cinco dias de trabalho e dois repousos por semana, até 40 h semanais. Não depende de negociação.',
          jornada: textoHorarioCenario(ctx, e8), grupos: gruposSemanais(ctx, eqR, hc8), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario), horasSemana: horasDe(eqR, e8),
          reservaFerias: rf.r, horario: h8,
          ponderacoes: [textoMudanca(h8), avisoFixo(h8), textoFerias(rf), noturno, descreverFolgas(eqR), eqR.P ? 'Tempo parcial atual mantido em ' + k + ' dias (' + diasParciais(eqR) + ').' : null,
            textoDomingo(ctx)],
          cicloSemanas: eqR.rodizioI ? eqR.folgasI.length : null, semanasGrade: semanasGrade(eqR),
        });
        // folga 1:1 aos domingos só para as mulheres (D98): rodízio próprio para elas e o comum para os demais, em vez de
        // dar a todos o domingo a cada duas semanas, o que pede mais gente e deixa sobra nos outros dias
        const eqS = ctx.art386 && dem[6] > 0 && Pa === 0 ? doisRodizios(ctx, dem, opBase) : null;
        if (eqS && eqS.W + eqS.eqM.I < eqR.I) {
          const lcm = (a, b) => { const g = (x, y) => (y ? g(y, x % y) : x); return a * b / g(a, b); };
          const ciclo = Math.min(12, lcm(eqS.eqW.rodizioI ? eqS.eqW.folgasI.length : 1, eqS.eqM.rodizioI ? eqS.eqM.folgasI.length : 1));
          defs.push({
            id: '5x2-mulheres', familia: '5x2', nome: base + ' com domingo 1:1 só para as mulheres',
            resumo: 'Cinco dias de trabalho e dois repousos por semana. As mulheres seguem um rodízio próprio, com folga num domingo e trabalho no outro; os demais, o rodízio comum. Não depende de negociação.',
            jornada: textoHorarioCenario(ctx, e8),
            grupos: [{ modo: eqS.eqW.rodizioI ? 'rodizio' : 'fixo', turnos: hc8.turnos, periodos: hc8.periodos, folgas: eqS.eqW.folgasI, pessoas: nomesPessoas(eqS.W, eqS.mulheres, 'Nova contratação', false) },
              { modo: eqS.eqM.rodizioI ? 'rodizio' : 'fixo', turnos: hc8.turnos, periodos: hc8.periodos, folgas: eqS.eqM.folgasI, pessoas: nomesPessoas(eqS.eqM.I, eqS.outros, 'Nova contratação', false) }],
            instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario), horasSemana: horasDe(eqS.eqW, e8) + horasDe(eqS.eqM, e8),
            reservaFerias: eqS.reserva, horario: h8,
            ponderacoes: [textoMudanca(h8), avisoFixo(h8),
              'Rodízio das mulheres: folga num domingo a cada duas semanas (CLT, art. 386). Demais: ' + (ctx.comercio ? 'um domingo de folga a cada três semanas (Lei 10.101/2000, art. 6º, parágrafo único).' : 'o rodízio comum.') + ' Se uma das contratações for mulher, ela entra no rodízio das mulheres e o quadro pode mudar.',
              'Pede ' + pl(eqR.I - eqS.W - eqS.eqM.I, 'pessoa', 'pessoas') + ' a menos que dar o domingo a cada duas semanas a todos.',
              eqS.reserva ? 'Inclui ' + pl(eqS.reserva, 'pessoa', 'pessoas') + ' para cobrir 30 dias de férias de cada empregado no ano.' : null, noturno],
            cicloSemanas: ciclo > 1 ? ciclo : null, semanasGrade: Math.min(Math.max(ciclo, 3), 6),
          });
        }
        if (!unico && ctx.domingo) descartar('5x2-fixas', '5x2 com folgas fixas', 'Com folgas sempre nos mesmos dias, quem trabalha aos domingos nunca folgaria num domingo, e o prazo do domingo de folga (' + (ctx.domingo === 2 ? 'folga 1:1 aos domingos para as mulheres' : 'um a cada três semanas no comércio') + ') não seria cumprido.');
        if (!unico && !ctx.domingo) {
          const eqF = compor(dem, Object.assign({}, opBase, { I: eqR.I, rodizio: false, forcar: true }));
          if (eqF) defs.push({
            id: '5x2-fixas', nome: base + ' com folgas fixas',
            resumo: 'Mesma equipe do rodízio, mas cada pessoa folga sempre nos mesmos dias. Mais simples de administrar, menos equilibrado no fim de semana.',
            jornada: textoHorarioCenario(ctx, e8), grupos: gruposSemanais(ctx, eqF, hc8), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario), horasSemana: horasDe(eqF, e8),
            reservaFerias: rf.r, horario: h8, ponderacoes: [textoMudanca(h8), textoFerias(rf), descreverFolgas(eqF)], semanasGrade: 3,
          });
        }
      }

      // 5x2 com tempo parcial: só quando o turno precisa contratar, sem tirar ninguém do quadro atual
      if (eqR && eqR.I > 1 && Ia < eqR.I && k >= 2 && Math.min.apply(null, ops.map((d) => e8[d].trab)) > 360) {
        let melhor = null;
        for (let I = Math.max(1, Ia); I < eqR.I; I++) {
          for (let P = Pa + 1; P <= Pa + 3 * Math.max.apply(null, dem) + 3; P++) {
            if (!capacidadeOk(ctx, 5 * I + k * P)) continue;
            const e = compor(dem, { pref: ctx.pref, prefP: ctx.prefP, w: 5, k: k, P: P, I: I, domingoComercio: ctx.domingo, rodizio: true });
            if (!e) continue;
            const horas = horasDe(e, e8);
            if (!melhor || horas < melhor.horas || (horas === melhor.horas && I + P < melhor.eq.I + melhor.eq.P)) melhor = { eq: e, horas: horas };
            break;
          }
        }
        if (melhor) {
          const e = melhor.eq, h5 = horasDe(eqR, e8);
          const novosI = Math.max(0, e.I - Ia), novosP = Math.max(0, e.P - Pa), nI = Math.max(0, eqR.I - Ia);
          defs.push({
            id: '5x2-parcial', nome: '5x2 com reforço em tempo parcial',
            resumo: pl(e.I, 'pessoa', 'pessoas') + ' em tempo integral (5x2) e ' + e.P + ' em tempo parcial de ' + k + ' dias por semana, nos dias de maior movimento.',
            jornada: textoHorarioCenario(ctx, e8), grupos: gruposSemanais(ctx, e, hc8), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario), horasSemana: melhor.horas, horario: h8,
            ponderacoes: [
              'Contratação: ' + (novosI ? pl(novosI, 'integral', 'integrais') + ' e ' : '') + pl(novosP, 'parcial', 'parciais') + ', em vez de ' + pl(nI, 'integral', 'integrais') + ' no 5x2 só com tempo integral.',
              melhor.horas < h5 ? 'Contrata menos horas: ' + fh(melhor.horas) + ' contra ' + fh(h5) + ' por semana.'
                : melhor.horas === h5 ? 'Mesmas horas contratadas (' + fh(h5) + ' por semana), com mais gente nos dias de pico.'
                : 'Contrata mais horas: ' + fh(melhor.horas) + ' contra ' + fh(h5) + ' por semana. Pode compensar se for difícil contratar em tempo integral.',
              ctx.exigeFerias ? 'A equipe já comporta 30 dias de férias de cada empregado no ano.' : textoFeriasHoje(ctx),
              'Tempo parcial: até 30 h semanais sem horas extras, salário proporcional e também dois repousos por semana (CLT, art. 58-A)' + (noturno ? '; no turno noturno, conta a hora reduzida.' : '.'),
              'Dias dos parciais: ' + diasParciais(e) + '.', textoMudanca(h8), avisoFixo(h8),
            ],
            semanasGrade: semanasGrade(e),
          });
        }
      }

      // 5x2 com até 8h24 na etapa de 42 h: sem norma coletiva pela liminar na ADI 8.041 (D101); sem ela, art. 7º da Emenda
      if (eqR && excede) {
        const e42 = limitarDia(ctx, 504);
        if (ops.some((d) => e42[d].trab > e8[d].trab)) {
          const h42 = infoHorario(ctx, e42, e8), lim = ctx.liminar;
          defs.push({
            id: '5x2-art7', nome: uniforme8 ? '5x2 de ' + fh(e42[ops[0]].trab) + ' até dez/2027, depois ' + fh(trabU) : '5x2 com até 8h24 por dia até dez/2027, depois 8 h',
            resumo: lim ? 'Transição em dois tempos: até 8h24 por dia na etapa de 42 h, sem norma coletiva e sem adicional, pela liminar na ADI 8.041, e até 8 h a partir de 13/12/2027.'
              : 'Transição em dois tempos: até 8h24 por dia na etapa de 42 h, por norma coletiva (Emenda Constitucional 141/2026 – Fim da 6x1, art. 7º), e até 8 h a partir de 13/12/2027.',
            jornada: textoHorarioCenario(ctx, e42, e8), grupos: gruposSemanais(ctx, eqR, horarioCenario('T', e42, e8)), instrumentos: instrumentos(lim ? [] : ['art7'], ctx.neg, ctx.turnoUsuario), negociar: lim ? [] : ['art7'],
            horasSemana: horasDe(eqR, e42), reservaFerias: rf.r, horario: h42, liminar: lim,
            ponderacoes: [
              lim ? 'A liminar na ADI 8.041 (STF, 12/11/2026) admite, sem convenção ou acordo coletivo firmado até 15/12/2026, dias de até 8h24 para distribuir as 42 h em cinco dias, sem adicional sobre os 24 minutos, até 15/12/2027. Ela vale até o julgamento de mérito pelo Plenário do STF: se não for mantida, os dias acima de 8 h voltam a depender de norma coletiva (art. 7º da Emenda).'
                : 'Pela leitura adotada, o art. 7º exige convenção ou acordo coletivo; há quem sustente que basta acordo individual de compensação.',
              'O quadro é o mesmo do 5x2 de 8 h: a vantagem é manter 42 h por pessoa até dezembro de 2027 e mudar o horário em duas etapas.',
              textoMudanca(h42), avisoFixo(h42), textoFerias(rf), descreverFolgas(eqR),
            ],
            semanasGrade: semanasGrade(eqR),
          });
        }
      }

      // 42 h com o último dia da semana mais curto (ex.: seg a qui até 8h30 e sexta menor), depois 8 h por dia
      if (eqR && excede && !eqR.rodizioI && eqR.P === 0 && new Set(eqR.folgasI.map((f) => f.join())).size === 1) {
        const trabalha = [0, 1, 2, 3, 4, 5, 6].filter((d) => eqR.folgasI[0].indexOf(d) < 0 && ctx.semana[d]);
        if (trabalha.length === 5 && trabalha.reduce((s, d) => s + atual[d].trab, 0) > 2400) {
          const ultimo = trabalha[4], eS = atual.map((x) => x && Object.assign({}, x));
          let soma = 0;
          for (const d of trabalha.slice(0, 4)) { eS[d].trab = Math.min(atual[d].trab, ajustarJornada(atual[d].ini, atual[d].intervalo, 510)); soma += eS[d].trab; }
          eS[ultimo].trab = Math.min(atual[ultimo].trab, ajustarJornada(atual[ultimo].ini, atual[ultimo].intervalo, Math.max(240, 2520 - soma)));
          const total = soma + eS[ultimo].trab;
          if (total > 2400 && total <= 2520 && eS[ultimo].trab < Math.max.apply(null, trabalha.slice(0, 4).map((d) => eS[d].trab))) {
            for (let d = 0; d < 7; d++) if (eS[d] && trabalha.indexOf(d) < 0) eS[d] = e8[d];
            const hS = infoHorario(ctx, eS, e8);
            const dia = DIAS_LONGOS[ultimo], curto = ultimo >= 5 ? 'mais curto' : 'mais curta';
            defs.push({
              id: '5x2-semana-curta', nome: '5x2 com ' + dia + ' ' + curto + ': 42 h até dez/2027, depois 40 h',
              resumo: 'Na etapa de 42 h, até 8h30 nos quatro primeiros dias e ' + fh(eS[ultimo].trab) + ' na ' + dia + '; a partir de 13/12/2027, até 8 h por dia.',
              jornada: textoHorarioCenario(ctx, eS, e8), grupos: gruposSemanais(ctx, eqR, horarioCenario('T', eS, e8)), instrumentos: instrumentos(['art7'], ctx.neg, ctx.turnoUsuario), negociar: ['art7'],
              horasSemana: horasDe(eqR, eS), reservaFerias: rf.r, horario: hS,
              ponderacoes: [
                (ctx.liminar ? 'A liminar na ADI 8.041 dispensa a norma coletiva só com dias de até 8h24; aqui há dias de até 8h30. ' : '') + 'Pela leitura adotada, distribuir mais de 40 h em cinco dias, com dias acima de 8 h, exige convenção ou acordo coletivo (Emenda Constitucional 141/2026 – Fim da 6x1, art. 7º). Pela leitura alternativa, basta acordo individual escrito de compensação.',
                'Na etapa de 40 h a mesma grade passaria do teto: por isso volta a até 8 h por dia em 13/12/2027.',
                textoMudanca(hS), avisoFixo(hS), textoFerias(rf),
              ],
              semanasGrade: 3,
            });
          }
        }
      }

      // 4x3: no horário atual quando a jornada passa de 8 h e cabe em 10 h; senão, 4 dias de 10 h
      if (ops.length < 4) descartar('4x3', '4x3', 'O turno funciona em menos de quatro dias por semana.');
      if (ops.length >= 4) {
        const maiores = ops.map((d) => atual[d].trab).sort((a, b) => b - a).slice(0, 4).reduce((s, x) => s + x, 0);
        const manter = excede && ops.every((d) => atual[d].trab <= 600 && computadas(turnoMotor('x', atual[d].ini, atual[d].trab, atual[d].intervalo)) <= 600 * M.U) && maiores <= 2400;
        let e4 = null;
        if (manter) e4 = atual;
        else if (!excede) {
          e4 = ctx.semana.map((s) => s && { ini: s.ini, trab: 600, intervalo: s.intervalo || 60 });
          if (ops.some((d) => computadas(turnoMotor('x', e4[d].ini, 600, e4[d].intervalo)) > 600 * M.U)) e4 = null;
        }
        if (!e4) descartar('4x3', '4x3', excede ? 'A jornada de hoje não cabe em quatro dias sem passar de 10 h por dia ou de 40 h por semana (limite da compensação, CLT, art. 59, § 2º).'
          : 'No turno noturno, quatro dias de 10 h passariam do limite de 10 h computadas por dia, por causa da hora noturna reduzida.');
        if (e4) {
          const op4 = { pref: ctx.pref, prefP: ctx.prefP, w: 4, k: 3, P: Pa, domingoComercio: ctx.domingo, rodizio: true };
          const rf4 = comFerias(ctx, dem, comporMinimo(dem, op4), op4);
          const eq4 = rf4.eq;
          if (!eq4) descartar('4x3', '4x3', 'Não houve equipe em 4x3 que cobrisse a necessidade de todos os dias com as folgas exigidas.');
          if (eq4) {
            const h4 = infoHorario(ctx, e4, null);
            const ivs = new Set(ops.map((d) => e4[d].intervalo));
            defs.push({
              id: '4x3', nome: manter ? '4x3 no horário atual' : '4x3 de 10 h',
              resumo: manter ? 'Mantém o horário de funcionamento: cada pessoa trabalha quatro dias no horário de hoje e folga três; a semana de cada uma fica abaixo de 40 h.'
                : 'Quatro dias de 10 h e três folgas por semana: 40 h semanais, com compensação dentro da própria semana.',
              jornada: textoHorarioCenario(ctx, e4), grupos: gruposSemanais(ctx, eq4, horarioCenario('Q', e4, null)), instrumentos: instrumentos(['comp'], ctx.neg, { intervaloMin: Math.min.apply(null, Array.from(ivs)), intervaloMax: Math.max.apply(null, Array.from(ivs)) }),
              acordos: [ACORDO_COMP], horasSemana: horasDe(eq4, e4), reservaFerias: rf4.r, horario: h4,
              ponderacoes: [
                textoMudanca(h4), avisoFixo(h4), textoFerias(rf4),
                manter ? 'Dias acima de 8 h, com a semana abaixo de 40 h: basta acordo individual escrito de compensação, porque as horas se redistribuem dentro da própria semana e todas as semanas mantêm os repousos (CLT, art. 59, § 6º; Súmula 85, I, do TST).'
                  : '10 h é o limite diário com compensação (CLT, art. 59, § 2º): não sobra margem para hora extra. Basta acordo individual escrito, porque a compensação ocorre dentro da própria semana.',
                'Em atividade insalubre, a prorrogação depende de norma coletiva que a autorize expressamente ou de autorização da Inspeção do Trabalho (Portaria MTE 2.041/2026, art. 15).',
                eqR && eq4.I > eqR.I ? 'Pede ' + pl(eq4.I - eqR.I, 'pessoa', 'pessoas') + ' a mais que o 5x2, porque cada uma trabalha um dia a menos.' : null,
                eq4.P ? 'Tempo parcial atual em 3 dias.' : null,
                descreverFolgas(eq4),
              ],
              semanasGrade: semanasGrade(eq4),
            });
          }
        }
      }

      // Mantém a janela com duas equipes de 8 h escalonadas, sempre que a jornada passa de 8 h: entra entre as opções mesmo
      // quando o 4x3 também mantém o horário, porque o simulador expõe as escalas sem escolher entre elas (D112)
      if (eqR && excede) defs.push(defEscalonado(ctx, eqR, rf));

      // Sem contratar: 5x2 com o quadro atual. Quando o funcionamento pode mudar, é um rearranjo do atendimento
      // (menos gente nos dias de menor movimento), não uma falha; quando precisa ser mantido, aparece como lacuna.
      if (eqR && Ia + Pa > 0 && Ia < eqR.I) {
        const eqS = compor(dem, { pref: ctx.pref, prefP: ctx.prefP, w: 5, k: k, P: Pa, I: Ia, domingoComercio: ctx.domingo, rodizio: true, forcar: true, protege: ctx.protege });
        if (eqS) {
          const cobre = !eqS.faltas.some((x) => x > 0);
          // menos gente nos dias fracos é pergunta própria (D95); sem resposta a ela, vale a do funcionamento, como antes
          const livre = ctx.menosGente ? ctx.menosGente !== 'nao' : ctx.funcionamento !== 'fixo';
          const nec = ctx.somaDem, ofer = dem.reduce((s, x, d) => s + Math.min(x, eqS.cobertura[d]), 0);
          const semRes = ctx.exigeFerias && !capacidadeOk(ctx, 5 * Ia + k * Pa);
          defs.push({
            id: 'sem-contratar', nome: cobre ? '5x2 com o quadro atual, sem contratar' : livre ? '5x2 com o quadro atual e menos gente em alguns dias' : '5x2 com o quadro atual, sem contratar',
            resumo: 'As mesmas ' + (Ia + Pa) + ' pessoas passam para 5x2. ' + (cobre ? 'Cobre a necessidade nas semanas normais' + (semRes ? ', mas não as férias.' : '.')
              : livre ? 'Para cumprir a Emenda Constitucional 141 (Fim da 6x1) sem contratar, o atendimento passa de ' + nec + ' para ' + ofer + ' presenças por semana, com menos gente nos dias de menor movimento.'
                : 'Atende à Emenda Constitucional 141 (Fim da 6x1), mas abre lacunas na cobertura.'),
            jornada: textoHorarioCenario(ctx, e8), grupos: gruposSemanais(ctx, eqS, hc8), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario), horasSemana: horasDe(eqS, e8), horario: h8,
            semFerias: semRes, rearranjo: livre && !cobre,
            ponderacoes: [cobre ? null : livre ? 'Rearranjo do funcionamento: serve se a operação comporta menos pessoas nesses dias, por exemplo com atendimento reduzido, fila maior ou tarefas remanejadas.'
              : 'Só faz sentido se a necessidade informada puder ser reduzida, por exemplo com mudança no horário de atendimento.',
              !cobre && livre && !ctx.menosGente && !ctx.funcionamento ? 'Confirme no passo 1 se a empresa aceita menos gente nos dias de menor movimento.' : null,
