  const PREF_FOLGA = [6, 5, 0, 4, 1, 3, 2];   // desempate na escolha das folgas: domingo, sábado, segunda…
  const PREF_FOLGA_ALT = [6, 0, 5, 1, 4, 2, 3];  // variante: domingo emendado com segunda
  const PREF_PARCIAL = [5, 6, 4, 0, 1, 2, 3]; // desempate nos dias do tempo parcial: sábado, domingo, sexta…
  const LIMITE_PARCIAL = 1800;                // 30 h semanais (CLT, art. 58-A)

  const ESCALAS_ATUAIS = {
    '6x1': { rotulo: '6x1', dias: 6 },
    '5x2': { rotulo: '5x2', dias: 5 },
    '4x3': { rotulo: '4x3', dias: 4 },
    '6x2': { rotulo: '6x2', ciclo: [1, 1, 1, 1, 1, 1, 0, 0] },
    '12x36': { rotulo: '12x36', ciclo: [1, 0], especial: '12x36' },
    'parcial': { rotulo: 'tempo parcial', dias: 3, parcial: true },
    'personalizada': { rotulo: 'escala personalizada', dias: 6, padrao: true },   // dias: só referência; o padrão do turno define
  };

  /* ================================================================ horários */

  const hm = (m) => M.fmtHora(m);
  const pl = (n, um, varios) => n + ' ' + (n === 1 ? um : varios);
  const fh = (min) => M.fmtMinutos(min);
  function duracoes(t) {
    const a = M.lerHora(t.inicio), b = M.lerHora(t.fim);
    if (a == null || b == null || a === b) return null;
    const presenca = b > a ? b - a : b + 1440 - a;
    const intervalo = Math.max(0, Math.round(Number(t.intervalo) || 0));
    if (intervalo >= presenca - 60) return null;
    return { ini: a, fim: b, presenca: presenca, intervalo: intervalo, trabalho: presenca - intervalo };
  }
  /** Turno no formato do motor, com o intervalo próximo do meio da jornada. */
  function turnoMotor(id, ini, trabalho, intervalo, tipoPausa) {
    const pres = trabalho + intervalo;
    const t = { id: id, nome: id, inicio: hm(ini), fim: hm(ini + pres), pausas: [] };
    if (intervalo > 0) {
      let off = Math.floor((pres - intervalo) / 2 / 30) * 30;
      off = Math.max(60, Math.min(off, pres - intervalo - 60));
      t.pausas.push({ inicio: hm(ini + off), duracao: intervalo, tipo: tipoPausa === 'indenizado' ? 'indenizado' : 'usufruido' });
    }
    return t;
  }
  /** Horas computadas de um turno (em unidades do motor), pela mesma medição usada na avaliação. */
  function computadas(t, especial) {
    const n = M.normalizar({ turnos: [t] }).turnos.get(t.id);
    const ctx = { cfg: Object.assign({}, M.CONFIG_PADRAO), rural: null };
    return M._interno.medir(M._interno.instanciar(n, 100000, especial || null), ctx).comp;
  }
  /** Maior jornada, em passos de 5 min, cujas horas computadas não passam do alvo (diferença só no turno noturno). */
  function ajustarJornada(ini, intervalo, alvoMin) {
    let w = alvoMin;
    while (w > 240 && computadas(turnoMotor('x', ini, w, intervalo)) > alvoMin * M.U) w -= 5;
    return w;
  }

  /* ================================================================ composição das equipes */

  /**
   * Agrupa fichas de dias (contagem por dia da semana) em grupos de `tam` dias distintos, preferindo dias vizinhos.
   * Cada grupo inclui obrigatoriamente os dias cuja contagem restante iguala o número de grupos restantes, o que
   * garante a conclusão sempre que nenhum dia tenha mais fichas do que o número de grupos.
   */
  function agrupar(cont, tam, pref) {
    const ordem = pref || PREF_FOLGA;
    const rest = cont.slice();
    const total = rest.reduce((s, x) => s + x, 0);
    if (tam <= 0) return [];
    const G = total / tam;
    if (!Number.isInteger(G) || rest.some((x) => x > G || x < 0)) return null;
    const grupos = [];
    for (let g = G; g > 0; g--) {
      const sel = new Set();
      for (let d = 0; d < 7; d++) if (rest[d] === g) sel.add(d);
      if (sel.size > tam) return null;
      if (!sel.size) {
        let best = -1;
        for (const d of ordem) if (rest[d] > 0 && (best < 0 || rest[d] > rest[best])) best = d;
        sel.add(best);
      }
      while (sel.size < tam) {
        let best = -1, viz = false;
        for (const d of ordem) {
          if (sel.has(d) || rest[d] <= 0) continue;
          const v = sel.has((d + 1) % 7) || sel.has((d + 6) % 7);
          if (best < 0 || (v && !viz) || (v === viz && rest[d] > rest[best])) { best = d; viz = v; }
        }
        if (best < 0) return null;
        sel.add(best);
      }
      for (const d of sel) rest[d]--;
      grupos.push(Array.from(sel).sort((a, b) => a - b));
    }
    return grupos;
  }

  /**
   * Ordena padrões semanais de folga num rodízio cíclico: cada pessoa percorre todos os padrões, uma semana em cada.
   * Entre uma semana e a seguinte, a primeira folga da semana seguinte não pode vir depois da última folga da semana
   * atual, o que limita a sequência de trabalho a 6 dias. Com `domingo`, exige folga no domingo em toda janela de
   * três semanas (Lei 10.101/2000, art. 6º, parágrafo único).
   */
  /** Alternativa ao agrupamento por vizinhança: a pessoa j recebe as fichas j, j + G, j + 2G… (dias espalhados). */
  function agruparEspalhado(cont, tam) {
    const total = cont.reduce((s, x) => s + x, 0);
    const G = total / tam;
    if (!Number.isInteger(G) || cont.some((x) => x > G)) return null;
    const fichas = [];
    for (const d of [5, 6, 0, 1, 2, 3, 4]) for (let q = 0; q < cont[d]; q++) fichas.push(d);
    const out = [];
    for (let j = 0; j < G; j++) { const s = []; for (let q = 0; q < tam; q++) s.push(fichas[j + q * G]); out.push(s.sort((a, b) => a - b)); }
    return out;
  }

  const pF = (f) => (f.length ? f[0] : 7);
  const pL = (f) => (f.length ? f[f.length - 1] : -1);
  /**
   * Janela do domingo de folga, em semanas: 3 no comércio (Lei 10.101/2000, art. 6º, parágrafo único), 2 com mulheres no
   * turno (CLT, art. 386, que o TST aplica também no comércio; D83), 0 sem exigência. `true` vale 3, por compatibilidade.
   */
  const janelaDom = (domingo) => (domingo === true ? 3 : Math.max(0, domingo | 0));
  /** Confere um rodízio cíclico: sequência máxima de 6 dias e, se pedido, domingo de folga em toda janela de J semanas. */
  function rodizioValido(seq, domingo) {
    const N = seq.length, J = janelaDom(domingo);
    if (!N) return true;
    for (let i = 0; i < N; i++) if (pF(seq[(i + 1) % N]) > pL(seq[i])) return false;
    if (J) {
      const dom = (i) => seq[((i % N) + N) % N].indexOf(6) >= 0;
      if (!seq.some((f, i) => dom(i))) return false;
      for (let i = 0; i < N; i++) { let ok = false; for (let j = 0; j < J && !ok; j++) ok = dom(i + j); if (!ok) return false; }
    }
    return true;
  }
  /**
   * Construção direta: os padrões com folga no domingo podem ser seguidos por qualquer outro; os demais, ordenados
   * pela primeira folga em ordem decrescente, encadeiam-se entre si. A sequência alterna um padrão com domingo e um
   * trecho dos demais (no máximo dois, se o domingo for obrigatório a cada três semanas), e cada trecho termina antes
   * de um padrão com domingo cuja primeira folga não venha depois da última folga do trecho.
   */
  function construirRodizio(folgas, domingo) {
    const S = folgas.filter((f) => f.indexOf(6) >= 0), O = folgas.filter((f) => f.indexOf(6) < 0);
    O.sort((a, b) => (pF(b) - pF(a)) || (pL(b) - pL(a)));
    if (!S.length) return domingo ? null : (rodizioValido(O, false) ? O : null);
    if (janelaDom(domingo) && O.length > (janelaDom(domingo) - 1) * S.length) return null;
    const n = S.length, trechos = [];
    let i0 = 0;
    for (let i = 0; i < n; i++) { const tam = Math.floor(O.length / n) + (i < O.length % n ? 1 : 0); trechos.push(O.slice(i0, i0 + tam)); i0 += tam; }
    const fimTrecho = (t) => (t.length ? pL(t[t.length - 1]) : 6);
    const ordT = trechos.map((t, i) => i).sort((a, b) => fimTrecho(trechos[a]) - fimTrecho(trechos[b]));
    const ordS = S.slice().sort((a, b) => pF(a) - pF(b));
    const seq = [];
    for (let q = 0; q < n; q++) {
      const t = trechos[ordT[q]];
      if (pF(ordS[q]) > fimTrecho(t)) return null;
      seq.push.apply(seq, t); seq.push(ordS[q]);
    }
    return rodizioValido(seq, domingo) ? seq : null;
  }

  function ordenarRodizio(folgas, domingo) {
    const N = folgas.length;
    if (N <= 1) return (!domingo || !N || folgas[0].indexOf(6) >= 0) ? folgas.slice() : null;
    const direto = construirRodizio(folgas, domingo);
    if (direto) return direto;
    const tipos = new Map();
    for (const f of folgas) { const k = f.join(','); if (!tipos.has(k)) tipos.set(k, { f: f, n: 0 }); tipos.get(k).n++; }
    const T = Array.from(tipos.values()).map((x) => ({ f: x.f, n: x.n, F: x.f.length ? x.f[0] : 7, L: x.f.length ? x.f[x.f.length - 1] : -1, dom: x.f.indexOf(6) >= 0 }));
    const seq = [];
    let nos = 0;
    const J = janelaDom(domingo);
    const janelaOk = () => {
      if (!J) return true;
      const n = seq.length;
      if (n < J) return true;
      for (let j = 1; j <= J; j++) if (seq[n - j].dom) return true;
      return false;
    };
    const fecha = () => {
      if (seq[0].F > seq[N - 1].L) return false;
      if (J) {
        if (!seq.some((t) => t.dom)) return false;
        const w = (i) => seq[((i % N) + N) % N].dom;
        for (let i = N - J + 1; i <= N; i++) { let ok = false; for (let j = 0; j < J && !ok; j++) ok = w(i + j); if (!ok) return false; }
      }
      return true;
    };
    function dfs() {
      if (++nos > 50000) return false;
      if (seq.length === N) return fecha();
      const ult = seq[seq.length - 1];
      const n = seq.length;
      let precisaDom = !!J && n >= J - 1;
      for (let j = 1; precisaDom && j <= J - 1; j++) if (seq[n - j].dom) precisaDom = false;
      const cands = T.filter((t) => t.n > 0 && t.F <= ult.L && (!precisaDom || t.dom)).sort((a, b) => (a.dom - b.dom) || (b.F - a.F) || (b.n - a.n));
      for (const t of cands) {
        t.n--; seq.push(t);
        if (janelaOk() && dfs()) return true;
        seq.pop(); t.n++;
      }
      return false;
    }
    const inicio = T.slice().sort((a, b) => (b.dom - a.dom) || (b.L - a.L));
    for (const t0 of inicio) {
      t0.n--; seq.push(t0);
      if (dfs()) return seq.map((t) => t.f);
      seq.pop(); t0.n++;
    }
    return null;
  }

  function teto(a, b) { return Math.ceil(a / b); }
  /** Ponderação do domingo de folga nos rodízios (null quando não há exigência). */
  const textoDomingo = (ctx) => (ctx.domingo === 2 ? 'Com mulheres no turno, folga 1:1 aos domingos: cada pessoa folga ao menos um domingo a cada duas semanas, também no comércio.'
    : ctx.domingo ? 'Comércio: cada pessoa folga ao menos um domingo a cada três semanas.' : null);
  function cobrir(padroesFolga) {
    const c = [0, 0, 0, 0, 0, 0, 0];
    for (const f of padroesFolga) for (let d = 0; d < 7; d++) if (f.indexOf(d) < 0) c[d]++;
    return c;
  }

  /**
   * Monta uma equipe de I integrais (w dias por semana) e P parciais (k dias por semana).
   * Os parciais vão para os dias de maior necessidade; os integrais cobrem o restante.
   * op: { w, k, I (fixo ou nulo para o mínimo), P, domingoComercio, forcar, rodizio }
   * Sem `forcar`, devolve null se a equipe não cobre a necessidade ou se o rodízio não fecha.
   */
  function compor(dem, op) {
    const w = op.w, k = op.k || 0, P = op.P || 0, J = janelaDom(op.domingoComercio), dom = J > 0;
    const ordemF = op.pref || PREF_FOLGA, ordemP = op.prefP || PREF_PARCIAL, protege = op.protege || null;
    // 1. dias dos parciais
    const pd = [0, 0, 0, 0, 0, 0, 0];
    if (P > 0) {
      if (!(k >= 1 && k <= 6)) return null;
      const cap = [P, P, P, P, P, P, dom ? P - teto(P, J) : P];
      for (let t = 0; t < P * k; t++) {
        let best = -1;
        for (const d of ordemP) if (pd[d] < cap[d] && (best < 0 || dem[d] - pd[d] > dem[best] - pd[best])) best = d;
        if (best < 0) return null;
        pd[best]++;
      }
    }
    const resid = dem.map((r, d) => Math.max(0, r - pd[d]));
    const soma = resid.reduce((s, x) => s + x, 0);
    const domI = dom && resid[6] > 0;
    // 2. quantidade de integrais
    let I = op.I;
    if (I == null) {
      I = soma ? Math.max(Math.max.apply(null, resid), teto(soma, w)) : 0;
      if (domI) while (I - resid[6] < teto(I, J)) I++;
    }
    if (!op.forcar && (Math.max.apply(null, resid) > I || soma > w * I)) return null;
    // 3. folgas dos integrais
    const off = 7 - w;
    const c = [0, 0, 0, 0, 0, 0, 0];
    if (I > 0) {
      if (domI) {
        c[6] = Math.min(I, teto(I, J));
        if (!op.forcar && I - resid[6] < c[6]) return null;
      }
      for (let t = c[6]; t < off * I; t++) {
        let best = -1;
        for (const d of ordemF) {
          if (c[d] >= I) continue;
          const s = I - resid[d] - c[d];
          if (!op.forcar && s <= 0) continue;
          if (best < 0 || s > I - resid[best] - c[best]) best = d;
        }
        if (best < 0) return null;
        // equipe insuficiente (forcar) com dias de maior movimento protegidos: a falta vai para um dia de menor movimento,
        // desde que ele não perca mais da metade da necessidade
        if (op.forcar && protege && protege.indexOf(best) >= 0 && I - resid[best] - c[best] <= 0) {
          let alt = -1;
          for (const d of ordemF) {
            if (c[d] >= I || protege.indexOf(d) >= 0 || !(resid[d] > 0)) continue;
            if (c[d] + 1 - (I - resid[d]) > Math.floor(resid[d] / 2)) continue;
            if (alt < 0 || I - resid[d] - c[d] > I - resid[alt] - c[alt]) alt = d;
          }
          if (alt >= 0) best = alt;
        }
        c[best]++;
      }
    }
    let folgasI = I > 0 ? agrupar(c, off, op.pref) : [];
    let folgasP = [];
    if (P > 0) {
      const g = agrupar(pd, k, op.prefP);
      if (!g) return null;
      folgasP = g.map((dias) => [0, 1, 2, 3, 4, 5, 6].filter((d) => dias.indexOf(d) < 0));
    }
    if (!folgasI) return null;
    // 4. rodízio. Fora do comércio é opcional: se não fechar, as folgas ficam fixas por pessoa. No comércio, quem trabalha
    // aos domingos precisa dele para folgar um domingo a cada três semanas.
    const varia = (l) => new Set(l.map((f) => f.join())).size > 1;
    let rodI = false, rodP = false;
    if (op.rodizio && varia(folgasI)) {
      let r = ordenarRodizio(folgasI, domI ? J : 0);
      for (const alt of [agrupar(c, off, PREF_FOLGA_ALT), agruparEspalhado(c, off)]) { if (r) break; if (alt) r = ordenarRodizio(alt, domI ? J : 0); }
      if (r) { folgasI = r; rodI = true; } else if (domI && !op.forcar) return null;
    } else if (domI && folgasI.some((f) => f.indexOf(6) < 0) && !op.forcar) return null;
    if (dom && P > 0 && pd[6] > 0) {
      const r = varia(folgasP) ? ordenarRodizio(folgasP, J) : null;
      if (r) { folgasP = r; rodP = true; } else if (!op.forcar) return null;
    }
    const cob = cobrir(folgasI.concat(folgasP));
    return { I: I, P: P, w: w, k: k, folgasI: folgasI, folgasP: folgasP, rodizioI: rodI, rodizioP: rodP, diasParciais: pd, cobertura: cob, faltas: dem.map((r, d) => Math.max(0, r - cob[d])) };
  }

  /** Menor equipe viável a partir do mínimo teórico, com até `folga` integrais a mais. */
  function comporMinimo(dem, op, folga) {
    const base = compor(dem, Object.assign({}, op, { I: null, forcar: true }));
    const I0 = base ? base.I : 0;
    for (let I = I0; I <= I0 + (folga == null ? 3 : folga); I++) {
      const e = compor(dem, Object.assign({}, op, { I: I, forcar: false }));
      if (e) return e;
    }
    return null;
  }

  /* ================================================================ montagem para o motor */

  function iso(z) { const c = M.civil(z); return c.a + '-' + String(c.m).padStart(2, '0') + '-' + String(c.d).padStart(2, '0'); }
  /** Dias de uma semana do padrão: o turno do dia (um id para todos os dias ou um por dia da semana) ou folga. */
  function diasDoPadrao(folga, idTurno) {
    const a = [];
    for (let d = 0; d < 7; d++) { const id = Array.isArray(idTurno) ? idTurno[d] : idTurno; a.push(folga.indexOf(d) >= 0 || !id ? null : id); }
    return a;
  }

  /**
   * Converte grupos de pessoas em entrada do motor.
   * grupo: { modo: 'fixo'|'rodizio'|'ciclo', turnos: [turno no formato do motor], periodos: [{turno, inicio}], folgas, ciclo,
   *          especial, deslocamentos, pessoas: [{id, nome, parcial}] }
   */
  /** Avalia no motor com a chave da liminar na ADI 8.041 (D100): ligada, salvo op.liminar === false. */
  function avaliarM(entrada, op) { return M.avaliar(entrada, { liminar: !(op && op.liminar === false) }); }
  function montarEntrada(grupos, janela, opcoes) {
    const o = opcoes || {};
    const turnos = new Map(), escalas = [], empregados = [], atribuicoes = [];
    let ne = 0;
    for (const g of grupos) {
      for (const t of g.turnos) turnos.set(t.id, t);
      const periodos = g.periodos || [{ turno: g.turnos[0].id, inicio: JANELA1.inicio }];
      g.pessoas.forEach((p, j) => {
        empregados.push(Object.assign({ id: p.id, nome: p.nome || p.id, admissao: '2020-01-01', setor: o.setor || 'S' }, p.parcial ? { tipo: 'parcial' } : {}, p.art386 ? { art386: true } : {}));
        periodos.forEach((per, q) => {
          const fim = periodos[q + 1] ? iso(M.lerData(periodos[q + 1].inicio) - 1) : undefined;
          const id = 'E' + (ne++);
          if (g.modo === 'ciclo') {
            // preâmbulo (D99): semanas de 5x2 antes de o ciclo começar, para o mês parcial de dezembro de 2026
            let iniC = per.inicio;
            if (g.preambulo && q === 0 && per.inicio < g.preambulo.desde && (!fim || fim >= g.preambulo.desde)) {
              const idP = 'E' + (ne++);
              escalas.push({ id: idP, tipo: 'semanal', dias: diasDoPadrao(g.preambulo.folgas[j] || [], per.turno), trabalhaFeriados: true });
              atribuicoes.push({ empregado: p.id, escala: idP, inicio: per.inicio, fim: iso(M.lerData(g.preambulo.desde) - 1) });
              iniC = g.preambulo.desde;
            }
            escalas.push({ id: id, tipo: 'ciclo', dias: g.ciclo.map((x) => (x ? per.turno : null)), especial: g.especial || null, trabalhaFeriados: true });
            atribuicoes.push({ empregado: p.id, escala: id, inicio: iniC, fim: fim, ancora: iso(D_ANCORA - (g.deslocamentos ? g.deslocamentos[j] : j)) });
          } else if (g.modo === 'padrao') {
            // ciclo de N semanas informado dia a dia; com revezamento, cada pessoa começa numa semana diferente
            const N = g.dias.length / 7, anc = g.ancora ? M.lerData(g.ancora) : D_ANCORA;
            escalas.push({ id: id, tipo: 'semanal', dias: g.dias.slice(), trabalhaFeriados: true });
            atribuicoes.push({ empregado: p.id, escala: id, inicio: per.inicio, fim: fim, ancora: iso(anc - 7 * (g.revezar ? j % N : 0)) });
          } else if (g.modo === 'rodizio') {
            escalas.push({ id: id, tipo: 'semanal', dias: [].concat.apply([], g.folgas.map((f) => diasDoPadrao(f, per.turno))), trabalhaFeriados: true });
            atribuicoes.push({ empregado: p.id, escala: id, inicio: per.inicio, fim: fim, ancora: iso(D_ANCORA - 7 * j) });
          } else {
            escalas.push({ id: id, tipo: 'semanal', dias: diasDoPadrao(g.folgas[j], per.turno), trabalhaFeriados: true });
            atribuicoes.push({ empregado: p.id, escala: id, inicio: per.inicio, fim: fim });
          }
        });
      });
    }
    return {
      empresa: { atividade: o.atividade || 'servicos' }, horizonte: { inicio: janela.inicio, fim: janela.fim }, feriados: [],
      turnos: Array.from(turnos.values()), escalas: escalas, empregados: empregados, atribuicoes: atribuicoes, excecoes: [],
      instrumentos: o.instrumentos || [],
    };
  }

  /* ================================================================ leitura dos resultados */

  const MOTIVO = {
    R1: 'menos de dois repousos semanais', R2: 'repousos abaixo da média mensal exigida', R3: 'sete ou mais dias seguidos de trabalho',
    R4: 'domingo de repouso fora do prazo (a cada três semanas no comércio; folga 1:1 aos domingos para as mulheres)', R5: 'menos de 11 h entre uma jornada e outra', R6: 'intervalo de refeição fora do padrão legal',
    R7: 'feriado trabalhado sem compensação', R8: 'turno de revezamento acima do limite', R9: 'regra de menor ou aprendiz', R14: 'tempo parcial acima de 30 h',
    J1: 'jornada acima de 8 h sem acordo de compensação', J2: 'jornada diária acima de 10 h', J3: 'semana acima do teto constitucional', J4: 'horas acima do teto no saldo do mês',
    J5: 'banco de horas sem saldo zerado', J6: 'média semanal da 12x36 acima do teto',
  };
  function noEtapa(a, etapa) {
    if (!a.periodo) return false;

            resumo: 'Cinco dias de trabalho e dois repousos por semana. As mulheres seguem um rodízio próprio, com folga num domingo e trabalho no outro; os demais, o rodízio comum. Não depende de negociação.',
            jornada: textoHorarioCenario(ctx, e8),
            grupos: [{ modo: eqS.eqW.rodizioI ? 'rodizio' : 'fixo', turnos: hc8.turnos, periodos: hc8.periodos, folgas: eqS.eqW.folgasI, pessoas: nomesPessoas(eqS.W, eqS.mulheres, 'Nova contratação', false) },
              { modo: eqS.eqM.rodizioI ? 'rodizio' : 'fixo', turnos: hc8.turnos, periodos: hc8.periodos, folgas: eqS.eqM.folgasI, pessoas: nomesPessoas(eqS.eqM.I, eqS.outros, 'Nova contratação', false) }],
            instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario), horasSemana: horasDe(eqS.eqW, e8) + horasDe(eqS.eqM, e8),
            reservaFerias: eqS.reserva, horario: h8,
            ponderacoes: [textoMudanca(h8), avisoFixo(h8),
              'Rodízio das mulheres: folga num domingo a cada duas semanas (CLT, art. 386). Demais: ' + (ctx.comercio ? 'um domingo de folga a cada três semanas (Lei 10.101/2000, art. 6º, parágrafo único).' : 'o rodízio comum.') + ' Se uma das contratações for mulher, ela entra no rodízio das mulheres e o quadro pode mudar.',
              'Pede ' + pl(eqR.I - eqS.W - eqS.eqM.I, 'pessoa', 'pessoas') + ' a menos que dar o domingo a cada duas semanas a todos.',
              eqS.reserva ? 'Inclui ' + pl(eqS.reserva, 'pessoa', 'pessoas') + ' para cobrir 30 dias de férias de cada empregado no ano.' : null, noturno],
            cicloSemanas: ciclo > 1 ? ciclo : null, semanasGrade: Math.min(Math.max(ciclo, 3), 6),
          });
        }
        if (!unico && ctx.domingo) descartar('5x2-fixas', '5x2 com folgas fixas', 'Com folgas sempre nos mesmos dias, quem trabalha aos domingos nunca folgaria num domingo, e o prazo do domingo de folga (' + (ctx.domingo === 2 ? 'folga 1:1 aos domingos para as mulheres' : 'um a cada três semanas no comércio') + ') não seria cumprido.');
        if (!unico && !ctx.domingo) {
          const eqF = compor(dem, Object.assign({}, opBase, { I: eqR.I, rodizio: false, forcar: true }));
          if (eqF) defs.push({
            id: '5x2-fixas', nome: base + ' com folgas fixas',
            resumo: 'Mesma equipe do rodízio, mas cada pessoa folga sempre nos mesmos dias. Mais simples de administrar, menos equilibrado no fim de semana.',
            jornada: textoHorarioCenario(ctx, e8), grupos: gruposSemanais(ctx, eqF, hc8), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario), horasSemana: horasDe(eqF, e8),
            reservaFerias: rf.r, horario: h8, ponderacoes: [textoMudanca(h8), textoFerias(rf), descreverFolgas(eqF)], semanasGrade: 3,
          });
        }
      }

      // 5x2 com tempo parcial: só quando o turno precisa contratar, sem tirar ninguém do quadro atual
      if (eqR && eqR.I > 1 && Ia < eqR.I && k >= 2 && Math.min.apply(null, ops.map((d) => e8[d].trab)) > 360) {
        let melhor = null;
        for (let I = Math.max(1, Ia); I < eqR.I; I++) {
          for (let P = Pa + 1; P <= Pa + 3 * Math.max.apply(null, dem) + 3; P++) {
            if (!capacidadeOk(ctx, 5 * I + k * P)) continue;
            const e = compor(dem, { pref: ctx.pref, prefP: ctx.prefP, w: 5, k: k, P: P, I: I, domingoComercio: ctx.domingo, rodizio: true });
            if (!e) continue;
            const horas = horasDe(e, e8);
            if (!melhor || horas < melhor.horas || (horas === melhor.horas && I + P < melhor.eq.I + melhor.eq.P)) melhor = { eq: e, horas: horas };
            break;
          }
        }
        if (melhor) {
          const e = melhor.eq, h5 = horasDe(eqR, e8);
          const novosI = Math.max(0, e.I - Ia), novosP = Math.max(0, e.P - Pa), nI = Math.max(0, eqR.I - Ia);
          defs.push({
            id: '5x2-parcial', nome: '5x2 com reforço em tempo parcial',
            resumo: pl(e.I, 'pessoa', 'pessoas') + ' em tempo integral (5x2) e ' + e.P + ' em tempo parcial de ' + k + ' dias por semana, nos dias de maior movimento.',
            jornada: textoHorarioCenario(ctx, e8), grupos: gruposSemanais(ctx, e, hc8), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario), horasSemana: melhor.horas, horario: h8,
            ponderacoes: [
              'Contratação: ' + (novosI ? pl(novosI, 'integral', 'integrais') + ' e ' : '') + pl(novosP, 'parcial', 'parciais') + ', em vez de ' + pl(nI, 'integral', 'integrais') + ' no 5x2 só com tempo integral.',
              melhor.horas < h5 ? 'Contrata menos horas: ' + fh(melhor.horas) + ' contra ' + fh(h5) + ' por semana.'
                : melhor.horas === h5 ? 'Mesmas horas contratadas (' + fh(h5) + ' por semana), com mais gente nos dias de pico.'
                : 'Contrata mais horas: ' + fh(melhor.horas) + ' contra ' + fh(h5) + ' por semana. Pode compensar se for difícil contratar em tempo integral.',
              ctx.exigeFerias ? 'A equipe já comporta 30 dias de férias de cada empregado no ano.' : textoFeriasHoje(ctx),
              'Tempo parcial: até 30 h semanais sem horas extras, salário proporcional e também dois repousos por semana (CLT, art. 58-A)' + (noturno ? '; no turno noturno, conta a hora reduzida.' : '.'),
              'Dias dos parciais: ' + diasParciais(e) + '.', textoMudanca(h8), avisoFixo(h8),
            ],
            semanasGrade: semanasGrade(e),
          });
        }
      }

      // 5x2 com até 8h24 na etapa de 42 h: sem norma coletiva pela liminar na ADI 8.041 (D101); sem ela, art. 7º da Emenda
      if (eqR && excede) {
        const e42 = limitarDia(ctx, 504);
        if (ops.some((d) => e42[d].trab > e8[d].trab)) {
          const h42 = infoHorario(ctx, e42, e8), lim = ctx.liminar;
          defs.push({
            id: '5x2-art7', nome: uniforme8 ? '5x2 de ' + fh(e42[ops[0]].trab) + ' até dez/2027, depois ' + fh(trabU) : '5x2 com até 8h24 por dia até dez/2027, depois 8 h',
            resumo: lim ? 'Transição em dois tempos: até 8h24 por dia na etapa de 42 h, sem norma coletiva e sem adicional, pela liminar na ADI 8.041, e até 8 h a partir de 13/12/2027.'
              : 'Transição em dois tempos: até 8h24 por dia na etapa de 42 h, por norma coletiva (Emenda Constitucional 141/2026 – Fim da 6x1, art. 7º), e até 8 h a partir de 13/12/2027.',
            jornada: textoHorarioCenario(ctx, e42, e8), grupos: gruposSemanais(ctx, eqR, horarioCenario('T', e42, e8)), instrumentos: instrumentos(lim ? [] : ['art7'], ctx.neg, ctx.turnoUsuario), negociar: lim ? [] : ['art7'],
            horasSemana: horasDe(eqR, e42), reservaFerias: rf.r, horario: h42, liminar: lim,
            ponderacoes: [
              lim ? 'A liminar na ADI 8.041 (STF, 12/11/2026) admite, sem convenção ou acordo coletivo firmado até 15/12/2026, dias de até 8h24 para distribuir as 42 h em cinco dias, sem adicional sobre os 24 minutos, até 15/12/2027. Ela ainda vai a referendo do Plenário: se não for confirmada, os dias acima de 8 h voltam a depender de norma coletiva (art. 7º da Emenda).'
                : 'Pela leitura adotada, o art. 7º exige convenção ou acordo coletivo; há quem sustente que basta acordo individual de compensação.',
              'O quadro é o mesmo do 5x2 de 8 h: a vantagem é manter 42 h por pessoa até dezembro de 2027 e mudar o horário em duas etapas.',
              textoMudanca(h42), avisoFixo(h42), textoFerias(rf), descreverFolgas(eqR),
            ],
            semanasGrade: semanasGrade(eqR),
          });
        }
      }

      // 42 h com o último dia da semana mais curto (ex.: seg a qui até 8h30 e sexta menor), depois 8 h por dia
      if (eqR && excede && !eqR.rodizioI && eqR.P === 0 && new Set(eqR.folgasI.map((f) => f.join())).size === 1) {
        const trabalha = [0, 1, 2, 3, 4, 5, 6].filter((d) => eqR.folgasI[0].indexOf(d) < 0 && ctx.semana[d]);
        if (trabalha.length === 5 && trabalha.reduce((s, d) => s + atual[d].trab, 0) > 2400) {
          const ultimo = trabalha[4], eS = atual.map((x) => x && Object.assign({}, x));
          let soma = 0;
          for (const d of trabalha.slice(0, 4)) { eS[d].trab = Math.min(atual[d].trab, ajustarJornada(atual[d].ini, atual[d].intervalo, 510)); soma += eS[d].trab; }
          eS[ultimo].trab = Math.min(atual[ultimo].trab, ajustarJornada(atual[ultimo].ini, atual[ultimo].intervalo, Math.max(240, 2520 - soma)));
          const total = soma + eS[ultimo].trab;
          if (total > 2400 && total <= 2520 && eS[ultimo].trab < Math.max.apply(null, trabalha.slice(0, 4).map((d) => eS[d].trab))) {
            for (let d = 0; d < 7; d++) if (eS[d] && trabalha.indexOf(d) < 0) eS[d] = e8[d];
            const hS = infoHorario(ctx, eS, e8);
            const dia = DIAS_LONGOS[ultimo], curto = ultimo >= 5 ? 'mais curto' : 'mais curta';
            defs.push({
              id: '5x2-semana-curta', nome: '5x2 com ' + dia + ' ' + curto + ': 42 h até dez/2027, depois 40 h',
              resumo: 'Na etapa de 42 h, até 8h30 nos quatro primeiros dias e ' + fh(eS[ultimo].trab) + ' na ' + dia + '; a partir de 13/12/2027, até 8 h por dia.',
              jornada: textoHorarioCenario(ctx, eS, e8), grupos: gruposSemanais(ctx, eqR, horarioCenario('T', eS, e8)), instrumentos: instrumentos(['art7'], ctx.neg, ctx.turnoUsuario), negociar: ['art7'],
              horasSemana: horasDe(eqR, eS), reservaFerias: rf.r, horario: hS,
              ponderacoes: [
                (ctx.liminar ? 'A liminar na ADI 8.041 dispensa a norma coletiva só com dias de até 8h24; aqui há dias de até 8h30. ' : '') + 'Pela leitura adotada, distribuir mais de 40 h em cinco dias, com dias acima de 8 h, exige convenção ou acordo coletivo (Emenda Constitucional 141/2026 – Fim da 6x1, art. 7º). Pela leitura alternativa, basta acordo individual escrito de compensação.',
                'Na etapa de 40 h a mesma grade passaria do teto: por isso volta a até 8 h por dia em 13/12/2027.',
                textoMudanca(hS), avisoFixo(hS), textoFerias(rf),
              ],
              semanasGrade: 3,
            });
          }
        }
      }

      // 4x3: no horário atual quando a jornada passa de 8 h e cabe em 10 h; senão, 4 dias de 10 h
      if (ops.length < 4) descartar('4x3', '4x3', 'O turno funciona em menos de quatro dias por semana.');
      if (ops.length >= 4) {
        const maiores = ops.map((d) => atual[d].trab).sort((a, b) => b - a).slice(0, 4).reduce((s, x) => s + x, 0);
        const manter = excede && ops.every((d) => atual[d].trab <= 600 && computadas(turnoMotor('x', atual[d].ini, atual[d].trab, atual[d].intervalo)) <= 600 * M.U) && maiores <= 2400;
        let e4 = null;
        if (manter) e4 = atual;
        else if (!excede) {
          e4 = ctx.semana.map((s) => s && { ini: s.ini, trab: 600, intervalo: s.intervalo || 60 });
          if (ops.some((d) => computadas(turnoMotor('x', e4[d].ini, 600, e4[d].intervalo)) > 600 * M.U)) e4 = null;
        }
        if (!e4) descartar('4x3', '4x3', excede ? 'A jornada de hoje não cabe em quatro dias sem passar de 10 h por dia ou de 40 h por semana (limite da compensação, CLT, art. 59, § 2º).'
          : 'No turno noturno, quatro dias de 10 h passariam do limite de 10 h computadas por dia, por causa da hora noturna reduzida.');
        if (e4) {
          const op4 = { pref: ctx.pref, prefP: ctx.prefP, w: 4, k: 3, P: Pa, domingoComercio: ctx.domingo, rodizio: true };
          const rf4 = comFerias(ctx, dem, comporMinimo(dem, op4), op4);
          const eq4 = rf4.eq;
          if (!eq4) descartar('4x3', '4x3', 'Não houve equipe em 4x3 que cobrisse a necessidade de todos os dias com as folgas exigidas.');
          if (eq4) {
            const h4 = infoHorario(ctx, e4, null);
            const ivs = new Set(ops.map((d) => e4[d].intervalo));
            defs.push({
              id: '4x3', nome: manter ? '4x3 no horário atual' : '4x3 de 10 h',
              resumo: manter ? 'Mantém o horário de funcionamento: cada pessoa trabalha quatro dias no horário de hoje e folga três; a semana de cada uma fica abaixo de 40 h.'
                : 'Quatro dias de 10 h e três folgas por semana: 40 h semanais, com compensação dentro da própria semana.',
              jornada: textoHorarioCenario(ctx, e4), grupos: gruposSemanais(ctx, eq4, horarioCenario('Q', e4, null)), instrumentos: instrumentos(['comp'], ctx.neg, { intervaloMin: Math.min.apply(null, Array.from(ivs)), intervaloMax: Math.max.apply(null, Array.from(ivs)) }),
              acordos: [ACORDO_COMP], horasSemana: horasDe(eq4, e4), reservaFerias: rf4.r, horario: h4,
              ponderacoes: [
                textoMudanca(h4), avisoFixo(h4), textoFerias(rf4),
                manter ? 'Dias acima de 8 h, com a semana abaixo de 40 h: basta acordo individual escrito de compensação, porque as horas se redistribuem dentro da própria semana e todas as semanas mantêm os repousos (CLT, art. 59, § 6º; Súmula 85, I, do TST).'
                  : '10 h é o limite diário com compensação (CLT, art. 59, § 2º): não sobra margem para hora extra. Basta acordo individual escrito, porque a compensação ocorre dentro da própria semana.',
                'Em atividade insalubre, a prorrogação depende de licença prévia (CLT, art. 60), salvo norma coletiva (art. 611-A, XIII).',
                eqR && eq4.I > eqR.I ? 'Pede ' + pl(eq4.I - eqR.I, 'pessoa', 'pessoas') + ' a mais que o 5x2, porque cada uma trabalha um dia a menos.' : null,
                eq4.P ? 'Tempo parcial atual em 3 dias.' : null,
                descreverFolgas(eq4),
              ],
              semanasGrade: semanasGrade(eq4),
            });
          }
        }
      }

      // Mantém a janela com duas equipes de 8 h escalonadas (quando a jornada passa de 8 h e o 4x3 não cabe)
      if (eqR && excede && !defs.some((x) => x.id === '4x3' && !x.horario.muda)) defs.push(defEscalonado(ctx, eqR, rf));

      // Sem contratar: 5x2 com o quadro atual. Quando o funcionamento pode mudar, é um rearranjo do atendimento
      // (menos gente nos dias de menor movimento), não uma falha; quando precisa ser mantido, aparece como lacuna.
      if (eqR && Ia + Pa > 0 && Ia < eqR.I) {
        const eqS = compor(dem, { pref: ctx.pref, prefP: ctx.prefP, w: 5, k: k, P: Pa, I: Ia, domingoComercio: ctx.domingo, rodizio: true, forcar: true, protege: ctx.protege });
        if (eqS) {
          const cobre = !eqS.faltas.some((x) => x > 0);
          // menos gente nos dias fracos é pergunta própria (D95); sem resposta a ela, vale a do funcionamento, como antes
          const livre = ctx.menosGente ? ctx.menosGente !== 'nao' : ctx.funcionamento !== 'fixo';
          const nec = ctx.somaDem, ofer = dem.reduce((s, x, d) => s + Math.min(x, eqS.cobertura[d]), 0);
          const semRes = ctx.exigeFerias && !capacidadeOk(ctx, 5 * Ia + k * Pa);
          defs.push({
            id: 'sem-contratar', nome: cobre ? '5x2 com o quadro atual, sem contratar' : livre ? '5x2 com o quadro atual e menos gente em alguns dias' : '5x2 com o quadro atual, sem contratar',
            resumo: 'As mesmas ' + (Ia + Pa) + ' pessoas passam para 5x2. ' + (cobre ? 'Cobre a necessidade nas semanas normais' + (semRes ? ', mas não as férias.' : '.')
              : livre ? 'Para cumprir a Emenda Constitucional 141 (Fim da 6x1) sem contratar, o atendimento passa de ' + nec + ' para ' + ofer + ' presenças por semana, com menos gente nos dias de menor movimento.'
                : 'Atende à Emenda Constitucional 141 (Fim da 6x1), mas abre lacunas na cobertura.'),
            jornada: textoHorarioCenario(ctx, e8), grupos: gruposSemanais(ctx, eqS, hc8), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario), horasSemana: horasDe(eqS, e8), horario: h8,
            semFerias: semRes, rearranjo: livre && !cobre,
            ponderacoes: [cobre ? null : livre ? 'Rearranjo do funcionamento: serve se a operação comporta menos pessoas nesses dias, por exemplo com atendimento reduzido, fila maior ou tarefas remanejadas.'
              : 'Só faz sentido se a necessidade informada puder ser reduzida, por exemplo com mudança no horário de atendimento.',
              !cobre && livre && !ctx.menosGente && !ctx.funcionamento ? 'Confirme no passo 1 se a empresa aceita menos gente nos dias de menor movimento.' : null,
              semRes ? 'Sem reserva para as férias: em cada período de férias, o turno fica abaixo da necessidade.' : null, textoMudanca(h8), avisoFixo(h8)],
            semanasGrade: 3,
          });
        }
      }

      // Rearranjo do funcionamento: deixar de abrir no dia (ou nos dois dias) de menor movimento, para atender os demais
      // com o quadro atual em 5x2, sem contratar. Só quando o funcionamento não foi marcado como fixo.
      if (ctx.funcionamento !== 'fixo' && eqR && Ia > 0 && Ia < eqR.I && ops.length >= 6) {
        // só dias de movimento até a média dos dias de operação: fechar o dia de pico não é rearranjo razoável
        const perda = (C) => C.reduce((s, d) => s + dem[d] * e8[d].trab, 0);
        const media = ctx.somaDem / ops.length;
        const mPrio = ctx.prio ? ops.reduce((s, d) => s + ctx.prio[d], 0) / ops.length : null;
        const baixos = ops.filter((d) => dem[d] <= media && (!ctx.prio || ctx.prio[d] <= mPrio + 1e-9));
        const somaPrio = (C) => (ctx.prio ? C.reduce((s, d) => s + ctx.prio[d], 0) : 0);
        const cands = baixos.map((d) => [d]);
        for (let i = 0; i < baixos.length; i++) for (let j = i + 1; j < baixos.length; j++) cands.push([baixos[i], baixos[j]]);
        // sem o movimento por dia, no comércio o sábado é o último a fechar (costuma ser o dia de maior movimento)
        const ordemFecha = ctx.comercio ? [6, 0, 1, 2, 3, 4, 5] : PREF_FOLGA;
        cands.sort((x, y) => x.length - y.length || perda(x) - perda(y) || somaPrio(x) - somaPrio(y) || ordemFecha.indexOf(x[0]) - ordemFecha.indexOf(y[0]));
        let achou = null;
        for (const C of cands) {
          const d2 = dem.map((x, d) => (C.indexOf(d) >= 0 ? 0 : x));
          if (!capacidadeOk(ctx, 5 * Ia + k * Pa, d2.reduce((s, x) => s + x, 0))) continue;
          const e = compor(d2, { pref: ctx.pref, prefP: ctx.prefP, w: 5, k: k, P: Pa, I: Ia, domingoComercio: d2[6] > 0 ? (ctx.art386 ? 2 : ctx.comercio ? 3 : 0) : 0, rodizio: true });
          if (e) { achou = { C: C.slice().sort((a, b) => a - b), dem: d2, eq: e }; break; }
        }
        if (achou) {
          const C = achou.C, eF = e8.map((s, d) => (C.indexOf(d) >= 0 ? null : s));
          const hF = infoHorario(ctx, eF, null);
          const deixa = C.reduce((s, d) => s + dem[d], 0);
          defs.push({
            id: 'fechar-dias', nome: '5x2 com o quadro atual, sem abrir ' + aosDias(C),
            resumo: 'Para atender os demais dias com as mesmas ' + (Ia + Pa) + ' pessoas em 5x2, o turno deixa de funcionar ' + aosDias(C) + '. Nos dias em que abre, cobre a necessidade informada.',
            jornada: textoHorarioCenario(ctx, eF), grupos: gruposSemanais(ctx, achou.eq, horarioCenario('T', eF, null)), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario),
            horasSemana: horasDe(achou.eq, eF), horario: hF, demanda: achou.dem, fecha: C, rearranjo: true,
            ponderacoes: ['Rearranjo do funcionamento: deixam de ser atendidas ' + pl(deixa, 'presença', 'presenças') + ' por semana ' + aosDias(C) + (C.length === 1 ? ', o dia' : ', os dias') + ' com menos horas de trabalho a perder.',
              !ctx.funcionamento ? 'Confirme no passo 1 se o funcionamento deste turno pode mudar.' : null,
              textoMudanca(hF), descreverFolgas(achou.eq), achou.eq.P ? 'Dias dos parciais: ' + diasParciais(achou.eq) + '.' : null],
            semanasGrade: semanasGrade(achou.eq), cicloSemanas: achou.eq.rodizioI ? achou.eq.folgasI.length : null,
          });
        }
      }

      // 6x2 com regime de média (só com o mesmo horário em todos os dias: o ciclo de 8 dias não acompanha a semana)
      if (ops.length < 6) descartar('6x2', '6x2', 'O turno funciona em menos de seis dias por semana, e o ciclo de 8 dias do 6x2 passa por todos os dias.');
      else if (!ctx.uniforme) descartar('6x2', '6x2', 'O horário muda conforme o dia, e o ciclo de 8 dias do 6x2 não acompanha a semana.');
      if (ops.length >= 6 && ctx.uniforme) {
        const t62 = Math.min(dur.trabalho, ajustarJornada(dur.ini, dur.intervalo, 400));
        const tt = turnoMotor('T62', dur.ini, t62, dur.intervalo);
        const R = Math.max.apply(null, dem);
        let desl = null;
        for (let n = R; n <= 2 * R + 6 && !desl; n++) {
          if (!capacidadeOk(ctx, n * 6 * 7 / 8)) continue;
          const dd = Array.from({ length: n }, (_, j) => Math.floor(j * 8 / n));
          const ok = [0, 1, 2, 3, 4, 5, 6].every((wd) => {
            for (let s = 0; s < 8; s++) { let c = 0; for (const x of dd) if ((((s * 7 + wd + x) % 8) + 8) % 8 < 6) c++; if (c < dem[wd]) return false; }
            return true;
          });
          if (ok) desl = dd;
        }
        if (desl) {
          const ps = nomesPessoas(desl.length, ctx.integraisAtuais, 'Nova contratação', false);

      // Revezamento 4x3 e 6x1 com média mensal de repousos (D99): só com o mesmo horário todos os dias; semanas de 32 e 48 h

          ['4x3-6x1-ajuste', [4, 6, 4, 5], 'Revezamento 4x3 e 6x1 com uma semana de 5x2, com média de folgas no mês', 'Ciclo de quatro semanas (4x3, 6x1, 4x3 e 5x2): 9 folgas em 28 dias, o que cumpre a média também nos meses de 30 e 31 dias' + (ctx.liminar ? ', critério usado sem a liminar na ADI 8.041' : '') + '. Depende de norma coletiva (CF, art. 7º, § 2º).']]) {

            ponderacoes: [
              'Semanas de ' + fh(t46 * 4) + ' e de ' + fh(t46 * 6) + (N > 2 ? ', e uma de ' + fh(t46 * 5) : '') + ': ' + fh(t46 * media) + ' por semana em média. A norma coletiva precisa trazer também a compensação das horas entre as semanas (banco de horas, CLT, art. 59, § 2º), como na “semana espanhola”, que o TST admite por norma coletiva (OJ 323 da SDI-1).',
              ctx.liminar ? (N === 2 ? 'Entrega 8 folgas a cada 28 dias. Pela liminar na ADI 8.041, a norma coletiva define quando os repousos são gozados, sem trava no mês: o simulador confere 8 repousos em cada 28 dias seguidos e no máximo 6 dias seguidos de trabalho. Sem a liminar, os meses de 30 e 31 dias pediriam 9 pelo critério A.' : 'A semana de 5x2 a cada quatro dá 9 folgas em 28 dias, uma além do mínimo conferido com a liminar na ADI 8.041; serve de reserva se a liminar não for confirmada.')
                : N === 2 ? 'Entrega 8 folgas a cada 28 dias. Pelo critério de média adotado (A, a validar), os meses de 30 e 31 dias pedem 9; por isso o simulador testa também o ciclo com uma semana de 5x2.' : 'A semana de 5x2 a cada quatro garante 9 folgas a cada 28 dias.',
              'Por depender da média mensal de repousos, não se faz por acordo individual (CF, art. 7º, § 2º).', textoMudanca(h46), avisoFixo(h46), textoDomingo(ctx),
              ctx.exigeFerias ? 'Quadro dimensionado com 30 dias de férias por pessoa no ano.' : textoFeriasHoje(ctx)],

          });

      }

      // 12x36 estendendo o turno a um plantão de 12 h: só em operação de todos os dias, com o mesmo horário; depende de
      // norma coletiva (D39). Entra na comparação para mostrar o custo de trocar o turno por plantões (D86).
      if (ops.length < 7) descartar('12x36', '12x36', 'A 12x36 alterna dias e passa por todos os dias da semana; o turno funciona em ' + ops.length + ' dias.');
      else if (!ctx.uniforme) descartar('12x36', '12x36', 'O horário muda conforme o dia, e o plantão de 12 h teria de ser o mesmo todos os dias.');
      else {
        const R = Math.max.apply(null, dem);
        let N = 2 * R;
        while (!capacidadeOk(ctx, N * 3.5) && N < 4 * R + 6) N++;
        const ps = nomesPessoas(N, ctx.integraisAtuais, 'Nova contratação', false);
        const t12 = turnoMotor('T11', dur.ini, 660, 60, 'usufruido');
        const e12 = ctx.semana.map((x) => x && { ini: dur.ini, trab: 660, intervalo: 60 });
        const h12 = infoHorario(ctx, e12, null);
        const rf12 = { r: N - 2 * R, min: 2 * R };
        defs.push({
          id: '12x36-estendido', familia: '12x36', nome: '12x36 com plantão de 12 h',

          grupos: [{ modo: 'ciclo', turnos: [t12], ciclo: [1, 0], especial: '12x36', deslocamentos: ps.map((_, j) => j % 2), pessoas: ps }],

      if (!excede) {

        descartar('5x2-art7', '5x2 com jornada ampliada na transição', 'A jornada de hoje já cabe em 8 h por dia: não há o que ampliar até dezembro de 2027.');
      } else if (!defs.some((x) => x.id === 'escalonado')) descartar('escalonado', '5x2 em dois horários escalonados', 'O 4x3 no horário atual já mantém a janela de hoje com menos mudança.');
      if (eqR && !defs.some((x) => x.id === '5x2-parcial')) {

    } else {
      /* turno de cerca de 12 h: o revezamento 12x36, que depende de convenção ou acordo coletivo */
      const R = Math.max.apply(null, dem);
      let N = 2 * R;
      while (!capacidadeOk(ctx, N * 3.5)) N++;
      quadro.minimo = 2 * R; quadro.necessario = N; quadro.integrais = N; quadro.parciais = 0; quadro.ferias = N - 2 * R;
      const rf = { r: N - 2 * R, min: 2 * R };
      const ps = nomesPessoas(N, ctx.integraisAtuais, 'Nova contratação', false);

      const fimP = hm(dur.ini + dur.presenca);

      defs.push(Object.assign({}, comum, {

        jornada: hm(dur.ini) + ' às ' + fimP + ', 1 h de intervalo', grupos: [{ modo: 'ciclo', turnos: [tUsu], ciclo: [1, 0], especial: '12x36', deslocamentos: desl, pessoas: ps }],

      }));
      defs.push(Object.assign({}, comum, {

        horasSemana: horas(dur.presenca, N),

      }));
      defs.push(Object.assign({}, comum, {
        id: '12x36-indenizado', nome: '12x36 com intervalo indenizado',
        resumo: 'Mantém o plantão de 12 h corridas, com intervalo indenizado: média de 42 h semanais.',
        jornada: hm(dur.ini) + ' às ' + fimP, grupos: [{ modo: 'ciclo', turnos: [tInd], ciclo: [1, 0], especial: '12x36', deslocamentos: desl, pessoas: ps }],
        horasSemana: horas(dur.presenca, N),
        ponderacoes: [textoFerias(rf), 'Cabe na etapa de 42 h, mas ultrapassa o teto de 40 h a partir de 16/12/2027.', ponderNoite],
      }));
      {
        const op5 = { pref: ctx.pref, prefP: ctx.prefP, w: 5, k: 0, P: 0, domingoComercio: ctx.domingo, rodizio: true };
        const rf5 = comFerias(ctx, dem, comporMinimo(dem, op5), op5);
        if (rf5.eq) defs.push(defEscalonado(Object.assign({}, ctx, { parciaisAtuais: [] }), rf5.eq, rf5));
      }
      // Rearranjo do funcionamento: o plantão encolhe para até 8 h por dia, em 5x2, sem 12x36 e sem norma coletiva
      if (ctx.funcionamento !== 'fixo') {
        const e8 = limitarDia(ctx, 480);
        const op5 = { pref: ctx.pref, prefP: ctx.prefP, w: 5, k: 0, P: 0, domingoComercio: ctx.domingo, rodizio: true };
        const rfE = comFerias(ctx, dem, comporMinimo(dem, op5), op5);
        if (rfE.eq) {
          const h8 = infoHorario(ctx, e8, null);
          const ctxI = Object.assign({}, ctx, { parciaisAtuais: [] });
          defs.push({
            id: '5x2-encurtado', nome: '5x2 de ' + fh(e8[ops[0]].trab) + ', encurtando o plantão', rearranjo: true,
            resumo: 'Em vez da 12x36, o posto funciona em horário menor, com 5x2 de até 8 h e dois repousos por semana. Não depende de norma coletiva.',
            jornada: textoHorarioCenario(ctx, e8), grupos: gruposSemanais(ctxI, rfE.eq, horarioCenario('T', e8, null)), instrumentos: instrumentos([], ctx.neg, ctx.turnoUsuario),
            horasSemana: horasDe(rfE.eq, e8), reservaFerias: rfE.r, horario: h8,

              !ctx.funcionamento ? 'Confirme no passo 1 se o funcionamento deste turno pode mudar.' : null, textoFerias(rfE), descreverFolgas(rfE.eq)],
            semanasGrade: semanasGrade(rfE.eq), cicloSemanas: rfE.eq.rodizioI ? rfE.eq.folgasI.length : null,
          });
        }
      }
      if (Ia > 0 && Ia < N) {
        const pa = nomesPessoas(Ia, ctx.integraisAtuais, 'Nova contratação', false);
        defs.push(Object.assign({}, comum, {
          id: 'sem-contratar', nome: '12x36 com o quadro atual, sem contratar', reservaFerias: 0, semFerias: ctx.ferias && !capacidadeOk(ctx, Ia * 3.5),
          resumo: 'As mesmas ' + Ia + ' pessoas em 12x36' + (Ia >= 2 * R ? ': cobrem os postos nas semanas normais, mas não as férias.' : ': cobrem menos postos do que a necessidade informada.'),
          jornada: hm(dur.ini) + ' às ' + fimP, grupos: [{ modo: 'ciclo', turnos: [tUsu], ciclo: [1, 0], especial: '12x36', deslocamentos: pa.map((_, j) => j % 2), pessoas: pa }],
          horasSemana: horas(dur.presenca - 60, Ia), ponderacoes: [],
        }));
      }
    }

    const base = equipeHoje(ctx);
    if (ctx.longo) {
      descartar('4x3', '4x3', 'O plantão de hoje, de cerca de 12 h, passa do limite de 10 h por dia da compensação semanal.');
      descartar('6x2', '6x2', 'Seis plantões de cerca de 12 h passariam muito de 40 h na semana.');
    }
    const lista = defs.map((d) => avaliarCenario(ctx, d));
    lista.sort((a, b) => a.nota - b.nota);
    // Quando o funcionamento não precisa ser mantido, o melhor cenário que cumpre sem contratar fica entre as sugestões;
    // se o usuário disse que o horário pode mudar, ele vem primeiro (decisão D48).
    if (ctx.funcionamento !== 'fixo') {
      const semContratar = (c) => !c.contratarIntegrais && !c.contratarParciais && ['cumpre', 'condicao', 'rearranjo'].indexOf(c.situacao.codigo) >= 0;
      const melhor = lista.find(semContratar);
      if (melhor) {
        const pos = lista.indexOf(melhor), alvo = ctx.funcionamento === 'flexivel' ? 0 : 2;
        if (pos > alvo) { lista.splice(pos, 1); lista.splice(alvo, 0, melhor); }
      }
    }
    lista.forEach((c, i) => { c.ordem = i + 1; c.sugerido = i < 3; });
    return {
      lista: lista, descartes: fora, quadro: Object.assign(quadro, { feriasModo: ctx.feriasModo, feriasHoje: ctx.feriasHoje, exigeFerias: ctx.exigeFerias }), demanda: dem, duracao: dur, longo: ctx.longo, ferias: ctx.ferias,
      base: base, operacao: ops, semContratar: lista.some((c) => !c.contratarIntegrais && !c.contratarParciais && ['cumpre', 'condicao', 'rearranjo'].indexOf(c.situacao.codigo) >= 0),
      horarioAtual: textoJanela(ctx.atual, ctx.operacao, true), funcionamento: ctx.funcionamento, uniforme: ctx.uniforme,
      mudaHorario: lista.some((c) => c.mudaHorario),
    };
  }

  /**
   * Cenário montado pelo usuário.
   * op: { escala '5x2'|'4x3'|'12x36', integrais, parciais, diasParcial, folgas 'rodizio'|'fixas'|'escolher',
   *       dias: [{ parcial, folgas: [0..6] }] (com 'escolher'), rodiziar (com 'escolher'),
   *       horario: { e1: [7 × {inicio, fim, intervalo} | null], e2: idem ou null } (horário escolhido por dia, por etapa) }
   */
  function personalizado(turno, empresa, opcoes, op) {
    const ctx = contexto(turno, empresa, opcoes);
    if (ctx.erro) return { erro: ctx.erro };
    const dur = ctx.dur, dem = ctx.dem, ops = ctx.operacao;
    if (op.escala === '12x36') {
      const I = Math.max(0, Math.floor(op.integrais || 0));
      if (!I) return { erro: 'Informe ao menos uma pessoa.' };
      const iv = dur.intervalo || 60;
      const t = turnoMotor('T12', dur.ini, dur.presenca - iv, iv, ctx.indenizado ? 'indenizado' : 'usufruido');
      const ps = nomesPessoas(I, ctx.integraisAtuais, 'Nova contratação', false);
      return avaliarCenario(ctx, {
        id: 'personalizado', personalizado: true, nome: 'Meu cenário: 12x36', resumo: pl(I, 'pessoa', 'pessoas') + ' em 12x36, intervalo ' + (ctx.indenizado ? 'indenizado' : 'usufruído') + '.', jornada: hm(dur.ini) + ' às ' + t.fim,
        grupos: [{ modo: 'ciclo', turnos: [t], ciclo: [1, 0], especial: '12x36', deslocamentos: ps.map((_, j) => j % 2), pessoas: ps }],
        instrumentos: instrumentos(['12x36'], ctx.neg, { intervalo: iv }), negociar: ['x12'],
        horasSemana: Math.round((ctx.indenizado ? dur.presenca : dur.presenca - iv) * 3.5) * I, semanasGrade: 2,
        horario: { muda: false, atual: textoJanela(ctx.atual, ops), e1: textoJanela(ctx.atual, ops), e2: null },
        ponderacoes: [textoComporta(ctx, I * 3.5)],
      });
    }
    const w = op.escala === '4x3' ? 4 : 5;
    let e1, e2 = null;
    if (op.horario && Array.isArray(op.horario.e1)) {
      e1 = especsDe(op.horario.e1);
      if (e1.erro) return { erro: e1.erro };
      if (op.horario.e2) { e2 = especsDe(op.horario.e2); if (e2.erro) return { erro: e2.erro }; }
      if (!e1.some(Boolean)) return { erro: 'Informe o horário de ao menos um dia.' };
    } else if (w === 4) {
      const cabe = ops.every((d) => ctx.atual[d].trab <= 600);
      e1 = ctx.semana.map((s) => s && (cabe && s.trabalho > 480 ? { ini: s.ini, trab: s.trabalho, intervalo: s.intervalo } : { ini: s.ini, trab: 600, intervalo: s.intervalo || 60 }));
    } else e1 = limitarDia(ctx, 480);
    const hc = horarioCenario('T', e1, e2);
    const diasHor = [0, 1, 2, 3, 4, 5, 6].filter((d) => e1[d]);
    const pond = [];
    let eq;
    if (op.folgas === 'escolher' && Array.isArray(op.dias) && op.dias.length) {
      const di = op.dias.filter((x) => !x.parcial).map((x) => normalizarFolgas(x.folgas) || []);
      const dp = op.dias.filter((x) => x.parcial).map((x) => normalizarFolgas(x.folgas) || []);
      let folgasI = di, rodI = false;
      if (op.rodiziar && new Set(di.map((f) => f.join())).size > 1) {
        const r = ordenarRodizio(di, ctx.domingo);
        if (r) { folgasI = r; rodI = true; pond.push('Os padrões escolhidos giram entre as pessoas a cada semana; o ciclo se repete a cada ' + di.length + ' semanas.'); }
        else pond.push('Não foi possível girar os padrões escolhidos sem passar de 6 dias seguidos' + (ctx.domingo ? ' ou sem folga num domingo a cada ' + (ctx.domingo === 2 ? 'duas' : 'três') + ' semanas' : '') + '; as folgas ficaram fixas por pessoa.');
