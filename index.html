<script>window.DECISOES = [{"id":"D01","tema":"Contagem dos prazos da Emenda","padrao":"Conservadora (LC 95/1998, art. 8º, § 1º): 16/12/2026 e 16/12/2027","alternativa":"Código Civil, art. 132, § 3º: cada data um dia depois","origem":"prompt","situacao":"aguarda validação (pergunta 6g)","regras":["J3","R1","R13","R15"]},{"id":"D02","tema":"Semana de apuração que contém a data de mudança","padrao":"Limite mais rigoroso aplicado à semana inteira","alternativa":"Regra dia a dia, com teto semanal pro rata","origem":"prompt","situacao":"aguarda validação (pergunta 6f)","regras":["J3","J4","R1"]},{"id":"D03","tema":"R1 na política alternativa de transição","padrao":"Dois repousos exigidos a partir da primeira semana iniciada em 16/12/2026 ou depois","alternativa":"—","origem":"proposta","situacao":"pendente (discordância 6)","regras":["R1"]},{"id":"D04","tema":"Turno que cruza a meia-noite","padrao":"Pertence ao dia em que começa","alternativa":"Rateio minuto a minuto pelo dia civil","origem":"prompt","situacao":"aguarda validação (pergunta 6c)","regras":["J1","J3","R3"]},{"id":"D05","tema":"Contagem de repousos","padrao":"r = min(k, ⌊(G − 11 h) ÷ 24 h⌋) sobre folgas programadas (seção 4.4)","alternativa":"Calendário e blocos, exibidos quando divergem","origem":"prompt","situacao":"adotado","regras":["R1","R2"]},{"id":"D06","tema":"Folgas antes do primeiro turno da escala","padrao":"Contam como repouso, porque não há jornada anterior que limite o descanso","alternativa":"—","origem":"proposta","situacao":"pendente; necessária para o caso 11.7 (sequência A, B a partir de 04/01/2027)","regras":["R1"]},{"id":"D07","tema":"Alerta de repouso que depende de feriado, férias ou afastamento","padrao":"Recalcula com os turnos programados reinseridos nesses dias; alerta só se o repouso cair","alternativa":"Prompt: recortar o dia inteiro do feriado (gera alerta falso em feriado colado ao fim de semana)","origem":"proposta","situacao":"pendente (discordância 4)","regras":["R1"]},{"id":"D08","tema":"Semanas parciais (férias, afastamento, admissão, desligamento)","padrao":"Semana inteira fora de serviço: não se aplica. Semana parcial: os dias fora de serviço (férias, afastamento, antes da admissão, depois do desligamento) contam como dias sem trabalho; exigência de max(0, 2 − dias fora de serviço) repousos","alternativa":"—","origem":"proposta","situacao":"pendente (discordância 5); revista nesta etapa porque ⌈2 × d ÷ 7⌉ acusava falha falsa na semana em que as férias começam","regras":["R1"]},{"id":"D09","tema":"Hora noturna na prorrogação","padrao":"Hora reduzida estendida à prorrogação de jornada integralmente noturna, entendida como turno que cobre todo o período das 22h às 5h","alternativa":"Redução só entre 22h e 5h","origem":"prompt","situacao":"aguarda validação (pergunta 6b); o critério de jornada integralmente noturna é proposta e a jurisprudência sobre jornada predominantemente noturna está a conferir","regras":["J1","J3"]},{"id":"D10","tema":"Prorrogação na 12x36","padrao":"Considerada compensada: sem redução nem adicional depois das 5h","alternativa":"—","origem":"prompt","situacao":"adotado, com alerta sobre a OJ 388 (a conferir)","regras":["J6"]},{"id":"D11","tema":"Medida das regras de teto","padrao":"Horas computadas (hora noturna reduzida)","alternativa":"Horas de relógio","origem":"prompt","situacao":"aguarda validação (pergunta 6i) e calibração da 12x36 noturna (discordância 2)","regras":["J1","J3","J4","J6","R8","R14"]},{"id":"D12","tema":"Limite de 12 h da 12x36 (J2)","padrao":"Medido em horas de relógio, porque o art. 59-A fala em doze horas seguidas","alternativa":"—","origem":"proposta","situacao":"pendente","regras":["J2"]},{"id":"D13","tema":"Limiares de 4 h e 6 h do intervalo (R6)","padrao":"Horas de relógio de trabalho efetivo","alternativa":"Horas computadas (a avaliar)","origem":"proposta","situacao":"pendente","regras":["R6"]},{"id":"D14","tema":"Até 42 h em cinco dias na etapa de 42 h","padrao":"Depende de norma coletiva (EC, art. 7º)","alternativa":"Acordo individual de compensação","origem":"prompt","situacao":"aguarda validação (pergunta 6j)","regras":["J1"]},{"id":"D15","tema":"Compensação no mês (J4) e banco de horas (J5)","padrao":"Saldo das semanas de apuração atribuídas ao mês ou ao período (pela quinta-feira) contra a base semanal; base de 40 h quando já vigoram dois repousos e não há norma do art. 7º nem regime do § 2º; semana parcial entra só com eventual excesso; feriado não trabalhado reduz a base da semana em um quinto e não gera crédito","alternativa":"Limite da seção 4.6 (teto ÷ 7 por dia do mês), exibido como referência","origem":"proposta","situacao":"pendente (discordância 3); revista nesta etapa porque o limite diário da seção 4.6 acusa excesso falso em meses com 23 dias úteis","regras":["J4","J5"]},{"id":"D16","tema":"Critério da média mensal do § 2º","padrao":"Critério A: ⌈dias ÷ 7 × 2⌉","alternativa":"Critérios B e C, sempre exibidos","origem":"prompt","situacao":"aguarda validação (pergunta 6a)","regras":["R2"]},{"id":"D17","tema":"Meses parciais no § 2º","padrao":"Forma proporcional de cada critério (seção 4.7)","alternativa":"—","origem":"prompt","situacao":"aguarda validação (pergunta 6h)","regras":["R2"]},{"id":"D18","tema":"Art. 9º","padrao":"Leitura literal: o inciso XV vale desde 16/12/2026","alternativa":"Dois repousos também diferidos até o aditamento","origem":"prompt","situacao":"aguarda validação (pergunta 6e)","regras":["R13","R1"]},{"id":"D19","tema":"Art. 8º","padrao":"Remuneração vigente no 1º dia do mês contra 2,5 × teto do RGPS do ano; controle mantido por liberalidade ou norma coletiva afasta o enquadramento; teto do ano não informado não enquadra; R5, R6 e R8 informativos","alternativa":"—","origem":"proposta","situacao":"pendente (discordância 9 e pergunta 6d)","regras":["R10"]},{"id":"D20","tema":"Instrumentos coletivos anteriores à Emenda","padrao":"Sem marca de compatibilidade, deixam de valer a partir de 16/12/2026; acordos individuais não são alcançados pelo art. 3º","alternativa":"—","origem":"proposta","situacao":"pendente (discordância 10)","regras":["R15","R2","J1","R6"]},{"id":"D21","tema":"Significado de \"cumpre com condição\"","padrao":"A escala depende do instrumento indicado; a marca \"atendida\" diz se ele está cadastrado, vigente e compatível","alternativa":"—","origem":"proposta","situacao":"pendente","regras":["J1","J2","J3","J4","R6","R7","R8"]},{"id":"D22","tema":"Turnos sobrepostos do mesmo empregado","padrao":"Cada turno conta as próprias horas e a sobreposição é sinalizada em R5 como erro de cadastro","alternativa":"—","origem":"proposta","situacao":"pendente","regras":["R5"]},{"id":"D23","tema":"Feriado em dia de trabalho","padrao":"Não trabalhado, salvo escala marcada para trabalhar em feriados ou exceção do dia; a 12x36 trabalha por padrão","alternativa":"—","origem":"proposta","situacao":"pendente","regras":["R7"]},{"id":"D24","tema":"Folga compensatória de feriado trabalhado (R7)","padrao":"Aceita se registrada entre 6 dias antes e 13 dias depois do feriado","alternativa":"—","origem":"proposta","situacao":"pendente; a lei não fixa prazo e a janela foi escolhida por mim","regras":["R7"]},{"id":"D25","tema":"Sequência de dias de trabalho (R3)","padrao":"Qualquer dia sem início de turno interrompe a sequência","alternativa":"—","origem":"proposta","situacao":"pendente","regras":["R3"]},{"id":"D26","tema":"Detecção de turno ininterrupto de revezamento (R8)","padrao":"No mês, horários de início que diferem 4 h ou mais e algum turno com minutos entre 22h e 5h","alternativa":"—","origem":"proposta","situacao":"pendente","regras":["R8"]},{"id":"D27","tema":"Intervalo intrajornada (R6)","padrao":"30 a 59 min depende de norma coletiva (art. 611-A, III) ou autorização do art. 71, § 3º; abaixo de 30 min não cumpre; acima de 2 h depende de acordo escrito ou norma coletiva; fracionado depende de norma coletiva (art. 71, § 5º); indenizado só na 12x36; alerta para intervalo na primeira ou na última hora","alternativa":"—","origem":"pedido","situacao":"implementado conforme pedido de 26/10/2026; detalhes pendentes de validação","regras":["R6"]},{"id":"D28","tema":"Início de férias (F1)","padrao":"Não cumpre se um dos dois dias seguintes for feriado ou folga da escala","alternativa":"—","origem":"proposta","situacao":"pendente (discordância 5)","regras":["F1"]},{"id":"D29","tema":"Escalas combinadas e trocas no mês","padrao":"Toda escala é um padrão cíclico de N dias com âncora; atribuições por período com qualquer data de início; modelos semanais ancorados na segunda-feira","alternativa":"—","origem":"pedido","situacao":"implementado","regras":["R1","R3","R5"]},{"id":"D30","tema":"Divergência no caso 11.1 (semana de 27/12/2027)","padrao":"O motor apura 4 h de excedente na semana de 27/12/2027, porque o teto já é 40 h","alternativa":"—","origem":"prompt","situacao":"resolvido: esperado do caso 11.1 corrigido para 4 h por decisão do usuário em 26/10/2026","regras":["J3"]},{"id":"D31","tema":"Desempenho","padrao":"Avaliação padrão a cada alteração; leituras alternativas calculadas em segundo plano no navegador","alternativa":"—","origem":"proposta","situacao":"meta de 2 s a conferir no navegador num notebook comum","regras":[]},{"id":"D32","tema":"12x36 com troca de escala no mês da transição","padrao":"Na regra J6, a média de cada ciclo de 12x36 é comparada ao teto das semanas em que aquela escala é usada; antes, era comparada a todas as semanas do mês","alternativa":"—","origem":"proposta","situacao":"corrigido em 26/10/2026 (motor 0.1.1), com o caso N21; os 51 testes anteriores continuam passando sem alteração de esperados","regras":["J6"]},{"id":"D33","tema":"Quadro mínimo e distribuição de folgas nos cenários","padrao":"Quadro = maior necessidade diária ou soma da semana dividida pelos dias de trabalho por pessoa, o que for maior; folgas nos dias com mais sobra de pessoas; rodízio semanal em que a primeira folga de uma semana não vem depois da última folga da anterior (no máximo 6 dias seguidos)","alternativa":"Folgas fixas por pessoa, oferecidas como cenário separado fora do comércio","origem":"proposta","situacao":"a validar","regras":["R1","R3"]},{"id":"D34","tema":"Comércio com operação aos domingos","padrao":"Toda pessoa que trabalha aos domingos entra em rodízio com folga em ao menos um domingo a cada três semanas (Lei 10.101/2000, art. 6º, parágrafo único); por isso o cenário de folgas fixas não é oferecido nesse caso","alternativa":"—","origem":"proposta","situacao":"a validar; norma coletiva ou lei municipal podem prever regra própria","regras":["R4"]},{"id":"D35","tema":"Tempo parcial nos cenários","padrao":"Até 30 h semanais sem horas extras (CLT, art. 58-A), medidas em horas computadas (no turno noturno, a hora reduzida conta); dias por semana = 30 h divididas pela jornada computada, até 5; os parciais ficam nos dias de maior necessidade; o cenário só aparece quando o turno precisa contratar e não substitui ninguém do quadro atual","alternativa":"Modalidade de até 26 h com até 6 h extras, não modelada","origem":"proposta","situacao":"a validar","regras":["R14"]},{"id":"D36","tema":"Férias no dimensionamento","padrao":"Com a premissa ligada (padrão da tela), cada cenário recebe gente suficiente para que a capacidade semanal da equipe, descontados 30 dias de férias por pessoa no ano, cubra a necessidade: capacidade × 335 ≥ necessidade × 365. Substitui o cenário separado de reserva e a aproximação de 22 dias úteis","alternativa":"Premissa desligada: quadro mínimo, sem cobertura de férias","origem":"pedido","situacao":"pedido do usuário em 27/10/2026","regras":[]},{"id":"D37","tema":"Ordem dos cenários sugeridos","padrao":"Primeiro a situação jurídica (cumpre; com acordo individual; depende de negociação coletiva; não cobre a operação; cumpre só até 15/12/2027; não cumpre), depois as horas contratadas por semana e o número de contratações; os três primeiros são os sugeridos","alternativa":"O usuário pode escolher qualquer cenário ou montar o seu","origem":"pedido","situacao":"pedido do usuário em 26/10/2026 (ao menos 3 sugestões)","regras":[]},{"id":"D38","tema":"Feriados","padrao":"Os cenários tratam feriados como dias normais de trabalho e exibem aviso sobre os requisitos do trabalho em feriado: autorização (no comércio, convenção coletiva e legislação municipal, Lei 10.101/2000, art. 6º-A; nas demais atividades, conforme o caso, acordo ou convenção coletiva) e contrapartida (folga compensatória ou pagamento em dobro, Lei 605/1949, art. 9º; Súmula 146 do TST)","alternativa":"Feriados avaliados dia a dia pelo motor (R7), como no calendário por empregado","origem":"pedido","situacao":"pedido do usuário em 27/10/2026","regras":["R7"]},{"id":"D39","tema":"12x36 só com norma coletiva","padrao":"O planejador só aceita a 12x36 com convenção ou acordo coletivo marcado; sem isso, os cenários de 12x36 e o diagnóstico de quem já está em 12x36 aparecem como dependentes de negociação. O acordo individual escrito, embora previsto no art. 59-A da CLT, não assegura a validade da escala. O motor continua reconhecendo o acordo individual pela letra da lei; a exigência fica no planejador","alternativa":"Aceitar acordo individual escrito (letra do art. 59-A)","origem":"pedido","situacao":"pedido do usuário em 27/10/2026","regras":["J2","J6"]},{"id":"D40","tema":"Dias de folga escolhidos pelo usuário","padrao":"No cadastro, cada empregado em escala semanal pode ter os dias de folga marcados; o diagnóstico usa esses dias e distribui conforme a necessidade só as folgas não informadas. No cenário montado, os dias de folga podem ser escolhidos pessoa a pessoa, fixos ou girando entre as pessoas a cada semana; se o giro passar de 6 dias seguidos (ou, no comércio, de três semanas sem domingo), as folgas ficam fixas e o cenário avisa","alternativa":"—","origem":"pedido","situacao":"pedido do usuário em 27/10/2026","regras":["R1","R3","R4"]},{"id":"D41","tema":"12x36 noturna e teto de 40 h","padrao":"Com a leitura padrão (horas computadas), o plantão de 19h às 7h com 1 h usufruída (das 0h30 à 1h30) tem 11 h de relógio e 11h51min26s computadas pela hora reduzida sobre as 6 h trabalhadas entre 22h e 5h; a média do ciclo é de 41h30, acima do teto de 40 h a partir de 16/12/2027. Pela leitura alternativa (horas de relógio), a média é de 38h30","alternativa":"Horas de relógio nas regras de teto","origem":"derivado","situacao":"a validar: leitura com impacto relevante em vigilância, portaria e saúde","regras":["J6"]},{"id":"D42","tema":"Horário de funcionamento","padrao":"Cada turno pode ter horário por dia da semana. Cenários que alteram entrada ou saída em algum dia de operação são marcados como mudança de horário; se o turno foi marcado como de horário fixo, ficam abaixo dos que mantêm o horário (4x3 no horário atual, quando cada dia cabe em 10 h e a semana em 40 h; ou duas equipes de até 8 h escalonadas). Sem resposta, o simulador pergunta","alternativa":"—","origem":"pedido","situacao":"pedido do usuário em 27/10/2026","regras":["J1","J3"]},{"id":"D43","tema":"Semana de 42 h com o último dia mais curto","padrao":"Quando todos trabalham os mesmos cinco dias e a jornada atual passa de 40 h: até 8h30 nos quatro primeiros dias e o restante até 42 h no último, até 12/12/2027; depois, até 8 h por dia. Pela leitura adotada (D14), depende de convenção ou acordo coletivo do art. 7º; pela alternativa, de acordo individual de compensação","alternativa":"Acordo individual escrito de compensação (leitura alternativa do art. 7º)","origem":"pedido","situacao":"a validar: o exemplo do usuário (seg a qui 8h às 17h30, sex 8h às 17h) depende da norma coletiva pela leitura adotada","regras":["J1","J4"]},{"id":"D44","tema":"Cenário montado com horário por dia","padrao":"Dias acima de 8 h em semana de até 40 h: acordo individual de compensação, registrado só a partir da etapa em que for necessário; semana acima de 40 h com dias acima de 8 h (etapa de 42 h): norma coletiva do art. 7º, sem a qual o excedente é hora extra","alternativa":"—","origem":"proposta","situacao":"a validar","regras":["J1","J4"]},{"id":"D45","tema":"Descrição da operação em texto","padrao":"O texto é enviado ao Claude na conta de quem usa a página e volta em formato fixo; a página confere cada campo, deixa em branco o que não veio, lista as interpretações e o que faltou e só usa os dados após confirmação. Intervalo não informado vira 60 min e escala não informada vira 6x1, ambos sinalizados para conferência","alternativa":"—","origem":"pedido","situacao":"retirado em 27/10/2026, a pedido do usuário, para não consumir uso do Claude; a página não declara mais esse recurso","regras":[]},{"id":"D46","tema":"Acordo individual × negociação coletiva","padrao":"Acordo individual escrito só para redistribuir horas dentro da mesma semana, mantidos dois repousos em cada semana (por exemplo, 4x3 de até 10 h ou dias acima de 8 h em semana de até 40 h). Arranjos que tenham como premissa a média mensal de dois repousos semanais (CF, art. 7º, § 2º) dependem de convenção ou acordo coletivo; o motor não aceita o regime de média, a ampliação do art. 7º, o turno ininterrupto de até 8 h, o banco anual nem as demais hipóteses reservadas à negociação coletiva quando cadastrados como acordo individual (motor 0.1.2, caso N22)","alternativa":"—","origem":"pedido","situacao":"leitura do usuário em 27/10/2026; a distribuição de 42 h em cinco dias segue a leitura D14 (norma coletiva do art. 7º)","regras":["R2","J1","J4","R8"]},{"id":"D47","tema":"Férias no dimensionamento","padrao":"Padrão: manter a cobertura de hoje. Se a equipe atual já comporta 30 dias de férias por pessoa no ano (capacidade × 335 ≥ necessidade × 365), os cenários mantêm essa folga; se não comporta, também não contratam por causa das férias, porque a lacuna não decorre da Emenda Constitucional 141 (Fim da 6x1). Opções: reservar sempre (comportamento anterior) ou não considerar. Dados salvos com a premissa ligada passam a manter a cobertura de hoje","alternativa":"Reservar gente para todas as férias em todo cenário","origem":"pedido","situacao":"adotado em 27/10/2026 a partir da observação do usuário de que os cenários sempre contratavam","regras":[]},{"id":"D48","tema":"Rearranjo do funcionamento sem contratar","padrao":"Quando o horário do turno não foi marcado como fixo: (a) deixar de abrir em um ou dois dias, só entre os dias com necessidade até a média da semana, escolhendo o menor número de dias e a menor perda de horas; (b) 5x2 com o quadro atual e menos gente nos dias de menor movimento; (c) no plantão de 12 h, 5x2 de até 8 h com horário encurtado. Situação: cumpre, com rearranjo. Se o horário pode mudar, o melhor cenário sem contratação vem em primeiro; sem resposta, fica entre as três sugestões. Com horário fixo, esses cenários não aparecem ou aparecem como lacuna","alternativa":"—","origem":"pedido","situacao":"a validar","regras":[]},{"id":"D49","tema":"Modelo de custo","padrao":"Salário mensal de tempo integral informado por turno; quem já está no quadro mantém o salário (Emenda Constitucional 141/2026 – Fim da 6x1, art. 2º); tempo parcial proporcional às horas computadas do tempo integral (CLT, art. 58-A, § 1º), sem redução para quem já está no quadro. Salário-hora = salário ÷ (horas semanais computadas × 5): 220 para 44 h, 210 para 42 h e 200 para 40 h (Súmula 431 do TST para 40 h; 42 h pela mesma fórmula, a conferir). 365 ÷ 12 ÷ 7 semanas por mês. Adicional noturno sobre as horas noturnas pagas como reduzidas, com o percentual informado (20% por padrão, CLT, art. 73). Encargos: percentual informado pelo usuário, sem valor padrão. Horas medidas em 04/01 a 28/02/2027 (hoje e etapa de 42 h) e em 13/12/2027 a 30/01/2028 (etapa de 40 h)","alternativa":"Divisor por outra fórmula ou pela norma coletiva","origem":"proposta","situacao":"a validar","regras":[]},{"id":"D50","tema":"Reflexo das horas extras habituais nos repousos","padrao":"Estimado pela razão entre dias de repouso e dias de trabalho da semana (2/5 na 5x2, 3/4 na 4x3), considerando os dois repousos semanais remunerados (CF, art. 7º, XV; Lei 605/1949, art. 7º; Súmula 172 do TST)","alternativa":"Só o repouso semanal de um dia, ou a conta mês a mês por dias úteis e repousos","origem":"proposta","situacao":"a validar: a incidência sobre o segundo repouso decorre da nova redação do inciso XV e ainda não tem jurisprudência","regras":[]},{"id":"D51","tema":"Horas extras em revezamento como alternativa","padrao":"Quando o cenário encurta o horário de hoje, as pessoas necessárias estendem a jornada em revezamento até a entrada ou a saída de hoje, só se a extensão for de até 2 h por dia (CLT, art. 59), a jornada total ficar em até 10 h e restarem 11 h até a jornada seguinte (art. 66). Não cobrem dia em que o turno deixa de abrir (seria trabalho em dia de repouso) nem jornadas que já chegam a 10 h, como a 12x36. Sem encurtamento, a perda de horas é repartida entre os dias de trabalho dos integrais, com o aviso de que horas extras não repõem a pessoa que falta num dia. A hora extra habitual integra a remuneração e sua supressão após um ano gera indenização (Súmula 291 do TST)","alternativa":"—","origem":"pedido","situacao":"a validar","regras":["J1","J2","R5"]},{"id":"D52","tema":"Custo de manter a escala de hoje","padrao":"Referência, não caminho de conformidade: cada repouso semanal que falta para chegar a dois é dia de repouso trabalhado pago em dobro (Súmula 146 do TST, por analogia, 2 × salário/30); as horas dos demais dias acima de 40 h são extras, com o adicional informado e reflexo nos repousos; encargos informados. Não inclui multas administrativas, dano moral coletivo nem custos de processo","alternativa":"Tratar todo o excedente como hora extra, sem dobra","origem":"pedido","situacao":"a validar (protótipo de 29/10/2026)","regras":["R1","J3"]},{"id":"D53","tema":"Calculadora de encargos por regime","padrao":"Lucro real ou presumido: 20% de contribuição patronal, RAT × FAP e terceiros conforme o FPAS (Lei 8.212/1991, art. 22), FGTS de 8% (Lei 8.036/1990, art. 15), provisões de 13º (1/12) e de férias com o terço (1/9), e os encargos sobre as provisões. Simples Nacional, Anexos I a III e V: só FGTS e provisões; Anexo IV: contribuição patronal e RAT à parte, sem terceiros. Só no perfil do escritório, com conferência pela contabilidade","alternativa":"Percentual informado diretamente","origem":"proposta","situacao":"a validar","regras":[]},{"id":"D54","tema":"Entrada por grupos","padrao":"Uma linha por grupo de pessoas com a mesma escala e o mesmo horário. A necessidade por dia passa a ser a cobertura de hoje (pessoas × dias de trabalho da escala, divididas pelos dias de funcionamento; a sobra vai para sábado, sexta e segunda), ajustável; grupos com o mesmo horário e dias formam um só turno; o intervalo é o mínimo do art. 71 da CLT pela duração da presença, salvo informação diferente no perfil do escritório; empregados com nomes genéricos e folgas distribuídas pelo planejador","alternativa":"Cadastro individual com folgas (simulador completo)","origem":"pedido","situacao":"protótipo para teste de uso; a cobertura presumida supõe que o quadro de hoje reflete a necessidade","regras":[]},{"id":"D55","tema":"Caminhos comparados","padrao":"Até quatro por grupo: sem contratar (menor perda de produção), sem contratar com horas extras em revezamento (só se as horas extras repõem toda a perda), mantendo a operação (sem perda, menor custo) e com norma coletiva (só se, na etapa de 40 h, for mais barato ou contratar menos que manter a operação, ou perder menos que o sem contratar). Sugerido: o sem contratar quando o horário pode mudar; senão, o de menor custo sem perda de produção, exceto o que depende de negociação. Produção perdida medida pelas horas que cobrem a necessidade","alternativa":"—","origem":"pedido","situacao":"protótipo para teste de uso","regras":[]},{"id":"D56","tema":"Entrada em quatro etapas, por função","padrao":"Empresa (setor com funções e horários sugeridos, dias e horário de funcionamento, se o funcionamento pode mudar, regime tributário), Equipe (uma ficha por função com escala, salário, dias e um ou mais turnos com pessoas), Movimento (opcional) e Custos (opcional). Funções diferentes não se juntam no cálculo, porque uma não cobre a necessidade da outra; os dias de funcionamento não se confundem com os dias de trabalho de cada pessoa","alternativa":"Cadastro individual (versão 1) ou pergunta única (protótipos)","origem":"pedido","situacao":"adotado em 05/11/2026 (meio-termo após o teste do simulador do Sebrae)","regras":[]},{"id":"D57","tema":"Faturamento por dia na escolha dos dias","padrao":"Opcional. Quando informado por dia e marcado para uso: as folgas desempatam pelos dias de menor faturamento, o tempo parcial vai para os de maior, os dias acima da média ficam protegidos quando o quadro não cobre tudo (cada dia fraco perde no máximo metade da necessidade) e, se for preciso deixar de abrir, fecha-se o de menor faturamento entre os que estão abaixo da média. A necessidade de cada turno continua sendo a cobertura de hoje; o faturamento é aproximação do movimento","alternativa":"Redistribuir a necessidade pelo faturamento","origem":"pedido","situacao":"adotado em 05/11/2026","regras":[]},{"id":"D58","tema":"Caminhos para os dias que ficam com menos gente","padrao":"A partir do 5x2 com o quadro de hoje: E, contrato intermitente em todos os setores (hora pelo salário-hora da função, 13º e férias com o terço proporcionais, repousos remunerados pela razão 2/5 da D50 e encargos sem as provisões; CLT, arts. 443, § 3º, e 452-A); F, diárias de freelancer só em varejo e bares e restaurantes, pelo valor informado, sem encargos, com o aviso de risco de vínculo quando a mesma pessoa vier toda semana (CLT, art. 3º)","alternativa":"Diárias em todos os setores ou em nenhum","origem":"pedido","situacao":"substituído pela D77 em 10/11/2026","regras":[]},{"id":"D59","tema":"Domingo em bares e restaurantes","padrao":"Aplica a regra do comércio de folga em um domingo a cada três semanas (Lei 10.101/2000, art. 6º, parágrafo único), leitura mais cautelosa; pode ser desligada nos ajustes avançados","alternativa":"Regime das atividades com autorização permanente para o trabalho aos domingos, sem a regra das três semanas","origem":"proposta","situacao":"a validar","regras":["R4"]},{"id":"D60","tema":"Encargos padrão","padrao":"Pelo regime informado: Simples (Anexos I a III e V) só FGTS e provisões; Anexo IV com contribuição patronal e RAT; lucro presumido ou real com contribuição patronal, RAT e terceiros. Sem RAT e terceiros informados, 2% de RAT com FAP 1 e 5,8% de terceiros; regime não informado é tratado como lucro presumido ou real (o mais caro)","alternativa":"Percentual único informado","origem":"proposta","situacao":"a validar","regras":[]},{"id":"D61","tema":"Desempates do caminho sem contratar","padrao":"Com a mesma perda de horas, prefere menos gente nos dias fracos a deixar de abrir um dia. Sem faturamento por dia, no comércio o sábado é o último dia a deixar de abrir; nas demais atividades, a ordem anterior (domingo, sábado, segunda…)","alternativa":"—","origem":"proposta","situacao":"adotado em 05/11/2026","regras":[]},{"id":"D62","tema":"Escala editada","padrao":"Nas escalas semanais, cada dia pode ser trocado entre trabalho e folga; o motor confere as semanas exibidas, sem repetição, com os instrumentos e a atividade do cenário, e aponta por pessoa os problemas e os dias com menos gente que a escala sugerida. Escalas em ciclo de plantões (12x36, 6x2) não são editáveis","alternativa":"—","origem":"proposta","situacao":"adotado em 05/11/2026","regras":[]},{"id":"D63","tema":"Escala personalizada de hoje","padrao":"Ciclo de 1 a 6 semanas informado dia a dia: folga, jornada do turno ou outra duração (com a entrada do turno e o intervalo mínimo do art. 71 para essa duração). Com revezamento, cada pessoa começa o ciclo numa semana diferente; sem ele, todos estão na mesma semana. A necessidade de cada dia é a presença média no ciclo; o horário de cada dia nos cenários é a jornada mais frequente desse dia","alternativa":"Lista fechada de escalas","origem":"pedido","situacao":"adotado em 05/11/2026","regras":[]},{"id":"D64","tema":"Calendário de 2027","padrao":"A escala de hoje e a do caminho escolhido avaliadas no motor de 01/01 a 31/12/2027. Vermelho: algum achado que não cumpre cobre o dia; âmbar: depende de norma ainda não firmada ou fica menos gente que a necessidade de hoje; verde: cumpre e cobre; cinza: ninguém escalado e sem necessidade (os problemas da semana aparecem na janela do dia). Feriados nacionais marcados e tratados como dias normais; a escala editada se repete a cada ciclo exibido","alternativa":"—","origem":"pedido","situacao":"adotado em 05/11/2026","regras":[]},{"id":"D65","tema":"Comparação dos caminhos","padrao":"Uma linha por caminho com o que a empresa faz em termos concretos (dias com menos gente, contratações, intermitentes, diárias), barra de custo mensal contra a folha de hoje, contratações, trabalho perdido e segurança jurídica; caminhos que não se aplicam aparecem com o motivo","alternativa":"Cartões","origem":"pedido","situacao":"adotado em 05/11/2026","regras":[]},{"id":"D66","tema":"Horário por dia","padrao":"Funcionamento da empresa com horário próprio em cada dia (o padrão vale para todos até ser alterado). Nas escalas semanais (6x1, 5x2, 4x3, tempo parcial), cada turno pode ter entrada e saída diferentes por dia, com o intervalo mínimo do art. 71 pela duração do dia; o diagnóstico e os cenários usam o horário de cada dia. O faturamento por dia aceita todos os dias, e a ficha da função avisa quando ela trabalha em dia fechado na empresa","alternativa":"Horário único","origem":"pedido","situacao":"adotado em 06/11/2026","regras":[]},{"id":"D67","tema":"Planilha de preenchimento rápido","padrao":"Modelo com as abas Instruções, Empresa, Funcionamento e Equipe (uma linha por turno), lido no navegador e convertido nas etapas do simulador, com resumo do que entrou, avisos do que não foi aproveitado e opção de desfazer. Fica de fora o que só a simulação completa capta: horário por dia nos turnos, escala personalizada, intervalo, 12x36 com intervalo pago, normas coletivas e ajustes do escritório; o aviso de precisão aparece junto ao botão","alternativa":"—","origem":"pedido","situacao":"substituído pela D78 em 10/11/2026","regras":[]},{"id":"D68","tema":"Downloads fora do claude.ai","padrao":"No claude.ai, o PDF, o Excel e o modelo de planilha saem pela capacidade de downloads, que só funciona para quem está conectado a uma conta do Claude; a página avisa os demais e aponta para os endereços públicos configurados (modelo e cópia hospedada). A mesma página, aberta fora do claude.ai (site do escritório ou arquivo no navegador), baixa os três arquivos direto, sem conta. O claude.ai não serve .xlsx como arquivo anexo à página","alternativa":"—","origem":"pedido","situacao":"adotado em 06/11/2026","regras":[]},{"id":"D69","tema":"Setores e cargos","padrao":"Doze setores com base no simulador Escala Sebrae (consultado em 10/11/2026), mais \"Outro setor\"; cada setor traz uma lista fechada de cargos com escala, duração e dias sugeridos, e a opção \"Outro cargo\" para digitar. Indústria, logística e agro ampliados para empresas médias e grandes (montador, operador de máquinas, inspetor de qualidade, técnicos de manutenção, separador, conferente, almoxarife e outros). As sugestões valem até a pessoa mexer na escala ou no horário da função. Cargos com regra própria trazem a nota: fisioterapeuta (Lei 8.856/1994), técnico em radiologia (Lei 7.394/1985), teleatendimento (NR-17, Anexo II; CLT, art. 227), professor (CLT, arts. 317 a 323), motorista profissional (Lei 13.103/2015), motociclista (CLT, art. 193, § 4º) e trabalho rural (Lei 5.889/1973). Atividade para o motor: comércio para varejo e alimentação (D59); os demais como serviços ou indústria, como antes","alternativa":"Lista anterior de oito setores","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D70","tema":"Salário por hora","padrao":"O salário de cada função pode ser informado por mês ou por hora. Por hora, o mensal é a hora × o divisor da jornada de hoje, horas semanais × 5 (220 para 44 h; 200 para 40 h), com as horas semanais medidas na escala informada (média dos turnos pelas pessoas); o divisor pode ser informado. O mensal assim obtido é o que se mantém depois da Emenda Constitucional 141 (Fim da 6x1), art. 2º (D49), e a hora sobe com a jornada menor. Na 12x36 a fórmula dá 192,5 com intervalo tirado e 210 com intervalo pago; há normas coletivas com 180 ou 210, por isso o aviso e o campo do divisor (a validar)","alternativa":"Divisor 180 ou 210 fixo na 12x36","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D71","tema":"Dados setoriais da tela inicial","padrao":"Só números com fonte conferida: proporção de vínculos CLT acima de 40 h por setor (DIEESE, Emprego em Pauta nº 32, maio/2026, Gráfico 2, RAIS 2024), 75% e 36,6 milhões no total, e as estimativas do MTE sobre a 6x1 (33,2% dos vínculos de 44 h, cerca de 15 milhões; alojamento 52%, alimentação 47,1%, comércio 42,2%), na forma divulgada pelo DIEESE. A projeção \"até +x% de pessoas\" é cálculo do simulador (proporção acima de 40 h × 10%, supondo 44 h), identificada como tal e tratada como teto. Não usamos os percentuais de expectativa de impacto que o Escala Sebrae atribui à Pesquisa Pulso, 12ª edição, porque não batem com o relatório público da pesquisa (27% no total)","alternativa":"Reproduzir os números do Escala Sebrae","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D72","tema":"Resultado em abas","padrao":"O resultado abre com o diagnóstico e a linha do tempo da escala de hoje em cada etapa (hoje, 16/12/2026 e 16/12/2027). Os caminhos viram abas (recomendado, sem contratar, horas extras, contratar e os que se aplicarem), com a folha de hoje ao lado da folha do caminho, contratações, horas de trabalho e segurança jurídica, e um parágrafo que compara os caminhos com os valores calculados. A tabela completa fica num bloco que se abre. A escala semanal mostra a transição (até 42 h) e a definitiva (40 h); só a definitiva é editável. Fora do claude.ai, a escala sugerida também sai em arquivo de agenda (.ics), com pessoas identificadas só por número","alternativa":"Tabela de caminhos como primeira leitura","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D73","tema":"Perfil único","padrao":"Sem a escolha entre empresa e escritório: um fluxo só, com os ajustes que eram do escritório (encargos item a item, adicionais, normas coletivas, férias no dimensionamento, domingo do comércio, intervalo e flexibilidade por função, caminho por função e detalhe jurídico) disponíveis a todos e recolhidos em blocos que se abrem","alternativa":"Dois perfis","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D74","tema":"Sem horário de funcionamento da empresa","padrao":"A etapa de funcionamento saiu. O que importa é a cobertura de cada função: cada uma tem os seus dias de trabalho (sugeridos pelo cargo ou pelo setor) e os seus turnos, e o resultado mostra, função por função, se o período fica coberto como hoje. Nome, regime tributário e a pergunta se a empresa aceita reorganizar para não contratar ficam na etapa do setor. Na planilha, a aba Funcionamento virou Faturamento (opcional); a aba antiga ainda é lida, só pelo faturamento","alternativa":"Funcionamento da empresa por dia (D66)","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D75","tema":"Início em branco","padrao":"A simulação começa sem setor e sem funções, sem exemplo pré-carregado; a equipe é montada cargo a cargo. A simulação salva no navegador aparece na tela inicial como \"Continuar simulação\", ao lado de \"Nova simulação\"","alternativa":"Loja de exemplo pré-carregada","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D76","tema":"Resultado no formato do Sebrae, com as horas perdidas","padrao":"Depois do diagnóstico e da linha do tempo, um bloco mostra quanto a equipe deixa de trabalhar por mês sem contratar e sem hora extra: pelo novo teto (42 h e 40 h, soma pessoa a pessoa das horas acima do teto, o mínimo) e pela escala que cumpre sem contratar (caminho \"manter a equipe\", que pode perder mais quando mantém o horário diário de hoje em cinco dias), e o custo de não mudar a escala. Os caminhos ficam em abas: manter a equipe (sem hora extra ou pagando hora extra), contratar +N (reposição integral), tempo parcial, freelancer, norma coletiva e o recomendado; cada aba compara a folha de hoje com a do caminho e diz as horas, as contratações e a segurança jurídica. Horas por mês: horas semanais × 365/12/7","alternativa":"Resultado em tabela de caminhos","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D77","tema":"Sem intermitente; tempo parcial e freelancer","padrao":"O contrato intermitente não é sugerido. O reforço em tempo parcial (CLT, art. 58-A: até 30 h por semana, salário proporcional, dois repousos) entra como caminho próprio (P) quando o melhor contratar é outro, e já aparece dentro do contratar quando ele é o mais barato. Diárias de freelancer só em varejo, alimentação e hospedagem e só quando o que falta cai em até dois dias por semana. Ressalva: o limite de dois dias por semana vem da lei do trabalho doméstico (LC 150/2015, art. 1º); para empresas, o critério é a não eventualidade (CLT, art. 3º), e a mesma pessoa toda semana, mesmo em um ou dois dias, pode ser reconhecida como empregada","alternativa":"Intermitente em todos os setores e diárias sem limite de dias (D58)","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D78","tema":"Entrada por planilha retirada","padrao":"A pedido, a equipe é montada só pelas etapas do simulador: o botão de importar, o modelo de planilha e o arquivo do modelo no pacote do site saem. A exportação em Excel do resultado continua","alternativa":"Planilha de preenchimento rápido (D67)","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026; substitui a D67"},{"id":"D79","tema":"Regime de média do § 2º no resumo e no calendário","padrao":"Com a norma coletiva de média de repousos cadastrada, a semana com um repouso só (R1) fica atendida pela norma quando os meses que ela toca, e que foram apurados, cumprem a média (R2 com a norma); a situação passa a cumpre com a norma coletiva. O calendário segue a mesma regra. Mês fora da janela apurada não conta contra","alternativa":"R1 como descumprimento mesmo com a média cumprida (comportamento anterior)","origem":"derivado","regras":["R1","R2"],"situacao":"adotado em 10/11/2026 (planejador; casos PL31 e PL32); o critério da média continua a validar (D16, pergunta 6a)"},{"id":"D80","tema":"Exercício: folgas pela média do mês","padrao":"Opcional, ligado na etapa da equipe e aberto numa seção própria do resultado, que não altera o resultado principal. Para cada função, fora 12x36 e tempo parcial: ciclos prontos 6-4-5-4 (9 repousos em 28 dias), 6 e 4 alternados (8 em 28) e 6x2 (só com os sete dias), ou ciclo montado dia a dia. Nos prontos, as folgas caem nos dias da função, espalhadas e de preferência emendadas, sem sete dias seguidos (também na volta do ciclo), com domingo de folga a cada duas semanas no comércio, até 8 h por dia e até 40 h por semana (6h40 na semana de seis dias). Conferido no motor com a norma de média cadastrada, nas duas etapas, pelo critério A; mostra horas por pessoa e da função, presença média por dia e a folha, que não muda. Aviso fixo: depende de convenção ou acordo coletivo (CF, art. 7º, § 2º; D46)","alternativa":"Só a opção avançada de média de repousos, que muda o resultado principal","origem":"pedido","regras":["R1","R2","R3","R4","J3"],"situacao":"adotado em 10/11/2026; em todos os ciclos testados, dezembro de 2026 (regra a partir de 16/12, mês parcial) fica abaixo do mínimo para parte da equipe: contagem do mês parcial a validar"},{"id":"D81","tema":"Distribuição da equipe nas 24 horas","padrao":"Barras empilhadas por hora, uma cor por função pela posição na equipe (da oitava em diante, Outras funções), na etapa da equipe e no resultado antes dos caminhos; no resultado, alterna com a escala do caminho escolhido (etapa de 40 h, editada se for o caso, mais as diárias), no mesmo eixo. Presença no local da entrada à saída, com o intervalo; folgas em rodízio pela média (dias por semana da escala ÷ dias marcados; 12x36, metade; 6x2, seis de oito; personalizada, média do ciclo); dia escolhido ou média dos dias de funcionamento; legenda, dica e tabela","alternativa":"—","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D82","tema":"Nome e salário de cada pessoa","padrao":"Opcionais, por turno, como no Escala Sebrae. Em branco, vale o salário do cargo; informado por hora, vale a hora × o divisor da função. O custo de hoje soma os salários; no cálculo, cada turno usa a média das suas pessoas (os custos são lineares no salário) e as contratações entram por essa média. Os nomes rotulam as escalas, o calendário, o PDF, o Excel (aba Equipe) e a agenda e ficam guardados só no navegador, com aviso de cuidado ao compartilhar (LGPD)","alternativa":"Um salário médio por função","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D83","tema":"Mulheres: folga num domingo a cada duas semanas (CLT, art. 386)","padrao":"Opcional: o usuário marca quem é mulher (nos textos, folga 1:1 aos domingos) na tabela de pessoas de cada função, com aviso. Para as marcadas, o motor confere o domingo de folga a cada duas semanas, também no comércio, no lugar das três semanas da Lei 10.101/2000, como entendem a SDI-1 (E-ED-RR-619-11.2017.5.12.0054) e a SDC (ROT-0001503-12.2024.5.21.0000) do TST; sem tese vinculante do STF. Havendo mulher no turno e trabalho aos domingos, o planejador monta os rodízios com domingo de folga a cada duas semanas para todos do turno, o que pode exigir mais contratações; rodízios separados por sexo não estão no simulador","alternativa":"Só apontar a falha, sem refazer as escalas; ou manter a regra de três semanas no comércio também para as mulheres (comportamento anterior do motor)","origem":"pedido","regras":["R4"],"situacao":"adotado em 10/11/2026"},{"id":"D84","tema":"Datas para iniciar férias","padrao":"No calendário de 2027, a vista Datas para iniciar férias mostra, por pessoa e pela escala exibida, os dias em que as férias podem começar: vedados os dois dias que antecedem feriado ou repouso (CLT, art. 134, § 3º), contando os dois repousos semanais, por cautela; repouso e feriado indicados como dias a evitar; sábado e domingo vedados só com a opção marcada (o PN 100 do TST foi cancelado em 30/06/2025). Feriados nacionais do motor mais os estaduais e municipais informados, com sugestões de Paixão, Corpus Christi, Carnaval e 9 de julho (SP). Resumo das regras de férias da CLT (arts. 134 a 145). O período concessivo não é calculado, por falta da data de admissão","alternativa":"Contar só um repouso semanal na vedação; vedar sempre sábado e domingo","origem":"pedido","regras":["F1"],"situacao":"adotado em 10/11/2026"},{"id":"D85","tema":"Nome da emenda nos textos","padrao":"Onde constava a sigla da emenda, o simulador passa a dizer Emenda Constitucional 141 (Fim da 6x1); dentro de parênteses, Emenda Constitucional 141 – Fim da 6x1. No rótulo do ícone do aplicativo, que só comporta nome curto, Fim da 6x1","alternativa":"Manter a sigla","origem":"pedido","regras":[],"situacao":"adotado em 10/11/2026"},{"id":"D86","tema":"Todas as escalas testadas e por que ficaram de fora","padrao":"Para cada turno, o planejador calcula 5x2 em rodízio e com folgas fixas, com tempo parcial, com o quadro de hoje (menos gente ou sem abrir dias), escalonado, com jornada ampliada na transição, 4x3, 6x2 e, agora também para turnos         <td><input type="number" id="${s0.id}-sp" ${a} data-sh="${s0.id}" data-f="pessoas" min="0" max="9999" inputmode="numeric" value="${esc(pessoasFn(f))}"${det ? ' disabled' : ''} aria-label="Pessoas em ${esc(nomeFn(f, i))}"></td>
        <td>${campoNum(f.id + '-ss', `${a} data-f="${hora ? 'salarioHora' : 'salario'}" aria-label="Salário em ${esc(nomeFn(f, i))}"`, hora ? f.salarioHora : f.salario, 'R$', hora ? '/h' : '', '0,00')}</td>
        <td><select id="${f.id}-se" ${a} data-escala-s="1" aria-label="Escala de hoje em ${esc(nomeFn(f, i))}"${det && f.escala === 'personalizada' ? ' disabled' : ''}>${(f.escala === 'personalizada' ? ESCALAS : ESC_S).map(([k, nm]) => `<option value="${k}"${f.escala === k ? ' selected' : ''}>${esc(nm)}</option>`).join('')}</select></td>
        <td><input type="time" id="${s0.id}-si" ${a} data-sh="${s0.id}" data-f="inicio" value="${esc(s0.inicio)}"${det ? ' disabled' : ''} aria-label="Entrada"></td>
        <td><input type="time" id="${s0.id}-sf" ${a} data-sh="${s0.id}" data-f="fim" value="${esc(s0.fim)}"${det ? ' disabled' : ''} aria-label="Saída"></td>
        <td class="suave">${esc(dTxt)}${nProp ? `<small>${plural(nProp, 'pessoa', 'pessoas')} com dias próprios</small>` : ''}${aceitaDiasPessoa(f) ? `<button class="btn peq texto" data-acao="sx-dias" ${a} id="sx-${f.id}" aria-expanded="${!!S.ui['sx-' + f.id]}">${S.ui['sx-' + f.id] ? 'Fechar' : 'Personalizar dias'}</button>` : ''}</td>
        <td><button class="btn peq texto" data-acao="rem-fn" ${a} id="rem-${f.id}" aria-label="Tirar ${esc(nomeFn(f, i))} da equipe">Tirar</button></td></tr>
        ${S.ui['sx-' + f.id] && aceitaDiasPessoa(f) ? `<tr class="sx-linha"><td colspan="8"><div class="sx-dias">
          <div class="campo"><span class="rot">Dias de trabalho do cargo</span><div class="dias" role="group" aria-label="Dias do cargo">${DIAS.map((d, k) => `<button type="button" class="dia" data-acao="fn-dia" ${a} data-d="${k}" id="${f.id}-sd${k}" aria-pressed="${!!ds[k]}" title="${LONGOS[k]}">${d}</button>`).join('')}</div>
            <small>Os dias em que o cargo funciona. Na ${esc(nomeEscala(f.escala))}, cada pessoa folga ${f.escala === '5x2' ? 'dois dias' : f.escala === '4x3' ? 'três dias' : 'um dia'} por semana, em rodízio, salvo se você marcar os dias dela abaixo.</small></div>
          ${vDiasPessoas(f, { solto: true })}</div></td></tr>` : ''}`;
    }).join('');
    return `<header class="cab-etapa"><span class="eyebrow">${rotEtapa(E.EQUIPE)} · modo simplificado</span><h1>Quem trabalha hoje</h1>
        <p class="lead">Adicione cada cargo com quantas pessoas e o salário. Na tabela, confira a escala e o horário de hoje. Os dias de trabalho seguem o padrão do cargo no setor.</p></header>
      <p class="aviso leve"><span>No modo simplificado, cada cargo tem um horário só e o mesmo salário para todos. Em “Personalizar dias”, você escolhe os dias de trabalho do cargo e, se quiser, os de cada pessoa. Turnos diferentes, horário por dia, nome e salário de cada pessoa e a folga 1:1 aos domingos para mulheres ficam no modo completo.</span></p>
      <div class="vivo" aria-live="polite"><div><span>Pessoas</span><b>${n}</b></div><div><span>Folha estimada hoje</span><b>${custos.length ? reais(soma(custos)) : '—'}</b></div><div><span>Cargos</span><b>${fs.length}</b></div><small>Salários com ${encargosPct().toLocaleString('pt-BR')}% de encargos e provisões.</small></div>
      <div class="add-fn" role="group" aria-label="Adicionar cargo à equipe"><span class="rot">Adicionar à equipe</span>
        <div class="add-linha">
          <label>Cargo<select id="novo-cargo" data-novo="cargo">${setor().cargos.map((c) => `<option value="${esc(c.nome)}"${nv.cargo === c.nome ? ' selected' : ''}>${esc(c.nome)}${usados.has(c.nome) ? ' (já na equipe)' : ''}</option>`).join('')}</select></label>
          <label>Pessoas<input type="number" id="novo-pessoas" data-novo="pessoas" min="1" max="9999" inputmode="numeric" value="${esc(nv.pessoas)}" placeholder="0"></label>
          <label>Salário por mês${campoNum('novo-salario', 'data-novo="salario"', nv.salario, 'R$', '', '0,00')}</label>
          <button class="btn prim" data-acao="add-fn" id="add-fn">Adicionar</button></div></div>
      ${fs.length ? `<div class="rolagem"><table class="tab simples-eq"><thead><tr><th>Cargo</th><th>Pessoas</th><th>Salário</th><th>Escala de hoje</th><th>Entrada</th><th>Saída</th><th>Dias</th><th></th></tr></thead><tbody>${linhas}</tbody></table></div>`
        : '<p class="vazio-equipe">Nenhum cargo na equipe ainda. Escolha o cargo acima, informe quantas pessoas e o salário e clique em Adicionar.</p>'}
      ${vDistribuicaoEquipe()}

  }
  function vEquipe() {
    if (simples()) return vEquipeSimples();
    const fs = S.op.funcoes;
    const n = soma(fs.map(pessoasFn));
    const custos = fs.map(custoHojeFn).filter((x) => x != null);
    const usados = new Set(fs.map((f) => f.nome));
    const nv = S.ui.novo || (S.ui.novo = { cargo: (setor().cargos.find((c) => !usados.has(c.nome)) || { nome: '' }).nome, pessoas: '', salario: '' });
    const usa = (e) => fs.some((f) => f.escala === e);
    const normas = [];
    if (usa('12x36')) normas.push(['x12', 'Há convenção ou acordo coletivo que autorize a 12x36?']);
    if (usa('6x2') && !advogado()) normas.push(['par2', 'Há norma coletiva com média de folgas no mês?']);
    return `<header class="cab-etapa"><span class="eyebrow">${rotEtapa(E.EQUIPE)}</span><h1>Quem trabalha, em que escala e em que horário</h1>
        <p class="lead">Monte a equipe por cargo: escolha o cargo, informe quantas pessoas e o salário e clique em Adicionar. Depois ajuste em cada ficha a escala, os dias e o horário como a equipe trabalha hoje, mesmo que já passem do novo limite.</p></header>

        <div><span>Funções</span><b>${fs.length}</b></div><small>Salários com ${encargosPct().toLocaleString('pt-BR')}% de encargos e provisões${num(S.op.custos.porPessoa) || num(S.op.custos.porDia) ? ' e os benefícios informados' : ''}. O adicional noturno entra no resultado.</small></div>
      <div class="add-fn" role="group" aria-label="Adicionar cargo à equipe"><span class="rot">Adicionar à equipe</span>
        <div class="add-linha">
          <label>Cargo<select id="novo-cargo" data-novo="cargo">${setor().cargos.map((c) => `<option value="${esc(c.nome)}"${nv.cargo === c.nome ? ' selected' : ''}>${esc(c.nome)}${usados.has(c.nome) ? ' (já na equipe)' : ''}</option>`).join('')}<option value=""${!nv.cargo ? ' selected' : ''}>Outro cargo (digitar)</option></select></label>

      ${normas.length ? `<div class="bloco">${normas.map(([k, t]) => `<div class="campo"><span class="rot">${t}</span>${chips(t, [['1', 'Sim'], ['0', 'Não ou não sei']], S.op.negociacao[k] ? '1' : '0', `data-acao="norma" data-k="${k}"`)}</div>`).join('')}</div>` : ''}

  /* ================================================================ etapa 3 — movimento */

  function receita() {
    const m = S.op.movimento;
    if (m.modo === 'dia') { const v = m.dia.map((x) => num(x) || 0); const s = soma(v); return s > 0 ? { mensal: s * SEM, dia: v } : null; }
    if (m.modo === 'mes' && num(m.mes) > 0) return { mensal: num(m.mes), dia: null };
    return null;
  }
  function vMovimento() {
    const m = S.op.movimento, trabalha = diasComTrabalho();

      <div class="bloco"><span class="rot">Como prefere informar?</span>
        ${chips('Forma', [['dia', 'Por dia da semana'], ['mes', 'Média mensal'], ['', 'Não informar']], m.modo || '', 'data-acao="mov-modo"')}</div>
      ${m.modo === 'dia' ? `<div class="bloco"><span class="rot">Faturamento médio de cada dia</span>
        <div class="fat-dias">${DIAS.map((d, k) => `<label for="mov-d${k}">${d}<input type="number" id="mov-d${k}" data-mov-dia="${k}" min="0" step="any" inputmode="decimal" value="${esc(m.dia[k])}" placeholder="${trabalha[k] ? 'R$' : 'fechado'}"></label>`).join('')}</div>

      ${m.modo === 'mes' ? `<div class="bloco"><label class="rot" for="mov-mes">Faturamento médio por mês</label>${campoNum('mov-mes', 'data-mov="mes"', m.mes, 'R$', '', '')}</div>` : ''}
      ${m.modo ? `<div class="bloco"><label class="rot" for="mov-margem">Margem de contribuição</label>${campoNum('mov-margem', 'data-mov="margem"', m.margem, '', '%', 'ex.: 30')}
        <small>Quanto sobra de cada R$ 100 vendidos depois dos custos que variam com a venda (mercadoria, impostos sobre a venda, comissões). Sem ela, o resultado mostra só o peso da equipe no faturamento.</small></div>
        <p class="aviso">Faturamento indica o movimento de forma aproximada; não mede quantas pessoas cada dia precisa. A necessidade de cada turno continua sendo a cobertura de hoje.</p>` : ''}
      ${vNavegar(E.EQUIPE, E.CUSTOS, 'Continuar: os custos →', `<button class="btn" data-acao="ir" data-etapa="${E.RES}" id="pular-mov"${equipeValida() ? '' : ' disabled'}>Ver o resultado</button>`)}`;
  }

  /* ================================================================ etapa 4 — custos */

  function vEncargos(enc) {
    const linhas = enc.itens.map(([n, v]) => `<tr><td>${esc(n)}</td><td class="n">${v.toLocaleString('pt-BR', { maximumFractionDigits: 2 })}%</td></tr>`).join('') +
      enc.provisoes.map(([n, v]) => `<tr><td>Provisão de ${esc(n.charAt(0).toLowerCase() + n.slice(1))}</td><td class="n">${v.toLocaleString('pt-BR', { maximumFractionDigits: 2 })}%</td></tr>`).join('') +

    return `<table class="tab"><tbody>${linhas}</tbody><tfoot><tr><td>Total sobre o salário</td><td class="n">${enc.total.toLocaleString('pt-BR', { maximumFractionDigits: 2 })}%</td></tr></tfoot></table>`;

  function vCustos() {

    const marca = (k, t) => `<label class="check"><input type="checkbox" id="neg-${k}" data-neg="${k}"${S.op.negociacao[k] ? ' checked' : ''}> <span>${t}</span></label>`;
    return `<header class="cab-etapa"><span class="eyebrow">Etapa 4 de 5 · opcional</span><h1>Custos além do salário</h1>

      <div class="bloco"><div class="campos">
        ${campo('porPessoa', 'Benefícios por pessoa', 'por mês: plano de saúde, cesta, seguro', 'R$', '')}
        ${campo('porDia', 'Benefícios por dia trabalhado', 'vale-transporte, vale-refeição', 'R$', '')}
        ${campo('contratacao', 'Custo de cada contratação', 'recrutamento, exames, uniforme, treinamento', 'R$', '')}
        ${freelancerOk() ? campo('diaria', 'Valor da diária de freelancer', 'para o caminho com diárias', 'R$', '') : ''}
        ${campo('valorHora', 'Valor de uma hora de trabalho perdida', 'opcional: põe em reais a produção que deixa de ser feita', 'R$', '')}
      </div></div>
      <div class="bloco"><span class="rot">Encargos e provisões sobre a folha</span>
        <div class="caixa-enc"><div class="total">${enc.pct.toLocaleString('pt-BR', { maximumFractionDigits: 2 })}%</div>
          <p>${enc.manual ? 'Percentual informado.' : esc(regNome) + (enc.naosei ? ' (regime não informado: usamos o mais caro)' : '') + '. ' + (enc.estimados.length ? 'RAT de 2% e terceiros de 5,8% são estimativas, que podem ser ajustadas nos ajustes avançados.' : '')}</p>
          ${S.ui.enc ? vEncargos(enc) : `<button class="btn peq texto" data-acao="ver-enc" id="ver-enc">Ver como chegamos neste percentual</button>`}</div></div>
      <details class="avancado" data-abre="avancado"${S.ui.avancado ? ' open' : ''}><summary>Ajustes avançados: encargos, adicionais, normas coletivas e premissas</summary>
        <div class="bloco"><span class="rot">Encargos e adicionais</span><div class="campos">
          ${S.op.empresa.regime !== 'simples' ? campo('rat', 'RAT (%)', '1, 2 ou 3, conforme o CNAE', '', '%') + campo('fap', 'FAP', '0,5 a 2; em branco, 1', '', '') : ''}
          ${!S.op.empresa.regime || S.op.empresa.regime === 'lucro' || S.op.empresa.regime === 'naosei' ? campo('terceiros', 'Terceiros (%)', 'conforme o FPAS', '', '%') : ''}
          ${campo('encargos', 'Ou informe o total (%)', 'substitui o cálculo acima', '', '%')}
          ${campo('he', 'Adicional de hora extra (%)', 'mínimo de 50%', '', '%')}
          ${campo('noturno', 'Adicional noturno (%)', 'mínimo de 20%', '', '%')}</div></div>
      <div class="bloco"><span class="rot">Normas coletivas e premissas</span><div class="pilha">
          ${marca('art7', 'Jornada diária ampliada até dez/2027 (Emenda Constitucional 141 – Fim da 6x1, art. 7º)')}${marca('par2', 'Média de repousos no mês (CF, art. 7º, § 2º)')}${marca('intervalo', 'Intervalo de 30 min (CLT, art. 611-A, III)')}${marca('x12', '12x36 por norma coletiva (CLT, art. 59-A)')}
          ${setor().atividade === 'comercio' ? `<label class="check"><input type="checkbox" id="prem-domingo" data-domingo="1"${comercioDomingo() ? ' checked' : ''}> <span>Folga em um domingo a cada três semanas (Lei 10.101/2000, art. 6º, parágrafo único)</span></label>` : ''}
          <div class="campo" style="max-width:360px"><label class="rot" for="prem-ferias">Férias no dimensionamento</label><select id="prem-ferias" data-premissa="ferias">${[['hoje', 'Manter a cobertura de hoje'], ['reserva', 'Reservar gente para todas as férias'], ['nao', 'Não considerar']].map(([k, n]) => `<option value="${k}"${S.op.ferias === k ? ' selected' : ''}>${n}</option>`).join('')}</select></div>
        </div></div></details>
      ${vNavegar(E.MOV, E.RES, 'Ver o resultado →')}`;
  }

  /* ================================================================ resultado */

  /** Aviso de precisão no resultado do modo simplificado (D88). */
  function vAvisoSimples() {
    if (!simples()) return '';
    return `<div class="aviso-simples"><p><b>Modo simplificado: resultado aproximado.</b> O simulador usou os dias de trabalho típicos de cada cargo no setor, um horário por cargo, o mesmo salário para todos do cargo e os encargos do regime tributário, sem benefícios, faturamento nem normas coletivas. Com os dados reais, os números podem mudar bastante. Para decidir, revise no modo completo: tudo o que você preencheu é aproveitado.</p>
      <button class="btn prim" data-acao="modo" data-v="completo" id="ir-completo-res">Passar para o modo completo</button></div>`;
  }
  function vResultado() {
    const ts = turnosCalc();
    garantir(ts);
    const opc = S.op.caminho || 'rec';
    const as = ts.map((t) => ({ t: t, a: analise(t) }));
    const calc = as.filter((x) => x.a.estado === 'calc').length;
    const erros = as.filter((x) => x.a.estado === 'erro');
    const prontos = as.filter((x) => x.a.estado === 'ok');
    const cab = `<header class="res-cab"><div class="cab-etapa"><span class="eyebrow">Resultado${S.op.empresa.nome ? ' · ' + esc(S.op.empresa.nome) : ''}</span><h1>O que muda com a Emenda Constitucional 141 (Fim da 6x1)</h1></div>
      <div class="acoes"><button class="btn" data-acao="ir" data-etapa="${E.EQUIPE}" id="editar-dados">Editar os dados</button>
        <button class="btn" data-acao="pdf" id="baixar-pdf"${S.downloads === null ? ' disabled title="Downloads indisponíveis nesta visualização"' : ''}>Baixar PDF</button>
        <button class="btn" data-acao="xlsx" id="baixar-xlsx"${S.downloads === null ? ' disabled title="Downloads indisponíveis nesta visualização"' : ''}>Baixar Excel</button>
        ${DENTRO_CLAUDE ? '' : '<button class="btn" data-acao="ics" id="baixar-ics" title="Arquivo para importar a escala no Google Agenda, Apple ou Outlook">Escala na agenda (.ics)</button>'}</div>
      ${S.downloads === null ? `<p class="nota" style="flex-basis:100%">Nesta página, o PDF e o Excel só podem ser baixados por quem está conectado a uma conta do Claude.${END.simulador ? ` Para baixar sem conta, use a versão do simulador que fica <a href="${esc(END.simulador)}" target="_blank" rel="noopener">na pasta do escritório</a>: baixe o arquivo simulador-ec141.html e abra no navegador.` : ''}</p>` : ''}</header>`;
    if (!ts.length) return cab + `<p class="aviso forte">Nenhuma função completa: informe horário e pessoas na etapa da equipe.</p>`;
    if (calc) return cab + faixaExemplo() + `<p class="carregando">Calculando ${ts.length - calc} de ${ts.length} turnos…</p>`;
    const avisoErro = erros.length ? `<p class="aviso forte">Não foi possível calcular ${erros.map((x) => esc(x.t.nome) + ': ' + esc(x.a.erro)).join('; ')}.</p>` : '';
    if (!prontos.length) return cab + avisoErro;
    return cab + faixaExemplo() + avisoErro + vAvisoSimples() + vVeredito(prontos, opc) + vLinhaRes(prontos) + vDistribuicao(prontos, opc) + vTamanho(ts, prontos) + vEscolha(ts, prontos, opc) + vPorFuncao(prontos, opc) + vTestadas(prontos, opc) + vEscala(prontos, opc) + (simples() ? '' : vExercicio()) + vCalendario(prontos, opc) + vReceita(prontos, opc) +
      `<section class="secao"><header><h2>Entenda o cenário do seu setor</h2></header>${vContextoSetor(S.op.empresa.setor)}</section>` + vContas() + vPremissas();
  }

  /* ---------------------------------------------------------------- linha do tempo, caminhos em abas e leitura dos números */

  /** Pessoas que não cumprem (ou dependem de norma coletiva) em cada etapa da Emenda Constitucional 141 (Fim da 6x1), com a escala de hoje. */
  function fases(prontos) {
    const r = { total: 0, e1: { fora: 0, pend: 0 }, e2: { fora: 0, pend: 0 } };
    for (const { t, a } of prontos) {
      r.total += t.pessoas;
      for (const e of ['e1', 'e2']) {
        const st = a.diag && a.diag.etapas && a.diag.etapas[e] ? a.diag.etapas[e].status : null;
        if (st === 'nao_cumpre') r[e].fora += t.pessoas; else if (st === 'pendente') r[e].pend += t.pessoas;
      }
    }
    return r;
  }
  /** Horas de trabalho da equipe por semana, hoje (minutos), pela entrada. */
  const horasEquipe = () => soma(S.op.funcoes.map((f) => (semanaFn(f) || 0) * pessoasFn(f)));
  /** Horas por semana (minutos) que passam do teto, somadas pessoa a pessoa: o que a equipe deixa de trabalhar só pelo novo limite. */
  function horasAcima(teto) {
    let t = 0;
    for (const f of S.op.funcoes) for (const s of f.turnos) { const m = medirTurno(f, s), p = Math.floor(num(s.pessoas) || 0); if (m && p) t += p * Math.max(0, m.semana - teto); }
    return t;
  }
  /** Horas extras do caminho B (minutos por semana na equipe) e as pessoas dos turnos em que ele se aplica. */
  function horasExtrasB(ts) {
    let min = 0, pessoas = 0;
    for (const t of ts) {
      const a = analise(t);
      if (a.estado !== 'ok') continue;
      const e = escolha(t, a, 'B');
      if (!e.x || e.fallback || e.x.id !== 'B' || !e.x.x.horasExtras) continue;
      min += e.x.x.horasExtras.minutos || 0; pessoas += t.pessoas;
    }

  const hMes = (minSemana) => porMes(minSemana).toLocaleString('pt-BR') + ' h por mês';
  function vLinhaRes(prontos) {
    const fz = fases(prontos), n = fz.total, h = horasEquipe();
    const chip = (x) => (x.fora ? pill('nok', x.fora === n ? 'Ninguém cumpre' : x.fora + ' de ' + n + ' não cumprem') : x.pend ? pill('pend', x.pend + ' dependem de norma coletiva') : pill('ok', 'Cumpre'));
    return `<section class="secao linha-res"><header><h2>A escala de hoje em cada etapa</h2>
        <p class="nota">Redução progressiva da Emenda Constitucional 141/2026 (Fim da 6x1): dois repousos semanais e teto de 42 h em 16/12/2026; teto de 40 h em 16/12/2027.</p></header>
      ${vMarcos([`<span class="pill neutro">${plural(n, 'pessoa', 'pessoas')} · ${h && n ? durTxt(h / n) + ' por semana em média' : ''}</span>`, chip(fz.e1), chip(fz.e2)])}</section>`;
  }
  /**
   * O tamanho do problema, como no Sebrae: quantas horas a equipe deixa de trabalhar por mês sem contratar, pelo novo
   * teto (o mínimo) e pela escala que cumpre sem contratar (caminho “manter a equipe”), e quanto custa não mudar nada.
   */
  function vTamanho(ts, prontos) {
    const hEq = horasEquipe(), a42 = horasAcima(2520), a40 = horasAcima(2400);
    const ta = totais(ts, 'A'), expo = prontos.reduce((s, { a }) => s + (!cumpreHoje(a) && a.manter && a.manter.total ? a.manter.total : 0), 0);
    const n44 = S.op.funcoes.reduce((s, f) => s + f.turnos.filter((x) => { const m = medirTurno(f, x); return m && Math.abs(m.semana - 2640) < 1; }).reduce((q, x) => q + (Math.floor(num(x.pessoas) || 0)), 0), 0);
    const pctH = (m) => (hEq ? ' (' + pct(m / hEq, m / hEq < 0.1 ? 1 : 0) + ' das horas de hoje)' : '');
    const linhaA = ta.aplica && ta.perda > TOL ? `<div class="tam"><span>Com a escala que cumpre sem contratar</span><b>− ${hMes(ta.perda)}</b><small>${horasTxt(ta.perda)} por semana${pctH(ta.perda)}: é o caminho “Manter a equipe”, sem hora extra${ta.perda > a40 + TOL ? '; passa do mínimo porque mantém o horário diário de hoje em cinco dias' : ''}.</small></div>` : '';
    return `<section class="secao tamanho"><header><h2>Quanto a equipe deixa de trabalhar sem contratar</h2>
        <p class="nota">Horas de trabalho da equipe hoje: ${horasTxt(hEq)} por semana, cerca de ${hMes(hEq)}. Sem contratar e sem horas extras, a Emenda Constitucional 141 (Fim da 6x1) tira da equipe:</p></header>
      <div class="tam-grade">
        <div class="tam"><span>A partir de 16/12/2026 · teto de 42 h</span><b>${a42 > TOL ? '− ' + hMes(a42) : 'nada'}</b><small>${a42 > TOL ? horasTxt(a42) + ' por semana' + pctH(a42) + ', só pelo novo teto' : 'ninguém passa de 42 h'}</small></div>
        <div class="tam"><span>A partir de 16/12/2027 · teto de 40 h</span><b>${a40 > TOL ? '− ' + hMes(a40) : 'nada'}</b><small>${a40 > TOL ? horasTxt(a40) + ' por semana' + pctH(a40) + ', só pelo novo teto: é o mínimo, se o horário de cada dia puder crescer' : 'ninguém passa de 40 h'}</small></div>
        ${linhaA}
        <div class="tam ${expo ? 'mau' : ''}"><span>Se a escala não mudar</span><b>${expo ? reais(expo) + ' por mês' : 'R$ 0'}</b><small>${expo ? 'de exposição estimada a partir de 16/12/2027, em repousos pagos em dobro e horas extras (a validar)' : 'sem exposição'}</small></div>
      </div>
      ${n44 ? `<p class="nota">Cada pessoa em 44 h perde 4 h por semana, cerca de 17 h por mês: são ${n44} ${n44 === 1 ? 'pessoa' : 'pessoas'} nessa situação.</p>` : ''}</section>`;
  }
  const deltaTxt = (d, h) => (Math.abs(d) < 0.5 ? 'igual a hoje' : (d > 0 ? '+ ' : '− ') + reais(d) + ' por mês (' + (d > 0 ? '+' : '−') + pct(h ? d / h : 0, h && Math.abs(d / h) < 0.01 ? 1 : 0) + ')');
  const motivoNaoAplica = (k) => (k === 'B' ? 'nenhuma função tem perda que horas extras reponham dentro dos limites (2 h por dia, 10 h de jornada, 11 h entre jornadas); hora extra não põe mais gente no dia, e trabalhar na folga quebraria os dois repousos'
    : k === 'D' ? 'nenhuma função fica mais barata nem contrata menos com norma coletiva'
      : k === 'F' ? 'em nenhuma função o que falta cabe em até dois dias por semana; diária toda semana em mais dias é emprego (CLT, art. 3º)'
        : k === 'P' ? 'o reforço em tempo parcial não traz caminho diferente do contratar'

  const NOME_CURTO = { rec: 'Recomendado', A: 'Manter a equipe', B: 'Manter a equipe', C: 'Contratar', P: 'Tempo parcial', D: 'Norma coletiva', F: 'Freelancer' };
  /** Caminhos em abas, como no Sebrae: a folha de hoje ao lado da folha do caminho, com as horas e as contratações. */
  function vEscolha(ts, prontos, opc) {
    const ops = OPCOES.filter(([k]) => k !== 'F' || freelancerOk()).map(([k, nome, desc]) => ({ k: k, nome: nome, desc: desc, tt: totais(ts, k) }));
    const ativos = ops.filter((o) => o.k === 'rec' || o.tt.aplica > 0), inativos = ops.filter((o) => ativos.indexOf(o) < 0 && o.k !== 'B');
    const T = {}; for (const o of ativos) T[o.k] = o.tt;
    const sel = ativos.find((o) => o.k === opc) || ativos[0];
    const tt = sel.tt, hoje = tt.hoje, d = tt.depois - tt.hoje;
    const fz = fases(prontos), hEq = horasEquipe(), heB = horasExtrasB(ts);
    const grupoA = sel.k === 'A' || sel.k === 'B';
    const seg = sel.k === 'rec' ? (tt.inseg === 'ok' ? ['ok', 'Cumpre'] : tt.inseg === 'nok' ? ['nok', 'Há risco em alguma função'] : ['pend', 'Algo depende de acordo']) : SEGURANCA[sel.k];
    // abas: “manter a equipe” junta o sem contratar com e sem hora extra
    const abasK = ativos.filter((o) => o.k !== 'B' || !T.A).map((o) => o.k);
    const rot = (k) => (k === 'C' && T.C ? 'Contratar +' + T.C.contr : k === 'P' && T.P ? 'Tempo parcial +' + T.P.contr : NOME_CURTO[k]);
    const sub = (k) => (k === 'A' || k === 'B' ? 'sem contratar' : k === 'C' ? 'reposição integral' : k === 'P' ? 'reforço nos picos' : k === 'F' ? 'diárias até 2 dias' : k === 'D' ? 'com o sindicato' : 'por função');
    const abas = abasK.map((k) => {
      const ativo = k === sel.k || (k === 'A' && grupoA);
      return `<button type="button" role="tab" class="aba-cam${ativo ? ' sel' : ''}" aria-selected="${ativo}" data-acao="caminho" data-v="${k}" id="cam-${k}">
        <b>${esc(rot(k))}${k === 'rec' ? ' <span class="selo ok">indicado</span>' : ''}</b><span>${esc(sub(k))}</span></button>`;
    }).join('');
    const subA = grupoA && T.A && T.B ? `<div class="segmento" role="group" aria-label="Como manter a equipe">${[['A', 'Absorvendo sem hora extra'], ['B', 'Pagando hora extra']].map(([k, n]) => `<button data-acao="caminho" data-v="${k}" id="sub-${k}" aria-pressed="${sel.k === k}">${n}</button>`).join('')}</div>` : '';
    let corpo = '';
    if (sel.k === 'B') {
      const porPessoa = heB.pessoas ? heB.min / heB.pessoas : 0;
      const lista = (xs) => juntar(xs.map((x) => x.toLowerCase())).replace(/; e /, ' e ');
      corpo = `<li><b>${Math.round(porPessoa / 60 * SEM).toLocaleString('pt-BR')} h extras por mês por pessoa</b> em ${esc(lista(heB.com))} (${hMes(heB.min)} na equipe), com as horas de hoje mantidas. Teto legal: 2 h extras por dia.</li>
        ${heB.sem.length ? `<li class="mau">Para ${esc(lista(heB.sem))}, hora extra não repõe o que falta: com dois repousos por semana falta gente nos dias, e não só horas (trabalhar na folga quebraria os repousos), ou as horas passam dos limites de 2 h extras por dia e 11 h entre jornadas. Nessas funções o valor acima usa o caminho indicado.</li>` : ''}
        <li>Horas extras habituais refletem nos repousos e no 13º e nas férias, e o custo varia mês a mês.</li>
        ${T.A ? `<li>Ou absorvendo sem hora extra: a folha fica em ${reais(T.A.depois)}, mas a equipe trabalha ${hMes(T.A.perda)} a menos.</li>` : ''}`;
    } else if (sel.k === 'A') {
      corpo = `<li>Horas de trabalho da equipe: <b>${horasTxt(hEq)} → ${horasTxt(Math.max(0, hEq - tt.perda))} por semana</b>${tt.perda > TOL ? ' (− ' + horasTxt(tt.perda) + ', ' + hMes(tt.perda) + ' a menos)' : ''}.</li>
        ${T.B ? `<li>Ou pagando hora extra: ${reais(T.B.depois)} (${esc(deltaTxt(T.B.depois - T.B.hoje, T.B.hoje))}), com cerca de ${Math.round((heB.pessoas ? heB.min / heB.pessoas : 0) / 60 * SEM)} h extras por mês por pessoa${heB.sem.length ? ', mas só resolve para ' + esc(juntar(heB.com.map((x) => x.toLowerCase())).replace(/; e /, ' e ')) : ''}.</li>` : ''}`;
    } else if (sel.k === 'C' || sel.k === 'P') {
      corpo = `<li><b>${plural(fz.total + tt.contr, 'pessoa', 'pessoas')}</b> na equipe, com ${plural(tt.contr, 'contratação', 'contratações')}; as mesmas horas de hoje, ${horasTxt(hEq)} por semana.</li>
        <li>Custo fixo e previsível, sem hora extra.${tt.unico > 0 ? ' Custo único de contratação: ' + reais(tt.unico) + '.' : ''}</li>`;
    } else if (sel.k === 'F') {
      const vd = num(S.op.custos.diaria);
      const base = !tt.semCusto ? tt.depois - (tt.diarias && vd ? tt.diarias * vd : 0) : T.A && !T.A.semCusto ? T.A.depois : null;
      corpo = `<li>${base != null ? 'Folha de ' + reais(base) + ' e c' : 'C'}erca de <b>${Math.round(tt.diarias)} diárias por mês</b>${vd ? ', ' + reais(tt.diarias * vd) + ' fora da folha' : ''}.</li>
        <li><label class="mini">Valor de cada diária ${campoNum('diaria-cam', 'data-custo="diaria"', S.op.custos.diaria, 'R$', '', '0,00')}</label></li>
        <li class="mau">Freelancer com trabalho habitual e subordinado é empregado (CLT, art. 3º). Use para picos de até dois dias por semana e alterne as pessoas; o limite de dois dias da lei do trabalho doméstico (LC 150/2015) não vale para empresas.</li>`;
    } else {

        <li>Horas de trabalho por semana: <b>${tt.perda > TOL ? horasTxt(Math.max(0, hEq - tt.perda)) + ' (− ' + horasTxt(tt.perda) + ')' : 'as de hoje'}</b></li>`;

    const titCaminho = sel.k === 'A' ? 'Mantendo a equipe, sem hora extra' : sel.k === 'B' ? 'Mantendo a equipe, pagando hora extra' : sel.k === 'C' ? 'Contratando +' + tt.contr : sel.k === 'P' ? 'Com reforço em tempo parcial' : sel.nome;

        <p class="nota">Custos mensais a partir de 16/12/2027, com encargos e benefícios. A escolha vale para o que vem abaixo: cada função, a escala e o calendário de 2027.</p></header>
      <div class="abas-cam" role="tablist" aria-label="Caminhos para cumprir">${abas}</div>
      ${subA}
      <div class="par-cam">
        <div class="cartao-cam hoje"><span class="eyebrow">Como sua folha está hoje</span>
          <b class="valor">${tt.semCusto ? '—' : reais(hoje)}</b><small>por mês</small>
          <ul class="fatos"><li>${plural(fz.total, 'pessoa', 'pessoas')} · ${hEq && fz.total ? 'jornada média de ' + durTxt(hEq / fz.total) + ' por semana · ' : ''}${horasTxt(hEq)} de equipe por semana (${hMes(hEq)})</li>
            ${fz.e1.fora ? `<li class="mau">${fz.e1.fora} de ${fz.total} não cumprem a partir de 16/12/2026</li>` : fz.e2.fora ? `<li class="mau">${fz.e2.fora} de ${fz.total} não cumprem a partir de 16/12/2027</li>` : '<li class="bom">A escala de hoje cumpre as duas etapas</li>'}
            <li>A Emenda Constitucional 141 (Fim da 6x1) exige dois repousos por semana: a nova escala tem cinco dias de trabalho ou um rodízio de folgas.</li></ul></div>

          <b class="valor">${tt.semCusto ? '—' : reais(tt.depois)}</b>${tt.semCusto ? '' : `<span class="delta">${esc(deltaTxt(d, hoje))}</span>`}${semCusto}
          <p class="frase-cam">${esc(fraseOpcao(ts, sel.k))}</p>
          <ul class="fatos">${corpo}<li>Segurança jurídica: ${pill(seg[0], seg[1])}</li></ul>${parcial}</div>

      <details class="comparar" data-abre="comparar"${S.ui.comparar ? ' open' : ''}><summary>Comparar todos os caminhos lado a lado</summary>${vCaminhos(ts, sel.k)}</details></section>`;

  /** “O que os números mostram”: a comparação dos caminhos em poucas frases, com os valores calculados. */
  function vNumeros(ts, ativos, prontos) {
    const T = {};

  }

  function vVeredito(prontos, opc) {
    let total = 0, fora = 0, e1 = false, expo = 0;
    for (const { t, a } of prontos) {
      total += t.pessoas;
      if (!cumpreHoje(a)) { fora += t.pessoas; if (a.veredito && a.veredito.codigo !== 'transitorio') e1 = true; if (a.manter && a.manter.total) expo += a.manter.total; }

    const delta = tt.depois - tt.hoje;
    const perda = ta.aplica ? ta.perda : horasAcima(2400);
    return `<section class="veredito" aria-live="polite"><span class="eyebrow">Diagnóstico</span><p class="frase">${frase}</p>
      <div class="kpis">
        <div><span>Folha hoje</span><b>${tt.semCusto ? '—' : reais(tt.hoje)}</b><small>${tt.semCusto ? 'informe os salários' : 'por mês, com encargos e benefícios'}</small></div>

  /** Frase concreta do que a empresa faz em cada caminho, a partir dos caminhos de cada turno. */

  /* ---------------------------------------------------------------- calendário de 2027 */
